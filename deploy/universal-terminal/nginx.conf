# The gateway container itself runs as explicit uid/gid 65534 and keeps all
# Linux capabilities dropped. Keep every writable nginx path on its tmpfs.
master_process off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;
    # Railway terminates TLS outside this gateway. Preserve the caller's origin
    # instead of redirecting to the internal http://host:8080 address.
    absolute_redirect off;

    location = / {
      return 308 /AI/;
    }

    location = /AI {
      return 308 /AI/;
    }

    location = /AI/ {
      root /opt/qikvrt/deploy/universal-terminal;
      try_files /mesh-index.html =404;
      add_header Cache-Control "no-store" always;
    }

    location = /qik-vrt/mesh/v1/ {
      root /opt/qikvrt/deploy/universal-terminal;
      try_files /mesh-index.html =404;
      add_header Cache-Control "no-store" always;
    }

    location = /qik-vrt/mesh/v1/healthz {
      alias /tmp/qikvrt-mesh-health.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
    }

    location = /qik-vrt/mesh/v1/topology {
      alias /tmp/qikvrt-mesh-health.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
    }

    location /qik-vrt/mesh/v1/terminal/ {
      add_header Cache-Control "no-cache" always;
      proxy_pass http://127.0.0.1:6080/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /qik-vrt/mesh/v1/effect-ack/ {
      proxy_pass http://127.0.0.1:8771/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-QIKVRT-Mesh-Path /qik-vrt/mesh/v1/;
      proxy_buffering off;
    }
  }
}
