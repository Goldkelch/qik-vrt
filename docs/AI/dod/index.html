<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QIK-VRT · D.o.D. Observatory</title>
<style>
:root{color-scheme:dark;--bg:#071019;--card:#0d1b28;--line:#1d3447;--fg:#eaf4ff;--muted:#8faabd;--ok:#3ee58f;--warn:#ffd166;--bad:#ff5c77;--info:#5bbcff;--fx:#c58cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -20%,#163b52 0,transparent 42%),var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:18px;min-height:100vh}header{display:flex;justify-content:space-between;gap:12px;align-items:end}.eyebrow{color:var(--info);letter-spacing:.15em;font-size:11px}h1{margin:.2rem 0;font-size:clamp(24px,3vw,44px)}#subject{color:var(--muted);font-family:ui-monospace,monospace}.live{display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-top:14px}.card{background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 14px 40px #0004}.hero{grid-column:1/-1}.bar{height:12px;background:#071019;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--info),var(--ok));transition:width .5s}.dod{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.gate{padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;min-height:88px}.gate b{display:block;font-size:12px}.gate span{font-size:11px;color:var(--muted)}.PASS{border-color:#245d46}.BLOCK{border-color:#6b2636}.ACTIVE{border-color:#65562c}.UNKNOWN{border-color:var(--line)}.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric strong{font-size:24px;display:block}.feed{max-height:42vh;overflow:auto;font-family:ui-monospace,monospace}.event{padding:8px 0;border-bottom:1px solid var(--line)}.event small{color:var(--muted)}dialog{width:min(920px,94vw);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:18px}button{background:#132c3e;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 10px}pre{white-space:pre-wrap;word-break:break-word;color:#cfe6f5}@media(max-width:900px){.grid{grid-template-columns:1fr}.dod{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<header><div><div class="eyebrow">UNIVERSAL TERMINAL · REPOSITORY CONTROL PLANE</div><h1>QIK-VRT Definition of Done</h1><div id="subject">initialisiere…</div></div><div class="live"><i class="dot"></i><span id="fresh">LIVE</span></div></header>
<section class="grid"><article class="card hero"><div style="display:flex;justify-content:space-between"><b>Gesamt-Konvergenz</b><strong id="pct">0%</strong></div><div class="bar"><i id="progress"></i></div><div class="dod" id="dod"></div></article>
<article class="card"><b>Repository</b><div class="cols" id="metrics"></div></article>
<article class="card"><b>Erster kausaler Blocker</b><h2 id="blocker">OBSERVE</h2><p id="next">Live-Evidenz wird geladen.</p><button onclick="openDetail('blocker')">In die Tiefe →</button></article>
<article class="card hero"><b>Live Event Journal</b><div class="feed" id="feed"></div></article></section>
<dialog id="detail"><button style="float:right" onclick="detail.close()">Schließen</button><h2 id="detailTitle"></h2><pre id="detailBody"></pre></dialog>
</main><script>
const OWNER='Goldkelch',REPO='qik-vrt',PR=1099,API=`https://api.github.com/repos/${OWNER}/${REPO}`;
const DOD=['ZERO_BUGS','ALL_PULL_REQUESTS_REGARDED','ALL_BRANCHES_REGARDED','ALL_PRODUCTIVE_BRANCHES_MERGED','MAIN_EXACT_VALIDATION','EFFECT_READBACK'];
let model={events:[],detail:{}};
async function gh(p){let r=await fetch(API+p,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error(`${r.status} ${p}`);return r.json()}
function status(ok,unknown=false){return unknown?'UNKNOWN':ok?'PASS':'BLOCK'}
function render(){let d=model.dod||{};let pass=DOD.filter(k=>d[k]==='PASS').length,pct=Math.round(pass/DOD.length*100);pct=document.getElementById('pct');pct.textContent=`${Math.round(pass/DOD.length*100)}%`;progress.style.width=`${Math.round(pass/DOD.length*100)}%`;dod.innerHTML=DOD.map(k=>`<div class="gate ${d[k]||'UNKNOWN'}" onclick="openDetail('${k}')"><b>${k}</b><span>${d[k]||'UNKNOWN'}</span></div>`).join('');metrics.innerHTML=`<div class="metric"><span>Open PRs</span><strong>${model.openPRs??'—'}</strong></div><div class="metric"><span>Branches</span><strong>${model.branches??'—'}</strong></div><div class="metric"><span>Main</span><strong style="font-size:13px">${(model.main||'—').slice(0,12)}</strong></div><div class="metric"><span>PR #${PR}</span><strong style="font-size:13px">${(model.head||'—').slice(0,12)}</strong></div>`;subject.textContent=`Authority ${OWNER}/${REPO} · Main ${(model.main||'—').slice(0,12)} · PR #${PR} ${(model.head||'—').slice(0,12)}`;blocker.textContent=model.blocker||'OBSERVE';next.textContent=model.next||'';feed.innerHTML=model.events.slice(-80).reverse().map(e=>`<div class="event"><small>${e.time||''}</small> <b>${e.type}</b> · ${e.text}</div>`).join('');fresh.textContent=`LIVE · ${new Date().toLocaleTimeString()}`}
function openDetail(k){detailTitle.textContent=k;detailBody.textContent=JSON.stringify(model.detail[k]||model,null,2);detail.showModal()}
async function tick(){try{let [repo,pr,prs,branches,runs,comments]=await Promise.all([gh(''),gh(`/pulls/${PR}`),gh('/pulls?state=open&per_page=100'),gh('/branches?per_page=100'),gh(`/actions/runs?head_sha=${encodeURIComponent((await gh(`/pulls/${PR}`)).head.sha)}&per_page=100`),gh(`/issues/${PR}/comments?per_page=100`)]);model.main=repo.default_branch==='main'?(await gh('/commits/main')).sha:null;model.head=pr.head.sha;model.openPRs=prs.length;model.branches=branches.length;let latest={};for(let r of runs.workflow_runs){let key=r.name;if(!latest[key]||r.run_number>latest[key].run_number)latest[key]=r}let adverse=Object.values(latest).filter(r=>r.status==='completed'&&!['success','skipped'].includes(r.conclusion));let active=Object.values(latest).filter(r=>r.status!=='completed');model.blocker=adverse[0]?`${adverse[0].name}: ${adverse[0].conclusion}`:active[0]?`${active[0].name}: ${active[0].status}`:'NO PR-GATE BLOCKER OBSERVED';model.next=adverse.length?'Repair first deterministic blocker; mutation resets dependent evidence.':active.length?'Await repository-native terminal event; do not transfer predecessor evidence.':'Proceed to exact-head review/adoption gates.';let live=comments.findLast?.(c=>(c.body||'').includes('qikvrt-universal-terminal-live-surface-v1'))||[...comments].reverse().find(c=>(c.body||'').includes('qikvrt-universal-terminal-live-surface-v1'));model.events=[];if(live){for(let line of live.body.split('\n')){let m=line.match(/^- `([^`]+)` \*\*([^*]+)\*\* · `([^`]+)` · (.*)$/);if(m)model.events.push({time:m[1],type:m[2],text:`${m[3]} · ${m[4]}`})}}model.dod={ZERO_BUGS:status(!adverse.length&&!active.length),ALL_PULL_REQUESTS_REGARDED:status(false,true),ALL_BRANCHES_REGARDED:status(false,true),ALL_PRODUCTIVE_BRANCHES_MERGED:status(false,true),MAIN_EXACT_VALIDATION:status(false,true),EFFECT_READBACK:status(false,true)};model.detail={gates:latest,pr,repository:repo,events:model.events,blocker:{adverse,active,next:model.next}};for(let k of DOD)model.detail[k]={state:model.dod[k],note:k==='ZERO_BUGS'?'Derived only from currently observable exact PR-head workflow envelope; final proof requires the final Main conjunction.':'Fail-closed UNKNOWN until a repository-native final-Main witness supplies this component.'};render()}catch(e){fresh.textContent='DEGRADED';blocker.textContent='LIVE READBACK FAILED';next.textContent=String(e);render()}}
tick();setInterval(tick,5000);
</script></body></html>
