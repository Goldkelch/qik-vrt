<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QIK-VRT Live Cockpit</title><style>:root{color-scheme:dark;--bg:#080b10;--p:#111722;--l:#263247;--t:#eef4ff;--m:#8fa0b8;--g:#39d98a;--r:#ff5f68;--a:#ffbd4a;--b:#4ca6ff;--x:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;overflow:hidden}.app{height:100vh;padding:12px;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}.top,.hero,.field,.foot{background:var(--p);border:1px solid var(--l);border-radius:14px}.top{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.08em}.live{display:flex;gap:7px;align-items:center}.dot{width:11px;height:11px;border-radius:50%;display:inline-block}.pulse{background:var(--g);animation:pulse 1.5s infinite}.hero{padding:12px 14px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.status{font-size:clamp(25px,4vw,44px);font-weight:900;display:flex;align-items:center;gap:12px}.status .dot{width:20px;height:20px}.red{background:var(--r)}.green{background:var(--g)}.amber{background:var(--a)}.grey{background:var(--x)}.muted{color:var(--m)}.defect{margin-top:5px;font-weight:650}.loop{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:7px}.phase{text-align:center;font-size:11px}.phase .dot{display:block;margin:0 auto 4px}.field{min-height:0;padding:10px 12px;display:grid;grid-template-rows:auto 1fr;gap:8px}.layers{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:8px;min-height:0}.layer{color:inherit;background:#0c121c;border:1px solid var(--l);border-radius:11px;padding:9px;text-align:left;cursor:pointer;min-width:0}.layer strong{display:block;margin-top:7px}.layer small{color:var(--m)}.layer[aria-expanded=true]{border-color:var(--b);background:#101b2a}.detail{position:absolute;inset:auto 24px 64px 24px;background:#111a28;border:1px solid var(--b);border-radius:12px;padding:12px;box-shadow:0 8px 30px #0009}.detail[hidden]{display:none}.foot{padding:9px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:12px}.foot b{display:block;margin-top:2px}.progress{height:5px;background:#253044;border-radius:9px;overflow:hidden;margin-top:6px}.bar{height:100%;width:0;background:var(--b);transition:width .4s}@keyframes pulse{50%{opacity:.25}}@media(max-width:650px){.hero{grid-template-columns:1fr}.layers{grid-template-columns:repeat(2,1fr)}.foot{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}.bar{transition:none}}</style></head><body><main class="app"><section class="top"><div><div class="brand">QIK-VRT · UNIVERSAL TERMINAL FIELD</div><small class="muted" id="subject">observing repository…</small></div><div class="live"><span class="dot pulse"></span><b>LIVE</b><span class="muted" id="age">—</span></div></section><section class="hero"><div><div class="muted">PRODUCT TRAJECTORY</div><div class="status"><span id="stateDot" class="dot grey"></span><span id="state">OBSERVING</span></div><div class="defect" id="defect">Determining first required failing edge…</div><div class="progress"><div class="bar" id="progress"></div></div></div><div><div class="muted">SELF-ADAPTATION</div><div class="loop" id="loop"></div><div class="muted" style="margin-top:7px">T1–T16 fail-closed classification</div></div></section><section class="field"><div style="display:flex;justify-content:space-between"><b>Repository / Product layers</b><span class="muted">tap for evidence</span></div><div class="layers" id="layers"></div></section><section class="foot"><div><span class="muted">Last transition</span><b id="transition">—</b></div><div><span class="muted">Active runs</span><b id="active">—</b></div><div><span class="muted">Failed runs</span><b id="failed">—</b></div><div><span class="muted">Next frontier</span><b id="frontier">—</b></div></section><div class="detail" id="detail" hidden><div style="display:flex;justify-content:space-between;gap:8px"><div><b id="detailTitle"></b><div class="muted" id="detailBody" style="margin-top:5px"></div></div><button id="close" type="button">Einklappen</button></div></div></main><script>"use strict";const repo="Goldkelch/qik-vrt",api="https://api.github.com/repos/"+repo,refreshMs=15000;const defs=[["Linux","QIKVRT Mega ST Distribution"],["Mega-ST","QIKVRT Mega ST Distribution"],["MC68000","QIKVRT virtual Mesh M68000 acceptance"],["Mesh","QIKVRT real multi-pair Mesh runtime"],["Terminal","QIKVRT universal terminal container"],["Firefox","QIKVRT EFFECT_ACK HTTP Firefox terminal"],["TEMDD","QIKVRT TEMDD conformance"],["Cloud Transputer","QIKVRT Cloud Transputer materialization v1"]],phases=["OBSERVE","MEASURE","DIAGNOSE","ADAPT","VALIDATE","COMPARE","LEARN"];let lastSig="",lastAt=Date.now(),busy=false;function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function color(v){return v==="success"?"green":["failure","cancelled","timed_out","action_required"].includes(v)?"red":["queued","pending","in_progress"].includes(v)?"amber":"grey"}async function get(u){const r=await fetch(u,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"});if(!r.ok)throw Error(r.status+" "+r.statusText);return r.json()}function loop(mode){const done=mode==="VALIDATING"?4:mode==="IMPROVED"?7:3;document.getElementById("loop").innerHTML=phases.map((p,i)=>'<div class="phase"><span class="dot '+(i<done?"green":i===done?"amber":"grey")+'"></span>'+p+"</div>").join("")}function layers(runs){const box=document.getElementById("layers");box.innerHTML="";defs.forEach(([label,name])=>{const r=runs.find(x=>x.name===name),s=r?(r.conclusion||r.status):"unknown",b=document.createElement("button");b.type="button";b.className="layer";b.setAttribute("aria-expanded","false");b.innerHTML='<span class="dot '+color(s)+'"></span><strong>'+esc(label)+"</strong><small>"+esc(s)+"</small>";b.addEventListener("click",()=>{document.querySelectorAll(".layer").forEach(x=>x.setAttribute("aria-expanded","false"));b.setAttribute("aria-expanded","true");detailTitle.textContent=label;detailBody.textContent=r?name+" · "+s+" · HEAD "+String(r.head_sha||"").slice(0,12)+" · run "+r.id:"No fresh workflow evidence observed.";detail.hidden=false});box.appendChild(b)})}async function refresh(){if(busy)return;busy=true;try{const pr=await get(api+"/pulls/1124"),sha=pr.head.sha,[commit,wr]=await Promise.all([get(api+"/commits/"+sha),get(api+"/actions/runs?head_sha="+sha+"&per_page=100")]),runs=wr.workflow_runs||[],active=runs.filter(r=>r.status!=="completed"),failed=runs.filter(r=>["failure","cancelled","timed_out","action_required"].includes(r.conclusion));let mode="BLOCKED",defect="Required product edge failed; no admitted causal repair observed.",frontier="first causal defect";if(active.length){mode="VALIDATING";defect="Fresh successor exists; exact-head validation is active.";frontier="fresh exact-subject validation"}else{const dist=runs.find(r=>r.name==="QIKVRT Mega ST Distribution"),mesh=runs.find(r=>r.name==="QIKVRT real multi-pair Mesh runtime");if(dist&&dist.conclusion==="success"&&(!mesh||mesh.conclusion==="success")){mode="IMPROVED";defect="Required observed delivery lanes are green; real end-user comparison remains authoritative.";frontier="real end-user comparison"}}const sig=sha+"|"+runs.map(r=>r.id+":"+r.status+":"+r.conclusion).join("|");if(sig!==lastSig){lastSig=sig;lastAt=Date.now();transition.textContent=new Date().toLocaleTimeString()+" · "+sha.slice(0,8)}subject.textContent="HEAD "+sha.slice(0,12)+" · TREE "+commit.commit.tree.sha.slice(0,12);state.textContent=mode;stateDot.className="dot "+(mode==="BLOCKED"?"red":mode==="IMPROVED"?"green":"amber");document.getElementById("defect").textContent=defect;document.getElementById("active").textContent=active.length;document.getElementById("failed").textContent=failed.length;document.getElementById("frontier").textContent=frontier;progress.style.width=(mode==="BLOCKED"?35:mode==="VALIDATING"?65:100)+"%";loop(mode);layers(runs)}catch(e){state.textContent="STALE / UNVERIFIED";stateDot.className="dot grey";document.getElementById("defect").textContent="Live observation failed: "+e.message}finally{busy=false}}close.addEventListener("click",()=>detail.hidden=true);setInterval(()=>age.textContent=Math.floor((Date.now()-lastAt)/1000)+"s",1000);refresh();setInterval(refresh,refreshMs);</script></body></html>
