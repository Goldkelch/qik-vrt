name: QIK-VRT autonomous ontology closure operator

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows:
      - "QIK-VRT QCE candidate verification"
      - "QIK-VRT authenticated audio request"
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
    types: [completed]
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/qikvrt_autonomous_ontology_closure.yml"
      - "tools/qikvrt_autonomous_ontology_closure.py"
      - "tests/test_qikvrt_autonomous_ontology_closure.py"
      - "policy/AUTONOMOUS_ONTOLOGY_CLOSURE_V1.json"
      - "schemas/qikvrt-autonomous-ontology-closure-v1.schema.json"
      - "state/ontology-autonomy/**"
      - "docs/operations/AUTONOMOUS_ONTOLOGY_CLOSURE.md"

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

concurrency:
  group: qikvrt-autonomous-ontology-closure-${{ github.repository }}
  cancel-in-progress: false

jobs:
  one-work-unit:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'agent/autonomous-ontology-closure-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact operator state without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the fail-closed operator contract
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_ontology_closure.py verify --json
          python3 -B -m unittest -v tests.test_qikvrt_autonomous_ontology_closure

      - name: Select one deterministic work unit
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_ontology_closure.py plan --json \
            | tee "${RUNNER_TEMP}/ontology-plan.json"

      - name: Execute one bounded repository work unit through the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_ontology_closure.py apply \
            --repository "${GITHUB_REPOSITORY}" \
            --json | tee "${RUNNER_TEMP}/ontology-result.json"

      - name: Verify that only the append-only status projection changed locally
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "${path}" in
              state/ontology-autonomy/STATUS.json) ;;
              *) printf 'Unexpected operator worktree mutation: %s\n' "${path}" >&2; exit 1 ;;
            esac
          done

      - name: Persist status projection on the exact operator candidate branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- state/ontology-autonomy/STATUS.json; then
            exit 0
          fi
          content="$(base64 -w0 state/ontology-autonomy/STATUS.json)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/state/ontology-autonomy/STATUS.json?ref=${HEAD_REF}" --jq .sha)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/state/ontology-autonomy/STATUS.json" \
            -f message='Persist autonomous ontology operator status' \
            -f content="${content}" \
            -f sha="${current_sha}" \
            -f branch="${HEAD_REF}" >/dev/null
