name: QIKVRT Proof Closure external publication

on:
  push:
    branches: [publication/proof-closure-20260924-v1]
    paths:
      - "release/proof-closure-zenodo-v1/PUBLISH_TRIGGER.json"

permissions:
  contents: write
  actions: read

concurrency:
  group: qikvrt-proof-closure-external-publication-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: zenodo-production
    env:
      BRANCH: publication/proof-closure-20260924-v1
      TRIGGER: release/proof-closure-zenodo-v1/PUBLISH_TRIGGER.json
      ZENODO_RECEIPT: release/proof-closure-zenodo-v1/zenodo-publication.json
      IETF_RECEIPT: release/proof-closure-zenodo-v1/ietf-submission.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind single-purpose trigger to previously validated parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          parent="$(git rev-parse HEAD^)"
          test "$(git show -s --format=%P HEAD | wc -w)" -eq 1
          test "$(git diff --name-only "$parent" HEAD)" = "$TRIGGER"
          test "$(jq -r .schema "$TRIGGER")" = "qikvrt_proof_closure_publish_trigger_v1"
          test "$(jq -r .publication_id "$TRIGGER")" = "qikvrt-proof-closure-2026-09-24-v1"
          test "$(jq -r .validated_head "$TRIGGER")" = "$parent"
          test "$(jq -r .authorized "$TRIGGER")" = "true"
          python3 - <<'PY'
          import json, os, urllib.request
          parent=os.popen("git rev-parse HEAD^").read().strip()
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={parent}&event=push&per_page=100"
          req=urllib.request.Request(url,headers={
            "Accept":"application/vnd.github+json",
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "X-GitHub-Api-Version":"2022-11-28",
          })
          with urllib.request.urlopen(req,timeout=60) as r:
              value=json.loads(r.read().decode())
          matches=[x for x in value.get("workflow_runs",[]) if x.get("name")=="QIKVRT Proof Closure validation" and x.get("conclusion")=="success"]
          if not matches:
              raise SystemExit("BLOCK: validated parent has no successful Proof Closure push validation")
          print("VALIDATED_PARENT_RUN="+str(matches[0]["id"]))
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Re-run local closure checks on trigger successor
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_qikvrt_proof_closure -v
          python3 -m py_compile tools/qikvrt_proof_closure_zenodo_publish.py tools/qikvrt_proof_closure_ietf_submit.py

      - name: Publish exact document set to Zenodo and independently read back bytes
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test ! -e "$ZENODO_RECEIPT"
          python3 -B tools/qikvrt_proof_closure_zenodo_publish.py --output "$ZENODO_RECEIPT"

      - name: Submit exact RFCXML through official IETF submission API
        run: |
          set -euo pipefail
          test ! -e "$IETF_RECEIPT"
          python3 -B tools/qikvrt_proof_closure_ietf_submit.py --output "$IETF_RECEIPT"

      - name: Persist non-secret external receipts without retriggering
        run: |
          set -euo pipefail
          remote="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk 'NR==1{print $1}')"
          test "$remote" = "$GITHUB_SHA"
          git config user.name "qikvrt-publication-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ZENODO_RECEIPT" "$IETF_RECEIPT"
          git commit -m "evidence: persist Proof Closure Zenodo and IETF receipts"
          git push origin "HEAD:$BRANCH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: qikvrt-proof-closure-external-publication
          path: |
            release/proof-closure-zenodo-v1/zenodo-publication.json
            release/proof-closure-zenodo-v1/ietf-submission.json
          if-no-files-found: warn
          retention-days: 90
