name: QIKVRT Interactive Evidence Sphere

on:
  repository_dispatch:
    types: [qikvrt_feature_request]
  workflow_dispatch:
    inputs:
      task:
        required: true
        type: choice
        default: build_qik_vrt_mesh_html
        options: [build_qik_vrt_mesh_html]
      request_json_b64:
        required: false
        default: ''
        description: Optional base64 UTF-8 JSON client_payload; empty selects canonical request
        type: string
      subject_sha:
        required: false
        default: ''
        description: Optional exact lowercase 40-hex subject binding
        type: string
  pull_request:
    paths:
      - '.github/workflows/qikvrt_feature_request.yml'
      - 'tools/qikvrt_mesh_html.py'
      - 'tests/test_qikvrt_mesh_html.py'
      - 'policy/QIKVRT_FEATURE_REQUEST_V1.schema.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: qikvrt-interactive-evidence-sphere-${{ github.repository }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pr-self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          mkdir -p dist
          python3 -B tools/qikvrt_mesh_html.py generate --output dist/QIK_VRT_MESH.html
          python3 -B tools/qikvrt_mesh_html.py check --path dist/QIK_VRT_MESH.html
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v tests.test_qikvrt_mesh_html

  dispatch-build-test-receipt:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind request and exact subject
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse --verify HEAD^{commit})"
          test "$head_sha" = "$GITHUB_SHA"
          python3 -B tools/qikvrt_mesh_html.py validate-event --event-path "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --head "$head_sha"
      - name: Build and test
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 -B tools/qikvrt_mesh_html.py generate --output dist/QIK_VRT_MESH.html
          python3 -B tools/qikvrt_mesh_html.py check --path dist/QIK_VRT_MESH.html
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v tests.test_qikvrt_mesh_html
      - name: Emit exact-head receipt
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_mesh_html.py receipt --event-path "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --head "$(git rev-parse HEAD)" --tree "$(git rev-parse HEAD^{tree})" --artifact dist/QIK_VRT_MESH.html --output dist/QIK_VRT_MESH.receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-interactive-evidence-sphere-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/QIK_VRT_MESH.html
            dist/QIK_VRT_MESH.receipt.json
          if-no-files-found: error
          retention-days: 30
