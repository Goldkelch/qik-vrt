name: QIKVRT live status watch

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows:
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIKVRT requested review executor"
      - "QIKVRT required code-owner review"
      - "QIKVRT reciprocal Mesh review"
      - "QIKVRT universal terminal materialization"
      - "QIKVRT reflexive repository watchdog"
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to project"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: qikvrt-live-terminal-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  project:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'workflow_run' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Project one causal event into the persistent terminal surface
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr }}
          MARKER: '<!-- qikvrt-universal-terminal-live-surface-v1 -->'
        shell: bash
        run: |
          set -euo pipefail

          event="$GITHUB_EVENT_PATH"
          pr=''
          verb='OBSERVE'
          subject=''
          detail=''
          source_id="$GITHUB_RUN_ID"

          case "$EVENT_NAME" in
            pull_request)
              pr="$(jq -r '.pull_request.number' "$event")"
              head="$(jq -r '.pull_request.head.sha' "$event")"
              action="$(jq -r '.action' "$event")"
              subject="PR #$pr @ $head"
              detail="pull_request:$action"
              ;;
            pull_request_review)
              pr="$(jq -r '.pull_request.number' "$event")"
              head="$(jq -r '.pull_request.head.sha' "$event")"
              state="$(jq -r '.review.state' "$event")"
              actor="$(jq -r '.review.user.login' "$event")"
              subject="PR #$pr @ $head"
              verb='READBACK'
              detail="review:$state by $actor"
              ;;
            issue_comment)
              if [ "$(jq -r '.issue.pull_request != null' "$event")" != true ]; then exit 0; fi
              pr="$(jq -r '.issue.number' "$event")"
              body="$(jq -r '.comment.body' "$event")"
              if [[ "$body" == *"$MARKER"* ]]; then exit 0; fi
              head="$(gh api "repos/$REPOSITORY/pulls/$pr" --jq '.head.sha')"
              subject="PR #$pr @ $head"
              detail="issue_comment by $(jq -r '.comment.user.login' "$event")"
              ;;
            workflow_run)
              pr="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$event")"
              if [ -z "$pr" ]; then exit 0; fi
              head="$(jq -r '.workflow_run.head_sha' "$event")"
              name="$(jq -r '.workflow_run.name' "$event")"
              state="$(jq -r '.workflow_run.conclusion // .workflow_run.status' "$event")"
              run_url="$(jq -r '.workflow_run.html_url' "$event")"
              source_id="$(jq -r '.workflow_run.id' "$event")"
              subject="PR #$pr @ $head"
              case "$state" in
                success) verb='EFFECT' ;;
                failure|cancelled|action_required|timed_out) verb='HOLD' ;;
                *) verb='OBSERVE' ;;
              esac
              detail="$name → $state ($run_url)"
              ;;
            workflow_dispatch)
              pr="$DISPATCH_PR"
              head="$(gh api "repos/$REPOSITORY/pulls/$pr" --jq '.head.sha')"
              subject="PR #$pr @ $head"
              detail='manual surface bind'
              ;;
            *) exit 0 ;;
          esac

          test -n "$pr"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          event_id="${EVENT_NAME}:${source_id}:${GITHUB_RUN_ATTEMPT}"
          line="- \`$now\` **$verb** · \`$subject\` · $detail · event \`$event_id\`"

          comments="$(gh api "repos/$REPOSITORY/issues/$pr/comments?per_page=100")"
          comment_id="$(printf '%s' "$comments" | jq -r --arg marker "$MARKER" '.[] | select(.body | contains($marker)) | .id' | tail -n 1)"

          if [ -n "$comment_id" ]; then
            old="$(printf '%s' "$comments" | jq -r --argjson id "$comment_id" '.[] | select(.id == $id) | .body')"
            # append-only bounded projection; retain the most recent 120 event lines
            journal="$(printf '%s\n' "$old" | awk '/^## Live event journal/{f=1;next} f && /^- `/{print}' | tail -n 119)"
          else
            journal=''
          fi

          body="$MARKER

          ## QIKVRT Universal Terminal — live mirror surface

          This comment is an **event-driven projection**. It does not poll. Each eligible repository event performs one bounded update and exits.

          **Current exact subject:** \`$subject\`
          **Last event:** \`$event_id\`
          **Last transition:** **$verb**
          **Observed at:** \`$now\`

          ## Live event journal
          $journal
          $line

          _Causality is derived from exact-subject/event receipts; timestamps are display metadata only. TRANSPORT_ACK != EFFECT_ACK._"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$pr/comments" -f body="$body" >/dev/null
          fi
