name: QIKVRT live status watch

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
    paths:
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - ".github/workflows/qikvrt_workflow_executor.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_mesh_heartbeat.yml"
      - ".github/workflows/qikvrt_mesh_heartbeat_main_ledger.yml"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"
      - "tools/qikvrt_workflow_executor.py"
      - "tools/qikvrt_seed_common.py"
      - "tools/qikvrt_mesh_heartbeat.py"
      - "tests/test_qikvrt_workflow_executor_mesh_contract.py"
      - "tests/test_qikvrt_mesh_heartbeat.py"
      - "tests/test_seed_workflows.py"
      - "policy/QIKVRT_MESH_HEARTBEAT_V1.json"
      - "docs/architecture/QIKVRT_MESH_HEARTBEAT_V1.md"
      - "acceptance/WORKFLOW_EXECUTOR_MESH_NODE_CONTINUITY_ACCEPTANCE_TEST.md"
      - "registry/NODE_DISCOVERY_POLICY.json"
      - "AI"
      - "Makefile"
  workflow_run:
    workflows:
      - "QIKVRT Mesh heartbeat"
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT real multi-pair Mesh runtime"
      - "QIKVRT virtual Mesh M68000 acceptance"
      - "QIKVRT code-owner review observer"
      - "QIKVRT Collective Proposal Review"
      - "QIKVRT zero-bug continuous invariant"
      - "QIKVRT Spark branch work-unit core"
      - "QIK-VRT global claim completion"
      - "QIKVRT adaptive runtime"
      - "QIKVRT workflow executor watchdog"
    types: [requested, in_progress, completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to observe"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: qikvrt-live-status-event-${{ github.repository }}-${{ github.event.workflow_run.id || github.run_id }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: false

jobs:
  observe-event:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_run' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/qikvrt-status-watch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.event.issue.number || inputs.pr || '' }}
      OBSERVED_WORKFLOW: ${{ github.event.workflow_run.name || 'repository-event' }}
      OBSERVED_STATUS: ${{ github.event.workflow_run.status || 'event-received' }}
      OBSERVED_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
      OBSERVED_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
      OBSERVED_HEAD: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      OBSERVED_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.ref_name }}
      EVIDENCE_DIR: ${{ runner.temp }}/qikvrt-live-status-event

    steps:
      - name: Project one event-bound status snapshot without polling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          observed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg schema 'qikvrt_event_bound_live_status_v1' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg event_name "$EVENT_NAME" \
            --arg event_action "$EVENT_ACTION" \
            --arg pull_request_number "$PR_NUMBER" \
            --arg observed_workflow "$OBSERVED_WORKFLOW" \
            --arg observed_status "$OBSERVED_STATUS" \
            --arg observed_conclusion "$OBSERVED_CONCLUSION" \
            --arg observed_run_id "$OBSERVED_RUN_ID" \
            --arg observed_head "$OBSERVED_HEAD" \
            --arg observed_branch "$OBSERVED_BRANCH" \
            --arg observed_at "$observed_at" \
            '{
              schema: $schema,
              repository: $repository,
              event_name: $event_name,
              event_action: $event_action,
              pull_request_number: $pull_request_number,
              observed_workflow: $observed_workflow,
              observed_status: $observed_status,
              observed_conclusion: $observed_conclusion,
              observed_run_id: $observed_run_id,
              observed_head: $observed_head,
              observed_branch: $observed_branch,
              observed_at: $observed_at,
              trigger: "REPOSITORY_EVENT_ONLY",
              polling: false,
              blind_retry: false,
              semantic_work_triggered: false,
              external_effect: "NONE"
            }' | tee "$EVIDENCE_DIR/status-event.json"

          {
            echo '## QIKVRT event-bound repository status projection'
            echo
            echo '- Trigger: `REPOSITORY_EVENT_ONLY`'
            echo '- Polling: `false`'
            echo '- Blind retry: `false`'
            echo '- Semantic work triggered: `false`'
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Pull request: \`${PR_NUMBER:-none}\`"
            echo "- Workflow: \`$OBSERVED_WORKFLOW\`"
            echo "- State: \`$OBSERVED_STATUS${OBSERVED_CONCLUSION:+/$OBSERVED_CONCLUSION}\`"
            echo "- Exact head: \`$OBSERVED_HEAD\`"
            echo "- Branch: \`$OBSERVED_BRANCH\`"
            echo "- Observed at: \`$observed_at\`"
            echo
            echo '`HEARTBEAT != POLLING != BLIND_RETRY`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact event-bound status evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-live-status-event-${{ env.OBSERVED_RUN_ID }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/status-event.json
          if-no-files-found: error
          retention-days: 30
