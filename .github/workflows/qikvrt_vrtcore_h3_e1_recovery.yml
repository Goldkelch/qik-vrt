name: Recover the exact consumed VRTCore H3 E1 publication

on:
  push:
    branches:
      - recovery-execution/vrtcore-relational-h3-e1-v1
    paths:
      - .github/workflows/qikvrt_vrtcore_h3_e1_recovery.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: qikvrt-vrtcore-causal-zenodo-publication-v1
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      github.event.created == false &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == '6edde9cbcc0fb57cd29ab71de6718228cc258d80' &&
      github.event.after == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_CONTROLLER_PARENT: bad1a0558b88b9bc13a6b47fe621ac27d8bfaa62
      EXPECTED_CONTROLLER_PREDECESSOR: 6edde9cbcc0fb57cd29ab71de6718228cc258d80
      EXPECTED_CONTROLLER_PREDECESSOR_TREE: 9cefcb13ed1e7efdc11f7ccf844544b5e5e280d3
      EXPECTED_CONTROLLER_PREDECESSOR_PARENT: d941ca6b792d569b2c37c571123c7524a53c33fd
      EXPECTED_CONTROLLER_PREDECESSOR_GRANDPARENT: eec6f14ad937e15764d28ccf4fc5afef0c198236
      EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GRANDPARENT: 8db28488afa35549eea640f40f98321c1e56a4e0
      EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GRANDPARENT: dfcf28f9f48b5857ef3b4ef50f979d9a1979be08
      EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GRANDPARENT: 89fa9a49a73a7194ccdbed080e9dbdc26a506d5e
      EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GREAT_GRANDPARENT: 0d104a2692be53f47f2f200d710d2190dfa2f46d
      EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GREAT_GREAT_GRANDPARENT: 4e794afb21c8e5a31ff713b15b77890bbbd950c4
      E1: 53e757ebce929b40250f90a02ed2a9ec62de6217
      E1_PARENT: cdb0e9fe8444565df665affa64463295648b1368
      E1_TREE: 99ee39034abbdf8abd4fd9891915cf3d647365db
      CONTROLLER_BRANCH: recovery-execution/vrtcore-relational-h3-e1-v1
      ZENODO_API_BASE: https://zenodo.org/api
    steps:
      - name: Check out the exact recovery controller head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: controller

      - name: Verify the static controller trigger and exact main boundary
        shell: bash
        run: |
          set -euo pipefail
          if test "$EXPECTED_CONTROLLER_PARENT" = \
            "__H3_E1_RECOVERY_EXPECTED_PARENT__"; then
            printf '%s\n' \
              'BLOCK: unresolved controller parent placeholder' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'BLOCK: controller parent is not an exact commit' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PREDECESSOR" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' \
              'BLOCK: controller predecessor is not an exact commit' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PREDECESSOR_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' \
              'BLOCK: controller predecessor tree is not exact' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PREDECESSOR_PARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' \
              'BLOCK: controller predecessor parent is not an exact commit' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PREDECESSOR_GRANDPARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' \
              'BLOCK: controller predecessor grandparent is not an exact commit' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GRANDPARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' \
              'BLOCK: controller predecessor great-grandparent is not exact' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GRANDPARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' \
              'BLOCK: controller predecessor great-great-grandparent is not exact' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GRANDPARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' \
              'BLOCK: controller predecessor great-great-great-grandparent is not exact' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GREAT_GRANDPARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' \
              'BLOCK: controller predecessor great-great-great-great-grandparent is not exact' >&2
            exit 2
          fi
          if ! [[ "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GREAT_GREAT_GRANDPARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' \
              'BLOCK: controller predecessor fifth great-grandparent is not exact' >&2
            exit 2
          fi
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "${{ github.event.created }}" = "false"
          test "${{ github.event.deleted }}" = "false"
          test "${{ github.event.forced }}" = "false"
          test "${{ github.event.before }}" = "$EXPECTED_CONTROLLER_PREDECESSOR"
          test "${{ github.event.after }}" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/$CONTROLLER_BRANCH"
          test "$GITHUB_REF_NAME" = "$CONTROLLER_BRANCH"
          test "$GITHUB_SHA" = "$(git -C controller rev-parse --verify HEAD^{commit})"
          test "$(git -C controller show -s --format=%P HEAD)" = \
            "$EXPECTED_CONTROLLER_PREDECESSOR"
          test "$(
            git -C controller show -s --format=%P \
              "$EXPECTED_CONTROLLER_PREDECESSOR"
          )" = "$EXPECTED_CONTROLLER_PREDECESSOR_PARENT"
          test "$(
            git -C controller rev-parse --verify \
              "$EXPECTED_CONTROLLER_PREDECESSOR^{tree}"
          )" = "$EXPECTED_CONTROLLER_PREDECESSOR_TREE"
          test "$(
            git -C controller show -s --format=%P \
              "$EXPECTED_CONTROLLER_PREDECESSOR_PARENT"
          )" = "$EXPECTED_CONTROLLER_PREDECESSOR_GRANDPARENT"
          test "$(
            git -C controller show -s --format=%P \
              "$EXPECTED_CONTROLLER_PREDECESSOR_GRANDPARENT"
          )" = "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GRANDPARENT"
          test "$(
            git -C controller show -s --format=%P \
              "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GRANDPARENT"
          )" = "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GRANDPARENT"
          test "$(
            git -C controller show -s --format=%P \
              "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GRANDPARENT"
          )" = "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GRANDPARENT"
          test "$(
            git -C controller show -s --format=%P \
              "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GRANDPARENT"
          )" = \
            "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GREAT_GRANDPARENT"
          test "$(
            git -C controller show -s --format=%P \
              "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GREAT_GRANDPARENT"
          )" = \
            "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GREAT_GREAT_GRANDPARENT"
          test "$(
            git -C controller show -s --format=%P \
              "$EXPECTED_CONTROLLER_PREDECESSOR_GREAT_GREAT_GREAT_GREAT_GREAT_GRANDPARENT"
          )" = "$EXPECTED_CONTROLLER_PARENT"
          test "$(git -C controller rev-parse --verify HEAD^{tree})" != \
            "$(
              git -C controller rev-parse --verify \
                "$EXPECTED_CONTROLLER_PREDECESSOR^{tree}"
            )"
          test "$(git -C controller rev-parse --verify HEAD^{tree})" != \
            "$(git -C controller rev-parse --verify "$EXPECTED_CONTROLLER_PARENT^{tree}")"
          expected_delta="$(
            printf '%s\n' \
              'M	.github/workflows/qikvrt_vrtcore_h3_e1_recovery.yml' \
              'M	REPOSITORY_FILE_MANIFEST.json' \
              'M	REPOSITORY_FILE_MANIFEST.json.sha256' \
              'M	SHA256SUMS.txt' \
              'M	tests/test_vrtcore_h3_e1_recovery.py' \
              'M	tools/qikvrt_vrtcore_h3_e1_recovery.py'
          )"
          observed_delta="$(
            git -C controller diff \
              --name-status \
              --no-renames \
              "$EXPECTED_CONTROLLER_PARENT" \
              "$GITHUB_SHA" \
              --
          )"
          test "$observed_delta" = "$expected_delta"
          main_head="$(
            git -C controller ls-remote --heads origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          test "$main_head" = "$EXPECTED_CONTROLLER_PARENT"
          trigger_head="$(
            git -C controller ls-remote \
              --heads \
              origin \
              "refs/heads/$CONTROLLER_BRANCH" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$trigger_head" = "$GITHUB_SHA"
          python3 -B controller/tools/qikvrt_integrity.py verify

      - name: Run all controller repository gates before credentials
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/controller" \
            python3 -B -m unittest -v \
            controller/tests/test_vrtcore_h3_e1_recovery.py
          make -C controller test
          test -z "$(git -C controller status --porcelain=v1 --untracked-files=all)"

      - name: Check out immutable E1 publication execution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: 53e757ebce929b40250f90a02ed2a9ec62de6217
          path: execution

      - name: Verify E1 objects publisher bytes and complete gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C execution rev-parse --verify HEAD^{commit})" = "$E1"
          test "$(git -C execution show -s --format=%P HEAD)" = "$E1_PARENT"
          test "$(git -C execution rev-parse --verify HEAD^{tree})" = "$E1_TREE"
          python3 -B controller/tools/qikvrt_vrtcore_h3_e1_recovery.py \
            --verify-basis \
            --execution-root execution
          make -C execution test
          test -z "$(git -C execution status --porcelain=v1 --untracked-files=all)"

      - name: Persist and read back authorization_consumed before Zenodo
        id: prepare
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B controller/tools/qikvrt_vrtcore_h3_e1_recovery.py \
            --prepare \
            --execution-root execution \
            --controller-parent "$EXPECTED_CONTROLLER_PARENT" \
            --github-output "$GITHUB_OUTPUT"
          grep -Fx 'prepared=true' "$GITHUB_OUTPUT"
          grep -Eq '^finalized=(true|false)$' "$GITHUB_OUTPUT"
          grep -Eq '^receipt_commit=[0-9a-f]{40}$' "$GITHUB_OUTPUT"

      - name: Recheck out clean immutable E1 after bootstrap receipt
        if: steps.prepare.outputs.finalized != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: 53e757ebce929b40250f90a02ed2a9ec62de6217
          path: execution

      - name: Run E1 run_publisher_with_checkpoints after durable bootstrap
        id: publish
        if: steps.prepare.outputs.finalized != 'true'
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test "$(
            env -u GITHUB_TOKEN -u GH_TOKEN -u ZENODO_ACCESS_TOKEN \
              git -C execution rev-parse --verify HEAD^{commit}
          )" = "$E1"
          python3 -B controller/tools/qikvrt_vrtcore_h3_e1_recovery.py \
            --publish \
            --execution-root execution \
            --controller-parent "$EXPECTED_CONTROLLER_PARENT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload bounded local recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrtcore-h3-e1-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: ignore
          path: execution/release/vrtcore-relational-h3-publication-2026-08-02/zenodo-publication.json

      - name: Enforce exact checkpointed publication result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.prepare.outputs.prepared }}" = "true"
          [[ "${{ steps.prepare.outputs.receipt_commit }}" =~ ^[0-9a-f]{40}$ ]]
          if test "${{ steps.prepare.outputs.finalized }}" = "true"; then
            test -z "${{ steps.publish.outputs.status }}"
          else
            test "${{ steps.publish.outputs.status }}" = "0"
            test "${{ steps.publish.outputs.finalized }}" = "false"
            test "${{ steps.publish.outputs.phase }}" = "public_verified"
            test "${{ steps.publish.outputs.state }}" = "published"
            [[ "${{ steps.publish.outputs.receipt_commit }}" =~ ^[0-9a-f]{40}$ ]]
          fi
