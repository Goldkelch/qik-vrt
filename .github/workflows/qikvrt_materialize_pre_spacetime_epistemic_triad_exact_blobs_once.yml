name: QIK-VRT materialize exact epistemic triad from exact Git blobs

on:
  push:
    branches:
      - transport/pre-spacetime-epistemic-triad-current-main-materializer-v1
    paths:
      - .github/workflows/qikvrt_materialize_pre_spacetime_epistemic_triad_exact_blobs_once.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-pre-spacetime-epistemic-triad-exact-blobs-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_MAIN: 0b2360fa0c66c86e6ee6e71798adcdaf3ac2fac5
      TARGET_BRANCH: agent/pre-spacetime-epistemic-triad-v1
      BUNDLE: docs/publications/2026-08-04-pre-spacetime-ontology
      IMAGE_BLOBS_JSON: >-
        {"FIGURE_ORIGINAL_SKETCH.jpeg":{"bytes":560967,"sha":"5f16362b7dafd04cd5acaa8d0b70d5a618e2e5a3","sha256":"9e6a58dd9f803a0fbe5f97ba36472ffff336f3a92e3989c54c4a50f51cf1c143"},"FIGURE_PROFESSIONAL_POSTER.jpeg":{"bytes":447418,"sha":"314d445c5d4cb1d94b84ba19282a338ea438eb32","sha256":"fe5af321bdf8f8f75bef7367c4fe49afc5239922f9477bb67bbaa14b552747e1"}}
      SOURCE_BLOBS_JSON: >-
        {"CLAIM_MATRIX.json":{"bytes":3981,"sha":"266f3fa6d245d99ad48c2d1d88d11ef116c7e88e","sha256":"b5136ba03543dcf1f5294e3f3535426a291a706f3389d862f77fd7e6d297c9c7"},"EPISTEMIC_TRIAD_DE.md":{"bytes":5186,"sha":"c386a1496b569a87efc0abefd2eb0e757a818a98","sha256":"c881c3b0fc628ab80152c9a91644df3b24e4c50475afdf4228ab1552d2e4cf69"},"EVIDENCE_BOUNDARY.md":{"bytes":3883,"sha":"528da892bc8e4c747369594c50d9350e78778b31","sha256":"d25cab1b0965e71f0af696e1ec2cfb019c9fcb11329e9da8bbb1983181fb8f56"},"NEGATIVE_AND_BOUNDARY_TESTS.json":{"bytes":3252,"sha":"2dad7b0373ad86ea60eb312d3b9e43d7eed56562","sha256":"81e8fa43bc404be39998e25edee8d1d1bd1ea6475d7b9fe6c3a3d731e9010494"},"PUBLICATION_ROUTING.json":{"bytes":3101,"sha":"f604d66e4f2faabc3ad7be6bf3028f07d2883a34","sha256":"8e12c9ef3c8188c798016fd2ccd662f7925cbb65a476363a06d09951a798c68a"},"README.md":{"bytes":2737,"sha":"dfd2ebd1fe72bad8258ef52fef8e6a1d7f1b15ea","sha256":"9fa1d2d41135ad9b55b8e2567c8747b4fb34555aec4cf07f5a7ff93b8880a112"},"SOURCE_FIGURE_INDEX.json":{"bytes":2018,"sha":"cae21c3daa247a66f2038d464aba55d6514eff86","sha256":"3e6eafecc7275ff161d2b3a2d043061224a1140c02f3c2478519c21f3c826307"}}
      EXPECTED_PATHS_JSON: >-
        ["REPOSITORY_FILE_MANIFEST.json","REPOSITORY_FILE_MANIFEST.json.sha256","SHA256SUMS.txt","docs/publications/2026-08-04-pre-spacetime-ontology/CLAIM_MATRIX.json","docs/publications/2026-08-04-pre-spacetime-ontology/EPISTEMIC_TRIAD_DE.md","docs/publications/2026-08-04-pre-spacetime-ontology/EVIDENCE_BOUNDARY.md","docs/publications/2026-08-04-pre-spacetime-ontology/FIGURE_ORIGINAL_SKETCH.jpeg","docs/publications/2026-08-04-pre-spacetime-ontology/FIGURE_PROFESSIONAL_POSTER.jpeg","docs/publications/2026-08-04-pre-spacetime-ontology/NEGATIVE_AND_BOUNDARY_TESTS.json","docs/publications/2026-08-04-pre-spacetime-ontology/PUBLICATION_ROUTING.json","docs/publications/2026-08-04-pre-spacetime-ontology/README.md","docs/publications/2026-08-04-pre-spacetime-ontology/SOURCE_FIGURE_INDEX.json"]

    steps:
      - name: Check out immutable current-main lease
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current-main and target-branch boundary
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git ls-remote --heads origin refs/heads/main | awk 'NR==1 {print $1}')"
          test "$observed" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "BLOCK: target branch already exists" >&2
            exit 2
          fi

      - name: Recover and verify the two exact source JPEG Git blobs
        env:
          GH_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_API_TOKEN']
          bundle = pathlib.Path(os.environ['BUNDLE'])
          bundle.mkdir(parents=True, exist_ok=True)
          sources = json.loads(os.environ['IMAGE_BLOBS_JSON'])

          for filename, binding in sorted(sources.items()):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{binding['sha']}",
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'qik-vrt-exact-image-blob-materializer/1.0',
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  value = json.load(response)
              raw = base64.b64decode(''.join(value['content'].split()), validate=True)
              digest = hashlib.sha256(raw).hexdigest()
              git_sha = hashlib.sha1(
                  f'blob {len(raw)}\0'.encode('ascii') + raw,
                  usedforsecurity=False,
              ).hexdigest()
              if (
                  value.get('sha') != binding['sha']
                  or len(raw) != binding['bytes']
                  or digest != binding['sha256']
                  or git_sha != binding['sha']
                  or not raw.startswith(b'\xff\xd8\xff')
                  or not raw.endswith(b'\xff\xd9')
              ):
                  raise SystemExit(f'BLOCK: exact image identity mismatch for {filename}')
              (bundle / filename).write_bytes(raw)
              print(json.dumps({
                  'filename': filename,
                  'bytes': len(raw),
                  'sha256': digest,
                  'git_blob_sha1': git_sha,
              }, sort_keys=True))
          PY

      - name: Recover and verify seven exact text sources
        env:
          GH_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_API_TOKEN']
          bundle = pathlib.Path(os.environ['BUNDLE'])
          sources = json.loads(os.environ['SOURCE_BLOBS_JSON'])

          for filename, binding in sorted(sources.items()):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{binding['sha']}",
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'qik-vrt-exact-text-blob-materializer/1.0',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = json.load(response)
              raw = base64.b64decode(''.join(value['content'].split()), validate=True)
              git_sha = hashlib.sha1(
                  f'blob {len(raw)}\0'.encode('ascii') + raw,
                  usedforsecurity=False,
              ).hexdigest()
              if (
                  value.get('sha') != binding['sha']
                  or len(raw) != binding['bytes']
                  or hashlib.sha256(raw).hexdigest() != binding['sha256']
                  or git_sha != binding['sha']
              ):
                  raise SystemExit(f'BLOCK: exact text identity mismatch for {filename}')
              (bundle / filename).write_bytes(raw)
          PY

      - name: Generate repository-native integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Run publication router and complete repository suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_publication_router.py "$BUNDLE" --json
          python3 -B -m unittest -v tests.test_publication_router
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Assert exact twelve-path projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          import subprocess

          expected = sorted(json.loads(os.environ['EXPECTED_PATHS_JSON']))
          status = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'],
          )
          records = [record for record in status.split(b'\0') if record]
          observed = sorted(record[3:].decode('utf-8') for record in records)
          if observed != expected or len(observed) != 12:
              raise SystemExit(
                  'BLOCK: exact twelve-path worktree mismatch\n'
                  f'expected={expected!r}\nobserved={observed!r}'
              )
          subprocess.run(['git', 'add', '--', *expected], check=True)
          staged = sorted(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True,
          ).splitlines())
          if staged != expected:
              raise SystemExit('BLOCK: staged path set drift')
          PY

      - name: Create and publish atomic current-main successor
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git ls-remote --heads origin refs/heads/main | awk 'NR==1 {print $1}')"
          test "$observed" = "$EXPECTED_MAIN"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "BLOCK: target branch appeared before atomic publication" >&2
            exit 2
          fi
          git config user.name "qik-vrt repository materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs(publication): add exact epistemic triad figures and evidence" \
            -m "Atomically persist the two exact owner-supplied JPEGs, seven bounded source texts, and deterministically regenerated repository-native integrity." \
            -m "No Zenodo, IETF, release, deployment, PASS, FINAL_PASS or EFFECT_ACK_DONE effect is claimed."
          candidate="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P "$candidate")" = "$EXPECTED_MAIN"
          test "$(git diff --name-only "$EXPECTED_MAIN" "$candidate" | wc -l | tr -d '[:space:]')" = '12'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "CANDIDATE_HEAD=$candidate"
