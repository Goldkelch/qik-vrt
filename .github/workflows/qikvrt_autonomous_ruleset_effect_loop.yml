name: QIKVRT autonomous ruleset effect loop

on:
  workflow_run:
    workflows:
      - "QIKVRT required code-owner review"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Exact open main-based pull request number"
        required: true
        type: string
      expected_head:
        description: "Exact current pull-request head SHA"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: qikvrt-autonomous-ruleset-effect-loop-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile-and-reobserve:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      REQUESTED_PR: ${{ inputs.pr || '' }}
      REQUESTED_HEAD: ${{ inputs.expected_head || '' }}
      REVIEW_STATUS_CONTEXT: QIKVRT required code-owner review
      EFFECT_STATUS_CONTEXT: QIKVRT autonomous ruleset repair
      EFFECT_ROOT: /tmp/qikvrt-autonomous-ruleset-effect

    steps:
      - name: Check out exact trusted Main implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Select exact ruleset-repair subject and active carriers
        id: select
        shell: bash
        run: |
          set -euo pipefail
          root="$EFFECT_ROOT"
          rm -rf "$root"
          mkdir -p "$root/artifact"
          python3 -B - <<'PY'
          import json, os, pathlib, re, subprocess
          root=pathlib.Path(os.environ['EFFECT_ROOT']); repo=os.environ['REPOSITORY']
          def gh(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          def save(name,value): (root/name).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          def noop(blocker,**extra):
              save('preselection.json',{'schema':'qikvrt_autonomous_ruleset_effect_preselection_v4','state':'NOOP','first_blocker':blocker,**extra}); raise SystemExit(0)
          checkout=subprocess.check_output(['git','rev-parse','--verify','HEAD^{commit}'],text=True).strip()
          live_main=gh(f'repos/{repo}/commits/main').get('sha')
          if not re.fullmatch(r'[0-9a-f]{40}',str(live_main or '')): noop('TRUSTED_MAIN_READBACK_INVALID')
          if checkout != live_main: noop('TRUSTED_MAIN_DRIFT_BEFORE_SELECTION',checkout_head=checkout,observed_main=live_main)
          if os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch':
              number=os.environ.get('REQUESTED_PR','').strip(); head=os.environ.get('REQUESTED_HEAD','').strip()
              if not number.isdigit() or int(number)<=0: noop('MANUAL_PR_NUMBER_INVALID')
              if not re.fullmatch(r'[0-9a-f]{40}',head): noop('MANUAL_EXPECTED_HEAD_INVALID')
              save('preselection.json',{'schema':'qikvrt_autonomous_ruleset_effect_preselection_v4','state':'MANUAL_CANDIDATE','first_blocker':None,'pr_number':int(number),'expected_head':head,'trusted_main_sha':live_main}); raise SystemExit(0)
          noop('AUTOMATIC_SELECTION_REQUIRES_DISPATCH_BRIDGE')
          PY
          python3 -B - <<'PY'
          import json, os, pathlib, re, subprocess
          root=pathlib.Path(os.environ['EFFECT_ROOT']); repo=os.environ['REPOSITORY']; context=os.environ['REVIEW_STATUS_CONTEXT']
          pre=json.loads((root/'preselection.json').read_text())
          def gh(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          def pages(path):
              raw=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',path],text=True)); out=[]
              for page in raw: out.extend(page if isinstance(page,list) else [page])
              return out
          def save(v): (root/'selection.json').write_text(json.dumps(v,indent=2,sort_keys=True)+'\n')
          if pre.get('state')!='MANUAL_CANDIDATE': save({'schema':'qikvrt_autonomous_ruleset_effect_selection_v4','state':'NOOP','first_blocker':pre.get('first_blocker') or 'PRESELECTION_NOOP'}); raise SystemExit(0)
          number=pre['pr_number']; expected=pre['expected_head']; pull=gh(f'repos/{repo}/pulls/{number}'); h=pull.get('head') or {}; b=pull.get('base') or {}; ref=h.get('ref')
          if pull.get('state')!='open' or b.get('ref')!='main' or h.get('repo',{}).get('full_name')!=repo or h.get('sha')!=expected or not ref:
              save({'schema':'qikvrt_autonomous_ruleset_effect_selection_v4','state':'NOOP','first_blocker':'EXACT_SUBJECT_DRIFT','pr_number':number,'expected_head':expected,'observed_head':h.get('sha')}); raise SystemExit(0)
          branch=(gh(f'repos/{repo}/git/ref/heads/{ref}').get('object') or {}).get('sha')
          if branch!=expected: save({'schema':'qikvrt_autonomous_ruleset_effect_selection_v4','state':'NOOP','first_blocker':'EXACT_HEAD_BRANCH_DRIFT'}); raise SystemExit(0)
          matching=[s for s in pages(f'repos/{repo}/commits/{expected}/statuses?per_page=100') if s.get('context')==context and s.get('state')=='failure' and s.get('description')=='failure: CODE_OWNER_RULE_NOT_ENFORCED']
          if not matching: save({'schema':'qikvrt_autonomous_ruleset_effect_selection_v4','state':'NOOP','first_blocker':'EXACT_RULESET_BLOCKER_STATUS_MISSING'}); raise SystemExit(0)
          main=gh(f'repos/{repo}/commits/main').get('sha')
          if main!=pre['trusted_main_sha']: save({'schema':'qikvrt_autonomous_ruleset_effect_selection_v4','state':'NOOP','first_blocker':'TRUSTED_MAIN_DRIFT_AFTER_SELECTION'}); raise SystemExit(0)
          save({'schema':'qikvrt_autonomous_ruleset_effect_selection_v4','state':'CANDIDATE','first_blocker':'CODE_OWNER_RULE_NOT_ENFORCED','pr_number':number,'head_sha':expected,'head_ref':ref,'head_branch_sha':branch,'trusted_main_sha':main,'status_id':matching[-1].get('id'),'predecessor_evidence_transfer':False})
          PY
          cat "$root/selection.json"
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          v=json.load(open(os.path.join(os.environ['EFFECT_ROOT'],'selection.json')))
          for key,out in [('state','state'),('pr_number','pr'),('head_sha','head'),('head_ref','head_ref'),('trusted_main_sha','main'),('first_blocker','blocker')]: print(f"{out}={v.get(key) or ''}")
          PY

      - name: Reconcile full normative ruleset and classify continuation
        id: reconcile
        if: steps.select.outputs.state == 'CANDIDATE'
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.select.outputs.head }}
          HEAD_REF: ${{ steps.select.outputs.head_ref }}
          EXPECTED_MAIN: ${{ steps.select.outputs.main }}
          QIKVRT_RULESET_ADMIN_TOKEN: ${{ secrets.QIKVRT_RULESET_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          root="$EFFECT_ROOT"
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_MAIN"
          test "$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_MAIN"
          test "$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$EXPECTED_HEAD"
          test "$(gh api "repos/${REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)" = "$EXPECTED_HEAD"
          gh api "repos/${REPOSITORY}/rulesets/19344903" > "$root/live-ruleset-before.json"
          python3 -B tools/qikvrt_ruleset_reconcile.py --snapshot "$root/live-ruleset-before.json" --receipt "$root/preflight-receipt.json" || true
          preflight_state="$(jq -r .state "$root/preflight-receipt.json")"
          if [ "$preflight_state" = CURRENT ]; then
            cp "$root/preflight-receipt.json" "$root/effect-receipt.json"
          elif [ -z "${QIKVRT_RULESET_ADMIN_TOKEN:-}" ]; then
            jq '. + {state:"REQUEST_AUTHORITY",first_blocker:"QIKVRT_RULESET_ADMIN_TOKEN_UNAVAILABLE",next_action:"ROUTE_RULESET_ADMIN_AUTHORITY_THROUGH_ACTIVE_PR",continuation_required:true,mutation:"NONE",effect_observed:false}' "$root/preflight-receipt.json" > "$root/effect-receipt.json"
          else
            GH_TOKEN="$QIKVRT_RULESET_ADMIN_TOKEN" QIKVRT_RULESET_ADMIN_TOKEN="$QIKVRT_RULESET_ADMIN_TOKEN" python3 -B tools/qikvrt_ruleset_reconcile.py --apply --receipt "$root/effect-receipt.json" || true
          fi
          cat "$root/effect-receipt.json"
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          v=json.load(open(os.path.join(os.environ['EFFECT_ROOT'],'effect-receipt.json')))
          print(f"state={v.get('state') or ''}"); print(f"blocker={v.get('first_blocker') or ''}"); print(f"mutation={v.get('mutation') or ''}"); print(f"effect_observed={'true' if v.get('effect_observed') else 'false'}")
          PY

      - name: Preserve exact selection and effect receipts
        if: always() && steps.select.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-autonomous-ruleset-effect-${{ github.run_id }}-${{ steps.select.outputs.state }}
          path: /tmp/qikvrt-autonomous-ruleset-effect
          if-no-files-found: error
          retention-days: 90
