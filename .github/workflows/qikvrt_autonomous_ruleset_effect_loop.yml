            fi
            if [ "$live_main" != "$EXPECTED_MAIN" ] \
              || [ "$branch_head" != "$EXPECTED_HEAD" ]; then
              emit_subject_hold "${blocker}_REF_DRIFT"
              return 1
            fi
          }

          if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_BEFORE_AUTHORITY_CONTINUATION"; then
            exit 2
          fi

          detail="${BLOCKER:-RULESET_ADMIN_AUTHORITY_REQUIRED}"
          fingerprint="$(printf '%s\0%s\0%s\0%s\0%s' \
            "$REPOSITORY" "$PR_NUMBER" "$EXPECTED_HEAD" "$EXPECTED_MAIN" "$detail" \
            | sha256sum | cut -d' ' -f1)"
          marker="<!-- qikvrt-ruleset-authority:${fingerprint} -->"
          body="${marker}
          REQUEST_AUTHORITY is a nonterminal repository continuation.

          Exact subject: #${PR_NUMBER}@${EXPECTED_HEAD}
          Exact work branch: ${HEAD_REF}@${EXPECTED_HEAD}
          Exact trusted Main: ${EXPECTED_MAIN}
          First blocker: ${detail}
          Next action: route the ruleset-administration effect through this active PR/branch and reobserve the same exact subject.

          HOLD_ADMISSIBLE=false because an open pull request and its work branch are authoritative active carriers. This comment is a deduplicated issue_comment control event; it is not approval, merge, publication, PASS, FINAL_PASS, empirical confirmation, or EFFECT_ACK_DONE."

          if comments="$(gh_read --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"; then
            :
          else
            rc=$?
            emit_read_failure "$rc" "EXACT_SUBJECT_DRIFT_BEFORE_AUTHORITY_COMMENTS_GET_FAILED"
            exit 2
          fi
          if ! comment_id="$(jq -r --arg marker "$marker" \
            '[.[][] | select(
              (.user.login // "") == "github-actions[bot]" and
              ((.body // "") | contains($marker))
            )] | sort_by(.id) | last | .id // empty' \
            <<<"$comments")"; then
            emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_AUTHORITY_COMMENTS_MALFORMED"
            exit 2
          fi
          if [ -n "$comment_id" ] && ! [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]; then
            emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_AUTHORITY_COMMENTS_MALFORMED"
            exit 2
          fi
          created=false
          if [ -z "$comment_id" ]; then
            if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_IMMEDIATELY_BEFORE_AUTHORITY_COMMENT_POST"; then
              exit 2
            fi
            if ! append_effect_attempt \
              --kind issue_comment_post_intent \
              --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --mutation POST \
              --effect-transport-attempted true \
              --transport-outcome ATTEMPTED_PENDING_READBACK \
              --effect-observed false \
              --evidence-ref "post-intent:authority-comment:${fingerprint}" >/dev/null; then
              emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
              exit 2
            fi
            mutation_error="$root/authority-comment-post.stderr"
            if comment_id="$(jq -n --arg body "$body" '{body:$body}' \
              | gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --input - --jq .id 2>"$mutation_error")"; then
              if ! [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]; then
                append_effect_attempt \
                  --kind issue_comment_post \
                  --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --mutation POST_UNCONFIRMED_RESPONSE_MALFORMED \
                  --effect-transport-attempted true \
                  --transport-outcome UNCONFIRMED_RESPONSE_MALFORMED \
                  --effect-observed false \
                  --evidence-ref post-response:authority-comment-id-malformed >/dev/null \
                  || { emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"; exit 2; }
                emit_subject_hold "POST_UNCONFIRMED_RESPONSE_MALFORMED"
                exit 2
              fi
              if ! append_effect_attempt \
                --kind issue_comment_post \
                --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --mutation POST \
                --effect-transport-attempted true \
                --transport-outcome ACKED \
                --effect-observed false \
                --evidence-ref "post-response:authority-comment:${comment_id}" >/dev/null; then
                emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
                exit 2
              fi
            else
              if grep -Fq "API rate limit exceeded for installation" "$mutation_error"; then
                append_effect_attempt \
                  --kind issue_comment_post \
                  --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --mutation POST_UNCONFIRMED_RATE_LIMIT \
                  --effect-transport-attempted true \
                  --transport-outcome UNCONFIRMED_RATE_LIMIT \
                  --effect-observed false \
                  --evidence-ref post-stderr:installation-rate-limit >/dev/null \
                  || { emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"; exit 2; }
                emit_subject_hold "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
              else
                append_effect_attempt \
                  --kind issue_comment_post \
                  --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --mutation POST_UNCONFIRMED_TRANSPORT_FAILED \
                  --effect-transport-attempted true \
                  --transport-outcome UNCONFIRMED_TRANSPORT_FAILED \
                  --effect-observed false \
                  --evidence-ref post-stderr:transport-failure >/dev/null \
                  || { emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"; exit 2; }
                emit_subject_hold "POST_UNCONFIRMED_TRANSPORT_FAILED"
              fi
              exit 2
            fi
            created=true
          fi

          if readback="$(gh_read "repos/${REPOSITORY}/issues/comments/${comment_id}")"; then
            :
          else
            rc=$?
            if [ "$created" = true ]; then
              if [ "$rc" -eq 75 ]; then
                emit_subject_hold "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
              else
                emit_subject_hold "POST_UNCONFIRMED_READBACK_FAILED"
              fi
            else
              emit_read_failure "$rc" "EXACT_SUBJECT_DRIFT_BEFORE_AUTHORITY_READBACK_GET_FAILED"
            fi
            exit 2
          fi
          if [ "$(jq -r .id <<<"$readback")" != "$comment_id" ] \
            || [ "$(jq -r .user.login <<<"$readback")" != "github-actions[bot]" ] \
            || ! jq -e --arg marker "$marker" '(.body // "") | contains($marker)' \
              <<<"$readback" >/dev/null; then
            if [ "$created" = true ]; then
              emit_subject_hold "POST_UNCONFIRMED_READBACK_MALFORMED"
            else
              emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_AUTHORITY_READBACK_MALFORMED"
            fi
            exit 2
          fi

          if ! append_effect_attempt \
            --kind issue_comment_readback \
            --endpoint-or-subject "repos/${REPOSITORY}/issues/comments/${comment_id}" \
            --mutation NONE \
            --effect-transport-attempted false \
            --transport-outcome OBSERVED_READBACK \
            --effect-observed true \
            --evidence-ref "readback:authority-comment:${comment_id}" >/dev/null; then
            emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
            exit 2
          fi

          if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_IMMEDIATELY_BEFORE_AUTHORITY_STATUS"; then
            exit 2
          fi
          if status_snapshot="$(gh_read --paginate --slurp \
            "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}?per_page=100")"; then
            :
          else
            rc=$?
            emit_read_failure "$rc" "EXACT_SUBJECT_DRIFT_BEFORE_AUTHORITY_STATUS_READBACK_GET_FAILED"
            exit 2
          fi
          if ! existing_status_id="$(printf '%s' "$status_snapshot" \
            | python3 -B tools/qikvrt_effect_attempts.py status-id \
              --sha "$EXPECTED_HEAD" \
              --context "$EFFECT_STATUS_CONTEXT" \
              --state pending)"; then
            emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_AUTHORITY_STATUS_READBACK_MALFORMED"
            exit 2
          fi
          if [ -n "$existing_status_id" ] && ! [[ "$existing_status_id" =~ ^[1-9][0-9]*$ ]]; then
            emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_AUTHORITY_STATUS_READBACK_MALFORMED"
            exit 2
          fi
          if [ -n "$existing_status_id" ]; then
            if ! append_effect_attempt \
              --kind commit_status_readback \
              --endpoint-or-subject "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}?per_page=100" \
              --mutation NONE \
              --effect-transport-attempted false \
              --transport-outcome OBSERVED_READBACK \
              --effect-observed true \
              --evidence-ref "readback:authority-status:${existing_status_id}" >/dev/null; then
              emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
              exit 2
            fi
          else
            if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_IMMEDIATELY_BEFORE_AUTHORITY_STATUS_POST"; then
              exit 2
            fi
            if ! append_effect_attempt \
            --kind commit_status_post_intent \
            --endpoint-or-subject "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" \
            --mutation POST \
            --effect-transport-attempted true \
            --transport-outcome ATTEMPTED_PENDING_READBACK \
            --effect-observed false \
            --evidence-ref "post-intent:authority-status:${EFFECT_STATUS_CONTEXT}" >/dev/null; then
            emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
            exit 2
            fi
            mutation_error="$root/authority-status-post.stderr"
            if status_response="$(gh api --method POST "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" \
            -f state=pending \
            -f context="$EFFECT_STATUS_CONTEXT" \
            -f description="REQUEST_AUTHORITY; active PR/branch; HOLD inadmissible" \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            2>"$mutation_error")"; then
            if ! jq -e \
              --arg sha "$EXPECTED_HEAD" \
              --arg state pending \
              --arg context "$EFFECT_STATUS_CONTEXT" \
              '(.id | type == "number") and .sha == $sha and .state == $state and .context == $context' \
              <<<"$status_response" >/dev/null; then
              append_effect_attempt \
                --kind commit_status_post \
                --endpoint-or-subject "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" \
                --mutation POST_UNCONFIRMED_RESPONSE_MALFORMED \
                --effect-transport-attempted true \
                --transport-outcome UNCONFIRMED_RESPONSE_MALFORMED \
                --effect-observed false \
                --evidence-ref post-response:authority-status-malformed >/dev/null \
                || { emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"; exit 2; }
              emit_subject_hold "POST_UNCONFIRMED_RESPONSE_MALFORMED"
              exit 2
            fi
            if ! append_effect_attempt \
              --kind commit_status_post \
              --endpoint-or-subject "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" \
              --mutation POST \
              --effect-transport-attempted true \
              --transport-outcome ACKED \
              --effect-observed true \
              --evidence-ref "post-response:authority-status:$(jq -r .id <<<"$status_response")" >/dev/null; then
              emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
              exit 2
            fi
            else
              if grep -Fq "API rate limit exceeded for installation" "$mutation_error"; then
              append_effect_attempt \
                --kind commit_status_post \
                --endpoint-or-subject "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" \
                --mutation POST_UNCONFIRMED_RATE_LIMIT \
                --effect-transport-attempted true \
                --transport-outcome UNCONFIRMED_RATE_LIMIT \
                --effect-observed false \
                --evidence-ref post-stderr:installation-rate-limit >/dev/null \
                || { emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"; exit 2; }
              emit_subject_hold "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
              else
              append_effect_attempt \
                --kind commit_status_post \
                --endpoint-or-subject "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" \
                --mutation POST_UNCONFIRMED_TRANSPORT_FAILED \
                --effect-transport-attempted true \
                --transport-outcome UNCONFIRMED_TRANSPORT_FAILED \
                --effect-observed false \
                --evidence-ref post-stderr:transport-failure >/dev/null \
                || { emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"; exit 2; }
              emit_subject_hold "POST_UNCONFIRMED_TRANSPORT_FAILED"
              fi
              exit 2
            fi
          fi

          if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_AFTER_AUTHORITY_STATUS"; then
            exit 2
          fi

          jq -n \
            --argjson comment_id "$comment_id" \
            --argjson created "$created" \
            --arg repository "$REPOSITORY" \
            --arg pr "$PR_NUMBER" \
            --arg head "$EXPECTED_HEAD" \
            --arg head_ref "$HEAD_REF" \
            --arg main "$EXPECTED_MAIN" \
            --arg upstream "$UPSTREAM_RUN_ID" \
            --arg bridge "$BRIDGE_RUN_ID" \
            --arg recovery "$RECOVERY_MODE" \
            --arg recovery_of "$RECOVERY_OF_EFFECT_RUN_ID" \
            --arg blocker "$detail" \
            --argjson effect_attempts "$(effect_attempts)" \
            --argjson effect_transport_attempted "$(effect_summary | jq -r .effect_transport_attempted)" \
            --arg mutation "$(effect_summary | jq -r .mutation)" \
            --argjson effect_observed "$(effect_summary | jq -r .effect_observed)" \
            '{
              schema: "qikvrt_ruleset_authority_continuation_readback_v1",
              state: "REQUEST_AUTHORITY",
              repository:$repository,
              subject_mode:"PR",
              hold_admissible: false,
              verification_state:"REQUEST_AUTHORITY_ACTIVE",
              continuation_required:true,
              pr_number: ($pr | tonumber),
              head_sha: $head,
              head_ref: $head_ref,
              trusted_main_sha: $main,
              upstream_run_id:(if ($upstream | test("^[1-9][0-9]*$")) then ($upstream | tonumber) else null end),
              bridge_run_id:(if ($bridge | test("^[1-9][0-9]*$")) then ($bridge | tonumber) else null end),
              recovery_mode:$recovery,
              recovery_of_effect_run_id:(if ($recovery_of | test("^[1-9][0-9]*$")) then ($recovery_of | tonumber) else null end),
              first_blocker: $blocker,
              comment_id: $comment_id,
              comment_created: $created,
              mutation: $mutation,
              effect_transport_attempted: $effect_transport_attempted,
              effect_observed: $effect_observed,
              effect_attempts: $effect_attempts,
              issue_comment_readback: true,
              exact_subject_readback: true,
              full_exact_subject_verified: true,
              predecessor_evidence_transfer: false
            }' > "$root/continuation-readback.json"
          cat "$root/continuation-readback.json"

      - name: Normalize every terminal Main reconciliation into a stable recovery receipt
        # The scheduled Main carrier uses this artifact as its durable subject
        # memory.  It must exist even when a later status/comment/readback
        # step fails, otherwise a terminal run can only be rediscovered by an
        # ever-growing Actions-run history.
        if: always() && inputs.mode == 'MAIN'
        env:
          REQUESTED_MAIN: ${{ inputs.expected_main || '' }}
          REQUESTED_POLICY_SHA: ${{ inputs.expected_policy_sha || '' }}
          REQUESTED_MAIN_CARRIER_RUN_ID: ${{ inputs.main_carrier_run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ["EFFECT_ROOT"])
          main = os.environ["REQUESTED_MAIN"]
          policy = os.environ["REQUESTED_POLICY_SHA"]
          carrier = os.environ["REQUESTED_MAIN_CARRIER_RUN_ID"]
          repository = os.environ["REPOSITORY"]

          # Invalid manual inputs never share a scheduled carrier's stable
          # artifact identity.  Preserve the ordinary artifact for diagnosis,
          # but do not manufacture a recovery subject from them.
          if not re.fullmatch(r"[0-9a-f]{40}", main) or not re.fullmatch(r"[0-9a-f]{64}", policy):
              print("MAIN_RECOVERY_RECEIPT_SKIPPED_INVALID_INPUT")
              raise SystemExit(0)

          raw = {}
          source = None
          for candidate in ("main-reconciliation-receipt.json", "continuation-receipt.json", "selection.json"):
              path = root / candidate
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if isinstance(value, dict):
                  raw = value
                  source = candidate
                  break

          raw_state = raw.get("state")
          exact_current = (
              raw.get("schema") == "qikvrt_ruleset_main_reconciliation_receipt_v1"
              and raw_state == "CURRENT"
              and raw.get("subject_mode") == "MAIN"
              and raw.get("trusted_main_sha") == main
              and raw.get("policy_sha256") == policy
              and raw.get("full_exact_subject_verified") is True
          )
          transport = raw.get("effect_transport_attempted")
          observed = raw.get("effect_observed")
          mutation = raw.get("mutation")
          carrier_id = int(carrier) if re.fullmatch(r"[1-9][0-9]*", carrier) else None
          value = {
              "schema": "qikvrt_ruleset_main_reconciliation_receipt_v1",
              "reconciliation_schema": raw.get("schema"),
              "repository": repository,
              "subject_mode": "MAIN",
              "trusted_main_sha": main,
              "policy_sha256": policy,
              "main_carrier_run_id": carrier_id,
              "mutation": mutation if isinstance(mutation, str) and mutation else "NONE",
              "effect_transport_attempted": transport if isinstance(transport, bool) else False,
              "effect_observed": observed if isinstance(observed, bool) else False,
              "effect_attempts": raw.get("effect_attempts") if isinstance(raw.get("effect_attempts"), list) else [],
              "predecessor_evidence_transfer": False,
              "source_receipt": source,
          }
          if exact_current:
              value.update({
                  "state": "CURRENT",
                  "verification_state": "EXACT_SUBJECT_CURRENT",
                  "full_exact_subject_verified": True,
                  "continuation_required": False,
                  "first_blocker": None,
              })
          else:
              blocker = raw.get("first_blocker") if isinstance(raw.get("first_blocker"), str) and raw.get("first_blocker") else "TERMINAL_MAIN_RECONCILIATION_UNVERIFIED"
              next_action = "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT"
              value.update({
                  "state": "HOLD",
                  "verification_state": "HOLD_UNVERIFIED",
                  "full_exact_subject_verified": False,
                  "d0": 2,
                  "continuation_required": True,
                  "first_blocker": blocker,
                  "next_action": next_action,
                  "hold_reason": {
                      "reason_code": blocker,
                      "reason": "A terminal Main reconciliation did not preserve a fully verified CURRENT receipt; the scheduled carrier must rebind Main and retry only through the read-before-apply effect workflow.",
                      "subject": {"repository": repository, "kind": "commit", "identifier": "main", "head_sha": main},
                      "evidence_refs": ["workflow-run:" + os.environ.get("GITHUB_RUN_ID", "unbound"), "ruleset-effect:terminal-main-envelope"],
                      "owner": {"role": "EXACT_SUBJECT_OBSERVER", "actor": "qikvrt-autonomous-ruleset-effect-loop"},
                      "retry_condition": {"event": "NEXT_SCHEDULED_MAIN_CARRIER", "predicate": "the Main ref, policy and prior terminal receipt are rebound before one read-before-apply retry"},
                      "next_action": next_action,
                      "d0": 2,
                  },
              })
          (root / "main-reconciliation-receipt.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(value, sort_keys=True))
          PY

      - name: Normalize every terminal PR continuation into the recovery envelope
        if: >-
          always() &&
          steps.select.outputs.state == 'CANDIDATE' &&
          steps.select.outputs.mode == 'PR'
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.select.outputs.head }}
          HEAD_REF: ${{ steps.select.outputs.head_ref }}
          EXPECTED_MAIN: ${{ steps.select.outputs.main }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id || '' }}
          BRIDGE_RUN_ID: ${{ inputs.bridge_run_id || '' }}
          RECOVERY_MODE: ${{ inputs.recovery_mode || 'APPLY' }}
          RECOVERY_OF_EFFECT_RUN_ID: ${{ inputs.recovery_of_effect_run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ["EFFECT_ROOT"])
          destination = root / "continuation-receipt.json"
          repository = os.environ["REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          head = os.environ["EXPECTED_HEAD"]
          head_ref = os.environ["HEAD_REF"]
          main = os.environ["EXPECTED_MAIN"]
          upstream = os.environ["UPSTREAM_RUN_ID"]
          bridge = os.environ["BRIDGE_RUN_ID"]
          recovery_mode = os.environ["RECOVERY_MODE"]
          recovery_of = os.environ["RECOVERY_OF_EFFECT_RUN_ID"]

          def positive(value, label):
              if not re.fullmatch(r"[1-9][0-9]*", value):
                  raise SystemExit(f"{label} is not a positive integer")
              return int(value)

          if not re.fullmatch(r"[0-9a-f]{40}", head) or not re.fullmatch(r"[0-9a-f]{40}", main):
              raise SystemExit("terminal PR recovery envelope has invalid exact SHA inputs")
          if recovery_mode not in {"APPLY", "REOBSERVE_UNCONFIRMED"}:
              raise SystemExit("terminal PR recovery envelope has invalid recovery mode")
          if recovery_mode == "REOBSERVE_UNCONFIRMED" and not recovery_of:
              raise SystemExit("GET-only recovery omitted its uncertain origin")

          try:
              raw = json.loads(destination.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              raw = {}
          if not isinstance(raw, dict):
              raw = {}

          transport = raw.get("effect_transport_attempted")
          observed = raw.get("effect_observed")
          raw_state = raw.get("state")
          source_schema = raw.get("schema")
          exact = raw.get("full_exact_subject_verified") is True
          state = raw_state if raw_state in {"CURRENT", "APPLIED", "REQUEST_AUTHORITY", "HOLD"} else "HOLD"
          # A post-reconcile comment/status error may have occurred after the
          # initial selection, but before a final exact-subject readback.  The
          # next bridge must therefore rebind the PR before the classifier can
          # choose a fresh APPLY or a GET-only recovery.
          needs_rebind = state == "HOLD" and not exact
          if state in {"CURRENT", "APPLIED", "REQUEST_AUTHORITY"} and not exact:
              state = "HOLD"
              needs_rebind = True

          value = dict(raw)
          value.update(
              {
                  "schema": "qikvrt_ruleset_effect_continuation_receipt_v1",
                  "reconciliation_schema": source_schema,
                  "repository": repository,
                  "subject_mode": "PR",
                  "pr_number": positive(pr, "PR_NUMBER"),
                  "head_sha": head,
                  "head_ref": head_ref,
                  "trusted_main_sha": main,
                  "upstream_run_id": positive(upstream, "UPSTREAM_RUN_ID"),
                  "bridge_run_id": positive(bridge, "BRIDGE_RUN_ID"),
                  "recovery_mode": recovery_mode,
                  "recovery_of_effect_run_id": (
                      positive(recovery_of, "RECOVERY_OF_EFFECT_RUN_ID")
                      if recovery_of
                      else None
                  ),
                  "state": state,
                  "mutation": raw.get("mutation") if isinstance(raw.get("mutation"), str) and raw.get("mutation") else "NONE",
                  "effect_transport_attempted": transport if isinstance(transport, bool) else False,
                  "effect_observed": observed if isinstance(observed, bool) else False,
                  "full_exact_subject_verified": exact,
                  "recovery_rebind_required": needs_rebind,
              }
          )
          if state == "REQUEST_AUTHORITY":
              value.update(
                  {
                      "verification_state": "REQUEST_AUTHORITY_ACTIVE",
                      "continuation_required": True,
                      "hold_admissible": False,
                      "first_blocker": raw.get("first_blocker") if isinstance(raw.get("first_blocker"), str) and raw.get("first_blocker") else "RULESET_ADMIN_AUTHORITY_REQUIRED",
                      "next_action": raw.get("next_action") if isinstance(raw.get("next_action"), str) and raw.get("next_action") else "ROUTE_RULESET_ADMIN_AUTHORITY_THROUGH_ACTIVE_PR",
                  }
              )
          if state == "HOLD":
              blocker = raw.get("first_blocker") if isinstance(raw.get("first_blocker"), str) and raw.get("first_blocker") else "TERMINAL_CONTINUATION_RECEIPT_UNVERIFIED"
              next_action = "REOBSERVE_EXACT_PR_SUBJECT_AND_EFFECT_RUN_BEFORE_ANY_RULESET_EFFECT_DISPATCH"
              hold_reason = raw.get("hold_reason")
              if not isinstance(hold_reason, dict) or hold_reason.get("d0") != 2:
                  hold_reason = {}
              value.update(
                  {
                      "verification_state": "HOLD_UNVERIFIED",
                      "d0": 2,
                      "continuation_required": True,
                      "first_blocker": blocker,
                      "next_action": next_action,
                      "hold_reason": {
                          "reason_code": hold_reason.get("reason_code") if isinstance(hold_reason.get("reason_code"), str) and hold_reason.get("reason_code") else blocker,
                          "reason": hold_reason.get("reason") if isinstance(hold_reason.get("reason"), str) and hold_reason.get("reason") else "A terminal ruleset continuation could not be fully reobserved; the next bridge must rebind the exact PR before any recovery decision.",
                          "subject": {"repository": repository, "kind": "pull_request", "number": positive(pr, "PR_NUMBER"), "head_sha": head},
                          "evidence_refs": hold_reason.get("evidence_refs") if isinstance(hold_reason.get("evidence_refs"), list) and hold_reason.get("evidence_refs") else ["workflow-run:" + os.environ.get("GITHUB_RUN_ID", "unbound"), "ruleset-effect:terminal-envelope"],
                          "owner": {"role": "EXACT_SUBJECT_OBSERVER", "actor": "qikvrt-autonomous-ruleset-effect-loop"},
                          "retry_condition": {"event": "SCHEDULED_RULESET_PR_CARRIER", "predicate": "the bridge rebinds the same open PR head and classifies this immutable terminal receipt"},
                          "next_action": next_action,
                          "d0": 2,
                      },
                  }
              )
          destination.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(value, sort_keys=True))
          PY

      - name: Preserve exact selection, effect, continuation, and readback receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Artifacts remain immutable per run.  The scheduled Main carrier
          # binds the newest exact terminal run before reading its artifact;
          # therefore recovery never relies on undocumented cross-run
          # overwrite behavior for identically named artifacts.
          name: qikvrt-autonomous-ruleset-effect-${{ github.run_id }}-${{ steps.select.outputs.state }}
          path: /tmp/qikvrt-autonomous-ruleset-effect
          if-no-files-found: error
          retention-days: 90
