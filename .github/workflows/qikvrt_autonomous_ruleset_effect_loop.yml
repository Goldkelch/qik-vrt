              mutation: $mutation,
              effect_transport_attempted: $effect_transport_attempted,
              effect_observed: $effect_observed,
              effect_attempts: $effect_attempts,
              receipt_comment_id: $comment_id,
              comment_created: $created,
              exact_subject_readback: true,
              full_exact_subject_verified: true
          }' > "$root/completed-apply-receipt.json"
          cat "$root/completed-apply-receipt.json"

      - name: Publish exact non-feedback ruleset-current status
        if: >-
