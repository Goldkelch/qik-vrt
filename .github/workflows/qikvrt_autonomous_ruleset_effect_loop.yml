              emit_subject_hold "POST_UNCONFIRMED_TRANSPORT_FAILED"
              fi
              exit 2
            fi
          fi
          if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_AFTER_SUCCESS_STATUS"; then
