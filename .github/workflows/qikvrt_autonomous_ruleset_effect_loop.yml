name: QIKVRT autonomous ruleset effect loop
run-name: QIKVRT ruleset effect mode=${{ inputs.mode || 'unbound' }} pr=${{ inputs.pr || 'none' }} head=${{ inputs.expected_head || inputs.expected_main || 'unbound' }} upstream=${{ inputs.upstream_run_id || 'unbound' }} bridge=${{ inputs.bridge_run_id || 'unbound' }} carrier=${{ inputs.main_carrier_run_id || 'unbound' }} recovery=${{ inputs.recovery_mode || 'APPLY' }} recovery_of=${{ inputs.recovery_of_effect_run_id || 'none' }} policy=${{ inputs.mode == 'MAIN' && inputs.expected_policy_sha || 'none' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Exact subject mode: PR or MAIN"
        required: true
        type: choice
        options: [PR, MAIN]
      pr:
        description: "Exact open main-based pull request number"
        required: false
        type: string
      expected_head:
        description: "Exact current pull-request head SHA"
        required: false
        type: string
      expected_main:
        description: "Exact trusted Main SHA for MAIN reconciliation"
        required: false
        type: string
      expected_policy_sha:
        description: "Exact policy SHA-256 for MAIN reconciliation"
        required: false
        type: string
      upstream_run_id:
        description: "Exact required-review run that carried this PR effect subject"
        required: false
        type: string
      bridge_run_id:
        description: "Immutable bridge run that created this one effect attempt"
        required: false
        type: string
      main_carrier_run_id:
        description: "Immutable scheduled watchdog run that created this Main effect attempt"
        required: false
        type: string
      recovery_mode:
        description: "APPLY performs one conditional reconcile; REOBSERVE_UNCONFIRMED permits GET-only recovery."
        required: false
        type: choice
        options: [APPLY, REOBSERVE_UNCONFIRMED]
      recovery_of_effect_run_id:
        description: "Exact terminal effect run whose evidence requires this follow-up carrier"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: qikvrt-autonomous-ruleset-effect-loop-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile-and-reobserve:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      # Ordinary evidence, comment, status, and dispatch calls use the job's
      # least-privilege token.  The Administration token is scoped to the
      # single reconciliation step below.
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUESTED_MODE: ${{ inputs.mode || '' }}
      REQUESTED_PR: ${{ inputs.pr || '' }}
      REQUESTED_HEAD: ${{ inputs.expected_head || '' }}
      REQUESTED_MAIN: ${{ inputs.expected_main || '' }}
      REQUESTED_POLICY_SHA: ${{ inputs.expected_policy_sha || '' }}
      REQUESTED_UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id || '' }}
      REQUESTED_BRIDGE_RUN_ID: ${{ inputs.bridge_run_id || '' }}
      REQUESTED_MAIN_CARRIER_RUN_ID: ${{ inputs.main_carrier_run_id || '' }}
      RECOVERY_MODE: ${{ inputs.recovery_mode || 'APPLY' }}
      RECOVERY_OF_EFFECT_RUN_ID: ${{ inputs.recovery_of_effect_run_id || '' }}
      REVIEW_STATUS_CONTEXT: QIKVRT required code-owner review
      EFFECT_STATUS_CONTEXT: QIKVRT autonomous ruleset repair
      EFFECT_ROOT: /tmp/qikvrt-autonomous-ruleset-effect

    steps:
      - name: Check out exact trusted Main implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Select exact dispatch-bound ruleset-repair subject and active carriers
        id: select
        shell: bash
        run: |
          set -euo pipefail
          root="$EFFECT_ROOT"
          rm -rf "$root"
          mkdir -p "$root"
          selection_error_trap() {
            local rc=$?
            if [ "$rc" -ne 0 ] && [ ! -s "$root/selection.json" ]; then
              jq -n \
                --arg blocker "RULESET_SELECTION_EXECUTION_FAILED" \
                --arg repository "$REPOSITORY" \
                --arg run "$GITHUB_RUN_ID" \
                --argjson exit_code "$rc" \
                '{
                  schema: "qikvrt_autonomous_ruleset_effect_preselection_v3",
                  state: "HOLD",
                  verification_state: "HOLD_UNVERIFIED",
                  first_blocker: $blocker,
                  next_action: "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                  continuation_required: true,
                  d0: 2,
                  hold_reason: {
                    reason_code: $blocker,
                    reason: "Ruleset selection terminated before an exact effect subject was retained",
                    subject: {repository: $repository, kind: "repository", identifier: "ruleset-control-plane", head_sha: null},
                    evidence_refs: ["github-actions-run:" + $run, "ruleset-selection:error-trap"],
                    owner: {role: "EXACT_SUBJECT_OBSERVER", actor: "qikvrt-autonomous-ruleset-effect-loop"},
                    retry_condition: {event: "NONSELF_REPOSITORY_INTERRUPT", predicate: "the exact selection failure can be reobserved and classified without a ruleset effect"},
                    next_action: "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                    d0: 2
                  },
                  selection_exit_code: $exit_code
                }' > "$root/preselection.json"
              jq -n \
                --arg blocker "RULESET_SELECTION_EXECUTION_FAILED" \
                --arg repository "$REPOSITORY" \
                --arg run "$GITHUB_RUN_ID" \
                --argjson exit_code "$rc" \
                '{
                  schema: "qikvrt_autonomous_ruleset_effect_selection_v3",
                  state: "HOLD",
                  verification_state: "HOLD_UNVERIFIED",
                  first_blocker: $blocker,
                  next_action: "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                  continuation_required: true,
                  d0: 2,
                  hold_reason: {
                    reason_code: $blocker,
                    reason: "Ruleset selection terminated before an exact effect subject was retained",
                    subject: {repository: $repository, kind: "repository", identifier: "ruleset-control-plane", head_sha: null},
                    evidence_refs: ["github-actions-run:" + $run, "ruleset-selection:error-trap"],
                    owner: {role: "EXACT_SUBJECT_OBSERVER", actor: "qikvrt-autonomous-ruleset-effect-loop"},
                    retry_condition: {event: "NONSELF_REPOSITORY_INTERRUPT", predicate: "the exact selection failure can be reobserved and classified without a ruleset effect"},
                    next_action: "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                    d0: 2
                  },
                  selection_exit_code: $exit_code
                }' > "$root/selection.json"
              {
                echo "state=HOLD"
                echo "blocker=RULESET_SELECTION_EXECUTION_FAILED"
              } >> "$GITHUB_OUTPUT"
            fi
            exit "$rc"
          }
          trap selection_error_trap ERR

          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import zipfile
          from tools.qikvrt_github_observe import (
              GitHubInstallationRateLimit,
              GitHubObservationError,
              run_gh_api_read,
              run_gh_api_read_to_file,
          )

          root = pathlib.Path(os.environ["EFFECT_ROOT"])
          repo = os.environ["REPOSITORY"]
          requested_mode = os.environ.get("REQUESTED_MODE", "").strip()

          def save(name, value):
              (root / name).write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          def noop(blocker, **extra):
              save("preselection.json", {
                  "schema": "qikvrt_autonomous_ruleset_effect_preselection_v3",
                  "state": "NOOP",
                  "first_blocker": blocker,
                  **extra,
              })
              raise SystemExit(0)

          def hold(blocker, **extra):
              save("preselection.json", {
                  "schema": "qikvrt_autonomous_ruleset_effect_preselection_v3",
                  "state": "HOLD",
                  "verification_state": "HOLD_UNVERIFIED",
                  "first_blocker": blocker,
                  "next_action": "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                  "continuation_required": True,
                  "d0": 2,
                  "hold_reason": {
                      "reason_code": blocker,
                      "reason": "Ruleset selection cannot safely continue before exact GitHub evidence is available",
                      "subject": {
                          "repository": repo,
                          "kind": "repository",
                          "identifier": "ruleset-control-plane",
                          "head_sha": None,
                      },
                      "evidence_refs": ["ruleset-selection:preselection", "workflow_dispatch"],
                      "owner": {
                          "role": "EXACT_SUBJECT_OBSERVER",
                          "actor": "qikvrt-autonomous-ruleset-effect-loop",
                      },
                      "retry_condition": {
                          "event": "NONSELF_REPOSITORY_INTERRUPT",
                          "predicate": (
                              "the exact GitHub App installation quota is no longer exhausted"
                              if blocker == "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
                              else "the exact selection evidence can be reobserved without a ruleset effect"
                          ),
                      },
                      "next_action": "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                      "d0": 2,
                  },
                  **extra,
              })
              raise SystemExit(0)

          def gh(path):
              try:
                  return json.loads(run_gh_api_read([path]))
              except GitHubInstallationRateLimit as exc:
                  hold("GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED", detail=str(exc))
              except GitHubObservationError as exc:
                  hold("GITHUB_READ_OBSERVATION_FAILED", detail=str(exc), endpoint=path)

          def gh_pages(path):
              try:
                  raw = json.loads(run_gh_api_read(["--paginate", "--slurp", path]))
              except GitHubInstallationRateLimit as exc:
                  hold("GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED", detail=str(exc))
              except GitHubObservationError as exc:
                  hold("GITHUB_READ_OBSERVATION_FAILED", detail=str(exc), endpoint=path)
              if not isinstance(raw, list):
                  hold("GITHUB_PAGINATED_OBSERVATION_MALFORMED", endpoint=path)
              return raw

          try:
              checkout = subprocess.check_output(
                  ["git", "rev-parse", "--verify", "HEAD^{commit}"], text=True
              ).strip()
              live_main = gh(f"repos/{repo}/commits/main").get("sha")
          except (OSError, ValueError, json.JSONDecodeError, subprocess.CalledProcessError, AttributeError) as exc:
              hold("TRUSTED_MAIN_READBACK_FAILED_BEFORE_SELECTION", detail=str(exc))
          if not re.fullmatch(r"[0-9a-f]{40}", str(live_main or "")):
              hold("TRUSTED_MAIN_READBACK_INVALID")
          if checkout != live_main:
              noop(
                  "TRUSTED_MAIN_DRIFT_BEFORE_SELECTION",
                  checkout_head=checkout,
                  observed_main=live_main,
              )

          if requested_mode == "MAIN":
              requested_main = os.environ.get("REQUESTED_MAIN", "").strip()
              requested_policy_sha = os.environ.get("REQUESTED_POLICY_SHA", "").strip()
              requested_carrier = os.environ.get("REQUESTED_MAIN_CARRIER_RUN_ID", "").strip()
              if not re.fullmatch(r"[0-9a-f]{40}", requested_main):
                  noop("DISPATCH_EXPECTED_MAIN_INVALID")
              if not re.fullmatch(r"[0-9a-f]{64}", requested_policy_sha):
                  noop("DISPATCH_EXPECTED_POLICY_SHA_INVALID")
              if not requested_carrier.isdigit() or int(requested_carrier) <= 0:
                  noop("DISPATCH_MAIN_CARRIER_RUN_ID_INVALID")
              if requested_main != live_main:
                  noop(
                      "TRUSTED_MAIN_DRIFT_BEFORE_MAIN_SELECTION",
                      expected_main=requested_main,
                      observed_main=live_main,
                  )
              import hashlib
              try:
                  policy_sha = hashlib.sha256(
                      pathlib.Path("policy/GITHUB_MAIN_RULESET_V1.json").read_bytes()
                  ).hexdigest()
              except OSError as exc:
                  hold("RULESET_POLICY_READ_FAILED_BEFORE_MAIN_SELECTION", detail=str(exc))
              if policy_sha != requested_policy_sha:
                  noop(
                      "RULESET_POLICY_DRIFT_BEFORE_MAIN_SELECTION",
                      expected_policy_sha=requested_policy_sha,
                      observed_policy_sha=policy_sha,
                  )
              carrier = gh(f"repos/{repo}/actions/runs/{requested_carrier}")
              carrier_title = carrier.get("display_title")
              if (
                  carrier.get("name") != "QIKVRT reflexive repository watchdog"
                  or carrier.get("path") not in {
                      ".github/workflows/qikvrt_reflexive_repository_watchdog.yml",
                      ".github/workflows/qikvrt_reflexive_repository_watchdog.yml@main",
                  }
                  or carrier.get("event") != "schedule"
                  or carrier.get("head_branch") != "main"
                  or carrier.get("head_sha") != live_main
                  or (carrier.get("repository") or {}).get("full_name") != repo
                  or carrier_title != f"QIKVRT reflexive watchdog carrier={requested_carrier} event=schedule"
              ):
                  noop("MAIN_CARRIER_PROVENANCE_INVALID")
              save("preselection.json", {
                  "schema": "qikvrt_autonomous_ruleset_effect_preselection_v3",
                  "state": "MAIN_CANDIDATE",
                  "subject_mode": "MAIN",
                  "first_blocker": "RULESET_POLICY_REOBSERVATION",
                  "trusted_main_sha": live_main,
                  "policy_sha256": policy_sha,
                  "main_carrier_run_id": int(requested_carrier),
              })
              raise SystemExit(0)

          if requested_mode != "PR":
              noop("DISPATCH_MODE_INVALID", requested_mode=requested_mode)

          requested_pr = os.environ.get("REQUESTED_PR", "").strip()
          requested_head = os.environ.get("REQUESTED_HEAD", "").strip()
          requested_upstream = os.environ.get("REQUESTED_UPSTREAM_RUN_ID", "").strip()
          requested_bridge = os.environ.get("REQUESTED_BRIDGE_RUN_ID", "").strip()
          if not requested_pr.isdigit() or int(requested_pr) <= 0:
              noop("DISPATCH_PR_NUMBER_INVALID")
          if not re.fullmatch(r"[0-9a-f]{40}", requested_head):
              noop("DISPATCH_EXPECTED_HEAD_INVALID")
          if not requested_upstream.isdigit() or int(requested_upstream) <= 0:
              noop("DISPATCH_UPSTREAM_RUN_ID_INVALID")
          if not requested_bridge.isdigit() or int(requested_bridge) <= 0:
              noop("DISPATCH_BRIDGE_RUN_ID_INVALID")

          # A PR effect is never authorized solely by workflow_dispatch
          # inputs.  Bind both immutable Actions runs and independently
          # re-read the required-review selection artifact before the App
          # configuration or token steps execute.
          bridge = gh(f"repos/{repo}/actions/runs/{requested_bridge}")
          bridge_title = bridge.get("display_title")
          if (
              bridge.get("name") != "QIKVRT ruleset effect dispatch bridge"
              or bridge.get("path") not in {
                  ".github/workflows/qikvrt_ruleset_effect_dispatch_bridge.yml",
                  ".github/workflows/qikvrt_ruleset_effect_dispatch_bridge.yml@main",
              }
              or bridge.get("head_branch") != "main"
              or bridge.get("head_sha") != live_main
              or (bridge.get("repository") or {}).get("full_name") != repo
              or not isinstance(bridge_title, str)
              or re.fullmatch(
                  rf"QIKVRT ruleset bridge upstream={re.escape(requested_upstream)} carrier=.+",
                  bridge_title,
              ) is None
          ):
              noop("BRIDGE_PROVENANCE_INVALID")

          upstream = gh(f"repos/{repo}/actions/runs/{requested_upstream}")
          if (
              upstream.get("name") != "QIKVRT required code-owner review"
              or upstream.get("path") not in {
                  ".github/workflows/qikvrt_required_review_gate.yml",
                  ".github/workflows/qikvrt_required_review_gate.yml@main",
              }
              or upstream.get("conclusion") != "success"
              or upstream.get("head_branch") != "main"
              or upstream.get("head_sha") != live_main
              or (upstream.get("repository") or {}).get("full_name") != repo
          ):
              noop("UPSTREAM_REQUIRED_REVIEW_PROVENANCE_INVALID")
          artifact_name = f"qikvrt-required-code-owner-selection-{requested_upstream}-CANDIDATE"
          artifact_endpoint = (
              f"repos/{repo}/actions/runs/{requested_upstream}/artifacts?per_page=100"
          )
          artifact_matches = []
          for page in gh_pages(artifact_endpoint):
              if not isinstance(page, dict) or not isinstance(page.get("artifacts"), list):
                  hold("UPSTREAM_ARTIFACT_OBSERVATION_MALFORMED", endpoint=artifact_endpoint)
              for artifact in page["artifacts"]:
                  if not isinstance(artifact, dict):
                      hold("UPSTREAM_ARTIFACT_OBSERVATION_MALFORMED", endpoint=artifact_endpoint)
                  if artifact.get("name") == artifact_name and artifact.get("expired") is not True:
                      artifact_matches.append(artifact)
          if len(artifact_matches) != 1:
              noop("UPSTREAM_SELECTION_ARTIFACT_MISSING_OR_AMBIGUOUS")
          artifact_id = artifact_matches[0].get("id")
          if isinstance(artifact_id, bool) or not isinstance(artifact_id, int) or artifact_id <= 0:
              hold("UPSTREAM_SELECTION_ARTIFACT_ID_INVALID", endpoint=artifact_endpoint)
          archive = root / "upstream-selection.zip"
          archive_endpoint = f"repos/{repo}/actions/artifacts/{artifact_id}/zip"
          try:
              run_gh_api_read_to_file([archive_endpoint], archive)
              with zipfile.ZipFile(archive) as bundle:
                  selection_files = [
                      name
                      for name in bundle.namelist()
                      if pathlib.PurePosixPath(name).name == "qikvrt-required-review-selection.json"
                      and not name.endswith("/")
                  ]
                  if len(selection_files) != 1:
                      hold("UPSTREAM_SELECTION_FILE_MISSING_OR_AMBIGUOUS", endpoint=archive_endpoint)
                  selection = json.loads(bundle.read(selection_files[0]))
          except GitHubInstallationRateLimit as exc:
              hold("GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED", detail=str(exc))
          except (GitHubObservationError, OSError, ValueError, zipfile.BadZipFile) as exc:
              hold("UPSTREAM_SELECTION_ARTIFACT_INVALID", detail=str(exc), endpoint=archive_endpoint)
          if (
              not isinstance(selection, dict)
              or selection.get("schema") != "qikvrt_required_code_owner_review_selection_v1"
              or selection.get("state") != "CANDIDATE"
              or selection.get("pr_numbers") != [int(requested_pr)]
              or selection.get("expected_head") != requested_head
          ):
              noop("UPSTREAM_SELECTION_PROVENANCE_MISMATCH")

          requested_recovery = os.environ.get("RECOVERY_MODE", "").strip()
          recovery_origin = os.environ.get("RECOVERY_OF_EFFECT_RUN_ID", "").strip()
          if requested_recovery not in {"APPLY", "REOBSERVE_UNCONFIRMED"}:
              noop("DISPATCH_RECOVERY_MODE_INVALID")
          if recovery_origin and (not recovery_origin.isdigit() or int(recovery_origin) <= 0):
              noop("DISPATCH_RECOVERY_ORIGIN_INVALID")
          if requested_recovery == "REOBSERVE_UNCONFIRMED" and not recovery_origin:
              noop("DISPATCH_RECOVERY_ORIGIN_MISSING")
          if recovery_origin:
              origin = gh(f"repos/{repo}/actions/runs/{recovery_origin}")
              origin_title = origin.get("display_title")
              origin_base = (
                  f"QIKVRT ruleset effect mode=PR pr={requested_pr} "
                  f"head={requested_head} upstream={requested_upstream}"
              )
              origin_match = (
                  re.fullmatch(
                      re.escape(origin_base)
                      + r" bridge=(?P<bridge>[1-9][0-9]*) "
                      + r"recovery=(?P<recovery>APPLY|REOBSERVE_UNCONFIRMED) "
                      + r"recovery_of=(?P<recovery_of>none|[1-9][0-9]*)(?: policy=none)?",
                      origin_title if isinstance(origin_title, str) else "",
                  )
              )
              if (
                  origin.get("name") != "QIKVRT autonomous ruleset effect loop"
                  or origin.get("path") not in {
                      ".github/workflows/qikvrt_autonomous_ruleset_effect_loop.yml",
                      ".github/workflows/qikvrt_autonomous_ruleset_effect_loop.yml@main",
                  }
                  or origin.get("status") != "completed"
                  or origin.get("head_branch") != "main"
                  or origin.get("head_sha") != live_main
                  or (origin.get("repository") or {}).get("full_name") != repo
                  or origin_match is None
              ):
                  noop("RECOVERY_ORIGIN_EFFECT_PROVENANCE_INVALID")
              origin_artifacts_endpoint = (
                  f"repos/{repo}/actions/runs/{recovery_origin}/artifacts?per_page=100"
              )
              origin_artifacts = []
              for page in gh_pages(origin_artifacts_endpoint):
                  if not isinstance(page, dict) or not isinstance(page.get("artifacts"), list):
                      hold("RECOVERY_ORIGIN_ARTIFACT_OBSERVATION_MALFORMED", endpoint=origin_artifacts_endpoint)
                  for artifact in page["artifacts"]:
                      if not isinstance(artifact, dict):
                          hold("RECOVERY_ORIGIN_ARTIFACT_OBSERVATION_MALFORMED", endpoint=origin_artifacts_endpoint)
                      if (
                          isinstance(artifact.get("name"), str)
                          and artifact["name"].startswith(
                              f"qikvrt-autonomous-ruleset-effect-{recovery_origin}-"
                          )
                          and artifact.get("expired") is not True
                      ):
                          origin_artifacts.append(artifact)
              if len(origin_artifacts) != 1:
                  hold("RECOVERY_ORIGIN_RECEIPT_ARTIFACT_MISSING_OR_AMBIGUOUS", endpoint=origin_artifacts_endpoint)
              origin_artifact_id = origin_artifacts[0].get("id")
              if (
                  isinstance(origin_artifact_id, bool)
                  or not isinstance(origin_artifact_id, int)
                  or origin_artifact_id <= 0
              ):
                  hold("RECOVERY_ORIGIN_RECEIPT_ARTIFACT_ID_INVALID", endpoint=origin_artifacts_endpoint)
              origin_archive_endpoint = f"repos/{repo}/actions/artifacts/{origin_artifact_id}/zip"
              origin_archive = root / "recovery-origin-effect.zip"
              try:
                  run_gh_api_read_to_file([origin_archive_endpoint], origin_archive)
                  with zipfile.ZipFile(origin_archive) as bundle:
                      receipt_files = [
                          name
                          for name in bundle.namelist()
                          if pathlib.PurePosixPath(name).name == "continuation-receipt.json"
                          and not name.endswith("/")
                      ]
                      if len(receipt_files) != 1:
                          hold("RECOVERY_ORIGIN_RECEIPT_FILE_MISSING_OR_AMBIGUOUS", endpoint=origin_archive_endpoint)
                      origin_receipt = json.loads(bundle.read(receipt_files[0]))
              except GitHubInstallationRateLimit as exc:
                  hold("GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED", detail=str(exc))
              except (GitHubObservationError, OSError, ValueError, zipfile.BadZipFile) as exc:
                  hold("RECOVERY_ORIGIN_RECEIPT_ARTIFACT_INVALID", detail=str(exc), endpoint=origin_archive_endpoint)
              origin_bridge = int(origin_match.group("bridge"))
              origin_recovery = origin_match.group("recovery")
              origin_of = origin_match.group("recovery_of")
              expected_origin_of = None if origin_of == "none" else int(origin_of)
              if (
                  not isinstance(origin_receipt, dict)
                  or origin_receipt.get("pr_number") != int(requested_pr)
                  or origin_receipt.get("head_sha") != requested_head
                  or origin_receipt.get("trusted_main_sha") != live_main
                  or origin_receipt.get("bridge_run_id") != origin_bridge
                  or origin_receipt.get("recovery_mode") != origin_recovery
                  or origin_receipt.get("recovery_of_effect_run_id") != expected_origin_of
              ):
                  noop("RECOVERY_ORIGIN_RECEIPT_PROVENANCE_MISMATCH")
              if requested_recovery == "REOBSERVE_UNCONFIRMED" and (
                  origin_recovery != "APPLY"
                  or origin_receipt.get("state") != "HOLD"
                  or origin_receipt.get("effect_transport_attempted") is not True
                  or origin_receipt.get("effect_observed") is not False
              ):
                  noop("RECOVERY_ORIGIN_UNCONFIRMED_MUTATION_NOT_PROVEN")
              if requested_recovery == "APPLY" and recovery_origin and (
                  origin_recovery != "REOBSERVE_UNCONFIRMED"
                  or origin_receipt.get("state") != "HOLD"
                  or origin_receipt.get("observed_state") != "DRIFT"
                  or origin_receipt.get("effect_transport_attempted") is not False
                  or origin_receipt.get("effect_observed") is not False
              ):
                  noop("RECOVERY_ORIGIN_REOBSERVE_DRIFT_NOT_PROVEN")
          save("preselection.json", {
              "schema": "qikvrt_autonomous_ruleset_effect_preselection_v3",
              "state": "DISPATCH_CANDIDATE",
              "subject_mode": "PR",
              "first_blocker": None,
              "pr_number": int(requested_pr),
              "expected_head": requested_head,
              "trusted_main_sha": live_main,
              "upstream_run_id": int(requested_upstream),
              "bridge_run_id": int(requested_bridge),
              "recovery_mode": requested_recovery,
              "recovery_of_effect_run_id": (int(recovery_origin) if recovery_origin else None),
          })
          PY

          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          from tools.qikvrt_github_observe import (
              GitHubInstallationRateLimit,
              GitHubObservationError,
              run_gh_api_read,
          )

          root = pathlib.Path(os.environ["EFFECT_ROOT"])
          repo = os.environ["REPOSITORY"]
          context = os.environ["REVIEW_STATUS_CONTEXT"]
          pre = json.loads((root / "preselection.json").read_text(encoding="utf-8"))

          def save(value):
              (root / "selection.json").write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          def noop(blocker, **extra):
              save({
                  "schema": "qikvrt_autonomous_ruleset_effect_selection_v3",
                  "state": "NOOP",
                  "first_blocker": blocker,
                  **extra,
              })
              raise SystemExit(0)

          def hold(blocker, **extra):
              save({
                  "schema": "qikvrt_autonomous_ruleset_effect_selection_v3",
                  "state": "HOLD",
                  "verification_state": "HOLD_UNVERIFIED",
                  "first_blocker": blocker,
                  "next_action": "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                  "continuation_required": True,
                  "d0": 2,
                  "hold_reason": {
                      "reason_code": blocker,
                      "reason": "Ruleset selection cannot safely continue before exact GitHub evidence is available",
                      "subject": {
                          "repository": repo,
                          "kind": "repository",
                          "identifier": "ruleset-control-plane",
                          "head_sha": None,
                      },
                      "evidence_refs": ["ruleset-selection:selection", "workflow_dispatch"],
                      "owner": {
                          "role": "EXACT_SUBJECT_OBSERVER",
                          "actor": "qikvrt-autonomous-ruleset-effect-loop",
                      },
                      "retry_condition": {
                          "event": "NONSELF_REPOSITORY_INTERRUPT",
                          "predicate": (
                              "the exact GitHub App installation quota is no longer exhausted"
                              if blocker == "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
                              else "the exact selection evidence can be reobserved without a ruleset effect"
                          ),
                      },
                      "next_action": "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                      "d0": 2,
                  },
                  **extra,
              })
              raise SystemExit(0)

          def gh(path):
              try:
                  return json.loads(run_gh_api_read([path]))
              except GitHubInstallationRateLimit as exc:
                  hold("GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED", detail=str(exc))
              except GitHubObservationError as exc:
                  hold("GITHUB_READ_OBSERVATION_FAILED", detail=str(exc), endpoint=path)

          def pages(path):
              try:
                  raw = json.loads(run_gh_api_read(["--paginate", "--slurp", path]))
              except GitHubInstallationRateLimit as exc:
                  hold("GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED", detail=str(exc))
              except GitHubObservationError as exc:
                  hold("GITHUB_READ_OBSERVATION_FAILED", detail=str(exc), endpoint=path)
              result = []
              for page in raw:
                  result.extend(page if isinstance(page, list) else [page])
              return result

          if pre.get("state") == "NOOP":
              noop(pre.get("first_blocker") or "PRESELECTION_NOOP")
          if pre.get("state") == "HOLD":
              hold(
                  pre.get("first_blocker") or "PRESELECTION_HOLD",
                  preselection_state="HOLD",
              )

          if pre.get("state") == "MAIN_CANDIDATE":
              expected_main = pre.get("trusted_main_sha")
              expected_policy_sha = pre.get("policy_sha256")
              if not re.fullmatch(r"[0-9a-f]{40}", str(expected_main or "")):
                  noop("MAIN_CANDIDATE_SHA_INVALID")
              if not re.fullmatch(r"[0-9a-f]{64}", str(expected_policy_sha or "")):
                  noop("MAIN_CANDIDATE_POLICY_SHA_INVALID")
              try:
                  live_main = gh(f"repos/{repo}/commits/main").get("sha")
              except (OSError, ValueError, json.JSONDecodeError, subprocess.CalledProcessError, AttributeError) as exc:
                  hold("TRUSTED_MAIN_READBACK_FAILED_DURING_MAIN_SELECTION", detail=str(exc))
              if live_main != expected_main:
                  noop(
                      "TRUSTED_MAIN_DRIFT_DURING_MAIN_SELECTION",
                      expected_main=expected_main,
                      observed_main=live_main,
                  )
              import hashlib
              try:
                  policy_sha = hashlib.sha256(
                      pathlib.Path("policy/GITHUB_MAIN_RULESET_V1.json").read_bytes()
                  ).hexdigest()
              except OSError as exc:
                  hold("RULESET_POLICY_READ_FAILED_DURING_MAIN_SELECTION", detail=str(exc))
              if policy_sha != expected_policy_sha:
                  noop(
                      "RULESET_POLICY_DRIFT_DURING_MAIN_SELECTION",
                      expected_policy_sha=expected_policy_sha,
                      observed_policy_sha=policy_sha,
                  )
              save({
                  "schema": "qikvrt_autonomous_ruleset_effect_selection_v3",
                  "state": "CANDIDATE",
                  "subject_mode": "MAIN",
                  "first_blocker": "RULESET_POLICY_REOBSERVATION",
                  "trusted_main_sha": live_main,
                  "policy_sha256": policy_sha,
                  "trigger": "workflow_dispatch",
                  "predecessor_evidence_transfer": False,
              })
              raise SystemExit(0)

          if pre.get("state") != "DISPATCH_CANDIDATE":
              noop("PRESELECTION_STATE_INVALID", observed_state=pre.get("state"))
          number = pre.get("pr_number")
          expected_head = pre.get("expected_head")

          if isinstance(number, bool) or not isinstance(number, int) or number <= 0:
              noop("PR_NUMBER_INVALID")
          if not re.fullmatch(r"[0-9a-f]{40}", str(expected_head or "")):
              noop("EXPECTED_HEAD_INVALID")

          pull = gh(f"repos/{repo}/pulls/{number}")
          head = pull.get("head") or {}
          base = pull.get("base") or {}
          observed_head = head.get("sha")
          head_ref = head.get("ref")
          if (
              pull.get("state") != "open"
              or base.get("ref") != "main"
              or base.get("sha") != pre.get("trusted_main_sha")
              or base.get("repo", {}).get("full_name") != repo
              or head.get("repo", {}).get("full_name") != repo
              or observed_head != expected_head
              or not isinstance(head_ref, str)
              or not head_ref
          ):
              noop(
                  "EXACT_SUBJECT_DRIFT",
                  pr_number=number,
                  expected_head=expected_head,
                  observed_head=observed_head,
              )

          branch = gh(f"repos/{repo}/git/ref/heads/{head_ref}")
          branch_sha = (branch.get("object") or {}).get("sha")
          if branch_sha != expected_head:
              noop(
                  "EXACT_HEAD_BRANCH_DRIFT",
                  pr_number=number,
                  head_ref=head_ref,
                  expected_head=expected_head,
                  observed_branch_sha=branch_sha,
              )

          statuses = pages(f"repos/{repo}/commits/{expected_head}/statuses?per_page=100")
          matching = [item for item in statuses if item.get("context") == context]
          matching.sort(
              key=lambda item: (
                  item.get("updated_at") or item.get("created_at") or "",
                  int(item.get("id") or 0),
              )
          )
          status = matching[-1] if matching else None
          if (
              not isinstance(status, dict)
              or status.get("state") != "failure"
              or status.get("description")
              != "failure: CODE_OWNER_RULE_NOT_ENFORCED"
          ):
              noop(
                  "EXACT_RULESET_BLOCKER_STATUS_MISSING",
                  pr_number=number,
                  head_sha=expected_head,
              )

          live_main = gh(f"repos/{repo}/commits/main").get("sha")
          if live_main != pre.get("trusted_main_sha"):
              noop(
                  "TRUSTED_MAIN_DRIFT_AFTER_SELECTION",
                  expected_main=pre.get("trusted_main_sha"),
                  observed_main=live_main,
              )

          save({
              "schema": "qikvrt_autonomous_ruleset_effect_selection_v3",
              "state": "CANDIDATE",
              "subject_mode": "PR",
              "first_blocker": "CODE_OWNER_RULE_NOT_ENFORCED",
              "pr_number": number,
              "head_sha": expected_head,
              "head_ref": head_ref,
              "head_branch_sha": branch_sha,
              "base_sha": base.get("sha"),
              "trusted_main_sha": live_main,
              "status_id": status.get("id"),
              "status_target_url": status.get("target_url"),
              "trigger": "workflow_dispatch",
              "open_pull_request_carrier": f"#{number}@{expected_head}",
              "work_branch_carrier": f"{head_ref}@{branch_sha}",
              "predecessor_evidence_transfer": False,
          })
          PY

          cat "$root/selection.json"
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          value = json.load(
              open(os.path.join(os.environ["EFFECT_ROOT"], "selection.json"), encoding="utf-8")
          )
          print(f"state={value['state']}")
          print(f"mode={value.get('subject_mode') or ''}")
          print(f"pr={value.get('pr_number') or ''}")
          print(f"head={value.get('head_sha') or ''}")
          print(f"head_ref={value.get('head_ref') or ''}")
          print(f"main={value.get('trusted_main_sha') or ''}")
          print(f"policy_sha={value.get('policy_sha256') or ''}")
          print(f"blocker={value.get('first_blocker') or ''}")
          PY
          if [ "$(jq -r .state "$root/selection.json")" = HOLD ]; then
            echo "HOLD_UNVERIFIED: ruleset selection did not retain an exact effect subject" >&2
            exit 2
          fi

      - name: Assess scoped GitHub-App authority configuration after exact provenance binding
        id: app-config
        if: steps.select.outputs.state == 'CANDIDATE'
        continue-on-error: true
        env:
          APP_ID: ${{ vars.QIKVRT_RULESET_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.QIKVRT_RULESET_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint scoped ruleset-administration installation token after exact provenance binding
        id: app-token
        if: >-
          steps.select.outputs.state == 'CANDIDATE' &&
          steps.app-config.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.QIKVRT_RULESET_APP_ID }}
          private-key: ${{ secrets.QIKVRT_RULESET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: qik-vrt
          # Deliberately explicit: the App installation token must not inherit
          # a broad repository permission set from this workflow.
          permission-administration: write

      - name: Reconcile full normative ruleset and classify continuation
        id: reconcile
        if: always() && steps.select.outputs.state == 'CANDIDATE'
        env:
          SUBJECT_MODE: ${{ steps.select.outputs.mode }}
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.select.outputs.head }}
          HEAD_REF: ${{ steps.select.outputs.head_ref }}
          EXPECTED_MAIN: ${{ steps.select.outputs.main }}
          EXPECTED_POLICY_SHA: ${{ steps.select.outputs.policy_sha }}
          UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id || '' }}
          # This scoped token is unavailable to all ordinary gh calls above.
          QIKVRT_RULESET_ADMIN_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_CONFIGURED: ${{ steps.app-config.outputs.configured }}
          APP_CONFIG_OUTCOME: ${{ steps.app-config.outcome }}
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root="$EFFECT_ROOT"

          gh_read() {
            python3 -B tools/qikvrt_github_observe.py -- "$@"
          }

          effect_attempts() {
            python3 -B tools/qikvrt_effect_attempts.py show --ledger "$root/effect-attempts.json"
          }

          effect_summary() {
            python3 -B tools/qikvrt_effect_attempts.py summary --ledger "$root/effect-attempts.json"
          }

          emit_subject_hold() {
            local blocker="$1" summary attempts mutation transport observed
            summary="$(effect_summary)"
            attempts="$(effect_attempts)"
            mutation="${2:-$(jq -r .mutation <<<"$summary")}"
            transport="${3:-$(jq -r .effect_transport_attempted <<<"$summary")}"
            observed="$(jq -r .effect_observed <<<"$summary")"
            jq -n \
              --arg blocker "$blocker" \
              --arg mutation "$mutation" \
              --argjson effect_transport_attempted "$transport" \
              --argjson effect_observed "$observed" \
              --argjson effect_attempts "$attempts" \
              --arg pr "$PR_NUMBER" \
              --arg head "$EXPECTED_HEAD" \
              --arg head_ref "$HEAD_REF" \
              --arg main "$EXPECTED_MAIN" \
              --arg mode "$SUBJECT_MODE" \
              --arg policy_sha "$EXPECTED_POLICY_SHA" \
              --arg repository "$REPOSITORY" \
              --arg run "$GITHUB_RUN_ID" \
              --arg bridge "$REQUESTED_BRIDGE_RUN_ID" \
              --arg recovery "$RECOVERY_MODE" \
              --arg recovery_of "$RECOVERY_OF_EFFECT_RUN_ID" \
              --arg upstream "$UPSTREAM_RUN_ID" \
              '{
                schema: "qikvrt_autonomous_ruleset_effect_subject_hold_v1",
                state: "HOLD",
                verification_state: "HOLD_UNVERIFIED",
                first_blocker: $blocker,
                next_action: "REOBSERVE_FULL_EXACT_RULESET_SUBJECT_BEFORE_ANY_RULESET_EFFECT",
                continuation_required: true,
                d0: 2,
                mutation: $mutation,
                effect_transport_attempted: $effect_transport_attempted,
                effect_observed: $effect_observed,
                effect_attempts: $effect_attempts,
                subject_mode: $mode,
                pr_number: (if ($pr | test("^[1-9][0-9]*$")) then ($pr | tonumber) else null end),
                head_sha: $head,
                head_ref: $head_ref,
                trusted_main_sha: $main,
                policy_sha256: $policy_sha,
                bridge_run_id:(if ($bridge | test("^[1-9][0-9]*$")) then ($bridge | tonumber) else null end),
                recovery_mode:$recovery,
                recovery_of_effect_run_id:(if ($recovery_of | test("^[1-9][0-9]*$")) then ($recovery_of | tonumber) else null end),
                upstream_run_id:(if ($upstream | test("^[1-9][0-9]*$")) then ($upstream | tonumber) else null end),
                full_exact_subject_verified: false,
                hold_reason: {
                  reason_code: $blocker,
                  reason: "The exact ruleset subject could not be reobserved safely; no further ruleset effect is allowed",
                  subject: (
                    if $mode == "PR" and ($pr | test("^[1-9][0-9]*$")) and ($head | test("^[0-9a-f]{40}$")) then
                      {repository: $repository, kind: "pull_request", number: ($pr | tonumber), head_sha: $head}
                    elif $mode == "MAIN" and ($main | test("^[0-9a-f]{40}$")) then
                      {repository: $repository, kind: "commit", identifier: "main", head_sha: $main}
                    else
                      {repository: $repository, kind: "repository", identifier: "ruleset-control-plane", head_sha: null}
                    end
                  ),
                  evidence_refs: ["github-actions-run:" + $run, "ruleset-effect:reconcile"],
                  owner: {role: "EXACT_SUBJECT_OBSERVER", actor: "qikvrt-autonomous-ruleset-effect-loop"},
                  retry_condition: {
                    event: "NONSELF_REPOSITORY_INTERRUPT",
                    predicate: (
                      if $blocker == "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED" then
                        "the exact GitHub App installation quota is no longer exhausted"
                      else
                        "the exact subject and GitHub evidence can be reobserved without another ruleset effect"
                      end
                    )
                  },
                  next_action: "REOBSERVE_FULL_EXACT_RULESET_SUBJECT_BEFORE_ANY_RULESET_EFFECT",
                  d0: 2
                }
              }' > "$root/continuation-receipt.json"
            cat "$root/continuation-receipt.json"
            {
              echo "state=HOLD"
              echo "blocker=$blocker"
              echo "mutation=$mutation"
              echo "effect_observed=$observed"
              echo "hold_admissible=false"
            } >> "$GITHUB_OUTPUT"
            echo "HOLD_UNVERIFIED: $blocker" >&2
          }

          emit_read_failure() {
            local rc="$1" fallback="$2"
            if [ "$rc" -eq 75 ]; then
              emit_subject_hold "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
            else
              emit_subject_hold "$fallback"
            fi
          }

          verify_exact_subject() {
            local blocker="$1"
            local pull_json live_main branch_head
            if [ "$SUBJECT_MODE" = MAIN ]; then
              if ! [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]] \
                || ! [[ "$EXPECTED_POLICY_SHA" =~ ^[0-9a-f]{64}$ ]]; then
                emit_subject_hold "${blocker}_MAIN_INPUT_INVALID"
                return 1
              fi
              if live_main="$(gh_read "repos/${REPOSITORY}/commits/main" --jq .sha)"; then
                :
              else
                rc=$?
                emit_read_failure "$rc" "${blocker}_MAIN_GET_FAILED"
                return 1
              fi
              if [ "$live_main" != "$EXPECTED_MAIN" ]; then
                emit_subject_hold "${blocker}_MAIN_REF_DRIFT"
                return 1
              fi
              if [ "$(sha256sum policy/GITHUB_MAIN_RULESET_V1.json | awk '{print $1}')" != "$EXPECTED_POLICY_SHA" ]; then
                emit_subject_hold "${blocker}_POLICY_DRIFT"
                return 1
              fi
              return 0
            fi
            if [ "$SUBJECT_MODE" != PR ]; then
              emit_subject_hold "${blocker}_MODE_INVALID"
              return 1
            fi
            if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
              || ! [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] \
              || ! [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]] \
              || ! git check-ref-format --branch "$HEAD_REF" >/dev/null; then
              emit_subject_hold "${blocker}_INPUT_INVALID"
              return 1
            fi
            if pull_json="$(gh_read "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"; then
              :
            else
              rc=$?
              emit_read_failure "$rc" "${blocker}_PR_GET_FAILED"
              return 1
            fi
            if [ "$(jq -r '.state // empty' <<<"$pull_json")" != open ] \
              || [ "$(jq -r '.base.ref // empty' <<<"$pull_json")" != main ] \
              || [ "$(jq -r '.base.sha // empty' <<<"$pull_json")" != "$EXPECTED_MAIN" ] \
              || [ "$(jq -r '.base.repo.full_name // empty' <<<"$pull_json")" != "$REPOSITORY" ] \
              || [ "$(jq -r '.head.repo.full_name // empty' <<<"$pull_json")" != "$REPOSITORY" ] \
              || [ "$(jq -r '.head.ref // empty' <<<"$pull_json")" != "$HEAD_REF" ] \
              || [ "$(jq -r '.head.sha // empty' <<<"$pull_json")" != "$EXPECTED_HEAD" ]; then
              emit_subject_hold "${blocker}_PR_TUPLE_DRIFT"
              return 1
            fi
            if live_main="$(gh_read "repos/${REPOSITORY}/commits/main" --jq .sha)"; then
              :
            else
              rc=$?
              emit_read_failure "$rc" "${blocker}_REF_GET_FAILED"
              return 1
            fi
            if branch_head="$(gh_read "repos/${REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)"; then
              :
            else
              rc=$?
              emit_read_failure "$rc" "${blocker}_REF_GET_FAILED"
              return 1
            fi
            if [ "$live_main" != "$EXPECTED_MAIN" ] \
              || [ "$branch_head" != "$EXPECTED_HEAD" ]; then
              emit_subject_hold "${blocker}_REF_DRIFT"
              return 1
            fi
          }

          checkout="$(git rev-parse --verify HEAD^{commit})"
          if [ "$checkout" != "$EXPECTED_MAIN" ]; then
            emit_subject_hold "TRUSTED_MAIN_CHECKOUT_DRIFT_BEFORE_RECONCILIATION"
            exit 2
          fi
          if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_BEFORE_RECONCILIATION"; then
            exit 2
          fi

          if [ "$APP_CONFIG_OUTCOME" != success ]; then
            export QIKVRT_RULESET_AUTHORITY_STATE=HOLD
            export QIKVRT_RULESET_AUTHORITY_BLOCKER=QIKVRT_RULESET_GITHUB_APP_CONFIGURATION_CHECK_FAILED
          elif [ "$APP_CONFIGURED" = false ]; then
            export QIKVRT_RULESET_AUTHORITY_STATE=REQUEST_AUTHORITY
            export QIKVRT_RULESET_AUTHORITY_BLOCKER=QIKVRT_RULESET_GITHUB_APP_CONFIGURATION_MISSING
          elif [ "$APP_CONFIGURED" != true ]; then
            export QIKVRT_RULESET_AUTHORITY_STATE=HOLD
            export QIKVRT_RULESET_AUTHORITY_BLOCKER=QIKVRT_RULESET_GITHUB_APP_CONFIGURATION_STATE_INVALID
          elif [ "$APP_TOKEN_OUTCOME" != success ]; then
            export QIKVRT_RULESET_AUTHORITY_STATE=HOLD
            export QIKVRT_RULESET_AUTHORITY_BLOCKER=QIKVRT_RULESET_GITHUB_APP_TOKEN_MINT_FAILED
          elif [ -z "${QIKVRT_RULESET_ADMIN_TOKEN:-}" ]; then
            export QIKVRT_RULESET_AUTHORITY_STATE=HOLD
            export QIKVRT_RULESET_AUTHORITY_BLOCKER=QIKVRT_RULESET_GITHUB_APP_TOKEN_OUTPUT_MISSING
          fi
          if ! python3 -B tools/qikvrt_effect_attempts.py create \
            --ledger "$root/effect-attempts.json" >/dev/null; then
            emit_subject_hold "EFFECT_ATTEMPT_LEDGER_CREATION_FAILED"
            exit 2
          fi
          reconcile_error_trap() {
            local rc=$?
            trap - ERR
            if [ "$rc" -ne 0 ] && [ ! -s "$root/continuation-receipt.json" ]; then
              set +e
              emit_subject_hold "RULESET_RECONCILIATION_EXECUTION_FAILED"
            fi
            exit 2
          }
          trap reconcile_error_trap ERR
          if [ -n "$REQUESTED_BRIDGE_RUN_ID" ] \
            && ! [[ "$REQUESTED_BRIDGE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            emit_subject_hold "RULESET_BRIDGE_RUN_ID_INVALID"
            exit 2
          fi
          if [ -n "$RECOVERY_OF_EFFECT_RUN_ID" ] \
            && ! [[ "$RECOVERY_OF_EFFECT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            emit_subject_hold "RULESET_RECOVERY_ORIGIN_INVALID"
            exit 2
          fi
          case "$RECOVERY_MODE" in
            APPLY)
              reconcile_operation=(--apply)
              ;;
            REOBSERVE_UNCONFIRMED)
              # A preceding conditional PUT has an unresolved readback.  This
              # carrier deliberately performs only the isolated
              # GET/evaluate reconciliation phase; it cannot issue a second
              # ruleset mutation.
              reconcile_operation=(--reobserve)
              if [ -z "$RECOVERY_OF_EFFECT_RUN_ID" ]; then
                emit_subject_hold "RULESET_RECOVERY_ORIGIN_MISSING"
                exit 2
              fi
              ;;
            *)
              emit_subject_hold "RULESET_RECOVERY_MODE_INVALID"
              exit 2
              ;;
          esac
          set +e
          python3 -B tools/qikvrt_ruleset_reconcile.py \
            "${reconcile_operation[@]}" \
            --effect-attempt-ledger "$root/effect-attempts.json" \
            --receipt "$root/preflight-receipt.json"
          preflight_rc=$?
          set -e
          if [ ! -s "$root/preflight-receipt.json" ]; then
            emit_subject_hold "RULESET_RECONCILIATION_RECEIPT_MISSING"
            exit 2
          fi

          cp "$root/preflight-receipt.json" "$root/effect-receipt.json"
          printf '%s\n' "$preflight_rc" > "$root/preflight-exit-code.txt"
          attempts="$(effect_attempts)"
          jq \
            --argjson effect_attempts "$attempts" \
            --arg repository "$REPOSITORY" \
            --arg mode "$SUBJECT_MODE" \
            --arg pr "$PR_NUMBER" \
            --arg head "$EXPECTED_HEAD" \
            --arg head_ref "$HEAD_REF" \
            --arg main "$EXPECTED_MAIN" \
            --arg bridge "$REQUESTED_BRIDGE_RUN_ID" \
            --arg recovery "$RECOVERY_MODE" \
            --arg recovery_of "$RECOVERY_OF_EFFECT_RUN_ID" \
            --arg upstream "$UPSTREAM_RUN_ID" \
            '. + {
              reconciliation_schema:(.schema // null),
              schema:"qikvrt_ruleset_effect_continuation_receipt_v1",
              repository:$repository,
              subject_mode:$mode,
              pr_number:(if ($pr | test("^[1-9][0-9]*$")) then ($pr | tonumber) else null end),
              head_sha:$head,
              head_ref:$head_ref,
              trusted_main_sha:$main,
              effect_attempts: $effect_attempts,
              mutation:(.mutation // "NONE"),
              effect_transport_attempted:(.effect_transport_attempted // false),
              effect_observed:(.effect_observed // false),
              bridge_run_id:(if ($bridge | test("^[1-9][0-9]*$")) then ($bridge | tonumber) else null end),
              recovery_mode:$recovery,
              recovery_of_effect_run_id:(if ($recovery_of | test("^[1-9][0-9]*$")) then ($recovery_of | tonumber) else null end),
              upstream_run_id:(if ($upstream | test("^[1-9][0-9]*$")) then ($upstream | tonumber) else null end),
              verification_state:(if .state == "REQUEST_AUTHORITY" then "REQUEST_AUTHORITY_ACTIVE" else .verification_state end),
              continuation_required:(if .state == "REQUEST_AUTHORITY" then true else (.continuation_required // false) end),
              hold_admissible:(if .state == "REQUEST_AUTHORITY" then false else .hold_admissible end)
            }' \
            "$root/effect-receipt.json" > "$root/effect-receipt.tmp"
          mv "$root/effect-receipt.tmp" "$root/effect-receipt.json"

          observed_state="$(jq -r .state "$root/effect-receipt.json")"
          if [ "$observed_state" != CURRENT ] && [ "$observed_state" != REQUEST_AUTHORITY ]; then
            jq \
              --arg observed "$observed_state" \
              --arg repository "$REPOSITORY" \
              --arg mode "$SUBJECT_MODE" \
              --arg pr "$PR_NUMBER" \
              --arg head "$EXPECTED_HEAD" \
              --arg main "$EXPECTED_MAIN" \
              --arg upstream "$UPSTREAM_RUN_ID" \
              --arg run "$GITHUB_RUN_ID" \
              '. + {
                state: "HOLD",
                first_blocker: (.first_blocker // "RULESET_RECONCILIATION_NOT_CURRENT"),
                observed_state: $observed,
                next_action: "REOBSERVE_EXACT_RULESET_API_AND_READBACK_EVIDENCE",
                continuation_required: true,
                verification_state: (.verification_state // "HOLD_UNVERIFIED"),
                d0: (.d0 // 2),
                mutation: (.mutation // "NONE"),
                effect_transport_attempted: (.effect_transport_attempted // false),
                effect_observed: false,
                hold_reason: (.hold_reason // {
                  reason_code:(.first_blocker // "RULESET_RECONCILIATION_NOT_CURRENT"),
                  reason:"A GET-only or conditional ruleset reconciliation did not establish CURRENT; a fresh exact-subject reobservation is required.",
                  subject:(if $mode == "PR" and ($pr | test("^[1-9][0-9]*$")) and ($head | test("^[0-9a-f]{40}$")) then {repository:$repository,kind:"pull_request",number:($pr|tonumber),head_sha:$head} else {repository:$repository,kind:"repository",identifier:"ruleset-control-plane",head_sha:null} end),
                  evidence_refs:["github-actions-run:" + $run, "required-review-run:" + $upstream],
                  owner:{role:"EXACT_SUBJECT_OBSERVER",actor:"qikvrt-autonomous-ruleset-effect-loop"},
                  retry_condition:{event:"SCHEDULED_RULESET_PR_CARRIER",predicate:"the exact ruleset state can be reobserved without a second conditional mutation"},
                  next_action:"REOBSERVE_EXACT_RULESET_API_AND_READBACK_EVIDENCE",
                  d0:2
                })
              }' \
              "$root/effect-receipt.json" > "$root/effect-receipt.tmp"
            mv "$root/effect-receipt.tmp" "$root/effect-receipt.json"
            observed_state=HOLD
          fi

          if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_AFTER_RECONCILIATION"; then
            exit 2
          fi
          if ! jq '. + {full_exact_subject_verified:true}' \
            "$root/effect-receipt.json" > "$root/effect-receipt.tmp"; then
            emit_subject_hold "RULESET_RECONCILIATION_RECEIPT_PROVENANCE_WRITE_FAILED"
            exit 2
          fi
          mv "$root/effect-receipt.tmp" "$root/effect-receipt.json"

          if [ "$observed_state" = REQUEST_AUTHORITY ] && [ "$SUBJECT_MODE" = PR ]; then
            blocker="$(jq -r '.first_blocker // "RULESET_ADMIN_AUTHORITY_REQUIRED"' "$root/effect-receipt.json")"
            python3 -B tools/qikvrt_hold_admissibility.py \
              --pull-request-carrier "#${PR_NUMBER}@${EXPECTED_HEAD}" \
              --branch-carrier "${HEAD_REF}@${EXPECTED_HEAD}" \
              --continuation-state REQUEST_AUTHORITY \
              --first-blocker "$blocker" \
              --next-action ROUTE_RULESET_ADMIN_AUTHORITY_THROUGH_ACTIVE_PR \
              --receipt "$root/hold-admissibility.json" \
              > "$root/hold-admissibility.stdout.json"
            jq -s \
              '.[0] + {
                state: .[1].state,
                hold_admissible: .[1].hold_admissible,
                carrier_count: .[1].carrier_count,
                carriers: .[1].carriers,
                next_action: .[1].next_action,
                continuation_required: true
              }' \
              "$root/effect-receipt.json" "$root/hold-admissibility.json" \
              > "$root/continuation-receipt.json"
          else
            cp "$root/effect-receipt.json" "$root/continuation-receipt.json"
          fi

          cat "$root/continuation-receipt.json"
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          value = json.load(
              open(os.path.join(os.environ["EFFECT_ROOT"], "continuation-receipt.json"), encoding="utf-8")
          )
          print(f"state={value.get('state') or ''}")
          print(f"blocker={value.get('first_blocker') or ''}")
          print(f"mutation={value.get('mutation') or ''}")
          print(f"effect_observed={'true' if value.get('effect_observed') else 'false'}")
          print(f"hold_admissible={'true' if value.get('hold_admissible') else 'false'}")
          PY
          if [ "$observed_state" = HOLD ]; then
            echo "HOLD_UNVERIFIED: ruleset reconciliation did not produce an authority-only blocker" >&2
            exit 2
          fi
          if [ "$observed_state" = REQUEST_AUTHORITY ]; then
            if [ "$SUBJECT_MODE" = MAIN ]; then
              echo "REQUEST_AUTHORITY: Main reconciliation has no PR carrier for a continuation comment" >&2
            else
              echo "REQUEST_AUTHORITY: exact PR continuation is published separately" >&2
            fi
            exit 2
          fi

      - name: Record current Main reconciliation artifact receipt
        id: record-main-reconciliation
        if: >-
          always() &&
          steps.select.outputs.state == 'CANDIDATE' &&
          steps.select.outputs.mode == 'MAIN' &&
          steps.reconcile.outputs.state == 'CURRENT'
        env:
          EXPECTED_MAIN: ${{ steps.select.outputs.main }}
          EXPECTED_POLICY_SHA: ${{ steps.select.outputs.policy_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root="$EFFECT_ROOT"

          gh_read() {
            python3 -B tools/qikvrt_github_observe.py -- "$@"
          }

          effect_attempts() {
            python3 -B tools/qikvrt_effect_attempts.py show --ledger "$root/effect-attempts.json"
          }

          effect_summary() {
            python3 -B tools/qikvrt_effect_attempts.py summary --ledger "$root/effect-attempts.json"
          }

          emit_main_hold() {
            local blocker="$1" summary attempts mutation transport observed
            summary="$(effect_summary)"
            attempts="$(effect_attempts)"
            mutation="$(jq -r .mutation <<<"$summary")"
            transport="$(jq -r .effect_transport_attempted <<<"$summary")"
            observed="$(jq -r .effect_observed <<<"$summary")"
            jq -n \
              --arg blocker "$blocker" \
              --arg main "$EXPECTED_MAIN" \
              --arg policy_sha "$EXPECTED_POLICY_SHA" \
              --arg mutation "$mutation" \
              --argjson effect_transport_attempted "$transport" \
              --argjson effect_observed "$observed" \
              --argjson effect_attempts "$attempts" \
              --arg repository "$REPOSITORY" \
              --arg run "$GITHUB_RUN_ID" \
              '{
                schema: "qikvrt_ruleset_main_reconciliation_receipt_v1",
                state: "HOLD",
                verification_state: "HOLD_UNVERIFIED",
                subject_mode: "MAIN",
                first_blocker: $blocker,
                next_action: "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                continuation_required: true,
                d0: 2,
                mutation: $mutation,
                effect_transport_attempted: $effect_transport_attempted,
                effect_observed: $effect_observed,
                effect_attempts: $effect_attempts,
                trusted_main_sha: $main,
                policy_sha256: $policy_sha,
                full_exact_subject_verified: false,
                hold_reason: {
                  reason_code: $blocker,
                  reason: "The exact Main ruleset receipt cannot be reobserved safely; no further ruleset effect is allowed",
                  subject: (
                    if ($main | test("^[0-9a-f]{40}$")) then
                      {repository: $repository, kind: "commit", identifier: "main", head_sha: $main}
                    else
                      {repository: $repository, kind: "repository", identifier: "ruleset-control-plane", head_sha: null}
                    end
                  ),
                  evidence_refs: ["github-actions-run:" + $run, "ruleset-effect:main-receipt"],
                  owner: {role: "EXACT_SUBJECT_OBSERVER", actor: "qikvrt-autonomous-ruleset-effect-loop"},
                  retry_condition: {
                    event: "NONSELF_REPOSITORY_INTERRUPT",
                    predicate: (
                      if $blocker == "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED" then
                        "the exact GitHub App installation quota is no longer exhausted"
                      else
                        "the exact Main subject and policy can be reobserved without another ruleset effect"
                      end
                    )
                  },
                  next_action: "REOBSERVE_EXACT_MAIN_AND_POLICY_BEFORE_ANY_RULESET_EFFECT",
                  d0: 2
                }
              }' > "$root/main-reconciliation-receipt.json"
            cat "$root/main-reconciliation-receipt.json"
            echo "HOLD_UNVERIFIED: $blocker" >&2
          }

          emit_read_failure() {
            local rc="$1" fallback="$2"
            if [ "$rc" -eq 75 ]; then
              emit_main_hold "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
            else
              emit_main_hold "$fallback"
            fi
          }

          verify_main_subject() {
            local live_main policy_sha
            if ! [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]] \
              || ! [[ "$EXPECTED_POLICY_SHA" =~ ^[0-9a-f]{64}$ ]]; then
              emit_main_hold "MAIN_RECONCILIATION_RECEIPT_INPUT_INVALID"
              return 1
            fi
            if [ "$(git rev-parse --verify HEAD^{commit})" != "$EXPECTED_MAIN" ]; then
              emit_main_hold "TRUSTED_MAIN_CHECKOUT_DRIFT_BEFORE_MAIN_RECEIPT"
              return 1
            fi
            if live_main="$(gh_read "repos/${REPOSITORY}/commits/main" --jq .sha)"; then
              :
            else
              rc=$?
              emit_read_failure "$rc" "TRUSTED_MAIN_GET_FAILED_BEFORE_MAIN_RECEIPT"
              return 1
            fi
            policy_sha="$(sha256sum policy/GITHUB_MAIN_RULESET_V1.json | awk '{print $1}')"
            if [ "$live_main" != "$EXPECTED_MAIN" ] \
              || [ "$policy_sha" != "$EXPECTED_POLICY_SHA" ]; then
              emit_main_hold "MAIN_OR_POLICY_DRIFT_BEFORE_MAIN_RECEIPT"
              return 1
            fi
          }

          if ! verify_main_subject; then
            exit 2
          fi
          reconciliation_sha="$(sha256sum "$root/continuation-receipt.json" | awk '{print $1}')"
          summary="$(effect_summary)"
          attempts="$(effect_attempts)"
          jq -n \
            --arg main "$EXPECTED_MAIN" \
            --arg policy_sha "$EXPECTED_POLICY_SHA" \
            --arg reconciliation_sha "$reconciliation_sha" \
            --argjson effect_transport_attempted "$(jq -r .effect_transport_attempted <<<"$summary")" \
            --argjson effect_attempts "$attempts" \
            --arg mutation "$(jq -r .mutation <<<"$summary")" \
            --argjson effect_observed "$(jq -r .effect_observed <<<"$summary")" \
            '{
              schema: "qikvrt_ruleset_main_reconciliation_receipt_v1",
              state: "CURRENT",
              subject_mode: "MAIN",
              trusted_main_sha: $main,
              policy_sha256: $policy_sha,
              reconciliation_receipt_sha256: $reconciliation_sha,
              mutation: $mutation,
              effect_transport_attempted: $effect_transport_attempted,
              effect_observed: $effect_observed,
              effect_attempts: $effect_attempts,
              full_exact_subject_verified: true,
              predecessor_evidence_transfer: false
            }' > "$root/main-reconciliation-receipt.json"
          cat "$root/main-reconciliation-receipt.json"

      - name: Record and read back completed exact-subject reconciliation receipt
        id: record-apply-receipt
        if: >-
          always() &&
          steps.select.outputs.state == 'CANDIDATE' &&
          steps.select.outputs.mode == 'PR' &&
          steps.reconcile.outputs.state == 'CURRENT' &&
          inputs.recovery_mode != 'REOBSERVE_UNCONFIRMED'
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.select.outputs.head }}
          HEAD_REF: ${{ steps.select.outputs.head_ref }}
          EXPECTED_MAIN: ${{ steps.select.outputs.main }}
        shell: bash
        run: |
          set -euo pipefail
          root="$EFFECT_ROOT"

          gh_read() {
            python3 -B tools/qikvrt_github_observe.py -- "$@"
          }

          effect_attempts() {
            python3 -B tools/qikvrt_effect_attempts.py show --ledger "$root/effect-attempts.json"
          }

          effect_summary() {
            python3 -B tools/qikvrt_effect_attempts.py summary --ledger "$root/effect-attempts.json"
          }

          append_effect_attempt() {
            python3 -B tools/qikvrt_effect_attempts.py append --ledger "$root/effect-attempts.json" "$@"
          }

          emit_subject_hold() {
            local blocker="$1" summary attempts mutation transport observed
            summary="$(effect_summary)"
            attempts="$(effect_attempts)"
            mutation="${2:-$(jq -r .mutation <<<"$summary")}"
            transport="${3:-$(jq -r .effect_transport_attempted <<<"$summary")}"
            observed="$(jq -r .effect_observed <<<"$summary")"
            jq -n \
              --arg blocker "$blocker" \
              --arg mutation "$mutation" \
              --argjson effect_transport_attempted "$transport" \
              --argjson effect_observed "$observed" \
              --argjson effect_attempts "$attempts" \
              --arg pr "$PR_NUMBER" \
              --arg head "$EXPECTED_HEAD" \
              --arg head_ref "$HEAD_REF" \
              --arg main "$EXPECTED_MAIN" \
              --arg repository "$REPOSITORY" \
              --arg run "$GITHUB_RUN_ID" \
              '{
                schema: "qikvrt_autonomous_ruleset_effect_subject_hold_v1",
                state: "HOLD",
                verification_state: "HOLD_UNVERIFIED",
                first_blocker: $blocker,
                next_action: "REOBSERVE_FULL_EXACT_PR_SUBJECT_BEFORE_ANY_RULESET_EFFECT",
                continuation_required: true,
                d0: 2,
                mutation: $mutation,
                effect_transport_attempted: $effect_transport_attempted,
                effect_observed: $effect_observed,
                effect_attempts: $effect_attempts,
                pr_number: (if ($pr | test("^[1-9][0-9]*$")) then ($pr | tonumber) else null end),
                head_sha: $head,
                head_ref: $head_ref,
                trusted_main_sha: $main,
                full_exact_subject_verified: false,
                hold_reason: {
                  reason_code: $blocker,
                  reason: "The exact pull-request ruleset receipt cannot be reobserved safely; no further effect is allowed",
                  subject: (
                    if ($pr | test("^[1-9][0-9]*$")) and ($head | test("^[0-9a-f]{40}$")) then
                      {repository: $repository, kind: "pull_request", number: ($pr | tonumber), head_sha: $head}
                    else
                      {repository: $repository, kind: "repository", identifier: "ruleset-control-plane", head_sha: null}
                    end
                  ),
                  evidence_refs: ["github-actions-run:" + $run, "ruleset-effect:apply-receipt"],
                  owner: {role: "EXACT_SUBJECT_OBSERVER", actor: "qikvrt-autonomous-ruleset-effect-loop"},
                  retry_condition: {
                    event: "NONSELF_REPOSITORY_INTERRUPT",
                    predicate: (
                      if $blocker == "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED" then
                        "the exact GitHub App installation quota is no longer exhausted"
                      else
                        "the exact pull-request subject and receipt evidence can be reobserved without another effect"
                      end
                    )
                  },
                  next_action: "REOBSERVE_FULL_EXACT_PR_SUBJECT_BEFORE_ANY_RULESET_EFFECT",
                  d0: 2
                }
              }' > "$root/continuation-receipt.json"
            cat "$root/continuation-receipt.json"
            echo "HOLD_UNVERIFIED: $blocker" >&2
          }

          emit_read_failure() {
            local rc="$1" fallback="$2"
            if [ "$rc" -eq 75 ]; then
              emit_subject_hold "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
            else
              emit_subject_hold "$fallback"
            fi
          }

          verify_exact_subject() {
            local blocker="$1"
            local pull_json live_main branch_head
            if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
              || ! [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] \
              || ! [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]] \
              || ! git check-ref-format --branch "$HEAD_REF" >/dev/null; then
              emit_subject_hold "${blocker}_INPUT_INVALID"
              return 1
            fi
            if pull_json="$(gh_read "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"; then
              :
            else
              rc=$?
              emit_read_failure "$rc" "${blocker}_PR_GET_FAILED"
              return 1
            fi
            if [ "$(jq -r '.state // empty' <<<"$pull_json")" != open ] \
              || [ "$(jq -r '.base.ref // empty' <<<"$pull_json")" != main ] \
              || [ "$(jq -r '.base.sha // empty' <<<"$pull_json")" != "$EXPECTED_MAIN" ] \
              || [ "$(jq -r '.base.repo.full_name // empty' <<<"$pull_json")" != "$REPOSITORY" ] \
              || [ "$(jq -r '.head.repo.full_name // empty' <<<"$pull_json")" != "$REPOSITORY" ] \
              || [ "$(jq -r '.head.ref // empty' <<<"$pull_json")" != "$HEAD_REF" ] \
              || [ "$(jq -r '.head.sha // empty' <<<"$pull_json")" != "$EXPECTED_HEAD" ]; then
              emit_subject_hold "${blocker}_PR_TUPLE_DRIFT"
              return 1
            fi
            if live_main="$(gh_read "repos/${REPOSITORY}/commits/main" --jq .sha)"; then
              :
            else
              rc=$?
              emit_read_failure "$rc" "${blocker}_REF_GET_FAILED"
              return 1
            fi
            if branch_head="$(gh_read "repos/${REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha)"; then
              :
            else
              rc=$?
              emit_read_failure "$rc" "${blocker}_REF_GET_FAILED"
              return 1
            fi
            if [ "$live_main" != "$EXPECTED_MAIN" ] \
              || [ "$branch_head" != "$EXPECTED_HEAD" ]; then
              emit_subject_hold "${blocker}_REF_DRIFT"
              return 1
            fi
          }

          checkout="$(git rev-parse --verify HEAD^{commit})"
          if [ "$checkout" != "$EXPECTED_MAIN" ]; then
            emit_subject_hold "TRUSTED_MAIN_CHECKOUT_DRIFT_BEFORE_RECEIPT"
            exit 2
          fi
          if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_BEFORE_RECEIPT"; then
            exit 2
          fi

          policy_sha="$(sha256sum policy/GITHUB_MAIN_RULESET_V1.json | awk '{print $1}')"
          reconciliation_sha="$(sha256sum "$root/continuation-receipt.json" | awk '{print $1}')"
          fingerprint="$(printf '%s\0%s\0%s\0%s' \
            "$REPOSITORY" "$PR_NUMBER" "$EXPECTED_HEAD" "$policy_sha" \
            | sha256sum | awk '{print $1}')"
          marker="<!-- qikvrt-ruleset-apply:${fingerprint} -->"
          body="${marker}
          QIKVRT ruleset single-apply receipt.

          Exact subject: #${PR_NUMBER}@${EXPECTED_HEAD}
          Exact work branch: ${HEAD_REF}@${EXPECTED_HEAD}
          Exact trusted Main: ${EXPECTED_MAIN}
          Policy SHA-256: ${policy_sha}

          This durable receipt records that an authenticated reconciliation was read back for this exact pull-request revision and policy. It never suppresses a fresh App-token API readback. It is neither approval, merge, publication, PASS, FINAL_PASS, nor EFFECT_ACK_DONE."
          if comments="$(gh_read --paginate --slurp \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"; then
            :
          else
            rc=$?
            emit_read_failure "$rc" "EXACT_SUBJECT_DRIFT_BEFORE_RECEIPT_COMMENTS_GET_FAILED"
            exit 2
          fi
          if ! comment_id="$(jq -r \
            --arg marker "$marker" \
            --arg exact_subject "Exact subject: #${PR_NUMBER}@${EXPECTED_HEAD}" \
            --arg exact_main "Exact trusted Main: ${EXPECTED_MAIN}" \
            --arg policy_line "Policy SHA-256: ${policy_sha}" \
            '[.[][] | select(
              (.user.login // "") == "github-actions[bot]" and
              ((.body // "") | contains($marker)) and
              ((.body // "") | contains($exact_subject)) and
              ((.body // "") | contains($exact_main)) and
              ((.body // "") | contains($policy_line))
            )] | sort_by(.id) | last | .id // empty' \
            <<<"$comments")"; then
            emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_RECEIPT_COMMENTS_MALFORMED"
            exit 2
          fi
          if [ -n "$comment_id" ] && ! [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]; then
            emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_RECEIPT_COMMENTS_MALFORMED"
            exit 2
          fi
          created=false
          if [ -z "$comment_id" ]; then
            if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_IMMEDIATELY_BEFORE_RECEIPT_POST"; then
              exit 2
            fi
            if ! append_effect_attempt \
              --kind issue_comment_post_intent \
              --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --mutation POST \
              --effect-transport-attempted true \
              --transport-outcome ATTEMPTED_PENDING_READBACK \
              --effect-observed false \
              --evidence-ref "post-intent:receipt-comment:${fingerprint}" >/dev/null; then
              emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
              exit 2
            fi
            mutation_error="$root/receipt-comment-post.stderr"
            if comment_id="$(jq -n --arg body "$body" '{body:$body}' \
              | gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --input - --jq .id 2>"$mutation_error")"; then
              if ! [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]; then
                append_effect_attempt \
                  --kind issue_comment_post \
                  --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --mutation POST_UNCONFIRMED_RESPONSE_MALFORMED \
                  --effect-transport-attempted true \
                  --transport-outcome UNCONFIRMED_RESPONSE_MALFORMED \
                  --effect-observed false \
                  --evidence-ref post-response:comment-id-malformed >/dev/null \
                  || { emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"; exit 2; }
                emit_subject_hold "POST_UNCONFIRMED_RESPONSE_MALFORMED"
                exit 2
              fi
              if ! append_effect_attempt \
                --kind issue_comment_post \
                --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --mutation POST \
                --effect-transport-attempted true \
                --transport-outcome ACKED \
                --effect-observed false \
                --evidence-ref "post-response:comment:${comment_id}" >/dev/null; then
                emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
                exit 2
              fi
            else
              if grep -Fq "API rate limit exceeded for installation" "$mutation_error"; then
                append_effect_attempt \
                  --kind issue_comment_post \
                  --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --mutation POST_UNCONFIRMED_RATE_LIMIT \
                  --effect-transport-attempted true \
                  --transport-outcome UNCONFIRMED_RATE_LIMIT \
                  --effect-observed false \
                  --evidence-ref post-stderr:installation-rate-limit >/dev/null \
                  || { emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"; exit 2; }
                emit_subject_hold "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
              else
                append_effect_attempt \
                  --kind issue_comment_post \
                  --endpoint-or-subject "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  --mutation POST_UNCONFIRMED_TRANSPORT_FAILED \
                  --effect-transport-attempted true \
                  --transport-outcome UNCONFIRMED_TRANSPORT_FAILED \
                  --effect-observed false \
                  --evidence-ref post-stderr:transport-failure >/dev/null \
                  || { emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"; exit 2; }
                emit_subject_hold "POST_UNCONFIRMED_TRANSPORT_FAILED"
              fi
              exit 2
            fi
            created=true
          fi

          if readback="$(gh_read "repos/${REPOSITORY}/issues/comments/${comment_id}")"; then
            :
          else
            rc=$?
            if [ "$created" = true ]; then
              if [ "$rc" -eq 75 ]; then
                emit_subject_hold "GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED"
              else
                emit_subject_hold "POST_UNCONFIRMED_READBACK_FAILED"
              fi
            else
              emit_read_failure "$rc" "EXACT_SUBJECT_DRIFT_BEFORE_RECEIPT_READBACK_GET_FAILED"
            fi
            exit 2
          fi
            if [ "$(jq -r .id <<<"$readback")" != "$comment_id" ] \
              || [ "$(jq -r .user.login <<<"$readback")" != "github-actions[bot]" ]; then
              if [ "$created" = true ]; then
                emit_subject_hold "POST_UNCONFIRMED_READBACK_MALFORMED"
            else
              emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_RECEIPT_READBACK_MALFORMED"
            fi
            exit 2
          fi
          if ! receipt_body="$(jq -r .body <<<"$readback")"; then
            if [ "$created" = true ]; then
              emit_subject_hold "POST_UNCONFIRMED_READBACK_MALFORMED"
            else
              emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_RECEIPT_READBACK_MALFORMED"
            fi
            exit 2
          fi
          case "$receipt_body" in
            *"$marker"*"Exact subject: #${PR_NUMBER}@${EXPECTED_HEAD}"*"Exact trusted Main: ${EXPECTED_MAIN}"*"Policy SHA-256: ${policy_sha}"*) ;;
            *)
              if [ "$created" = true ]; then
                emit_subject_hold "POST_UNCONFIRMED_READBACK_MALFORMED"
              else
                emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_RECEIPT_READBACK_MALFORMED"
              fi
              exit 2
              ;;
          esac

          if ! append_effect_attempt \
            --kind issue_comment_readback \
            --endpoint-or-subject "repos/${REPOSITORY}/issues/comments/${comment_id}" \
            --mutation NONE \
            --effect-transport-attempted false \
            --transport-outcome OBSERVED_READBACK \
            --effect-observed true \
            --evidence-ref "readback:comment:${comment_id}" >/dev/null; then
            emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
            exit 2
          fi

          if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_BEFORE_RECEIPT_READBACK"; then
            exit 2
          fi
          jq -n \
            --arg fingerprint "$fingerprint" \
            --arg policy_sha "$policy_sha" \
            --arg reconciliation_sha "$reconciliation_sha" \
            --arg pr "$PR_NUMBER" \
            --arg head "$EXPECTED_HEAD" \
            --arg main "$EXPECTED_MAIN" \
            --argjson effect_attempts "$(effect_attempts)" \
            --argjson effect_transport_attempted "$(effect_summary | jq -r .effect_transport_attempted)" \
            --arg mutation "$(effect_summary | jq -r .mutation)" \
            --argjson effect_observed "$(effect_summary | jq -r .effect_observed)" \
            --argjson comment_id "$comment_id" \
            --argjson created "$created" \
