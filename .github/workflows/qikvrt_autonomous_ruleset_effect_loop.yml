            emit_subject_hold "EXACT_SUBJECT_DRIFT_BEFORE_SUCCESS_STATUS_READBACK_MALFORMED"
            exit 2
          fi
          if [ -n "$existing_status_id" ]; then
            if ! append_effect_attempt \
              --kind commit_status_readback \
              --endpoint-or-subject "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}?per_page=100" \
              --mutation NONE \
              --effect-transport-attempted false \
              --transport-outcome OBSERVED_READBACK \
              --effect-observed true \
              --evidence-ref "readback:status:${existing_status_id}" >/dev/null; then
              emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
              exit 2
            fi
          else
            if ! verify_exact_subject "EXACT_SUBJECT_DRIFT_IMMEDIATELY_BEFORE_SUCCESS_STATUS_POST"; then
              exit 2
            fi
            if ! append_effect_attempt \
            --kind commit_status_post_intent \
            --endpoint-or-subject "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" \
            --mutation POST \
            --effect-transport-attempted true \
            --transport-outcome ATTEMPTED_PENDING_READBACK \
            --effect-observed false \
            --evidence-ref "post-intent:status:${EFFECT_STATUS_CONTEXT}" >/dev/null; then
            emit_subject_hold "EFFECT_ATTEMPT_LEDGER_APPEND_FAILED"
            exit 2
            fi
            mutation_error="$root/current-status-post.stderr"
            if status_response="$(gh api --method POST "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" \
            -f state=success \
            -f context="$EFFECT_STATUS_CONTEXT" \
            -f description="ruleset CURRENT; exact subject receipt reobserved" \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            2>"$mutation_error")"; then
