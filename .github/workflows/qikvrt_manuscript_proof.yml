name: QIK-VRT manuscript proof coverage

on:
  push:
    paths:
      - "formalization/QIKVRT_Formalization_v2.0/**"
      - "policy/GLOBAL_COMPLETION_SCOPE.json"
      - "GLOBAL_CLAIM_INVENTORY.json"
      - "GLOBAL_TRACEABILITY.json"
      - "GLOBAL_KERNEL_RECEIPTS.json"
      - "GLOBAL_COMPLETION_RECEIPT.json"
      - "tools/qikvrt_global_completion.py"
      - "tests/test_global_completion.py"
      - ".github/workflows/qikvrt_manuscript_proof.yml"
      - "docs/HUMAN_MACHINE_PROGRESS_STANDARD.md"
      - "schemas/human_machine_progress.schema.json"
  pull_request:
    paths:
      - "formalization/QIKVRT_Formalization_v2.0/**"
      - "policy/GLOBAL_COMPLETION_SCOPE.json"
      - "GLOBAL_CLAIM_INVENTORY.json"
      - "GLOBAL_TRACEABILITY.json"
      - "GLOBAL_KERNEL_RECEIPTS.json"
      - "GLOBAL_COMPLETION_RECEIPT.json"
      - "tools/qikvrt_global_completion.py"
      - "tests/test_global_completion.py"
      - ".github/workflows/qikvrt_manuscript_proof.yml"
      - "docs/HUMAN_MACHINE_PROGRESS_STANDARD.md"
      - "schemas/human_machine_progress.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-claim-and-kernel-gates:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: formalization/QIKVRT_Formalization_v2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore cumulative Lean runtime cache
        id: lean_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.elan
            formalization/QIKVRT_Formalization_v2.0/.lake/packages
          key: qikvrt-lean-${{ runner.os }}-${{ hashFiles('formalization/QIKVRT_Formalization_v2.0/lean-toolchain', 'formalization/QIKVRT_Formalization_v2.0/lakefile.toml', 'formalization/QIKVRT_Formalization_v2.0/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            qikvrt-lean-${{ runner.os }}-${{ hashFiles('formalization/QIKVRT_Formalization_v2.0/lean-toolchain', 'formalization/QIKVRT_Formalization_v2.0/lakefile.toml', 'formalization/QIKVRT_Formalization_v2.0/lake-manifest.json') }}-
            qikvrt-lean-${{ runner.os }}-
      - name: Initial Lean build
        id: initial_lean_build
        continue-on-error: true
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: formalization/QIKVRT_Formalization_v2.0
          test: false
      - name: Capture compact Lean compiler diagnostics
        if: steps.initial_lean_build.outcome == 'failure'
        shell: bash
        run: |
          set +e
          mkdir -p .lake/build
          lake build > .lake/build/lean-build-diagnostics.log 2>&1
          status=$?
          {
            printf 'LEAN_BUILD_EXIT=%s\n' "$status"
            printf '%s\n' '--- LAST 400 LINES ---'
            tail -n 400 .lake/build/lean-build-diagnostics.log
          } > .lake/build/lean-build-diagnostics-tail.log
          exit 0
      - name: Upload Lean compiler diagnostics
        if: steps.initial_lean_build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-lean-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: >-
            formalization/QIKVRT_Formalization_v2.0/.lake/build/lean-build-diagnostics-tail.log
          if-no-files-found: error
      - name: Enforce initial Lean build
        if: steps.initial_lean_build.outcome == 'failure'
        run: |
          cat .lake/build/lean-build-diagnostics-tail.log
          exit 1
      - name: Verify locked manuscript bytes and page count
        run: python3 scripts/verify_source_lock.py
      - name: Verify completed claim graph materialization
        run: python3 scripts/materialize_completion.py --check
      - name: Verify completed human proof map
        run: python3 scripts/render_completion_proof_map.py --check
      - name: Verify completed verification report
        run: python3 scripts/render_completion_verification_report.py --check
      - name: Validate completed claim graph and epistemic boundaries
        run: python3 scripts/validate_completion_claim_graph.py
      - name: Validate EFFECT_ACK source, structure and proof references
        run: python3 scripts/validate_effect_ack_claims.py
      - name: Run positive and negative provenance tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile exact statement/proof bindings
        run: lake build
      - name: Audit legacy and EFFECT_ACK theorem dependencies
        run: python3 scripts/audit_lean_axioms.py
      - name: Audit every completed manuscript proof constant
        run: python3 scripts/audit_completion_axioms.py
      - name: Reject project proof escapes
        run: python3 scripts/audit_proof_escapes.py
      - name: Verify completed proof-object manifest is current
        run: python3 scripts/materialize_completion_proof_manifest.py --check
      - name: Verify persistent proof-object manifest
        id: proof_object_manifest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p .lake/build
          python3 scripts/verify_proof_object_manifest.py \
            > .lake/build/qikvrt-proof-object-verifier.log 2>&1
          status=$?
          cat .lake/build/qikvrt-proof-object-verifier.log
          exit "$status"
      - name: Upload proof-object verifier diagnostics
        if: steps.proof_object_manifest.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-proof-object-verifier-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: >-
            formalization/QIKVRT_Formalization_v2.0/.lake/build/qikvrt-proof-object-verifier.log
          if-no-files-found: error
      - name: Enforce persistent proof-object verification
        if: steps.proof_object_manifest.outcome == 'failure'
        run: |
          cat .lake/build/qikvrt-proof-object-verifier.log
          exit 1
      - name: Materialize proof-object runtime evidence
        if: steps.proof_object_manifest.outcome == 'success'
        run: |
          set -euo pipefail
          python3 scripts/verify_proof_object_manifest.py \
            | tee .lake/build/qikvrt-proof-object-runtime-evidence.json
      - name: Verify exact-tag global completion and kernel-receipt coverage
        if: steps.proof_object_manifest.outcome == 'success'
        run: |
          set -euo pipefail
          python3 ../../tools/qikvrt_global_completion.py check --require-tag
          python3 ../../tests/test_global_completion.py
      - name: Materialize exact-head global kernel runtime receipt
        if: steps.proof_object_manifest.outcome == 'success'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          formal = Path('.').resolve()
          root = formal.parents[1]

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          scope = json.loads((root / 'policy/GLOBAL_COMPLETION_SCOPE.json').read_text(encoding='utf-8'))
          inventory = json.loads((root / 'GLOBAL_CLAIM_INVENTORY.json').read_text(encoding='utf-8'))
          kernel = json.loads((root / 'GLOBAL_KERNEL_RECEIPTS.json').read_text(encoding='utf-8'))
          runtime = formal / '.lake/build/qikvrt-proof-object-runtime-evidence.json'
          receipt = {
              'schema': 'qikvrt_global_kernel_runtime_receipt_v1',
              'state': 'KERNEL_GATES_PASSED_ON_EXACT_CANDIDATE_WITH_TAG_INPUT_EQUIVALENCE',
              'scope_id': scope['scope_id'],
              'exact_tag': scope['baseline']['tag'],
              'tag_authority_commit': scope['baseline']['authority_commit'],
              'tag_mirror_commit': scope['baseline']['mirror_commit'],
              'candidate_commit': os.environ['CANDIDATE_SHA'],
              'workflow_run_id': int(os.environ['WORKFLOW_RUN_ID']),
              'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
              'claim_count': inventory['counts']['claims'],
              'kernel_eligible_claim_count': inventory['counts']['kernel_eligible'],
              'kernel_receipt_count': kernel['counts']['receipts'],
              'global_claim_inventory_sha256': digest(root / 'GLOBAL_CLAIM_INVENTORY.json'),
              'global_traceability_sha256': digest(root / 'GLOBAL_TRACEABILITY.json'),
              'global_kernel_receipts_sha256': digest(root / 'GLOBAL_KERNEL_RECEIPTS.json'),
              'global_completion_receipt_sha256': digest(root / 'GLOBAL_COMPLETION_RECEIPT.json'),
              'proof_object_runtime_evidence_sha256': digest(runtime),
              'non_claims': [
                  'unqualified PASS',
                  'FINAL_PASS',
                  'repository-wide timeless EFFECT_ACK_DONE',
                  'truth of empirical or interpretive claims',
                  'fully kernel-verified overall completion',
              ],
          }
          target = formal / '.lake/build/qikvrt-global-kernel-runtime-receipt.json'
          target.write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload proof-object and global kernel runtime evidence
        if: steps.proof_object_manifest.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-global-kernel-runtime-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            formalization/QIKVRT_Formalization_v2.0/.lake/build/qikvrt-proof-object-runtime-evidence.json
            formalization/QIKVRT_Formalization_v2.0/.lake/build/qikvrt-global-kernel-runtime-receipt.json
          if-no-files-found: error
      - name: Emit cumulative runtime metrics
        if: always()
        env:
          CACHE_HIT: ${{ steps.lean_cache.outputs.cache-hit }}
        run: |
          mkdir -p ../../.qikvrt/evidence
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          target = Path('../../.qikvrt/evidence/runtime_cache_latest.json')
          target.write_text(json.dumps({
              'schema': 'qikvrt_runtime_cache_evidence_v1',
              'cache_hit': os.environ.get('CACHE_HIT', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
              'recorded_unix': int(time.time()),
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
