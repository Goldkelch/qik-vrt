# Temporary exact-subject bootstrap. It removes itself after persisting the permanent repair.
name: QIKVRT PR integrity persistence bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: qikvrt-pr-integrity-bootstrap-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/autonomy-root-cause-quota-8930ef47' &&
      github.actor == 'ingolf-lohmann'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BOOTSTRAP_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact bootstrap subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BOOTSTRAP_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply permanent bounded PR integrity writer repair
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='95ed5af58dcfc9ed3f7d8db7e408670483f3699c'
          test "$(git rev-parse --verify HEAD^1)" = "$expected_parent"
          test "$(git rev-parse --verify HEAD^{commit})" = "$BOOTSTRAP_HEAD"

          python3 -B - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/qikvrt_batch04_integrity.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          generate = """      - name: Regenerate and verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
"""
          restore = """      - name: Restore exact pull-request subject before integrity-only projection
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          git reset --hard "$EXPECTED_HEAD"
          git clean -fd
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"

"""
          if workflow.count(generate) != 1:
              raise SystemExit('BLOCK: integrity-generation insertion anchor is absent or ambiguous')
          workflow = workflow.replace(generate, restore + generate, 1)

          broad_commit = """      - name: Commit materialized repository evidence
        if: github.event_name != 'pull_request'
"""
          pr_commit = """      - name: Commit only pull-request integrity projection
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_HEAD"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$source_head" ]; then
            echo "BLOCK: target ref advanced before pull-request integrity persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Pull-request integrity projection is already current."
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt) ;;
              *)
                echo "BLOCK: non-integrity path staged for pull-request persistence: $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff --cached --name-only)
          git commit -m "ci: materialize pull-request integrity projection"
          committed_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo "BLOCK: target ref advanced while pull-request integrity projection was committed" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_after_commit=$remote_head_after_commit" >&2
            exit 2
          fi
          git push origin "HEAD:refs/heads/$TARGET_REF"
          persisted_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$persisted_head" != "$committed_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request integrity persistence readback mismatch" >&2
            echo "committed_head=$committed_head" >&2
            echo "persisted_head=$persisted_head" >&2
            exit 2
          fi

"""
          if workflow.count(broad_commit) != 1:
              raise SystemExit('BLOCK: broad persistence anchor is absent or ambiguous')
          workflow = workflow.replace(broad_commit, pr_commit + broad_commit, 1)
          workflow_path.write_text(workflow, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_qikvrt_repository_writer_lease.py')
          test = test_path.read_text(encoding='utf-8')
          marker = "\n\nif __name__ == '__main__':\n"
          method = r'''
    def test_repository_materializer_persists_same_repo_pr_integrity_only(self):
        path = Path('.github/workflows/qikvrt_batch04_integrity.yml')
        text = path.read_text(encoding='utf-8')
        restore = text.index(
            '      - name: Restore exact pull-request subject before integrity-only projection'
        )
        generate = text.index('      - name: Regenerate and verify repository integrity')
        pr_commit = text.index('      - name: Commit only pull-request integrity projection')
        broad_commit = text.index('      - name: Commit materialized repository evidence')
        self.assertLess(restore, generate)
        self.assertLess(generate, pr_commit)
        self.assertLess(pr_commit, broad_commit)
        restore_block = text[restore:generate]
        self.assertIn("if: github.event_name == 'pull_request'", restore_block)
        self.assertIn('git reset --hard "$EXPECTED_HEAD"', restore_block)
        pr_block = text[pr_commit:broad_commit]
        self.assertIn("if: github.event_name == 'pull_request'", pr_block)
        for integrity_path in (
            'REPOSITORY_FILE_MANIFEST.json',
            'REPOSITORY_FILE_MANIFEST.json.sha256',
            'SHA256SUMS.txt',
        ):
            self.assertIn(integrity_path, pr_block)
        self.assertNotIn('formalization/QIKVRT_Formalization_v2.0', pr_block)
        self.assertNotIn('docs/publications/', pr_block)
        self.assertIn(
            'target ref advanced before pull-request integrity persistence',
            pr_block,
        )
        self.assertIn(
            'target ref advanced while pull-request integrity projection was committed',
            pr_block,
        )
        self.assertIn(
            'HOLD_UNVERIFIED: pull-request integrity persistence readback mismatch',
            pr_block,
        )
        self.assertIn('git push origin "HEAD:refs/heads/$TARGET_REF"', pr_block)
'''
          if test.count(marker) != 1:
              raise SystemExit('BLOCK: writer-lease test insertion anchor is absent or ambiguous')
          if 'test_repository_materializer_persists_same_repo_pr_integrity_only' in test:
              raise SystemExit('BLOCK: writer-lease regression already exists unexpectedly')
          test = test.replace(marker, '\n' + method + marker, 1)
          test_path.write_text(test, encoding='utf-8', newline='\n')
          PY

          git rm .github/workflows/qikvrt_pr_integrity_persistence_bootstrap.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v tests.test_qikvrt_repository_writer_lease
          make test
          python3 -B tools/qikvrt_integrity.py verify

          git add \
            .github/workflows/qikvrt_batch04_integrity.yml \
            tests/test_qikvrt_repository_writer_lease.py \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt

          python3 -B - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/qikvrt_batch04_integrity.yml',
              '.github/workflows/qikvrt_pr_integrity_persistence_bootstrap.yml',
              'tests/test_qikvrt_repository_writer_lease.py',
              'REPOSITORY_FILE_MANIFEST.json',
              'REPOSITORY_FILE_MANIFEST.json.sha256',
              'SHA256SUMS.txt',
          }
          paths = {
              line[3:]
              for line in subprocess.check_output(
                  ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
                  text=True,
              ).splitlines()
              if line
          }
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f'BLOCK: bootstrap produced unexpected paths: {sorted(unexpected)}')
          missing = allowed - paths
          if missing:
              raise SystemExit(f'BLOCK: bootstrap missing expected delta paths: {sorted(missing)}')
          PY

          remote_head="$(
            git ls-remote --heads origin refs/heads/fix/autonomy-root-cause-quota-8930ef47 |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head" = "$BOOTSTRAP_HEAD" || {
            echo "BLOCK: repair branch advanced before bootstrap persistence" >&2
            echo "expected=$BOOTSTRAP_HEAD" >&2
            echo "remote=$remote_head" >&2
            exit 2
          }

          git config user.name 'ingolf-lohmann'
          git config user.email 'ingolf.lohmann@web.de'
          git commit -m 'fix(integrity): make PR projection self-cleaning'
          final_head="$(git rev-parse --verify HEAD^{commit})"
          git push origin HEAD:refs/heads/fix/autonomy-root-cause-quota-8930ef47
          readback="$(
            git ls-remote --heads origin refs/heads/fix/autonomy-root-cause-quota-8930ef47 |
              awk 'NR == 1 { print $1 }'
          )"
          test "$readback" = "$final_head" || {
            echo "HOLD_UNVERIFIED: bootstrap final-head readback mismatch" >&2
            exit 2
          }
          echo "persisted_head=$readback" >> "$GITHUB_STEP_SUMMARY"
