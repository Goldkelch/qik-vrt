name: QIK-VRT one-shot manuscript proof dispatch 6fec4bcf

on:
  push:
    branches:
      - automation/dispatch-manuscript-proof-6fec4bcf
    paths:
      - .github/workflows/qikvrt_dispatch_manuscript_proof_6fec4bcf_once.yml

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: qikvrt-one-shot-manuscript-proof-6fec4bcf
  cancel-in-progress: false

jobs:
  dispatch-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: trusted/pr115-mirror-portable-6fec4bcf
      EXPECTED_SHA: 6fec4bcf9679984a5cc6587ebd23be07492e3b5f
      TARGET_WORKFLOW: qikvrt_manuscript_proof.yml
      TARGET_PR: '115'
    steps:
      - name: Dispatch exact manuscript proof workflow
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            -f ref="$TARGET_BRANCH"
      - name: Resolve and gate exact workflow run
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qikvrt/evidence
          run_id=''
          for _attempt in $(seq 1 120); do
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
              -f branch="$TARGET_BRANCH" \
              -f event=workflow_dispatch \
              -f per_page=20 > .qikvrt/evidence/manuscript-proof-runs.json
            run_id=$(python3 - <<'PY'
          import json, os
          value = json.load(open('.qikvrt/evidence/manuscript-proof-runs.json', encoding='utf-8'))
          expected = os.environ['EXPECTED_SHA']
          for run in value.get('workflow_runs', []):
              if run.get('head_sha') == expected:
                  print(run['id'])
                  break
          PY
            )
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo 'BLOCK: exact workflow_dispatch run was not observed' >&2
            exit 1
          fi
          for _attempt in $(seq 1 240); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              > .qikvrt/evidence/manuscript-proof-run.json
            read -r status conclusion head_sha < <(python3 - <<'PY'
          import json
          run = json.load(open('.qikvrt/evidence/manuscript-proof-run.json', encoding='utf-8'))
          print(run.get('status', ''), run.get('conclusion') or '', run.get('head_sha', ''))
          PY
            )
            if [ "$head_sha" != "$EXPECTED_SHA" ]; then
              echo "BLOCK: run $run_id head $head_sha differs from $EXPECTED_SHA" >&2
              exit 1
            fi
            if [ "$status" = completed ]; then
              if [ "$conclusion" != success ]; then
                echo "BLOCK: manuscript proof run $run_id concluded $conclusion" >&2
                exit 1
              fi
              break
            fi
            sleep 5
          done
          if [ "${status:-}" != completed ] || [ "${conclusion:-}" != success ]; then
            echo "BLOCK: manuscript proof run $run_id did not complete successfully" >&2
            exit 1
          fi
          RUN_ID="$run_id" python3 - <<'PY'
          import json, os
          receipt = {
              'schema': 'qikvrt_exact_head_workflow_dispatch_receipt_v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow': os.environ['TARGET_WORKFLOW'],
              'target_branch': os.environ['TARGET_BRANCH'],
              'head_sha': os.environ['EXPECTED_SHA'],
              'run_id': int(os.environ['RUN_ID']),
              'event': 'workflow_dispatch',
              'status': 'completed',
              'conclusion': 'success',
              'scope': 'fresh_manuscript_lean_kernel_axiom_proof_escape_and_proof_object_gate',
          }
          with open('.qikvrt/evidence/manuscript-proof-dispatch-receipt.json', 'w', encoding='utf-8', newline='\n') as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Persist exact-head verification notice
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body "Exact-head manuscript proof dispatch completed successfully.\n\n- head: \`$EXPECTED_SHA\`\n- workflow: \`$TARGET_WORKFLOW\`\n- event: \`workflow_dispatch\`\n- run ID: \`${{ steps.gate.outputs.run_id }}\`\n- scope: fresh Lean build, source/claim graph, axiom audits, proof-escape rejection and proof-object runtime evidence\n\nNo global completion claim is made by this execution receipt."
      - name: Upload dispatch receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-manuscript-proof-dispatch-6fec4bcf
          retention-days: 30
          if-no-files-found: error
          path: .qikvrt/evidence/manuscript-proof-dispatch-receipt.json
