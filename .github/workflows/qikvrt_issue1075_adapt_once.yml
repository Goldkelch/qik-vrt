# Reuses the self-removing exact-parent carrier from PR #1069; never touches main.
# The existing materializer generates integrity only; this bounded transport also
# applies the literal tested repair because this connection has no dispatch/patch API.
name: QIKVRT issue1075 bounded writer-identity adaptation
on:
  push:
    branches: [repair/issue1075-writer-path-binding-452ed197-v1]
    paths: [.github/workflows/qikvrt_issue1075_adapt_once.yml]
permissions:
  contents: read
concurrency:
  group: qikvrt-issue1075-writer-path-binding-452ed197-v1
  cancel-in-progress: false
jobs:
  adapt-and-verify:
    if: github.repository == 'Goldkelch/qik-vrt' && github.ref == 'refs/heads/repair/issue1075-writer-path-binding-452ed197-v1'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_PARENT: 7042f6d76b682bac0c35add6281aba7510b7164e
      EXPECTED_MAIN: a86054139b49c13c5cd344753b248b46b5daf66f
      CARRIER: .github/workflows/qikvrt_issue1075_adapt_once.yml
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out literal carrier only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Set up repository Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind parent, source blobs and unchanged main; remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD^1 HEAD)" = "$CARRIER"
          test "$(git rev-parse HEAD:tools/qikvrt_requested_review_executor.py)" = 8cef97dd370b76604621550f2e9e7bad31652cff
          test "$(git rev-parse HEAD:tests/test_qikvrt_requested_review_executor.py)" = ee9126b9645dfb783d4734b5e10aa70533b161a0
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git rm -- "$CARRIER"
          python3 -B tools/qikvrt_tool_cache.py verify
      - name: Add regressions and reproduce both failures before repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import importlib.util, sys, unittest
          p=Path('tests/test_qikvrt_requested_review_executor.py')
          text=p.read_text(encoding='utf-8')
          old='"workflow_id": 41, "path": ".github/workflows/qikvrt_autonomous_self_heal.yml",'
          new='"workflow_id": 41 if name in (None, self.WRITER) else 42, "path": (".github/workflows/qikvrt_autonomous_self_heal.yml" if name in (None, self.WRITER) else ".github/workflows/qikvrt_live_status_watch.yml"),'
          assert text.count(old)==1
          text=text.replace(old,new,1)
          # Preserve the pagination test's purpose with a known writer identity.
          fixture_old='MODULE._active_writer_observation("example/qik-vrt", 999, {"writer"}, {MAIN_SHA, HEAD_SHA})'
          fixture_new='MODULE._active_writer_observation("example/qik-vrt", 999, {"QIK-VRT autonomous bounded self-heal"}, {MAIN_SHA, HEAD_SHA})'
          assert text.count(fixture_old)==1
          text=text.replace(fixture_old,fixture_new,1)
          marker='\n\nif __name__ == "__main__":'
          assert text.count(marker)==1
          extra='\n    def test_dynamic_run_name_keeps_allowlisted_writer_path(self):\n        history = [self.row(10000 + index) for index in range(250)]\n        active = self.row(7, status="in_progress")\n        active["name"] = "QIKVRT self-heal head=bound event=push"\n        calls = []\n        observed = self.observe(self.api(history + [active], calls))\n        self.assertEqual([row["id"] for row in observed], [7])\n        self.assertEqual(observed[0]["name"], self.WRITER)\n        self.assertEqual(observed[0]["workflow_id"], 41)\n        self.assertEqual(len(calls), 10)\n\n    def test_canonical_name_on_nonwriter_path_is_not_writer_identity(self):\n        active = self.row(7, status="queued")\n        active["path"] = ".github/workflows/qikvrt_live_status_watch.yml"\n        active["workflow_id"] = 42\n        calls = []\n        self.assertEqual(self.observe(self.api([active], calls)), [])\n        self.assertEqual(len(calls), 10)\n\n    def test_dynamic_writer_all_active_states_after_large_history(self):\n        for head in (MAIN_SHA, HEAD_SHA):\n            for state in self.STATES:\n                with self.subTest(head=head, state=state):\n                    history = [self.row(10000 + i, head=head) for i in range(250)]\n                    active = self.row(7, head=head, status=state)\n                    active["name"] = "dynamic display title, not workflow identity"\n                    calls = []\n                    observed = self.observe(self.api(history + [active], calls))\n                    self.assertEqual([row["id"] for row in observed], [7])\n                    self.assertEqual(observed[0]["name"], self.WRITER)\n                    self.assertEqual(len(calls), 10)\n\n    def test_missing_or_malformed_workflow_identity_is_not_zero_writers(self):\n        cases = [("workflow_id", None), ("workflow_id", True),\n                 ("workflow_id", 0), ("workflow_id", "41"),\n                 ("path", None), ("path", ""),\n                 ("path", "../qikvrt_autonomous_self_heal.yml"),\n                 ("path", ".github/workflows/qikvrt_autonomous_self_heal.yml@other")]\n        for key, value in cases:\n            with self.subTest(key=key, value=value):\n                active = self.row(7, head=MAIN_SHA, status="queued")\n                active[key] = value\n                with mock.patch.object(MODULE, "_gh_one", return_value={\n                    "total_count": 1, "workflow_runs": [active],\n                }) as read:\n                    with self.assertRaisesRegex(MODULE.ReviewObservationError, "workflow identity"):\n                        MODULE._active_writer_observation("example/qik-vrt", 999, {self.WRITER}, {MAIN_SHA})\n                    self.assertEqual(read.call_count, 1)\n\n    def test_unknown_writer_allowlist_binding_is_rejected_before_io(self):\n        with mock.patch.object(MODULE, "_gh_one") as read:\n            with self.assertRaisesRegex(MODULE.ReviewObservationError, "path binding is unknown"):\n                MODULE._active_writer_observation("example/qik-vrt", 999, {"unbound writer"}, {MAIN_SHA})\n            read.assert_not_called()\n\n    def test_writer_path_catalog_matches_actual_workflow_definitions(self):\n        import re\n        for name, path in MODULE.ACTIVE_WRITER_WORKFLOW_PATHS.items():\n            with self.subTest(name=name, path=path):\n                content = (ROOT / path).read_text(encoding="utf-8")\n                names = re.findall(r"^name:\\s*(.+)$", content, re.MULTILINE)\n                self.assertEqual(len(names), 1)\n                self.assertEqual(names[0].strip().strip("\\\"\'"), name)\n'
          p.write_text(text.replace(marker,extra+marker,1),encoding='utf-8')
          spec=importlib.util.spec_from_file_location('issue1075_regression',p)
          module=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=module
          spec.loader.exec_module(module)
          suite=unittest.TestSuite(module.ActiveWriterHistoryIndependenceTests(name) for name in (
              'test_dynamic_run_name_keeps_allowlisted_writer_path',
              'test_canonical_name_on_nonwriter_path_is_not_writer_identity',
          ))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==2 and len(result.failures)==2 and not result.errors, 'Original defect not reproduced exactly'
          print('EXPECTED_RED: both workflow-identity counterexamples reproduced against exact original source')
          PYCODE
      - name: Adapt existing observer using canonical path identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYCODE'
          from pathlib import Path

          MAPPING = '''ACTIVE_WRITER_WORKFLOW_PATHS = {
              "Autonomous issue processing": ".github/workflows/issue-autonomous-processing.yml",
              "QIK-VRT autonomous bounded self-heal": ".github/workflows/qikvrt_autonomous_self_heal.yml",
              "QIK-VRT autonomous draft-PR continuation": ".github/workflows/qikvrt_autonomous_pr_continuation.yml",
              "QIK-VRT expected-head promotion executor": ".github/workflows/qikvrt_expected_head_promotion.yml",
              "QIKVRT Batch-003 remaining subject disposition": ".github/workflows/qikvrt_batch003_remaining_disposition.yml",
              "QIKVRT repository evidence materialization": ".github/workflows/qikvrt_batch04_integrity.yml",
              "QIKVRT universal terminal materialization": ".github/workflows/qikvrt_universal_terminal_materialize.yml",
              "QIKVRT requested review executor": ".github/workflows/qikvrt_requested_review_executor.yml",
          }
          '''

          def once(text, old, new):
              if text.count(old) != 1:
                  raise ValueError('nonunique exact patch anchor: ' + old[:100])
              return text.replace(old, new, 1)

          def adapt(text):
              text=once(text, 'ACTIVE_WRITER_STATES = ', '# Canonical allowlist identity is the trusted workflow path, never run-name.\n'+MAPPING+'ACTIVE_WRITER_STATES = ')
              start=text.index('def _active_writer_observation(')
              stop=text.find('\n\ndef ',start+1)
              if stop < 0: stop=len(text)
              routine=text[start:stop]
              routine=once(routine, '    observed: dict[int, dict[str, Any]] = {}', '''    if not writer_names <= ACTIVE_WRITER_WORKFLOW_PATHS.keys():
                  raise ReviewObservationError("active writer workflow path binding is unknown")
              writer_paths = {ACTIVE_WRITER_WORKFLOW_PATHS[name]: name for name in writer_names}

              observed: dict[int, dict[str, Any]] = {}''')
              routine=once(routine, '                if run_id in seen:', '''                workflow_id = run.get("workflow_id")
                          path = run.get("path")
                          if (
                              isinstance(workflow_id, bool)
                              or not isinstance(workflow_id, int)
                              or workflow_id < 1
                              or not isinstance(path, str)
                              or re.fullmatch(r"\\.github/workflows/[A-Za-z0-9_.-]+\\.ya?ml", path) is None
                          ):
                              raise ReviewObservationError("active writer workflow identity is invalid")
                          if run_id in seen:''')
              routine=once(routine, '                if run_id == current_run_id or name not in writer_names:', '                if run_id == current_run_id or path not in writer_paths:')
              routine=once(routine, '                    "name": name,', '                    "name": writer_paths[path],')
              return text[:start]+routine+text[stop:]

          p=Path('tools/qikvrt_requested_review_executor.py')
          p.write_text(adapt(p.read_text(encoding='utf-8')),encoding='utf-8')
          PYCODE
      - name: Run complete executor tests and canonical materializer
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/test_qikvrt_requested_review_executor.py
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B - <<'PYCODE'
          import os, subprocess
          expected={os.environ['CARRIER'], 'tools/qikvrt_requested_review_executor.py',
                    'tests/test_qikvrt_requested_review_executor.py', 'REPOSITORY_FILE_MANIFEST.json',
                    'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt'}
          changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          assert changed <= expected and expected - {'REPOSITORY_FILE_MANIFEST.json','REPOSITORY_FILE_MANIFEST.json.sha256','SHA256SUMS.txt'} <= changed, changed
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip(), 'untracked output forbidden'
          PYCODE
      - name: Persist only repaired candidate and verify exact readback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/qikvrt_requested_review_executor.py tests/test_qikvrt_requested_review_executor.py REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git commit -m 'fix(review): bind active writers to workflow paths, not run titles' -m 'Issue #1075: retain bounded history-independent observation; add dynamic-name and wrong-path negative regressions. No predecessor evidence transfer, approval, merge, publication or completion claim.'
          result="$(git rev-parse HEAD)"
          # Non-force fast-forward rejects any competing branch successor.
          git push origin "HEAD:$GITHUB_REF"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$result"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          printf 'REPAIR_HEAD=%s\nREPAIR_TREE=%s\n' "$result" "$(git rev-parse HEAD^{tree})"
          git show --stat --oneline HEAD
