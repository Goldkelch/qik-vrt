# Temporary finite repair bootstrap: apply the exact dnsmasq wildcard-binding
# correction, add one regression contract, regenerate integrity, then remove
# this workflow in the same repair commit.
name: QIKVRT cloud transputer DNS repair bootstrap

on:
  push:
    branches: [runtime/cloud-transputer-v1]

permissions:
  contents: write

concurrency:
  group: qikvrt-cloud-transputer-dns-repair-bootstrap
  cancel-in-progress: false

jobs:
  repair-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply exact DNS repair and regression contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          from pathlib import Path

          entry_path = Path('deploy/cloud-transputer/entrypoint.sh')
          entry = entry_path.read_text(encoding='utf-8')
          old = 'listen-address=0.0.0.0\nbind-dynamic\nno-resolv\n'
          new = 'listen-address=0.0.0.0\nno-resolv\n'
          if entry.count(old) != 1:
              raise SystemExit('BLOCK: exact dnsmasq wildcard/bind-dynamic stanza not observed once')
          entry_path.write_text(entry.replace(old, new), encoding='utf-8', newline='\n')

          test_path = Path('tests/test_qikvrt_cloud_transputer_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '    def test_postgresql_discovery_is_version_depth_independent_and_fail_closed(self) -> None:\n'
          method = '''    def test_dnsmasq_wildcard_binding_avoids_bind_dynamic_conflict(self) -> None:\n        text = ENTRYPOINT.read_text(encoding="utf-8")\n        self.assertIn("listen-address=0.0.0.0", text)\n        self.assertNotIn("listen-address=0.0.0.0\\nbind-dynamic", text)\n\n'''
          if method in tests:
              raise SystemExit('BLOCK: DNS regression contract already present unexpectedly')
          if tests.count(anchor) != 1:
              raise SystemExit('BLOCK: regression insertion anchor not observed once')
          test_path.write_text(tests.replace(anchor, method + anchor), encoding='utf-8', newline='\n')
          PY

          python3 -B -m unittest -v tests.test_qikvrt_cloud_transputer_contract
          sh -n deploy/cloud-transputer/entrypoint.sh \
                deploy/cloud-transputer/runtime-health.sh \
                deploy/cloud-transputer/authority-mirror-refresh.sh
          grep -q '^listen-address=0.0.0.0$' deploy/cloud-transputer/entrypoint.sh
          ! grep -q '^bind-dynamic$' deploy/cloud-transputer/entrypoint.sh

      - name: Remove finite bootstrap and regenerate exact integrity trio
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/qikvrt_cloud_transputer_dns_repair_bootstrap.yml
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          git add deploy/cloud-transputer/entrypoint.sh \
                  tests/test_qikvrt_cloud_transputer_contract.py \
                  REPOSITORY_FILE_MANIFEST.json \
                  REPOSITORY_FILE_MANIFEST.json.sha256 \
                  SHA256SUMS.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote --heads origin refs/heads/runtime/cloud-transputer-v1 | awk 'NR==1 {print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git commit -m "fix: bind cloud DNS without wildcard dynamic conflict"
          git push origin HEAD:refs/heads/runtime/cloud-transputer-v1