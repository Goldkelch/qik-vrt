name: QIKVRT Batch-003 remaining subject disposition

on:
  push:
    branches:
      - agent/batch003-subject-172dd-public-freeze-probe
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/qikvrt_batch003_remaining_disposition.yml"
      - "tools/qikvrt_content_disposition_*.py"
      - "tools/qikvrt_batch003_*.py"
      - "tests/test_content_disposition_batch_003_*.py"
      - "release/zenodo-corpus-proof-2026-07-28/canonical-union/**"
      - "work-units/**"
      - "AI_PROGRESS.json"
      - "AI_STATUS.md"
  workflow_dispatch:

permissions:
  contents: read

# Pull-request execution is read-only and must not displace the one pending writer.
# Non-PR execution retains the shared exact-target repository writer lease.
concurrency:
  group: qikvrt-${{ github.event_name == 'pull_request' && 'batch003-remaining-readonly' || 'repository-evidence' }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-pr-readonly:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the exact pull-request head without a write credential
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_HEAD"
          printf 'head=%s\n' "$source_head" >> "$GITHUB_OUTPUT"
      - name: Verify all remaining subject dispositions offline first
        id: materialization
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/qikvrt-remaining-disposition-pr-recovery"
          mkdir -p "$artifact_root"
          receipt="$artifact_root/RECOVERY_RECEIPT.json"
          log="$artifact_root/materialization.log"
          capture_hold() {
            python3 - "$receipt" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          value = {
              "schema": "qikvrt_remaining_archive_disposition_recovery_v1",
              "state": "HOLD",
              "verification_state": "HOLD_UNVERIFIED",
              "failure_class": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
              "first_blocker": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
              "detail": "The read-only pull-request verifier did not preserve complete recovery evidence.",
              "offline_materialization_verified": False,
              "live_reobservation_attempted": False,
              "live_materialization_invoked": False,
              "public_get_retry_policy": {"attempts": 3, "backoff_seconds": [15, 45], "timeout_seconds": 240},
              "external_effect": False,
              "zenodo_mutation_attempted": False,
              "d0": 2,
              "continuation_required": True,
              "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
              "hold_reason": {
                  "reason_code": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
                  "reason": "The read-only pull-request verifier did not preserve complete recovery evidence.",
                  "subject": {"repository": "Goldkelch/qik-vrt", "kind": "zenodo_record_set", "identifier": "batch003-remaining-archives", "head_sha": None},
                  "evidence_refs": ["workflow-log:batch003-remaining-disposition-pr"],
                  "owner": {"role": "EXACT_SUBJECT_OBSERVER", "actor": "github-actions[bot]"},
                  "retry_condition": {"event": "FUTURE_FRESH_CONTENT_DISPOSITION_CARRIER", "predicate": "the verifier can preserve a complete receipt and log"},
                  "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
                  "d0": 2
              },
              "completion_claims": {"pass": False, "final_pass": False, "effect_ack_done": False, "proof_corpus_published_on_zenodo": False, "zenodo_mutation_authorized": False}
          }
          path.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          }
          : > "$log"
          set +e
          python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
            --verify-current --receipt "$receipt" --json >> "$log" 2>&1
          effective_exit=$?
          set -e
          if [ ! -s "$receipt" ]; then
            capture_hold
            effective_exit=2
          fi
          if [ "$effective_exit" -eq 0 ]; then
            set +e
            python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives --check --json >> "$log" 2>&1
            check_exit=$?
            if [ "$check_exit" -eq 0 ]; then
              python3 -B tools/qikvrt_content_disposition_batch_003_dispatch.py --check-status-projection --json >> "$log" 2>&1
              check_exit=$?
            fi
            set -e
            if [ "$check_exit" -ne 0 ]; then
              capture_hold
              effective_exit=2
            fi
          fi
          printf 'exit_code=%s\n' "$effective_exit" >> "$GITHUB_OUTPUT"
      - name: Preserve read-only pull-request disposition evidence
        id: recovery_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-batch003-remaining-disposition-pr-recovery-${{ steps.source.outputs.head }}
          path: ${{ runner.temp }}/qikvrt-remaining-disposition-pr-recovery/**
          retention-days: 30
          if-no-files-found: error
      - name: Enforce typed disposition HOLD after evidence upload
        if: >-
          always() && steps.materialization.outputs.exit_code != '' &&
          steps.materialization.outputs.exit_code != '0' &&
          steps.recovery_evidence.outcome == 'success'
        env:
          MATERIALIZATION_EXIT: ${{ steps.materialization.outputs.exit_code }}
          RECOVERY_RECEIPT: ${{ runner.temp }}/qikvrt-remaining-disposition-pr-recovery/RECOVERY_RECEIPT.json
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MATERIALIZATION_EXIT" =~ ^[1-9][0-9]*$ ]]
          test -s "$RECOVERY_RECEIPT"
          cat "$RECOVERY_RECEIPT" >&2
          exit "$MATERIALIZATION_EXIT"
  materialize:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact source head before materialization
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
          test -n "$remote_head"
          test "$source_head" = "$remote_head"
          printf 'head=%s\n' "$source_head" >> "$GITHUB_OUTPUT"
      - name: Materialize all remaining subject dispositions read-only
        id: materialization
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/qikvrt-remaining-disposition-recovery"
          mkdir -p "$artifact_root"
          receipt="$artifact_root/RECOVERY_RECEIPT.json"
          log="$artifact_root/materialization.log"
          capture_hold() {
            python3 - "$receipt" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          value = {
              "schema": "qikvrt_remaining_archive_disposition_recovery_v1",
              "state": "HOLD",
              "verification_state": "HOLD_UNVERIFIED",
              "failure_class": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
              "first_blocker": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
              "detail": "The content-disposition runner did not preserve a complete receipt and log before enforcement.",
              "offline_materialization_verified": False,
              "live_reobservation_attempted": False,
              "live_materialization_invoked": False,
              "public_get_retry_policy": {"attempts": 3, "backoff_seconds": [15, 45], "timeout_seconds": 240},
              "external_effect": False,
              "zenodo_mutation_attempted": False,
              "d0": 2,
              "continuation_required": True,
              "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
              "hold_reason": {
                  "reason_code": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
                  "reason": "The content-disposition runner did not preserve a complete receipt and log before enforcement.",
                  "subject": {"repository": "Goldkelch/qik-vrt", "kind": "zenodo_record_set", "identifier": "batch003-remaining-archives", "head_sha": None},
                  "evidence_refs": ["workflow-log:batch003-remaining-disposition"],
                  "owner": {"role": "EXACT_SUBJECT_OBSERVER", "actor": "github-actions[bot]"},
                  "retry_condition": {"event": "FUTURE_FRESH_CONTENT_DISPOSITION_CARRIER", "predicate": "the runner can preserve a complete receipt and log"},
                  "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
                  "d0": 2
              },
              "completion_claims": {"pass": False, "final_pass": False, "effect_ack_done": False, "proof_corpus_published_on_zenodo": False, "zenodo_mutation_authorized": False}
          }
          path.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          }
          set +e
          python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
            --ensure-current --receipt "$receipt" --json \
            | tee "$log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          effective_exit="${statuses[0]}"
          if [ "${statuses[1]}" -ne 0 ] || [ ! -s "$receipt" ]; then
            capture_hold
            effective_exit=2
          fi
          if [ "$effective_exit" -eq 0 ]; then
            if ! grep -F '"pass": false' "$log" || ! grep -F '"final_pass": false' "$log" || ! grep -F '"effect_ack_done": false' "$log" || ! grep -F '"zenodo_mutation_authorized": false' "$log" || ! grep -F '"proof_corpus_published_on_zenodo": false' "$log"; then
              capture_hold
              effective_exit=2
            fi
          fi
          printf 'exit_code=%s\n' "$effective_exit" >> "$GITHUB_OUTPUT"
      - name: Preserve Batch-003 content-disposition recovery evidence
        id: recovery_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-batch003-remaining-disposition-recovery-${{ steps.source.outputs.head }}
          path: ${{ runner.temp }}/qikvrt-remaining-disposition-recovery/**
          retention-days: 30
          if-no-files-found: error
      - name: Enforce a typed content-disposition HOLD after evidence upload
        if: >-
          always() && steps.materialization.outputs.exit_code != '' &&
          steps.materialization.outputs.exit_code != '0' &&
          steps.recovery_evidence.outcome == 'success'
        env:
          MATERIALIZATION_EXIT: ${{ steps.materialization.outputs.exit_code }}
          RECOVERY_RECEIPT: ${{ runner.temp }}/qikvrt-remaining-disposition-recovery/RECOVERY_RECEIPT.json
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MATERIALIZATION_EXIT" =~ ^[1-9][0-9]*$ ]]
          test -s "$RECOVERY_RECEIPT"
          cat "$RECOVERY_RECEIPT" >&2
          exit "$MATERIALIZATION_EXIT"
      - name: Verify deterministic materialization without network
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives --check --json
          python3 -B tools/qikvrt_content_disposition_batch_003_dispatch.py --check-status-projection --json
      - name: Regenerate and verify repository integrity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Run complete repository gates
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 tools/qikvrt_integrity.py verify
      - name: Persist exact evidence head
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ steps.source.outputs.head }}'
          test "$(git rev-parse --verify HEAD^{commit})" = "$source_head"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
          if [ "$remote_head" != "$source_head" ]; then
            echo 'BLOCK: target ref advanced before Batch-003 evidence persistence' >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-b4849e1a2d6b2270 \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-7956d8acdc473825 \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-ce2390f18618ad0c \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-780b9bf86425cee3 \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-7fdb36aa7c07c07d \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/CONTENT_DISPOSITION_BATCH_003_RECEIPT.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/retrospective-proof-corpus \
            work-units/CREATE_VERSIONED_CORRECTED_CANDIDATES_REMAINING_CORPUS_SUBJECTS.json \
            work-units/REQUEST_SEPARATE_ZENODO_MUTATION_AUTHORIZATION_RETROSPECTIVE_PROOF_CORPUS.json \
            AI_PROGRESS.json \
            AI_STATUS.md \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Evidence is already byte-current.'
            exit 0
          fi
          expected_tree="$(git write-tree)"
          if [ "$TARGET_REF" = main ]; then
            candidate_branch="automation/batch003-repository-evidence-${source_head:0:16}"
            if git ls-remote --exit-code --heads origin "refs/heads/$candidate_branch" >/dev/null 2>&1; then
              candidate_head="$(git ls-remote --heads origin "refs/heads/$candidate_branch" | awk 'NR == 1 { print $1 }')"
              test -n "$candidate_head" || {
                echo "HOLD_UNVERIFIED: existing Batch-003 candidate ref has no exact head" >&2
                exit 2
              }
              git fetch --no-tags origin "refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
              fetched_candidate_head="$(git rev-parse --verify "refs/remotes/origin/$candidate_branch^{commit}")"
              test "$fetched_candidate_head" = "$candidate_head" || {
                echo "HOLD_UNVERIFIED Batch-003 candidate ref advanced during exact reobservation" >&2
                exit 2
              }
              remote_main_before_existing="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')"
              test "$remote_main_before_existing" = "$source_head" || {
                echo "HOLD_UNVERIFIED main advanced before existing Batch-003 candidate reobservation" >&2
                exit 2
              }
              pr_readback="$RUNNER_TEMP/qikvrt-batch003-existing-pr-readback.json"
              gh pr view "$candidate_branch" \
                --repo "$GITHUB_REPOSITORY" \
                --json number,url,isDraft,baseRefName,baseRefOid,headRefName,headRefOid > "$pr_readback"
              receipt="$RUNNER_TEMP/qikvrt-batch003-existing-pr-receipt.json"
              python3 -B tools/qikvrt_candidate_pr_receipt.py \
                --readback "$pr_readback" \
                --expected-base "$source_head" \
                --expected-head "$candidate_head" \
                --expected-branch "$candidate_branch" \
                --expected-tree "$expected_tree" \
                --repository . \
                --receipt "$receipt"
              remote_main_after_existing="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')"
              test "$remote_main_after_existing" = "$source_head" || {
                echo "HOLD_UNVERIFIED main advanced during existing Batch-003 candidate reobservation" >&2
                exit 2
              }
              {
                echo '### Reobserved existing Batch-003 draft candidate'
                echo
                cat "$receipt"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git switch -c "$candidate_branch"
          fi
          git commit -m 'evidence: disposition remaining Zenodo subjects and verify proof corpus'
          remote_head_after_commit="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo 'BLOCK: target ref advanced after local Batch-003 commit; refusing push' >&2
            exit 2
          fi
          if [ "$TARGET_REF" = main ]; then
            candidate_head="$(git rev-parse --verify HEAD^{commit})"
            git push origin "HEAD:refs/heads/$candidate_branch"
            remote_main_before_pr="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')"
            test "$remote_main_before_pr" = "$source_head" || {
              echo "HOLD_UNVERIFIED main advanced before Batch-003 candidate pull request" >&2
              exit 2
            }
            pr_body="$RUNNER_TEMP/qikvrt-batch003-pr.md"
            {
              printf '%s\n' '<!-- qikvrt-expected-head-promotion:enabled external_effect=NONE -->' ''
              printf '%s\n' 'Exact trusted-main Batch-003 repository-evidence candidate.' ''
              printf '%s%s\n' '- observed main base: ' "$source_head"
              printf '%s%s\n' '- candidate head: ' "$candidate_head"
              printf '%s\n' '' 'This workflow did not write protected main. The candidate requires its own exact-head checks and the protected pull-request route. No review, merge, release, publication, PASS, FINAL_PASS, or EFFECT_ACK_DONE is implied.'
            } > "$pr_body"
            gh pr create \
              --draft \
              --base main \
              --head "$candidate_branch" \
              --title "evidence: materialize Batch-003 repository evidence ${source_head:0:16}" \
              --body-file "$pr_body"
            pr_readback="$RUNNER_TEMP/qikvrt-batch003-pr-readback.json"
            gh pr view "$candidate_branch" \
              --repo "$GITHUB_REPOSITORY" \
              --json number,url,isDraft,baseRefName,baseRefOid,headRefName,headRefOid > "$pr_readback"
            receipt="$RUNNER_TEMP/qikvrt-batch003-pr-receipt.json"
            python3 -B tools/qikvrt_candidate_pr_receipt.py \
              --readback "$pr_readback" \
              --expected-base "$source_head" \
              --expected-head "$candidate_head" \
              --expected-branch "$candidate_branch" \
              --expected-tree "$expected_tree" \
              --repository . \
              --receipt "$receipt"
            remote_main_after_pr="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')"
            test "$remote_main_after_pr" = "$source_head" || {
              echo "HOLD_UNVERIFIED main advanced during Batch-003 candidate pull-request creation" >&2
              exit 2
            }
            {
              echo '### Exact Batch-003 draft candidate receipt'
              echo
              cat "$receipt"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git push origin "HEAD:$TARGET_REF"
          fi
