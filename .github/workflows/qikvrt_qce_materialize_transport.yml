name: QIK-VRT one-shot QCE current-main materializer

on:
  push:
    branches:
      - "agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
    paths:
      - ".github/workflows/qikvrt_qce_materialize_transport.yml"

permissions:
  contents: write

concurrency:
  group: qikvrt-qce-current-main-materializer-${{ github.repository }}-agent-qce-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact QCE branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
          fetch-depth: 0
          persist-credentials: true

      - name: Verify current-main ancestry and transport blobs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
          git merge-base --is-ancestor 0b2360fa0c66c86e6ee6e71798adcdaf3ac2fac5 HEAD
          test ! -e docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          test "$(git hash-object state/transport/qce/part-00.b64)" = "23d19b2c30c7da0f75f122deae9936bbc62dd648"
          test "$(git hash-object state/transport/qce/part-01.b64)" = "dd8778f3048a22036abae2aac7991d86926d9513"
          test "$(git hash-object state/transport/qce/part-02.b64)" = "2aeebd92251a0a56557f0d702abd8bb082056726"
          test "$(git hash-object state/transport/qce/part-03.b64)" = "16f92edd588de797fb1ba03d5845f5d9ae90b0ed"
          test "$(git hash-object state/transport/qce/part-04.b64)" = "d36216934c2967e52f1951b1ab9c1ed39d375012"
          test "$(git hash-object state/transport/qce/repair-05a.b64)" = "30c4c32270b823a625201fe33841522db256475d"
          test "$(git hash-object state/transport/qce/repair-05b.b64)" = "cd56a6c7fde95510845bcf351a1afbca48e1d802"
          test "$(git hash-object state/transport/qce/part-06.b64)" = "9918decdbf191153f02465832e6dd068aefa183f"
          test "$(git hash-object state/transport/qce/part-07.b64)" = "29fe17edb3275528a11d9388769c62d3ffd0ed45"
          test "$(git hash-object state/transport/qce/part-08.b64)" = "c096f8ceec94393bb31b3e869eaa94f39ba7c79f"

      - name: Reconstruct and materialize the exact text overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("state/transport/qce/part-04.b64").read_text(encoding="ascii")
          if len(source) != 13999:
              raise SystemExit(f"unexpected part-04 length: {len(source)}")
          repaired = source[:13873] + "E" + source[13873:]
          if len(repaired) != 14000:
              raise SystemExit(f"unexpected repaired part-04 length: {len(repaired)}")
          Path("/tmp/qce-part-04-fixed.b64").write_text(repaired, encoding="ascii")
          PY
          cat \
            state/transport/qce/part-00.b64 \
            state/transport/qce/part-01.b64 \
            state/transport/qce/part-02.b64 \
            state/transport/qce/part-03.b64 \
            /tmp/qce-part-04-fixed.b64 \
            state/transport/qce/repair-05a.b64 \
            state/transport/qce/repair-05b.b64 \
            state/transport/qce/part-06.b64 \
            state/transport/qce/part-07.b64 \
            state/transport/qce/part-08.b64 \
            > /tmp/qce-overlay.b64
          fixed_hash="$(git hash-object /tmp/qce-part-04-fixed.b64)"
          total_bytes="$(wc -c < /tmp/qce-overlay.b64 | tr -d ' ')"
          if test "${total_bytes}" -ne 107188; then
            echo "::error file=.github/workflows/qikvrt_qce_materialize_transport.yml,line=55::QCE transport length mismatch: repaired_part04_sha=${fixed_hash}; total_base64_bytes=${total_bytes}; expected=107188"
            exit 1
          fi
          if ! base64 --decode /tmp/qce-overlay.b64 > /tmp/qce-text-overlay.tar.gz; then
            echo "::error file=.github/workflows/qikvrt_qce_materialize_transport.yml,line=55::QCE transport base64 decode failed: repaired_part04_sha=${fixed_hash}; total_base64_bytes=${total_bytes}"
            exit 1
          fi
          archive_sha="$(sha256sum /tmp/qce-text-overlay.tar.gz | awk '{print $1}')"
          if test "${archive_sha}" != "d757d1619f83d5d23209d16a1f67b90ba57ee9af6085c97af50a983a961a8271"; then
            echo "::error file=.github/workflows/qikvrt_qce_materialize_transport.yml,line=55::QCE archive digest mismatch: repaired_part04_sha=${fixed_hash}; total_base64_bytes=${total_bytes}; archive_sha=${archive_sha}; expected=d757d1619f83d5d23209d16a1f67b90ba57ee9af6085c97af50a983a961a8271"
            exit 1
          fi
          tar -xzf /tmp/qce-text-overlay.tar.gz -C .
          test -f .github/workflows/qikvrt_qce_candidate.yml
          test -f docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/VRTCore_QCE_Model.lean
          test -f docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/VRTCore_QCE_AxiomAudit.lean
          rm -f /tmp/qce-part-04-fixed.b64 /tmp/qce-overlay.b64 /tmp/qce-text-overlay.tar.gz

      - name: Install deterministic document tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation \
            lmodern \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-german \
            texlive-latex-extra \
            texlive-xetex

      - name: Build and statically verify the QCE package
        shell: bash
        run: |
          set -euo pipefail
          cd docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          if ! bash build_qce_pdf.sh > /tmp/qce-pdf-build.log 2>&1; then
            diagnostic="$(tail -n 24 /tmp/qce-pdf-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/QIK-VRT_QCE_Fachartikel_DE_2026-08-05.tex::QCE PDF build failed: ${diagnostic}"
            exit 1
          fi
          rm -f \
            QIK-VRT_QCE_Fachartikel_DE_2026-08-05.aux \
            QIK-VRT_QCE_Fachartikel_DE_2026-08-05.log \
            QIK-VRT_QCE_Fachartikel_DE_2026-08-05.out \
            QIK-VRT_QCE_Fachartikel_DE_2026-08-05.toc
          if ! python3 -B regenerate_qce_integrity.py > /tmp/qce-integrity.log 2>&1; then
            diagnostic="$(tail -n 24 /tmp/qce-integrity.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/regenerate_qce_integrity.py::QCE package integrity regeneration failed: ${diagnostic}"
            exit 1
          fi
          if ! python3 -B verify_qce_package.py --static-only > /tmp/qce-static.log 2>&1; then
            diagnostic="$(tail -n 32 /tmp/qce-static.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error file=docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/verify_qce_package.py::QCE static package verification failed: ${diagnostic}"
            exit 1
          fi
          cat /tmp/qce-integrity.log /tmp/qce-static.log
          rm -f /tmp/qce-pdf-build.log /tmp/qce-integrity.log /tmp/qce-static.log

      - name: Remove one-shot transport before repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -- state/transport/qce
          git rm -- .github/workflows/qikvrt_qce_materialize_transport.yml

      - name: Regenerate and verify repository-native integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Commit the current-main QCE candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qik-vrt-qce-materializer"
          git config user.email "qik-vrt-qce-materializer@users.noreply.github.com"
          git add -A
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"
          git commit -m "feat(qce): materialize current-main formal candidate"
          git push origin "HEAD:refs/heads/agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
