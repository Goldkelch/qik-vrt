name: QIKVRT one-shot live-status regression materialization

on:
  push:
    branches:
      - 'fix/live-status-pr-comment-permission-ff925'
    paths:
      - '.github/workflows/qikvrt_live_status_pr_comment_permission_repair_once.yml'

permissions:
  contents: write

concurrency:
  group: qikvrt-live-status-pr-comment-permission-repair
  cancel-in-progress: false

jobs:
  materialize-regression:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: a5161e845cfdd242e6c41ebda3868b685dbd45fa
      TARGET_BRANCH: fix/live-status-pr-comment-permission-ff925
      WORKFLOW_PATH: .github/workflows/qikvrt_live_status_watch.yml
      TEST_PATH: tests/test_qikvrt_workflow_executor_mesh_contract.py
    steps:
      - name: Check out exact user-authorized workflow successor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Bind exact permission repair
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"
          test "$(grep -Fxc '  pull-requests: write' "$WORKFLOW_PATH")" = 1
          ! grep -F 'pull-requests: read' "$WORKFLOW_PATH"
          ! grep -F 'pull_request_target:' "$WORKFLOW_PATH"

      - name: Freeze regression assertion in existing contract test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_qikvrt_workflow_executor_mesh_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '        self.assertIn("github.event_name == \'pull_request\'", live_watch)\n'
          replacement = (
              anchor
              + '        self.assertIn("issues: write", live_watch)\n'
              + '        self.assertIn("pull-requests: write", live_watch)\n'
              + '        self.assertNotIn("pull-requests: read", live_watch)\n'
              + '        self.assertIn("repos/$REPOSITORY/issues/$pr/comments", live_watch)\n'
              + '        self.assertNotIn("pull_request_target:", live_watch)\n'
          )
          if tests.count(anchor) != 1:
              raise SystemExit('LIVE_STATUS_REGRESSION_TEST_ANCHOR_MISMATCH')
          tests = tests.replace(anchor, replacement, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Run focused contract and regenerate integrity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v tests.test_qikvrt_workflow_executor_mesh_contract
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py generate
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py verify

      - name: Persist only non-workflow regression and integrity bytes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          git add "$TEST_PATH" LICENSE_CLASSIFICATION.json REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'WORKFLOW_PATH_UNEXPECTEDLY_STAGED' >&2
            exit 1
          fi
          git config user.name 'qik-vrt-live-status-repair[bot]'
          git config user.email 'qik-vrt-live-status-repair[bot]@users.noreply.github.com'
          git commit -m 'test(review): freeze live status PR-comment permission'
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
