name: QIK-VRT one-shot autonomous continuation script finalization

on:
  push:
    branches:
      - "fix/autonomous-continuation-script-v1"
    paths:
      - ".github/workflows/qikvrt_autonomous_continuation_script_finalize_once.yml"

permissions:
  contents: write

concurrency:
  group: qikvrt-autonomous-continuation-script-finalize-${{ github.repository }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact repair precursor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "fix/autonomous-continuation-script-v1"
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact bounded precursor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5ca704342fd611050f98ed69026ae6657d135a84"
          base="bb227e47c245f6182c93a09b8e4183295dbb7da8"
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/qikvrt_autonomous_continuation_script_finalize_once.yml' \
            '.github/workflows/qikvrt_autonomous_pr_continuation.yml' \
            'docs/operations/AUTONOMOUS_PR_CONTINUATION.md' \
            'state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json' \
            'tests/test_qikvrt_autonomous_pr_continuation.py' \
            'tools/qikvrt_autonomous_pr_continue.sh' | sort)"
          test "$actual" = "$expected"
          bash -n tools/qikvrt_autonomous_pr_continue.sh

      - name: Remove one-shot locally and regenerate final-tree integrity
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/qikvrt_autonomous_continuation_script_finalize_once.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Run exact repair and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/qikvrt_autonomous_pr_continue.sh
          python3 -m py_compile tests/test_qikvrt_autonomous_pr_continuation.py
          python3 -B -m unittest -v \
            tests.test_qikvrt_autonomous_pr_continuation \
            tests.test_qikvrt_autonomous_self_heal \
            tests.test_qikvrt_publication_overview
          python3 -B tools/qikvrt_publication_overview.py check
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Persist only final-tree integrity outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'REPOSITORY_FILE_MANIFEST.json' \
            'REPOSITORY_FILE_MANIFEST.json.sha256' \
            'SHA256SUMS.txt' | sort)"
          test "$actual" = "$expected"
          test "$(git status --porcelain=v1 | grep '^ D .github/workflows/qikvrt_autonomous_continuation_script_finalize_once.yml$' | wc -l)" -eq 1
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"
          git config user.name "qik-vrt-autonomy-continuation-script-finalizer"
          git config user.email "qik-vrt-autonomy-continuation-script-finalizer@users.noreply.github.com"
          git commit -m "chore(integrity): bind syntax-checked autonomous continuation"
          git push origin "HEAD:refs/heads/fix/autonomous-continuation-script-v1"
