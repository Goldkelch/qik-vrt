name: QIKVRT MLP Firefox Effect-Ack E2E

on:
  pull_request:
    paths:
      - 'browser/firefox/qikvrt-terminal/**'
      - 'src/qikvrt_effect_ack_http_terminal.py'
      - 'policy/MLP_FIREFOX_EFFECT_ACK_E2E_V1.json'
      - 'tests/test_qikvrt_firefox_terminal_e2e_contract.py'
      - 'tools/qikvrt_firefox_terminal_e2e.py'
      - '.github/workflows/qikvrt_mlp_firefox_effect_ack_e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-terminal-effect-ack-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact head and run contract tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_firefox_terminal_e2e_contract \
            tests.test_qikvrt_mlp_firefox_terminal \
            tests.test_qikvrt_effect_ack_http_terminal

      - name: Observe installed Firefox runtime
        run: |
          set -euo pipefail
          (firefox --version || firefox-esr --version) | tee /tmp/firefox-version.txt

      - name: Acquire pinned Mozilla geckodriver with GitHub asset digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-firefox-e2e/geckodriver
          curl --fail --location --retry 3 \
            'https://api.github.com/repos/mozilla/geckodriver/releases/tags/v0.37.1' \
            -o /tmp/qikvrt-firefox-e2e/geckodriver/release.json
          python3 - <<'PY' > /tmp/qikvrt-firefox-e2e/geckodriver/asset.env
          import json
          p=json.load(open('/tmp/qikvrt-firefox-e2e/geckodriver/release.json'))
          a=next(x for x in p['assets'] if x['name']=='geckodriver-v0.37.1-linux64.tar.gz')
          assert isinstance(a.get('digest'), str) and a['digest'].startswith('sha256:')
          print('URL='+a['browser_download_url'])
          print('SHA256='+a['digest'].split(':',1)[1])
          PY
          . /tmp/qikvrt-firefox-e2e/geckodriver/asset.env
          curl --fail --location --retry 3 "$URL" -o /tmp/qikvrt-firefox-e2e/geckodriver/geckodriver.tar.gz
          printf '%s  %s\n' "$SHA256" /tmp/qikvrt-firefox-e2e/geckodriver/geckodriver.tar.gz | sha256sum -c -
          tar -xzf /tmp/qikvrt-firefox-e2e/geckodriver/geckodriver.tar.gz -C /tmp/qikvrt-firefox-e2e/geckodriver
          /tmp/qikvrt-firefox-e2e/geckodriver/geckodriver --version | tee /tmp/qikvrt-firefox-e2e/geckodriver/version.txt

      - name: Package exact temporary Firefox terminal XPI
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-firefox-e2e
          (cd browser/firefox/qikvrt-terminal && zip -qr /tmp/qikvrt-firefox-e2e/qikvrt-terminal.xpi .)
          sha256sum /tmp/qikvrt-firefox-e2e/qikvrt-terminal.xpi | tee /tmp/qikvrt-firefox-e2e/qikvrt-terminal.xpi.sha256

      - name: Start bounded loopback Effect-Ack backend
        run: |
          set -euo pipefail
          python3 -B src/qikvrt_effect_ack_http_terminal.py \
            > /tmp/qikvrt-firefox-e2e/backend.log 2>&1 &
          echo $! > /tmp/qikvrt-firefox-e2e/backend.pid
          ready=0
          for i in $(seq 1 100); do
            if curl --fail --silent 'http://127.0.0.1:8771/.well-known/effect-ack' \
              > /tmp/qikvrt-firefox-e2e/discovery.json 2>/dev/null; then ready=1; break; fi
            sleep 0.1
          done
          test "$ready" -eq 1
          cat /tmp/qikvrt-firefox-e2e/discovery.json

      - name: Execute real Firefox terminal prepare commit and browser observation
        env:
          QIKVRT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export QIKVRT_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          mkdir -p "$HOME/qikvrt-gecko-profiles"
          python3 -B tools/qikvrt_firefox_terminal_e2e.py \
            --geckodriver /tmp/qikvrt-firefox-e2e/geckodriver/geckodriver \
            --xpi /tmp/qikvrt-firefox-e2e/qikvrt-terminal.xpi \
            --receipt /tmp/qikvrt-firefox-e2e/browser-receipt.json \
            --geckodriver-log /tmp/qikvrt-firefox-e2e/geckodriver.log \
            --profile-root "$HOME/qikvrt-gecko-profiles"
          cat /tmp/qikvrt-firefox-e2e/browser-receipt.json

      - name: Reobserve backend effect and bind exact receipt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          curl --fail --silent 'http://127.0.0.1:8771/terminal/state' \
            > /tmp/qikvrt-firefox-e2e/backend-state.json
          cat /tmp/qikvrt-firefox-e2e/backend-state.json
          export TREE_SHA="$(git rev-parse HEAD^{tree})"
          export XPI_SHA="$(sha256sum /tmp/qikvrt-firefox-e2e/qikvrt-terminal.xpi | awk '{print $1}')"
          export GECKO_SHA="$(sha256sum /tmp/qikvrt-firefox-e2e/geckodriver/geckodriver.tar.gz | awk '{print $1}')"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          browser=json.loads(Path('/tmp/qikvrt-firefox-e2e/browser-receipt.json').read_text())
          state=json.loads(Path('/tmp/qikvrt-firefox-e2e/backend-state.json').read_text())
          assert browser['firefox_terminal_execution_observed'] is True
          assert browser['bounded_loopback_effect_ack_done'] is True
          assert browser['nonce']=='QIKVRT-FIREFOX-E2E-NONCE-0001'
          assert state['events']==1
          assert state['last_event']['kind']=='TERMINAL_INPUT_ACCEPTED'
          assert state['last_event']['text']=='QIKVRT-FIREFOX-E2E-NONCE-0001'
          assert state['last_event']['external_effect']=='NONE'
          assert state['external_effects']=='NONE'
          receipt={
            'schema':'qikvrt_mlp_firefox_effect_ack_e2e_receipt_v1',
            'repository':'Goldkelch/qik-vrt','source_head':os.environ['HEAD_SHA'],'source_tree':os.environ['TREE_SHA'],
            'run_id':int(os.environ['RUN_ID']),'run_attempt':int(os.environ['RUN_ATTEMPT']),
            'tcpip_source_head':'a71484ba02f6ebe9169af5a291244e99468caec3',
            'tcpip_source_tree':'b45556a6c4ea2d9946c73264c1ed47d4f3128a76',
            'xpi_sha256':os.environ['XPI_SHA'],'geckodriver_archive_sha256':os.environ['GECKO_SHA'],
            'firefox_terminal_execution_observed':True,
            'effect_ack_discovery_observed':True,
            'effect_ack_prepare_record_validated':True,
            'effect_ack_commit_observed':True,
            'bounded_loopback_effect_ack_done':True,
            'effect_ack_done_scope':'BOUNDED_LOOPBACK_TERMINAL_INPUT_ONLY',
            'post_effect_reobservation_observed':True,
            'nonce':'QIKVRT-FIREFOX-E2E-NONCE-0001',
            'external_effect':'NONE','physical_megast_execution':False,'general_internet_reachability_claimed':False,
            'browser':browser
          }
          Path('/tmp/qikvrt-firefox-e2e/MLP_FIREFOX_EFFECT_ACK_E2E_RECEIPT_V1.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True,indent=2))
          PY
          echo 'FIREFOX_TERMINAL_EXECUTION_OBSERVED=true'
          echo 'BOUNDED_LOOPBACK_EFFECT_ACK_DONE=true'

      - name: Preserve Firefox terminal proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qikvrt-firefox-terminal-effect-ack-e2e-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/firefox-version.txt
            /tmp/qikvrt-firefox-e2e/qikvrt-terminal.xpi
            /tmp/qikvrt-firefox-e2e/qikvrt-terminal.xpi.sha256
            /tmp/qikvrt-firefox-e2e/browser-receipt.json
            /tmp/qikvrt-firefox-e2e/backend-state.json
            /tmp/qikvrt-firefox-e2e/MLP_FIREFOX_EFFECT_ACK_E2E_RECEIPT_V1.json
            /tmp/qikvrt-firefox-e2e/backend.log
            /tmp/qikvrt-firefox-e2e/geckodriver.log
            /tmp/qikvrt-firefox-e2e/geckodriver/version.txt
            /tmp/qikvrt-firefox-e2e/geckodriver/release.json
          if-no-files-found: warn
          retention-days: 30
