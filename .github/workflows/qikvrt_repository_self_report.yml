name: QIK-VRT repository self-report

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_run:
    types: [completed]
  repository_dispatch:
    types: [qikvrt_repository_self_report]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to reobserve
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: read
  checks: read
  actions: read

concurrency:
  group: qikvrt-repository-self-report-${{ github.repository }}-${{ github.event.pull_request.number || github.event.client_payload.pull_request || github.event.inputs.pull_request || github.run_id }}
  cancel-in-progress: false

jobs:
  report-material-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve repository-native pull-request carrier
        id: carrier
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_PR: ${{ github.event.inputs.pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number=""
          case "$EVENT_NAME" in
            pull_request)
              pr_number="$(jq -r '.pull_request.number // empty' "$EVENT_PATH")"
              ;;
            repository_dispatch)
              pr_number="$(jq -r '.client_payload.pull_request // empty' "$EVENT_PATH")"
              ;;
            workflow_dispatch)
              pr_number="$INPUT_PR"
              ;;
            workflow_run)
              run_id="$(jq -r '.workflow_run.id // empty' "$EVENT_PATH")"
              test -n "$run_id"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/pull_requests" \
                --jq 'map(select(.state == "open")) | sort_by(.number) | .[0].number // empty' \
                > /tmp/qikvrt-pr-number
              pr_number="$(cat /tmp/qikvrt-pr-number)"
              ;;
          esac
          if [ -z "$pr_number" ]; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$pr_number" in
            *[!0-9]*|'') echo "invalid PR number: $pr_number" >&2; exit 2 ;;
          esac
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Observe exact current repository state
        if: steps.carrier.outputs.found == 'true'
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.carrier.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/qikvrt-pr.json
          state="$(jq -r '.state' /tmp/qikvrt-pr.json)"
          test "$state" = open
          head_sha="$(jq -r '.head.sha' /tmp/qikvrt-pr.json)"
          head_ref="$(jq -r '.head.ref' /tmp/qikvrt-pr.json)"
          base_sha="$(jq -r '.base.sha' /tmp/qikvrt-pr.json)"
          base_ref="$(jq -r '.base.ref' /tmp/qikvrt-pr.json)"
          draft="$(jq -r '.draft' /tmp/qikvrt-pr.json)"
          mergeable="$(jq -r '.mergeable' /tmp/qikvrt-pr.json)"
          mergeable_state="$(jq -r '.mergeable_state' /tmp/qikvrt-pr.json)"
          head_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${head_sha}" --jq '.tree.sha')"
          live_base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${base_ref}" --jq '.object.sha')"

          gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/status" > /tmp/qikvrt-status.json
          combined_state="$(jq -r '.state' /tmp/qikvrt-status.json)"
          failing_status="$(jq -r '[.statuses[] | select(.state == "failure" or .state == "error")][0] | if . == null then "none" else (.context + ": " + (.description // .state)) end' /tmp/qikvrt-status.json)"

          gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" \
            -H 'Accept: application/vnd.github+json' > /tmp/qikvrt-checks.json
          failing_check="$(jq -r '[.check_runs[] | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required")][0] | if . == null then "none" else (.name + ": " + .conclusion) end' /tmp/qikvrt-checks.json)"
          active_check_count="$(jq '[.check_runs[] | select(.status != "completed")] | length' /tmp/qikvrt-checks.json)"

          disposition='READY_FOR_INDEPENDENT_REVIEW'
          next_action='run the repository-defined independent review/readback on this exact head'
          if [ "$mergeable_state" = dirty ] || [ "$mergeable" = false ] && [ "$mergeable_state" = dirty ]; then
            disposition='REBIND_REQUIRED'
            next_action="history-preservingly integrate exact ${base_ref}@${live_base_sha}, resolve conflicts, regenerate integrity material, push a successor head, then reobserve exact head/tree"
          elif [ "$combined_state" = failure ] || [ "$combined_state" = error ] || [ "$failing_check" != none ]; then
            disposition='HOLD_WITH_FIRST_CAUSAL_BLOCKER'
            next_action='repair the first exact-head failing status/check in repository scope, then reobserve the successor head'
          elif [ "$active_check_count" -gt 0 ]; then
            disposition='ACTIVE_EXECUTION'
            next_action='allow the already-running repository checks to reach a terminal state; workflow_run will reobserve without external polling'
          elif [ "$draft" = true ]; then
            disposition='ACTIVE_EXECUTION'
            next_action='continue the repository-owned draft work unit on the same exact carrier'
          elif [ "$base_sha" != "$live_base_sha" ]; then
            disposition='REBIND_REQUIRED'
            next_action="rebind to exact live ${base_ref}@${live_base_sha} without transferring predecessor evidence, then reobserve"
          fi

          fingerprint="$(
            printf '%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s' \
              "$PR_NUMBER" "$head_sha" "$head_tree" "$live_base_sha" "$mergeable" \
              "$mergeable_state" "$combined_state" "$failing_status" "$failing_check" \
              | sha256sum | awk '{print $1}'
          )"

          {
            echo "head_sha=$head_sha"
            echo "head_tree=$head_tree"
            echo "head_ref=$head_ref"
            echo "base_ref=$base_ref"
            echo "observed_base_sha=$base_sha"
            echo "live_base_sha=$live_base_sha"
            echo "draft=$draft"
            echo "mergeable=$mergeable"
            echo "mergeable_state=$mergeable_state"
            echo "combined_state=$combined_state"
            echo "active_check_count=$active_check_count"
            echo "disposition=$disposition"
            echo "fingerprint=$fingerprint"
          } >> "$GITHUB_OUTPUT"
          {
            echo 'failing_status<<EOF'
            echo "$failing_status"
            echo EOF
            echo 'failing_check<<EOF'
            echo "$failing_check"
            echo EOF
            echo 'next_action<<EOF'
            echo "$next_action"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Deduplicate material state fingerprint
        if: steps.carrier.outputs.found == 'true'
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.carrier.outputs.pr_number }}
          FINGERPRINT: ${{ steps.observe.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- qikvrt-repository-self-report:${FINGERPRINT} -->"
          existing="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | .body' \
              | grep -F -m1 -- "$marker" || true
          )"
          if [ -n "$existing" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Report material delta to the repository carrier itself
        if: steps.carrier.outputs.found == 'true' && steps.dedupe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.carrier.outputs.pr_number }}
          HEAD_SHA: ${{ steps.observe.outputs.head_sha }}
          HEAD_TREE: ${{ steps.observe.outputs.head_tree }}
          HEAD_REF: ${{ steps.observe.outputs.head_ref }}
          BASE_REF: ${{ steps.observe.outputs.base_ref }}
          OBSERVED_BASE_SHA: ${{ steps.observe.outputs.observed_base_sha }}
          LIVE_BASE_SHA: ${{ steps.observe.outputs.live_base_sha }}
          MERGEABLE: ${{ steps.observe.outputs.mergeable }}
          MERGEABLE_STATE: ${{ steps.observe.outputs.mergeable_state }}
          COMBINED_STATE: ${{ steps.observe.outputs.combined_state }}
          ACTIVE_CHECK_COUNT: ${{ steps.observe.outputs.active_check_count }}
          FAILING_STATUS: ${{ steps.observe.outputs.failing_status }}
          FAILING_CHECK: ${{ steps.observe.outputs.failing_check }}
          DISPOSITION: ${{ steps.observe.outputs.disposition }}
          NEXT_ACTION: ${{ steps.observe.outputs.next_action }}
          FINGERPRINT: ${{ steps.observe.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qikvrt-self-report.md <<EOF
          <!-- qikvrt-repository-self-report:${FINGERPRINT} -->
          Repository-native exact-state receipt

          - exact head: \`${HEAD_SHA}\`
          - exact tree: \`${HEAD_TREE}\`
          - carrier branch: \`${HEAD_REF}\`
          - observed PR base: \`${BASE_REF}@${OBSERVED_BASE_SHA}\`
          - live base: \`${BASE_REF}@${LIVE_BASE_SHA}\`
          - mergeability: \`${MERGEABLE}\` / \`${MERGEABLE_STATE}\`
          - combined status: \`${COMBINED_STATE}\`
          - active check-runs: \`${ACTIVE_CHECK_COUNT}\`
          - first failing status: \`${FAILING_STATUS}\`
          - first failing check: \`${FAILING_CHECK}\`
          - disposition: \`${DISPOSITION}\`

          Repository-safe successor: ${NEXT_ACTION}

          This receipt is repository evidence only. It does not assert merge, approval, deployment, publication, PASS, FINAL_PASS, EFFECT_ACK_DONE, or any other external effect.
          EOF
          gh pr comment "$PR_NUMBER" --body-file /tmp/qikvrt-self-report.md

      - name: Confirm duplicate/no-carrier as strict NOOP
        if: steps.carrier.outputs.found != 'true' || steps.dedupe.outputs.changed != 'true'
        run: echo 'NOOP: no new material repository-native state fingerprint to report.'
