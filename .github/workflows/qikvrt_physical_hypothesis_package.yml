name: QIKVRT physical hypothesis package

on:
  pull_request:
    paths:
      - 'publications/observation-bandwidth-causal-order-falsification-v1/**'
      - 'tests/test_qikvrt_physical_hypothesis_package.py'
      - 'evidence/systemtest/UNIVERSAL_TERMINAL_SYSTEMTEST_RECEIPT_V1.json'
      - 'evidence/systemtest/UNIVERSAL_TERMINAL_SYSTEMTEST_RECEIPT_V1.sha256'
      - '.github/workflows/qikvrt_physical_hypothesis_package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact head and tree
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          printf 'head=%s\n' "$(git rev-parse HEAD)"
          printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Validate falsifiable physical-hypothesis package
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_qikvrt_physical_hypothesis_package

      - name: Verify validation did not mutate repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
