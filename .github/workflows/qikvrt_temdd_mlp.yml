name: QIKVRT TEMDD MLP vertical slice

on:
  pull_request:
    paths:
      - "mlp/**"
      - "runtime/megast/mlp_*"
      - "runtime/host/mlp_*"
      - "runtime/cloud/**"
      - "tests/test_qikvrt_temdd_mlp.py"
      - "docs/TEMDD_MLP_MACHINE_LEARNING_PROGRAM.md"
      - ".github/workflows/qikvrt_temdd_mlp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile ANSI C89 and test TEMDD event boundaries
        run: python3 -B -m unittest -v tests.test_qikvrt_temdd_mlp

      - name: Verify pure M68000 leaf bytes remain visibly bound
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'moveq   #3,d1' runtime/megast/mlp_kernel_68000.s
          grep -F 'moveq   #1,d2' runtime/megast/mlp_kernel_68000.s
          grep -F 'moveq   #3,d0' runtime/megast/mlp_kernel_68000.s
          grep -F '7203740170034e75' mlp/TEMDD_MLP_EVENT_MODEL_V1.json

      - name: Verify cloud runtime stays supply-chain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'FIREFOX_TARBALL_SHA256' runtime/cloud/Dockerfile.mlp
          grep -F 'QIKVRT_FIREFOX_XPI_SHA256' runtime/cloud/Dockerfile.mlp
          grep -F 'EMUTOS_ROM_SHA256' runtime/cloud/mlp_cloud_entrypoint.sh
          grep -F -- '--machine megast' runtime/cloud/mlp_cloud_entrypoint.sh
          grep -F -- '--cpulevel 0' runtime/cloud/mlp_cloud_entrypoint.sh
          grep -F -- '--cpuclock 8' runtime/cloud/mlp_cloud_entrypoint.sh
          grep -F -- '--addr24 true' runtime/cloud/mlp_cloud_entrypoint.sh
