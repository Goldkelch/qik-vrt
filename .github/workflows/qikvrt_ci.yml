name: QIKVRT CI

on:
  push:
    branches-ignore:
      - automation/effect-ack-universality-reserve-20260722
      - automation/effect-ack-universality-finalize-20260722
      - qikvrt/mesh-review-ledger-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Full compile, launcher, protocol, handler, security and TCP/IP tests
        id: full_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          diagnostics=.qikvrt/runtime/ci-diagnostics
          mkdir -p "$diagnostics"
          make test > "$diagnostics/MAKE_TEST_FULL.log" 2>&1
          status=$?
          {
            printf 'MAKE_TEST_EXIT=%s\n' "$status"
            printf '%s\n' '--- LAST 500 LINES ---'
            tail -n 500 "$diagnostics/MAKE_TEST_FULL.log"
            printf '%s\n' '--- WORKTREE STATUS ---'
            git status --short --untracked-files=all
            printf '%s\n' '--- INTEGRITY MANIFEST DELTA ---'
            python3 -B - <<'PY'
          import json
          from pathlib import Path
          from tools import qikvrt_integrity as integrity

          stored = json.loads(Path(integrity.MANIFEST_NAME).read_text(encoding='utf-8'))
          _manifest, _index, _detached, expected = integrity.build_outputs()
          old = {entry['path']: entry for entry in stored['files']}
          new = {entry['path']: entry for entry in expected['files']}
          print('added=' + json.dumps(sorted(new.keys() - old.keys())))
          print('removed=' + json.dumps(sorted(old.keys() - new.keys())))
          changed = sorted(
              path for path in old.keys() & new.keys()
              if old[path] != new[path]
          )
          print('changed=' + json.dumps(changed))
          for path in changed[:50]:
              before = old[path]
              after = new[path]
              print(json.dumps({'path': path, 'stored': before, 'expected': after}, sort_keys=True))
          PY
          } > "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" 2>&1
          mkdir -p audit/ci-diagnostics
          cp "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" \
            audit/ci-diagnostics/MAKE_TEST_DIAGNOSTICS.log
          cat "$diagnostics/MAKE_TEST_DIAGNOSTICS.log"
          exit "$status"
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-ci-audit
          retention-days: 30
          path: |
            audit/**
            .qikvrt/**
          if-no-files-found: warn
          include-hidden-files: true
      - name: Enforce full repository test result
        if: steps.full_test.outcome == 'failure'
        shell: bash
        run: |
          cat audit/ci-diagnostics/MAKE_TEST_DIAGNOSTICS.log
          exit 1

  quantum-causal-vhdl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVIDENCE_ROOT: /tmp/qikvrt-quantum-causal-neutron-star-ci
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect inside-out VHDL carrier
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          required=(
            state/fixpoints/QIKVRT_QUANTUM_CAUSAL_NEUTRON_STAR_EVIDENCE_FIXPOINT_SET_V1.json
            hardware/vhdl/qikvrt_metatransistor_pkg.vhd
            hardware/vhdl/qikvrt_metatransistor.vhd
            hardware/vhdl/qikvrt_neutron_star_mesh.vhd
            hardware/vhdl/tb_qikvrt_metatransistor.vhd
            tools/qikvrt_quantum_causal_neutron_star_fixpoint.py
            tests/test_qikvrt_quantum_causal_neutron_star_fixpoint.py
          )
          present=true
          for path in "${required[@]}"; do
            if [ ! -f "$path" ]; then
              present=false
            fi
          done
          echo "present=$present" >> "$GITHUB_OUTPUT"
          printf 'INSIDE_OUT_VHDL_PRESENT=%s\n' "$present"
      - name: Provision and bind GHDL
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          if ! command -v ghdl >/dev/null 2>&1; then
            sudo apt-get update
            candidate="$(apt-cache policy ghdl | awk '/Candidate:/ {print $2}')"
            test -n "$candidate"
            test "$candidate" != '(none)'
            printf 'APT_CANDIDATE=%s\n' "$candidate" \
              | tee "$EVIDENCE_ROOT/ghdl-package.txt"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends "ghdl=$candidate"
          fi
          command -v ghdl | tee -a "$EVIDENCE_ROOT/ghdl-package.txt"
          ghdl --version | tee "$EVIDENCE_ROOT/ghdl-version.txt"
      - name: Validate analyze elaborate and execute inside-out VHDL
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          python3 -B tools/qikvrt_quantum_causal_neutron_star_fixpoint.py validate \
            | tee "$EVIDENCE_ROOT/validation.json"
          python3 -B -m unittest -v \
            tests.test_qikvrt_quantum_causal_neutron_star_fixpoint
          work="$RUNNER_TEMP/qikvrt-ghdl-ci-work"
          mkdir -p "$work"
          pushd "$work" >/dev/null
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/qikvrt_metatransistor_pkg.vhd"
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/qikvrt_metatransistor.vhd"
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/qikvrt_neutron_star_mesh.vhd"
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/tb_qikvrt_metatransistor.vhd"
          ghdl -e --std=08 tb_qikvrt_metatransistor
          ghdl -r --std=08 tb_qikvrt_metatransistor
          popd >/dev/null
          cat > "$EVIDENCE_ROOT/vhdl-toolchain.json" <<'JSON'
          {
            "analysis": "OBSERVED_SUCCESS",
            "elaboration": "OBSERVED_SUCCESS",
            "schema": "qikvrt.vhdl-toolchain-observation.v1",
            "synthesis": "NOT_CLAIMED",
            "testbench": "OBSERVED_SUCCESS"
          }
          JSON
      - name: Reobserve immutable exact candidate
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse --verify HEAD^{commit})" = "$expected"
          git status --porcelain=v1 --untracked-files=all \
            | tee "$EVIDENCE_ROOT/worktree-status.txt"
          test ! -s "$EVIDENCE_ROOT/worktree-status.txt"
      - name: Preserve inside-out VHDL evidence
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-quantum-causal-neutron-star-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}
          retention-days: 30
          if-no-files-found: error

  journey-reading-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # runner context does not exist at job-level env evaluation time.
      PREVIEW_ROOT: /tmp/qikvrt-journey-preview
    steps:
      - name: Check out literal journey candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect complete journey source surface
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if test -f docs/reise/REQUEST.json; then
            test -f docs/reise/source.de.txt
            test -f tools/qikvrt_journey_site.py
            test -f tests/test_qikvrt_journey_site.py
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up declared Python runtime
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify tool cache contract
        if: steps.detect.outputs.present == 'true'
        run: python3 -B tools/qikvrt_tool_cache.py verify
      - name: Test source binding and render available complete editions
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          mkdir -p "$PREVIEW_ROOT"
          python3 -B -m unittest discover -s tests -p test_qikvrt_journey_site.py -v \
            2>&1 | tee "$PREVIEW_ROOT/tests.log"
          python3 -B tools/qikvrt_journey_site.py preview \
            --output "$PREVIEW_ROOT/index.html" \
            | tee "$PREVIEW_ROOT/validation.json"
          cp -R docs/reise "$PREVIEW_ROOT/source"
      - name: Export canonical integrity proposal without mutating the checkout
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from tools import qikvrt_integrity as integrity
          root = pathlib.Path(os.environ['PREVIEW_ROOT'])
          root.mkdir(parents=True, exist_ok=True)
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          if head != os.environ['EXPECTED_HEAD']:
              raise SystemExit('HOLD_UNVERIFIED: source head drift')
          manifest, index, detached, _ = integrity.build_outputs()
          hashes = {}
          for name, data in ((integrity.MANIFEST_NAME,manifest),
                             (integrity.INDEX_NAME,index),
                             (integrity.DETACHED_NAME,detached)):
              (root/name).write_bytes(data)
              hashes[name] = {'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (root/'INTEGRITY_PROPOSAL.json').write_text(json.dumps({
              'schema':'qikvrt_journey_integrity_proposal_v1',
              'repository':os.environ['GITHUB_REPOSITORY'],
              'source_head':head,'source_tree':tree,'files':hashes,
              'mutation':'NONE','native_review':False,'public_delivery':False,
              'EFFECT_ACK_DONE':False},indent=2)+'\n',encoding='utf-8')
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Check all 47 editions without hiding missing translations
        id: coverage
        if: steps.detect.outputs.present == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_journey_site.py coverage-check \
            | tee "$PREVIEW_ROOT/coverage.json"
      - name: Preserve exact-source reading preview and diagnostics
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-journey-preview-${{ env.EXPECTED_HEAD }}
          path: ${{ env.PREVIEW_ROOT }}
          retention-days: 30
          if-no-files-found: error
      - name: Enforce complete 47-edition coverage
        if: steps.detect.outputs.present == 'true' && steps.coverage.outcome != 'success'
        run: |
          echo 'HOLD_UNVERIFIED: complete 47-edition coverage is not established.' >&2
          exit 2
