name: QIKVRT CI

on:
  push:
    branches-ignore:
      - automation/effect-ack-universality-reserve-20260722
      - automation/effect-ack-universality-finalize-20260722
      - qikvrt/mesh-review-ledger-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Full compile, launcher, protocol, handler, security and TCP/IP tests
        id: full_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          diagnostics=.qikvrt/runtime/ci-diagnostics
          mkdir -p "$diagnostics"
          make test > "$diagnostics/MAKE_TEST_FULL.log" 2>&1
          status=$?
          {
            printf 'MAKE_TEST_EXIT=%s\n' "$status"
            printf '%s\n' '--- LAST 500 LINES ---'
            tail -n 500 "$diagnostics/MAKE_TEST_FULL.log"
            printf '%s\n' '--- WORKTREE STATUS ---'
            git status --short --untracked-files=all
            printf '%s\n' '--- INTEGRITY MANIFEST DELTA ---'
            python3 -B - <<'PY'
          import json
          from pathlib import Path
          from tools import qikvrt_integrity as integrity

          stored = json.loads(Path(integrity.MANIFEST_NAME).read_text(encoding='utf-8'))
          _manifest, _index, _detached, expected = integrity.build_outputs()
          old = {entry['path']: entry for entry in stored['files']}
          new = {entry['path']: entry for entry in expected['files']}
          print('added=' + json.dumps(sorted(new.keys() - old.keys())))
          print('removed=' + json.dumps(sorted(old.keys() - new.keys())))
          changed = sorted(
              path for path in old.keys() & new.keys()
              if old[path] != new[path]
          )
          print('changed=' + json.dumps(changed))
          for path in changed[:50]:
              before = old[path]
              after = new[path]
              print(json.dumps({'path': path, 'stored': before, 'expected': after}, sort_keys=True))
          PY
          } > "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" 2>&1
          mkdir -p audit/ci-diagnostics
          cp "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" \
            audit/ci-diagnostics/MAKE_TEST_DIAGNOSTICS.log
          cat "$diagnostics/MAKE_TEST_DIAGNOSTICS.log"
          exit "$status"
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-ci-audit
          retention-days: 30
          path: |
            audit/**
            .qikvrt/**
          if-no-files-found: warn
          include-hidden-files: true
      - name: Enforce full repository test result
        if: steps.full_test.outcome == 'failure'
        shell: bash
        run: |
          cat audit/ci-diagnostics/MAKE_TEST_DIAGNOSTICS.log
          exit 1

  quantum-causal-vhdl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVIDENCE_ROOT: /tmp/qikvrt-quantum-causal-neutron-star-ci
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect inside-out VHDL carrier
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          required=(
            state/fixpoints/QIKVRT_QUANTUM_CAUSAL_NEUTRON_STAR_EVIDENCE_FIXPOINT_SET_V1.json
            hardware/vhdl/qikvrt_metatransistor_pkg.vhd
            hardware/vhdl/qikvrt_metatransistor.vhd
            hardware/vhdl/qikvrt_neutron_star_mesh.vhd
            hardware/vhdl/tb_qikvrt_metatransistor.vhd
            tools/qikvrt_quantum_causal_neutron_star_fixpoint.py
            tests/test_qikvrt_quantum_causal_neutron_star_fixpoint.py
          )
          present=true
          for path in "${required[@]}"; do
            if [ ! -f "$path" ]; then
              present=false
            fi
          done
          echo "present=$present" >> "$GITHUB_OUTPUT"
          printf 'INSIDE_OUT_VHDL_PRESENT=%s\n' "$present"
      - name: Provision and bind GHDL
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          if ! command -v ghdl >/dev/null 2>&1; then
            sudo apt-get update
            candidate="$(apt-cache policy ghdl | awk '/Candidate:/ {print $2}')"
            test -n "$candidate"
            test "$candidate" != '(none)'
            printf 'APT_CANDIDATE=%s\n' "$candidate" \
              | tee "$EVIDENCE_ROOT/ghdl-package.txt"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends "ghdl=$candidate"
          fi
          command -v ghdl | tee -a "$EVIDENCE_ROOT/ghdl-package.txt"
          ghdl --version | tee "$EVIDENCE_ROOT/ghdl-version.txt"
      - name: Validate analyze elaborate and execute inside-out VHDL
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          python3 -B tools/qikvrt_quantum_causal_neutron_star_fixpoint.py validate \
            | tee "$EVIDENCE_ROOT/validation.json"
          python3 -B -m unittest -v \
            tests.test_qikvrt_quantum_causal_neutron_star_fixpoint
          work="$RUNNER_TEMP/qikvrt-ghdl-ci-work"
          mkdir -p "$work"
          pushd "$work" >/dev/null
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/qikvrt_metatransistor_pkg.vhd"
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/qikvrt_metatransistor.vhd"
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/qikvrt_neutron_star_mesh.vhd"
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/tb_qikvrt_metatransistor.vhd"
          ghdl -e --std=08 tb_qikvrt_metatransistor
          ghdl -r --std=08 tb_qikvrt_metatransistor
          popd >/dev/null
          cat > "$EVIDENCE_ROOT/vhdl-toolchain.json" <<'JSON'
          {
            "analysis": "OBSERVED_SUCCESS",
            "elaboration": "OBSERVED_SUCCESS",
            "schema": "qikvrt.vhdl-toolchain-observation.v1",
            "synthesis": "NOT_CLAIMED",
            "testbench": "OBSERVED_SUCCESS"
          }
          JSON
      - name: Reobserve immutable exact candidate
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse --verify HEAD^{commit})" = "$expected"
          git status --porcelain=v1 --untracked-files=all \
            | tee "$EVIDENCE_ROOT/worktree-status.txt"
          test ! -s "$EVIDENCE_ROOT/worktree-status.txt"
      - name: Preserve inside-out VHDL evidence
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-quantum-causal-neutron-star-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.EVIDENCE_ROOT }}
          retention-days: 30
          if-no-files-found: error


  publish-ontological-priority-now:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/policy/universal-proof-thought-schema-v1' &&
      github.actor == 'ingolf-lohmann' &&
      github.event.head_commit.message == 'zenodo: route publication through admitted CI lane'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE: release/ontological-priority-of-difference-zenodo-v1
      MANIFEST: release/ontological-priority-of-difference-zenodo-v1/publish-request.json
      EVIDENCE: release/ontological-priority-of-difference-zenodo-v1/zenodo-publication.json
      SOURCE_HEAD: 8225b8238b592d61b4d7c7e45e4cf804c1354843
      KERNEL_ARTIFACT_ID: "10854405579"
      PREPUBLICATION_ARTIFACT_ID: "10853874569"
      ZENODO_API_BASE: https://zenodo.org/api
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out exact publication precursor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bind proof source and download successful receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          mkdir -p "$RUNNER_TEMP/ontology-proof" "$RUNNER_TEMP/prepublication"
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$KERNEL_ARTIFACT_ID/zip"             -o "$RUNNER_TEMP/ontology-proof.zip"
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREPUBLICATION_ARTIFACT_ID/zip"             -o "$RUNNER_TEMP/prepublication.zip"
          unzip -q "$RUNNER_TEMP/ontology-proof.zip" -d "$RUNNER_TEMP/ontology-proof"
          unzip -q "$RUNNER_TEMP/prepublication.zip" -d "$RUNNER_TEMP/prepublication"
          test -f "$RUNNER_TEMP/ontology-proof/UNIVERSAL_ONTOLOGY_KERNEL_RECEIPT.json"
          test -f "$RUNNER_TEMP/prepublication/$RELEASE/PREPUBLICATION_GATE_RECEIPT.json"

      - name: Materialize and validate exact v2 publication controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RELEASE/finalize_authorized_controls.py"             --kernel-artifact "$RUNNER_TEMP/ontology-proof/UNIVERSAL_ONTOLOGY_KERNEL_RECEIPT.json"             --prepublication-artifact "$RUNNER_TEMP/prepublication/$RELEASE/PREPUBLICATION_GATE_RECEIPT.json"             | tee "$RUNNER_TEMP/final-controls.json"
          python3 -B tests/test_zenodo_machine_proof_policy.py
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Persist exact execution subject
        id: execution
        shell: bash
        run: |
          set -euo pipefail
          precursor="$(git rev-parse HEAD)"
          remote="$(
            git ls-remote --heads origin refs/heads/policy/universal-proof-thought-schema-v1 |
              awk 'NR == 1 {print $1}'
          )"
          test "$remote" = "$precursor"

          git config user.name 'qik-vrt-zenodo-publication[bot]'
          git config user.email 'qik-vrt-zenodo-publication[bot]@users.noreply.github.com'
          git add --             "$RELEASE/UNIVERSAL_ONTOLOGY_KERNEL_RECEIPT.json"             "$RELEASE/PREPUBLICATION_GATE_RECEIPT.json"             "$RELEASE/KERNEL_RECEIPT.json"             "$RELEASE/SOURCE_EVIDENCE_BINDINGS_V2.json"             "$RELEASE/CLAIM_MATRIX_V2.json"             "$RELEASE/PREPUBLICATION_RETURN_RECEIPT_V2.json"             "$RELEASE/MACHINE_PROOF_BUNDLE.json"             "$RELEASE/OWNER_ZENODO_AUTHORIZATION.json"             "$RELEASE/publish-request.json"             "$RELEASE/FINAL_UPLOAD_AUTHORIZATION.json"             REPOSITORY_FILE_MANIFEST.json             REPOSITORY_FILE_MANIFEST.json.sha256             SHA256SUMS.txt
          git diff --cached --check
          git commit -m 'zenodo: materialize ontological-priority execution subject'
          execution_head="$(git rev-parse HEAD)"

          remote="$(
            git ls-remote --heads origin refs/heads/policy/universal-proof-thought-schema-v1 |
              awk 'NR == 1 {print $1}'
          )"
          test "$remote" = "$precursor"
          git push origin HEAD:refs/heads/policy/universal-proof-thought-schema-v1
          echo "head=$execution_head" >> "$GITHUB_OUTPUT"

      - name: Publish exact authorized files and verify public byte readback
        id: zenodo
        timeout-minutes: 20
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          execution_head="${{ steps.execution.outputs.head }}"
          test "$(git rev-parse HEAD)" = "$execution_head"
          remote="$(
            git ls-remote --heads origin refs/heads/policy/universal-proof-thought-schema-v1 |
              awk 'NR == 1 {print $1}'
          )"
          test "$remote" = "$execution_head"
          GITHUB_SHA="$execution_head" GITHUB_REPOSITORY="$GITHUB_REPOSITORY"             python3 -B tools/qikvrt_zenodo_publish.py --manifest "$MANIFEST"
          test -f "$EVIDENCE"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ["EVIDENCE"]).read_text(encoding="utf-8"))
          if value.get("state") != "published":
              raise SystemExit("BLOCK: Zenodo evidence is not published")
          print("ZENODO_STATE=published")
          print("ZENODO_DOI=" + str(value.get("doi")))
          print("ZENODO_RECORD_ID=" + str(value.get("record_id")))
          PY

      - name: Persist public publication receipt
        shell: bash
        run: |
          set -euo pipefail
          execution_head="${{ steps.execution.outputs.head }}"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git add --             "$EVIDENCE"             REPOSITORY_FILE_MANIFEST.json             REPOSITORY_FILE_MANIFEST.json.sha256             SHA256SUMS.txt
          git diff --cached --check
          git commit -m 'zenodo: persist ontological-priority public readback'
          remote="$(
            git ls-remote --heads origin refs/heads/policy/universal-proof-thought-schema-v1 |
              awk 'NR == 1 {print $1}'
          )"
          test "$remote" = "$execution_head"
          git push origin HEAD:refs/heads/policy/universal-proof-thought-schema-v1

      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ontological-priority-zenodo-publication-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: ignore
          path: |
            ${{ env.EVIDENCE }}
            ${{ runner.temp }}/final-controls.json
