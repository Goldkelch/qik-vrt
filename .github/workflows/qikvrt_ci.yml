name: QIKVRT CI

on:
  push:
    branches-ignore:
      - automation/effect-ack-universality-reserve-20260722
      - automation/effect-ack-universality-finalize-20260722
      - qikvrt/mesh-review-ledger-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify requested-review dispatch input contract
        shell: bash
        env:
          QIKVRT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          audit_dir="audit/requested-review-dispatch"
          mkdir -p "$audit_dir"
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v \
              tests.test_qikvrt_requested_review_dispatch_type \
              2>&1 | tee "$audit_dir/TEST.log"
          python3 -B - <<'PY' > "$audit_dir/receipt.json"
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          workflow = Path('.github/workflows/qikvrt_autonomous_pr_head_continuation.yml')
          contract = Path('tests/test_qikvrt_requested_review_dispatch_type.py')
          value = {
              'schema': 'QIKVRT_REQUESTED_REVIEW_DISPATCH_TYPE_TEST_V1',
              'expected_head': os.environ['QIKVRT_EXPECTED_HEAD'],
              'checkout_head': subprocess.check_output(
                  ['git', 'rev-parse', '--verify', 'HEAD^{commit}'], text=True
              ).strip(),
              'workflow_sha256': hashlib.sha256(workflow.read_bytes()).hexdigest(),
              'contract_sha256': hashlib.sha256(contract.read_bytes()).hexdigest(),
              'target_input_type': 'string',
              'dispatch_form_field_flag': '-f',
              'typed_field_flag_forbidden_for_pr': True,
              'review_authority_separate': True,
              'productive_effect': False,
              'external_effect': 'NONE',
              'pass': False,
              'final_pass': False,
              'effect_ack_done': False,
          }
          print(json.dumps(value, sort_keys=True, indent=2))
          PY
          cat "$audit_dir/receipt.json"
      - name: Full compile, launcher, protocol, handler, security and TCP/IP tests
        id: full_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          diagnostics=.qikvrt/runtime/ci-diagnostics
          mkdir -p "$diagnostics"
          make test > "$diagnostics/MAKE_TEST_FULL.log" 2>&1
          status=$?
          {
            printf 'MAKE_TEST_EXIT=%s\n' "$status"
            printf '%s\n' '--- LAST 500 LINES ---'
            tail -n 500 "$diagnostics/MAKE_TEST_FULL.log"
            printf '%s\n' '--- WORKTREE STATUS ---'
            git status --short --untracked-files=all
            printf '%s\n' '--- INTEGRITY MANIFEST DELTA ---'
            python3 -B - <<'PY'
          import json
          from pathlib import Path
          from tools import qikvrt_integrity as integrity

          stored = json.loads(Path(integrity.MANIFEST_NAME).read_text(encoding='utf-8'))
          _manifest, _index, _detached, expected = integrity.build_outputs()
          old = {entry['path']: entry for entry in stored['files']}
          new = {entry['path']: entry for entry in expected['files']}
          print('added=' + json.dumps(sorted(new.keys() - old.keys())))
          print('removed=' + json.dumps(sorted(old.keys() - new.keys())))
          changed = sorted(
              path for path in old.keys() & new.keys()
              if old[path] != new[path]
          )
          print('changed=' + json.dumps(changed))
          for path in changed[:50]:
              before = old[path]
              after = new[path]
              print(json.dumps({'path': path, 'stored': before, 'expected': after}, sort_keys=True))
          PY
          } > "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" 2>&1
          mkdir -p audit/ci-diagnostics
          cp "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" \
            audit/ci-diagnostics/MAKE_TEST_DIAGNOSTICS.log
          cat "$diagnostics/MAKE_TEST_DIAGNOSTICS.log"
          exit "$status"
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-ci-audit
          retention-days: 30
          path: |
            audit/**
            .qikvrt/**
          if-no-files-found: warn
          include-hidden-files: true
      - name: Enforce full repository test result
        if: steps.full_test.outcome == 'failure'
        shell: bash
        run: |
          cat audit/ci-diagnostics/MAKE_TEST_DIAGNOSTICS.log
          exit 1
