# Temporary finite writer for the fixed Cloud Transputer Mesh launcher.
# It verifies the exact binding anchors, regenerates deterministic repository
# integrity, removes itself, and CAS-pushes one successor only.
name: QIKVRT cloud transputer fixed Mesh integrity bootstrap

on:
  push:
    branches: [publish/cloud-transputer-fixed-mesh-v1]

permissions:
  contents: write

concurrency:
  group: qikvrt-cloud-transputer-fixed-mesh-integrity-bootstrap
  cancel-in-progress: false

jobs:
  materialize-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact fixed Mesh binding anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import json
          from pathlib import Path

          binding = json.loads(Path('docs/cloud-transputer/binding.json').read_text(encoding='utf-8'))
          assert binding['schema'] == 'qikvrt_cloud_transputer_public_binding_v1'
          assert binding['fixed_mesh_url'] == 'https://goldkelch.github.io/qik-vrt/cloud-transputer/'
          assert binding['runtime_origin'] == 'https://universal-terminal-production.up.railway.app'
          subject = binding['runtime_subject']
          assert subject['head_sha'] == '7f639df8ba8cca3fd8d84b63c95575faaa15c1e6'
          assert subject['tree_sha'] == 'e80cc4b1c86b9fa63e926047b28da9b4645f3f14'
          assert subject['exact_head_runtime_run_id'] == 34136635113
          edge = binding['independent_public_reobservation']
          assert edge['run_id'] == 34144951748
          assert edge['health_status'] == 200
          assert edge['runtime_receipt_status'] == 200
          assert edge['terminal_unauthenticated_status'] == 401
          assert edge['conclusion'] == 'SUCCESS'
          boundaries = binding['boundaries']
          assert boundaries['personal_posix_complete'] is False
          assert boundaries['standalone_m68000_tcp_ip_stack_complete'] is False
          assert boundaries['general_effect_ack_done'] is False

          page = Path('docs/cloud-transputer/index.html').read_text(encoding='utf-8')
          for token in (
              'https://goldkelch.github.io/qik-vrt/cloud-transputer/',
              'https://universal-terminal-production.up.railway.app',
              '7f639df8ba8cca3fd8d84b63c95575faaa15c1e6',
              'e80cc4b1c86b9fa63e926047b28da9b4645f3f14',
              '34144951748',
              'binding.json',
          ):
              assert token in page, token
          PY

      - name: Remove bootstrap and regenerate integrity trio
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/qikvrt_cloud_transputer_fixed_mesh_integrity_bootstrap.yml
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          git add REPOSITORY_FILE_MANIFEST.json \
                  REPOSITORY_FILE_MANIFEST.json.sha256 \
                  SHA256SUMS.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote --heads origin refs/heads/publish/cloud-transputer-fixed-mesh-v1 | awk 'NR==1 {print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git commit -m "chore: materialize fixed Mesh launcher integrity"
          git push origin HEAD:refs/heads/publish/cloud-transputer-fixed-mesh-v1
