# One-shot exact-subject integrity repair and cleanup writer.
name: QIKVRT PR integrity repair writer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: qikvrt-pr-integrity-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - name: Materialize clean exact-subject successor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "refs/heads/$TARGET_REF:refs/remotes/origin/$TARGET_REF"
          remote_head="$(git rev-parse --verify "refs/remotes/origin/$TARGET_REF^{commit}")"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "BLOCK exact subject moved before cleanup: expected=$EXPECTED_HEAD observed=$remote_head" >&2
            exit 1
          fi
          git rm -- .github/workflows/qikvrt_pr_integrity_snapshot.yml .github/workflows/qikvrt_pr_integrity_repair_writer.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git add -- REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git config user.name "qik-vrt-integrity-writer"
          git config user.email "qik-vrt-integrity-writer@users.noreply.github.com"
          git commit -m "chore(integrity): finalize clean monitor subject"
          git push origin "HEAD:refs/heads/$TARGET_REF"
