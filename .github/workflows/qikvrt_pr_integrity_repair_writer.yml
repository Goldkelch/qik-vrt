# Exact-subject, idempotent PR integrity repair writer.
name: QIKVRT PR integrity repair writer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: qikvrt-pr-integrity-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - name: Regenerate and verify deterministic repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
      - name: Persist exact integrity successor when required
        shell: bash
        run: |
          set -euo pipefail
          paths=(REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt)
          if git diff --quiet -- "${paths[@]}"; then
            echo "Integrity outputs already canonical for exact subject $EXPECTED_HEAD."
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/$TARGET_REF:refs/remotes/origin/$TARGET_REF"
          remote_head="$(git rev-parse --verify "refs/remotes/origin/$TARGET_REF^{commit}")"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "BLOCK exact subject moved before persistence: expected=$EXPECTED_HEAD observed=$remote_head" >&2
            exit 1
          fi
          git config user.name "qik-vrt-integrity-writer"
          git config user.email "qik-vrt-integrity-writer@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "chore(integrity): regenerate exact PR manifest"
          git push origin "HEAD:refs/heads/$TARGET_REF"
