name: QIK-VRT query Zenodo corpus v4 run once

on:
  push:
    branches:
      - observe/actions-query-zenodo-corpus-v4
    paths:
      - .github/workflows/qikvrt_query_zenodo_corpus_v4_run_once.yml

permissions:
  actions: read
  contents: write

jobs:
  query-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: observe/actions-query-zenodo-corpus-v4
      EFFECT_BRANCH: execution/zenodo-corpus-inventory-20260728-v4
      EFFECT_WORKFLOW: QIK-VRT hardened authenticated Zenodo corpus proof inventory v4 once
      WORKFLOW_PATH: .github/workflows/qikvrt_query_zenodo_corpus_v4_run_once.yml
      OUTPUT: evidence/monitor/zenodo-corpus-inventory-v4-run.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: observe/actions-query-zenodo-corpus-v4
          fetch-depth: 0
      - name: Query exact run and persist metadata
        shell: bash
        run: |
          set -euo pipefail
          encoded_branch=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['EFFECT_BRANCH'], safe=''))
          PY
          )
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs?branch=$encoded_branch&per_page=50" \
            > runs.json
          python3 -B - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path('runs.json').read_text(encoding='utf-8'))
          matches = [
              run for run in value.get('workflow_runs', [])
              if run.get('name') == os.environ['EFFECT_WORKFLOW']
          ]
          if not matches:
              raise SystemExit('BLOCK: exact effect workflow run is absent')
          run = matches[0]
          output = {
              'schema': 'qikvrt_actions_run_observation_v1',
              'effect_branch': os.environ['EFFECT_BRANCH'],
              'effect_workflow': os.environ['EFFECT_WORKFLOW'],
              'run_id': run.get('id'),
              'run_number': run.get('run_number'),
              'head_branch': run.get('head_branch'),
              'head_sha': run.get('head_sha'),
              'event': run.get('event'),
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'created_at': run.get('created_at'),
              'updated_at': run.get('updated_at'),
              'html_url': run.get('html_url'),
              'observer_remote_mutation': False,
          }
          path = pathlib.Path(os.environ['OUTPUT'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(output, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(output, sort_keys=True))
          PY
          rm -- "$WORKFLOW_PATH"
          [ "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$GITHUB_SHA" ]
          git config user.name 'qikvrt-actions-observer[bot]'
          git config user.email 'qikvrt-actions-observer[bot]@users.noreply.github.com'
          git add -A -- "$OUTPUT" "$WORKFLOW_PATH"
          git commit -m 'evidence: persist Zenodo corpus v4 run observation'
          git push origin "HEAD:$TARGET_BRANCH"
