name: QIKVRT synchronous repository-first terminal

on:
  pull_request:
    paths:
      - "AI_CONTEXT_SYNCHRONOUS_TERMINAL.json"
      - "policy/SYNCHRONOUS_REPOSITORY_FIRST_TERMINAL_V1.json"
      - "docs/SYNCHRONOUS_REPOSITORY_FIRST_TERMINAL.md"
      - "tests/test_synchronous_repository_first_terminal.py"
      - ".github/workflows/qikvrt_synchronous_repository_first_terminal.yml"
      - "state/work_units/SYNCHRONOUS_REPOSITORY_FIRST_TERMINAL_V1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          test "$actual" = "$EXPECTED_HEAD"
      - name: Verify synchronous repository-first terminal contract
        run: python3 -B -m unittest -v tests.test_synchronous_repository_first_terminal
      - name: Verify no root AI modification in this work unit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD 2>/dev/null | grep -qx 'AI'; then
            echo 'BLOCK: root /AI must remain unchanged' >&2
            exit 2
          fi
