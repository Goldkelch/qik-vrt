          set -euo pipefail
          mkdir -p "$(dirname "$TOOL_PATH")" "$(dirname "$TEST_PATH")"
          printf '%s' "$SCRIPT_B64" | tr -d '\n' | base64 --decode | gzip --decompress > "$TOOL_PATH"
          printf '%s' "$TEST_B64" | tr -d '\n' | base64 --decode | gzip --decompress > "$TEST_PATH"
          chmod 0755 "$TOOL_PATH"
          python3 -B - <<'PY'
          import pathlib
          for raw in ('tools/qikvrt_content_disposition_batch_001.py', 'tests/test_content_disposition_batch_001.py'):
              path = pathlib.Path(raw)
              compile(path.read_text(encoding='utf-8'), raw, 'exec')
          PY

      - name: Execute batch 001 and repository gates
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          terminal="$RUNNER_TEMP/qikvrt-content-disposition-batch-001"
          mkdir -p "$terminal"
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$TOOL_PATH" >"$terminal/EXECUTION.log" 2>&1
          execute_status=$?
          if [ "$execute_status" -eq 0 ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 -B "$TEST_PATH" >"$terminal/STATIC_VALIDATION.log" 2>&1
            static_status=$?
          else
            static_status=125
          fi
          if [ "$execute_status" -eq 0 ] && [ "$static_status" -eq 0 ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py generate >"$terminal/INTEGRITY_GENERATE.log" 2>&1
            integrity_generate_status=$?
          else
            integrity_generate_status=125
          fi
          if [ "$integrity_generate_status" -eq 0 ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py verify >"$terminal/INTEGRITY_VERIFY_PRE.log" 2>&1
            integrity_pre_status=$?
          else
            integrity_pre_status=125
          fi
          if [ "$integrity_pre_status" -eq 0 ]; then
            make test >"$terminal/MAKE_TEST.log" 2>&1
            test_status=$?
          else
            test_status=125
          fi
          if [ "$test_status" -eq 0 ]; then
            PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py verify >"$terminal/INTEGRITY_VERIFY_POST.log" 2>&1
            integrity_post_status=$?
          else
            integrity_post_status=125
          fi
          set -e
          export EXECUTE_STATUS="$execute_status" STATIC_STATUS="$static_status" \
            INTEGRITY_GENERATE_STATUS="$integrity_generate_status" INTEGRITY_PRE_STATUS="$integrity_pre_status" \
            TEST_STATUS="$test_status" INTEGRITY_POST_STATUS="$integrity_post_status"
          python3 -B - <<'PY'
          import json, os, pathlib
          terminal = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qikvrt-content-disposition-batch-001'
          diagnostic = {
              'schema': 'qikvrt_content_disposition_batch_001_execution_diagnostic_v1',
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'trigger_sha': os.environ['GITHUB_SHA'],
              'authority_main': os.environ['EXPECTED_AUTHORITY_MAIN'],
              'evidence_branch': os.environ['EVIDENCE_BRANCH'],
              'zenodo_methods': ['GET'],
              'zenodo_mutation_executed': False,
              'statuses': {
                  'execute': int(os.environ['EXECUTE_STATUS']),
                  'static_validation': int(os.environ['STATIC_STATUS']),
                  'integrity_generate': int(os.environ['INTEGRITY_GENERATE_STATUS']),
                  'integrity_verify_pre': int(os.environ['INTEGRITY_PRE_STATUS']),
                  'make_test': int(os.environ['TEST_STATUS']),
                  'integrity_verify_post': int(os.environ['INTEGRITY_POST_STATUS']),
              },
          }
          diagnostic['successful'] = all(value == 0 for value in diagnostic['statuses'].values())
          (terminal / 'EXECUTION_DIAGNOSTIC.json').write_text(
              json.dumps(diagnostic, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8', newline='\n')
          PY
          cat "$terminal/EXECUTION.log"
          [ "$execute_status" -eq 0 ]
          cat "$terminal/STATIC_VALIDATION.log"
          [ "$static_status" -eq 0 ]
          [ "$integrity_generate_status" -eq 0 ]
          [ "$integrity_pre_status" -eq 0 ]
          if [ "$test_status" -ne 0 ]; then tail -n 300 "$terminal/MAKE_TEST.log"; fi
          [ "$test_status" -eq 0 ]
          [ "$integrity_post_status" -eq 0 ]

      - name: Upload batch evidence on every terminal path
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-content-disposition-batch-001-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/qikvrt-content-disposition-batch-001/**
            ${{ env.OUTPUT_DIR }}/**
            ${{ env.WORK_UNIT_PATH }}
            ${{ env.TOOL_PATH }}
            ${{ env.TEST_PATH }}

      - name: Persist validated evidence on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, pathlib
          receipt = json.loads(pathlib.Path(os.environ['OUTPUT_DIR'], 'CONTENT_DISPOSITION_BATCH_001_RECEIPT.json').read_text(encoding='utf-8'))
          assert receipt['schema'] == 'qikvrt_content_disposition_batch_receipt_v1'
          assert receipt['batch_id'] == 'CONTENT-DISPOSITION-BATCH-001'
          assert receipt['state'] == 'BATCH_001_DISPOSITIONED_NO_CONTENT_CHANGE'
          assert receipt['subject_count'] == 6
          assert receipt['validation']['all_public_files_byte_reverified'] is True
          assert receipt['validation']['all_claims_terminally_classified'] is True
          assert receipt['validation']['formal_claims_have_machine_proof_bindings'] is True
          assert receipt['validation']['corrected_candidate_count'] == 0
          assert receipt['completion_claims']['all_content_claims_dispositioned'] is False
          assert receipt['completion_claims']['proof_corpus_published_on_zenodo'] is False
          assert receipt['completion_claims']['pass'] is False
          assert receipt['completion_claims']['final_pass'] is False
          assert receipt['completion_claims']['effect_ack_done'] is False
          PY
          mapfile -t changed < <({ git diff --name-only "$EXPECTED_AUTHORITY_MAIN" --; git ls-files --others --exclude-standard --; } | LC_ALL=C sort -u)
          [ "${#changed[@]}" -ge 15 ]
          for path in "${changed[@]}"; do
            case "$path" in
              REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt|\
              "$TOOL_PATH"|"$TEST_PATH"|"$WORK_UNIT_PATH"|\
              release/zenodo-corpus-proof-2026-07-28/canonical-union/CANONICAL_UNION_AND_DISPOSITION_RECEIPT.json|\
              release/zenodo-corpus-proof-2026-07-28/canonical-union/CONTENT_CLAIM_DISPOSITION_INDEX.json|\
              release/zenodo-corpus-proof-2026-07-28/canonical-union/CONTENT_CLAIM_DISPOSITION_QUEUE.json|\
              "$OUTPUT_DIR"/*) ;;
              *) echo "BLOCK: unexpected batch-001 persistence path: $path" >&2; exit 1 ;;
            esac
          done
          [ "$(git ls-remote origin refs/heads/$EVIDENCE_BRANCH | cut -f1)" = "$EXPECTED_AUTHORITY_MAIN" ]
          git config user.name 'qikvrt-content-disposition[bot]'
          git config user.email 'qikvrt-content-disposition[bot]@users.noreply.github.com'
          git add -A -- \
            "$TOOL_PATH" "$TEST_PATH" "$WORK_UNIT_PATH" "$OUTPUT_DIR" \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/CANONICAL_UNION_AND_DISPOSITION_RECEIPT.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/CONTENT_CLAIM_DISPOSITION_INDEX.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/CONTENT_CLAIM_DISPOSITION_QUEUE.json \
            REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git commit -m 'evidence: execute content disposition batch 001'
          evidence_head="$(git rev-parse HEAD)"
          git push origin \
            --force-with-lease="refs/heads/$EVIDENCE_BRANCH:$EXPECTED_AUTHORITY_MAIN" \
            "HEAD:refs/heads/$EVIDENCE_BRANCH"
          [ "$(git ls-remote origin refs/heads/$EVIDENCE_BRANCH | cut -f1)" = "$evidence_head" ]
          echo "EVIDENCE_HEAD=$evidence_head" >> "$GITHUB_ENV"

      - name: Enforce truth boundary
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${EVIDENCE_HEAD:-}" ]
          [ "$(git ls-remote origin refs/heads/$EVIDENCE_BRANCH | cut -f1)" = "$EVIDENCE_HEAD" ]
          python3 -B - <<'PY'
          import json, os, pathlib
          receipt = json.loads(pathlib.Path(os.environ['OUTPUT_DIR'], 'CONTENT_DISPOSITION_BATCH_001_RECEIPT.json').read_text(encoding='utf-8'))
          assert receipt['next_deterministic_effect'] == 'EXECUTE_CONTENT_DISPOSITION_BATCH_002'
          assert receipt['completion_claims']['pass'] is False
          assert receipt['completion_claims']['final_pass'] is False
          assert receipt['completion_claims']['effect_ack_done'] is False
          PY
