name: QIK-VRT content disposition batch 001 once

on:
  push:
    branches:
      - trusted/execute-content-disposition-batch-001-20260728-v1
    paths:
      - .github/workflows/qikvrt_content_disposition_batch_001_once.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-content-disposition-batch-001-20260728-v1
  cancel-in-progress: false

jobs:
  execute-and-persist:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_AUTHORITY_MAIN: 4892e74458f15762c7b873344bc85b238e3739b1
      TRIGGER_BRANCH: trusted/execute-content-disposition-batch-001-20260728-v1
      EVIDENCE_BRANCH: evidence/content-disposition-batch-001-20260728-v1
      WORKFLOW_PATH: .github/workflows/qikvrt_content_disposition_batch_001_once.yml
      TOOL_PATH: tools/qikvrt_content_disposition_batch_001.py
      TEST_PATH: tests/test_content_disposition_batch_001.py
      OUTPUT_DIR: release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-001
      WORK_UNIT_PATH: work-units/EXECUTE_CONTENT_DISPOSITION_BATCH_001.json

    steps:
      - name: Check out frozen evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: evidence/content-disposition-batch-001-20260728-v1
          fetch-depth: 0

      - name: Verify trigger, Authority and evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = 'Goldkelch/qik-vrt' ]
          [ "$GITHUB_REF_NAME" = "$TRIGGER_BRANCH" ]
          [ "$(git ls-remote origin refs/heads/$TRIGGER_BRANCH | cut -f1)" = "$GITHUB_SHA" ]
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_AUTHORITY_MAIN" ]
          [ "$(git rev-parse HEAD)" = "$EXPECTED_AUTHORITY_MAIN" ]
          [ "$(git ls-remote origin refs/heads/$EVIDENCE_BRANCH | cut -f1)" = "$EXPECTED_AUTHORITY_MAIN" ]
          git fetch --no-tags origin "$GITHUB_SHA"
          [ "$(git show -s --format=%P "$GITHUB_SHA")" = "$EXPECTED_AUTHORITY_MAIN" ]
          mapfile -t changed < <(git diff --name-only "$EXPECTED_AUTHORITY_MAIN" "$GITHUB_SHA" -- | LC_ALL=C sort)
          [ "${#changed[@]}" -eq 1 ]
          [ "${changed[0]}" = "$WORKFLOW_PATH" ]
          [ ! -e "$OUTPUT_DIR/CONTENT_DISPOSITION_BATCH_001_RECEIPT.json" ]
          [ ! -e "$TOOL_PATH" ]
          [ ! -e "$TEST_PATH" ]

