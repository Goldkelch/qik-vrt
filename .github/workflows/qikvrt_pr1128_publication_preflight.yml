name: QIKVRT PR1128 exact publication source export
on:
  push:
    branches: ['observe/pr1128-publication-preflight-f2d249-v1']
permissions:
  contents: read
concurrency:
  group: qikvrt-pr1128-publication-preflight-f2d249-v1
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact unchanged publication subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f2d249f0f070ec427621832a31d7a8a490184638
          fetch-depth: 1
          persist-credentials: false
      - name: Bind source and export committed bytes only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f2d249f0f070ec427621832a31d7a8a490184638
          test "$(git rev-parse HEAD^{tree})" = 12aa0b905cb25b58c6d40f8b28b046f2093d859d
          mkdir -p "$RUNNER_TEMP/pr1128-exact-source"
          git archive HEAD | gzip -n > "$RUNNER_TEMP/pr1128-exact-source/source.tar.gz"
          git cat-file commit HEAD > "$RUNNER_TEMP/pr1128-exact-source/COMMIT_OBJECT.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/pr1128-exact-source/GIT_TREE.txt"
          cd "$RUNNER_TEMP/pr1128-exact-source"
          sha256sum source.tar.gz COMMIT_OBJECT.txt GIT_TREE.txt > SOURCE_SHA256SUMS.txt
      - name: Preserve exact source export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1128-exact-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr1128-exact-source/
          if-no-files-found: error
          retention-days: 7
