name: QIKVRT owner-decision closure

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows:
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIKVRT requested review executor"
      - "QIKVRT required code-owner review"
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional open main-based pull request number"
        required: false
        type: string

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-owner-decision-closure-${{ github.repository }}
  cancel-in-progress: false

jobs:
  continue-one:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUESTED_PR: ${{ inputs.pr || '' }}
      PRODUCT_OWNER: ingolf-lohmann
      REQUIRED_CODE_OWNER: Goldkelch
      MARKER: qikvrt-owner-decision-closure:v1
      STATUS_CONTEXT: QIKVRT owner-decision closure
    steps:
      - name: Check out trusted-main coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Select and observe one exact owner-bound candidate
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/owner-decision-closure
          mkdir -p "$root"
          python3 -B - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          root=Path('.qikvrt/owner-decision-closure')
          repo=os.environ['REPOSITORY']
          owner=os.environ['PRODUCT_OWNER']
          marker=os.environ['MARKER']
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          event_name=os.environ['GITHUB_EVENT_NAME']

          def api(path, *, paginate=False):
              command=['gh','api']
              if paginate:
                  command += ['--paginate','--slurp']
              command.append(path)
              value=json.loads(subprocess.check_output(command,text=True))
              if paginate:
                  return [item for page in value for item in (page if isinstance(page,list) else [page])]
              return value

          requested=os.environ.get('REQUESTED_PR','').strip()
          number=int(requested) if requested else None
          source_comment=None
          if event_name == 'issue_comment':
              if not event.get('issue',{}).get('pull_request'):
                  number=None
              else:
                  number=int(event['issue']['number'])
                  comment=event.get('comment') or {}
                  if comment.get('body') == 'APPROVED' and (comment.get('user') or {}).get('login') == owner:
                      source_comment=comment
          elif event_name == 'pull_request_review':
              number=int(event['pull_request']['number'])
          elif event_name == 'workflow_run':
              numbers=sorted({int(item['number']) for item in event.get('workflow_run',{}).get('pull_requests',[]) if item.get('number')})
              number=numbers[0] if len(numbers) == 1 else None

          if number is None and event_name in {'schedule','workflow_dispatch'}:
              for pr in api(f'repos/{repo}/pulls?state=open&base=main&sort=updated&direction=asc&per_page=100',paginate=True):
                  comments=api(f'repos/{repo}/issues/{pr["number"]}/comments?per_page=100',paginate=True)
                  if any(f'<!-- {marker} ' in (item.get('body') or '') for item in comments):
                      number=int(pr['number']); break

          if number is None:
              (root/'selection.json').write_text(json.dumps({'state':'NOOP'},sort_keys=True)+'\n')
              raise SystemExit(0)

          pr=api(f'repos/{repo}/pulls/{number}')
          if pr.get('state') != 'open' or pr.get('base',{}).get('ref') != 'main' or pr.get('head',{}).get('repo',{}).get('full_name') != repo:
              (root/'selection.json').write_text(json.dumps({'state':'NOOP'},sort_keys=True)+'\n')
              raise SystemExit(0)
          head=pr['head']['sha']; base=pr['base']['sha']; head_ref=pr['head']['ref']
          commit=api(f'repos/{repo}/git/commits/{head}')
          tree=commit['tree']['sha']
          files=api(f'repos/{repo}/pulls/{number}/files?per_page=100',paginate=True)
          scope=sorted({item['filename'] for item in files})
          binding={'base_sha':base,'head_sha':head,'tree_sha':tree,'scope':scope}

          comments=api(f'repos/{repo}/issues/{number}/comments?per_page=100',paginate=True)
          receipt_pattern=re.compile(rf'<!-- {re.escape(marker)} (\{{.*\}}) -->')
          receipts=[]
          for item in comments:
              match=receipt_pattern.search(item.get('body') or '')
              if match:
                  try: receipts.append((item,json.loads(match.group(1))))
                  except json.JSONDecodeError: pass

          new_receipt=None
          if source_comment is not None and not any(value.get('source_id') == source_comment.get('id') for _,value in receipts):
              new_receipt={'state':'APPROVED','author_login':owner,'source_id':source_comment['id'],'submitted_at':source_comment.get('created_at'),'binding':binding}
              decision=new_receipt
          elif receipts:
              _,decision=max(receipts,key=lambda pair:int(pair[0].get('id') or -1))
          else:
              (root/'selection.json').write_text(json.dumps({'state':'NOOP'},sort_keys=True)+'\n')
              raise SystemExit(0)

          runs=api(f'repos/{repo}/actions/runs?head_sha={head}&per_page=100').get('workflow_runs',[])
          workflows=[{'id':run['id'],'name':run['name'],'head_sha':run.get('head_sha'),'status':run.get('status'),'conclusion':run.get('conclusion'),'run_number':run.get('run_number'),'run_attempt':run.get('run_attempt',1)} for run in runs]
          reviews=api(f'repos/{repo}/pulls/{number}/reviews?per_page=100',paginate=True)
          statuses=api(f'repos/{repo}/commits/{head}/status').get('statuses',[])
          requested_reviewers=[item['login'] for item in pr.get('requested_reviewers',[])]

          previous=decision['binding']
          descendant=False; changed=[]
          if previous['head_sha'] == head:
              descendant=True
          else:
              comparison=api(f'repos/{repo}/compare/{previous["head_sha"]}...{head}')
              descendant=comparison.get('status') in {'ahead','identical'}
              changed=sorted({item['filename'] for item in comparison.get('files',[])})

          snapshot={
              'product_owner_login':owner,'required_code_owner':os.environ['REQUIRED_CODE_OWNER'],
              'owner_decision':decision,'current_binding':binding,'pr_state':pr['state'],'draft':pr.get('draft') is True,
              'head_is_descendant':descendant,'paths_changed_since_decision':changed,
              'materialization_paths':['REPOSITORY_FILE_MANIFEST.json','REPOSITORY_FILE_MANIFEST.json.sha256','SHA256SUMS.txt'],
              'required_workflows':['QIKVRT CI','QIKVRT repository evidence materialization','QIKVRT Collective Proposal Review'],
              'workflows':workflows,'reviews':reviews,'statuses':statuses,'requested_reviewers':requested_reviewers,
          }
          (root/'selection.json').write_text(json.dumps({'state':'CANDIDATE','pr':number,'head_ref':head_ref,'head_sha':head,'new_receipt':new_receipt},sort_keys=True)+'\n')
          (root/'snapshot.json').write_text(json.dumps(snapshot,sort_keys=True,indent=2)+'\n')
          PY
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('.qikvrt/owner-decision-closure/selection.json'))
          print(f"state={value['state']}")
          print(f"pr={value.get('pr') or ''}")
          print(f"head_ref={value.get('head_ref') or ''}")
          print(f"head_sha={value.get('head_sha') or ''}")
          print(f"new_receipt={'true' if value.get('new_receipt') else 'false'}")
          PY

      - name: Classify exact continuation
        if: steps.observe.outputs.state == 'CANDIDATE'
        id: classify
        shell: bash
        run: |
          set +e
          python3 -B tools/qikvrt_owner_decision_closure.py classify \
            --input .qikvrt/owner-decision-closure/snapshot.json \
            --output .qikvrt/owner-decision-closure/receipt.json
          rc=$?
          set -e
          cat .qikvrt/owner-decision-closure/receipt.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('.qikvrt/owner-decision-closure/receipt.json'))
          print(f"classification={value['classification']}")
          print(f"phase={value['phase']}")
          print(f"request_reviewer={'true' if value.get('request_reviewer') else 'false'}")
          print('dispatch=' + json.dumps(value.get('dispatch_workflows',[]),separators=(',',':')))
          print(f"status_state={'failure' if value['classification'] == 'TRUE_BLOCKER' else 'pending'}")
          PY
          test "$rc" -eq 0 || test "$(jq -r .classification .qikvrt/owner-decision-closure/receipt.json)" = TRUE_BLOCKER

      - name: Persist initial exact owner binding
        if: steps.observe.outputs.state == 'CANDIDATE' && steps.observe.outputs.new_receipt == 'true'
        env:
          PR_NUMBER: ${{ steps.observe.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.observe.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          live="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$live" = "$EXPECTED_HEAD"
          payload="$(jq -c .new_receipt .qikvrt/owner-decision-closure/selection.json)"
          body="<!-- ${MARKER} ${payload} -->
          Owner decision bound to the exact base, head, root tree, and complete changed-path scope. This receipt is orchestration evidence only and is not an independent review."
          gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null

      - name: Request independent Code Owner once
        if: steps.classify.outputs.request_reviewer == 'true'
        env:
          PR_NUMBER: ${{ steps.observe.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.observe.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          live="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$live" = "$EXPECTED_HEAD"
          jq -n --arg reviewer "$REQUIRED_CODE_OWNER" '{reviewers:[$reviewer]}' \
            | gh api --method POST "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" --input - >/dev/null

      - name: Dispatch uniquely determined trusted workflows
        if: steps.classify.outputs.classification == 'AUTO_RESOLVABLE'
        env:
          PR_NUMBER: ${{ steps.observe.outputs.pr }}
          HEAD_REF: ${{ steps.observe.outputs.head_ref }}
          EXPECTED_HEAD: ${{ steps.observe.outputs.head_sha }}
          DISPATCH_JSON: ${{ steps.classify.outputs.dispatch }}
        shell: bash
        run: |
          set -euo pipefail
          live="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$live" = "$EXPECTED_HEAD"
          while IFS= read -r name; do
            case "$name" in
              'QIKVRT CI') gh workflow run qikvrt_ci.yml --ref "$HEAD_REF" ;;
              'QIKVRT repository evidence materialization') gh workflow run qikvrt_batch04_integrity.yml --ref "$HEAD_REF" ;;
              'QIKVRT Collective Proposal Review') gh workflow run qikvrt_collective_review.yml --ref "$HEAD_REF" ;;
              'QIKVRT requested review executor') gh workflow run qikvrt_requested_review_executor.yml --ref main -f pr="$PR_NUMBER" ;;
              'QIKVRT required code-owner review') gh workflow run qikvrt_required_review_gate.yml --ref main -f pr="$PR_NUMBER" ;;
              '') ;;
              *) echo "BLOCK undeclared workflow: $name" >&2; exit 2 ;;
            esac
          done < <(jq -r '.[]' <<<"$DISPATCH_JSON")

      - name: Publish exact-head nonterminal or blocker status
        if: steps.observe.outputs.state == 'CANDIDATE'
        env:
          PR_NUMBER: ${{ steps.observe.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.observe.outputs.head_sha }}
          STATUS_STATE: ${{ steps.classify.outputs.status_state }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          PHASE: ${{ steps.classify.outputs.phase }}
        shell: bash
        run: |
          set -euo pipefail
          live="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$live" = "$EXPECTED_HEAD"
          description="${CLASSIFICATION}: ${PHASE}"
          gh api --method POST "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" \
            -f state="$STATUS_STATE" -f context="$STATUS_CONTEXT" -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Upload exact observation receipt
        if: always() && steps.observe.outputs.state == 'CANDIDATE'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qikvrt-owner-decision-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qikvrt/owner-decision-closure/
          if-no-files-found: error
          retention-days: 30
