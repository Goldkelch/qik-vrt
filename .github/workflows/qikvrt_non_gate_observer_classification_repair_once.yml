name: QIKVRT one-shot non-gate observer classification repair

on:
  push:
    branches:
      - 'fix/live-status-pr-comment-permission-ff925'
    paths:
      - '.github/workflows/qikvrt_non_gate_observer_classification_repair_once.yml'

permissions:
  contents: write

concurrency:
  group: qikvrt-non-gate-observer-classification-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: 59151f518a3c4e4fc817133a2ea3c7bcf7edb94e
      TARGET_BRANCH: fix/live-status-pr-comment-permission-ff925
      CORE_PATH: tools/qikvrt_requested_review_executor.py
      TEST_PATH: tests/test_qikvrt_requested_review_executor.py
    steps:
      - name: Check out exact materialized permission head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Bind exact successor
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"

      - name: Classify the canonical live surface as a path-bound non-gate observer
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          from pathlib import Path

          core_path = Path('tools/qikvrt_requested_review_executor.py')
          test_path = Path('tests/test_qikvrt_requested_review_executor.py')
          core = core_path.read_text(encoding='utf-8')
          constants_anchor = 'NON_ADVERSE = {"success", "skipped"}\n'
          constants_replacement = (
              constants_anchor
              + 'NON_GATE_OBSERVER_PATHS = {\n'
              + '    "QIKVRT live status watch": ".github/workflows/qikvrt_live_status_watch.yml",\n'
              + '}\n'
          )
          if core.count(constants_anchor) != 1:
              raise SystemExit('NON_GATE_OBSERVER_CONSTANT_ANCHOR_MISMATCH')
          if 'NON_GATE_OBSERVER_PATHS' in core:
              raise SystemExit('NON_GATE_OBSERVER_CONSTANT_ALREADY_PRESENT')
          core = core.replace(constants_anchor, constants_replacement, 1)

          loop_anchor = '\n'.join([
              '    for identity, run in sorted(latest.items()):',
              '        if identity in required_identities:',
              '            continue',
              '        name = identity[3]',
              '        if run.get("status") != "completed":',
              '',
          ])
          loop_replacement = '\n'.join([
              '    for identity, run in sorted(latest.items()):',
              '        if identity in required_identities:',
              '            continue',
              '        name = identity[3]',
              '        observer_path = NON_GATE_OBSERVER_PATHS.get(name)',
              '        if observer_path is not None:',
              '            if run.get("path") != observer_path:',
              '                detail = (',
              '                    f"non-gate observer identity is untrusted: {name}; "',
              '                    f"path={run.get(chr(39) + \'path\' + chr(39))!r}"',
              '                )',
              '                return _result(',
              '                    snapshot,',
              '                    "WAIT",',
              '                    "UNTRUSTED_GATE_BINDING",',
              '                    detail,',
              '                    findings=findings',
              '                    + [_finding("UNTRUSTED_GATE_BINDING", "HOLD", detail)],',
              '                    **common,',
              '                )',
              '            detail = (',
              '                "exact-subject non-gate observer retained as metadata only: "',
              '                f"{name}={run.get(chr(39) + \'conclusion\' + chr(39)) or run.get(chr(39) + \'status\' + chr(39))}"',
              '            )',
              '            findings.append(',
              '                _finding("NON_GATE_OBSERVER_CLASSIFIED", "INFO", detail)',
              '            )',
              '            continue',
              '        if run.get("status") != "completed":',
              '',
          ])
          if core.count(loop_anchor) != 1:
              raise SystemExit('NON_GATE_OBSERVER_LOOP_ANCHOR_MISMATCH')
          core = core.replace(loop_anchor, loop_replacement, 1)
          core_path.write_text(core, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          test_anchor = '    def test_job_id_status_and_conclusion_are_fingerprint_bound(self):\n'
          new_tests = '\n'.join([
              '    def test_live_status_observer_failure_is_metadata_not_candidate_gate(self):',
              '        snap = self.snapshot()',
              '        snap["workflow_runs"].append(',
              '            self.workflow_run(',
              '                "QIKVRT live status watch",',
              '                identifier=601,',
              '                run_number=1,',
              '                path=".github/workflows/qikvrt_live_status_watch.yml",',
              '                conclusion="failure",',
              '            )',
              '        )',
              '',
              '        result = self.evaluate(snap)',
              '',
              '        self.assertEqual(result["mesh_disposition"], "APPROVE")',
              '        self.assertIsNone(result["first_blocker"])',
              '        self.assertIn("NON_GATE_OBSERVER_CLASSIFIED", self.finding_ids(result))',
              '        observer = next(',
              '            run',
              '            for run in result["latest_workflows"]',
              '            if run["name"] == "QIKVRT live status watch"',
              '        )',
              '        self.assertEqual(observer["conclusion"], "failure")',
              '',
              '    def test_live_status_observer_name_on_wrong_path_fails_closed(self):',
              '        snap = self.snapshot()',
              '        snap["workflow_runs"].append(',
              '            self.workflow_run(',
              '                "QIKVRT live status watch",',
              '                identifier=602,',
              '                run_number=1,',
              '                path=".github/workflows/candidate_name_collision.yml",',
              '                conclusion="failure",',
              '            )',
              '        )',
              '',
              '        result = self.evaluate(snap)',
              '',
              '        self.assertEqual(result["mesh_disposition"], "WAIT")',
              '        self.assertEqual(result["first_blocker"], "UNTRUSTED_GATE_BINDING")',
              '        self.assertIn("non-gate observer identity is untrusted", result["detail"])',
              '',
              '',
          ]) + test_anchor
          if tests.count(test_anchor) != 1:
              raise SystemExit('NON_GATE_OBSERVER_TEST_ANCHOR_MISMATCH')
          if 'test_live_status_observer_failure_is_metadata_not_candidate_gate' in tests:
              raise SystemExit('NON_GATE_OBSERVER_TEST_ALREADY_PRESENT')
          tests = tests.replace(test_anchor, new_tests, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Run exact review-core regressions and full compile contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v tests.test_qikvrt_requested_review_executor
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m py_compile \
            tools/qikvrt_requested_review_executor.py \
            tests/test_qikvrt_requested_review_executor.py

      - name: Regenerate and verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py generate
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py verify

      - name: Persist only non-workflow repair bytes
        shell: bash
        run: |
          set -euo pipefail
          git add "$CORE_PATH" "$TEST_PATH" LICENSE_CLASSIFICATION.json REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'WORKFLOW_PATH_UNEXPECTEDLY_STAGED' >&2
            exit 1
          fi
          git config user.name 'qik-vrt-review-classification-repair[bot]'
          git config user.email 'qik-vrt-review-classification-repair[bot]@users.noreply.github.com'
          git commit -m 'fix(review): classify live status as non-gate observer'
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
