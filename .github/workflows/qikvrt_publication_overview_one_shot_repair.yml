name: QIKVRT publication overview one-shot repair

on:
  push:
    branches:
      - publication/cloud-transputer-self-location-proof-v1

permissions:
  contents: write

concurrency:
  group: qikvrt-publication-overview-one-shot-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize canonical publication overview and self-remove
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          TARGET_REF: publication/cloud-transputer-self-location-proof-v1
        run: |
          set -euo pipefail
          observed="$(git rev-parse --verify HEAD^{commit})"
          test "$observed" = "$EXPECTED_HEAD"
          remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote" = "$EXPECTED_HEAD"

          python3 -B tools/qikvrt_publication_overview.py materialize --json
          python3 -B tools/qikvrt_publication_overview.py check --json

          # This finite repair carrier must not survive in the productive tree.
          git rm -- .github/workflows/qikvrt_publication_overview_one_shot_repair.yml

          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/publications/index.json docs/publications/index.html \
                  REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt

          remote_before_commit="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_before_commit" = "$EXPECTED_HEAD"

          git commit -m 'docs: materialize cloud-transputer publication overview'

          remote_before_push="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_before_push" = "$EXPECTED_HEAD"
          git push origin "HEAD:$TARGET_REF"
