# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: QIKVRT one-time exact stale writer drain

on:
  push:
    branches:
      - feature/canonical-ai-firefox-current-main-20260827
    paths:
      - ".github/workflows/qikvrt_stale_writer_one_time_drain.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  drain-exact-stale-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Revalidate, preserve, delete and reobserve exactly two stale runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          root=.qikvrt/stale-writer-drain
          mkdir -p "$root"

          validate() {
            local id="$1" name="$2" path="$3" head="$4" event="$5" created="$6"
            gh api "repos/${REPOSITORY}/actions/runs/${id}" > "$root/pre-${id}.json"
            jq -e \
              --argjson id "$id" \
              --arg name "$name" \
              --arg path "$path" \
              --arg head "$head" \
              --arg event "$event" \
              --arg created "$created" \
              '.id == $id
               and .name == $name
               and .path == $path
               and .head_sha == $head
               and .event == $event
               and .created_at == $created
               and .updated_at == $created
               and .status == "queued"
               and .conclusion == null' \
              "$root/pre-${id}.json" >/dev/null
          }

          validate \
            32985189717 \
            "QIK-VRT expected-head promotion executor" \
            ".github/workflows/qikvrt_expected_head_promotion.yml" \
            "fb744e5b5925d61c6b473e27aab3606f237f7e6d" \
            "schedule" \
            "2026-08-26T15:27:31Z"

          validate \
            30295789608 \
            "QIKVRT repository evidence materialization" \
            ".github/workflows/qikvrt_batch04_integrity.yml" \
            "d83babfc4e6d114d5ed8f95c4b0763e87197f5c0" \
            "pull_request" \
            "2026-07-27T18:53:19Z"

          sha256sum "$root"/pre-*.json > "$root/pre-run-sha256.txt"
          jq -n \
            --arg source_head "$GITHUB_SHA" \
            --argjson source_run "$GITHUB_RUN_ID" \
            --arg state "PREVALIDATED" \
            '{schema:"qikvrt_exact_stale_writer_drain_v1",
              source_head:$source_head,
              source_run:$source_run,
              target_run_ids:[32985189717,30295789608],
              state:$state,
              exact_prevalidation:true,
              deleted:false,
              post_delete_404:false,
              external_effect:"NONE",
              general_effect_ack_done:false,
              pass:false,
              final_pass:false}' > "$root/receipt.json"

          for id in 32985189717 30295789608; do
            gh api --method DELETE "repos/${REPOSITORY}/actions/runs/${id}"
          done

          for id in 32985189717 30295789608; do
            if gh api "repos/${REPOSITORY}/actions/runs/${id}" \
                > "$root/post-${id}.json" 2> "$root/post-${id}.stderr"; then
              echo "run ${id} still exists after deletion" >&2
              exit 1
            fi
            grep -q "HTTP 404" "$root/post-${id}.stderr"
          done

          jq \
            '.state="DELETED_AND_404_REOBSERVED"
             | .deleted=true
             | .post_delete_404=true' \
            "$root/receipt.json" > "$root/receipt.final.json"
          mv "$root/receipt.final.json" "$root/receipt.json"
          cat "$root/receipt.json"

      - name: Preserve exact stale-writer drain receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-stale-writer-drain-${{ github.sha }}-${{ github.run_attempt }}
          path: .qikvrt/stale-writer-drain
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
