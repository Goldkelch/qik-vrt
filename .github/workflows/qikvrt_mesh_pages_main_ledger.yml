name: QIKVRT Mesh Pages main receipt ledger

on:
  workflow_run:
    workflows:
      - 'QIKVRT Mesh Pages delivery'
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: qikvrt-mesh-pages-main-ledger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  persist-main-pages-receipt:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'page_build'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      LEDGER_REF: refs/heads/qikvrt/mesh-pages-receipt-ledger-v1

    steps:
      - name: Check out exact trusted Authority-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate exact Authority-main source before artifact acceptance
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD^{commit})"
          live="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 {print $1}')"
          printf 'source_head=%s\nactual_head=%s\nlive_main=%s\n' \
            "$SOURCE_HEAD" "$actual" "$live"
          test "$actual" = "$SOURCE_HEAD"
          test "$live" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Download exact source-run Pages evidence
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/evidence"
          mkdir -p "$target"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "qikvrt-mesh-pages-${SOURCE_RUN_ID}" \
            --dir "$target"
          test -s "$target/pages-reobservation-receipt.json"

      - name: Verify exact receipt and fail-closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_TREE="$(git rev-parse --verify HEAD^{tree})"
          python3 -B - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt_path = Path(os.environ['RUNNER_TEMP']) / 'evidence/pages-reobservation-receipt.json'
          value = json.loads(receipt_path.read_text(encoding='utf-8'))
          assert value['schema'] == 'QIKVRT_MESH_PAGES_REOBSERVATION_RECEIPT_V1'
          assert value['repository'] == os.environ['GITHUB_REPOSITORY']
          assert value['event'] == 'page_build'
          assert value['exact_head'] == os.environ['SOURCE_HEAD']
          assert value['exact_tree'] == os.environ['SOURCE_TREE']
          assert value['run_id'] == int(os.environ['SOURCE_RUN_ID'])
          assert value['site_base_url'] == 'https://goldkelch.github.io/qik-vrt/'
          assert re.fullmatch(r'[0-9a-f]{64}', value['registry_sha256'])
          assert value['route_count'] == len(value['routes'])
          assert value['route_count'] >= 3
          assert len({route['relative'] for route in value['routes']}) == value['route_count']
          for route in value['routes']:
              assert route['status'] == 200
              assert route['bytes'] > 0
              assert re.fullmatch(r'[0-9a-f]{64}', route['sha256'])
          assert value['page_build_event_observed'] is True
          assert value['github_pages_reachability_observed'] is True
          assert value['authority_mesh_root_observed'] is True
          assert value['machine_topology_observed'] is True
          assert value['all_active_guid_urls_observed'] is True
          assert value['single_attempt_per_route'] is True
          assert value['periodic_polling'] is False
          assert value['browser_rendering_observed'] is False
          assert value['browser_javascript_observed'] is False
          assert value['general_internet_reachability_claimed'] is False
          assert value['external_mutation'] == 'NONE'
          assert value['pass'] is False
          assert value['final_pass'] is False
          assert value['effect_ack_done'] is False
          print('QIKVRT_MESH_PAGES_MAIN_RECEIPT=VERIFIED')
          PY

      - name: Persist exact receipt with serialized source and ledger CAS
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/evidence/pages-reobservation-receipt.json"
          source_remote_before="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [ "$source_remote_before" != "$SOURCE_HEAD" ]; then
            echo 'BLOCK: AUTHORITY_MAIN_ADVANCED_BEFORE_LEDGER_WRITE' >&2
            exit 2
          fi

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ledger="$RUNNER_TEMP/ledger"
          git init -q "$ledger"
          git -C "$ledger" config user.name 'github-actions[bot]'
          git -C "$ledger" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$ledger" remote add origin "$remote"

          expected_ledger_head="$(git ls-remote "$remote" "$LEDGER_REF" | awk 'NR == 1 {print $1}')"
          if [ -n "$expected_ledger_head" ]; then
            git -C "$ledger" fetch --no-tags --depth=1 origin "$LEDGER_REF"
            git -C "$ledger" checkout -q -B ledger FETCH_HEAD
          else
            git -C "$ledger" checkout -q --orphan ledger
          fi

          target="receipts/${SOURCE_HEAD}/${SOURCE_RUN_ID}.json"
          mkdir -p "$ledger/$(dirname "$target")"
          if [ -e "$ledger/$target" ]; then
            cmp "$source" "$ledger/$target"
          else
            cp "$source" "$ledger/$target"
          fi
          cp "$source" "$ledger/latest.json"
          git -C "$ledger" add "$target" latest.json
          if git -C "$ledger" diff --cached --quiet; then
            echo 'QIKVRT_MESH_PAGES_LEDGER_ALREADY_CURRENT'
            exit 0
          fi
          git -C "$ledger" commit -q \
            -m "evidence: Mesh Pages ${SOURCE_HEAD} run ${SOURCE_RUN_ID}"

          source_remote_before_push="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [ "$source_remote_before_push" != "$SOURCE_HEAD" ]; then
            echo 'BLOCK: AUTHORITY_MAIN_ADVANCED_BEFORE_LEDGER_PUSH' >&2
            exit 2
          fi
          ledger_remote_before_push="$(git ls-remote "$remote" "$LEDGER_REF" | awk 'NR == 1 {print $1}')"
          if [ "$ledger_remote_before_push" != "$expected_ledger_head" ]; then
            echo 'BLOCK: LEDGER_REF_ADVANCED_BEFORE_PUSH' >&2
            exit 2
          fi
          git -C "$ledger" push origin "HEAD:$LEDGER_REF"
