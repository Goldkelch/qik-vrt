                      or durable_rerun.get('source_fingerprint')
                          != inbox_slot['source_fingerprint']
                      or durable_rerun.get('source_sha256')
                          != inbox_slot['source_sha256']
                      or durable_rerun.get('state') != 'PRE_EFFECT_REOBSERVED'
                      or durable_rerun.get('productive_effect') is not False
                  ):
                      raise SystemExit('ADMISSION_INBOX_DURABLE_RERUN_INVALID')
                  intent=durable_intent
                  binding=durable_binding
                  selection['intent_reused']=True
              else:
                  intent=reusable_intents.get(source_key,expected_intent)
                  binding=build_recovery_producer_binding(
                      intent,
                      recovery_run_id=int(os.environ['GITHUB_RUN_ID']),
                      recovery_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                  )
                  selection['intent_reused']=source_key in reusable_intents
              if intent != expected_intent:
                  raise SystemExit('ADMISSION_RECOVERY_REUSED_INTENT_DIFFERS')
              (root/'intent.json').write_text(
                  json.dumps(intent,sort_keys=True,indent=2)+'\n'
              )
              (root/'producer-binding.json').write_text(
                  json.dumps(binding,sort_keys=True,indent=2)+'\n'
              )
              selection['intent_sha256']=intent['intent_sha256']
          elif selection.get('state') in {
              'ACTION_REQUIRED_D0_3',
              'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3',
              'RETRY_EXHAUSTED_D0_3','LIVE_SUBJECT_DRIFT_D0_3',
              'SUPERSEDED_EVALUATOR_D0_3',
              'SIGNER_RECEIPT_RECOVERY_EXHAUSTED_D0_3',
          }:
              terminal=build_terminal_receipt(selection)
              terminal_binding=build_terminal_producer_binding(
                  terminal,
                  recovery_repository=repo,
                  recovery_workflow_id=int(recovery_workflow['id']),
                  recovery_workflow_path=(
                      '.github/workflows/qikvrt_review_admission_recovery.yml'
                  ),
                  recovery_head_sha=main['sha'],
                  recovery_run_id=int(os.environ['GITHUB_RUN_ID']),
                  recovery_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              )
              (root/'terminal.json').write_text(
                  json.dumps(terminal,sort_keys=True,indent=2)+'\n'
              )
              (root/'terminal-producer-binding.json').write_text(
                  json.dumps(terminal_binding,sort_keys=True,indent=2)+'\n'
              )
              selection['terminal_receipt_sha256']=terminal['receipt_sha256']
          print(json.dumps(selection,sort_keys=True,indent=2))
          PY
          cat "$root/selection.json"
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('/tmp/qikvrt-review-admission-recovery/selection.json'))
          source=value.get('selected') or {}
          state=value['state']
          if state == 'RERUN_ATTEMPT_2':
              artifact=(
                  f"qikvrt-admission-rerun-intent-{source['workflow_id']}-"
                  f"{source['run_id']}-1-to-2-{value['intent_sha256']}"
              )
          elif state in {
              'ACTION_REQUIRED_D0_3',
              'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3',
              'RETRY_EXHAUSTED_D0_3','LIVE_SUBJECT_DRIFT_D0_3',
              'SUPERSEDED_EVALUATOR_D0_3',
              'SIGNER_RECEIPT_RECOVERY_EXHAUSTED_D0_3',
          }:
              artifact=(
                  f"qikvrt-admission-recovery-terminal-{source['workflow_id']}-"
                  f"{source['run_id']}-attempt-{source['run_attempt']}-"
                  f"{value['terminal_receipt_sha256']}"
              )
          elif state == 'TECHNICAL_CONTINUATION_D0_2':
              artifact=(
                  f"qikvrt-admission-recovery-continuation-"
                  f"{value['inbox_sequence']}-"
                  f"{value['continuation_receipt_sha256']}"
              )
          elif state == 'SIGNER_RECEIPT_CONTINUATION_D0_2':
              artifact=(
                  f"qikvrt-admission-signer-continuation-"
                  f"{value['inbox_sequence']}-"
                  f"{value['continuation_receipt_sha256']}"
              )
          else:
              artifact=''
          print(f"state={state}")
          print(f"rerun={'true' if value.get('rerun_required') is True else 'false'}")
          print(f"source_run_id={source.get('run_id') or ''}")
          print(f"source_attempt={source.get('run_attempt') or ''}")
          print(f"artifact_name={artifact}")
          print(f"inbox_sequence={value.get('inbox_sequence') or ''}")
          print(f"source_kind={value.get('source_kind') or ''}")
          origin=value.get('origin_authority') or {}
          print(f"core_lane={origin.get('lane') or ''}")
          print(f"core_sequence={origin.get('sequence') or ''}")
          print(f"core_transport_attempt={origin.get('transport_attempt') or ''}")
          PY

      - name: Preserve content-addressed recovery intent or terminal receipt
        if: steps.plan.outputs.state != 'EMPTY'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            /tmp/qikvrt-review-admission-recovery/selection.json
            /tmp/qikvrt-review-admission-recovery/inbox-slot.json
            /tmp/qikvrt-review-admission-recovery/intent.json
            /tmp/qikvrt-review-admission-recovery/producer-binding.json
            /tmp/qikvrt-review-admission-recovery/terminal.json
            /tmp/qikvrt-review-admission-recovery/terminal-producer-binding.json
            /tmp/qikvrt-review-admission-recovery/continuation.json
            /tmp/qikvrt-review-admission-recovery/signer-continuation.json
            /tmp/qikvrt-review-admission-recovery/core-recovery-readback.json

  plan-shared-core-child-rerun-terminal:
    needs: plan-one
    if: >-
      (needs.plan-one.outputs.state == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3' ||
       needs.plan-one.outputs.state == 'ACTION_REQUIRED_D0_3') &&
      (needs.plan-one.outputs.source_kind == 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' ||
       needs.plan-one.outputs.source_kind == 'CORE_MESH_REVIEW_CHILD_ZERO_JOB')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      mode: ${{ steps.plan.outputs.mode }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PLAN_ARTIFACT: ${{ needs.plan-one.outputs.artifact_name }}
      SOURCE_RUN_ID: ${{ needs.plan-one.outputs.source_run_id }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact sealed no-attempt-two observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact pending Shared-Core recovery
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-core-terminal

      - name: Seal exact Shared-Core Admission terminal observation
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import email.utils,json,os,pathlib,subprocess,time
          from tools.qikvrt_review_admission_recovery import (
              build_shared_review_core_action_required_observation,
              build_shared_review_core_child_rerun_absence_observation,
              validate_terminal_receipt,
              validate_shared_review_core_origin,
              validate_shared_review_core_rerun_preparation,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-core-terminal')
          selection=json.loads((root/'selection.json').read_text())
          selection_state=selection.get('state')
          if (
              selection_state not in {
                  'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3',
                  'ACTION_REQUIRED_D0_3',
              }
              or selection.get('source_kind') not in {
                  'CORE_EXACT_REVIEW_CHILD_ZERO_JOB',
                  'CORE_MESH_REVIEW_CHILD_ZERO_JOB',
              }
              or (
                  selection_state == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
                  and selection.get('first_blocker')
                      != 'RERUN_TRANSPORT_UNACKNOWLEDGED'
              )
              or (
                  selection_state == 'ACTION_REQUIRED_D0_3'
                  and selection.get('first_blocker')
                      != 'SOURCE_ATTEMPT_1_ACTION_REQUIRED'
              )
          ):
              raise SystemExit('SHARED_CORE_TERMINAL_SELECTION_DRIFT')
          origin=validate_shared_review_core_origin(
              selection.get('origin_authority')
          )
          recovery=selection.get('core_recovery_readback')
          adoption=selection.get('core_terminal_adoption_required') is True
          if adoption:
              lookup=selection.get('core_terminal_lookup')
              terminal=(lookup.get('terminal')
                  if isinstance(lookup,dict) else None)
              evidence=(terminal.get('evidence')
                  if isinstance(terminal,dict) else None)
              expected_reason=(
                  'CHILD_RERUN_ATTEMPT_2_NOT_OBSERVED'
                  if selection_state
                      == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
                  else 'SOURCE_ATTEMPT_1_ACTION_REQUIRED'
              )
              if (
                  not isinstance(recovery,dict)
                  or recovery.get('parent_state') != 'TERMINAL'
                  or (
                      selection_state
                          == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
                      and (
                          recovery.get('state') != 'PREPARED'
                          or recovery.get('acceptance') is not None
                      )
                  )
                  or (
                      selection_state == 'ACTION_REQUIRED_D0_3'
                      and recovery.get('state') != 'NOT_PREPARED'
                  )
                  or not isinstance(lookup,dict)
                  or lookup.get('state') != 'TERMINAL'
                  or lookup.get('lane') != origin['lane']
                  or lookup.get('sequence') != origin['sequence']
                  or lookup.get('fingerprint') != origin['fingerprint']
                  or not isinstance(evidence,dict)
                  or evidence.get('reason') != expected_reason
              ):
                  raise SystemExit('SHARED_CORE_TERMINAL_ADOPTION_DRIFT')
              mode={
                  'schema':'qikvrt_review_admission_core_terminal_mode_v1',
                  'mode':'ADOPT_DURABLE_SHARED_CORE_TERMINAL',
                  'selection_state':selection_state,
                  'lane':origin['lane'],'sequence':origin['sequence'],
                  'fingerprint':origin['fingerprint'],
                  'productive_effect':False,
              }
              artifact=(
                  f"qikvrt-admission-core-terminal-adoption-{origin['lane']}-"
                  f"{origin['sequence']}-{os.environ['GITHUB_RUN_ID']}-"
                  f"{os.environ['GITHUB_RUN_ATTEMPT']}"
              )
              (root/'core-child-rerun-terminal-mode.json').write_text(
                  json.dumps(mode,sort_keys=True,indent=2)+'\n'
              )
              print(f'artifact_name={artifact}',file=open(
                  os.environ['GITHUB_OUTPUT'],'a'
              ))
              print('mode=ADOPT_DURABLE_SHARED_CORE_TERMINAL',file=open(
                  os.environ['GITHUB_OUTPUT'],'a'
              ))
              raise SystemExit(0)
          if (
              not isinstance(recovery,dict)
              or recovery.get('parent_state') != 'PENDING'
              or (
                  selection_state
                      == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
                  and (
                      recovery.get('state') != 'PREPARED'
                      or recovery.get('acceptance') is not None
                  )
              )
              or (
                  selection_state == 'ACTION_REQUIRED_D0_3'
                  and recovery.get('state') != 'NOT_PREPARED'
              )
          ):
              raise SystemExit('SHARED_CORE_TERMINAL_PREPARATION_MISSING')
          preparation=(
              validate_shared_review_core_rerun_preparation(
                  recovery.get('preparation'),origin=origin
              )
              if selection_state
                  == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
              else None
          )

          def api(path):
              return json.loads(subprocess.check_output(
                  ['gh','api',path],text=True
              ))

          def server_time():
              response=subprocess.check_output([
                  'gh','api','--include',
                  f"repos/{os.environ['REPOSITORY']}",
              ],text=True)
              dates=[line.split(':',1)[1].strip() for line in response.splitlines()
                  if line.lower().startswith('date:')]
              if len(dates) != 1:
                  raise SystemExit('SHARED_CORE_SERVER_TIME_MISSING')
              observed=email.utils.parsedate_to_datetime(dates[0])
              if observed.tzinfo is None:
                  raise SystemExit('SHARED_CORE_SERVER_TIME_UNZONED')
              return observed.astimezone(
                  __import__('datetime').timezone.utc
              ).strftime('%Y-%m-%dT%H:%M:%SZ')

          def exact_inventory(path,key):
              values=[]
              total=None
              page=1
              while True:
                  separator='&' if '?' in path else '?'
                  current=api(
                      f'{path}{separator}per_page=100&page={page}'
                  )
                  batch=current.get(key) if isinstance(current,dict) else None
                  declared=(
                      current.get('total_count')
                      if isinstance(current,dict) else None
                  )
                  if not isinstance(batch,list) or not isinstance(declared,int):
                      raise SystemExit('SHARED_CORE_TERMINAL_PAGE_INVALID')
                  if total is None: total=declared
                  elif total != declared:
                      raise SystemExit('SHARED_CORE_TERMINAL_TOTAL_DRIFT')
                  values.extend(batch)
                  if len(batch) < 100: break
                  page += 1
              if (
                  total != len(values)
                  or len({item.get('id') for item in values}) != len(values)
              ):
                  raise SystemExit('SHARED_CORE_TERMINAL_PAGE_INCOMPLETE')
              return values

          observer=api(
              f"repos/{os.environ['REPOSITORY']}/actions/runs/"
              f"{int(os.environ['GITHUB_RUN_ID'])}"
          )
          observation_started_at=server_time()
          target=api(
              f"repos/{os.environ['REPOSITORY']}/actions/runs/"
              f"{int(os.environ['SOURCE_RUN_ID'])}"
          )
          jobs=exact_inventory(
              f"repos/{os.environ['REPOSITORY']}/actions/runs/"
              f"{int(os.environ['SOURCE_RUN_ID'])}/jobs?filter=all",'jobs'
          )
          artifacts=exact_inventory(
              f"repos/{os.environ['REPOSITORY']}/actions/runs/"
              f"{int(os.environ['SOURCE_RUN_ID'])}/artifacts",'artifacts'
          )
          jobs_total=len(jobs)
          artifacts_total=len(artifacts)
          actor=(
              api(
                  f"repos/{os.environ['REPOSITORY']}/actions/runs/"
                  f"{preparation['actor_run_id']}/attempts/"
                  f"{preparation['actor_run_attempt']}"
              )
              if preparation is not None else None
          )
          observation_completed_at=server_time()
          for _ in range(8):
              if observation_completed_at > observation_started_at:
                  break
              time.sleep(0.25)
              observation_completed_at=server_time()
          if (
              observer.get('id') != int(os.environ['GITHUB_RUN_ID'])
              or observer.get('run_attempt')
                  != int(os.environ['GITHUB_RUN_ATTEMPT'])
              or observer.get('head_sha') != os.environ['SEALED_EVALUATOR']
              or observer.get('path')
                  != '.github/workflows/qikvrt_review_admission_recovery.yml'
              or observer.get('event')
                  not in {'schedule','workflow_run','workflow_dispatch'}
              or origin.get('intent',{}).get('payload',{}).get('main_head_sha')
                  != os.environ['SEALED_EVALUATOR']
              or observation_started_at >= observation_completed_at
          ):
              raise SystemExit('SHARED_CORE_TERMINAL_OBSERVER_DRIFT')
          if selection_state == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3':
              observation=(
                  build_shared_review_core_child_rerun_absence_observation(
                      origin,preparation,target_run=target,
                      target_jobs_total=jobs_total,
                      target_artifacts_total=artifacts_total,
                      preparation_actor_run=actor,
                      observation_started_at=observation_started_at,
                      observation_completed_at=observation_completed_at,
                  )
              )
              live_subject=None
              admission_receipt=None
          else:
              current_main=api(
                  f"repos/{os.environ['REPOSITORY']}/commits/main"
              )
              request=origin['intent']['payload'].get('request')
              request_inputs=(request.get('inputs')
                  if isinstance(request,dict) else None)
              pr_number=(int(request_inputs['pr'])
                  if isinstance(request_inputs,dict)
                  and isinstance(request_inputs.get('pr'),str)
                  and request_inputs['pr'].isdigit() else None)
              pull=api(
                  f"repos/{os.environ['REPOSITORY']}/pulls/{pr_number}"
              ) if isinstance(pr_number,int) else {}
              live_head=pull.get('head',{}).get('sha')
              live_base=pull.get('base',{}).get('sha')
              head_commit=(api(
                  f"repos/{os.environ['REPOSITORY']}/git/commits/{live_head}"
              ) if isinstance(live_head,str) else {})
              base_commit=(api(
                  f"repos/{os.environ['REPOSITORY']}/git/commits/{live_base}"
              ) if isinstance(live_base,str) else {})
              if (
                  current_main.get('sha') != os.environ['SEALED_EVALUATOR']
                  or pull.get('number') != pr_number
                  or pull.get('state') != 'open'
                  or pull.get('base',{}).get('ref') != 'main'
                  or pull.get('base',{}).get('repo',{}).get('full_name')
                      != os.environ['REPOSITORY']
                  or pull.get('head',{}).get('repo',{}).get('full_name')
                      != os.environ['REPOSITORY']
                  or not isinstance(head_commit.get('tree',{}).get('sha'),str)
                  or not isinstance(base_commit.get('tree',{}).get('sha'),str)
              ):
                  raise SystemExit('SHARED_CORE_ACTION_LIVE_SUBJECT_DRIFT')
              live_subject={
                  'pr_number':pr_number,'head_sha':live_head,
                  'head_tree_sha':head_commit['tree']['sha'],
                  'head_repository':pull['head']['repo']['full_name'],
                  'head_ref':pull['head']['ref'],'base_sha':live_base,
                  'base_tree_sha':base_commit['tree']['sha'],
                  'base_repository':pull['base']['repo']['full_name'],
                  'base_ref':pull['base']['ref'],
              }
              admission_receipt=validate_terminal_receipt(json.loads(
                  (root/'terminal.json').read_text()
              ))
              observation=(
                  build_shared_review_core_action_required_observation(
                      origin,target_run=target,
                      target_jobs_total=jobs_total,
                      target_artifacts_total=artifacts_total,
                      admission_receipt=admission_receipt,
                      current_main_sha=current_main['sha'],
                      live_subject=live_subject,
                      observation_started_at=observation_started_at,
                      observation_completed_at=observation_completed_at,
                  )
              )
          producer={
              'workflow_path':(
                  '.github/workflows/qikvrt_review_admission_recovery.yml'
              ),
              'workflow_sha':os.environ['SEALED_EVALUATOR'],
              'workflow_id':observer.get('workflow_id'),
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'event':observer.get('event'),
          }
          inputs={
              'selection_state':selection_state,
              'target_run':target,
              'target_jobs_total':jobs_total,
              'target_artifacts_total':artifacts_total,
              'preparation_actor_run':actor,
              'live_subject':live_subject,
              'admission_receipt':admission_receipt,
              'observation_started_at':observation_started_at,
              'observation_completed_at':observation_completed_at,
          }
          artifact=(
              f"qikvrt-outbox-authority-observation-{origin['lane']}-"
              f"{origin['sequence']}-"
              f"{observation['blocker']}-"
              f"run-{producer['run_id']}-attempt-{producer['run_attempt']}"
          )
          for name,value in (
              ('core-child-rerun-observation.json',observation),
              ('core-child-rerun-observation-producer.json',producer),
              ('core-child-rerun-observation-inputs.json',inputs),
          ):
              (root/name).write_text(
                  json.dumps(value,sort_keys=True,indent=2)+'\n'
              )
          mode={
              'schema':'qikvrt_review_admission_core_terminal_mode_v1',
              'mode':'PERSIST_NEW_OBSERVATION',
              'selection_state':selection_state,
              'lane':origin['lane'],'sequence':origin['sequence'],
              'fingerprint':origin['fingerprint'],
              'productive_effect':False,
          }
          (root/'core-child-rerun-terminal-mode.json').write_text(
              json.dumps(mode,sort_keys=True,indent=2)+'\n'
          )
          print(f'artifact_name={artifact}',file=open(
              os.environ['GITHUB_OUTPUT'],'a'
          ))
          print('mode=PERSIST_NEW_OBSERVATION',file=open(
              os.environ['GITHUB_OUTPUT'],'a'
          ))
          PY

      - name: Preserve exact post-actor no-attempt-two observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-terminal-mode.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-observation.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-observation-producer.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-observation-inputs.json

  terminalize-shared-core-child-rerun:
    needs: [plan-one, plan-shared-core-child-rerun-terminal]
    if: >-
      (needs.plan-one.outputs.state == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3' ||
       needs.plan-one.outputs.state == 'ACTION_REQUIRED_D0_3') &&
      needs.plan-shared-core-child-rerun-terminal.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-${{ needs.plan-one.outputs.core_lane || 'not-applicable' }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.envelope.outputs.artifact_name }}
    env:
      REPOSITORY: ${{ github.repository }}
      CORE_LANE: ${{ needs.plan-one.outputs.core_lane }}
      CORE_SEQUENCE: ${{ needs.plan-one.outputs.core_sequence }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-${{ needs.plan-one.outputs.core_lane || 'not-applicable' }}
      PLAN_ARTIFACT: ${{ needs.plan-one.outputs.artifact_name }}
      OBSERVATION_ARTIFACT: ${{ needs.plan-shared-core-child-rerun-terminal.outputs.artifact_name }}
      TERMINAL_MODE: ${{ needs.plan-shared-core-child-rerun-terminal.outputs.mode }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact sealed Shared-Core terminalizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact pending Shared-Core recovery
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-core-terminal

      - name: Download exact Shared-Core terminal observation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.OBSERVATION_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-core-terminal

      - name: Reobserve pre-effect Shared-Core state with Auditor
        id: core_state
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="${LEDGER_AUDITOR_TOKEN-}"
          actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$token"
          [[ "$actor" =~ ^[1-9][0-9]*$ ]]
          root=/tmp/qikvrt-review-admission-core-terminal
          fingerprint="$(jq -er .origin_authority.fingerprint "$root/selection.json")"
          QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/core-child-rerun-preterminal-lookup.json" \
              lookup-fingerprint --lane "$CORE_LANE" \
              --fingerprint "$fingerprint" >/dev/null
          unset token actor fingerprint
          python3 -B - <<'PY'
          import json,os,pathlib
          from tools.qikvrt_review_admission_recovery import (
              reobserve_shared_review_core_child_recovery,
              validate_shared_review_core_origin,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-core-terminal')
          selection=json.loads((root/'selection.json').read_text())
          origin=validate_shared_review_core_origin(
              selection.get('origin_authority')
          )
          mode=json.loads(
              (root/'core-child-rerun-terminal-mode.json').read_text()
          )
          selection_state=selection.get('state')
          if (
              mode.get('schema')
                  != 'qikvrt_review_admission_core_terminal_mode_v1'
              or mode.get('mode') != os.environ['TERMINAL_MODE']
              or mode.get('lane') != origin['lane']
              or mode.get('sequence') != origin['sequence']
              or mode.get('fingerprint') != origin['fingerprint']
              or mode.get('selection_state') != selection_state
              or selection_state not in {
                  'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3',
                  'ACTION_REQUIRED_D0_3',
              }
              or mode.get('productive_effect') is not False
          ):
              raise SystemExit('SHARED_CORE_TERMINAL_MODE_DRIFT')
          lookup=json.loads(
              (root/'core-child-rerun-preterminal-lookup.json').read_text()
          )
          recovery=reobserve_shared_review_core_child_recovery(
              lookup,origin=origin
          )
          if lookup.get('state') == 'TERMINAL':
              terminal=lookup.get('terminal')
              evidence=(terminal.get('evidence')
                  if isinstance(terminal,dict) else None)
              exhaustion=(evidence.get('exhaustion')
                  if isinstance(evidence,dict) else None)
              expected_reason=(
                  'CHILD_RERUN_ATTEMPT_2_NOT_OBSERVED'
                  if selection_state
                      == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
                  else 'SOURCE_ATTEMPT_1_ACTION_REQUIRED'
              )
              expected_mode=(
                  'CHILD_RERUN_EXHAUSTED'
                  if selection_state
                      == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
                  else 'AMBIGUOUS_OR_DRIFT'
              )
              if (
                  (
                      selection_state
                          == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
                      and (
                          recovery.get('state') != 'PREPARED'
                          or recovery.get('acceptance') is not None
                          or exhaustion.get('target_run_id')
                              != origin['source']['run_id']
                          or exhaustion.get('target_run_attempt') != 2
                      )
                  )
                  or (
                      selection_state == 'ACTION_REQUIRED_D0_3'
                      and recovery.get('state') != 'NOT_PREPARED'
                  )
                  or recovery.get('parent_state') != 'TERMINAL'
                  or terminal.get('d0') != 3
                  or evidence.get('reason') != expected_reason
                  or exhaustion.get('mode') != expected_mode
              ):
                  raise SystemExit('SHARED_CORE_TERMINAL_ADOPTION_INVALID')
              (root/'core-child-rerun-terminal-evidence.json').write_text(
                  json.dumps(evidence,sort_keys=True,indent=2)+'\n'
              )
              effective='ADOPT_DURABLE_SHARED_CORE_TERMINAL'
          elif (
              lookup.get('state') == 'PENDING'
              and mode.get('mode') == 'PERSIST_NEW_OBSERVATION'
              and recovery.get('parent_state') == 'PENDING'
              and (
                  (
                      selection_state
                          == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
                      and recovery.get('state') == 'PREPARED'
                      and recovery.get('acceptance') is None
                  )
                  or (
                      selection_state == 'ACTION_REQUIRED_D0_3'
                      and recovery.get('state') == 'NOT_PREPARED'
                  )
              )
          ):
              effective='PERSIST_NEW_OBSERVATION'
          else:
              raise SystemExit('SHARED_CORE_TERMINAL_PREEFFECT_DRIFT')
          print(f'mode={effective}',file=open(
              os.environ['GITHUB_OUTPUT'],'a'
          ))
          PY

      - name: Bind exact observation artifact API identity and archive digest
        if: steps.core_state.outputs.mode == 'PERSIST_NEW_OBSERVATION'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path('/tmp/qikvrt-review-admission-core-terminal')
          expected=os.environ['OBSERVATION_ARTIFACT']
          values=[]
          total=None
          page=1
          while True:
              raw=json.loads(subprocess.check_output([
                  'gh','api',
                  f"repos/{os.environ['REPOSITORY']}/actions/runs/"
                  f"{int(os.environ['GITHUB_RUN_ID'])}/artifacts?"
                  f"per_page=100&page={page}",
              ],text=True))
              batch=raw.get('artifacts') if isinstance(raw,dict) else None
              declared=raw.get('total_count') if isinstance(raw,dict) else None
              if not isinstance(batch,list) or not isinstance(declared,int):
                  raise SystemExit('CORE_OBSERVATION_ARTIFACT_PAGE_INVALID')
              if total is None: total=declared
              elif total != declared:
                  raise SystemExit('CORE_OBSERVATION_ARTIFACT_TOTAL_DRIFT')
              values.extend(batch)
              if len(batch) < 100: break
              page += 1
          if total != len(values):
              raise SystemExit('CORE_OBSERVATION_ARTIFACT_PAGE_INCOMPLETE')
          matches=[item for item in values if (
              item.get('name') == expected and item.get('expired') is False
          )]
          if len(matches) != 1:
              raise SystemExit('CORE_OBSERVATION_ARTIFACT_AMBIGUOUS')
          item=matches[0]
          owner=item.get('workflow_run')
          if (
              not isinstance(owner,dict)
              or owner.get('id') != int(os.environ['GITHUB_RUN_ID'])
              or owner.get('head_sha') != os.environ['SEALED_EVALUATOR']
              or not isinstance(item.get('id'),int) or item['id'] < 1
          ):
              raise SystemExit('CORE_OBSERVATION_ARTIFACT_OWNER_DRIFT')
          archive=subprocess.check_output([
              'gh','api',
              f"repos/{os.environ['REPOSITORY']}/actions/artifacts/"
              f"{item['id']}/zip",
          ])
          expected_entries={
              'core-child-rerun-terminal-mode.json',
              'core-child-rerun-observation.json',
              'core-child-rerun-observation-producer.json',
              'core-child-rerun-observation-inputs.json',
          }
          with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
              entries={name for name in zipped.namelist() if not name.endswith('/')}
              if entries != expected_entries:
                  raise SystemExit('CORE_OBSERVATION_ARTIFACT_ENTRIES_DRIFT')
              for name in sorted(expected_entries):
                  if zipped.read(name) != (root/name).read_bytes():
                      raise SystemExit('CORE_OBSERVATION_ARTIFACT_BYTES_DRIFT')
          producer=json.loads(
              (root/'core-child-rerun-observation-producer.json').read_text()
          )
          metadata={
              'id':item['id'],'name':expected,
              'archive_sha256':hashlib.sha256(archive).hexdigest(),
              'producer_run_id':int(os.environ['GITHUB_RUN_ID']),
              'producer_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'producer_workflow_id':producer.get('workflow_id'),
          }
          (root/'core-child-rerun-observation-artifact.json').write_text(
              json.dumps(metadata,sort_keys=True,indent=2)+'\n'
          )
          PY

      - name: Persist exact observation and terminal with Shared-Core CAS
        env:
          EFFECTIVE_MODE: ${{ steps.core_state.outputs.mode }}
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="${LEDGER_WRITER_TOKEN-}"
          actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$token"
          [[ "$actor" =~ ^[1-9][0-9]*$ ]]
          root=/tmp/qikvrt-review-admission-core-terminal
          if test "$EFFECTIVE_MODE" = PERSIST_NEW_OBSERVATION; then
          python3 -B - <<'PY'
          import json,pathlib
          from tools.qikvrt_review_admission_recovery import (
              build_shared_review_core_action_required_observation,
              build_shared_review_core_child_rerun_absence_observation,
              validate_shared_review_core_origin,
              validate_shared_review_core_rerun_preparation,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-core-terminal')
          selection=json.loads((root/'selection.json').read_text())
          origin=validate_shared_review_core_origin(
              selection.get('origin_authority')
          )
          recovery=selection.get('core_recovery_readback')
          inputs=json.loads(
              (root/'core-child-rerun-observation-inputs.json').read_text()
          )
          if inputs.get('selection_state') == (
              'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3'
          ):
              preparation=validate_shared_review_core_rerun_preparation(
                  recovery.get('preparation'),origin=origin
              )
              rebuilt=build_shared_review_core_child_rerun_absence_observation(
                  origin,preparation,
                  target_run=inputs['target_run'],
                  target_jobs_total=inputs['target_jobs_total'],
                  target_artifacts_total=inputs['target_artifacts_total'],
                  preparation_actor_run=inputs['preparation_actor_run'],
                  observation_started_at=inputs['observation_started_at'],
                  observation_completed_at=inputs['observation_completed_at'],
              )
          elif inputs.get('selection_state') == 'ACTION_REQUIRED_D0_3':
              rebuilt=build_shared_review_core_action_required_observation(
                  origin,target_run=inputs['target_run'],
                  target_jobs_total=inputs['target_jobs_total'],
                  target_artifacts_total=inputs['target_artifacts_total'],
                  admission_receipt=inputs['admission_receipt'],
                  current_main_sha=origin['intent']['payload']['main_head_sha'],
                  live_subject=inputs['live_subject'],
                  observation_started_at=inputs['observation_started_at'],
                  observation_completed_at=inputs['observation_completed_at'],
              )
          else:
              raise SystemExit('CORE_TERMINAL_OBSERVATION_STATE_DRIFT')
          observed=json.loads(
              (root/'core-child-rerun-observation.json').read_text()
          )
          if rebuilt != observed:
              raise SystemExit('CORE_CHILD_RERUN_OBSERVATION_BYTES_DRIFT')
          PY
          artifact_id="$(jq -er .id "$root/core-child-rerun-observation-artifact.json")"
          artifact_name="$(jq -er .name "$root/core-child-rerun-observation-artifact.json")"
          artifact_digest="$(jq -er .archive_sha256 "$root/core-child-rerun-observation-artifact.json")"
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/core-child-rerun-observation-receipt.json" \
              record-observation --lane "$CORE_LANE" \
              --sequence "$CORE_SEQUENCE" \
              --observation "$root/core-child-rerun-observation.json" \
              --producer "$root/core-child-rerun-observation-producer.json" \
              --artifact-id "$artifact_id" \
              --artifact-name "$artifact_name" \
              --artifact-digest "$artifact_digest" >/dev/null
          python3 -B - <<'PY'
          import json,pathlib
          from tools.qikvrt_review_admission_recovery import (
              build_shared_review_core_action_required_terminal_evidence,
              build_shared_review_core_child_rerun_terminal_evidence,
              validate_shared_review_core_origin,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-core-terminal')
          selection=json.loads((root/'selection.json').read_text())
          origin=validate_shared_review_core_origin(
              selection.get('origin_authority')
          )
          observation_receipt=json.loads(
              (root/'core-child-rerun-observation-receipt.json').read_text()
          )
          if selection.get('state') == 'ACTION_REQUIRED_D0_3':
              evidence=build_shared_review_core_action_required_terminal_evidence(
                  origin,observation_receipt
              )
          else:
              evidence=build_shared_review_core_child_rerun_terminal_evidence(
                  origin,observation_receipt
              )
          (root/'core-child-rerun-terminal-evidence.json').write_text(
              json.dumps(evidence,sort_keys=True,indent=2)+'\n'
          )
          PY
          elif test "$EFFECTIVE_MODE" != ADOPT_DURABLE_SHARED_CORE_TERMINAL; then
            echo 'SHARED_CORE_TERMINAL_EFFECT_MODE_INVALID' >&2
            exit 1
          fi
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/core-child-rerun-terminal-receipt.json" \
              terminalize --lane "$CORE_LANE" \
              --sequence "$CORE_SEQUENCE" \
              --evidence "$root/core-child-rerun-terminal-evidence.json" \
              >/dev/null
          unset token actor artifact_id artifact_name artifact_digest

      - name: Reobserve exact Shared-Core terminal with Auditor
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="${LEDGER_AUDITOR_TOKEN-}"
          actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$token"
          [[ "$actor" =~ ^[1-9][0-9]*$ ]]
          root=/tmp/qikvrt-review-admission-core-terminal
          fingerprint="$(jq -er .origin_authority.fingerprint "$root/selection.json")"
          QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/core-child-rerun-post-terminal-lookup.json" \
              lookup-fingerprint --lane "$CORE_LANE" \
              --fingerprint "$fingerprint" >/dev/null
          unset token actor fingerprint
          python3 -B - <<'PY'
          import json,pathlib
          from tools.qikvrt_review_admission_recovery import (
              validate_shared_review_core_action_required_terminal_readback,
              validate_shared_review_core_child_rerun_terminal_readback,
              validate_shared_review_core_origin,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-core-terminal')
          selection=json.loads((root/'selection.json').read_text())
          origin=validate_shared_review_core_origin(
              selection.get('origin_authority')
          )
          evidence=json.loads(
              (root/'core-child-rerun-terminal-evidence.json').read_text()
          )
          terminal_receipt=json.loads(
              (root/'core-child-rerun-terminal-receipt.json').read_text()
          )
          lookup=json.loads(
              (root/'core-child-rerun-post-terminal-lookup.json').read_text()
          )
          if selection.get('state') == 'ACTION_REQUIRED_D0_3':
              readback=(
                  validate_shared_review_core_action_required_terminal_readback(
                      origin,json.loads((root/'terminal.json').read_text()),
                      evidence,terminal_receipt,lookup,
                  )
              )
          else:
              readback=(
                  validate_shared_review_core_child_rerun_terminal_readback(
                      origin,evidence,terminal_receipt,lookup,
                  )
              )
          (root/'core-child-rerun-terminal-readback.json').write_text(
              json.dumps(readback,sort_keys=True,indent=2)+'\n'
          )
          PY

      - name: Name exact Shared-Core terminal readback artifact
        id: envelope
        shell: bash
        run: |
          echo "artifact_name=qikvrt-admission-core-terminal-${CORE_LANE}-${CORE_SEQUENCE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Preserve exact Shared-Core terminal readback chain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.envelope.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-terminal-mode.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-preterminal-lookup.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-observation.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-observation-producer.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-observation-receipt.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-terminal-evidence.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-terminal-receipt.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-post-terminal-lookup.json
            /tmp/qikvrt-review-admission-core-terminal/core-child-rerun-terminal-readback.json

  persist-admission-source:
    needs: [plan-one, terminalize-shared-core-child-rerun]
    if: >-
      always() &&
      needs.plan-one.result == 'success' &&
      needs.plan-one.outputs.state != 'EMPTY' &&
      ((needs.plan-one.outputs.state != 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3' &&
        needs.plan-one.outputs.state != 'ACTION_REQUIRED_D0_3') ||
       (needs.plan-one.outputs.source_kind != 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' &&
        needs.plan-one.outputs.source_kind != 'CORE_MESH_REVIEW_CHILD_ZERO_JOB') ||
       needs.terminalize-shared-core-child-rerun.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-admission-source-rerun
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    outputs:
      persisted: ${{ steps.persist.outputs.persisted }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-admission-source-rerun
      REPOSITORY: ${{ github.repository }}
      PLAN_ARTIFACT: ${{ needs.plan-one.outputs.artifact_name }}
      CORE_TERMINAL_ARTIFACT: ${{ needs.terminalize-shared-core-child-rerun.outputs.artifact_name }}
      PLAN_STATE: ${{ needs.plan-one.outputs.state }}
      SOURCE_KIND: ${{ needs.plan-one.outputs.source_kind }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact sealed recovery evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact source transition
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Download exact Shared-Core terminal readback chain
        if: >-
          (env.PLAN_STATE == 'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3' ||
           env.PLAN_STATE == 'ACTION_REQUIRED_D0_3') &&
          (env.SOURCE_KIND == 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' ||
           env.SOURCE_KIND == 'CORE_MESH_REVIEW_CHILD_ZERO_JOB')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.CORE_TERMINAL_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Persist source transition on the sharded FIFO before any rerun
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.parse
          from tools.qikvrt_review_admission_recovery import (
              admission_inbox_meta_path,
              admission_inbox_rerun_path,
              admission_inbox_slot_path,
              admission_inbox_terminal_path,
              build_recovery_ledger_effect_authority_readback,
              recovery_ledger_effect_authority_readback_path,
              validate_admission_inbox_continuation,
              validate_admission_signer_receipt_continuation,
              validate_admission_inbox_meta,
              validate_admission_inbox_slot,
              validate_recovery_intent,
              validate_recovery_producer_binding,
              validate_shared_review_core_action_required_terminal_readback,
              validate_shared_review_core_child_rerun_terminal_readback,
              validate_terminal_producer_binding,
              validate_terminal_receipt,
              verify_recovery_ledger_authority,
          )
          repo=os.environ['REPOSITORY']
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          selection=json.loads((root/'selection.json').read_text())
          slot=validate_admission_inbox_slot(json.loads((root/'inbox-slot.json').read_text()))
          sequence=selection.get('inbox_sequence')
          if (
              not isinstance(sequence,int)
              or sequence != slot['sequence']
              or selection.get('inbox_ledger_head') is None
          ):
              raise SystemExit('ADMISSION_INBOX_TRANSITION_SEQUENCE_DRIFT')

          def api(path,method='GET',payload=None,allow_404=False):
              command=['gh','api',path]
              if method != 'GET': command.extend(['--method',method])
              if payload is not None: command.extend(['--input','-'])
              result=subprocess.run(
                  command,input=(json.dumps(payload) if payload is not None else None),
                  text=True,capture_output=True,
              )
              if result.returncode != 0:
                  if allow_404 and 'HTTP 404' in result.stderr: return None
                  raise SystemExit('ADMISSION_INBOX_PERSIST_API_FAILED')
              return json.loads(result.stdout) if result.stdout.strip() else {}

          if (
              subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
                  != os.environ['SEALED_EVALUATOR']
              or api(f'repos/{repo}/commits/main').get('sha')
                  != os.environ['SEALED_EVALUATOR']
          ):
              raise SystemExit('ADMISSION_INBOX_PERSIST_MAIN_DRIFT')
          ref_short='qikvrt/review-admission-inbox-v1'
          ref_api=f'heads/{ref_short}'
          observed=api(f'repos/{repo}/git/ref/{ref_api}')
          head=observed.get('object',{}).get('sha')
          if head != selection['inbox_ledger_head']:
              raise SystemExit('ADMISSION_INBOX_PERSIST_CAS_HEAD_DRIFT')

          def read_json(path,validator=None):
              encoded_ref=urllib.parse.quote(head,safe='')
              encoded_path=urllib.parse.quote(path,safe='/')
              content=api(
                  f'repos/{repo}/contents/{encoded_path}?ref={encoded_ref}',
                  allow_404=True,
              )
              if content is None: return None
              value=json.loads(base64.b64decode(content['content']))
              return validator(value) if validator is not None else value

          meta=read_json(admission_inbox_meta_path(),validate_admission_inbox_meta)
          current_slot=read_json(
              admission_inbox_slot_path(sequence),validate_admission_inbox_slot
          )
          if meta['drain_sequence'] != sequence or current_slot != slot:
              raise SystemExit('ADMISSION_INBOX_PERSIST_SLOT_DRIFT')
          selected=selection.get('selected') or {}
          source=slot['source']['source']
          if (
              selected.get('run_id') != source['run_id']
              or selected.get('workflow_id') != source['workflow_id']
          ):
              raise SystemExit('ADMISSION_INBOX_PERSIST_SOURCE_DRIFT')

          updates={}
          state=selection['state']
          if state == 'RERUN_ATTEMPT_2':
              intent=validate_recovery_intent(json.loads((root/'intent.json').read_text()))
              binding=validate_recovery_producer_binding(
                  intent,json.loads((root/'producer-binding.json').read_text())
              )
              record={
                  'schema':'qikvrt_review_admission_inbox_child_rerun_v1',
                  'sequence':sequence,
                  'source_fingerprint':slot['source_fingerprint'],
                  'source_sha256':slot['source_sha256'],
                  'intent':intent,
                  'producer_binding':binding,
                  'state':'PRE_EFFECT_REOBSERVED',
                  'authority_boundary':'RECOVERY_ONLY',
                  'productive_effect':False,
              }
              path=admission_inbox_rerun_path(sequence)
              existing=read_json(path)
              if existing not in (None,record):
                  raise SystemExit('ADMISSION_INBOX_RERUN_IMMUTABLE_COLLISION')
              if existing is None: updates[path]=record
          elif state in {
              'ACTION_REQUIRED_D0_3',
              'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3',
              'RETRY_EXHAUSTED_D0_3','LIVE_SUBJECT_DRIFT_D0_3',
              'SUPERSEDED_EVALUATOR_D0_3',
              'SIGNER_RECEIPT_RECOVERY_EXHAUSTED_D0_3',
          }:
              receipt=validate_terminal_receipt(json.loads((root/'terminal.json').read_text()))
              binding=validate_terminal_producer_binding(
                  receipt,json.loads((root/'terminal-producer-binding.json').read_text())
              )
              terminal={
                  'schema':'qikvrt_review_admission_inbox_terminal_v1',
                  'sequence':sequence,
                  'source_fingerprint':slot['source_fingerprint'],
                  'source_sha256':slot['source_sha256'],
                  'receipt':receipt,
                  'producer_binding':binding,
                  'state':'TERMINAL',
                  'authority_boundary':'RECOVERY_ONLY',
                  'productive_effect':False,
              }
              if (
                  state in {
                      'RERUN_TRANSPORT_UNACKNOWLEDGED_D0_3',
                      'ACTION_REQUIRED_D0_3',
                  }
                  and selection.get('source_kind') in {
                      'CORE_EXACT_REVIEW_CHILD_ZERO_JOB',
                      'CORE_MESH_REVIEW_CHILD_ZERO_JOB',
                  }
              ):
                  core_evidence=json.loads(
                      (root/'core-child-rerun-terminal-evidence.json').read_text()
                  )
                  core_receipt=json.loads(
                      (root/'core-child-rerun-terminal-receipt.json').read_text()
                  )
                  core_lookup=json.loads(
                      (root/'core-child-rerun-post-terminal-lookup.json').read_text()
                  )
                  if state == 'ACTION_REQUIRED_D0_3':
                      exact_core_readback=(
                          validate_shared_review_core_action_required_terminal_readback(
                              selection.get('origin_authority'),receipt,
                              core_evidence,core_receipt,core_lookup,
                          )
                      )
                  else:
                      exact_core_readback=(
                          validate_shared_review_core_child_rerun_terminal_readback(
                              selection.get('origin_authority'),core_evidence,
                              core_receipt,core_lookup,
                          )
                      )
                  stored_core_readback=json.loads(
                      (root/'core-child-rerun-terminal-readback.json').read_text()
                  )
                  if stored_core_readback != exact_core_readback:
                      raise SystemExit('ADMISSION_INBOX_CORE_TERMINAL_READBACK_DRIFT')
                  terminal['shared_core_terminal_readback']=exact_core_readback
              path=admission_inbox_terminal_path(sequence)
              existing=read_json(path)
              if existing not in (None,terminal):
                  raise SystemExit('ADMISSION_INBOX_TERMINAL_IMMUTABLE_COLLISION')
              if existing is None: updates[path]=terminal
              meta_after=dict(meta)
              meta_after['drain_sequence']=sequence+1
              updates[admission_inbox_meta_path()]=meta_after
          elif state == 'TECHNICAL_CONTINUATION_D0_2':
              receipt=validate_admission_inbox_continuation(
                  json.loads((root/'continuation.json').read_text()),slot
              )
              terminal={
                  'schema':'qikvrt_review_admission_inbox_terminal_v1',
                  'sequence':sequence,
                  'source_fingerprint':slot['source_fingerprint'],
                  'source_sha256':slot['source_sha256'],
                  'receipt':receipt,
                  'terminalizer_workflow_sha':os.environ['SEALED_EVALUATOR'],
                  'terminalizer_run_id':int(os.environ['GITHUB_RUN_ID']),
                  'terminalizer_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'state':'TERMINAL',
                  'authority_boundary':'RECOVERY_ONLY',
                  'productive_effect':False,
              }
              path=admission_inbox_terminal_path(sequence)
              existing=read_json(path)
              if existing not in (None,terminal):
                  raise SystemExit('ADMISSION_INBOX_CONTINUATION_COLLISION')
              if existing is None: updates[path]=terminal
              meta_after=dict(meta)
              meta_after['drain_sequence']=sequence+1
              updates[admission_inbox_meta_path()]=meta_after
          elif state == 'SIGNER_RECEIPT_CONTINUATION_D0_2':
              receipt=validate_admission_signer_receipt_continuation(
                  json.loads(
                      (root/'signer-continuation.json').read_text()
                  ),slot
              )
              terminal={
                  'schema':'qikvrt_review_admission_inbox_terminal_v1',
                  'sequence':sequence,
                  'source_fingerprint':slot['source_fingerprint'],
                  'source_sha256':slot['source_sha256'],
                  'receipt':receipt,
                  'terminalizer_workflow_sha':os.environ['SEALED_EVALUATOR'],
                  'terminalizer_run_id':int(os.environ['GITHUB_RUN_ID']),
                  'terminalizer_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'state':'TERMINAL',
                  'authority_boundary':'RECOVERY_ONLY',
                  'productive_effect':False,
              }
              path=admission_inbox_terminal_path(sequence)
              existing=read_json(path)
              if existing not in (None,terminal):
                  raise SystemExit('ADMISSION_INBOX_SIGNER_CONTINUATION_COLLISION')
              if existing is None: updates[path]=terminal
              meta_after=dict(meta)
              meta_after['drain_sequence']=sequence+1
              updates[admission_inbox_meta_path()]=meta_after
          else:
              raise SystemExit('ADMISSION_INBOX_PERSIST_STATE_INVALID')

          if updates:
              actor=os.environ.get('EXPECTED_LEDGER_WRITER_ACTOR_ID','')
              current_effect=api(
                  f"repos/{repo}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
              )
              if (
                  not actor.isdigit() or int(actor) < 1
                  or current_effect.get('head_sha') != os.environ['SEALED_EVALUATOR']
                  or not isinstance(current_effect.get('run_started_at'),str)
              ):
                  raise SystemExit('RECOVERY_LEDGER_EFFECT_AUTHORITY_DRIFT')
              authority=verify_recovery_ledger_authority(
                  lane='admission-source-rerun',repository=repo,
                  writer_actor_id=int(actor),
                  writer_group=os.environ.get('QIKVRT_OUTBOX_WRITER_GROUP',''),
                  api=lambda path: api(path),
              )
              effect_authority=build_recovery_ledger_effect_authority_readback(
                  authority,lane='admission-source-rerun',
                  evaluator_sha=os.environ['SEALED_EVALUATOR'],
                  effect_run_id=int(os.environ['GITHUB_RUN_ID']),
                  effect_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                  effect_run_started_at=current_effect['run_started_at'],
              )
              updates[recovery_ledger_effect_authority_readback_path(
                  effect_authority,lane='admission-source-rerun'
              )]=effect_authority
              commit=api(f'repos/{repo}/git/commits/{head}')
              entries=[]
              for path,value in sorted(updates.items()):
                  blob=api(
                      f'repos/{repo}/git/blobs','POST',
                      {'content':base64.b64encode(
                          (json.dumps(value,sort_keys=True,indent=2)+'\n').encode()
                      ).decode(),'encoding':'base64'},
                  )
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
              tree=api(
                  f'repos/{repo}/git/trees','POST',
                  {'base_tree':commit['tree']['sha'],'tree':entries},
              )
              successor=api(
                  f'repos/{repo}/git/commits','POST',
                  {'message':f'Persist review admission source {sequence} {state}',
                   'tree':tree['sha'],'parents':[head]},
              )
              api(
                  f'repos/{repo}/git/refs/{ref_api}','PATCH',
                  {'sha':successor['sha'],'force':False},
              )
              readback_ref=api(f'repos/{repo}/git/ref/{ref_api}')
              readback_commit=api(
                  f"repos/{repo}/git/commits/{successor['sha']}"
              )
              if (
                  readback_ref.get('object',{}).get('sha') != successor['sha']
                  or readback_commit.get('tree',{}).get('sha') != tree['sha']
                  or [item.get('sha') for item in readback_commit.get('parents',[])]
                      != [head]
              ):
                  raise SystemExit('ADMISSION_INBOX_PERSIST_CAS_READBACK_DRIFT')
              encoded_successor=urllib.parse.quote(successor['sha'],safe='')
              for item_path,item_value in updates.items():
                  encoded_path=urllib.parse.quote(item_path,safe='/')
                  content=api(
                      f'repos/{repo}/contents/{encoded_path}?ref={encoded_successor}'
                  )
                  if (
                      content.get('type') != 'file'
                      or content.get('encoding') != 'base64'
                      or json.loads(base64.b64decode(content['content']))
                          != item_value
                  ):
                      raise SystemExit(
                          'ADMISSION_INBOX_PERSIST_FILE_READBACK_DRIFT'
                      )
          print('persisted=true',file=open(os.environ['GITHUB_OUTPUT'],'a'))
          PY

  prepare-shared-core-child-rerun:
    needs: [plan-one, persist-admission-source]
    if: >-
      needs.plan-one.outputs.rerun == 'true' &&
      needs.persist-admission-source.outputs.persisted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-${{ needs.plan-one.outputs.core_lane || 'not-applicable' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.envelope.outputs.artifact_name }}
    env:
      REPOSITORY: ${{ github.repository }}
      SOURCE_KIND: ${{ needs.plan-one.outputs.source_kind }}
      SOURCE_RUN_ID: ${{ needs.plan-one.outputs.source_run_id }}
      CORE_LANE: ${{ needs.plan-one.outputs.core_lane }}
      CORE_SEQUENCE: ${{ needs.plan-one.outputs.core_sequence }}
      CORE_TRANSPORT_ATTEMPT: ${{ needs.plan-one.outputs.core_transport_attempt }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-${{ needs.plan-one.outputs.core_lane || 'not-applicable' }}
      PLAN_ARTIFACT: ${{ needs.plan-one.outputs.artifact_name }}
    steps:
      - name: Check out the exact sealed Shared-Core writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact admission rerun intent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Build exact Shared-Core child-rerun retry evidence
        id: core_mode
        if: >-
          env.SOURCE_KIND == 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' ||
          env.SOURCE_KIND == 'CORE_MESH_REVIEW_CHILD_ZERO_JOB'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json,pathlib
          from tools.qikvrt_review_admission_recovery import (
              build_shared_review_core_retry_evidence,
              validate_recovery_intent,
              validate_shared_review_core_rerun_preparation,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          intent=validate_recovery_intent(json.loads(
              (root/'intent.json').read_text()
          ))
          selection=json.loads((root/'selection.json').read_text())
          recovery=selection.get('core_recovery_readback')
          if isinstance(recovery,dict) and recovery.get('state') in {
              'PREPARED','ACCEPTED',
          }:
              preparation=recovery.get('preparation')
              validate_shared_review_core_rerun_preparation(
                  preparation,origin=intent['origin_authority']
              )
              (root/'core-rerun-preparation.json').write_text(
                  json.dumps(preparation,sort_keys=True,indent=2)+'\n'
              )
              print('mutate=false',file=open(
                  __import__('os').environ['GITHUB_OUTPUT'],'a'
              ))
              raise SystemExit(0)
          evidence=build_shared_review_core_retry_evidence(
              intent['origin_authority'],source=intent['source']
          )
          (root/'core-retry-evidence.json').write_text(
              json.dumps(evidence,sort_keys=True,indent=2)+'\n'
          )
          print('mutate=true',file=open(
              __import__('os').environ['GITHUB_OUTPUT'],'a'
          ))
          PY

      - name: Prepare child rerun on the sole Shared-Core sequence
        if: steps.core_mode.outputs.mutate == 'true'
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="${LEDGER_WRITER_TOKEN-}"
          actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$token"
          [[ "$actor" =~ ^[1-9][0-9]*$ ]]
          root=/tmp/qikvrt-review-admission-recovery
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/core-rerun-preparation.json" \
              prepare-child-rerun --lane "$CORE_LANE" \
              --sequence "$CORE_SEQUENCE" \
              --transport-attempt "$CORE_TRANSPORT_ATTEMPT" \
              --retry-evidence "$root/core-retry-evidence.json" \
              --actor-run-id "$GITHUB_RUN_ID" \
              --actor-run-attempt "$GITHUB_RUN_ATTEMPT" >/dev/null
          unset token actor

      - name: Reobserve the exact persisted Shared-Core preparation with Auditor
        if: >-
          env.SOURCE_KIND == 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' ||
          env.SOURCE_KIND == 'CORE_MESH_REVIEW_CHILD_ZERO_JOB'
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="${LEDGER_AUDITOR_TOKEN-}"
          actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$token"
          [[ "$actor" =~ ^[1-9][0-9]*$ ]]
          root=/tmp/qikvrt-review-admission-recovery
          fingerprint="$(jq -er .origin_authority.fingerprint "$root/intent.json")"
          QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/core-post-prepare-lookup.json" \
              lookup-fingerprint --lane "$CORE_LANE" \
              --fingerprint "$fingerprint" >/dev/null
          unset token actor
          python3 -B - <<'PY'
          import json,pathlib
          from tools.qikvrt_review_admission_recovery import (
              reobserve_shared_review_core_child_recovery,
              validate_recovery_intent,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          intent=validate_recovery_intent(json.loads(
              (root/'intent.json').read_text()
          ))
          observed=reobserve_shared_review_core_child_recovery(
              json.loads((root/'core-post-prepare-lookup.json').read_text()),
              origin=intent['origin_authority'],
          )
          if observed['state'] not in {'PREPARED','ACCEPTED'}:
              raise SystemExit('SHARED_CORE_PREPARATION_DURABLE_READBACK_MISSING')
          (root/'core-rerun-preparation.json').write_text(
              json.dumps(observed['preparation'],sort_keys=True,indent=2)+'\n'
          )
          PY

      - name: Validate exact Shared-Core rerun preparation receipt
        if: >-
          env.SOURCE_KIND == 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' ||
          env.SOURCE_KIND == 'CORE_MESH_REVIEW_CHILD_ZERO_JOB'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json,pathlib
          from tools.qikvrt_review_admission_recovery import (
              validate_recovery_intent,
              validate_shared_review_core_rerun_preparation,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          intent=validate_recovery_intent(json.loads(
              (root/'intent.json').read_text()
          ))
          validate_shared_review_core_rerun_preparation(
              json.loads((root/'core-rerun-preparation.json').read_text()),
              origin=intent['origin_authority'],
          )
          PY

      - name: Seal non-Core recovery boundary
        if: >-
          env.SOURCE_KIND != 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' &&
          env.SOURCE_KIND != 'CORE_MESH_REVIEW_CHILD_ZERO_JOB'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-review-admission-recovery
          jq -n '{schema:"qikvrt_review_admission_core_prepare_v1",state:"NOT_APPLICABLE"}' \
            > /tmp/qikvrt-review-admission-recovery/core-rerun-preparation.json

      - name: Name exact Shared-Core preparation artifact
        id: envelope
        shell: bash
        run: |
          echo "artifact_name=qikvrt-admission-core-prepare-${SOURCE_RUN_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Preserve exact Shared-Core preparation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.envelope.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            /tmp/qikvrt-review-admission-recovery/core-rerun-preparation.json
            /tmp/qikvrt-review-admission-recovery/core-retry-evidence.json

  rerun-one:
    needs: [plan-one, persist-admission-source, prepare-shared-core-child-rerun]
    if: >-
      needs.plan-one.outputs.rerun == 'true' &&
      needs.persist-admission-source.outputs.persisted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_KIND: ${{ needs.plan-one.outputs.source_kind }}
      SOURCE_RUN_ID: ${{ needs.plan-one.outputs.source_run_id }}
      INBOX_SEQUENCE: ${{ needs.plan-one.outputs.inbox_sequence }}
      PLAN_ARTIFACT: ${{ needs.plan-one.outputs.artifact_name }}
      CORE_PREP_ARTIFACT: ${{ needs.prepare-shared-core-child-rerun.outputs.artifact_name }}
    steps:
      - name: Check out current trusted recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact recovery intent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Download exact Shared-Core rerun preparation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.CORE_PREP_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Revalidate and rerun the same exact source as attempt 2
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-review-admission-recovery
          ledger_head="$(gh api "repos/${REPOSITORY}/git/ref/heads/qikvrt/review-admission-inbox-v1" --jq '.object.sha')"
          gh api \
            "repos/${REPOSITORY}/contents/.qikvrt/recovery/admission-source-rerun/child-rerun/$(printf '%020d' "${INBOX_SEQUENCE}").json?ref=${ledger_head}" \
            --jq '.content' | tr -d '\n' | base64 --decode \
            > "$root/durable-child-rerun.json"
          gh api "repos/${REPOSITORY}/commits/main" \
            > "$root/pre-effect-main.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=all&per_page=100" \
            > "$root/pre-effect-job-pages.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            > "$root/pre-effect-artifact-pages.json"
          pr_number="$(python3 -B -c 'import json; print((json.load(open("/tmp/qikvrt-review-admission-recovery/intent.json")).get("live_subject") or {}).get("pr_number") or "")')"
          if test -z "$pr_number"; then
            pr_number="$(python3 -B -c 'import json; v=json.load(open("/tmp/qikvrt-review-admission-recovery/intent.json")); print(((v.get("origin_authority") or {}).get("subject") or {}).get("pr_number") or "")')"
          fi
          if test -z "$pr_number"; then
            pr_number="$(python3 -B -c 'import json; v=json.load(open("/tmp/qikvrt-review-admission-recovery/intent.json")); print((((v.get("origin_authority") or {}).get("intent") or {}).get("payload") or {}).get("subject",{}).get("pull_request") or "")')"
          fi
          if test -n "$pr_number"; then
            gh api "repos/${REPOSITORY}/pulls/${pr_number}" \
              > "$root/pre-effect-pr.json"
            head_sha="$(python3 -B -c 'import json; print(json.load(open("/tmp/qikvrt-review-admission-recovery/pre-effect-pr.json"))["head"]["sha"])')"
            base_sha="$(python3 -B -c 'import json; print(json.load(open("/tmp/qikvrt-review-admission-recovery/pre-effect-pr.json"))["base"]["sha"])')"
            gh api "repos/${REPOSITORY}/commits/${head_sha}" \
              > "$root/pre-effect-head-commit.json"
            gh api "repos/${REPOSITORY}/commits/${base_sha}" \
              > "$root/pre-effect-base-commit.json"
          fi
          source_kind="$(python3 -B -c 'import json; print(json.load(open("/tmp/qikvrt-review-admission-recovery/intent.json")).get("source_kind") or "")')"
          if test "$source_kind" = DELEGATED_SIGNER_RECEIPT_RECOVERY; then
            gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${pr_number}/reviews?per_page=100" \
              > "$root/pre-effect-signer-review-pages.json"
          fi
          # This exact source-attempt re-fetch is the final network read before
          # the local fail-closed plan and the one authorized rerun POST.
          gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > "$root/pre-effect-source.json"
          python3 -B - <<'PY' > "$root/effect-plan.json"
          import json, os, pathlib
          from tools.qikvrt_review_admission_recovery import (
              build_delegated_signer_receipt_recovery_evidence,
              plan_shared_review_core_attempt_two_adoption,
              plan_recovery_effect, validate_recovery_intent,
              validate_recovery_producer_binding,
              validate_shared_review_core_rerun_preparation,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          intent=json.loads((root/'intent.json').read_text())
          binding=json.loads((root/'producer-binding.json').read_text())
          exact_binding=validate_recovery_producer_binding(intent,binding)
          durable=json.loads((root/'durable-child-rerun.json').read_text())
          if (
              durable.get('schema') != 'qikvrt_review_admission_inbox_child_rerun_v1'
              or durable.get('sequence') != int(os.environ['INBOX_SEQUENCE'])
              or validate_recovery_intent(durable.get('intent')) != intent
              or validate_recovery_producer_binding(
                  intent,durable.get('producer_binding')
              ) != exact_binding
              or durable.get('state') != 'PRE_EFFECT_REOBSERVED'
              or durable.get('productive_effect') is not False
          ):
              raise SystemExit('ADMISSION_INBOX_DURABLE_RERUN_DRIFT')
          def count(path,key):
              pages=json.loads((root/path).read_text())
              values=[]
              totals=set()
              for page in pages:
                  if not isinstance(page,dict) or not isinstance(page.get(key),list):
                      raise SystemExit('RECOVERY_PRE_EFFECT_PAGE_INVALID')
                  if isinstance(page.get('total_count'),int): totals.add(page['total_count'])
                  values.extend(page[key])
              if len(totals)!=1 or next(iter(totals))!=len(values):
                  raise SystemExit('RECOVERY_PRE_EFFECT_PAGE_INCOMPLETE')
              return len(values)
          signer_evidence=None
          if intent.get('source_kind') == 'DELEGATED_SIGNER_RECEIPT_RECOVERY':
              review_pages=json.loads(
                  (root/'pre-effect-signer-review-pages.json').read_text()
              )
              reviews=[]
              for page in review_pages:
                  if not isinstance(page,list):
                      raise SystemExit('SIGNER_RECOVERY_REVIEW_PAGE_INVALID')
                  reviews.extend(page)
              artifact_pages=json.loads(
                  (root/'pre-effect-artifact-pages.json').read_text()
              )
              artifacts=[]
              for page in artifact_pages:
                  if not isinstance(page,dict) or not isinstance(page.get('artifacts'),list):
                      raise SystemExit('SIGNER_RECOVERY_ARTIFACT_PAGE_INVALID')
                  artifacts.extend(page['artifacts'])
              plan=intent['origin_authority']['plan']
              exact_receipt_prefix=(
                  f"qikvrt-native-review-signer-receipt-{plan['reviewer']}-"
                  f"pr-{plan['pr_number']}-head-{plan['head_sha']}-"
                  f"run-{plan['signer_run_id']}-attempt-"
              )
              if any(
                  isinstance(item.get('name'),str)
                  and item['name'].startswith(exact_receipt_prefix)
                  and item.get('expired') is not True
                  for item in artifacts if isinstance(item,dict)
              ):
                  raise SystemExit('SIGNER_RECOVERY_RECEIPT_ARTIFACT_NOW_PRESENT')
              pr=json.loads((root/'pre-effect-pr.json').read_text())
              raw_commit=json.loads(
                  (root/'pre-effect-head-commit.json').read_text()
              )
              signer_evidence=build_delegated_signer_receipt_recovery_evidence(
                  plan=plan,
                  run=json.loads((root/'pre-effect-source.json').read_text()),
                  repository=os.environ['REPOSITORY'],
                  current_main_sha=json.loads(
                      (root/'pre-effect-main.json').read_text()
                  )['sha'],
                  pr=pr,
                  head_commit={
                      'sha':raw_commit.get('sha'),
                      'tree':raw_commit.get('commit',{}).get('tree'),
                  },
                  reviews=reviews,
                  jobs_total=count('pre-effect-job-pages.json','jobs'),
                  artifacts_total=count(
                      'pre-effect-artifact-pages.json','artifacts'
                  ),
                  signer_receipt_blocker=(
                      'SIGNER_RECEIPT_ARTIFACT_MISSING_OR_AMBIGUOUS'
                  ),
                  artifact_inventory_sha256=__import__('hashlib').sha256(
                      json.dumps(artifacts,sort_keys=True,
                          separators=(',',':')).encode()
                  ).hexdigest(),
              )
          core_preparation=None
          if intent.get('source_kind') in {
              'CORE_EXACT_REVIEW_CHILD_ZERO_JOB',
              'CORE_MESH_REVIEW_CHILD_ZERO_JOB',
          }:
              core_preparation=validate_shared_review_core_rerun_preparation(
                  json.loads((root/'core-rerun-preparation.json').read_text()),
                  origin=intent['origin_authority'],
              )
          source_run=json.loads((root/'pre-effect-source.json').read_text())
          current_main=json.loads((root/'pre-effect-main.json').read_text())['sha']
          live_subject=(
              {
                  'pr_number':json.loads((root/'pre-effect-pr.json').read_text())['number'],
                  'head_sha':json.loads((root/'pre-effect-pr.json').read_text())['head']['sha'],
                  'head_tree_sha':json.loads((root/'pre-effect-head-commit.json').read_text())['commit']['tree']['sha'],
                  'head_repository':json.loads((root/'pre-effect-pr.json').read_text())['head']['repo']['full_name'],
                  'head_ref':json.loads((root/'pre-effect-pr.json').read_text())['head']['ref'],
                  'base_sha':json.loads((root/'pre-effect-pr.json').read_text())['base']['sha'],
                  'base_tree_sha':json.loads((root/'pre-effect-base-commit.json').read_text())['commit']['tree']['sha'],
                  'base_repository':json.loads((root/'pre-effect-pr.json').read_text())['base']['repo']['full_name'],
                  'base_ref':json.loads((root/'pre-effect-pr.json').read_text())['base']['ref'],
              }
              if 'live_subject' in intent else None
          )
          if (
              intent.get('source_kind') in {
                  'CORE_EXACT_REVIEW_CHILD_ZERO_JOB',
                  'CORE_MESH_REVIEW_CHILD_ZERO_JOB',
              }
              and source_run.get('run_attempt') == 2
          ):
              selection=json.loads((root/'selection.json').read_text())
              recovery=selection.get('core_recovery_readback') or {}
              effect=plan_shared_review_core_attempt_two_adoption(
                  intent,child_run=source_run,current_main_sha=current_main,
                  live_subject=live_subject,core_preparation=core_preparation,
                  core_acceptance=recovery.get('acceptance'),
              )
          else:
              effect=plan_recovery_effect(
                  intent,source_run=source_run,
                  source_jobs_total=count('pre-effect-job-pages.json','jobs'),
                  source_artifacts_total=count(
                      'pre-effect-artifact-pages.json','artifacts'
                  ),
                  current_main_sha=current_main,live_subject=live_subject,
                  current_signer_recovery_evidence=signer_evidence,
                  current_shared_review_core_preparation=core_preparation,
                  current_recovery_producer_binding=exact_binding,
                  current_recovery_run_id=int(os.environ['GITHUB_RUN_ID']),
                  current_recovery_run_attempt=int(
                      os.environ['GITHUB_RUN_ATTEMPT']
                  ),
              )
          print(json.dumps(effect,sort_keys=True,indent=2))
          PY
          cat "$root/effect-plan.json"
          if test "$(jq -r .effect "$root/effect-plan.json")" = \
            ADOPT_EXISTING_SAME_RUN_ATTEMPT_2; then
            cp "$root/pre-effect-source.json" "$root/attempt-2.json"
          else
            if test "$(jq -r .new_rerun_post_authorized "$root/effect-plan.json")" = true; then
              gh api --method POST \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/rerun"
            elif test "$(jq -r .effect "$root/effect-plan.json")" != \
              POLL_ONLY_CONSUMED_SAME_RUN_ATTEMPT_2; then
              exit 1
            fi
            for attempt in $(seq 1 20); do
              gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
                > "$root/attempt-2.json"
              if test "$(python3 -B -c 'import json; print(json.load(open("/tmp/qikvrt-review-admission-recovery/attempt-2.json")).get("run_attempt",0))')" -eq 2; then
                break
              fi
              sleep 2
            done
          fi
          python3 -B - <<'PY' > "$root/rerun-readback.json"
          import json, pathlib
          from tools.qikvrt_review_admission_recovery import verify_rerun_readback
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          value=verify_rerun_readback(
              json.loads((root/'intent.json').read_text()),
              json.loads((root/'attempt-2.json').read_text()),
          )
          print(json.dumps(value,sort_keys=True,indent=2))
          PY
          cat "$root/rerun-readback.json"

      - name: Preserve exact attempt-2 transport readback
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-admission-rerun-readback-${{ needs.plan-one.outputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/qikvrt-review-admission-recovery/rerun-readback.json
            /tmp/qikvrt-review-admission-recovery/attempt-2.json

  accept-shared-core-child-rerun:
    needs: [plan-one, rerun-one, prepare-shared-core-child-rerun]
    if: needs.rerun-one.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-${{ needs.plan-one.outputs.core_lane || 'not-applicable' }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.envelope.outputs.artifact_name }}
    env:
      REPOSITORY: ${{ github.repository }}
      SOURCE_KIND: ${{ needs.plan-one.outputs.source_kind }}
      SOURCE_RUN_ID: ${{ needs.plan-one.outputs.source_run_id }}
      CORE_LANE: ${{ needs.plan-one.outputs.core_lane }}
      CORE_SEQUENCE: ${{ needs.plan-one.outputs.core_sequence }}
      CORE_TRANSPORT_ATTEMPT: ${{ needs.plan-one.outputs.core_transport_attempt }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-${{ needs.plan-one.outputs.core_lane || 'not-applicable' }}
      PLAN_ARTIFACT: ${{ needs.plan-one.outputs.artifact_name }}
      PREP_ARTIFACT: ${{ needs.prepare-shared-core-child-rerun.outputs.artifact_name }}
      READBACK_ARTIFACT: qikvrt-admission-rerun-readback-${{ needs.plan-one.outputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the exact sealed Shared-Core writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact admission intent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Download exact Shared-Core preparation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PREP_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Download exact attempt-two transport readback
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.READBACK_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Assemble exact same-run attempt-two child
        id: accept_mode
        if: >-
          env.SOURCE_KIND == 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' ||
          env.SOURCE_KIND == 'CORE_MESH_REVIEW_CHILD_ZERO_JOB'
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-review-admission-recovery
          mkdir -p "$root"
          python3 -B - <<'PY'
          import json,pathlib
          from tools.qikvrt_review_admission_recovery import (
              validate_recovery_intent,
              validate_shared_review_core_rerun_acceptance,
              validate_shared_review_core_rerun_preparation,
              verify_rerun_readback,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          intent=validate_recovery_intent(json.loads(
              (root/'intent.json').read_text()
          ))
          validate_shared_review_core_rerun_preparation(
              json.loads((root/'core-rerun-preparation.json').read_text()),
              origin=intent['origin_authority'],
          )
          raw=json.loads((root/'attempt-2.json').read_text())
          verify_rerun_readback(intent,raw)
          repo=raw.get('repository')
          child={
              'run_id':raw.get('id'),
              'run_attempt':raw.get('run_attempt'),
              'workflow_id':raw.get('workflow_id'),
              'workflow_path':raw.get('path'),
              'event':raw.get('event'),
              'repository':repo.get('full_name') if isinstance(repo,dict) else None,
              'head_sha':raw.get('head_sha'),
              'status':raw.get('status'),
              'conclusion':raw.get('conclusion'),
              'display_title':raw.get('display_title'),
          }
          (root/'core-attempt-2-child.json').write_text(
              json.dumps(child,sort_keys=True,indent=2)+'\n'
          )
          selection=json.loads((root/'selection.json').read_text())
          recovery=selection.get('core_recovery_readback') or {}
          acceptance=recovery.get('acceptance')
          if acceptance is not None:
              validate_shared_review_core_rerun_acceptance(
                  acceptance,origin=intent['origin_authority'],child_run=raw
              )
              (root/'core-rerun-acceptance.json').write_text(
                  json.dumps(acceptance,sort_keys=True,indent=2)+'\n'
              )
              print('mutate=false',file=open(
                  __import__('os').environ['GITHUB_OUTPUT'],'a'
              ))
          else:
              print('mutate=true',file=open(
                  __import__('os').environ['GITHUB_OUTPUT'],'a'
              ))
          PY

      - name: Accept same-run attempt two on the sole Shared-Core sequence
        if: steps.accept_mode.outputs.mutate == 'true'
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="${LEDGER_WRITER_TOKEN-}"
          actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$token"
          [[ "$actor" =~ ^[1-9][0-9]*$ ]]
          root=/tmp/qikvrt-review-admission-recovery
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/core-rerun-acceptance.json" \
              accept-child-rerun --lane "$CORE_LANE" \
              --sequence "$CORE_SEQUENCE" \
              --transport-attempt "$CORE_TRANSPORT_ATTEMPT" \
              --child "$root/core-attempt-2-child.json" >/dev/null
          unset token actor

      - name: Reobserve the exact persisted Shared-Core acceptance with Auditor
        if: >-
          env.SOURCE_KIND == 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' ||
          env.SOURCE_KIND == 'CORE_MESH_REVIEW_CHILD_ZERO_JOB'
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="${LEDGER_AUDITOR_TOKEN-}"
          actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$token"
          [[ "$actor" =~ ^[1-9][0-9]*$ ]]
          root=/tmp/qikvrt-review-admission-recovery
          fingerprint="$(jq -er .origin_authority.fingerprint "$root/intent.json")"
          QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/core-post-accept-lookup.json" \
              lookup-fingerprint --lane "$CORE_LANE" \
              --fingerprint "$fingerprint" >/dev/null
          unset token actor
          python3 -B - <<'PY'
          import json,pathlib
          from tools.qikvrt_review_admission_recovery import (
              reobserve_shared_review_core_child_recovery,
              validate_recovery_intent,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          intent=validate_recovery_intent(json.loads(
              (root/'intent.json').read_text()
          ))
          observed=reobserve_shared_review_core_child_recovery(
              json.loads((root/'core-post-accept-lookup.json').read_text()),
              origin=intent['origin_authority'],
          )
          if observed['state'] != 'ACCEPTED':
              raise SystemExit('SHARED_CORE_ACCEPTANCE_DURABLE_READBACK_MISSING')
          (root/'core-rerun-acceptance.json').write_text(
              json.dumps(observed['acceptance'],sort_keys=True,indent=2)+'\n'
          )
          PY

      - name: Validate exact Shared-Core same-run acceptance receipt
        if: >-
          env.SOURCE_KIND == 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' ||
          env.SOURCE_KIND == 'CORE_MESH_REVIEW_CHILD_ZERO_JOB'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json,pathlib
          from tools.qikvrt_review_admission_recovery import (
              validate_recovery_intent,
              validate_shared_review_core_rerun_acceptance,
          )
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          intent=validate_recovery_intent(json.loads(
              (root/'intent.json').read_text()
          ))
          validate_shared_review_core_rerun_acceptance(
              json.loads((root/'core-rerun-acceptance.json').read_text()),
              origin=intent['origin_authority'],
              child_run=json.loads((root/'attempt-2.json').read_text()),
          )
          PY

      - name: Seal non-Core acceptance boundary
        if: >-
          env.SOURCE_KIND != 'CORE_EXACT_REVIEW_CHILD_ZERO_JOB' &&
          env.SOURCE_KIND != 'CORE_MESH_REVIEW_CHILD_ZERO_JOB'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-review-admission-recovery
          jq -n '{schema:"qikvrt_review_admission_core_acceptance_v1",state:"NOT_APPLICABLE"}' \
            > /tmp/qikvrt-review-admission-recovery/core-rerun-acceptance.json

      - name: Name exact Shared-Core acceptance artifact
        id: envelope
        shell: bash
        run: |
          echo "artifact_name=qikvrt-admission-core-accept-${SOURCE_RUN_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Preserve exact Shared-Core same-run acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.envelope.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            /tmp/qikvrt-review-admission-recovery/core-rerun-acceptance.json
            /tmp/qikvrt-review-admission-recovery/core-attempt-2-child.json

  persist-admission-rerun-readback:
    needs: [plan-one, rerun-one, prepare-shared-core-child-rerun, accept-shared-core-child-rerun]
    if: needs.accept-shared-core-child-rerun.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-admission-source-rerun
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-admission-source-rerun
      REPOSITORY: ${{ github.repository }}
      INBOX_SEQUENCE: ${{ needs.plan-one.outputs.inbox_sequence }}
      READBACK_ARTIFACT: qikvrt-admission-rerun-readback-${{ needs.plan-one.outputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      CORE_PREP_ARTIFACT: ${{ needs.prepare-shared-core-child-rerun.outputs.artifact_name }}
      CORE_ACCEPT_ARTIFACT: ${{ needs.accept-shared-core-child-rerun.outputs.artifact_name }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact sealed recovery evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact attempt-two transport readback
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.READBACK_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Download exact Shared-Core preparation receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.CORE_PREP_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Download exact Shared-Core same-run acceptance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.CORE_ACCEPT_ARTIFACT }}
          path: /tmp/qikvrt-review-admission-recovery

      - name: Append exact same-run attempt-two acceptance
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.parse
          from tools.qikvrt_review_admission_recovery import (
              admission_inbox_acceptance_path,
              admission_inbox_attempt_chain_path,
              admission_inbox_rerun_path,
              admission_inbox_slot_path,
              build_admission_attempt_authority_chain,
              build_admission_rerun_acceptance,
              build_recovery_ledger_effect_authority_readback,
              recovery_ledger_effect_authority_readback_path,
              verify_rerun_readback,
              validate_shared_review_core_rerun_acceptance,
              validate_shared_review_core_rerun_preparation,
              validate_recovery_intent,
              validate_recovery_producer_binding,
              validate_admission_inbox_slot,
              verify_recovery_ledger_authority,
          )
          repo=os.environ['REPOSITORY']
          sequence=int(os.environ['INBOX_SEQUENCE'])
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')

          def api(path,method='GET',payload=None,allow_404=False):
              command=['gh','api',path]
              if method != 'GET': command.extend(['--method',method])
              if payload is not None: command.extend(['--input','-'])
              result=subprocess.run(
                  command,input=(json.dumps(payload) if payload is not None else None),
                  text=True,capture_output=True,
              )
              if result.returncode != 0:
                  if allow_404 and 'HTTP 404' in result.stderr: return None
                  raise SystemExit('ADMISSION_INBOX_ACCEPT_API_FAILED')
              return json.loads(result.stdout) if result.stdout.strip() else {}

          ref_short='qikvrt/review-admission-inbox-v1'
          ref_api=f'heads/{ref_short}'
          head=api(f'repos/{repo}/git/ref/{ref_api}').get('object',{}).get('sha')
          if not isinstance(head,str):
              raise SystemExit('ADMISSION_INBOX_ACCEPT_HEAD_INVALID')
          def read_json(path,allow_404=False):
              encoded_ref=urllib.parse.quote(head,safe='')
              encoded_path=urllib.parse.quote(path,safe='/')
              content=api(
                  f'repos/{repo}/contents/{encoded_path}?ref={encoded_ref}',
                  allow_404=allow_404,
              )
              return None if content is None else json.loads(
                  base64.b64decode(content['content'])
              )
          rerun=read_json(admission_inbox_rerun_path(sequence))
          slot=validate_admission_inbox_slot(
              read_json(admission_inbox_slot_path(sequence))
          )
          intent=validate_recovery_intent(rerun.get('intent'))
          validate_recovery_producer_binding(
              intent,rerun.get('producer_binding')
          )
          child=json.loads((root/'attempt-2.json').read_text())
          proof=verify_rerun_readback(intent,child)
          if json.loads((root/'rerun-readback.json').read_text()) != proof:
              raise SystemExit('ADMISSION_INBOX_ACCEPT_READBACK_DRIFT')
          record=build_admission_rerun_acceptance(
              slot=slot,rerun_record=rerun,child_run=child,readback=proof
          )
          path=admission_inbox_acceptance_path(sequence)
          existing=read_json(path,allow_404=True)
          if existing not in (None,record):
              raise SystemExit('ADMISSION_INBOX_ACCEPT_IMMUTABLE_COLLISION')
          if existing is None:
              core_preparation=None
              core_acceptance=None
              if intent.get('source_kind') in {
                  'CORE_EXACT_REVIEW_CHILD_ZERO_JOB',
                  'CORE_MESH_REVIEW_CHILD_ZERO_JOB',
              }:
                  core_preparation=validate_shared_review_core_rerun_preparation(
                      json.loads((root/'core-rerun-preparation.json').read_text()),
                      origin=intent['origin_authority'],
                  )
                  core_acceptance=validate_shared_review_core_rerun_acceptance(
                      json.loads((root/'core-rerun-acceptance.json').read_text()),
                      origin=intent['origin_authority'],child_run=child,
                  )
              chain=(
                  build_admission_attempt_authority_chain(
                      slot=slot,rerun_record=rerun,acceptance=record,
                      core_preparation=core_preparation,
                      core_acceptance=core_acceptance,
                  )
                  if intent.get('source_kind') in {
                      'CORE_EXACT_REVIEW_CHILD_ZERO_JOB',
                      'CORE_MESH_REVIEW_CHILD_ZERO_JOB',
                  }
                  else None
              )
              chain_path=(
                  admission_inbox_attempt_chain_path(child['id'],2)
                  if chain is not None else None
              )
              if chain_path is not None:
                  prior_chain=read_json(chain_path,allow_404=True)
                  if prior_chain not in (None,chain):
                      raise SystemExit('ADMISSION_ATTEMPT_CHAIN_IMMUTABLE_COLLISION')
              actor=os.environ.get('EXPECTED_LEDGER_WRITER_ACTOR_ID','')
              current_effect=api(
                  f"repos/{repo}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
              )
              if (
                  not actor.isdigit() or int(actor) < 1
                  or current_effect.get('head_sha') != os.environ['SEALED_EVALUATOR']
                  or not isinstance(current_effect.get('run_started_at'),str)
              ):
                  raise SystemExit('RECOVERY_LEDGER_EFFECT_AUTHORITY_DRIFT')
              authority=verify_recovery_ledger_authority(
                  lane='admission-source-rerun',repository=repo,
                  writer_actor_id=int(actor),
                  writer_group=os.environ.get('QIKVRT_OUTBOX_WRITER_GROUP',''),
                  api=lambda candidate: api(candidate),
              )
              effect_authority=build_recovery_ledger_effect_authority_readback(
                  authority,lane='admission-source-rerun',
                  evaluator_sha=os.environ['SEALED_EVALUATOR'],
                  effect_run_id=int(os.environ['GITHUB_RUN_ID']),
                  effect_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                  effect_run_started_at=current_effect['run_started_at'],
              )
              authority_path=recovery_ledger_effect_authority_readback_path(
                  effect_authority,lane='admission-source-rerun'
              )
              commit=api(f'repos/{repo}/git/commits/{head}')
              def blob_for(value):
                  return api(
                      f'repos/{repo}/git/blobs','POST',
                      {'content':base64.b64encode(
                          (json.dumps(value,sort_keys=True,indent=2)+'\n').encode()
                      ).decode(),'encoding':'base64'},
                  )['sha']
              written={path:record,authority_path:effect_authority}
              if chain_path is not None: written[chain_path]=chain
              tree=api(
                  f'repos/{repo}/git/trees','POST',
                  {'base_tree':commit['tree']['sha'],'tree':[
                      {'path':item_path,'mode':'100644','type':'blob',
                       'sha':blob_for(item_value)}
                      for item_path,item_value in sorted(written.items())
                  ]},
              )
              successor=api(
                  f'repos/{repo}/git/commits','POST',
                  {'message':f'Accept review admission source {sequence} attempt 2',
                   'tree':tree['sha'],'parents':[head]},
              )
              api(
                  f'repos/{repo}/git/refs/{ref_api}','PATCH',
                  {'sha':successor['sha'],'force':False},
              )
              readback_ref=api(f'repos/{repo}/git/ref/{ref_api}')
              readback_commit=api(
                  f"repos/{repo}/git/commits/{successor['sha']}"
              )
              if (
                  readback_ref.get('object',{}).get('sha') != successor['sha']
                  or readback_commit.get('tree',{}).get('sha') != tree['sha']
                  or [item.get('sha') for item in readback_commit.get('parents',[])]
                      != [head]
              ):
                  raise SystemExit('ADMISSION_INBOX_ACCEPT_CAS_READBACK_DRIFT')
              encoded_successor=urllib.parse.quote(successor['sha'],safe='')
              for item_path,item_value in written.items():
                  encoded_path=urllib.parse.quote(item_path,safe='/')
                  content=api(
                      f'repos/{repo}/contents/{encoded_path}?ref={encoded_successor}'
                  )
                  if (
                      content.get('type') != 'file'
                      or content.get('encoding') != 'base64'
                      or json.loads(base64.b64decode(content['content']))
                          != item_value
                  ):
                      raise SystemExit(
                          'ADMISSION_INBOX_ACCEPT_FILE_READBACK_DRIFT'
                      )
          PY

  plan-review-observation:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact trusted review observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Plan one durable PR, commit-page, or review-page unit read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, json, os, pathlib, subprocess, urllib.parse
          from tools.qikvrt_review_admission_recovery import (
              build_direct_review_observation,
              build_recovery_ledger_effect_authority_readback,
              build_review_absence_facts,
              build_review_observation_subject_cursor,
              build_review_observation_slot,
              empty_review_observation_queue_meta,
              empty_review_observation_scan,
              observe_human_review_facts,
              recovery_ledger_effect_authority_readback_path,
              recovery_ledger_genesis_path,
              review_observation_locator_path,
              review_observation_queue_meta_path,
              review_observation_scan_path,
              review_observation_slot_path,
              review_observation_subject_cursor_path,
              review_wakeup_record_path,
              review_wakeup_subject_ack_slot_path,
              review_wakeup_subject_path,
              validate_review_observation_queue_meta,
              validate_review_observation_scan,
              validate_review_observation_slot,
              validate_review_observation_subject_cursor,
              validate_review_wakeup_record,
              validate_review_wakeup_subject_ack_slot,
              validate_review_wakeup_subject,
              validate_recovery_ledger_genesis,
              verify_recovery_ledger_authority,
          )
          repo=os.environ['REPOSITORY']
          ref_short='qikvrt/review-wakeup-ledger-v1'
          ref_api=f'heads/{ref_short}'

          def api(path,method='GET',payload=None,allow_404=False):
              command=['gh','api',path]
              if method != 'GET': command.extend(['--method',method])
              if payload is not None: command.extend(['--input','-'])
              result=subprocess.run(
                  command,input=(json.dumps(payload) if payload is not None else None),
                  text=True,capture_output=True,
              )
              if result.returncode != 0:
                  if allow_404 and 'HTTP 404' in result.stderr: return None
                  raise SystemExit('REVIEW_OBSERVATION_API_FAILED')
              return json.loads(result.stdout) if result.stdout.strip() else {}

          repository=api(f'repos/{repo}')
          main=api(f'repos/{repo}/commits/main')
          main_tree=main.get('commit',{}).get('tree',{}).get('sha')
          if (
              repository.get('full_name') != repo
              or not isinstance(repository.get('id'),int)
              or subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
                  != os.environ['SEALED_EVALUATOR']
              or main.get('sha') != os.environ['SEALED_EVALUATOR']
              or not isinstance(main_tree,str)
          ):
              raise SystemExit('REVIEW_OBSERVATION_TRUSTED_MAIN_DRIFT')

          observed_ref=api(f'repos/{repo}/git/ref/{ref_api}',allow_404=True)
          if observed_ref is None:
              raise SystemExit(
                  'REVIEW_WAKEUP_REF_MISSING_NO_SILENT_REINITIALIZATION'
              )
          else:
              head=observed_ref.get('object',{}).get('sha')
          if not isinstance(head,str):
              raise SystemExit('REVIEW_OBSERVATION_LEDGER_HEAD_INVALID')

          def read_json(path,validator=None):
              encoded_ref=urllib.parse.quote(head,safe='')
              encoded_path=urllib.parse.quote(path,safe='/')
              content=api(
                  f'repos/{repo}/contents/{encoded_path}?ref={encoded_ref}',
                  allow_404=True,
              )
              if content is None: return None
              if content.get('type') != 'file' or content.get('encoding') != 'base64':
                  raise SystemExit('REVIEW_OBSERVATION_SHARD_INVALID')
              value=json.loads(base64.b64decode(content['content']))
              return validator(value) if validator is not None else value

          genesis=read_json(recovery_ledger_genesis_path('review-wakeup'))
          validate_recovery_ledger_genesis(
              genesis,lane='review-wakeup',repository=repo,
              repository_id=int(repository['id']),
          )
          scan=read_json(
              review_observation_scan_path(),validate_review_observation_scan
          )
          if scan is None: scan=empty_review_observation_scan()
          meta=read_json(
              review_observation_queue_meta_path(),
              validate_review_observation_queue_meta,
          )
          if meta is None: meta=empty_review_observation_queue_meta()
          if meta['drain_sequence'] < meta['next_sequence']:
              pending_slot=read_json(
                  review_observation_slot_path(meta['drain_sequence']),
                  validate_review_observation_slot,
              )
              pending_record=read_json(
                  review_wakeup_record_path(pending_slot['fact_fingerprint']),
                  validate_review_wakeup_record,
              )
              if (
                  pending_record is not None
                  and (
                      pending_record.get('ack') is not None
                      or pending_record.get('terminal') is not None
                  )
              ):
                  meta=dict(meta)
                  meta['drain_sequence'] += 1
          after=json.loads(json.dumps(scan))
          active=after.get('active')
          facts=[]
          cursor_updates={}

          if active is not None and active.get('base_sha') != main['sha']:
              # A partial generation cannot authorize absence across main.
              after['active']=None
              after['generation'] += 1
          elif active is None:
              pulls=api(
                  f'repos/{repo}/pulls?state=open&base=main&sort=created&'
                  f'direction=asc&per_page=1&page={after["pull_page"]}'
              )
              if not isinstance(pulls,list) or len(pulls) > 1:
                  raise SystemExit('REVIEW_OBSERVATION_PULL_PAGE_INVALID')
              if not pulls:
                  after['pull_page']=1
                  after['generation'] += 1
              else:
                  number=pulls[0].get('number')
                  pull=api(f'repos/{repo}/pulls/{number}')
                  if (
                      pull.get('state') != 'open'
                      or pull.get('base',{}).get('ref') != 'main'
                      or pull.get('base',{}).get('sha') != main['sha']
                      or pull.get('base',{}).get('repo',{}).get('full_name') != repo
                      or pull.get('head',{}).get('repo',{}).get('full_name') != repo
                  ):
                      after['pull_page'] += 1
                  else:
                      head_sha=pull.get('head',{}).get('sha')
                      head_commit=api(f'repos/{repo}/commits/{head_sha}')
                      if (
                          head_commit.get('sha') != head_sha
                          or not isinstance(
                              head_commit.get('commit',{}).get('tree',{}).get('sha'),str
                          )
                      ):
                          raise SystemExit('REVIEW_OBSERVATION_HEAD_COMMIT_DRIFT')
                      exact_head_commits=[head_commit]
                      resume_path=review_observation_subject_cursor_path(
                          int(number)
                      )
                      resume=read_json(
                          resume_path,validate_review_observation_subject_cursor
                      )
                      resume_subject=(resume or {}).get('subject',{})
                      if (
                          resume is not None
                          and resume_subject.get('head_sha')
                              == pull.get('head',{}).get('sha')
                          and resume_subject.get('base_sha') == main['sha']
                          and resume_subject.get('base_tree_sha') == main_tree
                          and resume['commits'] == exact_head_commits
                      ):
                          after['active']={
                              'stage':'REVIEWS',
                              'page':resume['next_review_page'],'pull':pull,
                              'commits':resume['commits'],'facts':[],
                              'seen_review_ids':[],
                              'last_ack_cursor':resume.get('last_ack_cursor'),
                              'base_sha':main['sha'],'base_tree_sha':main_tree,
                          }
                      else:
                          after['active']={
                              'stage':'REVIEWS','page':1,'pull':pull,
                              'commits':exact_head_commits,'facts':[],
                              'seen_review_ids':[],
                              'last_ack_cursor':None,
                              'base_sha':main['sha'],'base_tree_sha':main_tree,
                          }
          elif active['stage'] == 'COMMITS':
              # Legacy in-flight cursors are migrated without the GitHub
              # pull-commits endpoint, which is capped at 250 entries.  The
              # exact live PR head commit alone binds the head and tree needed
              # by every review fact; history completeness is not inferred.
              pull=api(f"repos/{repo}/pulls/{active['pull']['number']}")
              if (
                  pull.get('state') != 'open'
                  or pull.get('head',{}).get('sha')
                      != active['pull'].get('head',{}).get('sha')
                  or pull.get('base',{}).get('sha') != active['base_sha']
                  or pull.get('commits') != active['pull'].get('commits')
              ):
                  after['active']=None
              else:
                  head_sha=pull.get('head',{}).get('sha')
                  head_commit=api(f'repos/{repo}/commits/{head_sha}')
                  if (
                      head_commit.get('sha') != head_sha
                      or not isinstance(
                          head_commit.get('commit',{}).get('tree',{}).get('sha'),str
                      )
                  ):
                      raise SystemExit('REVIEW_OBSERVATION_HEAD_COMMIT_DRIFT')
                  after['active']['commits']=[head_commit]
                  after['active']['stage']='REVIEWS'
                  after['active']['page']=1
          elif active['stage'] == 'REVIEWS':
              pull=api(f"repos/{repo}/pulls/{active['pull']['number']}")
              if (
                  pull.get('state') != 'open'
                  or pull.get('head',{}).get('sha')
                      != active['pull'].get('head',{}).get('sha')
                  or pull.get('base',{}).get('sha') != active['base_sha']
                  or main['sha'] != active['base_sha']
              ):
                  after['active']=None
              else:
                  page=api(
                      f"repos/{repo}/pulls/{pull['number']}/reviews?"
                      f"per_page=100&page={active['page']}"
                  )
                  if not isinstance(page,list) or len(page) > 100:
                      raise SystemExit('REVIEW_OBSERVATION_REVIEW_PAGE_INVALID')
                  review_ids=[item.get('id') for item in page if isinstance(item,dict)]
                  if len(review_ids) != len(page) or None in review_ids:
                      raise SystemExit('REVIEW_OBSERVATION_REVIEW_ITEM_INVALID')
                  seen=list(active['seen_review_ids'])+review_ids
                  if len(set(seen)) != len(seen):
                      raise SystemExit('REVIEW_OBSERVATION_REVIEW_DUPLICATE')
                  observation=observe_human_review_facts(
                      [pull],reviews_by_pr={int(pull['number']):page},
                      commits_by_pr={int(pull['number']):active['commits']},
                      repository=repo,current_main_sha=active['base_sha'],
                      current_main_tree_sha=active['base_tree_sha'],
                      commit_observation_mode='EXACT_HEAD_SINGLETON',
                  )
                  # Dismissal/removal is never inferred from the moving
                  # paginated list.  It is observed later by an exact ID GET.
                  enumerated_facts=[
                      fact for fact in observation['facts']
                      if fact['review_state'] != 'DISMISSED'
                  ]
                  current_facts=list(active['facts'])+enumerated_facts
                  after['active']['seen_review_ids']=seen
                  after['active']['facts']=current_facts
                  facts.extend(enumerated_facts)
                  if len(page) == 100:
                      resume=build_review_observation_subject_cursor(
                          pull,active['commits'],repository=repo,
                          current_main_sha=active['base_sha'],
                          current_main_tree_sha=active['base_tree_sha'],
                          next_review_page=active['page']+1,
                          generation=after['generation'],
                          commit_observation_mode='EXACT_HEAD_SINGLETON',
                          last_ack_review_id=(
                              active['last_ack_cursor']['review_id']
                              if active.get('last_ack_cursor') is not None
                              else None
                          ),
                          last_ack_fact_fingerprint=(
                              active['last_ack_cursor']['fact_fingerprint']
                              if active.get('last_ack_cursor') is not None
                              else None
                          ),
                      )
                      cursor_updates[
                          review_observation_subject_cursor_path(
                              int(pull['number'])
                          )
                      ]=resume
                      # One review page is the durable per-subject quantum.
                      # Rotate to the next PR even if this PR remains hot.
                      after['active']=None
                      after['pull_page'] += 1
                  else:
                      subject=observation['subjects'][0]
                      subject_record=read_json(
                          review_wakeup_subject_path(subject),
                          validate_review_wakeup_subject,
                      )
                      selected_ack=None
                      if (
                          subject_record is not None
                          and subject_record['acknowledged_review_count'] > 0
                      ):
                          ack_sequence=subject_record['recheck_sequence']
                          ack_slot_path=review_wakeup_subject_ack_slot_path(
                              subject,ack_sequence
                          )
                          ack_slot=read_json(ack_slot_path)
                          ack_slot=validate_review_wakeup_subject_ack_slot(
                              ack_slot,subject=subject
                          )
                          selected_ack=ack_slot['fact']
                          # Advance the per-subject exact-ID cursor now and
                          # rotate globally after the one-ID recheck quantum.
                          cursor_updates[
                              review_wakeup_subject_path(subject)
                          ]=advance_review_wakeup_subject_recheck(
                              subject_record
                          )
                      cursor_updates[
                          review_observation_subject_cursor_path(
                              int(pull['number'])
                          )
                      ]=build_review_observation_subject_cursor(
                          pull,active['commits'],repository=repo,
                          current_main_sha=active['base_sha'],
                          current_main_tree_sha=active['base_tree_sha'],
                          next_review_page=1,
                          generation=after['generation'],
                          commit_observation_mode='EXACT_HEAD_SINGLETON',
                          last_ack_review_id=(
                              selected_ack['review_id']
                              if selected_ack is not None else None
                          ),
                          last_ack_fact_fingerprint=(
                              selected_ack['fact_fingerprint']
                              if selected_ack is not None else None
                          ),
                      )
                      if selected_ack is not None:
                          after['active']['stage']='ACK_RECHECK'
                          after['active']['page']=1
                          # One exact review-ID quantum, then rotate to the
                          # next PR.  A large historical ACK set cannot hold
                          # the global observer frontier for N schedule ticks.
                          after['active']['acknowledged_facts']=[selected_ack]
                          after['active']['ack_index']=0
                      else:
                          after['active']=None
                          after['pull_page'] += 1
          else:
              # Exactly one previously ACKed review ID is re-read per tick.
              # A 404 on this exact endpoint, never list absence, authorizes a
              # removal fact.  A found DISMISSED review authorizes dismissal.
              pull=api(f"repos/{repo}/pulls/{active['pull']['number']}")
              if (
                  pull.get('state') != 'open'
                  or pull.get('head',{}).get('sha')
                      != active['pull'].get('head',{}).get('sha')
                  or pull.get('base',{}).get('sha') != active['base_sha']
                  or main['sha'] != active['base_sha']
              ):
                  after['active']=None
              else:
                  prior=active['acknowledged_facts'][active['ack_index']]
                  direct=api(
                      f"repos/{repo}/pulls/{pull['number']}/reviews/"
                      f"{prior['review_id']}",allow_404=True,
                  )
                  direct_proof=build_direct_review_observation(
                      review_id=int(prior['review_id']),review=direct,
                  )
                  direct_reviews=[] if direct is None else [direct]
                  direct_observation=observe_human_review_facts(
                      [pull],reviews_by_pr={int(pull['number']):direct_reviews},
                      commits_by_pr={int(pull['number']):active['commits']},
                      repository=repo,current_main_sha=active['base_sha'],
                      current_main_tree_sha=active['base_tree_sha'],
                      commit_observation_mode='EXACT_HEAD_SINGLETON',
                  )
                  if direct_proof['state'] == 'NOT_FOUND':
                      absence=build_review_absence_facts(
                          direct_observation,[prior]
                      )
                      if len(absence) != 1:
                          raise SystemExit(
                              'REVIEW_OBSERVATION_DIRECT_ABSENCE_INVALID'
                          )
                      facts.extend(absence)
                  else:
                      projected=direct_proof['review']
                      if (
                          projected['id'] != prior['review_id']
                          or projected['submitted_at'] != prior['submitted_at']
                          or projected['commit_id'] != prior['commit_id']
                          or projected['user']['id'] != prior['reviewer_id']
                          or projected['user']['login'] != prior['reviewer_login']
                      ):
                          raise SystemExit(
                              'REVIEW_OBSERVATION_DIRECT_IDENTITY_DRIFT'
                          )
                      if projected['state'] == 'DISMISSED':
                          dismissed=[
                              fact for fact in direct_observation['facts']
                              if fact['review_state'] == 'DISMISSED'
                          ]
                          if len(dismissed) != 1:
                              raise SystemExit(
                                  'REVIEW_OBSERVATION_DIRECT_DISMISSAL_INVALID'
                              )
                          facts.extend(dismissed)
                  # ACK_RECHECK is a single-ID per-subject quantum.
                  after['active']=None
                  after['pull_page'] += 1

          updates={review_observation_scan_path():after,**cursor_updates}
          meta_after=dict(meta)
          staged_fingerprints=set()
          unseen_facts=[]
          for fact in sorted(
              facts,key=lambda item:(
                  item['submitted_at'],item['review_id'],item['fact_fingerprint']
              )
          ):
              fingerprint=fact['fact_fingerprint']
              if fingerprint in staged_fingerprints:
                  continue
              staged_fingerprints.add(fingerprint)
              locator_path=review_observation_locator_path(fingerprint)
              if read_json(locator_path) is not None:
                  continue
              unseen_facts.append(fact)
          if unseen_facts:
              sequence=meta_after['next_sequence']
              # One exact PR-page observation becomes one FIFO work unit.
              # The primary fact wakes the evaluator; all same-subject facts
              # remain sealed in the slot for ACK/removal tracking.  Intake
              # is therefore bounded to the one-slot-per-tick drain rate.
              slot=build_review_observation_slot(
                  unseen_facts[0],sequence=sequence,
                  generation=after['generation'],covered_facts=unseen_facts,
              )
              updates[review_observation_slot_path(sequence)]=slot
              for fact in unseen_facts:
                  fingerprint=fact['fact_fingerprint']
                  locator_path=review_observation_locator_path(fingerprint)
                  updates[locator_path]={
                      'schema':'qikvrt_human_review_observation_locator_v1',
                      'fact_fingerprint':fingerprint,'sequence':sequence,
                      'slot_path':review_observation_slot_path(sequence),
                      'slot_sha256':slot['slot_sha256'],
                      'covered_by_primary_fingerprint':slot['fact_fingerprint'],
                      'authority_boundary':'RECOVERY_ONLY',
                  }
              meta_after['next_sequence']=sequence+1
          updates[review_observation_queue_meta_path()]=meta_after

          plan={
              'schema':'qikvrt_human_review_observation_plan_v1',
              'repository':repo,'repository_id':repository['id'],
              'expected_main_sha':main['sha'],'expected_ledger_head':head,
              'evaluator_sha':os.environ['SEALED_EVALUATOR'],
              'updates':updates,'generation':after['generation'],
              'pull_page':after['pull_page'],
              'stage':(after.get('active') or {}).get('stage','PULL'),
              'enqueued_facts':len(staged_fingerprints),
              'authority_boundary':'RECOVERY_ONLY',
              'completion_claims':{
                  'PASS':False,'FINAL_PASS':False,
                  'EFFECT_ACK_DONE':False,'MERGE':False,
              },
          }
          plan['plan_sha256']=__import__('hashlib').sha256(json.dumps(
              plan,sort_keys=True,separators=(',',':')
          ).encode()).hexdigest()
          pathlib.Path('/tmp/qikvrt-review-observation-plan.json').write_text(
              json.dumps(plan,sort_keys=True,indent=2)+'\n'
          )
          print(json.dumps({
              'schema':'qikvrt_human_review_observation_advance_v1',
              'before_head':head,'state':'PLANNED_FF_CAS',
              'generation':after['generation'],'pull_page':after['pull_page'],
              'stage':(after.get('active') or {}).get('stage','PULL'),
              'enqueued_facts':len(staged_fingerprints),
              'complete_absence_inference':(
                  scan.get('active',{}).get('stage') == 'REVIEWS'
                  and after.get('active') is None
              ) if isinstance(scan.get('active'),dict) else False,
              'authority_boundary':'RECOVERY_ONLY',
              'native_account_review_authorized':False,
              'completion_claims':{
                  'PASS':False,'FINAL_PASS':False,
                  'EFFECT_ACK_DONE':False,'MERGE':False,
              },
          },sort_keys=True,indent=2))
          PY

      - name: Upload the exact read-only review-observation plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-review-observation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: /tmp/qikvrt-review-observation-plan.json

  advance-review-observation:
    needs: plan-review-observation
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-review-wakeup
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-review-wakeup
      REPOSITORY: ${{ github.repository }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact trusted review-observation writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact read-only review-observation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qikvrt-review-observation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp

      - name: Persist only the sealed review-observation plan by exact FF-CAS
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.parse
          from tools.qikvrt_review_admission_recovery import (
              build_recovery_ledger_effect_authority_readback,
              recovery_ledger_effect_authority_readback_path,
              verify_recovery_ledger_authority,
          )
          repo=os.environ['REPOSITORY']
          plan=json.loads(pathlib.Path(
              '/tmp/qikvrt-review-observation-plan.json'
          ).read_text())
          claimed=plan.pop('plan_sha256',None)
          if claimed != hashlib.sha256(json.dumps(
              plan,sort_keys=True,separators=(',',':')
          ).encode()).hexdigest():
              raise SystemExit('REVIEW_OBSERVATION_PLAN_DIGEST_DRIFT')
          if (
              plan.get('schema') != 'qikvrt_human_review_observation_plan_v1'
              or plan.get('repository') != repo
              or plan.get('evaluator_sha') != os.environ['SEALED_EVALUATOR']
              or plan.get('authority_boundary') != 'RECOVERY_ONLY'
              or not isinstance(plan.get('updates'),dict) or not plan['updates']
              or subprocess.check_output(
                  ['git','rev-parse','HEAD'],text=True
              ).strip() != os.environ['SEALED_EVALUATOR']
          ):
              raise SystemExit('REVIEW_OBSERVATION_PLAN_DRIFT')
          def api(path,method='GET',payload=None):
              command=['gh','api','-H','X-GitHub-Api-Version: 2026-03-10',path]
              if method != 'GET': command.extend(['--method',method])
              if payload is not None: command.extend(['--input','-'])
              result=subprocess.run(
                  command,input=(json.dumps(payload) if payload is not None else None),
                  text=True,capture_output=True,
              )
              if result.returncode:
                  raise SystemExit('REVIEW_OBSERVATION_EFFECT_API_FAILED')
              return json.loads(result.stdout) if result.stdout.strip() else {}
          main=api(f'repos/{repo}/commits/main')
          head=api(
              f'repos/{repo}/git/ref/heads/qikvrt/review-wakeup-ledger-v1'
          ).get('object',{}).get('sha')
          current=api(
              f"repos/{repo}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
          )
          actor=os.environ.get('EXPECTED_LEDGER_WRITER_ACTOR_ID','')
          if (
              main.get('sha') != plan['expected_main_sha']
              or main.get('sha') != os.environ['SEALED_EVALUATOR']
              or head != plan['expected_ledger_head']
              or not actor.isdigit() or int(actor)<1
              or current.get('head_sha') != os.environ['SEALED_EVALUATOR']
              or not isinstance(current.get('run_started_at'),str)
          ):
              raise SystemExit('REVIEW_OBSERVATION_PRECAS_DRIFT')
          authority=verify_recovery_ledger_authority(
              lane='review-wakeup',repository=repo,
              writer_actor_id=int(actor),
              writer_group=os.environ.get('QIKVRT_OUTBOX_WRITER_GROUP',''),
              api=lambda path: api(path),
          )
          effect_authority=build_recovery_ledger_effect_authority_readback(
              authority,lane='review-wakeup',
              evaluator_sha=os.environ['SEALED_EVALUATOR'],
              effect_run_id=int(os.environ['GITHUB_RUN_ID']),
              effect_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              effect_run_started_at=current['run_started_at'],
          )
          updates=dict(plan['updates'])
          updates[recovery_ledger_effect_authority_readback_path(
              effect_authority,lane='review-wakeup'
          )]=effect_authority
          parent=api(f'repos/{repo}/git/commits/{head}')
          entries=[]
          for path,value in sorted(updates.items()):
              blob=api(f'repos/{repo}/git/blobs','POST',{
                  'content':base64.b64encode((json.dumps(
                      value,sort_keys=True,indent=2
                  )+'\n').encode()).decode(),'encoding':'base64',
              })
              entries.append({
                  'path':path,'mode':'100644','type':'blob','sha':blob['sha'],
              })
          tree=api(f'repos/{repo}/git/trees','POST',{
              'base_tree':parent['tree']['sha'],'tree':entries,
          })
          successor=api(f'repos/{repo}/git/commits','POST',{
              'message':'Advance bounded human review observation frontier',
              'tree':tree['sha'],'parents':[head],
          })
          api(
              f'repos/{repo}/git/refs/heads/qikvrt/review-wakeup-ledger-v1',
              'PATCH',{'sha':successor['sha'],'force':False},
          )
          readback_ref=api(
              f'repos/{repo}/git/ref/heads/qikvrt/review-wakeup-ledger-v1'
          )
          readback_commit=api(
              f"repos/{repo}/git/commits/{successor['sha']}"
          )
          if (
              readback_ref.get('object',{}).get('sha') != successor['sha']
              or readback_commit.get('tree',{}).get('sha') != tree['sha']
              or [item.get('sha') for item in readback_commit.get('parents',[])]
                  != [head]
          ):
              raise SystemExit('REVIEW_OBSERVATION_CAS_READBACK_DRIFT')
          encoded_successor=urllib.parse.quote(successor['sha'],safe='')
          for path,value in sorted(updates.items()):
              encoded_path=urllib.parse.quote(path,safe='/')
              content=api(
                  f'repos/{repo}/contents/{encoded_path}?ref={encoded_successor}'
              )
              expected=(json.dumps(value,sort_keys=True,indent=2)+'\n').encode()
              if (
                  content.get('type') != 'file'
                  or content.get('encoding') != 'base64'
                  or base64.b64decode(content.get('content','')) != expected
              ):
                  raise SystemExit('REVIEW_OBSERVATION_FILE_READBACK_DRIFT')
          print(json.dumps({
              'schema':'qikvrt_human_review_observation_write_v1',
              'before_head':head,'ledger_head':successor['sha'],
              'plan_sha256':claimed,'persisted':True,
              'authority_readback_sha256':effect_authority['readback_sha256'],
              'authority_boundary':'RECOVERY_ONLY',
          },sort_keys=True))
          PY

  plan-review-wakeup:
    needs: advance-review-observation
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.review_wakeup.outputs.state }}
      dispatch: ${{ steps.review_wakeup.outputs.dispatch }}
      artifact_name: ${{ steps.review_wakeup.outputs.artifact_name }}
      artifact_id: ${{ steps.wakeup_evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.wakeup_evidence.outputs.artifact-digest }}
      core_artifact_name: ${{ steps.review_wakeup.outputs.core_artifact_name }}
      core_artifact_id: ${{ steps.core_payload_evidence.outputs.artifact-id }}
      core_artifact_digest: ${{ steps.core_payload_evidence.outputs.artifact-digest }}
      pr: ${{ steps.review_wakeup.outputs.pr }}
      head: ${{ steps.review_wakeup.outputs.head }}
      fingerprint: ${{ steps.review_wakeup.outputs.fingerprint }}
      core_fingerprint: ${{ steps.review_wakeup.outputs.core_fingerprint }}
      transport_attempt: ${{ steps.review_wakeup.outputs.transport_attempt }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out current trusted review wake-up implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Read one durable observation slot and seal its exact transition
        id: review_wakeup
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-human-review-wakeup
          mkdir -p "$root"
          python3 -B - <<'PY' > "$root/selection.json"
          import base64, json, os, pathlib, subprocess, urllib.parse
          from tools.qikvrt_review_admission_recovery import (
              build_review_wakeup_active,
              build_review_wakeup_core_payload,
              build_review_wakeup_intent,
              build_review_wakeup_producer_binding,
              empty_review_observation_queue_meta,
              record_review_wakeup_intent,
              bind_review_wakeup_active_record,
              review_observation_queue_meta_path,
              review_observation_slot_path,
              review_wakeup_active_path,
              review_wakeup_record_path,
              review_wakeup_subject_path,
              select_review_wakeup_transition,
              validate_review_observation_queue_meta,
              validate_review_observation_slot,
              validate_review_wakeup_active,
              validate_review_wakeup_record,
              validate_review_wakeup_subject_ack_slot,
              validate_review_wakeup_subject,
          )

          repo=os.environ['REPOSITORY']
          root=pathlib.Path('/tmp/qikvrt-human-review-wakeup')

          def api(path):
              return json.loads(subprocess.check_output(
                  ['gh','api',path],text=True
              ))

          repository=api(f'repos/{repo}')
          main=api(f'repos/{repo}/commits/main')
          if (
              repository.get('full_name') != repo
              or not isinstance(repository.get('id'),int)
              or subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
                  != main.get('sha')
          ):
              raise SystemExit('REVIEW_WAKEUP_TRUSTED_MAIN_DRIFT')
          main_tree=main.get('commit',{}).get('tree',{}).get('sha')

          requested=api(
              f'repos/{repo}/actions/workflows/qikvrt_requested_review_executor.yml'
          )
          requested_path='.github/workflows/qikvrt_requested_review_executor.yml'
          if requested.get('path') != requested_path:
              raise SystemExit('REVIEW_WAKEUP_REQUESTED_WORKFLOW_DRIFT')
          recovery=api(
              f'repos/{repo}/actions/workflows/qikvrt_review_admission_recovery.yml'
          )
          recovery_path='.github/workflows/qikvrt_review_admission_recovery.yml'
          if recovery.get('path') != recovery_path:
              raise SystemExit('REVIEW_WAKEUP_RECOVERY_WORKFLOW_DRIFT')
          current_recovery=api(
              f"repos/{repo}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
          )
          if (
              current_recovery.get('workflow_id') != recovery.get('id')
              or str(current_recovery.get('path','')).split('@',1)[0]
                  != recovery_path
              or current_recovery.get('repository',{}).get('full_name') != repo
              or current_recovery.get('head_sha') != main.get('sha')
              or current_recovery.get('head_branch') != 'main'
              or current_recovery.get('run_attempt')
                  != int(os.environ['GITHUB_RUN_ATTEMPT'])
              or not isinstance(current_recovery.get('run_started_at'),str)
          ):
              raise SystemExit('REVIEW_WAKEUP_CURRENT_RUN_DRIFT')

          ledger_ref='qikvrt/review-wakeup-ledger-v1'
          observed_ref=subprocess.run(
              ['gh','api',f'repos/{repo}/git/ref/heads/{ledger_ref}'],
              text=True,capture_output=True,
          )
          if observed_ref.returncode == 0:
              ref_value=json.loads(observed_ref.stdout)
              ledger_head=ref_value.get('object',{}).get('sha')
              if not isinstance(ledger_head,str):
                  raise SystemExit('REVIEW_WAKEUP_LEDGER_REF_INVALID')
          else:
              raise SystemExit(
                  'REVIEW_WAKEUP_REF_MISSING_NO_SILENT_REINITIALIZATION'
              )
          (root/'ledger-head.txt').write_text(ledger_head+'\n')

          def shard(path,validator):
              if not ledger_head:
                  return None
              encoded=urllib.parse.quote(ledger_head,safe='')
              result=subprocess.run([
                  'gh','api',f'repos/{repo}/contents/{path}?ref={encoded}'
              ],text=True,capture_output=True)
              if result.returncode == 0:
                  content=json.loads(result.stdout)
                  if content.get('type') != 'file' or content.get('encoding') != 'base64':
                      raise SystemExit('REVIEW_WAKEUP_SHARD_CONTENT_INVALID')
                  return validator(json.loads(
                      base64.b64decode(content['content']).decode('utf-8')
                  ))
              if 'HTTP 404' in result.stderr:
                  return None
              raise SystemExit('REVIEW_WAKEUP_SHARD_READ_FAILED')

          observation_meta=shard(
              review_observation_queue_meta_path(),
              validate_review_observation_queue_meta,
          )
          if observation_meta is None:
              observation_meta=empty_review_observation_queue_meta()
          observation_sequence=None
          observation_slot=None
          facts=[]
          subjects=[]
          if observation_meta['drain_sequence'] < observation_meta['next_sequence']:
              observation_sequence=observation_meta['drain_sequence']
              observation_slot=shard(
                  review_observation_slot_path(observation_sequence),
                  validate_review_observation_slot,
              )
              if observation_slot is None:
                  raise SystemExit('REVIEW_WAKEUP_OBSERVATION_SLOT_MISSING')
              fact=observation_slot['fact']
              facts=[fact]
              subjects=[{
                  field:fact[field] for field in (
                      'repository','pr_number','head_sha','head_tree_sha','head_ref',
                      'base_sha','base_tree_sha','base_ref',
                  )
              }]
          observation={
              'schema':'qikvrt_human_review_observation_frontier_v1',
              'ledger_head':ledger_head,
              'queue_meta':observation_meta,
              'sequence':observation_sequence,
              'slot':observation_slot,
              'subjects':subjects,'facts':facts,
              'complete':observation_slot is not None,
              'absence_from_complete_generation_only':True,
              'authority_boundary':'WAKEUP_RECOVERY_ONLY',
              'native_account_review_authorized':False,
              'completion_claims':{
                  'PASS':False,'FINAL_PASS':False,
                  'EFFECT_ACK_DONE':False,'MERGE':False,
              },
          }
          (root/'observation.json').write_text(
              json.dumps(observation,sort_keys=True,indent=2)+'\n'
          )

          active_path=review_wakeup_active_path()
          active_before=shard(active_path,validate_review_wakeup_active)
          active_record=None
          if active_before is not None:
              active_record=shard(
                  active_before['record_path'],validate_review_wakeup_record
              )
              if active_record is None:
                  raise SystemExit('REVIEW_WAKEUP_ACTIVE_RECORD_MISSING')
              bind_review_wakeup_active_record(active_before,active_record)

          subject_records={}
          for subject in observation['subjects']:
              path=review_wakeup_subject_path(subject)
              subject_record=shard(path,validate_review_wakeup_subject)
              subject_records[path]=subject_record

          facts=list(observation['facts'])
          records={}
          acknowledged=set()
          terminal=set()
          reusable={}
          if active_record is not None:
              records[active_record['fact_fingerprint']]=active_record
          for fact in facts:
              fingerprint=fact['fact_fingerprint']
              path=review_wakeup_record_path(fingerprint)
              record=shard(path,validate_review_wakeup_record)
              records[fingerprint]=record
              if record is None:
                  continue
              if record['fact'] != fact:
                  raise SystemExit('REVIEW_WAKEUP_SHARD_FACT_COLLISION')
              if record.get('ack') is not None:
                  acknowledged.add(fingerprint)
              elif record.get('terminal') is not None:
                  terminal.add(fingerprint)
              else:
                  reusable[fingerprint]={
                      'intent':record['intent'],
                      'transport_attempts':{
                          attempt['transport_attempt']
                          for attempt in record['attempts']
                      },
                  }
          if active_record is not None:
              active_intent=active_record['intent']
              active_fingerprint=active_record['fact_fingerprint']
              # An already accepted Core child remains historically adoptable
              # after main or the live PR moves.  Supersession is decided only
              # after the exact Core fingerprint lookup proves no acceptance.
              selection=select_review_wakeup_transition(
                  [active_intent['fact']],acknowledged_fingerprints=set(),
                  terminal_fingerprints=set(),
                  reusable_intents={active_fingerprint:{
                      'intent':active_intent,
                      'transport_attempts':{
                          attempt['transport_attempt']
                          for attempt in active_record['attempts']
                      },
                  }},
              )
          else:
              selection=select_review_wakeup_transition(
                  facts,
                  acknowledged_fingerprints=acknowledged,
                  terminal_fingerprints=terminal,
                  reusable_intents=reusable,
              )
          state=selection['state']
          record_before=None
          record_after=None
          subject_path=None
          subject_before=None
          subject_after=None
          subject_ack_slot_path=None
          subject_ack_slot_before=None
          subject_ack_slot_after=None
          subject_ack_slots_before=[]
          subject_ack_slots_after=[]
          active_after=active_before
          if state == 'CORE_TRANSPORT_PENDING':
              intent=selection['intent']
              record_before=records.get(intent['fact_fingerprint'])
              if not isinstance(record_before,dict):
                  raise SystemExit('REVIEW_WAKEUP_CORE_PENDING_RECORD_MISSING')
              record_after=record_before
              binding=record_before['attempts'][0]
              (root/'intent.json').write_text(
                  json.dumps(intent,sort_keys=True,indent=2)+'\n'
              )
              (root/'wakeup-producer-binding.json').write_text(
                  json.dumps(binding,sort_keys=True,indent=2)+'\n'
              )
              core_payload=build_review_wakeup_core_payload(
                  intent,
                  producer_run_id=int(os.environ['GITHUB_RUN_ID']),
                  producer_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                  producer_event=os.environ['GITHUB_EVENT_NAME'],
                  producer_workflow_sha=main['sha'],
              )
              (root/'core-payload.json').write_text(
                  json.dumps(core_payload,sort_keys=True,indent=2)+'\n'
              )
              selection['core_fingerprint']=(
                  core_payload['request']['inputs']['transport_intent_sha256']
              )
          elif state == 'DISPATCH_ATTEMPT_1':
              live_wakeup_pull=api(
                  f"repos/{repo}/pulls/{selection['fact']['pr_number']}"
              )
              if (
                  live_wakeup_pull.get('state') != 'open'
                  or live_wakeup_pull.get('head',{}).get('sha')
                      != selection['fact']['head_sha']
                  or not isinstance(
                      live_wakeup_pull.get('head',{}).get('ref'),str
                  )
                  or not live_wakeup_pull['head']['ref']
              ):
                  raise SystemExit('REVIEW_WAKEUP_INTENT_SUBJECT_DRIFT')
              intent=selection.get('intent') or build_review_wakeup_intent(
                  selection['fact'],
                  head_ref=live_wakeup_pull['head']['ref'],
                  recovery_repository=repo,
                  recovery_repository_id=int(repository['id']),
                  recovery_workflow_id=int(recovery['id']),
                  recovery_workflow_path=recovery_path,
                  recovery_head_sha=main['sha'],
                  requested_workflow_id=int(requested['id']),
                  requested_workflow_path=requested_path,
                  requested_workflow_sha=main['sha'],
              )
              if intent['recovery_head_sha'] != main['sha']:
                  raise SystemExit('REVIEW_WAKEUP_ORPHAN_INTENT_SUPERSEDED')
              binding=build_review_wakeup_producer_binding(
                  intent,
                  recovery_run_id=int(os.environ['GITHUB_RUN_ID']),
                  recovery_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                  recovery_run_started_at=current_recovery['run_started_at'],
                  transport_attempt=int(selection['transport_attempt']),
              )
              (root/'intent.json').write_text(
                  json.dumps(intent,sort_keys=True,indent=2)+'\n'
              )
              (root/'wakeup-producer-binding.json').write_text(
                  json.dumps(binding,sort_keys=True,indent=2)+'\n'
              )
              core_payload=build_review_wakeup_core_payload(
                  intent,
                  producer_run_id=int(os.environ['GITHUB_RUN_ID']),
                  producer_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                  producer_event=os.environ['GITHUB_EVENT_NAME'],
                  producer_workflow_sha=main['sha'],
              )
              (root/'core-payload.json').write_text(
                  json.dumps(core_payload,sort_keys=True,indent=2)+'\n'
              )
              record_before=records.get(intent['fact_fingerprint'])
              record_after=record_review_wakeup_intent(
                  record_before,intent,binding
              )
              if active_before is not None:
                  raise SystemExit('REVIEW_WAKEUP_ACTIVE_POINTER_COLLISION')
              active_after=build_review_wakeup_active(intent)
              selection['intent_sha256']=intent['intent_sha256']
              selection['core_fingerprint']=(
                  core_payload['request']['inputs']['transport_intent_sha256']
              )
          def preserve(name,value):
              (root/name).write_text(
                  json.dumps(value,sort_keys=True,indent=2)+'\n'
              )
          preserve('record-before.json',record_before)
          preserve('record-after.json',record_after)
          preserve('subject-before.json',subject_before)
          preserve('subject-after.json',subject_after)
          preserve('subject-ack-slot-before.json',subject_ack_slot_before)
          preserve('subject-ack-slot-after.json',subject_ack_slot_after)
          preserve('subject-ack-slots-before.json',subject_ack_slots_before)
          preserve('subject-ack-slots-after.json',subject_ack_slots_after)
          preserve('active-before.json',active_before)
          preserve('active-after.json',active_after)
          transition={
              'schema':'qikvrt_human_review_wakeup_ledger_transition_v1',
              'ledger_ref':ledger_ref,
              'before_head':ledger_head,
              'record_path':(
                  record_after.get('record_path')
                  if isinstance(record_after,dict) else None
              ),
              'record_before_sha256':(
                  record_before.get('record_sha256')
                  if isinstance(record_before,dict) else None
              ),
              'record_after_sha256':(
                  record_after.get('record_sha256')
                  if isinstance(record_after,dict) else None
              ),
              'subject_path':subject_path,
              'subject_before_sha256':(
                  subject_before.get('subject_sha256')
                  if isinstance(subject_before,dict) else None
              ),
              'subject_after_sha256':(
                  subject_after.get('subject_sha256')
                  if isinstance(subject_after,dict) else None
              ),
              'subject_ack_slot_path':subject_ack_slot_path,
              'subject_ack_slot_before_sha256':(
                  subject_ack_slot_before.get('slot_sha256')
                  if isinstance(subject_ack_slot_before,dict) else None
              ),
              'subject_ack_slot_after_sha256':(
                  subject_ack_slot_after.get('slot_sha256')
                  if isinstance(subject_ack_slot_after,dict) else None
              ),
              'subject_ack_slots':[
                  {
                      'path':item['path'],
                      'slot_sha256':item['slot']['slot_sha256'],
                  }
                  for item in subject_ack_slots_after
              ],
              'active_path':active_path,
              'active_before_sha256':(
                  active_before.get('active_sha256')
                  if isinstance(active_before,dict) else None
              ),
              'active_after_sha256':(
                  active_after.get('active_sha256')
                  if isinstance(active_after,dict) else None
              ),
              'observation_sequence':observation_sequence,
              'observation_slot_sha256':(
                  observation_slot.get('slot_sha256')
                  if isinstance(observation_slot,dict) else None
              ),
              'observation_queue_meta_before':observation_meta,
              'drain_observation':False,
              'state':state,
              'fact_fingerprint':(
                  (selection.get('fact') or {}).get('fact_fingerprint')
              ),
              'authority_boundary':'RECOVERY_ONLY',
              'native_account_review_authorized':False,
              'completion_claims':{
                  'PASS':False,'FINAL_PASS':False,
                  'EFFECT_ACK_DONE':False,'MERGE':False,
              },
          }
          (root/'ledger-transition.json').write_text(
              json.dumps(transition,sort_keys=True,indent=2)+'\n'
          )
          print(json.dumps(selection,sort_keys=True,indent=2))
          PY
          cat "$root/selection.json"
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('/tmp/qikvrt-human-review-wakeup/selection.json'))
          fact=value.get('fact') or {}
          state=value['state']
          fingerprint=fact.get('fact_fingerprint','')
          if state in {'DISPATCH_ATTEMPT_1','CORE_TRANSPORT_PENDING'}:
              artifact=(
                  f"qikvrt-review-wakeup-intent-{fingerprint}-attempt-"
                  f"1-{value['core_fingerprint']}-run-"
                  f"{__import__('os').environ['GITHUB_RUN_ID']}-attempt-"
                  f"{__import__('os').environ['GITHUB_RUN_ATTEMPT']}"
              )
          else:
              artifact=''
          print(f"state={state}")
          print(f"dispatch={'true' if state in {'DISPATCH_ATTEMPT_1','CORE_TRANSPORT_PENDING'} else 'false'}")
          print(f"artifact_name={artifact}")
          print(f"pr={fact.get('pr_number','')}")
          print(f"head={fact.get('head_sha','')}")
          print(f"fingerprint={fingerprint}")
          print(f"core_fingerprint={value.get('core_fingerprint','')}")
          print(f"core_artifact_name=qikvrt-review-wakeup-core-payload-{value.get('core_fingerprint','')}-run-{__import__('os').environ['GITHUB_RUN_ID']}-attempt-{__import__('os').environ['GITHUB_RUN_ATTEMPT']}")
          print(f"transport_attempt={value.get('transport_attempt') or ''}")
          PY

      - name: Preserve append-only human-review wake-up INTENT before dispatch
        id: wakeup_evidence
        if: steps.review_wakeup.outputs.state != 'EMPTY'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.review_wakeup.outputs.artifact_name }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/qikvrt-human-review-wakeup/selection.json
            /tmp/qikvrt-human-review-wakeup/observation.json
            /tmp/qikvrt-human-review-wakeup/intent.json
            /tmp/qikvrt-human-review-wakeup/wakeup-producer-binding.json
            /tmp/qikvrt-human-review-wakeup/core-payload.json
            /tmp/qikvrt-human-review-wakeup/ledger-head.txt
            /tmp/qikvrt-human-review-wakeup/record-before.json
            /tmp/qikvrt-human-review-wakeup/record-after.json
            /tmp/qikvrt-human-review-wakeup/subject-before.json
            /tmp/qikvrt-human-review-wakeup/subject-after.json
            /tmp/qikvrt-human-review-wakeup/subject-ack-slot-before.json
            /tmp/qikvrt-human-review-wakeup/subject-ack-slot-after.json
            /tmp/qikvrt-human-review-wakeup/subject-ack-slots-before.json
            /tmp/qikvrt-human-review-wakeup/subject-ack-slots-after.json
            /tmp/qikvrt-human-review-wakeup/active-before.json
            /tmp/qikvrt-human-review-wakeup/active-after.json
            /tmp/qikvrt-human-review-wakeup/ledger-transition.json

      - name: Preserve canonical Shared-Core exact-review payload witness
        id: core_payload_evidence
        if: >-
          steps.review_wakeup.outputs.state == 'DISPATCH_ATTEMPT_1' ||
          steps.review_wakeup.outputs.state == 'CORE_TRANSPORT_PENDING'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.review_wakeup.outputs.core_artifact_name }}
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 90
          path: /tmp/qikvrt-human-review-wakeup/core-payload.json

  persist-review-wakeup:
    needs: plan-review-wakeup
    if: needs.plan-review-wakeup.outputs.state == 'DISPATCH_ATTEMPT_1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-review-wakeup
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    outputs:
      persisted: ${{ steps.persist.outputs.persisted }}
      ledger_head: ${{ steps.persist.outputs.ledger_head }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-review-wakeup
      REPOSITORY: ${{ github.repository }}
      PLAN_ARTIFACT: ${{ needs.plan-review-wakeup.outputs.artifact_name }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact sealed recovery evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact review wake-up ledger transition
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: /tmp/qikvrt-human-review-wakeup

      - name: Append intent or terminal state with an exact FF-CAS update
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' > /tmp/qikvrt-human-review-wakeup/ledger-write.json
          import base64, json, os, pathlib, subprocess, urllib.parse
          from tools.qikvrt_review_admission_recovery import (
              build_recovery_ledger_effect_authority_readback,
              recovery_ledger_effect_authority_readback_path,
              review_observation_queue_meta_path,
              review_observation_slot_path,
              review_wakeup_active_path,
              review_wakeup_subject_path,
              validate_review_observation_queue_meta,
              validate_review_observation_slot,
              validate_review_wakeup_active,
              validate_review_wakeup_record,
              validate_review_wakeup_subject_ack_slot,
              validate_review_wakeup_subject,
              verify_recovery_ledger_authority,
          )
          repo=os.environ['REPOSITORY']
          root=pathlib.Path('/tmp/qikvrt-human-review-wakeup')
          transition=json.loads((root/'ledger-transition.json').read_text())
          raw_before=json.loads((root/'record-before.json').read_text())
          raw_after=json.loads((root/'record-after.json').read_text())
          raw_subject_before=json.loads((root/'subject-before.json').read_text())
          raw_subject_after=json.loads((root/'subject-after.json').read_text())
          raw_subject_ack_slot_before=json.loads(
              (root/'subject-ack-slot-before.json').read_text()
          )
          raw_subject_ack_slot_after=json.loads(
              (root/'subject-ack-slot-after.json').read_text()
          )
          raw_subject_ack_slots_before=json.loads(
              (root/'subject-ack-slots-before.json').read_text()
          )
          raw_subject_ack_slots_after=json.loads(
              (root/'subject-ack-slots-after.json').read_text()
          )
          raw_active_before=json.loads((root/'active-before.json').read_text())
          raw_active_after=json.loads((root/'active-after.json').read_text())
          before=(
              validate_review_wakeup_record(raw_before)
              if raw_before is not None else None
          )
          after=validate_review_wakeup_record(raw_after)
          subject_before=(
              validate_review_wakeup_subject(raw_subject_before)
              if raw_subject_before is not None else None
          )
          subject_after=(
              validate_review_wakeup_subject(raw_subject_after)
              if raw_subject_after is not None else None
          )
          subject_ack_slot_before=(
              validate_review_wakeup_subject_ack_slot(
                  raw_subject_ack_slot_before,subject=after['fact']
              ) if raw_subject_ack_slot_before is not None else None
          )
          subject_ack_slot_after=(
              validate_review_wakeup_subject_ack_slot(
                  raw_subject_ack_slot_after,subject=after['fact']
              ) if raw_subject_ack_slot_after is not None else None
          )
          if (
              not isinstance(raw_subject_ack_slots_before,list)
              or not isinstance(raw_subject_ack_slots_after,list)
              or len(raw_subject_ack_slots_before)
                  != len(raw_subject_ack_slots_after)
              or any(item is not None for item in raw_subject_ack_slots_before)
          ):
              raise SystemExit('REVIEW_WAKEUP_SUBJECT_ACK_SLOT_BATCH_INVALID')
          subject_ack_slots_after=[]
          for item in raw_subject_ack_slots_after:
              if not isinstance(item,dict) or not isinstance(item.get('slot'),dict):
                  raise SystemExit('REVIEW_WAKEUP_SUBJECT_ACK_SLOT_BATCH_INVALID')
              slot=validate_review_wakeup_subject_ack_slot(
                  item['slot'],subject=item['slot'].get('fact')
              )
              if item.get('path') != slot['path']:
                  raise SystemExit('REVIEW_WAKEUP_SUBJECT_ACK_SLOT_PATH_DRIFT')
              subject_ack_slots_after.append({'path':item['path'],'slot':slot})
          active_before=(
              validate_review_wakeup_active(raw_active_before)
              if raw_active_before is not None else None
          )
          active_after=(
              validate_review_wakeup_active(raw_active_after)
              if raw_active_after is not None else None
          )
          observation_meta_before=validate_review_observation_queue_meta(
              transition.get('observation_queue_meta_before')
          )
          observation_sequence=transition.get('observation_sequence')
          if (
              isinstance(observation_sequence,bool)
              or not isinstance(observation_sequence,int)
              or observation_sequence < 1
              or observation_sequence
                  != observation_meta_before['drain_sequence']
          ):
              raise SystemExit('REVIEW_WAKEUP_OBSERVATION_SEQUENCE_DRIFT')
          if (
              transition.get('schema')
                  != 'qikvrt_human_review_wakeup_ledger_transition_v1'
              or transition.get('authority_boundary') != 'RECOVERY_ONLY'
              or transition.get('ledger_ref')
                  != 'qikvrt/review-wakeup-ledger-v1'
              or transition.get('record_path') != after['record_path']
              or transition.get('record_before_sha256') != (
                  before.get('record_sha256') if before else None
              )
              or transition.get('record_after_sha256')
                  != after['record_sha256']
              or transition.get('subject_before_sha256') != (
                  subject_before.get('subject_sha256')
                  if subject_before else None
              )
              or transition.get('subject_after_sha256') != (
                  subject_after.get('subject_sha256')
                  if subject_after else None
              )
              or transition.get('subject_ack_slot_before_sha256') != (
                  subject_ack_slot_before.get('slot_sha256')
                  if subject_ack_slot_before else None
              )
              or transition.get('subject_ack_slot_after_sha256') != (
                  subject_ack_slot_after.get('slot_sha256')
                  if subject_ack_slot_after else None
              )
              or transition.get('subject_ack_slot_path') != (
                  subject_ack_slot_after.get('path')
                  if subject_ack_slot_after else None
              )
              or transition.get('subject_ack_slots') != [
                  {'path':item['path'],'slot_sha256':item['slot']['slot_sha256']}
                  for item in subject_ack_slots_after
              ]
              or transition.get('subject_path') != (
                  review_wakeup_subject_path(subject_after['subject'])
                  if subject_after else None
              )
              or transition.get('active_path') != review_wakeup_active_path()
              or transition.get('active_before_sha256') != (
                  active_before.get('active_sha256') if active_before else None
              )
              or transition.get('active_after_sha256') != (
                  active_after.get('active_sha256') if active_after else None
              )
              or after['intent']['recovery_repository'] != repo
              or subprocess.check_output(
                  ['git','rev-parse','HEAD'],text=True
              ).strip() != os.environ['SEALED_EVALUATOR']
          ):
              raise SystemExit('REVIEW_WAKEUP_LEDGER_TRANSITION_DRIFT')

          def api(path,method='GET',payload=None):
              command=['gh','api',path]
              if method != 'GET': command.extend(['--method',method])
              if payload is not None: command.extend(['--input','-'])
              result=subprocess.run(
                  command,
                  input=(json.dumps(payload) if payload is not None else None),
                  text=True,capture_output=True,
              )
              if result.returncode != 0:
                  raise SystemExit('REVIEW_WAKEUP_LEDGER_API_FAILED')
              return json.loads(result.stdout) if result.stdout.strip() else {}

          ledger_ref=transition['ledger_ref']
          expected_head=transition['before_head']
          observed=subprocess.run(
              ['gh','api',f'repos/{repo}/git/ref/heads/{ledger_ref}'],
              text=True,capture_output=True,
          )
          if observed.returncode == 0:
              observed_head=json.loads(observed.stdout).get('object',{}).get('sha')
          elif 'HTTP 404' in observed.stderr:
              observed_head=''
          else:
              raise SystemExit('REVIEW_WAKEUP_LEDGER_REF_READ_FAILED')
          if observed_head != expected_head:
              raise SystemExit('REVIEW_WAKEUP_LEDGER_CAS_HEAD_DRIFT')
          def current_shard(path,validator):
              if not observed_head:
                  return None
              encoded=urllib.parse.quote(observed_head,safe='')
              result=subprocess.run([
                  'gh','api',f'repos/{repo}/contents/{path}?ref={encoded}'
              ],text=True,capture_output=True)
              if result.returncode == 0:
                  content=json.loads(result.stdout)
                  return validator(json.loads(
                      base64.b64decode(content['content']).decode('utf-8')
                  ))
              if 'HTTP 404' in result.stderr:
                  return None
              raise SystemExit('REVIEW_WAKEUP_LEDGER_CAS_SHARD_READ_FAILED')

          if current_shard(
              transition['record_path'],validate_review_wakeup_record
          ) != before:
              raise SystemExit('REVIEW_WAKEUP_LEDGER_CAS_RECORD_DRIFT')
          if transition.get('subject_path') and current_shard(
              transition['subject_path'],validate_review_wakeup_subject
          ) != subject_before:
              raise SystemExit('REVIEW_WAKEUP_LEDGER_CAS_SUBJECT_DRIFT')
          if transition.get('subject_ack_slot_path') and current_shard(
              transition['subject_ack_slot_path'],
              lambda value: validate_review_wakeup_subject_ack_slot(
                  value,subject=after['fact']
              ),
          ) != subject_ack_slot_before:
              raise SystemExit('REVIEW_WAKEUP_LEDGER_CAS_SUBJECT_ACK_DRIFT')
          for item in subject_ack_slots_after:
              if current_shard(
                  item['path'],
                  lambda value, exact=item['slot']['fact']:
                      validate_review_wakeup_subject_ack_slot(
                          value,subject=exact
                      ),
              ) is not None:
                  raise SystemExit('REVIEW_WAKEUP_LEDGER_CAS_SUBJECT_ACK_DRIFT')
          if current_shard(
              transition['active_path'],validate_review_wakeup_active
          ) != active_before:
              raise SystemExit('REVIEW_WAKEUP_LEDGER_CAS_ACTIVE_DRIFT')
          current_observation_meta=current_shard(
              review_observation_queue_meta_path(),
              validate_review_observation_queue_meta,
          )
          current_observation_slot=current_shard(
              review_observation_slot_path(observation_sequence),
              validate_review_observation_slot,
          )
          if (
              current_observation_meta != observation_meta_before
              or current_observation_slot is None
              or current_observation_slot.get('slot_sha256')
                  != transition.get('observation_slot_sha256')
              or current_observation_slot.get('fact_fingerprint')
                  != after['fact_fingerprint']
          ):
              raise SystemExit('REVIEW_WAKEUP_OBSERVATION_QUEUE_DRIFT')

          main=api(f'repos/{repo}/commits/main')
          if main.get('sha') != os.environ['SEALED_EVALUATOR']:
              raise SystemExit('REVIEW_WAKEUP_LEDGER_EVALUATOR_SUPERSEDED')
          current_effect=api(
              f"repos/{repo}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
          )
          actor=os.environ.get('EXPECTED_LEDGER_WRITER_ACTOR_ID','')
          if (
              not actor.isdigit() or int(actor) < 1
              or current_effect.get('head_sha') != os.environ['SEALED_EVALUATOR']
              or not isinstance(current_effect.get('run_started_at'),str)
          ):
              raise SystemExit('RECOVERY_LEDGER_EFFECT_AUTHORITY_DRIFT')
          authority=verify_recovery_ledger_authority(
              lane='review-wakeup',repository=repo,
              writer_actor_id=int(actor),
              writer_group=os.environ.get('QIKVRT_OUTBOX_WRITER_GROUP',''),
              api=lambda path: api(path),
          )
          effect_authority=build_recovery_ledger_effect_authority_readback(
              authority,lane='review-wakeup',
              evaluator_sha=os.environ['SEALED_EVALUATOR'],
              effect_run_id=int(os.environ['GITHUB_RUN_ID']),
              effect_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              effect_run_started_at=current_effect['run_started_at'],
          )
          parent=observed_head or main['sha']
          parent_commit=api(f'repos/{repo}/git/commits/{parent}')
          def blob_for(value):
              encoded_value=base64.b64encode(
                  (json.dumps(value,sort_keys=True,indent=2)+'\n').encode('utf-8')
              ).decode('ascii')
              return api(f'repos/{repo}/git/blobs','POST',{
                  'content':encoded_value,'encoding':'base64',
              })['sha']

          authority_path=recovery_ledger_effect_authority_readback_path(
              effect_authority,lane='review-wakeup'
          )
          expected_files={
              transition['record_path']:after,
              authority_path:effect_authority,
          }
          expected_deleted=set()
          tree_entries=[{
              'path':transition['record_path'],'mode':'100644',
              'type':'blob','sha':blob_for(after),
          },{
              'path':authority_path,'mode':'100644','type':'blob',
              'sha':blob_for(effect_authority),
          }]
          if subject_after is not None:
              expected_files[transition['subject_path']]=subject_after
              tree_entries.append({
                  'path':transition['subject_path'],'mode':'100644',
                  'type':'blob','sha':blob_for(subject_after),
              })
          if subject_ack_slot_after is not None:
              expected_files[
                  transition['subject_ack_slot_path']
              ]=subject_ack_slot_after
              tree_entries.append({
                  'path':transition['subject_ack_slot_path'],
                  'mode':'100644','type':'blob',
                  'sha':blob_for(subject_ack_slot_after),
              })
          for item in subject_ack_slots_after:
              expected_files[item['path']]=item['slot']
              tree_entries.append({
                  'path':item['path'],'mode':'100644','type':'blob',
                  'sha':blob_for(item['slot']),
              })
          if active_after is not None:
              expected_files[transition['active_path']]=active_after
              tree_entries.append({
                  'path':transition['active_path'],'mode':'100644',
                  'type':'blob','sha':blob_for(active_after),
              })
          elif active_before is not None:
              expected_deleted.add(transition['active_path'])
              tree_entries.append({
                  'path':transition['active_path'],'mode':'100644',
                  'type':'blob','sha':None,
              })
          if transition.get('drain_observation') is True:
              observation_meta_after=dict(observation_meta_before)
              observation_meta_after['drain_sequence']=observation_sequence+1
              expected_files[
                  review_observation_queue_meta_path()
              ]=observation_meta_after
              tree_entries.append({
                  'path':review_observation_queue_meta_path(),
                  'mode':'100644','type':'blob',
                  'sha':blob_for(observation_meta_after),
              })
          tree=api(f'repos/{repo}/git/trees','POST',{
              'base_tree':parent_commit['tree']['sha'],
              'tree':tree_entries,
          })
          commit=api(f'repos/{repo}/git/commits','POST',{
              'message':(
                  'Record review wake-up recovery transition '
                  + str(transition.get('fact_fingerprint') or 'terminal')[:16]
              ),
              'tree':tree['sha'],'parents':[parent],
          })
          if not observed_head:
              raise SystemExit(
                  'REVIEW_WAKEUP_REF_MISSING_NO_SILENT_REINITIALIZATION'
              )
          api(
              f'repos/{repo}/git/refs/heads/{ledger_ref}','PATCH',
              {'sha':commit['sha'],'force':False},
          )
          readback=api(f'repos/{repo}/git/ref/heads/{ledger_ref}')
          readback_commit=api(f"repos/{repo}/git/commits/{commit['sha']}")
          if (
              readback.get('object',{}).get('sha') != commit['sha']
              or readback_commit.get('tree',{}).get('sha') != tree['sha']
              or [item.get('sha') for item in readback_commit.get('parents',[])]
                  != [parent]
          ):
              raise SystemExit('REVIEW_WAKEUP_LEDGER_CAS_READBACK_DIFFERS')
          encoded_commit=urllib.parse.quote(commit['sha'],safe='')
          for item_path,item_value in expected_files.items():
              encoded_path=urllib.parse.quote(item_path,safe='/')
              content=api(
                  f'repos/{repo}/contents/{encoded_path}?ref={encoded_commit}'
              )
              if (
                  content.get('type') != 'file'
                  or content.get('encoding') != 'base64'
                  or json.loads(base64.b64decode(content['content']))
                      != item_value
              ):
                  raise SystemExit('REVIEW_WAKEUP_FILE_READBACK_DIFFERS')
          for item_path in expected_deleted:
              encoded_path=urllib.parse.quote(item_path,safe='/')
              deleted=subprocess.run([
                  'gh','api',
                  f'repos/{repo}/contents/{encoded_path}?ref={encoded_commit}',
              ],text=True,capture_output=True)
              if deleted.returncode == 0 or 'HTTP 404' not in deleted.stderr:
                  raise SystemExit('REVIEW_WAKEUP_DELETE_READBACK_DIFFERS')
          print(json.dumps({
              'schema':'qikvrt_human_review_wakeup_ledger_write_v1',
              'before_head':observed_head,'ledger_head':commit['sha'],
              'record_path':after['record_path'],
              'record_sha256':after['record_sha256'],
              'subject_path':transition.get('subject_path'),
              'subject_sha256':(
                  subject_after.get('subject_sha256') if subject_after else None
              ),
              'active_path':transition['active_path'],
              'active_sha256':(
                  active_after.get('active_sha256') if active_after else None
              ),
              'state':transition['state'],'authority_boundary':'RECOVERY_ONLY',
              'native_account_review_authorized':False,
              'completion_claims':{
                  'PASS':False,'FINAL_PASS':False,
                  'EFFECT_ACK_DONE':False,'MERGE':False,
              },
          },sort_keys=True,indent=2))
          PY
          cat /tmp/qikvrt-human-review-wakeup/ledger-write.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('/tmp/qikvrt-human-review-wakeup/ledger-write.json'))
          print('persisted=true')
          print(f"ledger_head={value['ledger_head']}")
          PY

  observe-review-wakeup-core:
    name: Adopt exact Shared-Core wake-up transport locator
    needs: [plan-review-wakeup, persist-review-wakeup]
    if: >-
      always() &&
      needs.plan-review-wakeup.outputs.dispatch == 'true' &&
      (needs.plan-review-wakeup.outputs.state == 'CORE_TRANSPORT_PENDING' ||
       needs.persist-review-wakeup.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-review-wakeup-core-observer
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.classify.outputs.state }}
      enqueue_required: ${{ steps.classify.outputs.enqueue_required }}
      artifact_name: ${{ steps.classify.outputs.artifact_name }}
      artifact_id: ${{ steps.core_resolution.outputs.artifact-id }}
      artifact_digest: ${{ steps.core_resolution.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PLAN_ARTIFACT: ${{ needs.plan-review-wakeup.outputs.artifact_name }}
      CORE_FINGERPRINT: ${{ needs.plan-review-wakeup.outputs.core_fingerprint }}
    steps:
      - name: Check out the exact sealed recovery evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact custom wake-up locator plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: /tmp/qikvrt-human-review-wakeup

      - name: Read exact Core fingerprint with Auditor-only authority
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-human-review-wakeup
          auditor_token="${LEDGER_AUDITOR_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$auditor_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          if QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$auditor_token" \
             QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
             python3 -B tools/qikvrt_ruleset_outbox.py \
               --repository "$REPOSITORY" --receipt "$root/core-lookup.json" \
               lookup-fingerprint --lane exact-review-dispatch \
               --fingerprint "$CORE_FINGERPRINT" \
               >"$root/core-lookup.stdout" 2>"$root/core-lookup.stderr"; then
            :
          elif grep -Fq 'OUTBOX_FINGERPRINT_NOT_FOUND' "$root/core-lookup.stderr"; then
            printf '{"lookup_state":"NOT_FOUND"}\n' > "$root/core-lookup.json"
          else
            sed -n '1,40p' "$root/core-lookup.stderr" >&2
            exit 1
          fi
          unset auditor_token

      - name: Bind accepted Core A1 or request one idempotent enqueue
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-human-review-wakeup
          live_main="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/commits/main" --jq '.sha')"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/git/ref/heads/qikvrt/review-wakeup-ledger-v1" \
            --jq '.object.sha' > "$root/custom-ledger-head.txt"
          python3 -B - "$live_main" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, sys
          from tools.qikvrt_review_admission_recovery import (
              build_review_wakeup_ack,
              build_review_wakeup_core_resolution,
              validate_review_wakeup_core_payload,
              validate_review_wakeup_intent,
              validate_review_wakeup_producer_binding,
          )
          root=pathlib.Path('/tmp/qikvrt-human-review-wakeup')
          intent=validate_review_wakeup_intent(json.loads(
              (root/'intent.json').read_text()
          ))
          binding=validate_review_wakeup_producer_binding(
              intent,json.loads((root/'wakeup-producer-binding.json').read_text())
          )
          payload=validate_review_wakeup_core_payload(
              json.loads((root/'core-payload.json').read_text()),intent
          )
          lookup=json.loads((root/'core-lookup.json').read_text())
          (root/'wakeup-ack.json').write_text('null\n')
          state=lookup.get('lookup_state') or lookup.get('state')
          resolution='WAIT_CORE'
          enqueue=False
          resolution_value=None
          if state == 'NOT_FOUND':
              # A PR/review can move while the evaluator remains current.  The
              # historical semantic unit must still be enqueued: Shared Core's
              # exact pre-effect fence will terminalize a stale subject without
              # authorizing a child POST.  Local supersession is safe only once
              # main/evaluator drift makes that enqueue impossible.
              if sys.argv[1] == intent['requested_workflow_sha']:
                  resolution='ENQUEUE_CORE'
                  enqueue=True
              else:
                  resolution='SUPERSEDED_NO_CORE_RECORD'
                  resolution_value=build_review_wakeup_core_resolution(
                      intent,payload,lookup,observed_main_sha=sys.argv[1]
                  )
          elif state not in {'QUEUED','PENDING','TERMINAL'}:
              raise SystemExit('REVIEW_WAKEUP_CORE_LOOKUP_STATE_INVALID')
          else:
              acceptance=lookup.get('acceptance')
              accepted=acceptance.get('1') if isinstance(acceptance,dict) else None
              if accepted is not None:
                  ack=build_review_wakeup_ack(
                      intent,binding,payload,lookup,current_main_sha=sys.argv[1]
                  )
                  (root/'wakeup-ack.json').write_text(
                      json.dumps(ack,sort_keys=True,indent=2)+'\n'
                  )
                  resolution='ACCEPTED'
              elif state == 'TERMINAL':
                  resolution='CORE_TERMINAL_NO_ACCEPTANCE'
                  resolution_value=build_review_wakeup_core_resolution(
                      intent,payload,lookup,observed_main_sha=sys.argv[1]
                  )
          (root/'core-resolution.json').write_text(
              json.dumps(resolution_value,sort_keys=True,indent=2)+'\n'
          )
          artifact=(
              f"qikvrt-review-wakeup-core-resolution-"
              f"{intent['fact_fingerprint']}-run-{os.environ['GITHUB_RUN_ID']}-"
              f"attempt-{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          print(f"state={resolution}")
          print(f"enqueue_required={str(enqueue).lower()}")
          print(f"artifact_name={artifact}")
          PY

      - name: Preserve exact Core lookup and locator-only ACK
        id: core_resolution
        if: >-
          steps.classify.outputs.state == 'ACCEPTED' ||
          steps.classify.outputs.state == 'SUPERSEDED_NO_CORE_RECORD' ||
          steps.classify.outputs.state == 'CORE_TERMINAL_NO_ACCEPTANCE'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.classify.outputs.artifact_name }}
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/qikvrt-human-review-wakeup/intent.json
            /tmp/qikvrt-human-review-wakeup/wakeup-producer-binding.json
            /tmp/qikvrt-human-review-wakeup/core-payload.json
            /tmp/qikvrt-human-review-wakeup/core-lookup.json
            /tmp/qikvrt-human-review-wakeup/core-resolution.json
            /tmp/qikvrt-human-review-wakeup/custom-ledger-head.txt
            /tmp/qikvrt-human-review-wakeup/wakeup-ack.json

  enqueue-review-wakeup-core:
    name: Enqueue one Shared-Core exact-review wake-up witness
    needs: [plan-review-wakeup, persist-review-wakeup, observe-review-wakeup-core]
    if: >-
      always() &&
      needs.observe-review-wakeup-core.outputs.enqueue_required == 'true' &&
      (needs.plan-review-wakeup.outputs.state == 'CORE_TRANSPORT_PENDING' ||
       needs.persist-review-wakeup.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-exact-review-dispatch
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CORE_ARTIFACT_NAME: ${{ needs.plan-review-wakeup.outputs.core_artifact_name }}
      CORE_ARTIFACT_ID: ${{ needs.plan-review-wakeup.outputs.core_artifact_id }}
      CORE_ARTIFACT_DIGEST: ${{ needs.plan-review-wakeup.outputs.core_artifact_digest }}
      CORE_FINGERPRINT: ${{ needs.plan-review-wakeup.outputs.core_fingerprint }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-exact-review-dispatch
    steps:
      - name: Check out the exact sealed recovery evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact canonical Core payload witness
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.CORE_ARTIFACT_NAME }}
          path: /tmp/qikvrt-review-wakeup-core

      - name: Reobserve exact payload artifact owner and archive
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-review-wakeup-core
          [[ "$CORE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CORE_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          artifact="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/actions/artifacts/${CORE_ARTIFACT_ID}")"
          jq -e --argjson id "$CORE_ARTIFACT_ID" --arg name "$CORE_ARTIFACT_NAME" \
            --arg digest "sha256:${CORE_ARTIFACT_DIGEST#sha256:}" --argjson run_id "$GITHUB_RUN_ID" \
            --arg head "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $head
          ' <<<"$artifact" >/dev/null
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/actions/artifacts/${CORE_ARTIFACT_ID}/zip" \
            > "$root/payload.zip"
          test "$(sha256sum "$root/payload.zip" | awk '{print $1}')" = \
            "${CORE_ARTIFACT_DIGEST#sha256:}"
          mapfile -t entries < <(unzip -Z1 "$root/payload.zip")
          test "${#entries[@]}" -eq 1
          test "${entries[0]}" = core-payload.json
          unzip -p "$root/payload.zip" core-payload.json > "$root/archive-core-payload.json"
          cmp "$root/archive-core-payload.json" "$root/core-payload.json"
          python3 -B - <<'PY'
          import json, os, pathlib
          from tools.qikvrt_review_admission_recovery import (
              review_wakeup_core_fingerprint,
              validate_review_wakeup_core_payload,
              validate_review_wakeup_intent,
          )
          root=pathlib.Path('/tmp/qikvrt-review-wakeup-core')
          # The exact custom intent is not in this single-file artifact; the
          # payload itself is fully validated again by Shared Core's enqueue.
          payload=json.loads((root/'core-payload.json').read_text())
          if (
              payload.get('lane') != 'exact-review-dispatch'
              or payload.get('repository') != os.environ['REPOSITORY']
              or payload.get('request',{}).get('inputs',{}).get(
                  'transport_intent_sha256'
              ) != os.environ['CORE_FINGERPRINT']
          ):
              raise SystemExit('REVIEW_WAKEUP_CORE_PAYLOAD_BINDING_DRIFT')
          PY

      - name: Enqueue Shared-Core witness CAS only
        id: enqueue
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-review-wakeup-core
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" --receipt "$root/enqueue.json" \
              enqueue --lane exact-review-dispatch \
              --payload "$root/core-payload.json" \
              --artifact-id "$CORE_ARTIFACT_ID" \
              --artifact-name "$CORE_ARTIFACT_NAME" \
              --artifact-digest "${CORE_ARTIFACT_DIGEST#sha256:}" >/dev/null
          jq -e --arg fingerprint "$CORE_FINGERPRINT" '
            .fingerprint == $fingerprint and .lane == "exact-review-dispatch" and
            (.sequence | type) == "number" and .sequence > 0 and
            .ledger_ref == "refs/heads/qikvrt/outbox-ledger-v2/exact-review-dispatch" and
            (.ledger_head | test("^[0-9a-f]{40}$")) and
            .cas.persisted == true
          ' "$root/enqueue.json" >/dev/null
          unset writer_token

      - name: Preserve Shared-Core enqueue readback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-review-wakeup-core-enqueue-${{ env.CORE_FINGERPRINT }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 90
          path: /tmp/qikvrt-review-wakeup-core/enqueue.json

  persist-review-wakeup-ack:
    needs:
      - plan-review-wakeup
      - persist-review-wakeup
      - observe-review-wakeup-core
    if: >-
      always() &&
      (needs.observe-review-wakeup-core.outputs.state == 'ACCEPTED' ||
       needs.observe-review-wakeup-core.outputs.state == 'SUPERSEDED_NO_CORE_RECORD' ||
       needs.observe-review-wakeup-core.outputs.state == 'CORE_TERMINAL_NO_ACCEPTANCE') &&
      (needs.plan-review-wakeup.outputs.state == 'CORE_TRANSPORT_PENDING' ||
       needs.persist-review-wakeup.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-review-wakeup
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-review-wakeup
      REPOSITORY: ${{ github.repository }}
      FACT_FINGERPRINT: ${{ needs.plan-review-wakeup.outputs.fingerprint }}
      ACK_ARTIFACT: ${{ needs.observe-review-wakeup-core.outputs.artifact_name }}
      ACK_ARTIFACT_ID: ${{ needs.observe-review-wakeup-core.outputs.artifact_id }}
      ACK_ARTIFACT_DIGEST: ${{ needs.observe-review-wakeup-core.outputs.artifact_digest }}
      CORE_RESOLUTION_STATE: ${{ needs.observe-review-wakeup-core.outputs.state }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact sealed recovery evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact child ACK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.ACK_ARTIFACT }}
          path: /tmp/qikvrt-human-review-wakeup

      - name: Reobserve exact Core resolution artifact owner and archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-human-review-wakeup
          [[ "$ACK_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ACK_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          artifact="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/actions/artifacts/${ACK_ARTIFACT_ID}")"
          jq -e --argjson id "$ACK_ARTIFACT_ID" --arg name "$ACK_ARTIFACT" \
            --arg digest "sha256:${ACK_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg head "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $head
          ' <<<"$artifact" >/dev/null
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/actions/artifacts/${ACK_ARTIFACT_ID}/zip" \
            > "$root/core-resolution.zip"
          test "$(sha256sum "$root/core-resolution.zip" | awk '{print $1}')" = \
            "${ACK_ARTIFACT_DIGEST#sha256:}"
          python3 -B - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('/tmp/qikvrt-human-review-wakeup')
          expected={
              'intent.json','wakeup-producer-binding.json','core-payload.json',
              'core-lookup.json','core-resolution.json',
              'custom-ledger-head.txt','wakeup-ack.json',
          }
          with zipfile.ZipFile(root/'core-resolution.zip') as archive:
              if set(archive.namelist()) != expected:
                  raise SystemExit('REVIEW_WAKEUP_ACK_ARTIFACT_INVENTORY_DRIFT')
              for name in expected:
                  if archive.read(name) != (root/name).read_bytes():
                      raise SystemExit('REVIEW_WAKEUP_ACK_ARTIFACT_BYTES_DRIFT')
          PY

      - name: Append exact ACK with an FF-CAS update
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' > /tmp/qikvrt-human-review-wakeup/ledger-ack-write.json
          import base64, json, os, pathlib, subprocess, urllib.parse
          from tools.qikvrt_review_admission_recovery import (
              bind_review_wakeup_active_record,
              build_recovery_ledger_effect_authority_readback,
              build_review_wakeup_terminal,
              build_review_wakeup_terminal_binding,
              build_review_wakeup_subject_ack_transition,
              record_review_wakeup_ack,
              record_review_wakeup_terminal,
              recovery_ledger_effect_authority_readback_path,
              review_wakeup_active_path,
              review_wakeup_record_path,
              review_wakeup_subject_path,
              review_observation_queue_meta_path,
              review_observation_slot_path,
              validate_review_wakeup_ack,
              validate_review_wakeup_core_resolution,
              validate_review_observation_queue_meta,
              validate_review_observation_slot,
              validate_review_wakeup_active,
              validate_review_wakeup_intent,
              validate_review_wakeup_record,
              validate_review_wakeup_subject,
              verify_recovery_ledger_authority,
          )
          from tools.qikvrt_ruleset_outbox import digest as core_digest
          repo=os.environ['REPOSITORY']
          root=pathlib.Path('/tmp/qikvrt-human-review-wakeup')

          def api(path,method='GET',payload=None):
              command=['gh','api',path]
              if method != 'GET': command.extend(['--method',method])
              if payload is not None: command.extend(['--input','-'])
              result=subprocess.run(
                  command,
                  input=(json.dumps(payload) if payload is not None else None),
                  text=True,capture_output=True,
              )
              if result.returncode != 0:
                  raise SystemExit('REVIEW_WAKEUP_ACK_LEDGER_API_FAILED')
              return json.loads(result.stdout) if result.stdout.strip() else {}

          intent=validate_review_wakeup_intent(json.loads(
              (root/'intent.json').read_text()
          ))
          binding=json.loads((root/'wakeup-producer-binding.json').read_text())
          core_payload=json.loads((root/'core-payload.json').read_text())
          core_lookup=json.loads((root/'core-lookup.json').read_text())
          ack=json.loads((root/'wakeup-ack.json').read_text())
          resolution_state=os.environ['CORE_RESOLUTION_STATE']
          exact_ack=None
          terminal_receipt=None
          terminal_binding=None
          if resolution_state == 'ACCEPTED':
              exact_ack=validate_review_wakeup_ack(
                  ack,intent,binding,core_payload,core_lookup,
                  current_main_sha=intent['requested_workflow_sha'],
              )
              core_authority=exact_ack['child_proof']['core_authority']
              core_head=urllib.parse.quote(core_authority['ledger_head'],safe='')
              for path_field,digest_field in (
                  ('intent_path','intent_sha256'),
                  ('transport_path','transport_sha256'),
                  ('acceptance_path','acceptance_sha256'),
              ):
                  path=urllib.parse.quote(core_authority[path_field],safe='/')
                  content=api(
                      f'repos/{repo}/contents/{path}?ref={core_head}'
                  )
                  if (
                      content.get('type') != 'file'
                      or content.get('encoding') != 'base64'
                  ):
                      raise SystemExit('REVIEW_WAKEUP_CORE_LOCATOR_READBACK_MISSING')
                  value=json.loads(base64.b64decode(content['content']))
                  if core_digest(value) != core_authority[digest_field]:
                      raise SystemExit('REVIEW_WAKEUP_CORE_LOCATOR_READBACK_DRIFT')
          else:
              core_resolution=validate_review_wakeup_core_resolution(
                  json.loads((root/'core-resolution.json').read_text()),
                  intent,core_payload,core_lookup,
              )
              if core_resolution['state'] != resolution_state:
                  raise SystemExit('REVIEW_WAKEUP_CORE_RESOLUTION_STATE_DRIFT')
              if resolution_state == 'CORE_TERMINAL_NO_ACCEPTANCE':
                  core_head=urllib.parse.quote(
                      core_resolution['ledger_head'],safe=''
                  )
                  terminal_path=urllib.parse.quote(
                      core_resolution['terminal_path'],safe='/'
                  )
                  content=api(
                      f'repos/{repo}/contents/{terminal_path}?ref={core_head}'
                  )
                  if (
                      content.get('type') != 'file'
                      or content.get('encoding') != 'base64'
                  ):
                      raise SystemExit(
                          'REVIEW_WAKEUP_CORE_TERMINAL_READBACK_MISSING'
                      )
                  terminal_value=json.loads(base64.b64decode(content['content']))
                  if core_digest(terminal_value) != core_resolution['terminal_sha256']:
                      raise SystemExit(
                          'REVIEW_WAKEUP_CORE_TERMINAL_READBACK_DRIFT'
                      )
              blocker=(
                  'REQUESTED_REVIEW_WAKEUP_TRANSITION_SUPERSEDED'
                  if resolution_state == 'SUPERSEDED_NO_CORE_RECORD'
                  else 'SHARED_CORE_EXACT_REVIEW_TERMINAL_WITHOUT_ACCEPTANCE'
              )
              terminal_receipt=build_review_wakeup_terminal(
                  intent,transport_attempts={1},first_blocker=blocker,
                  core_resolution=core_resolution,
              )
              terminal_binding=build_review_wakeup_terminal_binding(
                  terminal_receipt,intent,
                  recovery_run_id=int(os.environ['GITHUB_RUN_ID']),
                  recovery_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
                  terminalizer_workflow_sha=os.environ['SEALED_EVALUATOR'],
              )
          if (
              intent['fact_fingerprint'] != os.environ['FACT_FINGERPRINT']
              or subprocess.check_output(
                  ['git','rev-parse','HEAD'],text=True
              ).strip() != os.environ['SEALED_EVALUATOR']
          ):
              raise SystemExit('REVIEW_WAKEUP_ACK_EVALUATOR_DRIFT')

          ledger_ref='qikvrt/review-wakeup-ledger-v1'
          observed=api(f'repos/{repo}/git/ref/heads/{ledger_ref}')
          observed_head=observed.get('object',{}).get('sha')
          expected_ledger_head=(root/'custom-ledger-head.txt').read_text().strip()
          if observed_head != expected_ledger_head:
              raise SystemExit('REVIEW_WAKEUP_ACK_LEDGER_HEAD_DRIFT')
          encoded=urllib.parse.quote(observed_head,safe='')
          record_path=review_wakeup_record_path(intent['fact_fingerprint'])
          content=api(f'repos/{repo}/contents/{record_path}?ref={encoded}')
          before=validate_review_wakeup_record(json.loads(
              base64.b64decode(content['content']).decode('utf-8')
          ))
          active_path=review_wakeup_active_path()
          active_content=api(f'repos/{repo}/contents/{active_path}?ref={encoded}')
          active=validate_review_wakeup_active(json.loads(
              base64.b64decode(active_content['content']).decode('utf-8')
          ))
          bind_review_wakeup_active_record(active,before)
          after=(
              record_review_wakeup_ack(before,exact_ack)
              if exact_ack is not None
              else record_review_wakeup_terminal(
                  before,terminal_receipt,terminal_binding
              )
          )
          observation_meta_content=api(
              f'repos/{repo}/contents/{review_observation_queue_meta_path()}?ref={encoded}'
          )
          observation_meta=validate_review_observation_queue_meta(json.loads(
              base64.b64decode(observation_meta_content['content']).decode('utf-8')
          ))
          observation_sequence=observation_meta['drain_sequence']
          observation_slot_content=api(
              f'repos/{repo}/contents/{review_observation_slot_path(observation_sequence)}?ref={encoded}'
          )
          observation_slot=validate_review_observation_slot(json.loads(
              base64.b64decode(observation_slot_content['content']).decode('utf-8')
          ))
          if (
              observation_sequence >= observation_meta['next_sequence']
              or observation_slot['fact_fingerprint']
                  != intent['fact_fingerprint']
          ):
              raise SystemExit('REVIEW_WAKEUP_ACK_OBSERVATION_QUEUE_DRIFT')
          observation_meta_after=dict(observation_meta)
          observation_meta_after['drain_sequence']=observation_sequence+1
          subject_path=None
          subject_before=None
          subject_after=None
          subject_ack_slots=[]
          if exact_ack is not None:
              subject_path=review_wakeup_subject_path(intent['fact'])
              subject_result=subprocess.run([
                  'gh','api',f'repos/{repo}/contents/{subject_path}?ref={encoded}'
              ],text=True,capture_output=True)
              if subject_result.returncode == 0:
                  subject_content=json.loads(subject_result.stdout)
                  subject_before=validate_review_wakeup_subject(json.loads(
                      base64.b64decode(subject_content['content']).decode('utf-8')
                  ))
              elif 'HTTP 404' in subject_result.stderr:
                  subject_before=None
              else:
                  raise SystemExit('REVIEW_WAKEUP_ACK_SUBJECT_READ_FAILED')
              subject_after=subject_before
              for covered_fact in observation_slot['covered_facts']:
                  subject_ack=build_review_wakeup_subject_ack_transition(
                      subject_after,{'fact':covered_fact}
                  )
                  subject_after=subject_ack['subject_after']
                  if subject_ack['slot'] is not None:
                      subject_ack_slots.append({
                          'path':subject_ack['slot_path'],
                          'slot':subject_ack['slot'],
                      })
          current_effect=api(
              f"repos/{repo}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
          )
          actor=os.environ.get('EXPECTED_LEDGER_WRITER_ACTOR_ID','')
          if (
              not actor.isdigit() or int(actor) < 1
              or current_effect.get('head_sha') != os.environ['SEALED_EVALUATOR']
              or not isinstance(current_effect.get('run_started_at'),str)
          ):
              raise SystemExit('RECOVERY_LEDGER_EFFECT_AUTHORITY_DRIFT')
          authority=verify_recovery_ledger_authority(
              lane='review-wakeup',repository=repo,
              writer_actor_id=int(actor),
              writer_group=os.environ.get('QIKVRT_OUTBOX_WRITER_GROUP',''),
              api=lambda path: api(path),
          )
          effect_authority=build_recovery_ledger_effect_authority_readback(
              authority,lane='review-wakeup',
              evaluator_sha=os.environ['SEALED_EVALUATOR'],
              effect_run_id=int(os.environ['GITHUB_RUN_ID']),
              effect_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              effect_run_started_at=current_effect['run_started_at'],
          )
          parent_commit=api(f'repos/{repo}/git/commits/{observed_head}')
          def blob_for(value):
              encoded_value=base64.b64encode(
                  (json.dumps(value,sort_keys=True,indent=2)+'\n').encode('utf-8')
              ).decode('ascii')
              return api(f'repos/{repo}/git/blobs','POST',{
                  'content':encoded_value,'encoding':'base64',
              })['sha']
          authority_path=recovery_ledger_effect_authority_readback_path(
              effect_authority,lane='review-wakeup'
          )
          expected_files={
              record_path:after,
              authority_path:effect_authority,
              review_observation_queue_meta_path():observation_meta_after,
          }
          if subject_path is not None:
              expected_files[subject_path]=subject_after
          for item in subject_ack_slots:
              expected_files[item['path']]=item['slot']
          tree_entries=[
              {
                  'path':record_path,'mode':'100644',
                  'type':'blob','sha':blob_for(after),
              },
              *([{
                  'path':subject_path,'mode':'100644',
                  'type':'blob','sha':blob_for(subject_after),
              }] if subject_path is not None else []),
              *[{
                  'path':item['path'],'mode':'100644',
                  'type':'blob','sha':blob_for(item['slot']),
              } for item in subject_ack_slots],
              {
                  'path':authority_path,'mode':'100644','type':'blob',
                  'sha':blob_for(effect_authority),
              },
              {
                  'path':active_path,'mode':'100644',
                  'type':'blob','sha':None,
              },
              {
                  'path':review_observation_queue_meta_path(),
                  'mode':'100644','type':'blob',
                  'sha':blob_for(observation_meta_after),
              },
          ]
          tree=api(f'repos/{repo}/git/trees','POST',{
              'base_tree':parent_commit['tree']['sha'],
              'tree':tree_entries,
          })
          transition_label=(
              'Acknowledge review wake-up transport'
              if exact_ack is not None
              else 'Terminalize review wake-up transport'
          )
          commit=api(f'repos/{repo}/git/commits','POST',{
              'message':transition_label+' '+intent['fact_fingerprint'][:16],
              'tree':tree['sha'],'parents':[observed_head],
          })
          api(f'repos/{repo}/git/refs/heads/{ledger_ref}','PATCH',{
              'sha':commit['sha'],'force':False,
          })
          readback=api(f'repos/{repo}/git/ref/heads/{ledger_ref}')
          readback_commit=api(f"repos/{repo}/git/commits/{commit['sha']}")
          if (
              readback.get('object',{}).get('sha') != commit['sha']
              or readback_commit.get('tree',{}).get('sha') != tree['sha']
              or [item.get('sha') for item in readback_commit.get('parents',[])]
                  != [observed_head]
          ):
              raise SystemExit('REVIEW_WAKEUP_ACK_LEDGER_READBACK_DIFFERS')
          encoded_commit=urllib.parse.quote(commit['sha'],safe='')
          for item_path,item_value in expected_files.items():
              encoded_path=urllib.parse.quote(item_path,safe='/')
              content=api(
                  f'repos/{repo}/contents/{encoded_path}?ref={encoded_commit}'
              )
              if (
                  content.get('type') != 'file'
                  or content.get('encoding') != 'base64'
                  or json.loads(base64.b64decode(content['content']))
                      != item_value
              ):
                  raise SystemExit(
                      'REVIEW_WAKEUP_ACK_FILE_READBACK_DIFFERS'
                  )
          encoded_active=urllib.parse.quote(active_path,safe='/')
          deleted=subprocess.run([
              'gh','api',
              f'repos/{repo}/contents/{encoded_active}?ref={encoded_commit}',
          ],text=True,capture_output=True)
          if deleted.returncode == 0 or 'HTTP 404' not in deleted.stderr:
              raise SystemExit('REVIEW_WAKEUP_ACK_DELETE_READBACK_DIFFERS')
          output={
              'schema':'qikvrt_human_review_wakeup_ledger_ack_write_v1',
              'before_head':observed_head,'ledger_head':commit['sha'],
              'record_path':record_path,
              'record_sha256':after['record_sha256'],
              'subject_path':subject_path,
              'subject_sha256':(
                  subject_after['subject_sha256']
                  if subject_after is not None else None
              ),
              'active_path':active_path,'active_cleared':True,
              'fact_fingerprint':intent['fact_fingerprint'],
              'transport_ack':(
                  'ACCEPTED_PENDING_REOBSERVATION'
                  if exact_ack is not None else None
              ),
              'terminal_receipt_sha256':(
                  terminal_receipt['receipt_sha256']
                  if terminal_receipt is not None else None
              ),
              'core_resolution_state':resolution_state,
              'authority_boundary':'RECOVERY_ONLY',
              'native_account_review_authorized':False,
              'completion_claims':{
                  'PASS':False,'FINAL_PASS':False,
                  'EFFECT_ACK_DONE':False,'MERGE':False,
              },
          }
          print(json.dumps(output,sort_keys=True,indent=2))
          PY
          cat /tmp/qikvrt-human-review-wakeup/ledger-ack-write.json
