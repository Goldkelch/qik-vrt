name: QIKVRT review admission recovery
run-name: QIKVRT review admission recovery-v1 source=${{ github.event.workflow_run.id || 'scheduled' }}

on:
  workflow_run:
    workflows:
      - "QIKVRT requested review executor"
      - "QIKVRT required code-owner review"
    types: [completed]
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    qikvrt-review-admission-recovery-${{ github.repository }}-${{
      github.event_name == 'workflow_run' && 'event-ingest' || 'scheduled-recovery'
    }}
  cancel-in-progress: false
  queue: max

jobs:
  read-shared-review-core-sources:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.locator.outputs.artifact_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out the exact trusted shared-Core reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select one exact content-addressed Core lookup
        id: locator
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-shared-review-core-sources
          mkdir -p "$root"
          python3 -B - <<'PY' > "$root/locator.json"
          import base64,json,os,pathlib,re,subprocess,urllib.parse
          mode='NONE'
          fingerprint=None
          lane_hint=None
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_run':
              event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              run=event.get('workflow_run')
              title=run.get('display_title') if isinstance(run,dict) else None
              match=(re.fullmatch(
                  r'qikvrt-rr-v3 e=[0-9a-f]{40} p=[1-9][0-9]* '
                  r'h=[0-9a-f]{40} f=[0-9a-f]{64} '
                  r'i=([0-9a-f]{64}) a=(?:1|2)',title
              ) if isinstance(title,str) else None)
              if match is not None:
                  mode='LOOKUP_FINGERPRINT'
                  fingerprint=match.group(1)
          elif os.environ['GITHUB_EVENT_NAME'] in {'schedule','workflow_dispatch'}:
              mode='NEXT'
              def api(path):
                  return json.loads(subprocess.check_output(
                      ['gh','api',path],text=True
                  ))
              try:
                  ref=api(
                      f"repos/{os.environ['REPOSITORY']}/git/ref/heads/"
                      'qikvrt/review-admission-inbox-v1'
                  )['object']['sha']
                  def shard(path):
                      encoded=urllib.parse.quote(path,safe='/')
                      content=api(
                          f"repos/{os.environ['REPOSITORY']}/contents/"
                          f"{encoded}?ref={urllib.parse.quote(ref,safe='')}"
                      )
                      return json.loads(base64.b64decode(content['content']))
                  meta=shard(
                      '.qikvrt/recovery/admission-source-rerun/meta.json'
                  )
                  if meta.get('drain_sequence',0) < meta.get('next_sequence',0):
                      sequence=int(meta['drain_sequence'])
                      slot=shard(
                          '.qikvrt/recovery/admission-source-rerun/slots/'
                          f'{sequence:020d}.json'
                      )
                      source=slot.get('source') if isinstance(slot,dict) else None
                      kind=source.get('source_kind') if isinstance(source,dict) else None
                      origin=(source.get('origin_authority')
                          if isinstance(source,dict) else None)
                      if kind in {
                          'CORE_EXACT_REVIEW_CHILD_ZERO_JOB',
                          'CORE_MESH_REVIEW_CHILD_ZERO_JOB',
                      } and isinstance(origin,dict):
                          fingerprint=origin.get('fingerprint')
                          lane_hint=origin.get('lane')
                          if (
                              re.fullmatch(r'[0-9a-f]{64}',str(fingerprint))
                              and lane_hint in {
                                  'exact-review-dispatch',
                                  'mesh-review-successor-dispatch',
                              }
                          ):
                              mode='LOOKUP_FINGERPRINT'
              except (KeyError,ValueError,subprocess.CalledProcessError):
                  # The downstream ledger reader owns the authoritative HOLD
                  # for a missing/malformed custom ref.  Never infer absence.
                  pass
          print(json.dumps({
              'schema':'qikvrt_review_admission_core_locator_v1',
              'mode':mode,'fingerprint':fingerprint,'lane_hint':lane_hint,
          },sort_keys=True,indent=2))
          PY
          artifact="qikvrt-shared-review-core-sources-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact" >> "$GITHUB_OUTPUT"

      - name: Read exact shared-Core snapshot with Auditor only
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'workflow_run'
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-shared-review-core-sources
          mode="$(jq -r .mode "$root/locator.json")"
          if test "$mode" = NONE; then
            jq -n '{schema:"qikvrt_review_admission_core_sources_v1",state:"NOT_APPLICABLE",lookups:{}}' \
              > "$root/core-sources.json"
            exit 0
          fi
          auditor_token="${LEDGER_AUDITOR_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$auditor_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          for lane in exact-review-dispatch mesh-review-successor-dispatch; do
            lane_hint="$(jq -r '.lane_hint // empty' "$root/locator.json")"
            if test -n "$lane_hint" && test "$lane" != "$lane_hint"; then
              continue
            fi
            args=(next --lane "$lane")
            if test "$mode" = LOOKUP_FINGERPRINT; then
              fingerprint="$(jq -er .fingerprint "$root/locator.json")"
              args=(lookup-fingerprint --lane "$lane" --fingerprint "$fingerprint")
            fi
            set +e
            QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$auditor_token" \
            QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
            QIKVRT_OUTBOX_WRITER_GROUP="qikvrt-outbox-ledger-v2-${lane}" \
              python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" --receipt "$root/${lane}.json" \
              "${args[@]}" >/dev/null
            status=$?
            set -e
            if test "$status" -ne 0; then
              if test "$mode" = LOOKUP_FINGERPRINT && \
                 test "$(jq -r .first_blocker "$root/${lane}.json")" = \
                   OUTBOX_FINGERPRINT_NOT_FOUND; then
                rm -f "$root/${lane}.json"
                continue
              fi
              cat "$root/${lane}.json" >&2
              exit "$status"
            fi
            jq -e --arg lane "$lane" '
              .lane == $lane and
              .ledger_ref == ("refs/heads/qikvrt/outbox-ledger-v2/" + $lane) and
              (.ledger_head | test("^[0-9a-f]{40}$"))
            ' "$root/${lane}.json" >/dev/null
          done
          unset auditor_token writer_actor
          python3 -B - <<'PY' > "$root/core-sources.json"
          import json,pathlib
          root=pathlib.Path('/tmp/qikvrt-shared-review-core-sources')
          lookups={}
          for lane in ('exact-review-dispatch','mesh-review-successor-dispatch'):
              path=root/f'{lane}.json'
              if path.exists(): lookups[lane]=json.loads(path.read_text())
          print(json.dumps({
              'schema':'qikvrt_review_admission_core_sources_v1',
              'state':'OBSERVED','lookups':lookups,
          },sort_keys=True,indent=2))
          PY

      - name: Preserve exact shared-Core read envelope
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.locator.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: /tmp/qikvrt-shared-review-core-sources

  plan-admission-source-ingest:
    needs: read-shared-review-core-sources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
      CORE_ARTIFACT: ${{ needs.read-shared-review-core-sources.outputs.artifact_name }}
    steps:
      - name: Check out the exact trusted recovery evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact shared-Core source snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.CORE_ARTIFACT }}
          path: /tmp/qikvrt-shared-review-core-sources

      - name: Plan exact source IDs and bounded cursor read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, subprocess, urllib.parse, zipfile
          from tools.qikvrt_required_review_gate import (
              observe_automated_signer_receipts,
          )
          from tools.qikvrt_review_admission_recovery import (
              _projection,
              admission_inbox_locator_path,
              admission_inbox_meta_path,
              admission_inbox_scan_path,
              admission_inbox_slot_path,
              admission_scan_quarantine_path,
              advance_admission_scan_cursor,
              bind_admission_scan_window,
              build_admission_scan_quarantine_record,
              build_admission_inbox_slot,
              build_admission_inbox_source,
              build_admission_signer_recovery_source,
              build_delegated_signer_receipt_recovery_evidence,
              build_recovery_ledger_effect_authority_readback,
              advance_review_wakeup_subject_recheck,
              empty_admission_inbox_meta,
              empty_admission_scan_cursor,
              migrate_admission_scan_cursor,
              recovery_ledger_effect_authority_readback_path,
              recovery_ledger_genesis_path,
              restart_admission_scan_inventory,
              shrink_admission_scan_window,
              validate_admission_inbox_meta,
              validate_admission_inbox_source,
              validate_admission_scan_cursor,
              validate_recovery_ledger_genesis,
              verify_recovery_ledger_authority,
          )
          repo=os.environ['REPOSITORY']
          event_name=os.environ['GITHUB_EVENT_NAME']
          ref_short='qikvrt/review-admission-inbox-v1'
          ref_api=f'heads/{ref_short}'

          def api(path,method='GET',payload=None,allow_404=False):
              command=['gh','api',path]
              if method != 'GET': command.extend(['--method',method])
              if payload is not None: command.extend(['--input','-'])
              result=subprocess.run(
                  command,
                  input=(json.dumps(payload) if payload is not None else None),
                  text=True,capture_output=True,
              )
              if result.returncode != 0:
                  if allow_404 and 'HTTP 404' in result.stderr:
                      return None
                  raise SystemExit('ADMISSION_INBOX_API_FAILED')
              return json.loads(result.stdout) if result.stdout.strip() else {}

          def exact_object_pages(path,key):
              values=[]
              page=1
              total=None
              while True:
                  separator='&' if '?' in path else '?'
                  result=api(f'{path}{separator}per_page=100&page={page}')
                  current=result.get(key)
                  if not isinstance(current,list):
                      raise SystemExit('ADMISSION_INBOX_EXACT_PAGE_INVALID')
                  observed=result.get('total_count')
                  if not isinstance(observed,int):
                      raise SystemExit('ADMISSION_INBOX_EXACT_TOTAL_MISSING')
                  if total is None: total=observed
                  elif total != observed:
                      raise SystemExit('ADMISSION_INBOX_EXACT_TOTAL_DRIFT')
                  values.extend(current)
                  if len(current) < 100: break
                  page += 1
              if total != len(values) or len({item.get('id') for item in values}) != len(values):
                  raise SystemExit('ADMISSION_INBOX_EXACT_PAGE_INCOMPLETE')
              return values

          def raw_object_pages(path):
              pages=[]
              page=1
              while True:
                  separator='&' if '?' in path else '?'
                  result=api(f'{path}{separator}per_page=100&page={page}')
                  pages.append(result)
                  values=next((value for key,value in result.items()
                      if key != 'total_count' and isinstance(value,list)),None)
                  if values is None:
                      raise SystemExit('ADMISSION_INBOX_RAW_PAGE_INVALID')
                  if len(values) < 100: break
                  page += 1
              return pages

          def exact_array_pages(path):
              values=[]
              page=1
              while True:
                  separator='&' if '?' in path else '?'
                  batch=api(f'{path}{separator}per_page=100&page={page}')
                  if not isinstance(batch,list):
                      raise SystemExit('ADMISSION_INBOX_ARRAY_PAGE_INVALID')
                  values.extend(batch)
                  if len(batch) < 100: break
                  page += 1
              if len({item.get('id') for item in values}) != len(values):
                  raise SystemExit('ADMISSION_INBOX_ARRAY_PAGE_AMBIGUOUS')
              return values

          def api_bytes(path):
              if not isinstance(path,str) or not path:
                  raise SystemExit('ADMISSION_INBOX_BINARY_URL_INVALID')
              result=subprocess.run(['gh','api',path],capture_output=True)
              if result.returncode != 0:
                  raise SystemExit('ADMISSION_INBOX_BINARY_API_FAILED')
              return result.stdout

          repository=api(f'repos/{repo}')
          main=api(f'repos/{repo}/commits/main')
          current_recovery=api(
              f"repos/{repo}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
          )
          if (
              repository.get('full_name') != repo
              or not isinstance(repository.get('id'),int)
              or subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
                  != os.environ['SEALED_EVALUATOR']
              or main.get('sha') != os.environ['SEALED_EVALUATOR']
              or current_recovery.get('head_sha') != main.get('sha')
              or current_recovery.get('head_branch') != 'main'
              or not isinstance(current_recovery.get('run_started_at'),str)
          ):
              raise SystemExit('ADMISSION_INBOX_TRUSTED_MAIN_DRIFT')

          specs=(
              {
                  'file':'qikvrt_requested_review_executor.yml',
                  'path':'.github/workflows/qikvrt_requested_review_executor.yml',
                  'locator':'qikvrt-rr-v3',
                  'events':['pull_request_target','issue_comment','workflow_run','workflow_dispatch'],
              },
              {
                  'file':'qikvrt_required_review_gate.yml',
                  'path':'.github/workflows/qikvrt_required_review_gate.yml',
                  'locator':'QIKVRT required code-owner review admission-v2',
                  'events':['workflow_run','workflow_dispatch'],
              },
          )
          configs={}
          workflows=[]
          for spec in specs:
              workflow=api(f"repos/{repo}/actions/workflows/{spec['file']}")
              if workflow.get('path') != spec['path']:
                  raise SystemExit('ADMISSION_INBOX_TARGET_WORKFLOW_DRIFT')
              workflow_id=int(workflow['id'])
              configs[workflow_id]={
                  'path':spec['path'],
                  'activation_locator':spec['locator'],
                  'allowed_events':spec['events'],
              }
              workflows.append((workflow_id,spec))

          core_envelope=json.loads(pathlib.Path(
              '/tmp/qikvrt-shared-review-core-sources/core-sources.json'
          ).read_text())
          if (
              core_envelope.get('schema')
                  != 'qikvrt_review_admission_core_sources_v1'
              or not isinstance(core_envelope.get('lookups'),dict)
          ):
              raise SystemExit('ADMISSION_INBOX_CORE_ENVELOPE_INVALID')
          core_lookups=core_envelope['lookups']

          observed_ref=api(f'repos/{repo}/git/ref/{ref_api}',allow_404=True)
          if observed_ref is None:
              raise SystemExit(
                  'ADMISSION_INBOX_REF_MISSING_NO_SILENT_REINITIALIZATION'
              )
          else:
              head=observed_ref.get('object',{}).get('sha')
          if not isinstance(head,str):
              raise SystemExit('ADMISSION_INBOX_REF_INVALID')

          def read_json(path,validator=None):
              encoded_ref=urllib.parse.quote(head,safe='')
              encoded_path=urllib.parse.quote(path,safe='/')
              content=api(
                  f'repos/{repo}/contents/{encoded_path}?ref={encoded_ref}',
                  allow_404=True,
              )
              if content is None: return None
              if content.get('type') != 'file' or content.get('encoding') != 'base64':
                  raise SystemExit('ADMISSION_INBOX_FILE_INVALID')
              value=json.loads(base64.b64decode(content['content']))
              return validator(value) if validator is not None else value

          genesis=read_json(recovery_ledger_genesis_path('admission-source-rerun'))
          validate_recovery_ledger_genesis(
              genesis,lane='admission-source-rerun',repository=repo,
              repository_id=int(repository['id']),
          )
          meta=read_json(admission_inbox_meta_path(),validate_admission_inbox_meta)
          if meta is None: meta=empty_admission_inbox_meta()
          scan=read_json(admission_inbox_scan_path(),migrate_admission_scan_cursor)
          if scan is None: scan=empty_admission_scan_cursor()

          candidates=[]
          scan_after=scan
          if event_name == 'workflow_run':
              event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              event_run=event.get('workflow_run')
              run_id=event_run.get('id') if isinstance(event_run,dict) else None
              run=api(f'repos/{repo}/actions/runs/{run_id}') if isinstance(run_id,int) else None
              if isinstance(run,dict): candidates=[run]
          else:
              if scan['window_upper_created_at'] is None:
                  scan=bind_admission_scan_window(
                      scan,upper_created_at=current_recovery['run_started_at'],
                      repository_created_at=repository['created_at'],
                  )
              workflow_id,spec=workflows[scan['target_index']]
              created_range=urllib.parse.quote(
                  scan['window_lower_created_at']+'..'
                  +scan['window_upper_created_at'],safe=''
              )
              page_result=api(
                  f"repos/{repo}/actions/workflows/{spec['file']}/runs?"
                  f"per_page={scan['page_size']}&page={scan['page']}&"
                  f"created={created_range}"
              )
              page_runs=page_result.get('workflow_runs')
              declared_total=page_result.get('total_count')
              if (
                  not isinstance(page_runs,list)
                  or len(page_runs) > scan['page_size']
                  or isinstance(declared_total,bool)
                  or not isinstance(declared_total,int)
              ):
                  raise SystemExit('ADMISSION_INBOX_RECONCILE_PAGE_INVALID')
              if declared_total >= scan['filtered_result_cap']:
                  candidates=[]
                  scan_after=(
                      shrink_admission_scan_window(
                          scan,declared_total=declared_total
                      ) if scan['page'] == 1 else
                      restart_admission_scan_inventory(scan)
                  )
              else:
                  page_run_ids=[
                      item.get('id') if isinstance(item,dict) else None
                      for item in page_runs
                  ]
                  scan_after=advance_admission_scan_cursor(
                      scan,declared_total=declared_total,
                      observed_run_ids=page_run_ids,
                      next_upper_created_at=current_recovery['run_started_at'],
                  )
                  # A count/order/page drift resets the durable inventory to
                  # page one.  Bytes from that inconsistent page are never
                  # admitted as candidates and no absence is inferred.
                  candidates=(
                      [] if scan_after['inventory_restart_count']
                          != scan['inventory_restart_count']
                      else page_runs
                  )

          # One current accepted Core child per review lane is an O(1) inbox
          # for missed Requested workflow_run events.  Exact API re-fetch is
          # still required before admission classification.
          for lane,lookup in core_lookups.items():
              if (
                  lane not in {
                      'exact-review-dispatch',
                      'mesh-review-successor-dispatch',
                  }
                  or not isinstance(lookup,dict)
                  or lookup.get('state') != 'PENDING'
                  or not isinstance(lookup.get('acceptance'),dict)
              ):
                  continue
              for acceptance in lookup['acceptance'].values():
                  child=(acceptance or {}).get('child') \
                      if isinstance(acceptance,dict) else None
                  run_id=child.get('run_id') if isinstance(child,dict) else None
                  if isinstance(run_id,int) and all(
                      item.get('id') != run_id for item in candidates
                      if isinstance(item,dict)
                  ):
                      candidates.append(api(
                          f'repos/{repo}/actions/runs/{run_id}'
                      ))

          unseen=[]
          for run in candidates:
              if (
                  not isinstance(run,dict)
                  or run.get('status') != 'completed'
                  or not isinstance(run.get('conclusion'),str)
                  or not run.get('conclusion')
                  or run.get('workflow_id') not in configs
              ):
                  continue
              run_id=run['id']
              jobs=exact_object_pages(
                  f'repos/{repo}/actions/runs/{run_id}/jobs?filter=all','jobs'
              )
              artifacts=exact_object_pages(
                  f'repos/{repo}/actions/runs/{run_id}/artifacts','artifacts'
              )
              if jobs or artifacts:
                  config=configs.get(run.get('workflow_id'))
                  if (
                      not isinstance(config,dict)
                      or config.get('path')
                          != '.github/workflows/qikvrt_required_review_gate.yml'
                      or run.get('run_attempt') != 1
                  ):
                      continue
                  plan_matches=[]
                  for artifact in artifacts:
                      name=artifact.get('name') if isinstance(artifact,dict) else None
                      match=(
                          re.fullmatch(
                              rf'qikvrt-native-account-review-plan-{run_id}-([0-9a-f]{{64}})',
                              name,
                          ) if isinstance(name,str) else None
                      )
                      if match is not None and artifact.get('expired') is not True:
                          plan_matches.append(artifact)
                  if len(plan_matches) != 1:
                      continue
                  plan_artifact=plan_matches[0]
                  archive=api_bytes(plan_artifact.get('archive_download_url'))
                  digest=plan_artifact.get('digest')
                  if (
                      not isinstance(digest,str)
                      or not digest.startswith('sha256:')
                      or hashlib.sha256(archive).hexdigest() != digest[7:]
                  ):
                      continue
                  try:
                      with zipfile.ZipFile(io.BytesIO(archive)) as zipped:
                          plan_names=[name for name in zipped.namelist()
                              if not name.endswith('/')
                              and pathlib.PurePosixPath(name).name == 'plan.json']
                          if len(plan_names) != 1:
                              continue
                          plan=json.loads(zipped.read(plan_names[0]))
                  except (zipfile.BadZipFile,UnicodeDecodeError,json.JSONDecodeError):
                      continue
                  pr_number=plan.get('pr_number') if isinstance(plan,dict) else None
                  if not isinstance(pr_number,int):
                      continue
                  pr=api(f'repos/{repo}/pulls/{pr_number}')
                  head_sha=pr.get('head',{}).get('sha')
                  head_commit=(
                      api(f'repos/{repo}/git/commits/{head_sha}')
                      if isinstance(head_sha,str) else {}
                  )
                  reviews=exact_array_pages(
                      f'repos/{repo}/pulls/{pr_number}/reviews'
                  )
                  verified,blockers=observe_automated_signer_receipts(
                      repository=repo,evaluator_sha=main['sha'],pr=pr,
                      reviews=reviews,
                      required_code_owners=[plan.get('reviewer')],
                      api_json=lambda path:api(path),
                      api_pages=raw_object_pages,
                      api_bytes=api_bytes,
                  )
                  marked=[item for item in reviews
                      if isinstance(item,dict) and item.get('body')==plan.get('review_body')]
                  if len(marked) != 1 or marked[0].get('id') in verified:
                      continue
                  blocker=blockers.get(marked[0].get('id'))
                  try:
                      recovery_evidence=(
                          build_delegated_signer_receipt_recovery_evidence(
                              plan=plan,run=run,repository=repo,
                              current_main_sha=main['sha'],pr=pr,
                              head_commit=head_commit,reviews=reviews,
                              jobs_total=len(jobs),artifacts_total=len(artifacts),
                              signer_receipt_blocker=blocker,
                              artifact_inventory_sha256=hashlib.sha256(
                                  json.dumps(artifacts,sort_keys=True,
                                      separators=(',',':')).encode()
                              ).hexdigest(),
                          )
                      )
                      source=build_admission_signer_recovery_source(
                          run,repository=repo,
                          repository_id=int(repository['id']),
                          current_main_sha=main['sha'],target_configs=configs,
                          recovery_evidence=recovery_evidence,
                      )
                  except Exception:
                      continue
                  if read_json(admission_inbox_locator_path(
                      source['source_fingerprint'])) is None:
                      unseen.append(source)
                  continue
              title=run.get('display_title')
              child_locator=(
                  re.fullmatch(
                      r'qikvrt-rr-v3 e=[0-9a-f]{40} p=[1-9][0-9]* '
                      r'h=[0-9a-f]{40} f=([0-9a-f]{64}) '
                      r'i=[0-9a-f]{64} a=(?:1|2)',title,
                  ) if isinstance(title,str) else None
              )
              matching_core=[]
              if child_locator is not None:
                  for lane,lookup in core_lookups.items():
                      if not isinstance(lookup,dict):
                          continue
                      acceptance=lookup.get('acceptance')
                      if not isinstance(acceptance,dict):
                          continue
                      if any(
                          isinstance(item,dict)
                          and isinstance(item.get('child'),dict)
                          and item['child'].get('run_id') == run_id
                          for item in acceptance.values()
                      ):
                          matching_core.append((lane,lookup))
                  if len(matching_core) != 1:
                      continue
              try:
                  source=build_admission_inbox_source(
                      run,repository=repo,
                      repository_id=int(repository['id']),
                      current_main_sha=main['sha'],target_configs=configs,
                      exact_review_core_lookup=(
                          matching_core[0][1]
                          if matching_core
                          and matching_core[0][0] == 'exact-review-dispatch'
                          else None
                      ),
                      mesh_review_core_lookup=(
                          matching_core[0][1]
                          if matching_core
                          and matching_core[0][0]
                              == 'mesh-review-successor-dispatch'
                          else None
                      ),
                  )
              except Exception:
                  continue
              if read_json(admission_inbox_locator_path(source['source_fingerprint'])) is not None:
                  continue
              unseen.append(source)
          unseen.sort(key=lambda value:(value['source']['created_at'],value['source']['run_id']))

          updates={}
          if (
              scan_after['quarantined_window_count']
              == scan['quarantined_window_count'] + 1
          ):
              quarantine_record=build_admission_scan_quarantine_record(
                  scan,scan_after
              )
              updates[admission_scan_quarantine_path(
                  quarantine_record
              )]=quarantine_record
          if scan_after != scan or read_json(admission_inbox_scan_path()) is None:
              updates[admission_inbox_scan_path()]=scan_after
          if read_json(admission_inbox_meta_path()) is None:
              updates[admission_inbox_meta_path()]=meta
          if unseen:
              meta_after=dict(meta)
              # Atomically enqueue every eligible source from the sealed
              # page before its cursor advances.  No page-local unseen source
              # can be stranded when the next schedule visits a later page.
              for raw_source in unseen:
                  source=validate_admission_inbox_source(raw_source)
                  sequence=meta_after['next_sequence']
                  slot=build_admission_inbox_slot(source,sequence=sequence)
                  locator={
                      'schema':'qikvrt_review_admission_inbox_locator_v1',
                      'source_fingerprint':source['source_fingerprint'],
                      'source_sha256':source['source_sha256'],
                      'sequence':sequence,
                      'slot_path':admission_inbox_slot_path(sequence),
                      'authority_boundary':'RECOVERY_ONLY',
                  }
                  updates[admission_inbox_slot_path(sequence)]=slot
                  updates[admission_inbox_locator_path(
                      source['source_fingerprint']
                  )]=locator
                  meta_after['next_sequence']=sequence+1
              updates[admission_inbox_meta_path()]=meta_after

          plan={
              'schema':'qikvrt_review_admission_inbox_ingest_plan_v1',
              'repository':repo,'repository_id':repository['id'],
              'expected_main_sha':main['sha'],'expected_ledger_head':head,
              'evaluator_sha':os.environ['SEALED_EVALUATOR'],
              'effect_run_started_at':current_recovery['run_started_at'],
              'updates':updates,
              'authority_boundary':'RECOVERY_ONLY',
              'completion_claims':{
                  'PASS':False,'FINAL_PASS':False,
                  'EFFECT_ACK_DONE':False,'MERGE':False,
              },
          }
          plan['plan_sha256']=__import__('hashlib').sha256(json.dumps(
              plan,sort_keys=True,separators=(',',':')
          ).encode()).hexdigest()
          pathlib.Path('/tmp/qikvrt-admission-ingest-plan.json').write_text(
              json.dumps(plan,sort_keys=True,indent=2)+'\n'
          )
          print(json.dumps({
              'schema':'qikvrt_review_admission_inbox_ingest_v1',
              'state':'PLANNED_ENQUEUE' if unseen else 'PLANNED_CURSOR_ADVANCE',
              'candidate_count':len(candidates),
              'enqueued_source_fingerprint':(
                  unseen[0]['source_fingerprint'] if unseen else None
              ),
              'enqueued_source_count':len(unseen),
              'authority_boundary':'RECOVERY_ONLY',
              'native_account_review_authorized':False,
              'completion_claims':{
                  'PASS':False,'FINAL_PASS':False,'EFFECT_ACK_DONE':False,'MERGE':False,
              },
          },sort_keys=True,indent=2))
          PY

      - name: Upload the exact read-only admission-inbox plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-admission-inbox-plan-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: /tmp/qikvrt-admission-ingest-plan.json

  ingest-admission-source:
    needs: plan-admission-source-ingest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-admission-source-rerun
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-admission-source-rerun
      REPOSITORY: ${{ github.repository }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
    steps:
      - name: Check out the exact trusted admission-inbox writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact read-only admission-inbox plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qikvrt-admission-inbox-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp

      - name: Persist only the sealed admission-inbox plan by exact FF-CAS
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.parse
          from tools.qikvrt_review_admission_recovery import (
              build_recovery_ledger_effect_authority_readback,
              recovery_ledger_effect_authority_readback_path,
              verify_recovery_ledger_authority,
          )
          repo=os.environ['REPOSITORY']
          plan=json.loads(pathlib.Path(
              '/tmp/qikvrt-admission-ingest-plan.json'
          ).read_text())
          claimed=plan.pop('plan_sha256',None)
          if claimed != hashlib.sha256(json.dumps(
              plan,sort_keys=True,separators=(',',':')
          ).encode()).hexdigest():
              raise SystemExit('ADMISSION_INBOX_INGEST_PLAN_DIGEST_DRIFT')
          if (
              plan.get('schema') != 'qikvrt_review_admission_inbox_ingest_plan_v1'
              or plan.get('repository') != repo
              or plan.get('evaluator_sha') != os.environ['SEALED_EVALUATOR']
              or plan.get('authority_boundary') != 'RECOVERY_ONLY'
              or not isinstance(plan.get('updates'),dict)
              or subprocess.check_output(
                  ['git','rev-parse','HEAD'],text=True
              ).strip() != os.environ['SEALED_EVALUATOR']
          ):
              raise SystemExit('ADMISSION_INBOX_INGEST_PLAN_DRIFT')
          if not plan['updates']:
              print(json.dumps({
                  'schema':'qikvrt_review_admission_inbox_ingest_write_v1',
                  'persisted':False,'reason':'NO_MUTATION_PLANNED',
                  'authority_boundary':'RECOVERY_ONLY',
              },sort_keys=True))
              raise SystemExit(0)
          def api(path,method='GET',payload=None):
              command=['gh','api','-H','X-GitHub-Api-Version: 2026-03-10',path]
              if method != 'GET': command.extend(['--method',method])
              if payload is not None: command.extend(['--input','-'])
              result=subprocess.run(
                  command,input=(json.dumps(payload) if payload is not None else None),
                  text=True,capture_output=True,
              )
              if result.returncode:
                  raise SystemExit('ADMISSION_INBOX_INGEST_EFFECT_API_FAILED')
              return json.loads(result.stdout) if result.stdout.strip() else {}
          main=api(f'repos/{repo}/commits/main')
          head=api(
              f'repos/{repo}/git/ref/heads/qikvrt/review-admission-inbox-v1'
          ).get('object',{}).get('sha')
          current=api(
              f"repos/{repo}/actions/runs/{int(os.environ['GITHUB_RUN_ID'])}"
          )
          actor=os.environ.get('EXPECTED_LEDGER_WRITER_ACTOR_ID','')
          if (
              main.get('sha') != plan['expected_main_sha']
              or main.get('sha') != os.environ['SEALED_EVALUATOR']
              or head != plan['expected_ledger_head']
              or not actor.isdigit() or int(actor)<1
              or current.get('head_sha') != os.environ['SEALED_EVALUATOR']
              or not isinstance(current.get('run_started_at'),str)
          ):
              raise SystemExit('ADMISSION_INBOX_INGEST_PRECAS_DRIFT')
          authority=verify_recovery_ledger_authority(
              lane='admission-source-rerun',repository=repo,
              writer_actor_id=int(actor),
              writer_group=os.environ.get('QIKVRT_OUTBOX_WRITER_GROUP',''),
              api=lambda path: api(path),
          )
          effect_authority=build_recovery_ledger_effect_authority_readback(
              authority,lane='admission-source-rerun',
              evaluator_sha=os.environ['SEALED_EVALUATOR'],
              effect_run_id=int(os.environ['GITHUB_RUN_ID']),
              effect_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              effect_run_started_at=current['run_started_at'],
          )
          updates=dict(plan['updates'])
          updates[recovery_ledger_effect_authority_readback_path(
              effect_authority,lane='admission-source-rerun'
          )]=effect_authority
          parent=api(f'repos/{repo}/git/commits/{head}')
          entries=[]
          for path,value in sorted(updates.items()):
              blob=api(f'repos/{repo}/git/blobs','POST',{
                  'content':base64.b64encode((json.dumps(
                      value,sort_keys=True,indent=2
                  )+'\n').encode()).decode(),'encoding':'base64',
              })
              entries.append({
                  'path':path,'mode':'100644','type':'blob','sha':blob['sha'],
              })
          tree=api(f'repos/{repo}/git/trees','POST',{
              'base_tree':parent['tree']['sha'],'tree':entries,
          })
          successor=api(f'repos/{repo}/git/commits','POST',{
              'message':'Advance bounded review admission source inbox',
              'tree':tree['sha'],'parents':[head],
          })
          api(
              f'repos/{repo}/git/refs/heads/qikvrt/review-admission-inbox-v1',
              'PATCH',{'sha':successor['sha'],'force':False},
          )
          readback_ref=api(
              f'repos/{repo}/git/ref/heads/qikvrt/review-admission-inbox-v1'
          )
          readback_commit=api(
              f"repos/{repo}/git/commits/{successor['sha']}"
          )
          if (
              readback_ref.get('object',{}).get('sha') != successor['sha']
              or readback_commit.get('tree',{}).get('sha') != tree['sha']
              or [item.get('sha') for item in readback_commit.get('parents',[])]
                  != [head]
          ):
              raise SystemExit('ADMISSION_INBOX_INGEST_CAS_READBACK_DRIFT')
          encoded_successor=urllib.parse.quote(successor['sha'],safe='')
          for path,value in sorted(updates.items()):
              encoded_path=urllib.parse.quote(path,safe='/')
              content=api(
                  f'repos/{repo}/contents/{encoded_path}?ref={encoded_successor}'
              )
              expected=(json.dumps(value,sort_keys=True,indent=2)+'\n').encode()
              if (
                  content.get('type') != 'file'
                  or content.get('encoding') != 'base64'
                  or base64.b64decode(content.get('content','')) != expected
              ):
                  raise SystemExit('ADMISSION_INBOX_INGEST_FILE_READBACK_DRIFT')
          print(json.dumps({
              'schema':'qikvrt_review_admission_inbox_ingest_write_v1',
              'before_head':head,'ledger_head':successor['sha'],
              'plan_sha256':claimed,'persisted':True,
              'authority_readback_sha256':effect_authority['readback_sha256'],
              'authority_boundary':'RECOVERY_ONLY',
          },sort_keys=True))
          PY

  plan-one:
    needs: [ingest-admission-source, read-shared-review-core-sources]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      state: ${{ steps.plan.outputs.state }}
      rerun: ${{ steps.plan.outputs.rerun }}
      source_run_id: ${{ steps.plan.outputs.source_run_id }}
      source_attempt: ${{ steps.plan.outputs.source_attempt }}
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      inbox_sequence: ${{ steps.plan.outputs.inbox_sequence }}
      source_kind: ${{ steps.plan.outputs.source_kind }}
      core_lane: ${{ steps.plan.outputs.core_lane }}
      core_sequence: ${{ steps.plan.outputs.core_sequence }}
      core_transport_attempt: ${{ steps.plan.outputs.core_transport_attempt }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CORE_ARTIFACT: ${{ needs.read-shared-review-core-sources.outputs.artifact_name }}
    steps:
      - name: Check out current trusted recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download exact Shared-Core source snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.CORE_ARTIFACT }}
          path: /tmp/qikvrt-shared-review-core-sources

      - name: Select and seal one exact zero-job source
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-review-admission-recovery
          mkdir -p "$root"
          python3 -B - <<'PY' > "$root/selection.json"
          import base64, json, os, pathlib, re, subprocess, urllib.parse
          from tools.qikvrt_required_review_gate import (
              observe_automated_signer_receipts,
          )
          from tools.qikvrt_review_admission_recovery import (
              _projection,
              admission_inbox_meta_path,
              admission_inbox_rerun_path,
              admission_inbox_slot_path,
              build_admission_inbox_continuation,
              build_admission_signer_receipt_continuation,
              build_recovery_intent,
              build_recovery_producer_binding,
              build_terminal_receipt,
              build_terminal_producer_binding,
              select_recovery,
              reobserve_shared_review_core_child_recovery,
              validate_admission_inbox_meta,
              validate_admission_inbox_slot,
              validate_delegated_signer_receipt_recovery_evidence,
              validate_recovery_intent,
              validate_recovery_producer_binding,
              validate_terminal_receipt,
              validate_terminal_producer_binding,
          )

          repo=os.environ['REPOSITORY']
          root=pathlib.Path('/tmp/qikvrt-review-admission-recovery')
          core_envelope=json.loads(pathlib.Path(
              '/tmp/qikvrt-shared-review-core-sources/core-sources.json'
          ).read_text())
          if (
              core_envelope.get('schema')
                  != 'qikvrt_review_admission_core_sources_v1'
              or not isinstance(core_envelope.get('lookups'),dict)
          ):
              raise SystemExit('ADMISSION_RECOVERY_CORE_ENVELOPE_INVALID')

          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))

          def pages(path,key):
              values=[]
              total=None
              page_number=1
              while True:
                  separator='&' if '?' in path else '?'
                  page=api(f'{path}{separator}per_page=100&page={page_number}')
                  if not isinstance(page,dict) or not isinstance(page.get(key),list):
                      raise SystemExit(f'ADMISSION_RECOVERY_PAGE_INVALID_{key}')
                  if not isinstance(page.get('total_count'),int):
                      raise SystemExit(f'ADMISSION_RECOVERY_TOTAL_MISSING_{key}')
                  if total is None: total=page['total_count']
                  elif total != page['total_count']:
                      raise SystemExit(f'ADMISSION_RECOVERY_TOTAL_DRIFT_{key}')
                  values.extend(page[key])
                  if len(page[key]) < 100: break
                  page_number += 1
              if (
                  total != len(values)
                  or len({item.get('id') for item in values}) != len(values)
              ):
                  raise SystemExit(f'ADMISSION_RECOVERY_PAGE_INCOMPLETE_{key}')
              return values

          def array_pages(path):
              values=[]
              page_number=1
              while True:
                  separator='&' if '?' in path else '?'
                  batch=api(
                      f'{path}{separator}per_page=100&page={page_number}'
                  )
                  if not isinstance(batch,list):
                      raise SystemExit('ADMISSION_RECOVERY_ARRAY_PAGE_INVALID')
                  values.extend(batch)
                  if len(batch) < 100: break
                  page_number += 1
              if len({item.get('id') for item in values}) != len(values):
                  raise SystemExit('ADMISSION_RECOVERY_ARRAY_PAGE_AMBIGUOUS')
              return values

          def raw_pages(path):
              values=[]
              page_number=1
              while True:
                  separator='&' if '?' in path else '?'
                  page=api(
                      f'{path}{separator}per_page=100&page={page_number}'
                  )
                  values.append(page)
                  payload=next((item for key,item in page.items()
                      if key != 'total_count' and isinstance(item,list)),None)
                  if payload is None:
                      raise SystemExit('ADMISSION_RECOVERY_RAW_PAGE_INVALID')
                  if len(payload) < 100: break
                  page_number += 1
              return values

          def api_bytes(path):
              if not isinstance(path,str) or not path:
                  raise SystemExit('ADMISSION_RECOVERY_BINARY_URL_INVALID')
              result=subprocess.run(['gh','api',path],capture_output=True)
              if result.returncode != 0:
                  raise SystemExit('ADMISSION_RECOVERY_BINARY_API_FAILED')
              return result.stdout

          repository=api(f'repos/{repo}')
          if repository.get('full_name') != repo or not isinstance(repository.get('id'),int):
              raise SystemExit('ADMISSION_RECOVERY_REPOSITORY_IDENTITY_DRIFT')
          main=api(f'repos/{repo}/commits/main')
          local_main=subprocess.check_output(
              ['git','rev-parse','HEAD'],text=True
          ).strip()
          if local_main != main.get('sha'):
              raise SystemExit('ADMISSION_RECOVERY_MAIN_CHECKOUT_DRIFT')
          target_specs=(
              {
                  'file':'qikvrt_requested_review_executor.yml',
                  'path':'.github/workflows/qikvrt_requested_review_executor.yml',
                  'locator':'qikvrt-rr-v3',
                  'events':[
                      'pull_request_target','issue_comment','workflow_run',
                      'workflow_dispatch',
                  ],
              },
              {
                  'file':'qikvrt_required_review_gate.yml',
                  'path':'.github/workflows/qikvrt_required_review_gate.yml',
                  'locator':'QIKVRT required code-owner review admission-v2',
                  'events':['workflow_run','workflow_dispatch'],
              },
          )
          configs={}
          for spec in target_specs:
              workflow=api(f"repos/{repo}/actions/workflows/{spec['file']}")
              if workflow.get('path') != spec['path']:
                  raise SystemExit('ADMISSION_RECOVERY_TARGET_WORKFLOW_PATH_DRIFT')
              workflow_id=int(workflow['id'])
              configs[workflow_id]={
                  'path':spec['path'],
                  'activation_locator':spec['locator'],
                  'allowed_events':spec['events'],
              }
          ledger_ref='qikvrt/review-admission-inbox-v1'
          observed_ref=subprocess.run(
              ['gh','api',f'repos/{repo}/git/ref/heads/{ledger_ref}'],
              text=True,capture_output=True,
          )
          runs=[]
          inbox_sequence=None
          inbox_slot=None
          ledger_head=''
          durable_rerun=None
          if observed_ref.returncode == 0:
              ledger_head=json.loads(observed_ref.stdout).get('object',{}).get('sha')
              if not isinstance(ledger_head,str):
                  raise SystemExit('ADMISSION_INBOX_HEAD_INVALID')
              def shard(path,validator,optional=False):
                  encoded_ref=urllib.parse.quote(ledger_head,safe='')
                  encoded_path=urllib.parse.quote(path,safe='/')
                  result=subprocess.run([
                      'gh','api',f'repos/{repo}/contents/{encoded_path}?ref={encoded_ref}'
                  ],text=True,capture_output=True)
                  if optional and result.returncode != 0 and 'HTTP 404' in result.stderr:
                      return None
                  if result.returncode != 0:
                      raise SystemExit('ADMISSION_INBOX_SHARD_READ_FAILED')
                  content=json.loads(result.stdout)
                  if content.get('type') != 'file' or content.get('encoding') != 'base64':
                      raise SystemExit('ADMISSION_INBOX_SHARD_INVALID')
                  return validator(json.loads(base64.b64decode(content['content'])))
              meta=shard(admission_inbox_meta_path(),validate_admission_inbox_meta)
              if meta['drain_sequence'] < meta['next_sequence']:
                  inbox_sequence=meta['drain_sequence']
                  slot=shard(
                      admission_inbox_slot_path(inbox_sequence),
                      validate_admission_inbox_slot,
                  )
                  inbox_slot=slot
                  durable_rerun=shard(
                      admission_inbox_rerun_path(inbox_sequence),
                      lambda value:value,optional=True,
                  )
                  run_id=slot['source']['source']['run_id']
                  value=api(f'repos/{repo}/actions/runs/{run_id}')
                  value['jobs_total']=len(pages(
                      f'repos/{repo}/actions/runs/{run_id}/jobs?filter=all','jobs'
                  ))
                  value['artifacts_total']=len(pages(
                      f'repos/{repo}/actions/runs/{run_id}/artifacts','artifacts'
                  ))
