name: QIKVRT reflexive repository watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "QIK-VRT autonomous bounded self-heal"
      - "QIK-VRT autonomous draft-PR continuation"
      - "QIK-VRT expected-head promotion executor"
      - "QIKVRT workflow executor"
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT Batch-003 remaining subject disposition"
      - "QIKVRT adaptive runtime"
    # The five-minute schedule covers active progress.  Terminal source events
    # are sufficient here and do not create a second observer wave per run.
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_reflexive_repository_watchdog.yml"
      - ".github/workflows/qikvrt_workflow_executor.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - "tools/qikvrt_reflexive_repository_watchdog.py"
      - "tools/qikvrt_workflow_executor.py"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "registry/NODE_DISCOVERY_POLICY.json"
      - "qikvrt/runtime/onboarding/SEED_ACCEPTANCE_STATUS.json"
      - "qikvrt/runtime/onboarding/NODE_REGISTRATION_RENEWAL.json"
      - "qikvrt/runtime/onboarding/NODE_HEALTH.json"
      - "tests/test_qikvrt_reflexive_repository_watchdog.py"
      - "docs/REFLEXIVE_REPOSITORY_WATCHDOG.md"
      - "state/work_units/CONTINUOUS_GATEWATCH_NODE_LIVENESS_V1.json"
  pull_request:
    paths:
      - ".github/workflows/qikvrt_reflexive_repository_watchdog.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - "tools/qikvrt_reflexive_repository_watchdog.py"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "registry/NODE_DISCOVERY_POLICY.json"
      - "qikvrt/runtime/onboarding/SEED_ACCEPTANCE_STATUS.json"
      - "qikvrt/runtime/onboarding/NODE_REGISTRATION_RENEWAL.json"
      - "qikvrt/runtime/onboarding/NODE_HEALTH.json"
      - "tests/test_qikvrt_reflexive_repository_watchdog.py"
      - "docs/REFLEXIVE_REPOSITORY_WATCHDOG.md"
      - "state/work_units/REFLEXIVE_REPOSITORY_WATCHDOG_V1.json"
      - "state/work_units/CONTINUOUS_GATEWATCH_NODE_LIVENESS_V1.json"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: qikvrt-reflexive-watchdog-${{ github.repository }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  pre-deadlock-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact observed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reobserve exact head, tree, runs, jobs, and previous reflexive receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          MAX_RUNS_PER_OBSERVATION: "20"
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          mkdir -p "$root/jobs"
          fail_closed() {
            local stage="$1"
            local detail_path="${2:-}"
            local detail=""
            if test -n "$detail_path" && test -f "$detail_path"; then
              detail="$(tr '\n' ' ' < "$detail_path" | cut -c1-500)"
            fi
            jq -n \
              --arg repository "$REPOSITORY" \
              --arg expected_head "$EXPECTED_HEAD" \
              --arg observed_head "$(cat "$root/observed-head.txt" 2>/dev/null || true)" \
              --arg observed_tree "$(cat "$root/observed-tree.txt" 2>/dev/null || true)" \
              --arg stage "$stage" \
              --arg detail "$detail" \
              '{
                schema: "qikvrt_reflexive_repository_watchdog_observation_failure_v1",
                repository: $repository,
                expected_head: $expected_head,
                observed_local_head: $observed_head,
                observed_tree: $observed_tree,
                state: "OBSERVATION_UNAVAILABLE",
                disposition: "HOLD",
                first_blocker: "EXACT_HEAD_OBSERVATION_UNAVAILABLE",
                stage: $stage,
                detail: $detail,
                repository_mutation: false,
                external_effect: false
              }' > "$root/observation-failure.json"
            exit 1
          }
          local_head="$(git rev-parse --verify HEAD^{commit})"
          git rev-parse --verify HEAD^{tree} > "$root/observed-tree.txt"
          printf '%s\n' "$EXPECTED_HEAD" > "$root/observed-head.txt"
          test "$local_head" = "$EXPECTED_HEAD" || fail_closed "CHECKOUT_HEAD_BINDING_DRIFT"
          if ! [[ "$MAX_RUNS_PER_OBSERVATION" =~ ^[1-9][0-9]*$ ]]; then
            fail_closed "INVALID_OBSERVATION_BUDGET"
          fi
          if test "$EVENT_NAME" = pull_request; then
            if ! live_head="$(gh api "repos/$REPOSITORY/pulls/$EVENT_PR" --jq '.head.sha' 2>"$root/live-head-error.txt")"; then
              fail_closed "READ_LIVE_PULL_REQUEST_HEAD" "$root/live-head-error.txt"
            fi
          else
            if ! live_head="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha' 2>"$root/live-head-error.txt")"; then
              fail_closed "READ_LIVE_MAIN_HEAD" "$root/live-head-error.txt"
            fi
          fi
          test "$live_head" = "$EXPECTED_HEAD" || fail_closed "LIVE_HEAD_BINDING_DRIFT"
          if test "$EVENT_NAME" = pull_request; then
            if test "${{ github.event.pull_request.base.ref }}" = main; then
              printf '%s\n' PULL_REQUEST_MAIN > "$root/observation-scope.txt"
            else
              printf '%s\n' PULL_REQUEST_STACKED > "$root/observation-scope.txt"
            fi
          else
            printf '%s\n' MAIN > "$root/observation-scope.txt"
          fi
          authority_repository="$(jq -r '.authority.repository' state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json)"
          test "$authority_repository" != null
          if test "$authority_repository" = "$REPOSITORY" && test "$EVENT_NAME" != pull_request; then
            printf '%s\n' "$live_head" > "$root/observed-authority-main-head.txt"
          elif ! gh api "repos/$authority_repository/git/ref/heads/main" --jq '.object.sha' \
            > "$root/observed-authority-main-head.txt" 2>"$root/authority-head-error.txt"; then
            fail_closed "READ_AUTHORITY_MAIN_HEAD" "$root/authority-head-error.txt"
          fi
          if ! gh api "repos/$REPOSITORY/actions/runs?head_sha=$EXPECTED_HEAD&per_page=$MAX_RUNS_PER_OBSERVATION" \
            > "$root/current-runs.json" 2>"$root/current-runs-error.txt"; then
            fail_closed "LIST_EXACT_HEAD_WORKFLOW_RUNS" "$root/current-runs-error.txt"
          fi
          if ! jq -e '.total_count | type == "number" and . >= 0' "$root/current-runs.json" >/dev/null; then
            fail_closed "INVALID_EXACT_HEAD_RUN_OBSERVATION" "$root/current-runs.json"
          fi
          observed_run_count="$(jq '.workflow_runs | length' "$root/current-runs.json")"
          total_run_count="$(jq '.total_count' "$root/current-runs.json")"
          if test "$total_run_count" -gt "$observed_run_count"; then
            jq -n \
              --argjson observed_run_count "$observed_run_count" \
              --argjson total_run_count "$total_run_count" \
              --argjson max_runs_per_observation "$MAX_RUNS_PER_OBSERVATION" \
              '{
                schema: "qikvrt_reflexive_repository_watchdog_observation_coverage_v1",
                complete: false,
                state: "OBSERVATION_INCOMPLETE",
                disposition: "HOLD",
                first_blocker: "EXACT_HEAD_WORKFLOW_OBSERVATION_INCOMPLETE",
                observed_run_count: $observed_run_count,
                total_run_count: $total_run_count,
                max_runs_per_observation: $max_runs_per_observation,
                repository_mutation: false,
                external_effect: false
              }' > "$root/observation-coverage.json"
            exit 0
          fi

          # Only a complete bounded run set may proceed to per-run job reads.
          # A larger set is preserved above as OBSERVATION_INCOMPLETE instead.
          mapfile -t run_ids < <(
            jq -r '.workflow_runs[].id' "$root/current-runs.json"
          )
          for run_id in "${run_ids[@]}"; do
            gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              > "$root/jobs/$run_id.json"
          done

          if test "$EVENT_NAME" != pull_request; then
            previous_run="$(
              gh api "repos/$REPOSITORY/actions/workflows/qikvrt_reflexive_repository_watchdog.yml/runs?branch=main&status=completed&per_page=20" \
                | jq -r --argjson current "$CURRENT_RUN_ID" \
                  '[.workflow_runs[] | select(.id != $current and .conclusion == "success")][0].id // empty'
            )"
            if test -n "$previous_run"; then
              previous_artifact="$(
                gh api "repos/$REPOSITORY/actions/runs/$previous_run/artifacts?per_page=100" \
                  | jq -r '[.artifacts[] | select(.name | startswith("qikvrt-reflexive-repository-watchdog-"))][0].id // empty'
              )"
              if test -n "$previous_artifact"; then
                gh api "repos/$REPOSITORY/actions/artifacts/$previous_artifact/zip" \
                  > "$root/previous-receipt.zip" || true
                unzip -p "$root/previous-receipt.zip" reflexive-watchdog-receipt.json \
                  > "$root/previous-receipt.json" 2>/dev/null || true
              fi
            fi
          fi

      - name: Analyze the pre-deadlock state without mutation
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          head="$(cat "$root/observed-head.txt")"
          tree="$(cat "$root/observed-tree.txt")"
          scope="$(cat "$root/observation-scope.txt")"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          args=(
            analyze
            --runs-file "$root/current-runs.json"
            --jobs-dir "$root/jobs"
            --expect-head "$head"
            --expect-tree "$tree"
            --repository "$REPOSITORY"
            --now "$now"
            --observation-scope "$scope"
            --node-liveness-dir qikvrt/runtime/onboarding
            --authority-head-file "$root/observed-authority-main-head.txt"
            --json
          )
          if test -s "$root/previous-receipt.json"; then
            args+=(--baseline "$root/previous-receipt.json")
          fi
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py "${args[@]}" \
            > "$root/reflexive-watchdog-receipt.json"
          cp "$root/reflexive-watchdog-receipt.json" "$root/gatewatch-receipt.json"
          jq '{state, disposition, first_blocker, productive_edge, semantic_fingerprint}' \
            "$root/reflexive-watchdog-receipt.json"

      - name: Verify reflexive prevention and mesh continuity contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_reflexive_repository_watchdog \
            tests.test_qikvrt_workflow_executor_mesh_contract \
            tests.test_seed_workflows

      - name: Preserve the exact-head pre-deadlock receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-reflexive-repository-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: .qikvrt/reflexive-repository-watchdog
