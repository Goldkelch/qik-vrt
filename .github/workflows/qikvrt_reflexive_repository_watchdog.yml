name: QIKVRT reflexive repository watchdog

on:
  workflow_dispatch:
  # Lost-event fail-safe only. This workflow is read-only and cannot dispatch,
  # mutate a candidate, infer success, or create a semantic head.
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "QIK-VRT autonomous bounded self-heal"
      - "QIK-VRT autonomous draft-PR continuation"
      - "QIK-VRT expected-head promotion executor"
      - "QIKVRT workflow executor"
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT Batch-003 remaining subject disposition"
      - "QIKVRT adaptive runtime"
    types: [requested, in_progress, completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_reflexive_repository_watchdog.yml"
      - ".github/workflows/qikvrt_workflow_executor.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - "tools/qikvrt_reflexive_repository_watchdog.py"
      - "tools/qikvrt_workflow_executor.py"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "registry/NODE_DISCOVERY_POLICY.json"
      - "qikvrt/runtime/onboarding/SEED_ACCEPTANCE_STATUS.json"
      - "qikvrt/runtime/onboarding/NODE_REGISTRATION_RENEWAL.json"
      - "qikvrt/runtime/onboarding/NODE_HEALTH.json"
      - "tests/test_qikvrt_reflexive_repository_watchdog.py"
      - "tests/test_qikvrt_event_driven_monitor_platform_hold.py"
      - "policy/GITHUB_API_RATE_LIMIT_HOLD_V1.json"
      - "docs/REFLEXIVE_REPOSITORY_WATCHDOG.md"
      - "state/work_units/CONTINUOUS_GATEWATCH_NODE_LIVENESS_V1.json"
  pull_request:
    paths:
      - ".github/workflows/qikvrt_reflexive_repository_watchdog.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - "tools/qikvrt_reflexive_repository_watchdog.py"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "registry/NODE_DISCOVERY_POLICY.json"
      - "qikvrt/runtime/onboarding/SEED_ACCEPTANCE_STATUS.json"
      - "qikvrt/runtime/onboarding/NODE_REGISTRATION_RENEWAL.json"
      - "qikvrt/runtime/onboarding/NODE_HEALTH.json"
      - "tests/test_qikvrt_reflexive_repository_watchdog.py"
      - "tests/test_qikvrt_event_driven_monitor_platform_hold.py"
      - "policy/GITHUB_API_RATE_LIMIT_HOLD_V1.json"
      - "docs/REFLEXIVE_REPOSITORY_WATCHDOG.md"
      - "state/work_units/REFLEXIVE_REPOSITORY_WATCHDOG_V1.json"
      - "state/work_units/CONTINUOUS_GATEWATCH_NODE_LIVENESS_V1.json"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: qikvrt-reflexive-watchdog-${{ github.repository }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  pre-deadlock-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact observed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reobserve exact head, tree, runs, jobs, and previous reflexive receipt
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          mkdir -p "$root/jobs"
          local_head="$(git rev-parse --verify HEAD^{commit})"
          local_tree="$(git rev-parse --verify HEAD^{tree})"
          test "$local_head" = "$EXPECTED_HEAD"
          printf '%s\n' "$EXPECTED_HEAD" > "$root/observed-head.txt"
          printf '%s\n' "$local_tree" > "$root/observed-tree.txt"
          if test "$EVENT_NAME" = pull_request; then
            if test "${{ github.event.pull_request.base.ref }}" = main; then
              printf '%s\n' PULL_REQUEST_MAIN > "$root/observation-scope.txt"
            else
              printf '%s\n' PULL_REQUEST_STACKED > "$root/observation-scope.txt"
            fi
          else
            printf '%s\n' MAIN > "$root/observation-scope.txt"
          fi

          platform_hold() {
            error_file="$1"
            observed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            error_sha="$(sha256sum "$error_file" | awk '{print $1}')"
            export WATCHDOG_ROOT="$root" WATCHDOG_OBSERVED_AT="$observed_at" WATCHDOG_ERROR_SHA="$error_sha"
            python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["WATCHDOG_ROOT"])
          receipt = {
              "schema": "qikvrt_external_platform_hold_v1",
              "state": "HOLD_EXTERNAL_PLATFORM",
              "disposition": "HOLD",
              "first_blocker": "GITHUB_API_RATE_LIMIT",
              "productive_edge": "REOBSERVE_ON_NEXT_AUTHENTICATED_EVENT",
              "repository": os.environ["REPOSITORY"],
              "event": os.environ["EVENT_NAME"],
              "head_sha": (root / "observed-head.txt").read_text().strip(),
              "tree_sha": (root / "observed-tree.txt").read_text().strip(),
              "observation_scope": (root / "observation-scope.txt").read_text().strip(),
              "observed_at": os.environ["WATCHDOG_OBSERVED_AT"],
              "platform_error_sha256": os.environ["WATCHDOG_ERROR_SHA"],
              "semantic_work_performed": False,
              "blind_retry_performed": False,
              "completion_claims": {
                  "PASS": False,
                  "FINAL_PASS": False,
                  "EFFECT_ACK_DONE": False,
                  "DEADLOCK_FREEDOM_PROVED": False,
              },
          }
          encoded = json.dumps(receipt, sort_keys=True, indent=2) + "\n"
          (root / "platform-hold.json").write_text(encoded, encoding="utf-8")
          (root / "reflexive-watchdog-receipt.json").write_text(encoded, encoding="utf-8")
          (root / "gatewatch-receipt.json").write_text(encoded, encoding="utf-8")
          PY
            printf 'state=PLATFORM_HOLD\n' >> "$GITHUB_OUTPUT"
            {
              echo '### QIKVRT reflexive watchdog'
              echo
              echo '`HOLD_EXTERNAL_PLATFORM / GITHUB_API_RATE_LIMIT`'
              echo
              echo 'No semantic work, retry, dispatch, mutation, success inference, or terminal claim was performed.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          api_to_file() {
            endpoint="$1"
            target="$2"
            error_file="$root/api-error.txt"
            if gh api "$endpoint" > "$target" 2> "$error_file"; then
              rm -f "$error_file"
              return 0
            fi
            if grep -Eiq 'API rate limit exceeded|secondary rate limit' "$error_file"; then
              platform_hold "$error_file"
            fi
            cat "$error_file" >&2
            return 1
          }

          if test "$EVENT_NAME" = pull_request; then
            api_to_file "repos/$REPOSITORY/pulls/$EVENT_PR" "$root/live-pr.json"
            live_head="$(jq -r '.head.sha' "$root/live-pr.json")"
          else
            api_to_file "repos/$REPOSITORY/git/ref/heads/main" "$root/live-main.json"
            live_head="$(jq -r '.object.sha' "$root/live-main.json")"
          fi
          test "$live_head" = "$EXPECTED_HEAD"

          authority_repository="$(jq -r '.authority.repository' state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json)"
          test "$authority_repository" != null
          api_to_file "repos/$authority_repository/git/ref/heads/main" "$root/authority-main.json"
          jq -r '.object.sha' "$root/authority-main.json" > "$root/observed-authority-main-head.txt"
          api_to_file "repos/$REPOSITORY/actions/runs?head_sha=$EXPECTED_HEAD&per_page=100" "$root/current-runs.json"

          mapfile -t run_ids < <(jq -r '.workflow_runs[].id' "$root/current-runs.json")
          for run_id in "${run_ids[@]}"; do
            api_to_file "repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100" "$root/jobs/$run_id.json"
          done

          if test "$EVENT_NAME" != pull_request; then
            api_to_file "repos/$REPOSITORY/actions/workflows/qikvrt_reflexive_repository_watchdog.yml/runs?branch=main&status=completed&per_page=20" "$root/previous-runs.json"
            previous_run="$(jq -r --argjson current "$CURRENT_RUN_ID" '[.workflow_runs[] | select(.id != $current and .conclusion == "success")][0].id // empty' "$root/previous-runs.json")"
            if test -n "$previous_run"; then
              api_to_file "repos/$REPOSITORY/actions/runs/$previous_run/artifacts?per_page=100" "$root/previous-artifacts.json"
              previous_artifact="$(jq -r '[.artifacts[] | select(.name | startswith("qikvrt-reflexive-repository-watchdog-"))][0].id // empty' "$root/previous-artifacts.json")"
              if test -n "$previous_artifact"; then
                api_to_file "repos/$REPOSITORY/actions/artifacts/$previous_artifact/zip" "$root/previous-receipt.zip"
                unzip -p "$root/previous-receipt.zip" reflexive-watchdog-receipt.json > "$root/previous-receipt.json" 2>/dev/null || true
              fi
            fi
          fi
          printf 'state=READY\n' >> "$GITHUB_OUTPUT"

      - name: Analyze the pre-deadlock state without mutation
        if: steps.observe.outputs.state == 'READY'
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          head="$(cat "$root/observed-head.txt")"
          tree="$(cat "$root/observed-tree.txt")"
          scope="$(cat "$root/observation-scope.txt")"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          args=(
            analyze
            --runs-file "$root/current-runs.json"
            --jobs-dir "$root/jobs"
            --expect-head "$head"
            --expect-tree "$tree"
            --repository "$REPOSITORY"
            --now "$now"
            --observation-scope "$scope"
            --node-liveness-dir qikvrt/runtime/onboarding
            --authority-head-file "$root/observed-authority-main-head.txt"
            --json
          )
          if test -s "$root/previous-receipt.json"; then
            args+=(--baseline "$root/previous-receipt.json")
          fi
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py "${args[@]}" > "$root/reflexive-watchdog-receipt.json"
          cp "$root/reflexive-watchdog-receipt.json" "$root/gatewatch-receipt.json"
          jq '{state, disposition, first_blocker, productive_edge, semantic_fingerprint}' "$root/reflexive-watchdog-receipt.json"

      - name: Verify reflexive prevention and mesh continuity contracts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_reflexive_repository_watchdog \
            tests.test_qikvrt_workflow_executor_mesh_contract \
            tests.test_qikvrt_event_driven_monitor_platform_hold \
            tests.test_seed_workflows

      - name: Preserve the exact-head pre-deadlock receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-reflexive-repository-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: .qikvrt/reflexive-repository-watchdog
