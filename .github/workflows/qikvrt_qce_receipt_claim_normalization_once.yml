name: QIK-VRT QCE receipt claim normalization once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/qikvrt_qce_receipt_claim_normalization_once.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-qce-receipt-claim-normalization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/qce-receipt-claim-normalization-current-main-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize current-main-bound QCE successor
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_QCE_HEAD: cc25c76527f4bd768884caca8e4cd3075cadf5c1
          EXPECTED_BASE: 0680eab5444385877eae08c86373947d462ac3b7
          QCE_ROOT: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          RECEIPT_ROOT: release/qce-formal-model-run-31056926203-attempt-1
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$source_head" = "$remote_head" || { echo 'BLOCK: target head drift before materialization' >&2; exit 2; }
          git merge-base --is-ancestor "$EXPECTED_BASE" "$source_head" || { echo 'BLOCK: expected current main is not an ancestor' >&2; exit 2; }

          git fetch --no-tags origin "$SOURCE_QCE_HEAD"
          git checkout "$SOURCE_QCE_HEAD" -- \
            .github/workflows/qikvrt_qce_candidate.yml \
            "$QCE_ROOT" \
            "$RECEIPT_ROOT"

          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['QCE_ROOT'])
          receipt_root = Path(os.environ['RECEIPT_ROOT'])
          receipt_path = receipt_root / 'KERNEL_RECEIPT.json'
          axiom_path = receipt_root / 'AXIOM_OUTPUT.txt'
          verification_path = receipt_root / 'VERIFICATION.json'
          provenance_path = receipt_root / 'ARTIFACT_PROVENANCE.json'

          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          assert receipt['state'] == 'KERNEL_EXECUTED_FORMAL_MODEL_CANDIDATE'
          assert receipt['kernel_execution']['accepted_theorems'] == 36
          assert receipt['kernel_execution']['named_theorems'] == 36
          assert receipt['formal_scope']['physical_correspondence_established'] is False
          assert receipt['formal_scope']['physical_closure'] is False
          assert axiom_path.is_file() and verification_path.is_file() and provenance_path.is_file()

          matrix_path = root / 'CLAIM_MATRIX.json'
          matrix = json.loads(matrix_path.read_text(encoding='utf-8'))
          claims = matrix['claims']
          ids = [claim['id'] for claim in claims]
          assert len(claims) == 26
          assert len(set(ids)) == 26
          assert ids[:19] == [f'QCE-C{i:02d}' for i in range(1, 20)]
          assert ids[19:] == [f'QCE-O{i:02d}' for i in range(1, 8)]

          binding = {
              'artifact_provenance': str(provenance_path),
              'axiom_output': str(axiom_path),
              'kernel_receipt': str(receipt_path),
              'run_attempt': 1,
              'source_commit': '0401d030e9fa1514697d0bb011d8741c4aa514cf',
              'source_tree': '7815e92753f8691dc792cf064e9c62b20a12b653',
              'verification': str(verification_path),
              'workflow_run_id': 31056926203,
          }
          for claim in claims:
              cid = claim['id']
              if cid in {f'QCE-C{i:02d}' for i in range(5, 13)}:
                  claim['kind'] = 'formal-proved'
                  claim['formal_scope'] = 'finite-model-only'
                  claim['receipt_binding'] = binding
          by_id = {claim['id']: claim for claim in claims}
          by_id['QCE-C05']['boundary'] = (
              'Kernel-accepted finite-model result bound to the persisted receipt; '
              'model order is not thereby a physical-time theorem.'
          )
          by_id['QCE-C12']['boundary'] = (
              'Lean execution for the bound formal source is established; kernel acceptance '
              'remains finite-model status and does not establish empirical physical closure.'
          )
          for oid in [f'QCE-O{i:02d}' for i in range(1, 8)]:
              assert by_id[oid]['kind'] == 'open'

          matrix['claim_count'] = 26
          matrix['formal_execution'] = {
              'artifact_provenance': str(provenance_path),
              'axiom_output': str(axiom_path),
              'kernel_receipt': str(receipt_path),
              'lean_executed_for_this_candidate': True,
              'lean_source_prepared': True,
              'lean_version': '4.19.0',
              'receipt_state': 'KERNEL_EXECUTED_FORMAL_MODEL_CANDIDATE',
              'run_attempt': 1,
              'source_commit': '0401d030e9fa1514697d0bb011d8741c4aa514cf',
              'source_tree': '7815e92753f8691dc792cf064e9c62b20a12b653',
              'theorem_count': 36,
              'verification': str(verification_path),
              'workflow_run_id': 31056926203,
          }
          matrix['schema'] = 'qikvrt-qce-claim-matrix/2.0'
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          bundle_path = root / 'MACHINE_PROOF_BUNDLE.json'
          bundle = json.loads(bundle_path.read_text(encoding='utf-8'))
          bundle['formalization']['status'] = 'KERNEL_ACCEPTED_FINITE_MODEL'
          bundle['formalization']['theorem_count'] = 36
          bundle['receipt'] = {
              'artifact_provenance': str(provenance_path),
              'axiom_output': str(axiom_path),
              'executed_receipt': str(receipt_path),
              'required_before_zenodo_publication': True,
              'run_attempt': 1,
              'source_commit': '0401d030e9fa1514697d0bb011d8741c4aa514cf',
              'source_tree': '7815e92753f8691dc792cf064e9c62b20a12b653',
              'verification': str(verification_path),
              'workflow_run_id': 31056926203,
          }
          bundle_path.write_text(json.dumps(bundle, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('OK normalized 26 claims against 36-theorem persisted receipt')
          PY

          python3 -B "$QCE_ROOT/regenerate_qce_integrity.py"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 -B "$QCE_ROOT/verify_qce_package.py" \
            --static-only \
            --executed-receipt "$RECEIPT_ROOT/KERNEL_RECEIPT.json"
          python3 -B tools/qikvrt_publication_overview.py materialize --json

          rm .github/workflows/qikvrt_qce_receipt_claim_normalization_once.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_publication_overview.py check --json
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

          git config user.name 'qik-vrt qce normalization'
          git config user.email 'actions@users.noreply.github.com'
          git add -A \
            .github/workflows/qikvrt_qce_candidate.yml \
            .github/workflows/qikvrt_qce_receipt_claim_normalization_once.yml \
            "$QCE_ROOT" \
            "$RECEIPT_ROOT" \
            docs/publications/index.json \
            docs/publications/index.html \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git diff --cached --exit-code && { echo 'BLOCK: normalization produced no persisted delta' >&2; exit 2; }
          git commit -m 'docs: bind QCE claims to persisted kernel receipt'

          remote_head_after="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$source_head" = "$remote_head_after" || { echo 'BLOCK: target head drift before push' >&2; exit 2; }
          git push origin "HEAD:$TARGET_REF"
