name: Issue agent auto-finish hold

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional single issue number to include in the HOLD evidence
        required: false
        type: string

# This workflow is an observer only. Issue-agent STATUS.json bytes and an
# aggregate check rollup are not promotion Authority and can never authorize a
# merge, cross-repository synchronization, tag, release, or issue closure.
permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-agent-autofinish-hold
  cancel-in-progress: false

jobs:
  hold:
    name: Preserve the fail-closed issue-agent release boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Materialize read-only HOLD evidence plan
        env:
          REQUESTED_ISSUE: ${{ inputs.issue_number || '' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-issue-agent-autofinish-hold"
          mkdir -p "$root"
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg requested_issue "$REQUESTED_ISSUE" '
            {
              schema:"qikvrt_issue_agent_autofinish_hold_v1",
              state:"HOLD",
              d0:3,
              first_blocker:"ISSUE_AGENT_RELEASE_EFFECT_DISABLED",
              repository:$repository,
              requested_issue:(if $requested_issue == "" then null else $requested_issue end),
              authority_requirements:{
                empty_status_check_rollup_is_authority:false,
                exact_head_named_results:{required:true,state:"UNOBSERVED"},
                exact_ruleset_authority:{required:true,state:"UNOBSERVED"},
                unmarked_human_review:{required:true,state:"UNOBSERVED"},
                authority_mirror_binding:{
                  exact_heads_required:true,
                  exact_trees_required:true,
                  divergent_binding_is_authority:false,
                  state:"UNOBSERVED"
                },
                reciprocal_receipt:{required:true,state:"ABSENT"},
                tag_contract:{
                  annotated_required:true,
                  direct_or_lightweight_tag_allowed:false,
                  state:"NOT_CREATED"
                },
                marker_authorizations:{
                  separate_per_repository:true,
                  marker_only:true,
                  state:"ABSENT"
                }
              },
              continuation:{
                mode:"REQUEST_AUTHORITY",
                owner:"AUTHORITY_ADMIN",
                next_action:"USE_A_SEPARATE_EXACT_SUBJECT_MARKER_ONLY_RELEASE_TRANSACTION"
              },
              repository_or_release_effect:"NONE",
              transport_effect:"ACTIONS_ARTIFACT_UPLOAD",
              completion_claims:{
                merge:false,
                authority_mirror_synchronization:false,
                reciprocal_receipt_verified:false,
                tag_created:false,
                release:false,
                publication:false,
                deployment:false,
                pass:false,
                final_pass:false,
                effect_ack_done:false
              },
              productive_effect:false
            }' > "$root/hold-plan.json"
          jq -e '
            .state == "HOLD" and .d0 == 3 and
            .first_blocker == "ISSUE_AGENT_RELEASE_EFFECT_DISABLED" and
            .repository_or_release_effect == "NONE" and
            .transport_effect == "ACTIONS_ARTIFACT_UPLOAD" and
            .productive_effect == false and
            ([.completion_claims[]] | all(. == false)) and
            .authority_requirements.empty_status_check_rollup_is_authority == false and
            .authority_requirements.authority_mirror_binding.divergent_binding_is_authority == false and
            .authority_requirements.reciprocal_receipt.state == "ABSENT" and
            .authority_requirements.tag_contract.direct_or_lightweight_tag_allowed == false and
            .authority_requirements.marker_authorizations.state == "ABSENT"
          ' "$root/hold-plan.json" >/dev/null
          {
            echo '## Issue-agent auto-finish boundary'
            echo
            echo '```json'
            cat "$root/hold-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve read-only HOLD evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-issue-agent-autofinish-hold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-issue-agent-autofinish-hold/hold-plan.json
          if-no-files-found: error
          retention-days: 90
