name: Issue agent exact continuation reobservation

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional single issue number
        required: false
        type: string

# This observer has no effect authority. A scheduled wake, status text, or
# closure candidate never proves execution and never authorizes mutation.
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

concurrency:
  group: issue-agent-exact-reobservation
  cancel-in-progress: false

jobs:
  reobserve:
    runs-on: ubuntu-latest
    env:
      AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
      REQUESTED_ISSUE: ${{ inputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain every candidate as a live exact-binding continuation
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_ISSUE:-}" ]; then
            issue_numbers="$REQUESTED_ISSUE"
          else
            issue_numbers="$(gh issue list --repo "$AUTHORITY_REPOSITORY" --state open --limit 200 --json number --jq '.[].number')"
          fi
          for issue in $issue_numbers; do
            branch="issue-agent/$issue"
            pr="$(gh pr list --repo "$AUTHORITY_REPOSITORY" --state all --head "$branch" --limit 1 --json number --jq '.[0].number // empty')"
            if [ -z "$pr" ]; then
              echo "issue=$issue state=HOLD reason=NO_CURRENT_REPOSITORY_NATIVE_PR_BINDING"
              continue
            fi
            binding="$(gh pr view "$pr" --repo "$AUTHORITY_REPOSITORY" --json state,headRefOid,baseRefOid,reviews,statusCheckRollup)"
            state="$(printf '%s' "$binding" | jq -r '.state')"
            head="$(printf '%s' "$binding" | jq -r '.headRefOid // empty')"
            base="$(printf '%s' "$binding" | jq -r '.baseRefOid // empty')"
            tree="$(gh api "repos/$AUTHORITY_REPOSITORY/git/commits/$head" --jq '.tree.sha' 2>/dev/null || true)"
            if [ "$state" != OPEN ] || [ -z "$head" ] || [ -z "$tree" ]; then
              echo "issue=$issue pr=$pr state=HOLD reason=PR_BINDING_REPLACED_OR_UNVERIFIED"
              continue
            fi
            echo "issue=$issue pr=$pr state=CONTINUE head=$head tree=$tree base=$base next_action=REOBSERVE_EXACT_POSTCONDITION_OR_REBIND"
          done
