name: Issue agent completion authority observer
run-name: "Issue agent completion authority observer #${{ inputs.issue_number || github.event.pull_request.number }}"

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Exact issue number whose same-repository issue-agent PR is to be reobserved
        required: true
        type: string
      expected_head:
        description: Optional exact candidate head supplied by an event handoff
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

jobs:
  bind_issue:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      issue_number: ${{ steps.bind.outputs.issue_number }}
    env:
      AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
      REQUESTED_ISSUE: ${{ inputs.issue_number }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR: ${{ github.event.pull_request.number || '' }}
      EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
      EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
    steps:
      - name: Bind one safe issue identifier for observer serialization
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target)
              test "$EVENT_HEAD_REPOSITORY" = "$AUTHORITY_REPOSITORY"
              [[ "$EVENT_PR" =~ ^[1-9][0-9]*$ ]]
              [[ "$EVENT_HEAD_REF" =~ ^issue-agent/([1-9][0-9]*)$ ]]
              issue_number="${BASH_REMATCH[1]}"
              ;;
            workflow_dispatch)
              [[ "$REQUESTED_ISSUE" =~ ^[1-9][0-9]*$ ]]
              issue_number="$REQUESTED_ISSUE"
              ;;
            *)
              echo "HOLD_UNVERIFIED unsupported observer event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac
          printf 'issue_number=%s\n' "$issue_number" >> "$GITHUB_OUTPUT"

  observe:
    needs: bind_issue
    if: needs.bind_issue.result == 'success'
    concurrency:
      # The group comes only from the preflight's strict positive-integer
      # binding, never directly from an unvalidated dispatch input.
      group: issue-agent-completion-authority-observer-${{ needs.bind_issue.outputs.issue_number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
      REQUESTED_ISSUE: ${{ needs.bind_issue.outputs.issue_number }}
      EXPECTED_HEAD: ${{ inputs.expected_head || github.event.pull_request.head.sha || '' }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR: ${{ github.event.pull_request.number || '' }}
      EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
      EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact open issue-agent candidates and request merge authority
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target)
              test "$EVENT_HEAD_REPOSITORY" = "$AUTHORITY_REPOSITORY"
              [[ "$EVENT_PR" =~ ^[1-9][0-9]*$ ]]
              [[ "$EVENT_HEAD_REF" =~ ^issue-agent/([1-9][0-9]*)$ ]]
              issue_numbers="${BASH_REMATCH[1]}"
              ;;
            workflow_dispatch)
              [[ "$REQUESTED_ISSUE" =~ ^[1-9][0-9]*$ ]]
              issue_numbers="$REQUESTED_ISSUE"
              ;;
            *) exit 0 ;;
          esac
          test "$issue_numbers" = "$REQUESTED_ISSUE"

          publish_receipt() {
            local issue="$1"
            local receipt_file existing_comment readback marker
            receipt_file="$(mktemp)"
            cat > "$receipt_file"
            marker="$(sed -n '1p' "$receipt_file")"
            existing_comment="$(gh api --paginate "repos/${AUTHORITY_REPOSITORY}/issues/$issue/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- qikvrt-issue-agent-completion-authority:v1:")) | .id' \
              | tail -n 1)"
            if [ -z "$existing_comment" ]; then
              existing_comment="$(jq -n --rawfile body "$receipt_file" '{body:$body}' \
                | gh api --method POST "repos/${AUTHORITY_REPOSITORY}/issues/$issue/comments" \
                    --input - --jq .id)"
            else
              jq -n --rawfile body "$receipt_file" '{body:$body}' \
                | gh api --method PATCH "repos/${AUTHORITY_REPOSITORY}/issues/comments/$existing_comment" \
                    --input - >/dev/null
            fi
            readback="$(gh api "repos/${AUTHORITY_REPOSITORY}/issues/comments/$existing_comment")"
            test "$(jq -r .id <<<"$readback")" = "$existing_comment"
            jq -e --arg marker "$marker" '(.body // "") | contains($marker) and contains("REQUEST_AUTHORITY")' \
              <<<"$readback" >/dev/null
          }

          for issue in $issue_numbers; do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]] || continue
            branch="issue-agent/$issue"
            pull="$(gh pr list --repo "$AUTHORITY_REPOSITORY" --state open --head "$branch" --limit 1 \
              --json number,url,baseRefName,headRefName,headRefOid,isDraft,statusCheckRollup)"
            test "$(jq 'length' <<<"$pull")" -le 1
            test "$(jq 'length' <<<"$pull")" = 1 || continue
            pr_number="$(jq -r '.[0].number' <<<"$pull")"
            pr_url="$(jq -r '.[0].url' <<<"$pull")"
            base_ref="$(jq -r '.[0].baseRefName' <<<"$pull")"
            head_ref="$(jq -r '.[0].headRefName' <<<"$pull")"
            head_sha="$(jq -r '.[0].headRefOid' <<<"$pull")"
            draft="$(jq -r '.[0].isDraft' <<<"$pull")"
            test "$base_ref" = main
            test "$head_ref" = "$branch"
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            if test "$EVENT_NAME" = pull_request_target; then
              test "$pr_number" = "$EVENT_PR"
            fi
            if test -n "$EXPECTED_HEAD"; then
              test "$head_sha" = "$EXPECTED_HEAD"
            fi
            test "$(gh api "repos/${AUTHORITY_REPOSITORY}/git/ref/heads/$head_ref" --jq .object.sha)" = "$head_sha"
            test "$(gh api "repos/${AUTHORITY_REPOSITORY}/pulls/$pr_number" --jq '.head.repo.full_name // empty')" = "$AUTHORITY_REPOSITORY"
            failed="$(jq '[.[0].statusCheckRollup[]? | select((.conclusion // "") != "" and (.conclusion != "SUCCESS" and .conclusion != "NEUTRAL" and .conclusion != "SKIPPED"))] | length' <<<"$pull")"
            pending="$(jq '[.[0].statusCheckRollup[]? | select((.status // "") != "COMPLETED")] | length' <<<"$pull")"
            fingerprint="$(printf '%s\0%s\0%s\0%s\0%s' "$issue" "$pr_number" "$head_sha" "$base_ref" "$draft" | sha256sum | cut -d' ' -f1)"
            publish_receipt "$issue" <<EOF
          <!-- qikvrt-issue-agent-completion-authority:v1:${fingerprint} -->
          REQUEST_AUTHORITY: exact issue-agent candidate requires the protected pull-request route.

          - issue: #$issue
          - pull request: #$pr_number ($pr_url)
          - base: $base_ref
          - exact head: $head_sha
          - observer workflow run: $GITHUB_RUN_ID
          - draft: $draft
          - failed checks observed: $failed
          - pending checks observed: $pending

          This observer does not merge, reclassify a draft, push a ref, synchronize a mirror, create a tag, close an issue, publish, or claim PASS, FINAL_PASS, or EFFECT_ACK_DONE. A human-authorized protected-route action must reobserve this exact subject before any mutation.
          EOF
          done
