# Temporary finite integrity bootstrap for the already owner-authored DNS
# loopback repair. Verifies the exact pushed source, removes itself, regenerates
# repository integrity, CAS-pushes one successor, then cannot run again.
name: QIKVRT cloud transputer DNS loopback integrity bootstrap

on:
  push:
    branches: [runtime/cloud-transputer-v1]

permissions:
  contents: write

concurrency:
  group: qikvrt-cloud-transputer-dns-loopback-integrity-bootstrap
  cancel-in-progress: false

jobs:
  materialize-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact DNS loopback repair contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest -v tests.test_qikvrt_cloud_transputer_contract
          sh -n deploy/cloud-transputer/entrypoint.sh \
                deploy/cloud-transputer/runtime-health.sh \
                deploy/cloud-transputer/authority-mirror-refresh.sh
          python3 -B - <<'PY'
          from pathlib import Path
          text=Path('deploy/cloud-transputer/entrypoint.sh').read_text(encoding='utf-8')
          dns=text.split('cat > "$RUN_DIR/dnsmasq.conf" <<EOF\n',1)[1].split('\nEOF\ndnsmasq ',1)[0]
          assert 'port=$DNS_PORT' in dns
          assert 'listen-address=' not in dns
          assert 'bind-dynamic' not in dns
          assert 'address=/$MESH_DOMAIN/127.0.0.1' in dns
          PY

      - name: Remove bootstrap and regenerate integrity trio
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/qikvrt_cloud_transputer_dns_loopback_integrity_bootstrap.yml
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote --heads origin refs/heads/runtime/cloud-transputer-v1 | awk 'NR==1 {print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git commit -m "evidence: materialize cloud DNS loopback integrity"
          git push origin HEAD:refs/heads/runtime/cloud-transputer-v1