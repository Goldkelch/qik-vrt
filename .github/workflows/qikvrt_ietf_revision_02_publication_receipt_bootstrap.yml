          PY

      - name: Regenerate repository-native integrity and validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile "$TEST_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          expected = {
              os.environ["WORKFLOW_PATH"],
              os.environ["CANDIDATE_PATH"],
              os.environ["RECEIPT_PATH"],
              os.environ["TEST_PATH"],
              "REPOSITORY_FILE_MANIFEST.json",
              "REPOSITORY_FILE_MANIFEST.json.sha256",
              "SHA256SUMS.txt",
          }
          raw = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "-z",
                  "--untracked-files=all",
              ]
          )
          observed: set[str] = set()
          for item in raw.split(b"\0"):
              if not item:
                  continue
              observed.add(item[3:].decode("utf-8"))
          if observed != expected:
              raise SystemExit(
                  "BLOCK: final repository delta differs: "
                  + ",".join(sorted(observed))
              )
          candidate = Path(os.environ["CANDIDATE_PATH"])
          receipt = Path(os.environ["RECEIPT_PATH"])
          if not candidate.is_file() or not receipt.is_file():
              raise SystemExit("BLOCK: materialized IETF evidence is absent")
          PY

      - name: Persist receipt and advanced candidate state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qik-vrt-ietf-publication[bot]'
          git config user.email \
            'qik-vrt-ietf-publication[bot]@users.noreply.github.com'
          git add -A -- \
            "$WORKFLOW_PATH" \
            "$CANDIDATE_PATH" \
            "$RECEIPT_PATH" \
            "$TEST_PATH" \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'evidence: persist IETF revision 02 publication receipt'
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$EXPECTED_BRANCH" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
