name: Bootstrap IETF revision 02 publication receipt

on:
  push:
    branches:
      - evidence/ietf-revision-02-publication-receipt-v1
    paths:
      - .github/workflows/qikvrt_ietf_revision_02_publication_receipt_bootstrap.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-ietf-revision-02-publication-receipt-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_BRANCH: evidence/ietf-revision-02-publication-receipt-v1
      EXPECTED_PARENT: 3e6981a5a43a9c6b734e88e20cc6ad65420dee76
      WORKFLOW_PATH: .github/workflows/qikvrt_ietf_revision_02_publication_receipt_bootstrap.yml
      HELPER_PATH: .github/qikvrt_ietf_revision_02_publication_receipt_bootstrap.py
      CANDIDATE_PATH: external/ietf/draft-lohmann-qikvrt-effect-ack-02.CANDIDATE.json
      RECEIPT_PATH: external/ietf/draft-lohmann-qikvrt-effect-ack-02.PUBLICATION_RECEIPT.json
      TEST_PATH: tests/test_ietf_revision_02.py
    steps:
      - name: Check out exact bootstrap head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-shot bootstrap boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Goldkelch/qik-vrt"
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXPECTED_PARENT" "$GITHUB_SHA"
          test ! -e "$RECEIPT_PATH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          raw = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-status",
                  "--no-renames",
                  os.environ["EXPECTED_PARENT"],
                  os.environ["GITHUB_SHA"],
                  "--",
              ],
              text=True,
              encoding="utf-8",
          )
          observed = set(raw.splitlines())
          expected = {
              "A\t" + os.environ["HELPER_PATH"],
              "A\t" + os.environ["WORKFLOW_PATH"],
          }
          print("OBSERVED_BOOTSTRAP_DELTA=" + repr(sorted(observed)))
          print("EXPECTED_BOOTSTRAP_DELTA=" + repr(sorted(expected)))
          if observed != expected:
              raise SystemExit(
                  "BLOCK: bootstrap repository delta differs: "
                  + repr(sorted(observed))
              )

          candidate = json.loads(
              Path(os.environ["CANDIDATE_PATH"]).read_text(encoding="utf-8")
          )
          if candidate.get("state") != "CANDIDATE_NOT_SUBMITTED":
              raise SystemExit("BLOCK: candidate state advanced before bootstrap")
          if candidate.get("datatracker_submission_performed") is not False:
              raise SystemExit("BLOCK: submission flag advanced before bootstrap")
          PY

      - name: Fetch official public bytes and materialize receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$HELPER_PATH"

      - name: Regenerate repository-native integrity and validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile "$TEST_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          expected = {
              os.environ["WORKFLOW_PATH"],
              os.environ["HELPER_PATH"],
              os.environ["CANDIDATE_PATH"],
              os.environ["RECEIPT_PATH"],
              os.environ["TEST_PATH"],
              "REPOSITORY_FILE_MANIFEST.json",
              "REPOSITORY_FILE_MANIFEST.json.sha256",
              "SHA256SUMS.txt",
          }
          raw = subprocess.check_output(
              [
                  "git",
                  "status",
                  "--porcelain=v1",
                  "-z",
                  "--untracked-files=all",
              ]
          )
          observed: set[str] = set()
          for item in raw.split(b"\0"):
              if not item:
                  continue
              observed.add(item[3:].decode("utf-8"))
          print("OBSERVED_FINAL_DELTA=" + repr(sorted(observed)))
          print("EXPECTED_FINAL_DELTA=" + repr(sorted(expected)))
          if observed != expected:
              raise SystemExit(
                  "BLOCK: final repository delta differs: "
                  + ",".join(sorted(observed))
              )
          for variable in ("CANDIDATE_PATH", "RECEIPT_PATH", "TEST_PATH"):
              if not Path(os.environ[variable]).is_file():
                  raise SystemExit(f"BLOCK: expected materialized path absent: {variable}")
          PY

      - name: Persist receipt and advanced candidate state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qik-vrt-ietf-publication[bot]'
          git config user.email \
            'qik-vrt-ietf-publication[bot]@users.noreply.github.com'
          git add -A -- \
            "$WORKFLOW_PATH" \
            "$HELPER_PATH" \
            "$CANDIDATE_PATH" \
            "$RECEIPT_PATH" \
            "$TEST_PATH" \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'evidence: persist IETF revision 02 publication receipt'
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$EXPECTED_BRANCH" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
