name: QIK-VRT repair self-healing repository publication once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/qikvrt_repair_self_healing_repository_publication_once.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-repair-self-healing-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/self-healing-repository-collective-intelligence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact deterministic successor
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$source_head" = "$remote_head" || {
            echo "BLOCK: target head drift before repair" >&2
            exit 2
          }

          python3 -B tools/qikvrt_publication_overview.py materialize --json
          python3 -B docs/publications/2026-08-06-self-healing-repository-collective-intelligence/verify_package.py

          rm .github/workflows/qikvrt_repair_self_healing_repository_publication_once.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_publication_overview.py check --json
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

          git config user.name 'qik-vrt publication self-heal'
          git config user.email 'actions@users.noreply.github.com'
          git add -A \
            .github/workflows/qikvrt_repair_self_healing_repository_publication_once.yml \
            docs/publications/index.json \
            docs/publications/index.html \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git diff --cached --exit-code && {
            echo 'BLOCK: deterministic repair produced no persisted delta' >&2
            exit 2
          }
          git commit -m 'ci: bind publication overview and repository integrity'

          remote_head_after="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$source_head" = "$remote_head_after" || {
            echo "BLOCK: target head drift before push" >&2
            exit 2
          }
          git push origin "HEAD:$TARGET_REF"
