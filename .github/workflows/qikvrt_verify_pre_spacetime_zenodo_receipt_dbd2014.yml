name: QIK-VRT verify exact pre-spacetime Zenodo receipt dbd2014

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qikvrt_verify_pre_spacetime_zenodo_receipt_dbd2014.yml

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  verify:
    if: github.repository == 'Goldkelch/qik-vrt' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_PR: '389'
      CANDIDATE_HEAD: dbd2014c7dd5c8bdbe75f417f148063746e9c1c7
      BASE_HEAD: 9eb514678b5a27e241a146788076e8aa75d366fe
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify live head, ancestry, exact final tree delta, receipt, integrity and full suite
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$(python3 - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['CANDIDATE_PR']}"
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_API_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'qik-vrt-exact-head-verifier',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              value = json.load(response)
          if value['state'] != 'open':
              raise SystemExit('candidate PR is not open')
          print(value['head']['sha'])
          PY
          )"
          test "$remote_head" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          git merge-base --is-ancestor "$BASE_HEAD" "$CANDIDATE_HEAD"
          test "$(git merge-base "$BASE_HEAD" "$CANDIDATE_HEAD")" = "$BASE_HEAD"
          git diff --name-only "$BASE_HEAD" "$CANDIDATE_HEAD" > /tmp/paths
          cat /tmp/paths
          test "$(wc -l < /tmp/paths)" -eq 4
          grep -Fx 'REPOSITORY_FILE_MANIFEST.json' /tmp/paths
          grep -Fx 'REPOSITORY_FILE_MANIFEST.json.sha256' /tmp/paths
          grep -Fx 'SHA256SUMS.txt' /tmp/paths
          grep -Fx 'evidence/receipts/zenodo/pre-spacetime-ontology-2026-08-05-publication.json' /tmp/paths
          ! grep -E '^\.github/workflows/' /tmp/paths
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          path = Path('evidence/receipts/zenodo/pre-spacetime-ontology-2026-08-05-publication.json')
          receipt = json.loads(path.read_text(encoding='utf-8'))
          assert receipt['state'] == 'PUBLICATION_RECEIPT_PERSISTED'
          assert receipt['request_id'] == 'qikvrt-pre-spacetime-ontology-zenodo-request-20260805-v1'
          assert receipt['authorization_payload_sha256'] == '462f8c4cfc560c0fb48617a42eed1bdd68b8fa8a055c737260a68e1c1a310f74'
          assert receipt['zenodo']['doi'] == '10.5281/zenodo.21804399'
          assert receipt['zenodo']['record_id'] == 21804399
          assert receipt['public_redownload']['performed'] is True
          assert receipt['public_redownload']['byte_equality_established'] is True
          assert receipt['effect_boundary'] == {'pass': False, 'final_pass': False, 'effect_ack_done': False}
          expected = {
              'PAPER.tex': (9029, '003b22480dd598669939bf65598ea12470510f5612ad456057d26664ce38990f'),
              'REFERENCES.bib': (5565, 'a3de70b9f5037902e0984628c8bc0f8877deb5e7ed14497b4b03e55da28a021f'),
              'WHATSAPP_READALOUD.md': (11486, 'c3cb0cfeef4c8ccda6c73897b447ca4d3d63a369acda83bf82cdc09265c7ad88'),
              'README.md': (1399, 'a23160eaca76906bea9894b2a603549ca27f2b4a2a3b85631432d7d7cf89960a'),
          }
          observed = {item['name']: (item['bytes'], item['sha256']) for item in receipt['public_redownload']['files']}
          assert observed == expected
          PY
          python3 -B tools/qikvrt_integrity.py verify
          make test
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test -z "$(git status --porcelain)"
      - name: Attest required test check on exact candidate head
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, urllib.request
          payload = {
              'name': 'test',
              'head_sha': os.environ['CANDIDATE_HEAD'],
              'status': 'completed',
              'conclusion': 'success',
              'details_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'output': {
                  'title': 'Trusted exact-head verification succeeded',
                  'summary': 'Verified live PR head, main ancestry, exact four-path delta, publication receipt, public byte equality, repository integrity, complete mandatory suite, unchanged HEAD, and clean worktree.',
              },
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_API_TOKEN'],
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'qik-vrt-exact-head-attestor',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              value = json.load(response)
          if value['name'] != 'test' or value['head_sha'] != os.environ['CANDIDATE_HEAD'] or value['conclusion'] != 'success':
              raise SystemExit('required test check attestation mismatch')
          print(value['id'])
          PY
