name: QIK-VRT expected-head promotion executor

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional PR number; still requires the repository promotion marker"
        required: false
        type: string
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows:
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT Batch-003 remaining subject disposition"
      - "QIK-VRT universal ontology finite-model verification"
      - "QIK-VRT measurement-independence boundary verification"
      - "QIK-VRT manuscript proof coverage"
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: qikvrt-expected-head-promotion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PROMOTION_MARKER: "<!-- qikvrt-expected-head-promotion:enabled external_effect=NONE -->"
      REQUIRED_GATES_JSON: >-
        ["QIKVRT CI","QIKVRT repository evidence materialization","QIKVRT Collective Proposal Review","QIK-VRT global claim completion"]
    steps:
      - name: Check out current main promotion code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Regression-test promotion decision core
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_qikvrt_expected_head_promotion

      - name: Discover every marked current-base candidate
        id: candidate
        env:
          REQUESTED_PR: ${{ inputs.pr || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' > /tmp/qikvrt-promotion-candidate.json
          import datetime as dt
          import json
          import os
          import subprocess

          repository = os.environ['REPOSITORY']
          marker = os.environ['PROMOTION_MARKER']
          requested = os.environ.get('REQUESTED_PR', '').strip()

          def gh_json(path):
              raw = subprocess.check_output(['gh', 'api', path], text=True)
              return json.loads(raw)

          def gh_pages(path):
              raw = subprocess.check_output(
                  ['gh', 'api', '--paginate', '--slurp', path], text=True
              )
              pages = json.loads(raw)
              result = []
              for page in pages:
                  if isinstance(page, list):
                      result.extend(page)
                  else:
                      result.append(page)
              return result

          current_main = gh_json(f'repos/{repository}/commits/main')['sha']
          if requested:
              prs = [gh_json(f'repos/{repository}/pulls/{int(requested)}')]
          else:
              prs = gh_pages(f'repos/{repository}/pulls?state=open&base=main&per_page=100')

          candidates = []
          for pr in prs:
              if pr.get('state') != 'open' or pr.get('base', {}).get('ref') != 'main':
                  continue
              # A stale-base PR is not a current writer and cannot be promoted.
              if pr.get('base', {}).get('sha') != current_main:
                  continue
              body = pr.get('body') or ''
              marked = marker in body
              if not marked:
                  comments = gh_pages(
                      f"repos/{repository}/issues/{pr['number']}/comments?per_page=100"
                  )
                  marked = any(marker in (comment.get('body') or '') for comment in comments)
              if not marked:
                  continue
              candidates.append(pr)

          rows = []
          for pr in candidates:
              updated = dt.datetime.fromisoformat(pr['updated_at'].replace('Z', '+00:00'))
              rows.append({
                  'pr_number': int(pr['number']),
                  'last_progress_epoch': int(updated.timestamp()),
              })
          rows.sort(key=lambda row: (row['last_progress_epoch'], row['pr_number']))
          print(json.dumps({
              'state': 'CANDIDATES' if rows else 'NOOP',
              'current_main_sha': current_main,
              'candidates': rows,
          }, sort_keys=True))
          PY
          cat /tmp/qikvrt-promotion-candidate.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open('/tmp/qikvrt-promotion-candidate.json', encoding='utf-8'))
          print(f"state={value['state']}")
          print(f"main_sha={value['current_main_sha']}")
          PY

      - name: Materialize and evaluate every exact live promotion snapshot
        if: steps.candidate.outputs.state == 'CANDIDATES'
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' > /tmp/qikvrt-promotion-snapshots.json
          import json
          import os
          import subprocess

          repository = os.environ['REPOSITORY']
          required_gates = json.loads(os.environ['REQUIRED_GATES_JSON'])
          discovery = json.load(
              open('/tmp/qikvrt-promotion-candidate.json', encoding='utf-8')
          )
          generated_projections = {
              'REPOSITORY_FILE_MANIFEST.json',
              'REPOSITORY_FILE_MANIFEST.json.sha256',
              'SHA256SUMS.txt',
          }

          def gh_json(path):
              raw = subprocess.check_output(['gh', 'api', path], text=True)
              return json.loads(raw)

          def gh_pages(path):
              raw = subprocess.check_output(
                  ['gh', 'api', '--paginate', '--slurp', path], text=True
              )
              pages = json.loads(raw)
              result = []
              for page in pages:
                  if isinstance(page, list):
                      result.extend(page)
                  else:
                      result.append(page)
              return result

          def gh_run_pages(path):
              raw = subprocess.check_output(
                  ['gh', 'api', '--paginate', '--slurp', path], text=True
              )
              pages = json.loads(raw)
              runs = []
              for page in pages:
                  if isinstance(page, dict):
                      runs.extend(page.get('workflow_runs', []))
              return runs

          current_main = gh_json(f'repos/{repository}/commits/main')['sha']
          open_prs = gh_pages(f'repos/{repository}/pulls?state=open&base=main&per_page=100')
          file_cache = {}

          def files(pr_number):
              if pr_number not in file_cache:
                  file_cache[pr_number] = {
                      item['filename']
                      for item in gh_pages(
                          f'repos/{repository}/pulls/{pr_number}/files?per_page=100'
                      )
                  }
              return file_cache[pr_number]

          snapshots = []
          for row in discovery['candidates']:
              pr_number = int(row['pr_number'])
              pr = gh_json(f'repos/{repository}/pulls/{pr_number}')
              head = pr['head']['sha']
              runs = gh_run_pages(
                  f'repos/{repository}/actions/runs?head_sha={head}&event=pull_request&per_page=100'
              )
              workflow_runs = [
                  {
                      'name': run.get('name'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'run_number': run.get('run_number'),
                  }
                  for run in runs
              ]
              candidate_files = files(pr_number)
              overlaps = []
              for other in open_prs:
                  if other['number'] == pr_number:
                      continue
                  # Stale-base PRs cannot currently write main. Exact-head
                  # verification proxies are observations, not competing writers.
                  if other.get('base', {}).get('sha') != current_main:
                      continue
                  if other.get('head', {}).get('sha') == head:
                      continue
                  common = sorted(
                      (candidate_files & files(other['number'])) - generated_projections
                  )
                  if common:
                      overlaps.append({'pr_number': other['number'], 'paths': common})
              snapshots.append({
                  'pr_number': pr_number,
                  'last_progress_epoch': int(row['last_progress_epoch']),
                  'current_main_sha': current_main,
                  'base_sha': pr['base']['sha'],
                  'expected_head_sha': head,
                  'current_head_sha': head,
                  'draft': bool(pr.get('draft')),
                  'mergeable': pr.get('mergeable') is True,
                  'external_effect': 'NONE',
                  'required_gates': required_gates,
                  'workflow_runs': workflow_runs,
                  'competing_writer_overlaps': overlaps,
              })

          print(json.dumps({'candidates': snapshots}, sort_keys=True))
          PY

          set +e
          python3 -B tools/qikvrt_expected_head_promotion.py evaluate-queue \
            --input /tmp/qikvrt-promotion-snapshots.json \
            > /tmp/qikvrt-promotion-decision.json
          rc=$?
          set -e
          cat /tmp/qikvrt-promotion-decision.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open('/tmp/qikvrt-promotion-decision.json', encoding='utf-8'))
          print(f"state={value['state']}")
          print(f"pr={value.get('selected_pr_number') or ''}")
          print(f"head={value.get('selected_head_sha') or ''}")
          print(f"blocker={value.get('first_blocker') or ''}")
          PY
          if [ "$rc" -ne 0 ]; then
            exit 0
          fi

      - name: Reobserve exact unchanged head and advance one promotion phase
        if: steps.decision.outputs.state == 'PROMOTABLE'
        env:
          PR_NUMBER: ${{ steps.decision.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.decision.outputs.head }}
          EXPECTED_BASE: ${{ steps.candidate.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)"
          current_head="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          current_base="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.sha)"
          merged="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .merged)"
          draft="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .draft)"
          test "$merged" = "false"
          test "$current_main" = "$EXPECTED_BASE"
          test "$current_base" = "$EXPECTED_BASE"
          test "$current_head" = "$EXPECTED_HEAD"

          if [ "$draft" = "true" ]; then
            # Phase 1 only. ready_for_review may itself register new checks, so
            # this run MUST NOT merge. A later workflow_run/schedule cycle will
            # rebuild the exact-head gate snapshot before Phase 2.
            gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
            echo "READY_RECLASSIFIED_REOBSERVATION_REQUIRED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Phase 2: candidate was already Ready before this run and all gates
          # were freshly re-evaluated above. Rebind head/base immediately before
          # the irreversible repository-history transition.
          current_main="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)"
          current_head="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          current_base="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.sha)"
          test "$current_main" = "$EXPECTED_BASE"
          test "$current_base" = "$EXPECTED_BASE"
          test "$current_head" = "$EXPECTED_HEAD"

          gh api \
            --method PUT \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=merge \
            -f sha="$EXPECTED_HEAD" \
            > /tmp/qikvrt-promotion-merge.json
          cat /tmp/qikvrt-promotion-merge.json
          test "$(python3 -c 'import json; print(str(json.load(open("/tmp/qikvrt-promotion-merge.json"))["merged"]).lower())')" = "true"

          promoted_main="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)"
          test "$promoted_main" != "$EXPECTED_BASE"
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "Expected-head promotion completed by repository-native executor. Source head: \`$EXPECTED_HEAD\`; previous main: \`$EXPECTED_BASE\`; promoted main: \`$promoted_main\`. No Zenodo/IETF/release/PASS/FINAL_PASS/EFFECT_ACK_DONE effect is implied."

      - name: Persist bounded decision summary
        if: always()
        shell: bash
        run: |
          {
            echo "## QIK-VRT expected-head promotion"
            echo
            if [ -f /tmp/qikvrt-promotion-decision.json ]; then
              echo '```json'
              cat /tmp/qikvrt-promotion-decision.json
              echo '```'
            elif [ -f /tmp/qikvrt-promotion-candidate.json ]; then
              echo '```json'
              cat /tmp/qikvrt-promotion-candidate.json
              echo '```'
            else
              echo "No promotion snapshot was materialized."
            fi
            echo
            echo "External effects remain fail-closed."
          } >> "$GITHUB_STEP_SUMMARY"
