name: QIKVRT main ruleset reconciler

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - qikvrt_ruleset_reconcile
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - policy/GITHUB_MAIN_RULESET_V1.json
      - tools/qikvrt_ruleset_reconcile.py
      - .github/workflows/qikvrt_ruleset_reconcile.yml
      - state/authorization/delegations/OWNER_REPOSITORY_GLOBAL_RULESET_AUTONOMY_V1.json

permissions:
  contents: read
  statuses: write

concurrency:
  group: qikvrt-main-ruleset-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QIKVRT_RULESET_ADMIN_TOKEN: ${{ secrets.QIKVRT_RULESET_ADMIN_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RULESET_ID: "19344903"
      STATUS_CONTEXT: QIKVRT main ruleset reconciliation
      ROOT: ${{ runner.temp }}/qikvrt-main-ruleset

    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind repository-global subject and classify live ruleset
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          checkout="$(git rev-parse --verify HEAD^{commit})"
          live_main="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)"
          test "$checkout" = "$live_main"
          printf '%s\n' "$live_main" > "$ROOT/main-head.txt"

          gh api "repos/${REPOSITORY}/rulesets/${RULESET_ID}" > "$ROOT/live-ruleset-before.json"

          set +e
          python3 -B tools/qikvrt_ruleset_reconcile.py \
            --snapshot "$ROOT/live-ruleset-before.json" \
            --receipt "$ROOT/preflight-receipt.json"
          preflight_rc=$?
          set -e
          printf '%s\n' "$preflight_rc" > "$ROOT/preflight-exit-code.txt"
          preflight_state="$(jq -r .state "$ROOT/preflight-receipt.json")"

          if [ "$preflight_state" = CURRENT ]; then
            cp "$ROOT/preflight-receipt.json" "$ROOT/effect-receipt.json"
          elif [ "$preflight_state" = DRIFT ]; then
            if [ -n "${QIKVRT_RULESET_ADMIN_TOKEN:-}" ]; then
              set +e
              python3 -B tools/qikvrt_ruleset_reconcile.py \
                --apply \
                --receipt "$ROOT/apply-receipt.json"
              apply_rc=$?
              set -e
              printf '%s\n' "$apply_rc" > "$ROOT/apply-exit-code.txt"
              cp "$ROOT/apply-receipt.json" "$ROOT/effect-receipt.json"
            else
              jq \
                '. + {
                  state: "REQUEST_AUTHORITY",
                  first_blocker: "QIKVRT_RULESET_ADMIN_TOKEN_UNAVAILABLE",
                  next_action: "INSTALL_OR_CONNECT_RULESET_ADMIN_AUTHORITY",
                  continuation_required: true,
                  mutation: "NONE",
                  effect_observed: false,
                  repository_global_subject: true,
                  owner_authored_pr_required: false,
                  authority_issue: 1232
                }' \
                "$ROOT/preflight-receipt.json" > "$ROOT/effect-receipt.json"
            fi
          else
            cp "$ROOT/preflight-receipt.json" "$ROOT/effect-receipt.json"
          fi

          state="$(jq -r .state "$ROOT/effect-receipt.json")"
          effect_observed="$(jq -r '.effect_observed // false' "$ROOT/effect-receipt.json")"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "effect_observed=$effect_observed" >> "$GITHUB_OUTPUT"
          cat "$ROOT/effect-receipt.json"

      - name: Independent post-effect readback and repository-global status
        shell: bash
        run: |
          set -euo pipefail
          expected_main="$(cat "$ROOT/main-head.txt")"
          live_main="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)"
          test "$live_main" = "$expected_main"

          state="$(jq -r .state "$ROOT/effect-receipt.json")"
          case "$state" in
            CURRENT)
              gh api "repos/${REPOSITORY}/rulesets/${RULESET_ID}" > "$ROOT/live-ruleset-after.json"
              python3 -B tools/qikvrt_ruleset_reconcile.py \
                --snapshot "$ROOT/live-ruleset-after.json" \
                --receipt "$ROOT/post-readback-receipt.json"
              test "$(jq -r .state "$ROOT/post-readback-receipt.json")" = CURRENT
              gh api --method POST "repos/${REPOSITORY}/statuses/${expected_main}" \
                -f state=success \
                -f context="$STATUS_CONTEXT" \
                -f description="ruleset 19344903 CURRENT by independent readback" \
                -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              ;;
            REQUEST_AUTHORITY)
              gh api --method POST "repos/${REPOSITORY}/statuses/${expected_main}" \
                -f state=pending \
                -f context="$STATUS_CONTEXT" \
                -f description="REQUEST_AUTHORITY: ruleset admin credential unavailable" \
                -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              ;;
            *)
              gh api --method POST "repos/${REPOSITORY}/statuses/${expected_main}" \
                -f state=failure \
                -f context="$STATUS_CONTEXT" \
                -f description="ruleset reconciliation failed closed" \
                -f target_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              exit 2
              ;;
          esac

      - name: Preserve repository-global reconciliation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-main-ruleset-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-main-ruleset
          if-no-files-found: error
          retention-days: 90
