# Temporary finite control-plane repair: make every push to the dedicated
# cloud-transputer carrier reobserve the exact head even when the tree is
# identical, then remove this workflow in the same integrity-bound commit.
name: QIKVRT cloud transputer reobserve trigger repair bootstrap

on:
  push:
    branches: [runtime/cloud-transputer-v1]

permissions:
  contents: write

concurrency:
  group: qikvrt-cloud-transputer-reobserve-trigger-repair-bootstrap
  cancel-in-progress: false

jobs:
  repair-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Repair dedicated-branch exact-head reobservation trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/qikvrt_cloud_transputer.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old = """  push:\n    branches: [runtime/cloud-transputer-v1]\n    paths:\n      - 'policy/QIKVRT_CLOUD_TRANSPUTER_V1.json'\n      - 'deploy/cloud-transputer/**'\n      - 'src/cloud_transputer/**'\n      - 'docs/cloud-transputer/**'\n      - 'docs/terminal/QIKVRT_CLOUD_TRANSPUTER_V1.md'\n      - 'tests/test_qikvrt_cloud_transputer_contract.py'\n      - '.github/workflows/qikvrt_cloud_transputer.yml'\n  workflow_dispatch:\n"""
          new = """  push:\n    branches: [runtime/cloud-transputer-v1]\n  workflow_dispatch:\n"""
          if workflow.count(old) != 1:
              raise SystemExit('BLOCK: exact dedicated-branch push paths gate not observed once')
          workflow_path.write_text(workflow.replace(old, new), encoding='utf-8', newline='\n')

          test_path = Path('tests/test_qikvrt_cloud_transputer_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          old_const = 'HEALTH = ROOT / "deploy/cloud-transputer/runtime-health.sh"\nMIRROR = ROOT / "deploy/cloud-transputer/authority-mirror-refresh.sh"\n'
          new_const = 'HEALTH = ROOT / "deploy/cloud-transputer/runtime-health.sh"\nRUNTIME_WORKFLOW = ROOT / ".github/workflows/qikvrt_cloud_transputer.yml"\nMIRROR = ROOT / "deploy/cloud-transputer/authority-mirror-refresh.sh"\n'
          if tests.count(old_const) != 1:
              raise SystemExit('BLOCK: workflow constant insertion anchor not observed once')
          tests = tests.replace(old_const, new_const)
          anchor = '    def test_c90_probe_uses_existing_effect_ack_core_without_false_arch_claim(self) -> None:\n'
          method = '''    def test_dedicated_branch_push_reobserves_zero_diff_owner_rebinds(self) -> None:\n        text = RUNTIME_WORKFLOW.read_text(encoding="utf-8")\n        push = text.split("  push:\\n", 1)[1].split("  workflow_dispatch:\\n", 1)[0]\n        self.assertIn("branches: [runtime/cloud-transputer-v1]", push)\n        self.assertNotIn("paths:", push)\n\n'''
          if method in tests:
              raise SystemExit('BLOCK: reobservation regression contract already present unexpectedly')
          if tests.count(anchor) != 1:
              raise SystemExit('BLOCK: reobservation regression insertion anchor not observed once')
          test_path.write_text(tests.replace(anchor, method + anchor), encoding='utf-8', newline='\n')
          PY

          python3 -B -m unittest -v tests.test_qikvrt_cloud_transputer_contract
          python3 -B - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/qikvrt_cloud_transputer.yml').read_text(encoding='utf-8')
          push=text.split('  push:\n',1)[1].split('  workflow_dispatch:\n',1)[0]
          assert 'branches: [runtime/cloud-transputer-v1]' in push
          assert 'paths:' not in push
          PY

      - name: Remove finite bootstrap and regenerate exact integrity trio
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/qikvrt_cloud_transputer_reobserve_trigger_repair_bootstrap.yml
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          git add .github/workflows/qikvrt_cloud_transputer.yml \
                  tests/test_qikvrt_cloud_transputer_contract.py \
                  REPOSITORY_FILE_MANIFEST.json \
                  REPOSITORY_FILE_MANIFEST.json.sha256 \
                  SHA256SUMS.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote --heads origin refs/heads/runtime/cloud-transputer-v1 | awk 'NR==1 {print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git commit -m "fix: reobserve every dedicated cloud-transputer branch head"
          git push origin HEAD:refs/heads/runtime/cloud-transputer-v1