name: QIKVRT Mesh fan-out lossless consolidation benchmark

on:
  push:
    branches:
      - benchmark/mesh-fanout-consolidation-v1
    paths:
      - tools/qikvrt_mesh_fanout_benchmark.py
      - .github/workflows/qikvrt_mesh_fanout_benchmark.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-mesh-fanout-consolidation-v1
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Bind exact benchmark subject
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          test "$head" = "$GITHUB_SHA"
          printf 'head=%s\ntree=%s\n' "$head" "$tree" >> "$GITHUB_OUTPUT"
          printf 'BENCHMARK_HEAD=%s\nBENCHMARK_TREE=%s\n' "$head" "$tree"

      - name: Verify existing real-mesh contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v \
              tests.test_qikvrt_real_mesh \
              tests.test_qikvrt_real_mesh_system_verification

      - name: Execute fan-out and lossless consolidation benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-benchmark
          python3 -B tools/qikvrt_mesh_fanout_benchmark.py \
            --source-head '${{ steps.bind.outputs.head }}' \
            --source-tree '${{ steps.bind.outputs.tree }}' \
            --messages 20 \
            --repeats 3 \
            --json /tmp/qikvrt-benchmark/report.json \
            --markdown /tmp/qikvrt-benchmark/report.md

      - name: Validate lossless acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/qikvrt-benchmark/report.json').read_text())
          assert r['source_head'] == '${{ steps.bind.outputs.head }}'
          assert r['source_tree'] == '${{ steps.bind.outputs.tree }}'
          assert r['lossless_acceptance']['all_trials_lossless'] is True
          assert all(x['all_trials_lossless'] for x in r['summary'])
          assert r['evidence_boundary']['silicon_speedup_established'] is False
          assert r['evidence_boundary']['patentability_established'] is False
          print('LOSSLESS_CONSOLIDATION=PASS')
          PY

      - name: Persist exact benchmark receipt
        shell: bash
        run: |
          set -euo pipefail
          destination=evidence/benchmarks/2026-09-24-qikvrt-mesh-fanout-consolidation-v1
          mkdir -p "$destination"
          cp /tmp/qikvrt-benchmark/report.json "$destination/REPORT.json"
          cp /tmp/qikvrt-benchmark/report.md "$destination/REPORT.md"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git config user.name qikvrt-mesh-benchmark
          git config user.email qikvrt-mesh-benchmark@users.noreply.github.com
          git add "$destination" REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git commit -m "benchmark: persist QIK-VRT fan-out consolidation results"
          successor="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          remote_before="$(git ls-remote --heads origin refs/heads/benchmark/mesh-fanout-consolidation-v1 | awk 'NR==1 {print $1}')"
          test "$remote_before" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/benchmark/mesh-fanout-consolidation-v1
          remote_after="$(git ls-remote --heads origin refs/heads/benchmark/mesh-fanout-consolidation-v1 | awk 'NR==1 {print $1}')"
          test "$remote_after" = "$successor"
          printf 'BENCHMARK_RECEIPT_HEAD=%s\nBENCHMARK_RECEIPT_TREE=%s\n' "$successor" "$tree"
          printf 'PREDECESSOR_EVIDENCE_TRANSFER=false\n'
          printf 'REPOSITORY_EFFECT_ACK_DONE=false\n'

      - name: Preserve runner artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-mesh-fanout-consolidation-${{ github.sha }}
          path: /tmp/qikvrt-benchmark/
          if-no-files-found: error
          retention-days: 30
