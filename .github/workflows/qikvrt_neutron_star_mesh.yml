name: QIKVRT neutron-star 2D Mesh

on:
  pull_request:
    paths:
      - "runtime/m68000/QIKVRT_NEUTRON_STAR_MESH_V1.json"
      - "tools/qikvrt_neutron_star_mesh.py"
      - "tests/test_qikvrt_neutron_star_mesh.py"
      - ".github/workflows/qikvrt_neutron_star_mesh.yml"
  push:
    branches: [main]
    paths:
      - "runtime/m68000/QIKVRT_NEUTRON_STAR_MESH_V1.json"
      - "tools/qikvrt_neutron_star_mesh.py"
      - "tests/test_qikvrt_neutron_star_mesh.py"
      - ".github/workflows/qikvrt_neutron_star_mesh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bind literal head and tree
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_head" = "$EXACT_HEAD_SHA"
          mkdir -p qikvrt-neutron-star-mesh
          EXACT_TREE_SHA="$actual_tree" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "qikvrt_neutron_star_mesh_exact_binding_v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "head_sha": os.environ["EXACT_HEAD_SHA"],
              "tree_sha": os.environ["EXACT_TREE_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "transport_ack_is_effect_ack": False,
              "authority_main_effect": False,
          }
          Path("qikvrt-neutron-star-mesh/exact-binding.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Execute two-dimensional variable-bitrate plans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qikvrt-neutron-star-mesh
          python3 -B tools/qikvrt_neutron_star_mesh.py \
            --bitrate-bps 8 --evidence-level 0 --quantum-hz 1 \
            --sample-rate-hz 1 --sample-bits 8 --channels 1 --json \
            > qikvrt-neutron-star-mesh/low.json
          python3 -B tools/qikvrt_neutron_star_mesh.py \
            --bitrate-bps 1000000 --evidence-level 7 \
            --sample-rate-hz 62500 --sample-bits 16 --channels 1 --json \
            > qikvrt-neutron-star-mesh/high.json
      - name: Verify breadth depth bitrate M68000 ABI and boundaries
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v tests.test_qikvrt_neutron_star_mesh
      - name: Preserve exact-head plans
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-neutron-star-mesh-${{ env.EXACT_HEAD_SHA }}
          path: qikvrt-neutron-star-mesh/*.json
          retention-days: 30
          if-no-files-found: error
