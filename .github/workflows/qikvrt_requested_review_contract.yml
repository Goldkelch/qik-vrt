name: QIKVRT requested review contract

on:
  pull_request:
    paths:
      - ".github/workflows/qikvrt_requested_review_executor.yml"
      - ".github/workflows/qikvrt_requested_review_contract.yml"
      - ".github/workflows/qikvrt_ci.yml"
      - ".github/workflows/qikvrt_code_owner_review_observer.yml"
      - ".github/workflows/qikvrt_required_review_gate.yml"
      - ".github/workflows/qikvrt_expected_head_promotion.yml"
      - ".github/workflows/qikvrt_autonomous_self_heal.yml"
      - ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml"
      - "Makefile"
      - "tools/qikvrt_requested_review_executor.py"
      - "tools/qikvrt_expected_head_promotion.py"
      - "tools/qikvrt_required_review_gate.py"
      - "tools/qikvrt_native_account_review.py"
      - "tests/test_qikvrt_requested_review_executor.py"
      - "tests/test_qikvrt_expected_head_promotion.py"
      - "tests/test_qikvrt_required_review_gate.py"
      - "tests/test_qikvrt_native_account_review.py"
      - "policy/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json"
      - "docs/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE.md"
      - "docs/QIKVRT_GITHUB_APP_TARGET_BLUEPRINT.md"
      - "docs/DELEGATED_NATIVE_ACCOUNT_REVIEW_AUTOMATION.md"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"
      - "state/authorization/delegations/OWNER_REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json"
      - "state/authorization/delegations/OWNER_MESH_REPOSITORY_SELF_REVIEW_FEEDBACK_V1.json"
      - "state/authorization/delegations/OWNER_NATIVE_ACCOUNT_REVIEW_AUTOMATION_V1.json"
      - "state/work_units/MESH_REPOSITORY_SELF_REVIEW_FEEDBACK_V1.json"
      - "state/work_units/QIKVRT_REQUESTED_REVIEW_EXECUTOR_COMPLETION_V1.json"
      - "state/work_units/QIKVRT_DELEGATED_NATIVE_ACCOUNT_REVIEW_AUTOMATION_V1.json"
      - "tests/test_qikvrt_workflow_executor_mesh_contract.py"
      - "tests/test_qikvrt_expected_head_promotion_contract.py"
      - "tests/test_qikvrt_autonomous_pr_head_continuation.py"
      - "tests/test_qikvrt_requested_review_contract_static.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify requested-review contract
        shell: bash
        run: make requested-review-contract
