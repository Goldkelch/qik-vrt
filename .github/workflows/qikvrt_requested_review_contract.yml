name: QIKVRT requested review contract

on:
  pull_request:
    paths:
      - ".github/workflows/qikvrt_requested_review_executor.yml"
      - ".github/workflows/qikvrt_requested_review_contract.yml"
      - ".github/workflows/qikvrt_ci.yml"
      - ".github/workflows/qikvrt_code_owner_review_observer.yml"
      - ".github/workflows/qikvrt_review_admission_recovery.yml"
      - ".github/workflows/qikvrt_mesh_review_successor_completion.yml"
      - ".github/workflows/qikvrt_required_review_gate.yml"
      - ".github/workflows/qikvrt_expected_head_promotion.yml"
      - ".github/workflows/qikvrt_autonomous_self_heal.yml"
      - ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml"
      - "Makefile"
      - "tools/qikvrt_requested_review_executor.py"
      - "tools/qikvrt_expected_head_promotion.py"
      - "tools/qikvrt_required_review_gate.py"
      - "tools/qikvrt_native_account_review.py"
      - "tools/qikvrt_review_admission_recovery.py"
      - "tools/qikvrt_mesh_review_outbox.py"
      - "tools/qikvrt_ruleset_outbox.py"
      - "tests/test_qikvrt_requested_review_executor.py"
      - "tests/test_qikvrt_expected_head_promotion.py"
      - "tests/test_qikvrt_required_review_gate.py"
      - "tests/test_qikvrt_native_account_review.py"
      - "tests/test_qikvrt_review_admission_recovery.py"
      - "tests/test_qikvrt_mesh_review_outbox.py"
      - "tests/test_qikvrt_mesh_review_successor_completion.py"
      - "tests/test_qikvrt_ruleset_outbox.py"
      - "policy/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json"
      - "docs/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE.md"
      - "docs/QIKVRT_GITHUB_APP_TARGET_BLUEPRINT.md"
      - "docs/DELEGATED_NATIVE_ACCOUNT_REVIEW_AUTOMATION.md"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"
      - "state/authorization/delegations/OWNER_REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json"
      - "state/authorization/delegations/OWNER_MESH_REPOSITORY_SELF_REVIEW_FEEDBACK_V1.json"
      - "state/authorization/delegations/OWNER_NATIVE_ACCOUNT_REVIEW_AUTOMATION_V1.json"
      - "state/work_units/MESH_REPOSITORY_SELF_REVIEW_FEEDBACK_V1.json"
      - "state/work_units/QIKVRT_REQUESTED_REVIEW_EXECUTOR_COMPLETION_V1.json"
      - "state/work_units/QIKVRT_DELEGATED_NATIVE_ACCOUNT_REVIEW_AUTOMATION_V1.json"
      - "tests/test_qikvrt_workflow_executor_mesh_contract.py"
      - "tests/test_qikvrt_expected_head_promotion_contract.py"
      - "tests/test_qikvrt_autonomous_pr_head_continuation.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify review cores and decisions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/qikvrt_requested_review_executor.py \
            tools/qikvrt_expected_head_promotion.py \
            tools/qikvrt_required_review_gate.py \
            tools/qikvrt_native_account_review.py \
            tools/qikvrt_review_admission_recovery.py \
            tools/qikvrt_mesh_review_outbox.py \
            tools/qikvrt_ruleset_outbox.py \
            tests/test_qikvrt_requested_review_executor.py \
            tests/test_qikvrt_expected_head_promotion.py \
            tests/test_qikvrt_expected_head_promotion_contract.py \
            tests/test_qikvrt_required_review_gate.py \
            tests/test_qikvrt_native_account_review.py \
            tests/test_qikvrt_review_admission_recovery.py \
            tests/test_qikvrt_mesh_review_outbox.py \
            tests/test_qikvrt_mesh_review_successor_completion.py \
            tests/test_qikvrt_ruleset_outbox.py \
            tests/test_qikvrt_workflow_executor_mesh_contract.py \
            tests/test_qikvrt_autonomous_pr_head_continuation.py
          python3 -B -m unittest -v \
            tests.test_qikvrt_requested_review_executor \
            tests.test_qikvrt_required_review_gate \
            tests.test_qikvrt_native_account_review \
            tests.test_qikvrt_review_admission_recovery \
            tests.test_qikvrt_mesh_review_outbox \
            tests.test_qikvrt_mesh_review_successor_completion \
            tests.test_qikvrt_ruleset_outbox \
            tests.test_qikvrt_expected_head_promotion \
            tests.test_qikvrt_expected_head_promotion_contract \
            tests.test_qikvrt_workflow_executor_mesh_contract \
            tests.test_qikvrt_autonomous_pr_head_continuation

      - name: Verify event, recovery, identity and promotion bindings
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'pull_request_target:' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'pull_request_review:' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'QIKVRT code-owner review observer' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'QIKVRT code-owner review observer' .github/workflows/qikvrt_required_review_gate.yml
          grep -F 'run-name: qikvrt-rr-v3 e=${{ github.workflow_sha }} p=${{ inputs.pr || '\''event'\'' }} h=${{ inputs.head || '\''event'\'' }} f=${{ inputs.fingerprint || '\''event'\'' }} i=${{ inputs.transport_intent_sha256 || '\''event'\'' }} a=${{ inputs.transport_attempt || '\''event'\'' }}' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'evaluator_sha:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'transport_intent_sha256:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'transport_attempt:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'review-transport.json' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'TRANSPORT_ONLY_REVIEW_INTAKE_FIELDS' tools/qikvrt_requested_review_executor.py
          grep -F 'parse_requested_review_run_title' tools/qikvrt_requested_review_executor.py
          grep -F "github.ref == 'refs/heads/main'" .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'converted_to_draft' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'review_request_removed' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'labeled' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'REQUESTED_HEAD:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'inputs.head ||' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'GITHUB_EVENT_PATH' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'event_payload_sha256' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F -- '--event-context-file /tmp/qikvrt-review-event-context.json' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'issue_comment:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'review_requested' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'select_review_subject' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'WORKFLOW_DISPATCH_HEAD_MISSING' tools/qikvrt_requested_review_executor.py
          grep -F 'REVIEW_INTAKE_SCHEMA' tools/qikvrt_requested_review_executor.py
          grep -F 'GITHUB_ACTIONS_NO_CROSS_EVENT_PRIORITY_GUARANTEE' tools/qikvrt_requested_review_executor.py
          grep -F 'qikvrt-mesh-review-selection-' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'EVENT_WORKFLOW_EVENT' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'schedule:' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F '*/5 * * * *' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'BOUNDED_SCHEDULE_ROTATION' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'pulls?state=open' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'schedule:' .github/workflows/qikvrt_autonomous_pr_head_continuation.yml
          ! grep -F 'qikvrt_requested_review_executor.yml/dispatches' .github/workflows/qikvrt_autonomous_pr_head_continuation.yml
          grep -F 'QIKVRT requested review executor' .github/workflows/qikvrt_autonomous_pr_head_continuation.yml
          grep -F 'workflow_run:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'refs/heads/qikvrt/mesh-review-ledger-v1' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'environment: qikvrt-outbox-ledger-authority' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'MESH_REVIEW_LEDGER_REF_MISSING_AFTER_VERIFIED_GENESIS' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'MESH_REVIEW_LEDGER_PROTECTION_NOT_VERIFIED' tools/qikvrt_requested_review_executor.py
          ! grep -F "'parents':[]" .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'INVALID_LEDGER_INITIALIZATION_PLAN' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-mesh-review-successor-dispatch' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'qikvrt_ruleset_outbox_transport_v2' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'qikvrt/mesh-review-ledger-v1' .github/workflows/qikvrt_ci.yml
          grep -F 'def _git_scope' tools/qikvrt_requested_review_executor.py
          grep -F '"--no-ext-diff", "--no-textconv", "--no-renames"' tools/qikvrt_requested_review_executor.py
          grep -F 'REQUIRED_GATE_PATHS_JSON' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'post-ledger-cas' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'post-review-comment' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'post-status' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F -- '-f commit_id="$EXPECTED_HEAD" -f event=COMMENT' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'if-no-files-found: error' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'include-hidden-files: true' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'latest_status_matches_projection' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'HOLD_UNVERIFIED' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'independent Code-Owner approval: **not implied**' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'event=APPROVE' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'event=REQUEST_CHANGES' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'TECHNICAL_CONTINUE)' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'Technical observation complete; independent approval required' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F '<<EOF' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'git push' .github/workflows/qikvrt_requested_review_executor.yml
          ! grep -F 'gh pr merge' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'permissions: {}' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'plan-review:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'ledger-write:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'project-comment:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'project-status:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'select-successor:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'dispatch-successor:' .github/workflows/qikvrt_requested_review_executor.yml
          grep -F 'permissions: {}' .github/workflows/qikvrt_code_owner_review_observer.yml
          grep -F 'on: {}' .github/workflows/qikvrt_code_owner_review_observer.yml
          grep -F 'if: false' .github/workflows/qikvrt_code_owner_review_observer.yml
          grep -F 'RETIRED_NO_UNTRUSTED_REVIEW_TRIGGER' .github/workflows/qikvrt_code_owner_review_observer.yml
          ! grep -F 'pull_request_review:' .github/workflows/qikvrt_code_owner_review_observer.yml
          grep -F 'schedule:' .github/workflows/qikvrt_review_admission_recovery.yml
          grep -F 'RECOVERY_ONLY' .github/workflows/qikvrt_review_admission_recovery.yml
          grep -F 'permissions: {}' .github/workflows/qikvrt_review_admission_recovery.yml
          ! grep -F 'pull_request_review:' .github/workflows/qikvrt_review_admission_recovery.yml
          grep -F 'environment: qikvrt-outbox-ledger-authority' .github/workflows/qikvrt_review_admission_recovery.yml
          grep -F 'QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN' .github/workflows/qikvrt_review_admission_recovery.yml
          grep -F 'QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN' .github/workflows/qikvrt_review_admission_recovery.yml
          ! grep -F 'QIKVRT_ENV_GOLDKELCH_REVIEW_TOKEN' .github/workflows/qikvrt_review_admission_recovery.yml
          ! grep -F 'QIKVRT_ENV_INGOLF_LOHMANN_REVIEW_TOKEN' .github/workflows/qikvrt_review_admission_recovery.yml
          ! grep -F 'QIKVRT_ENV_NATIVE_ACCOUNT_REVIEW_ACTIVATION' .github/workflows/qikvrt_review_admission_recovery.yml
          grep -F 'name: QIKVRT mesh review successor completion' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          grep -F 'schedule:' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          grep -F 'permissions: {}' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          grep -F 'queue: max' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          grep -F 'environment: qikvrt-outbox-ledger-authority' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          grep -F 'QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          grep -F 'QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          grep -F 'qikvrt-outbox-ledger-v2-mesh-review-successor-dispatch' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          grep -F 'ADMISSION_ZERO_JOB_RECOVERY' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          ! grep -F 'prepare-child-rerun' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          ! grep -F '/rerun' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          ! grep -F 'pulls?state=open' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          ! grep -F 'event=APPROVE' .github/workflows/qikvrt_mesh_review_successor_completion.yml
          grep -F 'QIKVRT requested review executor' .github/workflows/qikvrt_required_review_gate.yml
          grep -F 'QIKVRT required code-owner review' .github/workflows/qikvrt_required_review_gate.yml
          grep -F 'select_required_review_targets' .github/workflows/qikvrt_required_review_gate.yml
          ! grep -F 'review_wakeup_record_path' .github/workflows/qikvrt_required_review_gate.yml
          ! grep -F 'verify_recovery_ledger_authority' .github/workflows/qikvrt_required_review_gate.yml
          grep -F 'custom_wakeup_transport_authority_used' .github/workflows/qikvrt_required_review_gate.yml
          grep -F 'plan-native-account-review:' .github/workflows/qikvrt_required_review_gate.yml
          grep -F 'environment: qikvrt-native-review-authority' .github/workflows/qikvrt_required_review_gate.yml
          grep -F 'AUTHORITY_SECRET_ENVIRONMENT_NOT_VERIFIED' .github/workflows/qikvrt_required_review_gate.yml
          test "$(grep -c '^    if: false$' .github/workflows/qikvrt_required_review_gate.yml)" -ge 2
          ! grep -F 'QIKVRT_ENV_GOLDKELCH_REVIEW_TOKEN' .github/workflows/qikvrt_required_review_gate.yml
          ! grep -F 'QIKVRT_ENV_INGOLF_LOHMANN_REVIEW_TOKEN' .github/workflows/qikvrt_required_review_gate.yml
          ! grep -F 'QIKVRT_ENV_NATIVE_ACCOUNT_REVIEW_ACTIVATION' .github/workflows/qikvrt_required_review_gate.yml
          ! grep -F 'secrets.QIKVRT_GOLDKELCH_REVIEW_TOKEN' .github/workflows/qikvrt_required_review_gate.yml
          ! grep -F 'secrets.QIKVRT_INGOLF_LOHMANN_REVIEW_TOKEN' .github/workflows/qikvrt_required_review_gate.yml
          grep -F 'DELEGATED_ACCOUNT_TOKEN_IDENTITY_MISMATCH' tools/qikvrt_native_account_review.py
          grep -F 'OWNER-NATIVE-ACCOUNT-REVIEW-AUTOMATION-V1' policy/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json
          tr '\n' ' ' < docs/DELEGATED_NATIVE_ACCOUNT_REVIEW_AUTOMATION.md \
            | grep -F 'delegated platform-account action'
          grep -F 'qikvrt-required-code-owner-selection-' .github/workflows/qikvrt_required_review_gate.yml
          ! grep -F 'schedule:' .github/workflows/qikvrt_required_review_gate.yml
          ! grep -F '*/5 * * * *' .github/workflows/qikvrt_required_review_gate.yml
          ! grep -F 'pulls?state=open' .github/workflows/qikvrt_required_review_gate.yml
          grep -F 'require_code_owner_review' tools/qikvrt_required_review_gate.py
          grep -F 'dismiss_stale_reviews_on_push' tools/qikvrt_required_review_gate.py
          grep -F 'require_last_push_approval' tools/qikvrt_required_review_gate.py
          grep -F 'QIKVRT requested review execution' .github/workflows/qikvrt_expected_head_promotion.yml
          grep -F 'QIKVRT required code-owner review' .github/workflows/qikvrt_expected_head_promotion.yml
          grep -F 'statuses?per_page=100' .github/workflows/qikvrt_expected_head_promotion.yml
          grep -F 'mesh_review_status_projection' .github/workflows/qikvrt_expected_head_promotion.yml
          grep -F 'require_unchanged_mesh_review_status' .github/workflows/qikvrt_expected_head_promotion.yml
          grep -F 'require_unchanged_promotion_marker' .github/workflows/qikvrt_expected_head_promotion.yml
          grep -F 'HEAD^1' .github/workflows/qikvrt_expected_head_promotion.yml
          ! grep -F 'pulls/${PR_NUMBER}/merge' .github/workflows/qikvrt_expected_head_promotion.yml
          grep -F "tools/qikvrt_requested_review_executor.py','verify'" .github/workflows/qikvrt_expected_head_promotion.yml
          grep -F "'--expected-diff',str(diff_path)" .github/workflows/qikvrt_expected_head_promotion.yml
