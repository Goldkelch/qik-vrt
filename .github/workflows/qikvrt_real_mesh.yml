name: QIKVRT real multi-pair Mesh runtime

on:
  pull_request:
    paths:
      - '.github/workflows/qikvrt_real_mesh.yml'
      - 'tools/qikvrt_real_mesh.py'
      - 'tools/qikvrt_snap_mesh.py'
      - 'tools/qikvrt_snap_mesh.cpp'
      - 'tools/qikvrt_build_snap.py'
      - 'tools/qikvrt_real_mesh_system_verification.py'
      - 'tests/test_qikvrt_snap_mesh.py'
      - 'runtime/toolchains/SNAP.lock.json'
      - 'runtime/toolchains/TOOLCHAIN.lock.tsv'
      - 'runtime/toolchains/CACHE_REGISTRY.json'
      - 'runtime/toolchains/CACHE_COVERAGE.json'
      - 'third_party/snap/**'
      - 'tests/test_qikvrt_real_mesh.py'
      - 'state/mesh/QIKVRT_REAL_MESH_V1.json'
      - 'docs/architecture/QIKVRT_REAL_MESH_V1.md'
      - 'Makefile'
      - 'REPOSITORY_FILE_MANIFEST.json'
      - 'REPOSITORY_FILE_MANIFEST.json.sha256'
      - 'SHA256SUMS.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qikvrt_real_mesh.yml'
      - 'tools/qikvrt_real_mesh.py'
      - 'tools/qikvrt_snap_mesh.py'
      - 'tools/qikvrt_snap_mesh.cpp'
      - 'tools/qikvrt_build_snap.py'
      - 'tools/qikvrt_real_mesh_system_verification.py'
      - 'tests/test_qikvrt_snap_mesh.py'
      - 'runtime/toolchains/SNAP.lock.json'
      - 'runtime/toolchains/TOOLCHAIN.lock.tsv'
      - 'runtime/toolchains/CACHE_REGISTRY.json'
      - 'runtime/toolchains/CACHE_COVERAGE.json'
      - 'third_party/snap/**'
      - 'tests/test_qikvrt_real_mesh.py'
      - 'state/mesh/QIKVRT_REAL_MESH_V1.json'
      - 'docs/architecture/QIKVRT_REAL_MESH_V1.md'
      - 'Makefile'
      - 'REPOSITORY_FILE_MANIFEST.json'
      - 'REPOSITORY_FILE_MANIFEST.json.sha256'
      - 'SHA256SUMS.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-real-mesh-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  execute-real-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact head and clean worktree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Execute targeted real-Mesh tests
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v tests.test_qikvrt_real_mesh

      - name: Execute and reobserve four-node two-pair TCP Mesh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qikvrt/real-mesh
          python3 -B tools/qikvrt_real_mesh.py demo \
            --source-head "$(git rev-parse --verify HEAD^{commit})" \
            --source-tree "$(git rev-parse --verify HEAD^{tree})" \
            --workdir .qikvrt/real-mesh/runtime \
            --output .qikvrt/real-mesh/QIKVRT_REAL_MESH_EXECUTION_RECEIPT_V1.json \
            > .qikvrt/real-mesh/stdout.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('.qikvrt/real-mesh/QIKVRT_REAL_MESH_EXECUTION_RECEIPT_V1.json').read_text())
          assert receipt['pair_count'] == 2
          assert receipt['node_process_count'] == 4
          assert receipt['network_scope'] == 'LOOPBACK_TCP_ONLY'
          assert receipt['completion_claims']['real_multi_pair_mesh_runtime_executed'] is True
          assert receipt['completion_claims']['bounded_loopback_effect_ack_done'] is True
          assert receipt['completion_claims']['general_effect_ack_done'] is False
          assert receipt['completion_claims']['authority_mirror_synchronization'] is False
          assert receipt['external_effect'] == 'NONE'
          PY

      - name: Verify Mesh receipt before topology analysis
        run: |
          python3 -B tools/qikvrt_real_mesh_system_verification.py verify \
            --receipt .qikvrt/real-mesh/QIKVRT_REAL_MESH_EXECUTION_RECEIPT_V1.json

      - name: Verify declared SNAP tool and provisioning contracts
        run: python3 -B tools/qikvrt_tool_cache.py verify

      - name: Provision exact pinned SNAP source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: snap-stanford/snap
          ref: 6924a035aabd1ce0a547b94e995e142f29eb5040
          path: .qikvrt/snap-source
          persist-credentials: false

      - name: Build and self-test the real native SNAP backend
        run: |
          python3 -B tools/qikvrt_build_snap.py --source .qikvrt/snap-source \
            --output .qikvrt/real-mesh/snap/qikvrt-snap

      - name: Require real SNAP in adapter integration tests
        shell: bash
        run: |
          set -euo pipefail
          test -x .qikvrt/real-mesh/snap/qikvrt-snap
          QIKVRT_SNAP_BACKEND="$PWD/.qikvrt/real-mesh/snap/qikvrt-snap" \
            PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest discover -s tests -p test_qikvrt_snap_mesh.py -v

      - name: Analyze the exact current-head Mesh receipt with SNAP
        run: |
          python3 -B tools/qikvrt_snap_mesh.py \
            --receipt .qikvrt/real-mesh/QIKVRT_REAL_MESH_EXECUTION_RECEIPT_V1.json \
            --expected-head "$(git rev-parse --verify HEAD^{commit})" \
            --expected-tree "$(git rev-parse --verify HEAD^{tree})" \
            --backend .qikvrt/real-mesh/snap/qikvrt-snap \
            --output .qikvrt/real-mesh/SNAP_ANALYSIS.json

      - name: Verify repository-native integrity
        run: python3 -B tools/qikvrt_integrity.py verify

      - name: Preserve exact-head Mesh receipt and node ledgers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-real-mesh-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: .qikvrt/real-mesh
          if-no-files-found: error
          retention-days: 30
