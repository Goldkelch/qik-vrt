name: QIKVRT continuation integrity bootstrap once

on:
  push:
    branches:
      - fix/continuation-obligation-liveness-v1

permissions:
  contents: write

concurrency:
  group: qikvrt-continuation-integrity-bootstrap-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact bootstrap subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Materialize one exact integrity successor and erase bootstrap
        shell: bash
        env:
          TARGET_REF: fix/continuation-obligation-liveness-v1
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$GITHUB_SHA"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head" = "$source_head"

          git rm .github/workflows/qikvrt_continuation_integrity_bootstrap_once.yml

          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git diff --cached --exit-code && {
            echo "BLOCK: bootstrap produced no exact successor delta" >&2
            exit 2
          } || true

          remote_head_before_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head_before_commit" = "$source_head"

          git commit -m "ci: materialize continuation-obligation integrity successor"
          successor="$(git rev-parse --verify HEAD^{commit})"

          remote_head_before_push="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head_before_push" = "$source_head"

          git push origin "HEAD:$TARGET_REF"

          remote_head_after_push="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head_after_push" = "$successor"

          printf 'SOURCE_HEAD=%s\nSUCCESSOR_HEAD=%s\n' "$source_head" "$successor"
