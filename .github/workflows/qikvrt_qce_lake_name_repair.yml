name: QIK-VRT one-shot QCE Lake-name and integrity repair

on:
  push:
    branches:
      - "agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
    paths:
      - ".github/workflows/qikvrt_qce_lake_name_repair.yml"

permissions:
  contents: write

concurrency:
  group: qikvrt-qce-lake-name-integrity-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded Lake-name precursor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c2e75bd58bf0047c56f0f15cc78d9676102ae7f3"
          actual="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/qikvrt_qce_lake_name_repair.yml' \
            'docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lake-manifest.json' \
            'docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lakefile.lean' | sort)"
          test "${actual}" = "${expected}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence')
          manifest = json.loads((root / 'lake-manifest.json').read_text(encoding='utf-8'))
          assert manifest == {
              'version': '1.1.0',
              'packagesDir': '.lake/packages',
              'packages': [],
              'name': 'qik_vrt_qce',
              'lakeDir': '.lake',
          }
          lakefile = (root / 'lakefile.lean').read_text(encoding='utf-8')
          assert 'package qik_vrt_qce where' in lakefile
          assert 'package «qik-vrt-qce» where' not in lakefile
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install document inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Regenerate and verify QCE package integrity
        shell: bash
        run: |
          set -euo pipefail
          cd docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          python3 -B regenerate_qce_integrity.py
          python3 -B verify_qce_package.py --static-only

      - name: Remove one-shot workflow and regenerate repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/qikvrt_qce_lake_name_repair.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Commit and persist repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qik-vrt-qce-lake-name-repair"
          git config user.email "qik-vrt-qce-lake-name-repair@users.noreply.github.com"
          git add -A
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"
          git commit -m "fix(qce): canonicalize Lake package name"
          git push origin "HEAD:refs/heads/agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
