name: QIKVRT finite P7 readback and integration
on:
  push:
    branches: [diagnostic/p7-readback-integration-a860-20260912-v1]
permissions:
  contents: read
concurrency:
  group: qikvrt-p7-readback-integration-a860-20260912-v1
  cancel-in-progress: false
jobs:
  integrate-1069:
    if: github.repository == 'Goldkelch/qik-vrt'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Trusted Main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a86054139b49c13c5cd344753b248b46b5daf66f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read and verify immutable execution helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Goldkelch/qik-vrt/git/blobs/a36ae62f5a6b7554411ea3c0cea01e18c533736d > "$RUNNER_TEMP/helper-blob.json"
          python3 -B - <<'PY'
          import base64,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          obj=json.loads((root/'helper-blob.json').read_text())
          raw=base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='a36ae62f5a6b7554411ea3c0cea01e18c533736d'
          assert hashlib.sha256(raw).hexdigest()=='81cc20fb621cbb705b946301340424d66807488c5f6e4a88a04f8ef5627f8034'
          compile(raw,'follow_once.py','exec')
          (root/'follow_once.py').write_bytes(raw)
          PY
      - name: Merge only known carrier and Main; test; store read-back immutable objects
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: python3 -B "$RUNNER_TEMP/follow_once.py" integration
      - name: Preserve integration objects and tests without ref mutation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-p7-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p7-follow-integration
          if-no-files-found: error
          retention-days: 30
  readback-existing-record:
    if: github.repository == 'Goldkelch/qik-vrt'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact Trusted Main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a86054139b49c13c5cd344753b248b46b5daf66f
          fetch-depth: 0
          persist-credentials: false
      - name: Read and verify immutable GET-only execution helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Goldkelch/qik-vrt/git/blobs/a36ae62f5a6b7554411ea3c0cea01e18c533736d > "$RUNNER_TEMP/helper-blob.json"
          python3 -B - <<'PY'
          import base64,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          obj=json.loads((root/'helper-blob.json').read_text())
          raw=base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='a36ae62f5a6b7554411ea3c0cea01e18c533736d'
          assert hashlib.sha256(raw).hexdigest()=='81cc20fb621cbb705b946301340424d66807488c5f6e4a88a04f8ef5627f8034'
          compile(raw,'follow_once.py','exec')
          (root/'follow_once.py').write_bytes(raw)
          PY
      - name: Provision publication TeX runtime without publishing
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science lmodern
      - name: GET record and six files; recompile Main files; reobserve record and Main
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B "$RUNNER_TEMP/follow_once.py" readback
      - name: Preserve actual public bytes and exact readback boundary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-p7-zenodo-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p7-follow-readback
          if-no-files-found: error
          retention-days: 30
