# Read-only exact-subject integrity snapshot for pull-request repair.
name: QIKVRT PR integrity snapshot

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  snapshot:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
      - name: Regenerate deterministic repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
      - name: Preserve regenerated integrity outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-pr-integrity-${{ env.EXPECTED_HEAD }}
          path: |
            REPOSITORY_FILE_MANIFEST.json
            REPOSITORY_FILE_MANIFEST.json.sha256
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
