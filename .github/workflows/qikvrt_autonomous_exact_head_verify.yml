            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" \
            --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg causal_attempt "$CAUSAL_ATTEMPT" --arg transport_intent "$TRANSPORT_INTENT_SHA256" \
            --arg transport_sequence "$TRANSPORT_SEQUENCE" --arg transport_attempt "$TRANSPORT_ATTEMPT" '
            .event_type == "qikvrt_autonomous_exact_head_verify" and
            .client_payload == {schema:"qikvrt_autonomous_exact_head_verify_dispatch_v1",repository:$repository,subject:{pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base},producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha},causal:{attempt:($causal_attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false},transport:{intent_sha256:$transport_intent,sequence:($transport_sequence|tonumber),attempt:($transport_attempt|tonumber)}}
          ' "$sealed_request" >/dev/null
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" --arg head "$TARGET_SHA" \
            --arg tree "$TARGET_TREE_SHA" --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" \
            --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg causal_attempt "$CAUSAL_ATTEMPT" \
            --arg request_sha256 "$(sha256sum "$sealed_request" | cut -d' ' -f1)" '
            .schema == "qikvrt.autonomous-exact-head-transport-intent.v1" and
            .repository == $repository and .pull_request == ($pr|tonumber) and
            .head_sha == $head and .head_tree_sha == $tree and
            .base_ref == $base_ref and .base_sha == $base and
            .producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha} and
            .attempt == ($causal_attempt|tonumber) and .request_sha256 == $request_sha256 and
            .productive_effect == false and .effect_ack == "NOT_REQUIRED"
          ' "$sealed_intent" >/dev/null
          binding_artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BINDING_ARTIFACT_ID}")"
          jq -e \
            --argjson artifact_id "$BINDING_ARTIFACT_ID" \
            --arg name "qikvrt-exact-head-binding-${TARGET_PR}-${TARGET_SHA}-run-${GITHUB_RUN_ID}-attempt-${BINDING_RUN_ATTEMPT}" \
            --arg digest "sha256:${BINDING_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $artifact_id and .name == $name and .expired == false and
            .digest == $digest and .workflow_run.id == $run_id and
            .workflow_run.head_branch == "main" and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$binding_artifact" >/dev/null
          receipt="$RUNNER_TEMP/qikvrt-exact-head-binding-downloaded/binding.json"
          test -f "$receipt"
          test ! -L "$receipt"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg head_repository "$TARGET_HEAD_REPOSITORY" --arg head_ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" \
            --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg producer_artifact_id "$BOUND_PRODUCER_ARTIFACT_ID" \
            --arg producer_artifact_digest "$BOUND_PRODUCER_ARTIFACT_DIGEST" \
            --arg sealed_request_sha256 "$(sha256sum "$sealed_request" | cut -d' ' -f1)" \
            --arg sealed_intent_sha256 "$(sha256sum "$sealed_intent" | cut -d' ' -f1)" \
            --arg causal_attempt "$CAUSAL_ATTEMPT" '
            .schema == "qikvrt.autonomous-exact-head-dispatch-binding.v1" and
            .repository == $repository and .pull_request == ($pr|tonumber) and
            .head_repository == $head_repository and .head_ref == $head_ref and
            .head_sha == $head and .head_tree_sha == $tree and
            .base_ref == $base_ref and .base_sha == $base and
            .run_id == ($run_id|tonumber) and
            (.run_attempt | type) == "number" and .run_attempt > 0 and
            .run_attempt <= ($run_attempt|tonumber) and
            .workflow_ref == $workflow_ref and .workflow_sha == $workflow_sha and
            .producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha,continuation_artifact:{id:($producer_artifact_id|tonumber),digest:$producer_artifact_digest},sealed_transport:{request_file:"producer-request.json",request_sha256:$sealed_request_sha256,intent_file:"producer-intent.json",intent_sha256:$sealed_intent_sha256}} and
            .causal == {attempt:($causal_attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false} and
            .classification == "TRUSTED_DISPATCH_BINDING_ONLY" and
            .trusted_terminal_verification == false and .productive_effect == false
          ' "$receipt" >/dev/null

      - name: Materialize requested-review transport intent attempt 1
        id: review_intent
        if: >-
          needs.bind-dispatch.result == 'success' &&
          steps.binding_receipt.outcome == 'success' &&
          steps.publish.outputs.state == 'success' &&
          steps.pre_review_binding.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-review-transport-attempt-1"
          mkdir -p "$root"
          executor="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_requested_review_executor.yml")"
          executor_workflow_id="$(jq -r '.id // ""' <<<"$executor")"
          [[ "$executor_workflow_id" =~ ^[1-9][0-9]*$ ]]
          jq -e '
            .path == ".github/workflows/qikvrt_requested_review_executor.yml" and .state == "active"
          ' <<<"$executor" >/dev/null
          evaluator_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$evaluator_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$evaluator_sha" = "$GITHUB_WORKFLOW_SHA"
          executor_content="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/qikvrt_requested_review_executor.yml?ref=${evaluator_sha}")"
          executor_blob_sha="$(jq -r '.sha // ""' <<<"$executor_content")"
          [[ "$executor_blob_sha" =~ ^[0-9a-f]{40}$ ]]
          jq -e '
            .type == "file" and .path == ".github/workflows/qikvrt_requested_review_executor.yml"
          ' <<<"$executor_content" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$evaluator_sha"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg head_repository "$TARGET_HEAD_REPOSITORY" --arg head_ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg source_run_id "$GITHUB_RUN_ID" --arg source_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" \
            --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg executor_workflow_id "$executor_workflow_id" \
            --arg executor_blob_sha "$executor_blob_sha" \
            --arg evaluator_sha "$evaluator_sha" '
            {schema:"qikvrt.requested-review-transport-request.v1",repository:$repository,subject:{pull_request:($pr|tonumber),head_repository:$head_repository,head_ref:$head_ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base},source:{run_id:($source_run_id|tonumber),run_attempt:($source_run_attempt|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_exact_head_verify.yml",workflow_sha:$source_workflow_sha},producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha},attempt:1,target:{workflow_id:($executor_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_requested_review_executor.yml",workflow_blob_sha:$executor_blob_sha,ref:"main",evaluator_sha:$evaluator_sha}}
          ' > "$root/review-request.json"
          jq -n \
            --slurpfile request "$root/review-request.json" \
            --arg request_sha256 "$(sha256sum "$root/review-request.json" | cut -d' ' -f1)" '
            $request[0] + {
              schema:"qikvrt.requested-review-transport-intent.v1",
              request_sha256:$request_sha256,
              productive_effect:false,
              effect_ack:"NOT_REQUIRED"
            }
          ' > "$root/review-intent.json"

      - name: Preserve requested-review transport intent attempt 1
        id: review_intent_evidence
        if: steps.review_intent.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-head-review-intent-${{ github.event.client_payload.subject.pull_request }}-${{ github.event.client_payload.subject.head_sha }}-source-${{ github.run_id }}-${{ github.run_attempt }}-attempt-1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            ${{ runner.temp }}/qikvrt-exact-head-review-transport-attempt-1/review-request.json
            ${{ runner.temp }}/qikvrt-exact-head-review-transport-attempt-1/review-intent.json

      - name: Seal read-only publisher validation result
        id: publisher_validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state=invalid
          if [ "${{ steps.publish.outcome }}" = success ]; then
            if [ "${{ steps.dedupe.outputs.duplicate }}" = true ]; then
              test "${{ steps.publish.outputs.state }}" = success
              state=duplicate
            elif [ "${{ steps.publish.outputs.state }}" = error ]; then
              state=ready
            elif [ "${{ steps.publish.outputs.state }}" = success ] && \
                 [ "${{ steps.review_intent_evidence.outcome }}" = success ]; then
              state=ready
            fi
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          test "$state" != invalid

  publish-status:
    name: Publish exact candidate status only
    needs: [bind-dispatch, validate-publisher-observation]
    if: >-
      always() && needs.bind-dispatch.result == 'success' &&
      needs.validate-publisher-observation.result == 'success' &&
      (needs.validate-publisher-observation.outputs.validation_state == 'ready' ||
       needs.validate-publisher-observation.outputs.validation_state == 'duplicate')
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      state: ${{ steps.status.outputs.state }}
      status_id: ${{ steps.status.outputs.status_id }}
      effect: ${{ steps.status.outputs.effect }}
    env:
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      PLANNED_STATE: ${{ needs.validate-publisher-observation.outputs.planned_state }}
      DUPLICATE: ${{ needs.validate-publisher-observation.outputs.duplicate }}
      PRIOR_STATUS_ID: ${{ needs.validate-publisher-observation.outputs.prior_status_id }}
    steps:
      - name: Reobserve exact subject and publish only the validated status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLANNED_STATE" =~ ^(success|error)$ ]]
          [[ "$TARGET_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_BASE_REF" = main
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq '.tree.sha')" = "$TARGET_TREE_SHA"

          effect=published
          status_id=
          if [ "$DUPLICATE" = true ]; then
            test "$PLANNED_STATE" = success
            [[ "$PRIOR_STATUS_ID" =~ ^[1-9][0-9]*$ ]]
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100" \
              > "$RUNNER_TEMP/pre-effect-status-pages.json"
            latest="$(jq -c '
              [.[] | .[] | select(.context == "QIKVRT autonomous candidate self-check")] |
              sort_by(.id,.created_at) | last // empty
            ' "$RUNNER_TEMP/pre-effect-status-pages.json")"
            if [ -n "$latest" ] && \
               [ "$(jq -r '.id' <<<"$latest")" = "$PRIOR_STATUS_ID" ] && \
               [ "$(jq -r '.state' <<<"$latest")" = success ]; then
              status_id="$PRIOR_STATUS_ID"
              effect=duplicate
            fi
          fi

          if [ "$effect" = published ]; then
            description='Candidate self-check incomplete or failed closed'
            if [ "$PLANNED_STATE" = success ]; then
              description='Read-only candidate self-check succeeded; independent gates remain'
            fi
            # Fence trusted evaluator/main immediately before the sole write.
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"
            response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$PLANNED_STATE" \
              -f context='QIKVRT autonomous candidate self-check' \
              -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            status_id="$(jq -r '.id // empty' <<<"$response")"
            [[ "$status_id" =~ ^[1-9][0-9]*$ ]]
            jq -e --arg state "$PLANNED_STATE" \
              --arg target "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '
              .state == $state and
              .context == "QIKVRT autonomous candidate self-check" and
              .target_url == $target
            ' <<<"$response" >/dev/null
          fi
          {
            echo "state=$PLANNED_STATE"
            echo "status_id=$status_id"
            echo "effect=$effect"
          } >> "$GITHUB_OUTPUT"

  publish-observation:
    name: Seal trusted-main publisher receipt
    needs:
      - bind-dispatch
      - verify-candidate
      - validate-candidate-observation
      - validate-publisher-observation
      - publish-status
    if: always()
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publisher_artifact_id: ${{ steps.publisher_evidence.outputs.artifact-id }}
      publisher_artifact_digest: ${{ steps.publisher_evidence.outputs.artifact-digest }}
      published_state: ${{ steps.result.outputs.state }}
      duplicate: ${{ steps.result.outputs.duplicate }}
      prior_publisher_artifact_id: ${{ steps.result.outputs.prior_publisher_artifact_id }}
      prior_publisher_artifact_digest: ${{ steps.result.outputs.prior_publisher_artifact_digest }}
      review_intent_artifact_id: ${{ steps.result.outputs.review_intent_artifact_id }}
      review_intent_artifact_digest: ${{ steps.result.outputs.review_intent_artifact_digest }}
    env:
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_HEAD_REPOSITORY: ${{ github.event.client_payload.subject.head_repository }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      PRODUCER_RUN_ID: ${{ github.event.client_payload.producer.run_id }}
      PRODUCER_RUN_ATTEMPT: ${{ github.event.client_payload.producer.run_attempt }}
      PRODUCER_WORKFLOW_ID: ${{ github.event.client_payload.producer.workflow_id }}
      PRODUCER_WORKFLOW_PATH: ${{ github.event.client_payload.producer.workflow_path }}
      PRODUCER_WORKFLOW_SHA: ${{ github.event.client_payload.producer.workflow_sha }}
      BINDING_ARTIFACT_ID: ${{ needs.bind-dispatch.outputs.artifact_id }}
      BINDING_ARTIFACT_DIGEST: ${{ needs.bind-dispatch.outputs.artifact_digest }}
      BINDING_RUN_ATTEMPT: ${{ needs.bind-dispatch.outputs.binding_run_attempt }}
      BOUND_PRODUCER_ARTIFACT_ID: ${{ needs.bind-dispatch.outputs.producer_artifact_id }}
      BOUND_PRODUCER_ARTIFACT_DIGEST: ${{ needs.bind-dispatch.outputs.producer_artifact_digest }}
      CANDIDATE_RESULT: ${{ needs.verify-candidate.result }}
      ARTIFACT_ID: ${{ needs.validate-candidate-observation.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.validate-candidate-observation.outputs.artifact_digest }}
      ARTIFACT_IDENTITY_OUTCOME: ${{ needs.validate-candidate-observation.outputs.identity_outcome }}
      DOWNLOAD_OUTCOME: ${{ needs.validate-candidate-observation.outputs.download_outcome }}
      RECEIPT_OUTCOME: ${{ needs.validate-candidate-observation.outputs.receipt_outcome }}
      VALIDATION_STATE: ${{ needs.validate-publisher-observation.outputs.validation_state }}
      PUBLISHED_STATE: ${{ needs.publish-status.outputs.state }}
      STATUS_ID: ${{ needs.publish-status.outputs.status_id }}
      STATUS_EFFECT: ${{ needs.publish-status.outputs.effect }}
      DUPLICATE: ${{ needs.validate-publisher-observation.outputs.duplicate }}
      PRIOR_PUBLISHER_ARTIFACT_ID: ${{ needs.validate-publisher-observation.outputs.prior_publisher_artifact_id }}
      PRIOR_PUBLISHER_ARTIFACT_DIGEST: ${{ needs.validate-publisher-observation.outputs.prior_publisher_artifact_digest }}
      REVIEW_INTENT_ARTIFACT_ID: ${{ needs.validate-publisher-observation.outputs.review_intent_artifact_id }}
      REVIEW_INTENT_ARTIFACT_DIGEST: ${{ needs.validate-publisher-observation.outputs.review_intent_artifact_digest }}
    steps:
      - name: Bind status effect and exact live subject without write authority
        id: status_receipt
        if: needs.publish-status.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_STATE" =~ ^(success|error)$ ]]
          [[ "$STATUS_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$STATUS_EFFECT" =~ ^(published|duplicate)$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq '.tree.sha')" = "$TARGET_TREE_SHA"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100" \
            > "$RUNNER_TEMP/publisher-status-pages.json"
          status="$(jq -c --argjson id "$STATUS_ID" \
            '[.[] | .[] | select(.id == $id)] | if length == 1 then .[0] else empty end' \
            "$RUNNER_TEMP/publisher-status-pages.json")"
          test -n "$status"
          jq -e --arg state "$PUBLISHED_STATE" '
            .state == $state and .context == "QIKVRT autonomous candidate self-check" and
            (.target_url | startswith("https://github.com/"))
          ' <<<"$status" >/dev/null
          if [ "$STATUS_EFFECT" = published ]; then
            test "$(jq -r '.target_url' <<<"$status")" = \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            test "$DUPLICATE" = true
            test "$PUBLISHED_STATE" = success
          fi

      - name: Require exact requested-review intent artifact identity
        id: review_intent_identity
        if: >-
          steps.status_receipt.outcome == 'success' &&
          env.PUBLISHED_STATE == 'success' && env.DUPLICATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEW_INTENT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_INTENT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$|^[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEW_INTENT_ARTIFACT_ID}")"
          jq -e --argjson id "$REVIEW_INTENT_ARTIFACT_ID" \
            --arg name "qikvrt-exact-head-review-intent-${TARGET_PR}-${TARGET_SHA}-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-attempt-1" \
            --arg digest "sha256:${REVIEW_INTENT_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == $run_id and .workflow_run.head_branch == "main" and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download exact requested-review intent without write authority
        id: review_intent_download
        if: steps.review_intent_identity.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.validate-publisher-observation.outputs.review_intent_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-head-review-intent-readback

      - name: Validate requested-review intent bytes without write authority
        id: review_intent_receipt
        if: steps.review_intent_download.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-review-intent-readback"
          test "$(find "$root" -type f | wc -l)" -eq 2
          test -f "$root/review-request.json"
          test -f "$root/review-intent.json"
          test ! -L "$root/review-request.json"
          test ! -L "$root/review-intent.json"
          jq -e --slurpfile request "$root/review-request.json" \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg evaluator "$GITHUB_WORKFLOW_SHA" \
            --arg request_sha "$(sha256sum "$root/review-request.json" | cut -d' ' -f1)" '
            .schema == "qikvrt.requested-review-transport-intent.v1" and
            .repository == $repository and .subject.pull_request == ($pr|tonumber) and
            .subject.head_sha == $head and .subject.head_tree_sha == $tree and
            .subject.base_ref == $base_ref and .subject.base_sha == $base and
            .target.workflow_path == ".github/workflows/qikvrt_requested_review_executor.yml" and
            .target.ref == "main" and .target.evaluator_sha == $evaluator and
            .attempt == 1 and .request_sha256 == $request_sha and
            .productive_effect == false and .effect_ack == "NOT_REQUIRED" and
            $request[0].schema == "qikvrt.requested-review-transport-request.v1" and
            $request[0].repository == $repository and $request[0].subject == .subject and
            $request[0].target == .target and $request[0].attempt == 1
          ' "$root/review-intent.json" >/dev/null

      - name: Materialize trusted publisher receipt
        id: result
        if: >-
          steps.status_receipt.outcome == 'success' &&
          (env.DUPLICATE == 'true' || env.PUBLISHED_STATE == 'error' ||
           steps.review_intent_receipt.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-publisher-receipt"
          mkdir -p "$root"
          {
            echo "state=$PUBLISHED_STATE"
            echo "duplicate=$DUPLICATE"
            echo "prior_publisher_artifact_id=$PRIOR_PUBLISHER_ARTIFACT_ID"
            echo "prior_publisher_artifact_digest=$PRIOR_PUBLISHER_ARTIFACT_DIGEST"
          } >> "$GITHUB_OUTPUT"
          if [ "$DUPLICATE" = true ]; then
            test "$PUBLISHED_STATE" = success
            [[ "$PRIOR_PUBLISHER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PRIOR_PUBLISHER_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            exit 0
          fi
          review_intent_id=
          review_intent_digest=
          if [ "$PUBLISHED_STATE" = success ]; then
            review_intent_id="$REVIEW_INTENT_ARTIFACT_ID"
            review_intent_digest="sha256:${REVIEW_INTENT_ARTIFACT_DIGEST#sha256:}"
            echo "review_intent_artifact_id=$review_intent_id" >> "$GITHUB_OUTPUT"
            echo "review_intent_artifact_digest=$review_intent_digest" >> "$GITHUB_OUTPUT"
          fi
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg head_repository "$TARGET_HEAD_REPOSITORY" --arg head_ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg candidate_result "$CANDIDATE_RESULT" --arg artifact_id "$ARTIFACT_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg artifact_identity_outcome "$ARTIFACT_IDENTITY_OUTCOME" \
            --arg download_outcome "$DOWNLOAD_OUTCOME" --arg receipt_outcome "$RECEIPT_OUTCOME" \
            --arg review_intent_artifact_id "$review_intent_id" \
            --arg review_intent_artifact_digest "$review_intent_digest" \
            --arg published_state "$PUBLISHED_STATE" --arg status_id "$STATUS_ID" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" \
            --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg producer_artifact_id "$BOUND_PRODUCER_ARTIFACT_ID" \
            --arg producer_artifact_digest "$BOUND_PRODUCER_ARTIFACT_DIGEST" \
            --arg binding_artifact_id "$BINDING_ARTIFACT_ID" \
            --arg binding_artifact_digest "sha256:${BINDING_ARTIFACT_DIGEST#sha256:}" \
            --arg binding_run_attempt "$BINDING_RUN_ATTEMPT" \
            '{schema:"qikvrt.autonomous-candidate-self-check-publisher.v2",repository:$repository,pull_request:($pr|tonumber),head_repository:$head_repository,head_ref:$head_ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base,run_id:($run_id|tonumber),run_attempt:($run_attempt|tonumber),workflow_ref:$workflow_ref,workflow_sha:$workflow_sha,dispatch_binding:{artifact:{id:($binding_artifact_id|tonumber),digest:$binding_artifact_digest},run_attempt:($binding_run_attempt|tonumber),receipt_outcome:"success"},candidate_result:$candidate_result,candidate_artifact:{id:(if $artifact_id == "" then null else ($artifact_id|tonumber) end),digest:$artifact_digest,identity_outcome:$artifact_identity_outcome,download_outcome:$download_outcome,receipt_outcome:$receipt_outcome},published_state:$published_state,status_id:($status_id|tonumber),status_context:"QIKVRT autonomous candidate self-check",review_dispatch_outcome:(if $published_state == "success" then "pending" else "not_applicable" end),review_transport:(if $published_state == "success" then {attempt:1,outcome:"intent_persisted",intent_artifact:{id:($review_intent_artifact_id|tonumber),digest:$review_intent_artifact_digest}} else {attempt:null,outcome:"not_applicable",intent_artifact:null} end),producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha,continuation_artifact:{id:($producer_artifact_id|tonumber),digest:$producer_artifact_digest}},classification:"CANDIDATE_SELF_CHECK_ONLY",trusted_terminal_verification:false,productive_effect:false,effect_ack:"NOT_REQUIRED"}' \
            > "$root/publisher.json"

      - name: Preserve trusted publisher receipt
        id: publisher_evidence
        if: steps.result.outcome == 'success' && steps.result.outputs.duplicate != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-head-publisher-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-head-publisher-receipt/publisher.json

  persist-exact-review-outbox:
    name: Persist exact requested-review intent in durable FIFO
    needs: [bind-dispatch, publish-observation]
    if: >-
      needs.bind-dispatch.result == 'success' &&
      needs.publish-observation.outputs.published_state == 'success' &&
      needs.publish-observation.outputs.review_intent_artifact_id != ''
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-exact-review-dispatch
      cancel-in-progress: false
      queue: max
    outputs:
      sequence: ${{ steps.persist.outputs.sequence }}
      fingerprint: ${{ steps.persist.outputs.fingerprint }}
      transport_attempt: ${{ steps.persist.outputs.transport_attempt }}
      new_transport: ${{ steps.persist.outputs.new_transport }}
      transport_artifact_id: ${{ steps.transport_evidence.outputs.artifact-id }}
      transport_artifact_digest: ${{ steps.transport_evidence.outputs.artifact-digest }}
    env:
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      REVIEW_INTENT_ARTIFACT_ID: ${{ needs.publish-observation.outputs.review_intent_artifact_id }}
      REVIEW_INTENT_ARTIFACT_DIGEST: ${{ needs.publish-observation.outputs.review_intent_artifact_digest }}
      VERIFIER_WORKFLOW_ID: ${{ needs.bind-dispatch.outputs.verifier_workflow_id }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-exact-review-dispatch
    steps:
      - name: Check out exact trusted verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact review transport intent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.publish-observation.outputs.review_intent_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-review-outbox-input

      - name: Validate and materialize exact review outbox payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-review-outbox-input"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"
          [[ "$REVIEW_INTENT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_INTENT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$|^[0-9a-f]{64}$ ]]
          [[ "$VERIFIER_WORKFLOW_ID" =~ ^[1-9][0-9]*$ ]]
          test -f "$root/review-request.json"
          test -f "$root/review-intent.json"
          test "$(find "$root" -type f | wc -l)" -eq 2
          artifact_name="qikvrt-exact-head-review-intent-${TARGET_PR}-${TARGET_SHA}-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-attempt-1"
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEW_INTENT_ARTIFACT_ID}")"
          jq -e --argjson id "$REVIEW_INTENT_ARTIFACT_ID" --arg name "$artifact_name" \
            --arg digest "sha256:${REVIEW_INTENT_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == $run_id and .workflow_run.head_branch == "main" and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg ref "$TARGET_REF" --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg evaluator "$GITHUB_WORKFLOW_SHA" \
            --arg request_sha "$(sha256sum "$root/review-request.json" | cut -d' ' -f1)" '
            .schema == "qikvrt.requested-review-transport-intent.v1" and
            .repository == $repository and .subject == {pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base} and
            .target.workflow_path == ".github/workflows/qikvrt_requested_review_executor.yml" and
            .target.ref == "main" and .target.evaluator_sha == $evaluator and
            .attempt == 1 and .request_sha256 == $request_sha and
            .productive_effect == false and .effect_ack == "NOT_REQUIRED"
          ' "$root/review-intent.json" >/dev/null
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq '.tree.sha')" = "$TARGET_TREE_SHA"
          verifier="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")"
          jq -e --argjson id "$VERIFIER_WORKFLOW_ID" '
            .id == $id and .path == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and .state == "active"
          ' <<<"$verifier" >/dev/null
          executor="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_requested_review_executor.yml")"
          executor_workflow_id="$(jq -r '.id' <<<"$executor")"
          [[ "$executor_workflow_id" =~ ^[1-9][0-9]*$ ]]
          jq -e '.path == ".github/workflows/qikvrt_requested_review_executor.yml" and .state == "active"' \
            <<<"$executor" >/dev/null
          executor_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/qikvrt_requested_review_executor.yml?ref=${GITHUB_WORKFLOW_SHA}" --jq '.sha')"
          test "$executor_blob" = "$(jq -r '.target.workflow_blob_sha' "$root/review-request.json")"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg main "$GITHUB_WORKFLOW_SHA" \
            --arg verifier_workflow_id "$VERIFIER_WORKFLOW_ID" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg pr "$TARGET_PR" --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" --arg base_ref "$TARGET_BASE_REF" \
            --arg base "$TARGET_BASE_SHA" --arg executor_workflow_id "$executor_workflow_id" '
            {schema:"qikvrt_ruleset_outbox_payload_v1",repository:$repository,lane:"exact-review-dispatch",main_head_sha:$main,producer:{workflow_path:".github/workflows/qikvrt_autonomous_exact_head_verify.yml",workflow_sha:$main,workflow_id:($verifier_workflow_id|tonumber),run_id:($run_id|tonumber),run_attempt:($run_attempt|tonumber),event:"repository_dispatch"},subject:{pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base},target:{workflow_id:($executor_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_requested_review_executor.yml",event:"workflow_dispatch"},request:{ref:"main",return_run_details:true,inputs:{pr:$pr,head:$head,fingerprint:("0"*64),evaluator_sha:$main,transport_intent_sha256:("0"*64),transport_attempt:"1"}},causal:{d0:2,state:"REQUESTED_REVIEW",productive_effect:false}}
          ' > "$root/payload-draft.json"
          python3 - "$root/payload-draft.json" "$root/payload.json" <<'PY'
          import json
          import pathlib
          import sys

          from tools.qikvrt_ruleset_outbox import seal_review_transport_payload

          source, target = sys.argv[1:]
          draft = json.loads(pathlib.Path(source).read_text(encoding="utf-8"))
          payload = seal_review_transport_payload(draft, attempt=1)
          pathlib.Path(target).write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          printf '%s\n' "$artifact_name" > "$root/artifact-name.txt"

      - name: Enqueue exact review intent CAS only
        id: enqueue
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          root="$RUNNER_TEMP/qikvrt-exact-review-outbox-input"
          artifact_name="$(cat "$root/artifact-name.txt")"
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" --receipt "$root/enqueue.json" \
            enqueue --lane exact-review-dispatch --payload "$root/payload.json" \
            --artifact-id "$REVIEW_INTENT_ARTIFACT_ID" --artifact-name "$artifact_name" \
            --artifact-digest "$REVIEW_INTENT_ARTIFACT_DIGEST" >/dev/null
          sequence="$(jq -r '.sequence' "$root/enqueue.json")"
          fingerprint="$(jq -r '.fingerprint' "$root/enqueue.json")"
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          unset writer_token

      - name: Materialize exact review request from sealed enqueue receipt
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-review-outbox-input"
          python3 - "$root/enqueue.json" "$root/transport-request.json" <<'PY'
          import json
          import pathlib
          import sys

          from tools.qikvrt_ruleset_outbox import request_for_transport_attempt

          source, target = sys.argv[1:]
          intent = json.loads(pathlib.Path(source).read_text(encoding="utf-8"))
          request = request_for_transport_attempt(intent, 1)
          pathlib.Path(target).write_text(
              json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Prepare exact review transport CAS only
        id: persist
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
          ENQUEUED_SEQUENCE: ${{ steps.enqueue.outputs.sequence }}
          ENQUEUED_FINGERPRINT: ${{ steps.enqueue.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          root="$RUNNER_TEMP/qikvrt-exact-review-outbox-input"
          sequence="$ENQUEUED_SEQUENCE"
          fingerprint="$ENQUEUED_FINGERPRINT"
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" --receipt "$root/transport.json" \
            prepare-transport --lane exact-review-dispatch --sequence "$sequence" --attempt 1 \
            --request "$root/transport-request.json" --actor-run-id "$GITHUB_RUN_ID" \
            --actor-run-attempt "$GITHUB_RUN_ATTEMPT" >/dev/null
          jq -e '.cas.persisted == true and (.cas.appended | type) == "boolean"' \
            "$root/transport.json" >/dev/null
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "transport_attempt=1" >> "$GITHUB_OUTPUT"
          echo "new_transport=$(jq -r '.cas.appended' "$root/transport.json")" >> "$GITHUB_OUTPUT"
          unset writer_token

      - name: Preserve exact review pre-effect transport bytes
        id: transport_evidence
        if: steps.persist.outputs.new_transport == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-review-pre-effect-${{ steps.persist.outputs.sequence }}-${{ steps.persist.outputs.fingerprint }}-transport-1-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/qikvrt-exact-review-outbox-input/enqueue.json
            ${{ runner.temp }}/qikvrt-exact-review-outbox-input/transport.json
            ${{ runner.temp }}/qikvrt-exact-review-outbox-input/transport-request.json

  dispatch-exact-review-transport:
    name: Dispatch exact requested-review transport only
    needs: [bind-dispatch, persist-exact-review-outbox]
    if: needs.persist-exact-review-outbox.outputs.new_transport == 'true'
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      OUTBOX_SEQUENCE: ${{ needs.persist-exact-review-outbox.outputs.sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.persist-exact-review-outbox.outputs.fingerprint }}
      TRANSPORT_ARTIFACT_ID: ${{ needs.persist-exact-review-outbox.outputs.transport_artifact_id }}
      TRANSPORT_ARTIFACT_DIGEST: ${{ needs.persist-exact-review-outbox.outputs.transport_artifact_digest }}
    outputs:
      child_found: ${{ steps.dispatch.outputs.child_found }}
    steps:
      - name: Require exact pre-effect transport artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRANSPORT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRANSPORT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$|^[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRANSPORT_ARTIFACT_ID}")"
          jq -e --argjson id "$TRANSPORT_ARTIFACT_ID" \
            --arg name "qikvrt-exact-review-pre-effect-${OUTBOX_SEQUENCE}-${OUTBOX_FINGERPRINT}-transport-1-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${TRANSPORT_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == $run_id and .workflow_run.head_branch == "main" and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download exact pre-effect transport bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.persist-exact-review-outbox.outputs.transport_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-review-dispatch

      - name: Reobserve sealed review request and dispatch once
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-review-dispatch"
          test -f "$root/enqueue.json"
          test -f "$root/transport.json"
          test -f "$root/transport-request.json"
          test "$(find "$root" -type f | wc -l)" -eq 3
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"
          jq -e --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" '
            .lane == "exact-review-dispatch" and .sequence == $sequence and
            .fingerprint == $fingerprint and .state == "SEALED"
          ' "$root/enqueue.json" >/dev/null
          jq -e --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" \
            --argjson actor "$GITHUB_RUN_ID" --argjson actor_attempt "$GITHUB_RUN_ATTEMPT" '
            .schema == "qikvrt_ruleset_outbox_transport_v2" and
            .lane == "exact-review-dispatch" and .sequence == $sequence and
            .fingerprint == $fingerprint and .attempt == 1 and
            .state == "PRE_EFFECT_REOBSERVED" and .productive_effect == false and
            .actor_run_id == $actor and .actor_run_attempt == $actor_attempt and
            .cas.persisted == true and .cas.appended == true
          ' "$root/transport.json" >/dev/null
          python3 - "$root/transport.json" "$root/transport-request.json" <<'PY'
          import json
          import pathlib
          import sys

          from tools.qikvrt_ruleset_outbox import digest

          transport_path, request_path = map(pathlib.Path, sys.argv[1:])
          transport = json.loads(transport_path.read_text(encoding="utf-8"))
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if transport["request_sha256"] != digest(request):
              raise SystemExit("sealed transport request digest mismatch")
          PY
          cp "$root/transport-request.json" "$root/request.json"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq '.tree.sha')" = "$TARGET_TREE_SHA"
          evaluator="$(jq -r '.inputs.evaluator_sha' "$root/request.json")"
          intent_sha="$(jq -r '.inputs.transport_intent_sha256' "$root/request.json")"
          transport_attempt="$(jq -r '.inputs.transport_attempt' "$root/request.json")"
          evidence_fingerprint="$(jq -r '.inputs.fingerprint' "$root/request.json")"
          test "$evaluator" = "$GITHUB_WORKFLOW_SHA"
          test "$intent_sha" = "$OUTBOX_FINGERPRINT"
          test "$transport_attempt" = 1
          executor="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_requested_review_executor.yml")"
          executor_workflow_id="$(jq -r '.id' <<<"$executor")"
          test "$executor_workflow_id" = "$(jq -r '.intent.payload.target.workflow_id' "$root/enqueue.json")"
          jq -e '.path == ".github/workflows/qikvrt_requested_review_executor.yml" and .state == "active"' \
            <<<"$executor" >/dev/null
          expected_title="qikvrt-rr-v3 e=${evaluator} p=${TARGET_PR} h=${TARGET_SHA} f=${evidence_fingerprint} i=${intent_sha} a=1"
          set +e
          gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_requested_review_executor.yml/dispatches" \
            --input "$root/request.json" > "$root/response.json"
          post_rc=$?
          set -e
          if [ "$post_rc" -ne 0 ]; then
            rm -f "$root/response.json"
            # A failed client response is transport-ambiguous: the server may
            # already have admitted the child.  This effect job cannot observe
            # its own terminal run and therefore cannot mint absence evidence.
            # The scheduled Auditor resumes a durable, bounded scan only after
            # this exact actor attempt is terminal.
            exit "$post_rc"
          fi
          jq -e '
            (keys | sort) == ["html_url","run_url","workflow_run_id"] and
            (.workflow_run_id | type) == "number" and .workflow_run_id > 0 and
            (.run_url | type) == "string" and (.run_url | length) > 0 and
            (.html_url | type) == "string" and (.html_url | length) > 0
          ' "$root/response.json" >/dev/null
          child_run_id="$(jq -r '.workflow_run_id' "$root/response.json")"
          child="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${child_run_id}")"
          jq -e --argjson id "$child_run_id" --argjson workflow_id "$executor_workflow_id" \
            --arg repository "$GITHUB_REPOSITORY" --arg evaluator "$evaluator" --arg title "$expected_title" '
            .id == $id and .run_attempt == 1 and .workflow_id == $workflow_id and
            (.path | split("@")[0]) == ".github/workflows/qikvrt_requested_review_executor.yml" and
            .event == "workflow_dispatch" and .repository.full_name == $repository and
            .head_branch == "main" and .head_sha == $evaluator and .display_title == $title and
            (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")
          ' <<<"$child" >/dev/null
          jq -n --argjson run_id "$child_run_id" --argjson run_attempt "$(jq -r '.run_attempt' <<<"$child")" \
            --argjson workflow_id "$executor_workflow_id" --arg repository "$GITHUB_REPOSITORY" \
            --arg head_sha "$evaluator" --arg status "$(jq -r '.status' <<<"$child")" --arg title "$expected_title" '
            {run_id:$run_id,run_attempt:$run_attempt,workflow_id:$workflow_id,workflow_path:".github/workflows/qikvrt_requested_review_executor.yml",event:"workflow_dispatch",repository:$repository,head_sha:$head_sha,status:$status,display_title:$title}
          ' > "$root/child.json"
          echo "child_found=true" >> "$GITHUB_OUTPUT"

      - name: Preserve exact requested-review child locator
        id: child_evidence
        if: steps.dispatch.outputs.child_found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-review-child-${{ needs.persist-exact-review-outbox.outputs.sequence }}-${{ needs.persist-exact-review-outbox.outputs.fingerprint }}-attempt-1
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            ${{ runner.temp }}/qikvrt-exact-review-dispatch/request.json
            ${{ runner.temp }}/qikvrt-exact-review-dispatch/response.json
            ${{ runner.temp }}/qikvrt-exact-review-dispatch/child.json

  accept-exact-review-transport:
    name: Persist exact requested-review child acceptance
    needs: [persist-exact-review-outbox, dispatch-exact-review-transport]
    if: >-
      needs.dispatch-exact-review-transport.result == 'success' &&
      needs.dispatch-exact-review-transport.outputs.child_found == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-exact-review-dispatch
      cancel-in-progress: false
      queue: max
    env:
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      OUTBOX_SEQUENCE: ${{ needs.persist-exact-review-outbox.outputs.sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.persist-exact-review-outbox.outputs.fingerprint }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-exact-review-dispatch
    steps:
      - name: Check out exact trusted verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact requested-review child locator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: qikvrt-exact-review-child-${{ needs.persist-exact-review-outbox.outputs.sequence }}-${{ needs.persist-exact-review-outbox.outputs.fingerprint }}-attempt-1
          path: ${{ runner.temp }}/qikvrt-exact-review-child

      - name: Rebind exact requested-review child without ledger credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-review-child"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"
          test -f "$root/child.json"
          test -f "$root/request.json"
          test -f "$root/response.json"
          test "$(find "$root" -type f | wc -l)" -eq 3
          child_run_id="$(jq -r '.run_id' "$root/child.json")"
          child="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${child_run_id}")"
          jq -e --slurpfile sealed "$root/child.json" '
            .id == $sealed[0].run_id and .run_attempt == $sealed[0].run_attempt and
            .workflow_id == $sealed[0].workflow_id and (.path | split("@")[0]) == $sealed[0].workflow_path and
            .event == $sealed[0].event and .repository.full_name == $sealed[0].repository and
            .head_sha == $sealed[0].head_sha and .display_title == $sealed[0].display_title
          ' <<<"$child" >/dev/null
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq '.tree.sha')" = "$TARGET_TREE_SHA"

      - name: Append exact requested-review acceptance CAS only
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          root="$RUNNER_TEMP/qikvrt-exact-review-child"
          test -f "$root/child.json"
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" --receipt "$root/acceptance.json" \
            accept --lane exact-review-dispatch --sequence "$OUTBOX_SEQUENCE" \
            --attempt 1 --child "$root/child.json" >/dev/null
          unset writer_token

  persist-exact-head-outbox-result:
    name: Preserve immutable exact-head business result
    needs: [bind-dispatch, accept-exact-head-outbox-transport, publish-observation]
    if: >-
      always() && needs.bind-dispatch.result == 'success' &&
      needs.accept-exact-head-outbox-transport.result == 'success' &&
      (needs.publish-observation.outputs.publisher_artifact_id != '' ||
       needs.publish-observation.outputs.prior_publisher_artifact_id != '')
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      OUTBOX_SEQUENCE: ${{ needs.bind-dispatch.outputs.outbox_sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.bind-dispatch.outputs.outbox_fingerprint }}
      OUTBOX_TRANSPORT_ATTEMPT: ${{ needs.bind-dispatch.outputs.outbox_transport_attempt }}
      PUBLISHER_ARTIFACT_ID: ${{ needs.publish-observation.outputs.publisher_artifact_id }}
      PUBLISHER_ARTIFACT_DIGEST: ${{ needs.publish-observation.outputs.publisher_artifact_digest }}
      PRIOR_PUBLISHER_ARTIFACT_ID: ${{ needs.publish-observation.outputs.prior_publisher_artifact_id }}
      PRIOR_PUBLISHER_ARTIFACT_DIGEST: ${{ needs.publish-observation.outputs.prior_publisher_artifact_digest }}
    steps:
      - name: Check out exact trusted verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind publisher receipt and materialize immutable business result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-outbox-result"
          mkdir -p "$root"
          [[ "$OUTBOX_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$OUTBOX_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          test "$OUTBOX_TRANSPORT_ATTEMPT" = 1
          artifact_id="$PUBLISHER_ARTIFACT_ID"
          artifact_digest="$PUBLISHER_ARTIFACT_DIGEST"
          if [ -z "$artifact_id" ]; then
            artifact_id="$PRIOR_PUBLISHER_ARTIFACT_ID"
            artifact_digest="$PRIOR_PUBLISHER_ARTIFACT_DIGEST"
          fi
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$|^[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")"
          jq -e --argjson id "$artifact_id" --arg digest "sha256:${artifact_digest#sha256:}" '
            .id == $id and .digest == $digest and .expired == false and
            (.workflow_run.id | type) == "number" and .workflow_run.id > 0
          ' <<<"$artifact" >/dev/null
          zip="$root/publisher.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip"
          test "sha256:${artifact_digest#sha256:}" = "sha256:$(sha256sum "$zip" | cut -d' ' -f1)"
          test "$(unzip -Z1 "$zip" | grep -Fxc publisher.json)" -eq 1
          test "$(unzip -Z1 "$zip" | wc -l)" -eq 1
          unzip -p "$zip" publisher.json > "$root/publisher.json"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg ref "$TARGET_REF" --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" '
            .schema == "qikvrt.autonomous-candidate-self-check-publisher.v2" and
            .repository == $repository and .pull_request == ($pr|tonumber) and
            .head_repository == $repository and .head_ref == $ref and
            .head_sha == $head and .head_tree_sha == $tree and
            .base_ref == $base_ref and .base_sha == $base and
            (.published_state == "success" or .published_state == "error") and
            .status_context == "QIKVRT autonomous candidate self-check" and
            .classification == "CANDIDATE_SELF_CHECK_ONLY" and
            .trusted_terminal_verification == false and .productive_effect == false
          ' "$root/publisher.json" >/dev/null
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq '.tree.sha')" = "$TARGET_TREE_SHA"
          # This workflow cannot truthfully mark itself completed.  It only
          # seals the exact result bytes here; the trusted workflow_run
          # completion consumer records the completed child and advances the
          # FIFO after GitHub has made the terminal run result observable.
          jq -n --slurpfile publisher "$root/publisher.json" \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg head_repository "$GITHUB_REPOSITORY" --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" \
            --arg transport_attempt "$OUTBOX_TRANSPORT_ATTEMPT" \
            --arg publisher_artifact_id "$artifact_id" \
            --arg publisher_artifact_digest "sha256:${artifact_digest#sha256:}" \
            --arg publisher_payload_sha256 "$(sha256sum "$root/publisher.json" | cut -d' ' -f1)" '
            {
              schema:"qikvrt.exact-head-business-result.v1",
              repository:$repository,
              subject:{pull_request:($pr|tonumber),head_repository:$head_repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base},
              verifier:{run_id:($run_id|tonumber),run_attempt:($run_attempt|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_exact_head_verify.yml",workflow_sha:$workflow_sha},
              outbox:{lane:"exact-head-dispatch",sequence:($sequence|tonumber),fingerprint:$fingerprint,transport_attempt:($transport_attempt|tonumber)},
              publisher:{artifact:{id:($publisher_artifact_id|tonumber),archive_sha256:$publisher_artifact_digest,payload_sha256:$publisher_payload_sha256},receipt:$publisher[0]},
              state:"RESULT_BYTES_SEALED_AWAITING_WORKFLOW_COMPLETION",
              productive_effect:false,
              effect_ack:"NOT_REQUIRED"
            }
          ' > "$root/business-result.json"

      - name: Preserve immutable exact-head business result
        id: business_result_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-head-business-result-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-head-outbox-result/business-result.json
