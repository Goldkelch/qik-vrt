name: QIK-VRT autonomous exact-head verification

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  workflow_run:
    workflows:
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT code-owner review observer"
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-autonomous-exact-head-${{ github.event.pull_request.number || github.event.workflow_run.id }}-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR: ${{ github.event.pull_request.number || '' }}
      EVENT_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || '' }}
      EVENT_WORKFLOW_EVENT: ${{ github.event.workflow_run.event || '' }}
      EVENT_WORKFLOW_PRS: ${{ toJSON(github.event.workflow_run.pull_requests || fromJSON('[]')) }}
      TARGET_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Bind one exact native event subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY"
          target_pr=""
          case "$EVENT_NAME" in
            pull_request_target)
              target_pr="$EVENT_PR"
              ;;
            workflow_run)
              test "$EVENT_WORKFLOW_EVENT" = pull_request
              test "$(jq 'length' <<<"$EVENT_WORKFLOW_PRS")" -eq 1
              target_pr="$(jq -r '.[0].number // empty' <<<"$EVENT_WORKFLOW_PRS")"
              ;;
            *)
              echo "HOLD_UNVERIFIED: unsupported native event $EVENT_NAME" >&2
              exit 2
              ;;
          esac
          test "$target_pr" -gt 0
          test "${#EVENT_SHA}" -eq 40
          live="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${target_pr}")"
          test "$(jq -r '.state' <<<"$live")" = open
          test "$(jq -r '.head.repo.full_name // empty' <<<"$live")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.base.ref' <<<"$live")" = main
          target_sha="$(jq -r '.head.sha' <<<"$live")"
          target_base_sha="$(jq -r '.base.sha' <<<"$live")"
          test "$target_sha" = "$EVENT_SHA"
          test "${#target_base_sha}" -eq 40
          {
            echo "TARGET_PR=$target_pr"
            echo "TARGET_SHA=$target_sha"
            echo "TARGET_BASE_SHA=$target_base_sha"
          } >> "$GITHUB_ENV"

      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact checkout and repository-native contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_BASE_SHA" HEAD
          python3 -B tools/qikvrt_publication_overview.py check
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest -v \
            tests.test_qikvrt_publication_overview \
            tests.test_qikvrt_autonomous_self_heal
          make test

      - name: Set up Lean for QCE when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          test: false

      - name: Install QCE document inspection tools
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Re-execute QCE finite formal model when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        working-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
        shell: bash
        run: |
          set -euo pipefail
          qce_tmpdir="$(mktemp -d "${RUNNER_TEMP}/qikvrt-qce-exact-head.XXXXXX")"
          cleanup_qce_tmpdir() {
            rm -rf -- "$qce_tmpdir"
          }
          trap cleanup_qce_tmpdir EXIT HUP INT TERM
          lake build
          python3 -B verify_qce_package.py \
            --lean "$(command -v lean)" \
            --axiom-output "$qce_tmpdir/qce-autonomous-axiom-output.txt" \
            > "$qce_tmpdir/qce-autonomous-verification.json"
          test -s "$qce_tmpdir/qce-autonomous-axiom-output.txt"
          test -s "$qce_tmpdir/qce-autonomous-verification.json"

      - name: Publish exact-head success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='QIKVRT autonomous exact-head verification' \
            -f description='Deterministic repair, full suite and candidate-specific gates succeeded' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > /tmp/qikvrt-autonomous-verified.md <<EOF
          <!-- qikvrt-autonomous-exact-head-verification -->
          Exact-head autonomous verification completed successfully for \`${TARGET_SHA}\`.

          Repository-internal deterministic gates are green for this verification scope. Any declared independent human review, Mirror promotion, or separately authorized publication remains a distinct downstream gate. No repository-wide PASS, FINAL_PASS, or EFFECT_ACK_DONE is claimed.
          EOF
          gh pr comment "$TARGET_PR" --body-file /tmp/qikvrt-autonomous-verified.md

      - name: Publish exact-head failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='QIKVRT autonomous exact-head verification' \
            -f description='Fail-closed exact-head verification found a blocker' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
