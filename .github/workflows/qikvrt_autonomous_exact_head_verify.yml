            .schema == "qikvrt.autonomous-exact-head-dispatch-binding.v1" and
            .repository == $repository and .pull_request == ($pr|tonumber) and
            .head_repository == $head_repository and .head_ref == $ref and
            .head_sha == $head and .head_tree_sha == $tree and
            .base_ref == $base_ref and .base_sha == $base and
            .run_id == ($verifier_run_id|tonumber) and
            .run_attempt == ($binding_run_attempt|tonumber) and
            .workflow_ref == $workflow_ref and .workflow_sha == $workflow_sha and
            .producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha,continuation_artifact:{id:($producer_artifact_id|tonumber),digest:$producer_artifact_digest},sealed_transport:{request_file:"producer-request.json",request_sha256:$sealed_request_sha256,intent_file:"producer-intent.json",intent_sha256:$sealed_intent_sha256}} and
