          jq -e \
            --argjson run_id "$prior_producer_id" \
            --argjson run_attempt "$prior_producer_attempt" '
            length > 0 and
            ([.[].total_count] | unique | length) == 1 and
            (.[0].total_count | type == "number") and
            ([.[] | .jobs[]] | length) == .[0].total_count and
            ([.[] | .jobs[] | select(
              .name == "Preserve exact-head transport intent before dispatch" and
              .run_id == $run_id and .run_attempt == $run_attempt and
              .status == "completed" and .conclusion == "success"
            )] | length) == 1
          ' "$RUNNER_TEMP/dedupe-producer-job-pages.json" >/dev/null || not_duplicate

          # The binding seal, rather than the expiring producer artifact, is the
          # durable transport proof after the repository_dispatch was accepted.
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg ref "$TARGET_REF" --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg producer_run_id "$prior_producer_id" \
            --arg producer_run_attempt "$prior_producer_attempt" \
            --arg producer_workflow_id "$prior_producer_workflow_id" \
            --arg producer_workflow_sha "$prior_producer_workflow_sha" \
            --arg causal_attempt "$prior_causal_attempt" --arg transport_intent "$TRANSPORT_INTENT_SHA256" \
            --arg transport_sequence "$TRANSPORT_SEQUENCE" --arg transport_attempt "$TRANSPORT_ATTEMPT" '
            .event_type == "qikvrt_autonomous_exact_head_verify" and
            .client_payload == {schema:"qikvrt_autonomous_exact_head_verify_dispatch_v1",repository:$repository,subject:{pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base},producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha},causal:{attempt:($causal_attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false},transport:{intent_sha256:$transport_intent,sequence:($transport_sequence|tonumber),attempt:($transport_attempt|tonumber)}}
          ' "$RUNNER_TEMP/dedupe-producer-request.json" >/dev/null || not_duplicate
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" --arg head "$TARGET_SHA" \
            --arg tree "$TARGET_TREE_SHA" --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg producer_run_id "$prior_producer_id" \
            --arg producer_run_attempt "$prior_producer_attempt" \
            --arg producer_workflow_id "$prior_producer_workflow_id" \
            --arg producer_workflow_sha "$prior_producer_workflow_sha" \
            --arg causal_attempt "$prior_causal_attempt" \
            --arg request_sha256 "$(sha256sum "$RUNNER_TEMP/dedupe-producer-request.json" | cut -d' ' -f1)" '
            .schema == "qikvrt.autonomous-exact-head-transport-intent.v1" and
            .repository == $repository and .pull_request == ($pr|tonumber) and
            .head_sha == $head and .head_tree_sha == $tree and
            .base_ref == $base_ref and .base_sha == $base and
            .producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha} and
            .attempt == ($causal_attempt|tonumber) and .request_sha256 == $request_sha256 and
            .productive_effect == false and .effect_ack == "NOT_REQUIRED"
          ' "$RUNNER_TEMP/dedupe-producer-intent.json" >/dev/null || not_duplicate
