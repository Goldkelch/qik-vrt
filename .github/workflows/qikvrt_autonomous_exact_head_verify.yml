            .trusted_terminal_verification == false and .productive_effect == false
          ' "$RUNNER_TEMP/dedupe-binding.json" >/dev/null || not_duplicate

          prior_producer_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")" || not_duplicate
          jq -e \
            --argjson workflow_id "$prior_producer_workflow_id" '
