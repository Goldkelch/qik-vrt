            .workflow_ref == $workflow_ref and .workflow_sha == $workflow_sha and
            .producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha,continuation_artifact:{id:($producer_artifact_id|tonumber),digest:$producer_artifact_digest},sealed_transport:{request_file:"producer-request.json",request_sha256:$sealed_request_sha256,intent_file:"producer-intent.json",intent_sha256:$sealed_intent_sha256}} and
