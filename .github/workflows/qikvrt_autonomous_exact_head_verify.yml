name: QIK-VRT autonomous exact-head verification

on:
  repository_dispatch:
    types: [qikvrt_autonomous_exact_head_verify]
  workflow_dispatch:
    inputs:
      pr:
        description: Exact pull-request number
        required: true
        type: string
      head_ref:
        description: Exact same-repository pull-request branch
        required: true
        type: string
      head_sha:
        description: Exact pull-request head SHA to verify
        required: true
        type: string
      base_sha:
        description: Exact pull-request base SHA
        required: true
        type: string

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: qikvrt-autonomous-exact-head-${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.client_payload.pull_request }}-${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.client_payload.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.repository || github.event.client_payload.repository }}
      TARGET_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.client_payload.pull_request }}
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.event.client_payload.head_ref }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.client_payload.head_sha }}
      TARGET_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.client_payload.base_sha }}
    steps:
      - name: Prepare quota-safe GitHub writer
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qikvrt-gh-write-after-primary-reset.sh <<'EOF'
          qikvrt_gh_write_after_primary_reset() {
            local output error reset now delay
            output="$(mktemp)"
            error="$(mktemp)"

            if gh api "$@" >"$output" 2>"$error"; then
              cat "$output"
              rm -f "$output" "$error"
              return 0
            fi

            if ! grep -Fq "API rate limit exceeded for installation." "$error"; then
              cat "$error" >&2
              rm -f "$output" "$error"
              return 1
            fi

            # GET /rate_limit does not consume the primary REST budget. Bind
            # the single retry to the observed reset epoch instead of a blind
            # fixed-delay rerun. Secondary limits and unrelated failures remain
            # hard failures.
            reset="$(gh api rate_limit --jq '.resources.core.reset' 2>>"$error")" || {
              cat "$error" >&2
              rm -f "$output" "$error"
              return 1
            }
            case "$reset" in
              ''|*[!0-9]*)
                cat "$error" >&2
                rm -f "$output" "$error"
                return 1
                ;;
            esac

            now="$(date +%s)"
            delay=$((reset - now + 5))
            if [ "$delay" -lt 1 ]; then
              delay=1
            fi
            if [ "$delay" -gt 3700 ]; then
              echo "BLOCK: primary installation rate-limit reset exceeds bounded wait: ${delay}s" >&2
              rm -f "$output" "$error"
              return 1
            fi

            echo "QIKVRT_GITHUB_INSTALLATION_RATE_LIMIT_RESET_WAIT_SECONDS=$delay" >&2
            sleep "$delay"
            : > "$output"
            : > "$error"

            if gh api "$@" >"$output" 2>"$error"; then
              cat "$output"
              rm -f "$output" "$error"
              return 0
            fi

            cat "$error" >&2
            rm -f "$output" "$error"
            return 1
          }
          EOF
          bash -n /tmp/qikvrt-gh-write-after-primary-reset.sh

      - name: Validate dispatch envelope without REST quota
        id: envelope
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "${#TARGET_SHA}" -eq 40
          test "${#TARGET_BASE_SHA}" -eq 40
          case "$TARGET_PR" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          pr_head="$(git ls-remote "$remote" "refs/pull/${TARGET_PR}/head" | awk 'NR == 1 {print $1}')"
          branch_head="$(git ls-remote --heads "$remote" "refs/heads/${TARGET_REF}" | awk 'NR == 1 {print $1}')"
          test "$pr_head" = "$TARGET_SHA"
          test "$branch_head" = "$TARGET_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_SHA" = "$TARGET_SHA"
            test "$GITHUB_REF_NAME" = "$TARGET_REF"
          fi
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact checkout and repository-native contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_BASE_SHA" HEAD
          python3 -B tools/qikvrt_publication_overview.py check
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest -v \
            tests.test_qikvrt_publication_overview \
            tests.test_qikvrt_autonomous_self_heal \
            tests.test_qikvrt_exact_head_publish_quota
          make test

      - name: Set up Lean for QCE when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          test: false

      - name: Install QCE document inspection tools
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Re-execute QCE finite formal model when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        working-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
        shell: bash
        run: |
          set -euo pipefail
          qce_tmpdir="$(mktemp -d "${RUNNER_TEMP}/qikvrt-qce-exact-head.XXXXXX")"
          cleanup_qce_tmpdir() {
            rm -rf -- "$qce_tmpdir"
          }
          trap cleanup_qce_tmpdir EXIT HUP INT TERM
          lake build
          python3 -B verify_qce_package.py \
            --lean "$(command -v lean)" \
            --axiom-output "$qce_tmpdir/qce-autonomous-axiom-output.txt" \
            > "$qce_tmpdir/qce-autonomous-verification.json"
          test -s "$qce_tmpdir/qce-autonomous-axiom-output.txt"
          test -s "$qce_tmpdir/qce-autonomous-verification.json"

      - name: Bind deterministic verification outcome
        id: verified
        shell: bash
        run: |
          set -euo pipefail
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Publish exact-head success status quota-safely
        id: publish_success
        if: ${{ steps.verified.outputs.passed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/qikvrt-gh-write-after-primary-reset.sh

          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          pr_head="$(git ls-remote "$remote" "refs/pull/${TARGET_PR}/head" | awk 'NR == 1 {print $1}')"
          branch_head="$(git ls-remote --heads "$remote" "refs/heads/${TARGET_REF}" | awk 'NR == 1 {print $1}')"
          test "$pr_head" = "$TARGET_SHA"
          test "$branch_head" = "$TARGET_SHA"

          qikvrt_gh_write_after_primary_reset --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='QIKVRT autonomous exact-head verification' \
            -f description='Deterministic repair, full suite and candidate-specific gates succeeded' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Dispatch exact-head requested-review continuation quota-safely
        if: ${{ steps.verified.outputs.passed == 'true' && steps.publish_success.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/qikvrt-gh-write-after-primary-reset.sh

          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          pr_head="$(git ls-remote "$remote" "refs/pull/${TARGET_PR}/head" | awk 'NR == 1 {print $1}')"
          branch_head="$(git ls-remote --heads "$remote" "refs/heads/${TARGET_REF}" | awk 'NR == 1 {print $1}')"
          test "$pr_head" = "$TARGET_SHA"
          test "$branch_head" = "$TARGET_SHA"

          # Space consecutive mutative REST requests to reduce secondary-limit
          # pressure. Exact primary exhaustion is reset-bound above.
          sleep 1
          qikvrt_gh_write_after_primary_reset --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_requested_review_executor.yml/dispatches" \
            -f ref=main \
            -f "inputs[pr]=$TARGET_PR" \
            -f "inputs[head]=$TARGET_SHA"

      - name: Publish deterministic verification failure status quota-safely
        if: ${{ always() && steps.envelope.outputs.validated == 'true' && steps.verified.outputs.passed != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/qikvrt-gh-write-after-primary-reset.sh
          qikvrt_gh_write_after_primary_reset --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='QIKVRT autonomous exact-head verification' \
            -f description='Fail-closed exact-head verification found a blocker' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
