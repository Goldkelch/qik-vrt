# Copyright 2026 Ingolf Lohmann.
name: QIK-VRT autonomous exact-head verification
run-name: qikvrt-exact-head-pr-${{ github.event.client_payload.subject.pull_request }}-sha-${{ github.event.client_payload.subject.head_sha }}-producer-${{ github.event.client_payload.producer.run_id }}-${{ github.event.client_payload.producer.run_attempt }}-attempt-${{ github.event.client_payload.transport.attempt }}-intent=${{ github.event.client_payload.transport.intent_sha256 }}-seq=${{ github.event.client_payload.transport.sequence }}-transport-attempt=${{ github.event.client_payload.transport.attempt }}

on:
  repository_dispatch:
    types: [qikvrt_autonomous_exact_head_verify]

# Candidate-owned bytes never share a token with a repository write effect.
permissions: {}

concurrency:
  group: qikvrt-autonomous-exact-head-${{ github.event.client_payload.subject.pull_request }}-${{ github.event.client_payload.subject.head_sha }}
  queue: max
  cancel-in-progress: false

env:
  DISPATCH_ACTION: ${{ github.event.action }}
  DISPATCH_SCHEMA: ${{ github.event.client_payload.schema }}
  CAUSAL_ATTEMPT: ${{ github.event.client_payload.causal.attempt }}
  CAUSAL_D0: ${{ github.event.client_payload.causal.d0 }}
  CAUSAL_STATE: ${{ github.event.client_payload.causal.state }}
  CAUSAL_PRODUCTIVE_EFFECT: ${{ github.event.client_payload.causal.productive_effect }}
  TRANSPORT_INTENT_SHA256: ${{ github.event.client_payload.transport.intent_sha256 }}
  TRANSPORT_SEQUENCE: ${{ github.event.client_payload.transport.sequence }}
  TRANSPORT_ATTEMPT: ${{ github.event.client_payload.transport.attempt }}

jobs:
  bind-dispatch:
    name: Bind exact trusted dispatch subject
    # This job executes only default-main workflow bytes.  It can read the live
    # subject and trusted producer evidence and upload one binding receipt; it
    # has no pull-request, status, or repository-content write permission.
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: qikvrt-outbox-ledger-authority
    outputs:
      artifact_id: ${{ steps.binding_evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.binding_evidence.outputs.artifact-digest }}
      producer_artifact_id: ${{ steps.bind.outputs.producer_artifact_id }}
      producer_artifact_digest: ${{ steps.bind.outputs.producer_artifact_digest }}
      verifier_workflow_id: ${{ steps.bind.outputs.verifier_workflow_id }}
      binding_run_attempt: ${{ steps.bind.outputs.binding_run_attempt }}
      outbox_sequence: ${{ steps.bind.outputs.outbox_sequence }}
      outbox_fingerprint: ${{ steps.bind.outputs.outbox_fingerprint }}
      outbox_transport_attempt: ${{ steps.bind.outputs.outbox_transport_attempt }}
      outbox_acceptance_exists: ${{ steps.bind.outputs.outbox_acceptance_exists }}
    env:
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_HEAD_REPOSITORY: ${{ github.event.client_payload.subject.head_repository }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      PRODUCER_RUN_ID: ${{ github.event.client_payload.producer.run_id }}
      PRODUCER_RUN_ATTEMPT: ${{ github.event.client_payload.producer.run_attempt }}
      PRODUCER_WORKFLOW_ID: ${{ github.event.client_payload.producer.workflow_id }}
      PRODUCER_WORKFLOW_PATH: ${{ github.event.client_payload.producer.workflow_path }}
      PRODUCER_WORKFLOW_SHA: ${{ github.event.client_payload.producer.workflow_sha }}
    steps:
      - name: Check out exact trusted verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read exact dispatch slot with Auditor-only authority
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          auditor_token="${LEDGER_AUDITOR_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$auditor_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRANSPORT_INTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TRANSPORT_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$auditor_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" \
            --receipt "$RUNNER_TEMP/binding-outbox-next.json" \
            lookup --lane exact-head-dispatch --sequence "$TRANSPORT_SEQUENCE" \
            --fingerprint "$TRANSPORT_INTENT_SHA256" >/dev/null
          unset auditor_token

      - name: Bind dispatch producer and exact live subject
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = repository_dispatch
          test "$DISPATCH_ACTION" = qikvrt_autonomous_exact_head_verify
          test "$DISPATCH_SCHEMA" = qikvrt_autonomous_exact_head_verify_dispatch_v1
          test "$CAUSAL_ATTEMPT" = 1
          test "$CAUSAL_D0" -eq 2
          test "$CAUSAL_STATE" = REOBSERVE
          test "$CAUSAL_PRODUCTIVE_EFFECT" = false
          [[ "$TRANSPORT_INTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TRANSPORT_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          test "$TRANSPORT_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/qikvrt_autonomous_exact_head_verify.yml@refs/heads/main"
          test "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TARGET_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TARGET_BASE_REF" = main

          jq -e '
            (.client_payload | keys) == ["causal","producer","repository","schema","subject","transport"] and
            (.client_payload.subject | keys) == ["base_ref","base_sha","head_ref","head_repository","head_sha","head_tree_sha","pull_request"] and
            (.client_payload.producer | keys) == ["run_attempt","run_id","workflow_id","workflow_path","workflow_sha"] and
            (.client_payload.causal | keys) == ["attempt","d0","productive_effect","state"] and
            (.client_payload.transport | keys) == ["attempt","intent_sha256","sequence"] and
            (.client_payload.transport.intent_sha256 | test("^[0-9a-f]{64}$")) and
            (.client_payload.transport.sequence | type) == "number" and
            .client_payload.transport.sequence > 0 and
            .client_payload.transport.attempt == 1 and
            .client_payload.causal.attempt == 1 and
            .client_payload.causal.d0 == 2 and
            .client_payload.causal.state == "REOBSERVE" and
            .client_payload.causal.productive_effect == false
          ' "$GITHUB_EVENT_PATH" >/dev/null
          for value in "$TARGET_SHA" "$TARGET_TREE_SHA" "$TARGET_BASE_SHA" "$PRODUCER_WORKFLOW_SHA" "$GITHUB_WORKFLOW_SHA"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          for value in "$TARGET_PR" "$PRODUCER_RUN_ID" "$PRODUCER_RUN_ATTEMPT" "$PRODUCER_WORKFLOW_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          [[ "$TARGET_REF" =~ ^[^[:space:]]+$ ]]
          test "$PRODUCER_WORKFLOW_PATH" = '.github/workflows/qikvrt_autonomous_pr_head_continuation.yml'

          verifier_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")"
          verifier_workflow_id="$(jq -r '.id' <<<"$verifier_workflow")"
          [[ "$verifier_workflow_id" =~ ^[1-9][0-9]*$ ]]
          jq -e '
            .path == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
            .state == "active"
          ' <<<"$verifier_workflow" >/dev/null
          verifier_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson workflow_id "$verifier_workflow_id" \
            --arg path '.github/workflows/qikvrt_autonomous_exact_head_verify.yml' \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg repository "$GITHUB_REPOSITORY" '
            .id == $run_id and .run_attempt == $run_attempt and
            .workflow_id == $workflow_id and (.path | split("@")[0]) == $path and
            .event == "repository_dispatch" and .head_branch == "main" and
            .head_sha == $workflow_sha and .repository.full_name == $repository
          ' <<<"$verifier_run" >/dev/null

          producer_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
          jq -e \
            --argjson workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg path "$PRODUCER_WORKFLOW_PATH" '
            .id == $workflow_id and .path == $path and .state == "active"
          ' <<<"$producer_workflow" >/dev/null
          # Bind the immutable producer attempt, not the mutable latest-attempt
          # view.  Once this exact repository_dispatch exists, its payload plus
          # the pre-dispatch intent proves server acceptance even if the runner
          # was cancelled before the POST command returned.
          producer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/attempts/${PRODUCER_RUN_ATTEMPT}")"
          jq -e \
            --argjson run_id "$PRODUCER_RUN_ID" \
            --argjson attempt "$PRODUCER_RUN_ATTEMPT" \
            --argjson workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg path "$PRODUCER_WORKFLOW_PATH" \
            --arg workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg pr "$TARGET_PR" --arg ref "$TARGET_REF" --arg head "$TARGET_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" '
            .id == $run_id and .run_attempt == $attempt and
            .workflow_id == $workflow_id and (.path | split("@")[0]) == $path and
            .repository.full_name == $repository and
            ((.event == "pull_request_target" and $workflow_sha == $base and
              .head_sha == $base and .head_branch == $base_ref and
              ([.pull_requests[]? | select(
                .number == ($pr|tonumber) and
                .head.repo.full_name == $repository and .head.ref == $ref and .head.sha == $head and
                .base.ref == $base_ref and .base.sha == $base
              )] | length) == 1) or
             ((.event == "workflow_run" or .event == "schedule" or .event == "workflow_dispatch") and
              .head_branch == "main" and .head_sha == $workflow_sha))
          ' <<<"$producer" >/dev/null

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/attempts/${PRODUCER_RUN_ATTEMPT}/jobs?filter=all&per_page=100" \
            > "$RUNNER_TEMP/binding-producer-job-pages.json"
          jq -e \
            --argjson run_id "$PRODUCER_RUN_ID" \
            --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" '
            length > 0 and
            ([.[].total_count] | unique | length) == 1 and
            (.[0].total_count | type == "number") and
            ([.[] | .jobs[]] | length) == .[0].total_count and
            ([.[] | .jobs[] | select(
              .name == "Preserve exact-head transport intent before dispatch" and
              .run_id == $run_id and .run_attempt == $run_attempt and
              .status == "completed" and .conclusion == "success"
            )] | length) == 1
          ' "$RUNNER_TEMP/binding-producer-job-pages.json" >/dev/null

          # The non-main FIFO is the durable pre-effect authority.  It seals the
          # request bytes, original artifact identity, and ordinal independently
          # of Actions artifact retention.  The event itself carries the exact
          # immutable FIFO locator; never infer its attempt from a newer ledger
          # state because attempt-one delivery may be delayed past attempt two.
          test -f "$RUNNER_TEMP/binding-outbox-next.json"
          python3 - "$RUNNER_TEMP/binding-outbox-next.json" \
            "$RUNNER_TEMP/binding-dispatch-request.json" "$TRANSPORT_ATTEMPT" <<'PY'
          import json
          import pathlib
          import sys

          from tools.qikvrt_ruleset_outbox import request_for_transport_attempt

          source, target, raw_attempt = sys.argv[1:]
          item = json.loads(pathlib.Path(source).read_text(encoding="utf-8"))
          request = request_for_transport_attempt(item["intent"], int(raw_attempt))
          pathlib.Path(target).write_text(
              json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          jq -e --slurpfile event "$GITHUB_EVENT_PATH" \
            --slurpfile request "$RUNNER_TEMP/binding-dispatch-request.json" \
            --arg producer_run_id "$PRODUCER_RUN_ID" --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg intent "$TRANSPORT_INTENT_SHA256" --arg sequence "$TRANSPORT_SEQUENCE" \
            --arg attempt "$TRANSPORT_ATTEMPT" '
            (.lookup_state == "PENDING" or .lookup_state == "TERMINAL") and
            .lane == "exact-head-dispatch" and
            .sequence == ($sequence|tonumber) and .fingerprint == $intent and
            .intent.payload.request.event_type == "qikvrt_autonomous_exact_head_verify" and
            $request[0].client_payload == $event[0].client_payload and
            .intent.payload.producer.run_id == ($producer_run_id|tonumber) and
            .intent.payload.producer.run_attempt == ($producer_run_attempt|tonumber) and
            .intent.payload.producer.workflow_id == ($producer_workflow_id|tonumber) and
            .intent.payload.producer.workflow_sha == $producer_workflow_sha and
            .intent.artifact.producer_run_id == ($producer_run_id|tonumber) and
            .intent.artifact.producer_run_attempt == ($producer_run_attempt|tonumber) and
            .intent.artifact.producer_workflow_id == ($producer_workflow_id|tonumber) and
            .transport[$attempt].state == "PRE_EFFECT_REOBSERVED" and
            (((.lookup_state == "PENDING") and
              (($attempt == "1" and (.acceptance | length) == 0) or
               ($attempt == "2" and
                (.acceptance | length) == 0))) or
             (.acceptance[$attempt].child.run_id == ($ENV.GITHUB_RUN_ID|tonumber) and
              .acceptance[$attempt].child.run_attempt == 1 and
              ($ENV.GITHUB_RUN_ATTEMPT|tonumber) == 2))
          ' "$RUNNER_TEMP/binding-outbox-next.json" >/dev/null
          producer_artifact_id="$(jq -r '.intent.artifact.id' "$RUNNER_TEMP/binding-outbox-next.json")"
          producer_artifact_digest="sha256:$(jq -r '.intent.artifact.archive_sha256' "$RUNNER_TEMP/binding-outbox-next.json")"
          outbox_acceptance_exists="$(jq -r --arg attempt "$TRANSPORT_ATTEMPT" \
            'if .acceptance[$attempt] == null then "false" else "true" end' \
            "$RUNNER_TEMP/binding-outbox-next.json")"
          [[ "$producer_artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$producer_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$outbox_acceptance_exists" =~ ^(true|false)$ ]]
          jq -n --slurpfile request "$RUNNER_TEMP/binding-dispatch-request.json" \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg producer_run_id "$PRODUCER_RUN_ID" --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" \
            --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" --arg causal_attempt "$CAUSAL_ATTEMPT" \
            --arg request_sha256 "$(sha256sum "$RUNNER_TEMP/binding-dispatch-request.json" | cut -d' ' -f1)" '
            {schema:"qikvrt.autonomous-exact-head-transport-intent.v1",repository:$repository,pull_request:($pr|tonumber),head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base,producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha},attempt:($causal_attempt|tonumber),request_sha256:$request_sha256,productive_effect:false,effect_ack:"NOT_REQUIRED"}
          ' > "$RUNNER_TEMP/binding-dispatch-intent.json"
          outbox_sequence="$TRANSPORT_SEQUENCE"
          outbox_fingerprint="$TRANSPORT_INTENT_SHA256"
          outbox_transport_attempt="$TRANSPORT_ATTEMPT"
          [[ "$outbox_sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$outbox_fingerprint" =~ ^[0-9a-f]{64}$ ]]

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" > "$RUNNER_TEMP/binding-pr.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" \
            --arg base_ref "$TARGET_BASE_REF" \
            --arg base "$TARGET_BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' "$RUNNER_TEMP/binding-pr.json" >/dev/null
          observed_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq '.tree.sha')"
          test "$observed_tree" = "$TARGET_TREE_SHA"

          binding_root="$RUNNER_TEMP/qikvrt-exact-head-binding"
          mkdir -p "$binding_root"
          # Seal the accepted event's exact producer request and intent into the
          # verifier-owned binding artifact.  Downstream observers can therefore
          # validate the immutable accepted transport after the producer artifact
          # expires or the transport-only source run is rerun.
          cp "$RUNNER_TEMP/binding-dispatch-request.json" "$binding_root/producer-request.json"
          cp "$RUNNER_TEMP/binding-dispatch-intent.json" "$binding_root/producer-intent.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$TARGET_PR" \
            --arg head_repository "$TARGET_HEAD_REPOSITORY" \
            --arg head_ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" \
            --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" \
            --arg base "$TARGET_BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" \
            --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg producer_artifact_id "$producer_artifact_id" \
            --arg producer_artifact_digest "$producer_artifact_digest" \
            --arg sealed_request_sha256 "$(sha256sum "$binding_root/producer-request.json" | cut -d' ' -f1)" \
            --arg sealed_intent_sha256 "$(sha256sum "$binding_root/producer-intent.json" | cut -d' ' -f1)" \
            --arg causal_attempt "$CAUSAL_ATTEMPT" --arg outbox_fingerprint "$outbox_fingerprint" \
            --arg outbox_sequence "$outbox_sequence" --arg outbox_attempt "$outbox_transport_attempt" '
            {
              schema:"qikvrt.autonomous-exact-head-dispatch-binding.v1",
              repository:$repository,
              pull_request:($pr|tonumber),
              head_repository:$head_repository,
              head_ref:$head_ref,
              head_sha:$head,
              head_tree_sha:$tree,
              base_ref:$base_ref,
              base_sha:$base,
              run_id:($run_id|tonumber),
              run_attempt:($run_attempt|tonumber),
              workflow_ref:$workflow_ref,
              workflow_sha:$workflow_sha,
              producer:{
                run_id:($producer_run_id|tonumber),
                run_attempt:($producer_run_attempt|tonumber),
                workflow_id:($producer_workflow_id|tonumber),
                workflow_path:$producer_workflow_path,
                workflow_sha:$producer_workflow_sha,
                continuation_artifact:{
                  id:($producer_artifact_id|tonumber),
                  digest:$producer_artifact_digest
                },
                sealed_transport:{
                  request_file:"producer-request.json",
                  request_sha256:$sealed_request_sha256,
                  intent_file:"producer-intent.json",
                  intent_sha256:$sealed_intent_sha256
                }
              },
              causal:{attempt:($causal_attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false},
              transport:{intent_sha256:$outbox_fingerprint,sequence:($outbox_sequence|tonumber),attempt:($outbox_attempt|tonumber)},
              classification:"TRUSTED_DISPATCH_BINDING_ONLY",
              trusted_terminal_verification:false,
              productive_effect:false
            }
          ' > "$binding_root/binding.json"
          echo "producer_artifact_id=$producer_artifact_id" >> "$GITHUB_OUTPUT"
          echo "producer_artifact_digest=$producer_artifact_digest" >> "$GITHUB_OUTPUT"
          echo "verifier_workflow_id=$verifier_workflow_id" >> "$GITHUB_OUTPUT"
          echo "binding_run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "outbox_sequence=$outbox_sequence" >> "$GITHUB_OUTPUT"
          echo "outbox_fingerprint=$outbox_fingerprint" >> "$GITHUB_OUTPUT"
          echo "outbox_transport_attempt=$outbox_transport_attempt" >> "$GITHUB_OUTPUT"
          echo "outbox_acceptance_exists=$outbox_acceptance_exists" >> "$GITHUB_OUTPUT"

      - name: Preserve exact trusted dispatch binding
        id: binding_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-head-binding-${{ github.event.client_payload.subject.pull_request }}-${{ github.event.client_payload.subject.head_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-head-binding

  accept-exact-head-outbox-transport:
    name: Persist exact verifier transport acceptance locator
    needs: bind-dispatch
    if: needs.bind-dispatch.result == 'success'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-exact-head-dispatch
      cancel-in-progress: false
      queue: max
    env:
      OUTBOX_SEQUENCE: ${{ needs.bind-dispatch.outputs.outbox_sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.bind-dispatch.outputs.outbox_fingerprint }}
      OUTBOX_TRANSPORT_ATTEMPT: ${{ needs.bind-dispatch.outputs.outbox_transport_attempt }}
      OUTBOX_ACCEPTANCE_EXISTS: ${{ needs.bind-dispatch.outputs.outbox_acceptance_exists }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-exact-head-dispatch
    steps:
      - name: Check out exact trusted verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Rebind exact source run without ledger credentials
        id: acceptance_input
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-outbox-acceptance"
          mkdir -p "$root"
          [[ "$OUTBOX_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$OUTBOX_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          test "$OUTBOX_TRANSPORT_ATTEMPT" = 1
          [[ "$OUTBOX_ACCEPTANCE_EXISTS" =~ ^(true|false)$ ]]
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          verifier_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")"
          verifier_workflow_id="$(jq -r '.id' <<<"$verifier_workflow")"
          verifier_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e --argjson run_id "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson workflow_id "$verifier_workflow_id" --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $run_id and .run_attempt == $attempt and .workflow_id == $workflow_id and
            (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
            .event == "repository_dispatch" and .repository.full_name == $repository and
            .head_branch == "main" and .head_sha == $workflow_sha and
            (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")
          ' <<<"$verifier_run" >/dev/null
          # The read-only Binder already proved any immutable acceptance for
          # this exact run/transport.  A same-run rerun must not rewrite it.
          if test "$OUTBOX_ACCEPTANCE_EXISTS" = true; then
            echo "write_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_id "$verifier_workflow_id" --arg repository "$GITHUB_REPOSITORY" \
            --arg head_sha "$GITHUB_WORKFLOW_SHA" --arg status "$(jq -r '.status' <<<"$verifier_run")" \
            --arg title "$(jq -r '.display_title' <<<"$verifier_run")" '
            {run_id:($run_id|tonumber),run_attempt:($run_attempt|tonumber),workflow_id:($workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_exact_head_verify.yml",event:"repository_dispatch",repository:$repository,head_sha:$head_sha,status:$status,display_title:$title}
          ' > "$root/child.json"
          echo "write_required=true" >> "$GITHUB_OUTPUT"

      - name: Append exact source-run acceptance CAS only
        if: steps.acceptance_input.outputs.write_required == 'true'
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          root="$RUNNER_TEMP/qikvrt-exact-head-outbox-acceptance"
          test -f "$root/child.json"
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" --receipt "$root/acceptance.json" \
            accept --lane exact-head-dispatch --sequence "$OUTBOX_SEQUENCE" \
            --attempt "$OUTBOX_TRANSPORT_ATTEMPT" --child "$root/child.json" >/dev/null
          unset writer_token

  verify-candidate:
    name: Candidate self-check (read-only)
    needs: bind-dispatch
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}
    env:
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_HEAD_REPOSITORY: ${{ github.event.client_payload.subject.head_repository }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      PRODUCER_RUN_ID: ${{ github.event.client_payload.producer.run_id }}
      PRODUCER_RUN_ATTEMPT: ${{ github.event.client_payload.producer.run_attempt }}
      PRODUCER_WORKFLOW_ID: ${{ github.event.client_payload.producer.workflow_id }}
      PRODUCER_WORKFLOW_PATH: ${{ github.event.client_payload.producer.workflow_path }}
      PRODUCER_WORKFLOW_SHA: ${{ github.event.client_payload.producer.workflow_sha }}
      BINDING_ARTIFACT_ID: ${{ needs.bind-dispatch.outputs.artifact_id }}
      BINDING_ARTIFACT_DIGEST: ${{ needs.bind-dispatch.outputs.artifact_digest }}
      BINDING_RUN_ATTEMPT: ${{ needs.bind-dispatch.outputs.binding_run_attempt }}
    steps:
      - name: Validate exact dispatch subject without write authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = repository_dispatch
          test "$DISPATCH_ACTION" = qikvrt_autonomous_exact_head_verify
          test "$DISPATCH_SCHEMA" = qikvrt_autonomous_exact_head_verify_dispatch_v1
          test "$CAUSAL_ATTEMPT" = 1
          test "$CAUSAL_D0" -eq 2
          test "$CAUSAL_STATE" = REOBSERVE
          test "$CAUSAL_PRODUCTIVE_EFFECT" = false
          test "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TARGET_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TARGET_BASE_REF" = main
          [[ "$BINDING_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BINDING_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          for value in "$TARGET_SHA" "$TARGET_TREE_SHA" "$TARGET_BASE_SHA" "$PRODUCER_WORKFLOW_SHA"; do
            test "${#value}" -eq 40
            case "$value" in *[!0-9a-f]*) exit 1 ;; esac
          done
          for value in "$TARGET_PR" "$PRODUCER_RUN_ID" "$PRODUCER_RUN_ATTEMPT" "$PRODUCER_WORKFLOW_ID"; do
            test "$value" -gt 0
          done
          test "$PRODUCER_WORKFLOW_PATH" = '.github/workflows/qikvrt_autonomous_pr_head_continuation.yml'

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" > "$RUNNER_TEMP/exact-pr.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" \
            --arg base_ref "$TARGET_BASE_REF" \
            --arg base "$TARGET_BASE_SHA" \
            '.state == "open" and .head.repo.full_name == $repository and .head.ref == $ref and .head.sha == $head and .base.ref == $base_ref and .base.sha == $base' \
            "$RUNNER_TEMP/exact-pr.json" >/dev/null
          observed_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq '.tree.sha')"
          test "$observed_tree" = "$TARGET_TREE_SHA"

          # The repository_dispatch already binds an immutable transport
          # attempt. A later producer rerun cannot revoke this read-only check.
          producer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/attempts/${PRODUCER_RUN_ATTEMPT}")"
          jq -e \
            --argjson attempt "$PRODUCER_RUN_ATTEMPT" \
            --argjson workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg path "$PRODUCER_WORKFLOW_PATH" \
            --arg workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg pr "$TARGET_PR" --arg ref "$TARGET_REF" --arg head "$TARGET_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.run_attempt == $attempt and .workflow_id == $workflow_id and (.path | split("@")[0]) == $path and
             .repository.full_name == $repository and
             ((.event == "pull_request_target" and $workflow_sha == $base and
               .head_sha == $base and .head_branch == $base_ref and
               ([.pull_requests[]? | select(.number == ($pr|tonumber) and .head.repo.full_name == $repository and .head.ref == $ref and .head.sha == $head and .base.ref == $base_ref and .base.sha == $base)] | length) == 1) or
              ((.event == "workflow_run" or .event == "schedule" or .event == "workflow_dispatch") and .head_branch == "main" and .head_sha == $workflow_sha))' \
            <<<"$producer" >/dev/null

          receipt_root="$RUNNER_TEMP/qikvrt-exact-head-candidate-receipt"
          mkdir -p "$receipt_root"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg action "$DISPATCH_ACTION" \
            --arg pr "$TARGET_PR" \
            --arg head_repository "$TARGET_HEAD_REPOSITORY" \
            --arg head_ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" \
            --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" \
            --arg base "$TARGET_BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" \
            --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            '{schema:"qikvrt.autonomous-candidate-self-check-subject.v1",repository:$repository,event:$event,event_action:$action,pull_request:($pr|tonumber),head_repository:$head_repository,head_ref:$head_ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base,run_id:($run_id|tonumber),run_attempt:($run_attempt|tonumber),workflow_ref:$workflow_ref,workflow_sha:$workflow_sha,producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha},classification:"CANDIDATE_SELF_CHECK_ONLY",trusted_terminal_verification:false,productive_effect:false}' \
            > "$receipt_root/subject.json"

      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.client_payload.subject.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Execute candidate-owned self-checks without write authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$TARGET_SHA"
          test "$(git rev-parse --verify HEAD^{tree})" = "$TARGET_TREE_SHA"
          git merge-base --is-ancestor "$TARGET_BASE_SHA" HEAD
          python3 -B tools/qikvrt_publication_overview.py check
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest -v \
            tests.test_qikvrt_publication_overview \
            tests.test_qikvrt_autonomous_self_heal
          make test

      - name: Set up Lean for QCE when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          test: false

      - name: Install QCE document inspection tools
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Re-execute QCE finite formal model when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        working-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
        shell: bash
        run: |
          set -euo pipefail
          qce_tmpdir="$(mktemp -d "${RUNNER_TEMP}/qikvrt-qce-exact-head.XXXXXX")"
          cleanup_qce_tmpdir() {
            rm -rf -- "$qce_tmpdir"
          }
          trap cleanup_qce_tmpdir EXIT HUP INT TERM
          lake build
          python3 -B verify_qce_package.py \
            --lean "$(command -v lean)" \
            --axiom-output "$qce_tmpdir/qce-autonomous-axiom-output.txt" \
            > "$qce_tmpdir/qce-autonomous-verification.json"
          test -s "$qce_tmpdir/qce-autonomous-axiom-output.txt"
          test -s "$qce_tmpdir/qce-autonomous-verification.json"

      - name: Preserve untrusted candidate self-check subject
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-head-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: ${{ runner.temp }}/qikvrt-exact-head-candidate-receipt/subject.json

  validate-candidate-observation:
    name: Validate candidate observation without write authority
    needs: [bind-dispatch, verify-candidate]
    if: always() && needs.bind-dispatch.result == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      state: ${{ steps.result.outputs.state }}
      artifact_id: ${{ steps.result.outputs.artifact_id }}
      artifact_digest: ${{ steps.result.outputs.artifact_digest }}
      identity_outcome: ${{ steps.result.outputs.identity_outcome }}
      download_outcome: ${{ steps.result.outputs.download_outcome }}
      receipt_outcome: ${{ steps.result.outputs.receipt_outcome }}
    env:
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_HEAD_REPOSITORY: ${{ github.event.client_payload.subject.head_repository }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      PRODUCER_RUN_ID: ${{ github.event.client_payload.producer.run_id }}
      PRODUCER_RUN_ATTEMPT: ${{ github.event.client_payload.producer.run_attempt }}
      PRODUCER_WORKFLOW_ID: ${{ github.event.client_payload.producer.workflow_id }}
      PRODUCER_WORKFLOW_PATH: ${{ github.event.client_payload.producer.workflow_path }}
      PRODUCER_WORKFLOW_SHA: ${{ github.event.client_payload.producer.workflow_sha }}
      ARTIFACT_ID: ${{ needs.verify-candidate.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.verify-candidate.outputs.artifact_digest }}
      CANDIDATE_RESULT: ${{ needs.verify-candidate.result }}
    steps:
      - name: Require exact candidate artifact identity without write token
        id: artifact_identity
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$|^[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          jq -e --argjson artifact_id "$ARTIFACT_ID" \
            --arg name "qikvrt-exact-head-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${ARTIFACT_DIGEST#sha256:}" --argjson run_id "$GITHUB_RUN_ID" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $artifact_id and .name == $name and .expired == false and .digest == $digest and
            .workflow_run.id == $run_id and .workflow_run.head_branch == "main" and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download exact candidate subject without write token
        id: download
        if: steps.artifact_identity.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify-candidate.outputs.artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-head-validated-candidate

      - name: Parse candidate receipt strictly as untrusted data
        id: receipt
        if: steps.download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/qikvrt-exact-head-validated-candidate/subject.json"
          test -f "$receipt"
          test ! -L "$receipt"
          test "$(find "$RUNNER_TEMP/qikvrt-exact-head-validated-candidate" -type f | wc -l)" -eq 1
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg head_repository "$TARGET_HEAD_REPOSITORY" --arg head_ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" --arg base_ref "$TARGET_BASE_REF" \
            --arg base "$TARGET_BASE_SHA" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" '
            .schema == "qikvrt.autonomous-candidate-self-check-subject.v1" and
            .repository == $repository and .event == "repository_dispatch" and
            .event_action == "qikvrt_autonomous_exact_head_verify" and
            .pull_request == ($pr|tonumber) and .head_repository == $head_repository and
            .head_ref == $head_ref and .head_sha == $head and .head_tree_sha == $tree and
            .base_ref == $base_ref and .base_sha == $base and
            .run_id == ($run_id|tonumber) and .run_attempt == ($run_attempt|tonumber) and
            .workflow_ref == $workflow_ref and .workflow_sha == $workflow_sha and
            .producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha} and
            .classification == "CANDIDATE_SELF_CHECK_ONLY" and
            .trusted_terminal_verification == false and .productive_effect == false
          ' "$receipt" >/dev/null

      - name: Seal validation result as scalar outputs
        id: result
        if: always()
        env:
          IDENTITY_OUTCOME: ${{ steps.artifact_identity.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state=error
          if [ "$CANDIDATE_RESULT" = success ] && \
             [ "$IDENTITY_OUTCOME" = success ] && \
             [ "$DOWNLOAD_OUTCOME" = success ] && \
             [ "$RECEIPT_OUTCOME" = success ]; then
            state=success
          fi
          {
            echo "state=$state"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "identity_outcome=${IDENTITY_OUTCOME:-skipped}"
            echo "download_outcome=${DOWNLOAD_OUTCOME:-skipped}"
            echo "receipt_outcome=${RECEIPT_OUTCOME:-skipped}"
          } >> "$GITHUB_OUTPUT"

  validate-publisher-observation:
    name: Read-only trusted-main publisher validation
    needs: [bind-dispatch, verify-candidate, validate-candidate-observation]
    if: always()
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      validation_state: ${{ steps.publisher_validation.outputs.state }}
      planned_state: ${{ steps.publish.outputs.state }}
      duplicate: ${{ steps.dedupe.outputs.duplicate }}
      prior_status_id: ${{ steps.dedupe.outputs.prior_status_id }}
      prior_publisher_artifact_id: ${{ steps.dedupe.outputs.prior_publisher_artifact_id }}
      prior_publisher_artifact_digest: ${{ steps.dedupe.outputs.prior_publisher_artifact_digest }}
      review_intent_artifact_id: ${{ steps.review_intent_evidence.outputs.artifact-id }}
      review_intent_artifact_digest: ${{ steps.review_intent_evidence.outputs.artifact-digest }}
    env:
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
      TARGET_PR: ${{ github.event.client_payload.subject.pull_request }}
      TARGET_HEAD_REPOSITORY: ${{ github.event.client_payload.subject.head_repository }}
      TARGET_REF: ${{ github.event.client_payload.subject.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.subject.head_sha }}
      TARGET_TREE_SHA: ${{ github.event.client_payload.subject.head_tree_sha }}
      TARGET_BASE_REF: ${{ github.event.client_payload.subject.base_ref }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.subject.base_sha }}
      PRODUCER_RUN_ID: ${{ github.event.client_payload.producer.run_id }}
      PRODUCER_RUN_ATTEMPT: ${{ github.event.client_payload.producer.run_attempt }}
      PRODUCER_WORKFLOW_ID: ${{ github.event.client_payload.producer.workflow_id }}
      PRODUCER_WORKFLOW_PATH: ${{ github.event.client_payload.producer.workflow_path }}
      PRODUCER_WORKFLOW_SHA: ${{ github.event.client_payload.producer.workflow_sha }}
      BINDING_RESULT: ${{ needs.bind-dispatch.result }}
      BINDING_ARTIFACT_ID: ${{ needs.bind-dispatch.outputs.artifact_id }}
      BINDING_ARTIFACT_DIGEST: ${{ needs.bind-dispatch.outputs.artifact_digest }}
      BINDING_RUN_ATTEMPT: ${{ needs.bind-dispatch.outputs.binding_run_attempt }}
      BOUND_PRODUCER_ARTIFACT_ID: ${{ needs.bind-dispatch.outputs.producer_artifact_id }}
      BOUND_PRODUCER_ARTIFACT_DIGEST: ${{ needs.bind-dispatch.outputs.producer_artifact_digest }}
      CANDIDATE_RESULT: ${{ needs.verify-candidate.result }}
      ARTIFACT_ID: ${{ needs.validate-candidate-observation.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.validate-candidate-observation.outputs.artifact_digest }}
      CANDIDATE_VALIDATION_STATE: ${{ needs.validate-candidate-observation.outputs.state }}
      ARTIFACT_IDENTITY_OUTCOME: ${{ needs.validate-candidate-observation.outputs.identity_outcome }}
      DOWNLOAD_OUTCOME: ${{ needs.validate-candidate-observation.outputs.download_outcome }}
      RECEIPT_OUTCOME: ${{ needs.validate-candidate-observation.outputs.receipt_outcome }}
    steps:
      - name: Require exact trusted binding artifact identity
        id: binding_artifact_identity
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BINDING_RESULT" = success
          [[ "$BINDING_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BINDING_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          binding_artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BINDING_ARTIFACT_ID}")"
          jq -e \
            --argjson artifact_id "$BINDING_ARTIFACT_ID" \
            --arg name "qikvrt-exact-head-binding-${TARGET_PR}-${TARGET_SHA}-run-${GITHUB_RUN_ID}-attempt-${BINDING_RUN_ATTEMPT}" \
            --arg digest "sha256:${BINDING_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $artifact_id and .name == $name and .expired == false and
            .digest == $digest and .workflow_run.id == $run_id and
            .workflow_run.head_branch == "main" and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$binding_artifact" >/dev/null

      - name: Download exact trusted dispatch binding
        id: binding_download
        if: steps.binding_artifact_identity.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.bind-dispatch.outputs.artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-head-binding-downloaded

      - name: Validate trusted dispatch binding receipt
        id: binding_receipt
        if: steps.binding_download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/qikvrt-exact-head-binding-downloaded/binding.json"
          sealed_request="$RUNNER_TEMP/qikvrt-exact-head-binding-downloaded/producer-request.json"
          sealed_intent="$RUNNER_TEMP/qikvrt-exact-head-binding-downloaded/producer-intent.json"
          test -f "$receipt"
          test ! -L "$receipt"
          test -f "$sealed_request"
          test -f "$sealed_intent"
          test ! -L "$sealed_request"
          test ! -L "$sealed_intent"
          test "$(find "$RUNNER_TEMP/qikvrt-exact-head-binding-downloaded" -type f | wc -l)" -eq 3
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$TARGET_PR" \
            --arg head_repository "$TARGET_HEAD_REPOSITORY" \
            --arg head_ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" \
            --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" \
            --arg base "$TARGET_BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg producer_run_id "$PRODUCER_RUN_ID" \
            --arg producer_run_attempt "$PRODUCER_RUN_ATTEMPT" \
            --arg producer_workflow_id "$PRODUCER_WORKFLOW_ID" \
            --arg producer_workflow_path "$PRODUCER_WORKFLOW_PATH" \
            --arg producer_workflow_sha "$PRODUCER_WORKFLOW_SHA" \
            --arg producer_artifact_id "$BOUND_PRODUCER_ARTIFACT_ID" \
            --arg producer_artifact_digest "$BOUND_PRODUCER_ARTIFACT_DIGEST" \
            --arg sealed_request_sha256 "$(sha256sum "$sealed_request" | cut -d' ' -f1)" \
            --arg sealed_intent_sha256 "$(sha256sum "$sealed_intent" | cut -d' ' -f1)" \
            --arg causal_attempt "$CAUSAL_ATTEMPT" --arg transport_intent "$TRANSPORT_INTENT_SHA256" \
            --arg transport_sequence "$TRANSPORT_SEQUENCE" --arg transport_attempt "$TRANSPORT_ATTEMPT" '
            (keys) == ["base_ref","base_sha","causal","classification","head_ref","head_repository","head_sha","head_tree_sha","producer","productive_effect","pull_request","repository","run_attempt","run_id","schema","transport","trusted_terminal_verification","workflow_ref","workflow_sha"] and
            (.producer | keys) == ["continuation_artifact","run_attempt","run_id","sealed_transport","workflow_id","workflow_path","workflow_sha"] and
            (.producer.continuation_artifact | keys) == ["digest","id"] and
            (.producer.sealed_transport | keys) == ["intent_file","intent_sha256","request_file","request_sha256"] and
            .schema == "qikvrt.autonomous-exact-head-dispatch-binding.v1" and
            .repository == $repository and .pull_request == ($pr|tonumber) and
            .head_repository == $head_repository and .head_ref == $head_ref and
            .head_sha == $head and .head_tree_sha == $tree and
            .base_ref == $base_ref and .base_sha == $base and
            .run_id == ($run_id|tonumber) and
            (.run_attempt | type) == "number" and .run_attempt > 0 and
            .run_attempt <= ($run_attempt|tonumber) and
            .workflow_ref == $workflow_ref and .workflow_sha == $workflow_sha and
            .producer.run_id == ($producer_run_id|tonumber) and
            .producer.run_attempt == ($producer_run_attempt|tonumber) and
            .producer.workflow_id == ($producer_workflow_id|tonumber) and
            .producer.workflow_path == $producer_workflow_path and
            .producer.workflow_sha == $producer_workflow_sha and
            .producer.continuation_artifact.id == ($producer_artifact_id|tonumber) and
            .producer.continuation_artifact.digest == $producer_artifact_digest and
            .producer.sealed_transport.request_file == "producer-request.json" and
            .producer.sealed_transport.intent_file == "producer-intent.json" and
            .producer.sealed_transport.request_sha256 == $sealed_request_sha256 and
            .producer.sealed_transport.intent_sha256 == $sealed_intent_sha256 and
            .causal == {attempt:($causal_attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false} and
            .transport == {intent_sha256:$transport_intent,sequence:($transport_sequence|tonumber),attempt:($transport_attempt|tonumber)} and
            .classification == "TRUSTED_DISPATCH_BINDING_ONLY" and
            .trusted_terminal_verification == false and .productive_effect == false
          ' "$receipt" >/dev/null
          jq -e --slurp '
            (.[0] | keys) == ["client_payload","event_type"] and
            .[0].event_type == "qikvrt_autonomous_exact_head_verify" and
            .[0].client_payload == .[1].client_payload
          ' "$sealed_request" "$GITHUB_EVENT_PATH" >/dev/null
          jq -e \
            --arg request_sha256 "$(sha256sum "$sealed_request" | cut -d' ' -f1)" \
            --arg causal_attempt "$CAUSAL_ATTEMPT" '
            .schema == "qikvrt.autonomous-exact-head-transport-intent.v1" and
            .attempt == ($causal_attempt|tonumber) and
            .request_sha256 == $request_sha256 and
            .productive_effect == false and .effect_ack == "NOT_REQUIRED"
          ' "$sealed_intent" >/dev/null

      - name: Reobserve trusted verifier run and exact live PR subject
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = repository_dispatch
          test "$DISPATCH_ACTION" = qikvrt_autonomous_exact_head_verify
          test "$DISPATCH_SCHEMA" = qikvrt_autonomous_exact_head_verify_dispatch_v1
          test "$CAUSAL_ATTEMPT" = 1
          test "$CAUSAL_D0" -eq 2
          test "$CAUSAL_STATE" = REOBSERVE
          test "$CAUSAL_PRODUCTIVE_EFFECT" = false
          test "$GITHUB_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/qikvrt_autonomous_exact_head_verify.yml@refs/heads/main"
          test "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TARGET_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TARGET_BASE_REF" = main

          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")"
          verifier_workflow_id="$(jq -r '.id' <<<"$workflow")"
          [[ "$verifier_workflow_id" =~ ^[1-9][0-9]*$ ]]
          jq -e '
            .path == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
            .state == "active"
          ' <<<"$workflow" >/dev/null
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson workflow_id "$verifier_workflow_id" \
            --arg path '.github/workflows/qikvrt_autonomous_exact_head_verify.yml' \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg repository "$GITHUB_REPOSITORY" '
            .id == $run_id and .run_attempt == $run_attempt and
            .workflow_id == $workflow_id and (.path | split("@")[0]) == $path and
            .event == "repository_dispatch" and .head_branch == "main" and
            .head_sha == $workflow_sha and .repository.full_name == $repository
          ' <<<"$run" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" > "$RUNNER_TEMP/exact-pr-publisher.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" \
            --arg base_ref "$TARGET_BASE_REF" \
            --arg base "$TARGET_BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' "$RUNNER_TEMP/exact-pr-publisher.json" >/dev/null
          observed_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TARGET_SHA}" --jq '.tree.sha')"
          test "$observed_tree" = "$TARGET_TREE_SHA"
          echo "verifier_workflow_id=$verifier_workflow_id" >> "$GITHUB_OUTPUT"
      - name: Detect an already published exact subject
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_WORKFLOW_ID: ${{ steps.subject.outputs.verifier_workflow_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'duplicate=false' >> "$GITHUB_OUTPUT"
          not_duplicate() { exit 0; }
          # Dedupe is an optimization for a newly successful observation only.
          # A current failure must always publish a newer error status and may
          # never inherit an earlier success for the same commit.
          [ "$CANDIDATE_VALIDATION_STATE" = success ] || not_duplicate
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100" \
            > "$RUNNER_TEMP/dedupe-status-pages.json"
          jq '[.[] | .[]]' "$RUNNER_TEMP/dedupe-status-pages.json" \
            > "$RUNNER_TEMP/dedupe-statuses.json"
          prior_status="$(jq -c \
            '[.[] | select(.context == "QIKVRT autonomous candidate self-check")] |
             sort_by(.id,.created_at) | last // empty' \
            "$RUNNER_TEMP/dedupe-statuses.json")"
          [ -n "$prior_status" ] || not_duplicate
          [ "$(jq -r '.state // ""' <<<"$prior_status")" = success ] || not_duplicate
          prior_target="$(jq -r '.target_url // ""' <<<"$prior_status")"
          case "$prior_target" in
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/"*) ;;
            *) not_duplicate ;;
          esac
          prior_run_id="${prior_target##*/}"
          [[ "$prior_run_id" =~ ^[1-9][0-9]*$ ]] || not_duplicate
          [ "$prior_run_id" != "$GITHUB_RUN_ID" ] || not_duplicate

          prior_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${prior_run_id}")"
          prior_attempt="$(jq -r '.run_attempt' <<<"$prior_run")"
          jq -e \
            --argjson workflow_id "$VERIFIER_WORKFLOW_ID" \
            --arg repository "$GITHUB_REPOSITORY" '
            .workflow_id == $workflow_id and
            (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
            .event == "repository_dispatch" and .head_branch == "main" and
            .repository.full_name == $repository and
            .status == "completed"
          ' <<<"$prior_run" >/dev/null || not_duplicate

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${prior_run_id}/jobs?filter=all&per_page=100" \
            > "$RUNNER_TEMP/dedupe-job-pages.json"
          jq -e --argjson publisher_attempt "$prior_attempt" '
            length > 0 and
            ([.[].total_count] | unique | length) == 1 and
            (.[0].total_count | type == "number") and
            ([.[] | .jobs[]] | length) == .[0].total_count and
            ([.[] | .jobs[] | select(
              .name == "Bind exact trusted dispatch subject" and
              .status == "completed" and .conclusion == "success"
            )] | length) >= 1 and
            ([.[] | .jobs[] | select(
              .name == "Read-only trusted-main publisher validation" and
              .run_attempt == $publisher_attempt and
              .status == "completed" and .conclusion == "success" and
              ([.steps[]? | select(
                .name == "Seal read-only publisher validation result" and
                .status == "completed" and .conclusion == "success"
              )] | length) == 1
            )] | length) == 1 and
            ([.[] | .jobs[] | select(
              .name == "Publish exact candidate status only" and
              .run_attempt == $publisher_attempt and
              .status == "completed" and .conclusion == "success" and
              ([.steps[]? | select(
                .name == "Reobserve exact subject and publish only the validated status" and
                .status == "completed" and .conclusion == "success"
              )] | length) == 1
            )] | length) == 1 and
            ([.[] | .jobs[] | select(
              .name == "Seal trusted-main publisher receipt" and
              .run_attempt == $publisher_attempt and
              .status == "completed" and .conclusion == "success" and
              ([.steps[]? | select(
                .name == "Preserve trusted publisher receipt" and
                .status == "completed" and .conclusion == "success"
              )] | length) == 1
            )] | length) == 1
          ' "$RUNNER_TEMP/dedupe-job-pages.json" >/dev/null || not_duplicate

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${prior_run_id}/artifacts?per_page=100" \
            > "$RUNNER_TEMP/dedupe-artifact-pages.json"
          jq -e '
            length > 0 and
            ([.[].total_count] | unique | length) == 1 and
            (.[0].total_count | type == "number") and
            ([.[] | .artifacts[]] | length) == .[0].total_count
          ' "$RUNNER_TEMP/dedupe-artifact-pages.json" >/dev/null || not_duplicate
          prior_artifact_name="qikvrt-exact-head-publisher-${prior_run_id}-${prior_attempt}"
          [ "$(jq --arg name "$prior_artifact_name" '[.[] | .artifacts[] | select(.name == $name and .expired == false)] | length' "$RUNNER_TEMP/dedupe-artifact-pages.json")" -eq 1 ] || not_duplicate
          prior_artifact="$(jq -c --arg name "$prior_artifact_name" '[.[] | .artifacts[] | select(.name == $name and .expired == false)][0]' "$RUNNER_TEMP/dedupe-artifact-pages.json")"
          prior_artifact_id="$(jq -r '.id' <<<"$prior_artifact")"
          prior_artifact_digest="$(jq -r '.digest // ""' <<<"$prior_artifact")"
          jq -e \
            --argjson run_id "$prior_run_id" \
            --arg workflow_sha "$(jq -r '.head_sha' <<<"$prior_run")" '
            .workflow_run.id == $run_id and .workflow_run.head_branch == "main" and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$prior_artifact" >/dev/null || not_duplicate
          prior_zip="$RUNNER_TEMP/dedupe-publisher.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${prior_artifact_id}/zip" > "$prior_zip"
          [ "$prior_artifact_digest" = "sha256:$(sha256sum "$prior_zip" | cut -d' ' -f1)" ] || not_duplicate
          [ "$(unzip -Z1 "$prior_zip" | wc -l)" -eq 1 ] || not_duplicate
          unzip -Z1 "$prior_zip" | grep -Fxq publisher.json || not_duplicate
          unzip -p "$prior_zip" publisher.json > "$RUNNER_TEMP/dedupe-publisher.json"
          prior_binding_id="$(jq -r '.dispatch_binding.artifact.id // ""' "$RUNNER_TEMP/dedupe-publisher.json")"
          prior_binding_digest="$(jq -r '.dispatch_binding.artifact.digest // ""' "$RUNNER_TEMP/dedupe-publisher.json")"
          prior_binding_attempt="$(jq -r '.dispatch_binding.run_attempt // ""' "$RUNNER_TEMP/dedupe-publisher.json")"
          [[ "$prior_binding_id" =~ ^[1-9][0-9]*$ ]] || not_duplicate
          [[ "$prior_binding_attempt" =~ ^[1-9][0-9]*$ ]] || not_duplicate
          [ "$prior_binding_attempt" -le "$prior_attempt" ] || not_duplicate
          [[ "$prior_binding_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || not_duplicate
          prior_binding_name="qikvrt-exact-head-binding-${TARGET_PR}-${TARGET_SHA}-run-${prior_run_id}-attempt-${prior_binding_attempt}"
          [ "$(jq --arg name "$prior_binding_name" --argjson id "$prior_binding_id" '[.[] | .artifacts[] | select(.name == $name and .id == $id and .expired == false)] | length' "$RUNNER_TEMP/dedupe-artifact-pages.json")" -eq 1 ] || not_duplicate
          prior_binding="$(jq -c --arg name "$prior_binding_name" --argjson id "$prior_binding_id" '[.[] | .artifacts[] | select(.name == $name and .id == $id and .expired == false)][0]' "$RUNNER_TEMP/dedupe-artifact-pages.json")"
          jq -e \
            --arg digest "$prior_binding_digest" \
            --argjson run_id "$prior_run_id" \
            --arg workflow_sha "$(jq -r '.head_sha' <<<"$prior_run")" '
            .digest == $digest and .workflow_run.id == $run_id and
            .workflow_run.head_branch == "main" and .workflow_run.head_sha == $workflow_sha
          ' <<<"$prior_binding" >/dev/null || not_duplicate
          jq -e --argjson binding_attempt "$prior_binding_attempt" '
            ([.[] | .jobs[] | select(
              .name == "Bind exact trusted dispatch subject" and
              .run_attempt == $binding_attempt and
              .status == "completed" and .conclusion == "success"
            )] | length) == 1
          ' "$RUNNER_TEMP/dedupe-job-pages.json" >/dev/null || not_duplicate
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$TARGET_PR" \
            --arg head_repository "$TARGET_HEAD_REPOSITORY" \
            --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" \
            --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" \
            --arg base "$TARGET_BASE_SHA" \
            --arg run_id "$prior_run_id" \
            --arg run_attempt "$prior_attempt" \
            --arg workflow_ref "${GITHUB_REPOSITORY}/.github/workflows/qikvrt_autonomous_exact_head_verify.yml@refs/heads/main" \
            --arg workflow_sha "$(jq -r '.head_sha' <<<"$prior_run")" \
            --arg binding_artifact_id "$prior_binding_id" \
            --arg binding_artifact_digest "$prior_binding_digest" \
            --arg binding_run_attempt "$prior_binding_attempt" \
            --arg prior_status_id "$(jq -r '.id' <<<"$prior_status")" '
            .schema == "qikvrt.autonomous-candidate-self-check-publisher.v2" and
            .repository == $repository and .pull_request == ($pr|tonumber) and
            .head_repository == $head_repository and .head_ref == $ref and
            .head_sha == $head and .head_tree_sha == $tree and
            .base_ref == $base_ref and .base_sha == $base and
            .run_id == ($run_id|tonumber) and
            (.run_attempt | type) == "number" and .run_attempt > 0 and
            .run_attempt <= ($run_attempt|tonumber) and
            .workflow_ref == $workflow_ref and .workflow_sha == $workflow_sha and
            .dispatch_binding.artifact.id == ($binding_artifact_id|tonumber) and
            .dispatch_binding.artifact.digest == $binding_artifact_digest and
            .dispatch_binding.run_attempt == ($binding_run_attempt|tonumber) and
            .dispatch_binding.receipt_outcome == "success" and
            .published_state == "success" and
            .status_id == ($prior_status_id|tonumber) and
            .status_context == "QIKVRT autonomous candidate self-check" and
            .classification == "CANDIDATE_SELF_CHECK_ONLY" and
            .trusted_terminal_verification == false and .productive_effect == false and
            .effect_ack == "NOT_REQUIRED" and
            (.producer.run_id | type) == "number" and .producer.run_id > 0 and
            (.producer.run_attempt | type) == "number" and .producer.run_attempt > 0 and
            (.producer.workflow_id | type) == "number" and .producer.workflow_id > 0 and
            .producer.workflow_path == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
            (.producer.workflow_sha | test("^[0-9a-f]{40}$")) and
            (.producer.continuation_artifact.id | type) == "number" and
            .producer.continuation_artifact.id > 0 and
            (.producer.continuation_artifact.digest | test("^sha256:[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/dedupe-publisher.json" >/dev/null || not_duplicate

          # Once the exact repository_dispatch was accepted, its immutable
          # original producer attempt and pre-POST intent remain authoritative.
          # A later producer rerun must neither revoke nor duplicate that effect.
          prior_binding_zip="$RUNNER_TEMP/dedupe-binding.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${prior_binding_id}/zip" \
            > "$prior_binding_zip" || not_duplicate
          [ "$prior_binding_digest" = "sha256:$(sha256sum "$prior_binding_zip" | cut -d' ' -f1)" ] || not_duplicate
          [ "$(unzip -Z1 "$prior_binding_zip" | wc -l)" -eq 3 ] || not_duplicate
          unzip -Z1 "$prior_binding_zip" | grep -Fxq binding.json || not_duplicate
          unzip -Z1 "$prior_binding_zip" | grep -Fxq producer-request.json || not_duplicate
          unzip -Z1 "$prior_binding_zip" | grep -Fxq producer-intent.json || not_duplicate
          unzip -p "$prior_binding_zip" binding.json > "$RUNNER_TEMP/dedupe-binding.json"
          unzip -p "$prior_binding_zip" producer-request.json > "$RUNNER_TEMP/dedupe-producer-request.json"
          unzip -p "$prior_binding_zip" producer-intent.json > "$RUNNER_TEMP/dedupe-producer-intent.json"

          prior_producer_id="$(jq -r '.producer.run_id' "$RUNNER_TEMP/dedupe-publisher.json")"
          prior_producer_attempt="$(jq -r '.producer.run_attempt' "$RUNNER_TEMP/dedupe-publisher.json")"
          prior_producer_workflow_id="$(jq -r '.producer.workflow_id' "$RUNNER_TEMP/dedupe-publisher.json")"
          prior_producer_workflow_sha="$(jq -r '.producer.workflow_sha' "$RUNNER_TEMP/dedupe-publisher.json")"
          prior_producer_artifact_id="$(jq -r '.producer.continuation_artifact.id' "$RUNNER_TEMP/dedupe-publisher.json")"
          prior_producer_artifact_digest="$(jq -r '.producer.continuation_artifact.digest' "$RUNNER_TEMP/dedupe-publisher.json")"
          prior_causal_attempt="$(jq -r '.causal.attempt // empty' "$RUNNER_TEMP/dedupe-binding.json")"
          test "$prior_causal_attempt" = 1 || not_duplicate
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$TARGET_PR" \
            --arg head_repository "$TARGET_HEAD_REPOSITORY" --arg ref "$TARGET_REF" \
            --arg head "$TARGET_SHA" --arg tree "$TARGET_TREE_SHA" \
            --arg base_ref "$TARGET_BASE_REF" --arg base "$TARGET_BASE_SHA" \
            --arg verifier_run_id "$prior_run_id" --arg verifier_run_attempt "$prior_attempt" \
            --arg binding_run_attempt "$prior_binding_attempt" \
            --arg workflow_ref "${GITHUB_REPOSITORY}/.github/workflows/qikvrt_autonomous_exact_head_verify.yml@refs/heads/main" \
            --arg workflow_sha "$(jq -r '.head_sha' <<<"$prior_run")" \
            --arg producer_run_id "$prior_producer_id" \
            --arg producer_run_attempt "$prior_producer_attempt" \
            --arg producer_workflow_id "$prior_producer_workflow_id" \
            --arg producer_workflow_sha "$prior_producer_workflow_sha" \
            --arg producer_artifact_id "$prior_producer_artifact_id" \
            --arg producer_artifact_digest "$prior_producer_artifact_digest" \
            --arg sealed_request_sha256 "$(sha256sum "$RUNNER_TEMP/dedupe-producer-request.json" | cut -d' ' -f1)" \
