name: QIK-VRT observe Zenodo corpus inventory v4 once

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/qikvrt_observe_zenodo_corpus_inventory_v4_once.yml

permissions:
  actions: read
  pull-requests: write

jobs:
  observe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EFFECT_BRANCH: execution/zenodo-corpus-inventory-20260728-v4
      EFFECT_WORKFLOW: QIK-VRT hardened authenticated Zenodo corpus proof inventory v4 once
    steps:
      - name: Query exact effect-branch workflow runs
        shell: bash
        run: |
          set -euo pipefail
          encoded_branch=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['EFFECT_BRANCH'], safe=''))
          PY
          )
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs?branch=$encoded_branch&per_page=30" \
            > runs.json
          python3 -B - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path('runs.json').read_text(encoding='utf-8'))
          runs = [
              run for run in value.get('workflow_runs', [])
              if run.get('name') == os.environ['EFFECT_WORKFLOW']
          ]
          if not runs:
              raise SystemExit('BLOCK: effect workflow run not found')
          run = runs[0]
          body = '\n'.join([
              '## Read-only Zenodo corpus inventory v4 observation',
              '',
              f"- run ID: `{run.get('id')}`",
              f"- run number: `{run.get('run_number')}`",
              f"- branch: `{run.get('head_branch')}`",
              f"- head SHA: `{run.get('head_sha')}`",
              f"- event: `{run.get('event')}`",
              f"- status: `{run.get('status')}`",
              f"- conclusion: `{run.get('conclusion')}`",
              f"- created_at: `{run.get('created_at')}`",
              f"- updated_at: `{run.get('updated_at')}`",
              '',
              'No Zenodo mutation is authorized by this observation.',
          ])
          pathlib.Path('comment.md').write_text(body + '\n', encoding='utf-8')
          print(body)
          PY
          gh pr comment '${{ github.event.pull_request.number }}' --body-file comment.md
