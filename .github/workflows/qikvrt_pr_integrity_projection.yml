name: QIKVRT PR integrity projection

on:
  push:
    branches:
      - feature/cloud-transputer-materialization-v1-b4b0038
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: qikvrt-pr-integrity-projection-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  project:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Bind exact subject
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'HEAD=%s\nTREE=%s\n' "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')"
      - name: Generate and verify deterministic integrity projection
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Preserve exact projection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-integrity-projection-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            REPOSITORY_FILE_MANIFEST.json
            REPOSITORY_FILE_MANIFEST.json.sha256
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Persist exact projection on same-repository PR head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "BLOCK: PR head advanced before integrity persistence" >&2
            echo "expected_head=$EXPECTED_HEAD" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Integrity projection is already current."
            exit 0
          fi
          git commit -m "ci: persist deterministic PR integrity projection"
          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after_commit" != "$EXPECTED_HEAD" ]; then
            echo "BLOCK: PR head advanced during integrity persistence" >&2
            exit 2
          fi
          git push origin "HEAD:refs/heads/$TARGET_REF"
