name: QIK-VRT one-shot autonomous generated-merge repair finalization

on:
  push:
    branches:
      - "fix/autonomous-generated-projection-merge-v1"
    paths:
      - ".github/workflows/qikvrt_autonomy_generated_merge_finalize_once.yml"

permissions:
  contents: write

concurrency:
  group: qikvrt-autonomy-generated-merge-finalize-${{ github.repository }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact repair precursor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "fix/autonomous-generated-projection-merge-v1"
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact bounded precursor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "049498434902e891007252d0b69e6130ee9c3150"
          actual="$(git diff --name-only HEAD^ HEAD)"
          test "$actual" = ".github/workflows/qikvrt_autonomy_generated_merge_finalize_once.yml"
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(
              Path('state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json').read_text(encoding='utf-8')
          )
          policy = contract['pull_request_continuation']['generated_merge_conflict_policy']
          assert policy['mode'] == 'ALLOWLIST_ONLY_REGENERATE_IMMEDIATELY'
          assert policy['non_allowlisted_conflict'] == 'BLOCK'
          assert policy['allowed_paths'] == [
              'REPOSITORY_FILE_MANIFEST.json',
              'REPOSITORY_FILE_MANIFEST.json.sha256',
              'SHA256SUMS.txt',
              'docs/publications/index.html',
              'docs/publications/index.json',
          ]
          PY

      - name: Remove one-shot locally and regenerate final-tree integrity
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/qikvrt_autonomy_generated_merge_finalize_once.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Run exact repair and full repository gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/test_qikvrt_autonomous_pr_continuation.py
          python3 -B -m unittest -v \
            tests.test_qikvrt_autonomous_pr_continuation \
            tests.test_qikvrt_autonomous_self_heal \
            tests.test_qikvrt_publication_overview
          python3 -B tools/qikvrt_publication_overview.py check
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Persist only final-tree integrity outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'REPOSITORY_FILE_MANIFEST.json' \
            'REPOSITORY_FILE_MANIFEST.json.sha256' \
            'SHA256SUMS.txt' | sort)"
          test "$actual" = "$expected"
          test "$(git status --porcelain=v1 | grep '^ D .github/workflows/qikvrt_autonomy_generated_merge_finalize_once.yml$' | wc -l)" -eq 1
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"
          git config user.name "qik-vrt-autonomy-generated-merge-finalizer"
          git config user.email "qik-vrt-autonomy-generated-merge-finalizer@users.noreply.github.com"
          git commit -m "chore(integrity): bind autonomous generated-merge repair"
          git push origin "HEAD:refs/heads/fix/autonomous-generated-projection-merge-v1"
