name: QIKVRT journal self audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  journal-self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded journal self-audit
        run: python3 -B tools/qikvrt_journal_self_audit.py --output journal-self-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qikvrt-journal-self-audit
          path: journal-self-audit.json
