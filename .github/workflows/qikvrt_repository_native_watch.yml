name: QIKVRT repository-native condition watch

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [synchronize, reopened, closed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional [QIKVRT WATCH] issue number to evaluate immediately"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

# All watch receipts share one writer lease. A scheduled observation and a
# simultaneous PR-head event must never race while mutating the same watch.
concurrency:
  group: qikvrt-repository-native-watch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Evaluate repository-native watch requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number || '' }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          DISPATCH_ISSUE: ${{ inputs.issue_number || '' }}
        shell: bash
        run: |
          set -euo pipefail

          root="${RUNNER_TEMP}/qikvrt-repository-native-watch"
          mkdir -p "$root/receipts"
          candidates="$root/candidates.txt"
          : > "$candidates"

          search_open_watches() {
            local output="$root/search.json"
            gh api --method GET /search/issues \
              -f q="repo:${REPOSITORY} is:issue is:open in:title \"[QIKVRT WATCH]\"" \
              -f per_page=100 > "$output"
            local total
            total="$(jq -r '.total_count' "$output")"
            [[ "$total" =~ ^[0-9]+$ ]]
            if [ "$total" -gt 100 ]; then
              echo "HOLD_UNVERIFIED: more than 100 active watch issues; narrow the registry before continuing" >&2
              exit 2
            fi
            jq -r '.items[] | select(.pull_request == null) | .number' "$output"
          }

          extract_spec() {
            local issue_json="$1"
            local spec_json="$2"
            python3 -B - "$issue_json" "$spec_json" <<'PY'
          import json,re,sys
          issue=json.load(open(sys.argv[1],encoding='utf-8'))
          body=issue.get('body') or ''
          match=re.search(r'<!-- qikvrt-repository-watch-v1\s*\n(.*?)\n-->',body,re.S)
          if not match:
              raise SystemExit(3)
          try:
              spec=json.loads(match.group(1))
          except json.JSONDecodeError as exc:
              raise SystemExit(f'invalid watch JSON: {exc}')
          expected={'schema','pr_number','baseline_head','run_id','trigger_on','close_on_trigger'}
          if not isinstance(spec,dict) or set(spec) != expected:
              raise SystemExit('watch spec must contain exactly '+','.join(sorted(expected)))
          if spec['schema'] != 'qikvrt.repository-watch.v1':
              raise SystemExit('unsupported watch schema')
          if not isinstance(spec['pr_number'],int) or isinstance(spec['pr_number'],bool) or spec['pr_number'] < 1:
              raise SystemExit('invalid pr_number')
          if not isinstance(spec['run_id'],int) or isinstance(spec['run_id'],bool) or spec['run_id'] < 1:
              raise SystemExit('invalid run_id')
          if not isinstance(spec['baseline_head'],str) or not re.fullmatch(r'[0-9a-f]{40}',spec['baseline_head']):
              raise SystemExit('invalid baseline_head')
          allowed={'RUN_TERMINAL','PR_HEAD_CHANGED'}
          triggers=spec['trigger_on']
          if not isinstance(triggers,list) or not triggers or any(item not in allowed for item in triggers) or len(set(triggers)) != len(triggers):
              raise SystemExit('invalid trigger_on')
          if not isinstance(spec['close_on_trigger'],bool):
              raise SystemExit('invalid close_on_trigger')
          data=json.dumps(spec,sort_keys=True,separators=(',',':'))+'\n'
          open(sys.argv[2],'w',encoding='utf-8').write(data)
          PY
          }

          spec_pr_number() {
            local issue_number="$1"
            local issue_json="$root/issue-${issue_number}.json"
            local spec_json="$root/spec-${issue_number}.json"
            gh api "repos/${REPOSITORY}/issues/${issue_number}" > "$issue_json"
            if [ "$(jq -r '.pull_request != null' "$issue_json")" = true ]; then
              return 1
            fi
            if [ "$(jq -r '.state' "$issue_json")" != open ]; then
              return 1
            fi
            case "$(jq -r '.title' "$issue_json")" in
              '[QIKVRT WATCH]'*) ;;
              *) return 1 ;;
            esac
            if ! extract_spec "$issue_json" "$spec_json"; then
              return 1
            fi
            jq -r '.pr_number' "$spec_json"
          }

          case "$EVENT_NAME" in
            issues)
              if [ -n "$EVENT_ISSUE" ]; then
                printf '%s\n' "$EVENT_ISSUE" >> "$candidates"
              fi
              ;;
            workflow_dispatch)
              if [ -n "$DISPATCH_ISSUE" ]; then
                [[ "$DISPATCH_ISSUE" =~ ^[1-9][0-9]*$ ]]
                printf '%s\n' "$DISPATCH_ISSUE" >> "$candidates"
              else
                search_open_watches >> "$candidates"
              fi
              ;;
            pull_request_target)
              [[ "$EVENT_PR" =~ ^[1-9][0-9]*$ ]]
              while IFS= read -r issue_number; do
                [ -n "$issue_number" ] || continue
                pr="$(spec_pr_number "$issue_number" || true)"
                if [ "$pr" = "$EVENT_PR" ]; then
                  printf '%s\n' "$issue_number" >> "$candidates"
                fi
              done < <(search_open_watches)
              ;;
            schedule)
              search_open_watches >> "$candidates"
              ;;
            *)
              echo "NOOP: unsupported event ${EVENT_NAME}"
              exit 0
              ;;
          esac

          sort -nu "$candidates" -o "$candidates"

          while IFS= read -r issue_number; do
            [ -n "$issue_number" ] || continue
            [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]

            issue_json="$root/issue-${issue_number}.json"
            spec_json="$root/spec-${issue_number}.json"
            gh api "repos/${REPOSITORY}/issues/${issue_number}" > "$issue_json"

            if [ "$(jq -r '.pull_request != null' "$issue_json")" = true ] || \
               [ "$(jq -r '.state' "$issue_json")" != open ]; then
              echo "NOOP: #${issue_number} is not an open watch issue"
              continue
            fi
            case "$(jq -r '.title' "$issue_json")" in
              '[QIKVRT WATCH]'*) ;;
              *) echo "NOOP: #${issue_number} is not a watch title"; continue ;;
            esac

            if ! extract_spec "$issue_json" "$spec_json"; then
              echo "HOLD_UNVERIFIED: malformed repository-native watch issue #${issue_number}" >&2
              exit 2
            fi

            pr="$(jq -r '.pr_number' "$spec_json")"
            baseline="$(jq -r '.baseline_head' "$spec_json")"
            run_id="$(jq -r '.run_id' "$spec_json")"
            close_on_trigger="$(jq -r '.close_on_trigger' "$spec_json")"
            trigger_terminal="$(jq -r '(.trigger_on | index("RUN_TERMINAL")) != null' "$spec_json")"
            trigger_head="$(jq -r '(.trigger_on | index("PR_HEAD_CHANGED")) != null' "$spec_json")"

            pr_json="$root/pr-${issue_number}.json"
            run_json="$root/run-${issue_number}.json"
            gh api "repos/${REPOSITORY}/pulls/${pr}" > "$pr_json"
            gh api "repos/${REPOSITORY}/actions/runs/${run_id}" > "$run_json"

            current_head="$(jq -r '.head.sha' "$pr_json")"
            current_tree="$(gh api "repos/${REPOSITORY}/git/commits/${current_head}" --jq '.tree.sha')"
            pr_state="$(jq -r '.state' "$pr_json")"
            run_head="$(jq -r '.head_sha' "$run_json")"
            run_status="$(jq -r '.status' "$run_json")"
            run_conclusion="$(jq -r '.conclusion // ""' "$run_json")"
            run_attempt="$(jq -r '.run_attempt // 1' "$run_json")"
            run_updated="$(jq -r '.updated_at // ""' "$run_json")"
            run_pr_count="$(jq --argjson pr "$pr" '[.pull_requests[] | select(.number == $pr)] | length' "$run_json")"
            run_pr_head="$(jq -r --argjson pr "$pr" '[.pull_requests[] | select(.number == $pr)][0].head.sha // ""' "$run_json")"

            [[ "$current_head" =~ ^[0-9a-f]{40}$ ]]
            [[ "$current_tree" =~ ^[0-9a-f]{40}$ ]]
            [[ "$run_head" =~ ^[0-9a-f]{40}$ ]]
            [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]

            if [ "$run_pr_count" -ne 1 ] || [ "$run_pr_head" != "$baseline" ] || [ "$run_head" != "$baseline" ]; then
              echo "HOLD_UNVERIFIED: run ${run_id} is not uniquely bound to PR #${pr} baseline ${baseline}" >&2
              exit 2
            fi

            head_changed=false
            run_terminal=false
            [ "$current_head" != "$baseline" ] && head_changed=true
            [ "$run_status" = completed ] && run_terminal=true

            fire=false
            if [ "$trigger_head" = true ] && [ "$head_changed" = true ]; then fire=true; fi
            if [ "$trigger_terminal" = true ] && [ "$run_terminal" = true ]; then fire=true; fi
            if [ "$fire" != true ]; then
              echo "WATCH_PENDING issue=${issue_number} pr=${pr} baseline=${baseline} run=${run_id} status=${run_status}"
              continue
            fi

            binding='EXACT_CURRENT_HEAD'
            predecessor=false
            if [ "$head_changed" = true ]; then
              binding='BASELINE_PREDECESSOR_ONLY'
              predecessor=true
            fi

            observed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            receipt_json="$root/receipts/watch-${issue_number}.json"
            jq -n \
              --arg schema 'qikvrt.repository-watch-receipt.v1' \
              --arg repository "$REPOSITORY" \
              --argjson watch_issue "$issue_number" \
              --argjson pr_number "$pr" \
              --arg baseline_head "$baseline" \
              --arg current_head "$current_head" \
              --arg current_tree "$current_tree" \
              --arg pr_state "$pr_state" \
              --argjson run_id "$run_id" \
              --arg run_head "$run_head" \
              --arg run_status "$run_status" \
              --arg run_conclusion "$run_conclusion" \
              --argjson run_attempt "$run_attempt" \
              --arg run_updated_at "$run_updated" \
              --arg observed_at "$observed_at" \
              --arg binding "$binding" \
              --argjson head_changed "$head_changed" \
              --argjson run_terminal "$run_terminal" \
              --argjson predecessor "$predecessor" \
              '{schema:$schema,repository:$repository,watch_issue:$watch_issue,pr_number:$pr_number,baseline_head:$baseline_head,current_head:$current_head,current_tree:$current_tree,pr_state:$pr_state,run_id:$run_id,run_head:$run_head,run_status:$run_status,run_conclusion:$run_conclusion,run_attempt:$run_attempt,run_updated_at:$run_updated_at,observed_at:$observed_at,binding:$binding,triggers:{pr_head_changed:$head_changed,run_terminal:$run_terminal},predecessor_evidence:$predecessor,predecessor_evidence_transfer:false,effect_ack_done:false}' \
              > "$receipt_json"

            receipt_id="$(sha256sum "$receipt_json" | awk '{print $1}')"
            body_file="$root/comment-${issue_number}.md"
            cat > "$body_file" <<EOF2
          <!-- qikvrt-repository-watch-receipt:${receipt_id} -->
          ## Repository-native watch transition

          - Watch issue: #${issue_number}
          - Pull request: #${pr}
          - Baseline Exact-Head: \`${baseline}\`
          - Current PR head: \`${current_head}\`
          - Current PR tree: \`${current_tree}\`
          - Workflow run: \`${run_id}\` attempt \`${run_attempt}\`
          - Run head: \`${run_head}\`
          - Run status/conclusion: \`${run_status}\` / \`${run_conclusion:-null}\`
          - Binding: **${binding}**
          - PR head changed: \`${head_changed}\`
          - Run terminal: \`${run_terminal}\`
          - Run event updated at: \`${run_updated:-unknown}\`
          - Repository observation time: \`${observed_at}\`

          \`PREDECESSOR_EVIDENCE_TRANSFER=false\`

          \`EFFECT_ACK_DONE=false\`

          This receipt reports only the watched repository transition. A successful workflow conclusion or any successful sub-step is not promoted to repository completion.
          EOF2

            existing="$(gh api --paginate "repos/${REPOSITORY}/issues/${issue_number}/comments?per_page=100" \
              --jq ".[] | select(.body | contains(\"<!-- qikvrt-repository-watch-receipt:${receipt_id} -->\")) | .id" \
              | tail -n 1)"
            if [ -z "$existing" ]; then
              comment_id="$(gh api --method POST "repos/${REPOSITORY}/issues/${issue_number}/comments" \
                --raw-field "body=$(cat "$body_file")" --jq '.id')"
            else
              comment_id="$existing"
            fi
            [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
            desired="$(cat "$body_file")"
            actual="$(gh api "repos/${REPOSITORY}/issues/comments/${comment_id}" --jq '.body')"
            [ "$actual" = "$desired" ] || {
              echo "BLOCK: watch receipt comment readback mismatch" >&2
              exit 2
            }

            if [ "$close_on_trigger" = true ]; then
              gh api --method PATCH "repos/${REPOSITORY}/issues/${issue_number}" -f state=closed >/dev/null
              [ "$(gh api "repos/${REPOSITORY}/issues/${issue_number}" --jq '.state')" = closed ] || {
                echo "BLOCK: watch issue close readback mismatch" >&2
                exit 2
              }
            fi

            echo "WATCH_TRIGGERED issue=${issue_number} pr=${pr} baseline=${baseline} current=${current_head} run=${run_id} binding=${binding}"
          done < "$candidates"

      - name: Preserve exact watch receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-repository-native-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-repository-native-watch/receipts
          if-no-files-found: ignore
          retention-days: 30
