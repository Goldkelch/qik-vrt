# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: QIKVRT exact PR 893 Authority rebind

on:
  push:
    branches:
      - ops/stale-writer-lease-drain-20260827
    paths:
      - .github/workflows/qikvrt_exact_stale_writer_lease_drain.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qikvrt-exact-pr-893-authority-rebind-20260827
  cancel-in-progress: false

jobs:
  rebind-test-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_BRANCH: feature/canonical-ai-firefox-current-main-20260827
      EXPECTED_TARGET_HEAD: 9a7ab2bf72f6fe871f1222deb2a0930cae107ce9
      EXPECTED_MAIN: 99f49faa63f68cff2d19af200bc75aeaf420ccad
    steps:
      - name: Check out exact PR 893 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_TARGET_HEAD }}
          fetch-depth: 0

      - name: Bind exact live target and Authority main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_TARGET_HEAD"
          live_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live_target" = "$EXPECTED_TARGET_HEAD"
          test "$live_main" = "$EXPECTED_MAIN"
          git rev-parse --verify HEAD^{tree} | tee /tmp/qikvrt-pr893-old-tree.txt
          git fetch --no-tags origin "$EXPECTED_MAIN"

      - name: Merge Authority and resolve only generated integrity projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qikvrt-repository-operations[bot]"
          git config user.email "qikvrt-repository-operations@users.noreply.github.com"
          git switch -c qikvrt-pr893-rebind "$EXPECTED_TARGET_HEAD"
          set +e
          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          merge_rc=$?
          set -e
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)
          expected=(
            REPOSITORY_FILE_MANIFEST.json
            REPOSITORY_FILE_MANIFEST.json.sha256
            SHA256SUMS.txt
          )
          if test "$merge_rc" -ne 0; then
            test "${#conflicts[@]}" -eq 3
            for index in 0 1 2; do
              test "${conflicts[$index]}" = "${expected[$index]}"
            done
            git checkout --ours -- "${expected[@]}"
            git add -- "${expected[@]}"
          else
            test "${#conflicts[@]}" -eq 0
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git rev-parse MERGE_HEAD)" = "$EXPECTED_MAIN"

      - name: Regenerate exact merged repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          git add \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git diff --check

      - name: Execute complete repository gates before persistence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 tools/qikvrt_integrity.py verify

      - name: Commit exact two-parent rebind and push by lease
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "chore(ai): rebind exact Firefox carrier to Authority 99f49faa" \
            -m "Preserve PR #893 history as first parent, take trusted review writer-head repair from current Authority as second parent, and regenerate only the global integrity projections. No predecessor-head evidence is transferred."
          new_head="$(git rev-parse --verify HEAD^{commit})"
          new_tree="$(git rev-parse --verify HEAD^{tree})"
          read -r commit parent_one parent_two extra < <(git rev-list --parents -n 1 HEAD)
          test "$commit" = "$new_head"
          test "$parent_one" = "$EXPECTED_TARGET_HEAD"
          test "$parent_two" = "$EXPECTED_MAIN"
          test -z "${extra:-}"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf '%s\n' "$new_head" | tee /tmp/qikvrt-pr893-rebound-head.txt
          printf '%s\n' "$new_tree" | tee /tmp/qikvrt-pr893-rebound-tree.txt

      - name: Preserve exact rebind receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-pr893-authority-rebind-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/qikvrt-pr893-old-tree.txt
            /tmp/qikvrt-pr893-rebound-head.txt
            /tmp/qikvrt-pr893-rebound-tree.txt
          if-no-files-found: warn
          retention-days: 30
