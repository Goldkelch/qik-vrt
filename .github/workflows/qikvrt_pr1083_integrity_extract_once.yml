name: QIKVRT PR1083 finite integrity repair
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  repair:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      github.event.pull_request.number == 1083 &&
      github.event.before == 'dd6ab130442aab71c162e6cbf4f7c56391c1e63a'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Generate, validate, and persist exact integrity repair
        shell: bash
        env:
          EXPECT_PREDECESSOR: dd6ab130442aab71c162e6cbf4f7c56391c1e63a
          TARGET_BRANCH: publication/bidirectional-virtual-time-channel-zenodo-v2
          SELF_PATH: .github/workflows/qikvrt_pr1083_integrity_extract_once.yml
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          test "$current" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$EXPECT_PREDECESSOR"
          test "${{ github.event.pull_request.head.ref }}" = "$TARGET_BRANCH"
          test -z "$(git status --porcelain)"

          rm -- "$SELF_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed
          printf '%s\n' \
            "$SELF_PATH" \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed

          make test
          python3 -B tools/qikvrt_integrity.py verify

          git config user.name 'qik-vrt publication repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "$SELF_PATH" REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git diff --cached --quiet && { echo 'BLOCK no productive integrity delta'; exit 1; }
          git commit -m 'fix(publication): persist PR1083 integrity projection'

          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$current"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
