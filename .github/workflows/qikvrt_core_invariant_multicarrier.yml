name: QIKVRT core invariant multi-carrier proof
on:
  push:
    branches:
      - feat/core-invariant-six-carrier-proof-v1
  pull_request:
    paths:
      - spec/effect_ack/CORE_INVARIANT_V1.md
      - conformance/effect_ack/core-invariant-v1/**
      - .github/workflows/qikvrt_core_invariant_multicarrier.yml
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cc -std=c90 -pedantic -Wall -Wextra -Werror conformance/effect_ack/core-invariant-v1/c90.c -o /tmp/core-c90
          /tmp/core-c90 | tee /tmp/c90.out
          test "$(wc -l < /tmp/c90.out)" -eq 16
