name: QIK-VRT PR356 IETF-02 archival warning repair

on:
  push:
    branches:
      - repair/pr356-ietf02-archival-warning-v1
    paths:
      - .github/workflows/qikvrt_pr356_ietf02_archival_warning_repair.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-pr356-ietf02-archival-warning-repair-v1
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_PARENT: 46a76988a252f588063bfdfc34008ead18e055d1
      TARGET_REF: repair/pr356-ietf02-archival-warning-v1
      SOURCE_SHA256: 4e9f274b575a1dbb1b1bf3e19fa3131e271f9de4e5eb981d96f9081204e719ab
      REPAIRED_SHA256: 6d46c3c839de6e60e234fa2095669ce7b590ed4d12f22fa583f6a1e7e2ef80e6
      REPAIRED_GIT_BLOB: ed9d3f81020bdbabdeb188d35372055b35102437
    steps:
      - name: Check out exact repair carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up exact renderer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          architecture: x64

      - name: Verify carrier ancestry and one-path delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD --)" = \
            ".github/workflows/qikvrt_pr356_ietf02_archival_warning_repair.yml"
          test "$(sha256sum tests/test_ietf_revision_02.py | awk '{print $1}')" = \
            "$SOURCE_SHA256"

      - name: Apply exact fail-closed archival warning repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          path = Path("tests/test_ietf_revision_02.py")
          source = path.read_text(encoding="utf-8")
          expected_source_sha256 = "4e9f274b575a1dbb1b1bf3e19fa3131e271f9de4e5eb981d96f9081204e719ab"
          if hashlib.sha256(source.encode("utf-8")).hexdigest() != expected_source_sha256:
              raise SystemExit("BLOCK: IETF revision-02 test source identity differs")

          anchor_1 = '''RENDER_REQUIREMENTS = ROOT / "runtime/toolchains/requirements-xml2rfc-3.34.0.txt"
          OLD_VECTOR_PATH = REVISION_02_ROOT / "test-vectors/effect-ack-v1"

          REVISION_02_IDENTITIES = {
          '''
          replacement_1 = '''RENDER_REQUIREMENTS = ROOT / "runtime/toolchains/requirements-xml2rfc-3.34.0.txt"
          OLD_VECTOR_PATH = REVISION_02_ROOT / "test-vectors/effect-ack-v1"
          REVISION_02_DOCUMENT_DATE = "2026-07-31"
          EXPECTED_ARCHIVAL_DATE_WARNING = re.compile(
              rf".*[/\\\\]{re.escape(REVISION_02_XML.name)}\\(\\d+\\): "
              rf"Warning: The document date \\({REVISION_02_DOCUMENT_DATE}\\) "
              r"is more than \\d+ days away from today's date$"
          )


          def is_expected_archival_date_warning(line: str) -> bool:
              """Accept only xml2rfc's clock-relative warning for the frozen -02 date."""
              return EXPECTED_ARCHIVAL_DATE_WARNING.fullmatch(line) is not None

          REVISION_02_IDENTITIES = {
          '''

          anchor_2 = '''    if warnings:
              raise AssertionError(
                  f"xml2rfc emitted warning/error diagnostics for {mode}:\\n"
                  + "\\n".join(warnings[-40:])
              )
              return completed
          '''
          replacement_2 = '''    unexpected_warnings = tuple(
                  line for line in warnings if not is_expected_archival_date_warning(line)
              )
              if unexpected_warnings:
                  raise AssertionError(
                      f"xml2rfc emitted unexpected warning/error diagnostics for {mode}:\\n"
                      + "\\n".join(unexpected_warnings[-40:])
                  )
              return completed
          '''

          anchor_3 = '''    def test_fresh_offline_renders_are_warning_free_and_byte_identical(self) -> None:
          '''
          replacement_3 = '''    def test_archival_date_warning_filter_is_exact(self) -> None:
                  expected = (
                      f"{REVISION_02_XML}(26): Warning: The document date "
                      f"({REVISION_02_DOCUMENT_DATE}) is more than 4 days away "
                      "from today's date"
                  )
                  self.assertTrue(is_expected_archival_date_warning(expected))
                  self.assertFalse(
                      is_expected_archival_date_warning(
                          expected.replace("Warning:", "Error:", 1)
                      )
                  )
                  self.assertFalse(
                      is_expected_archival_date_warning(
                          expected.replace(REVISION_02_XML.name, "draft-other.xml", 1)
                      )
                  )
                  self.assertFalse(
                      is_expected_archival_date_warning(
                          expected.replace(REVISION_02_DOCUMENT_DATE, "2026-08-01", 1)
                      )
                  )

              def test_fresh_offline_renders_are_warning_free_and_byte_identical(self) -> None:
          '''

          for anchor, replacement, label in (
              (anchor_1, replacement_1, "archival warning definition"),
              (anchor_2, replacement_2, "diagnostic filter"),
              (anchor_3, replacement_3, "negative-control test"),
          ):
              count = source.count(anchor)
              if count != 1:
                  raise SystemExit(f"BLOCK: {label} anchor count is {count}, expected 1")
              source = source.replace(anchor, replacement, 1)

          raw = source.encode("utf-8")
          expected_repaired_sha256 = "6d46c3c839de6e60e234fa2095669ce7b590ed4d12f22fa583f6a1e7e2ef80e6"
          observed = hashlib.sha256(raw).hexdigest()
          if observed != expected_repaired_sha256:
              raise SystemExit(
                  f"BLOCK: repaired IETF revision-02 test identity differs: {observed}"
              )
          path.write_bytes(raw)
          PY
          test "$(sha256sum tests/test_ietf_revision_02.py | awk '{print $1}')" = \
            "$REPAIRED_SHA256"
          test "$(git hash-object tests/test_ietf_revision_02.py)" = \
            "$REPAIRED_GIT_BLOB"
          python3 -m py_compile tests/test_ietf_revision_02.py

      - name: Derive exact renderer and execute repaired revision-02 test
        shell: bash
        env:
          QIKVRT_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          set -euo pipefail
          contract_cache="$RUNNER_TEMP/qikvrt-pr356-ietf02-runtime"
          sh tools/bootstrap-runtime.sh --install --accept-third-party \
            --profile ietf --cache-dir "$contract_cache"
          renderer="$contract_cache/xml2rfc/3.34.0/python-3.12.13/linux-amd64/venv/bin/xml2rfc"
          test -x "$renderer"
          "$QIKVRT_PYTHON" -B tests/test_ietf_revision_02.py --xml2rfc "$renderer"

      - name: Remove carrier and regenerate repository-native integrity
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qikvrt_pr356_ietf02_archival_warning_repair.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Persist exact repair without external effect
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head" = "$source_head"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_ietf_revision_02.py \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git add -u .github/workflows/qikvrt_pr356_ietf02_archival_warning_repair.yml
          git commit -m "test: bound frozen IETF-02 archival date warning"
          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head_after_commit" = "$source_head"
          git push origin "HEAD:$TARGET_REF"
