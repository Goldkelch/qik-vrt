name: QIKVRT PR 1048 integrity dispatch

on:
  push:
    branches: [control/pr1048-integrity-dispatch-v1]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: qikvrt-pr1048-integrity-dispatch-v1
  cancel-in-progress: false

jobs:
  dispatch-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      EXPECTED_PR: "1048"
      EXPECTED_HEAD: "c9899a5442c4f42b563bfb68c32b18870ed38fc6"
      EXPECTED_BASE: "b4b0038bcaa8788098ffa529bd5d5b651dd0459c"
      TARGET_REF: "fix/ruleset-authority-bootstrap-v1"
    steps:
      - name: Verify exact unchanged materialization subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}")"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .base.sha <<<"$pr")" = "$EXPECTED_BASE"
          test "$(jq -r .head.sha <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r .head.ref <<<"$pr")" = "$TARGET_REF"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_REF}" --jq .object.sha)" = "$EXPECTED_HEAD"
          echo "QIKVRT_PR1048_INTEGRITY_SUBJECT=VERIFIED"

      - name: Dispatch existing non-PR materializer writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_batch04_integrity.yml/dispatches" \
            -d "{\"ref\":\"${TARGET_REF}\"}")"
          printf 'QIKVRT_PR1048_MATERIALIZER_DISPATCH_HTTP=%s\n' "$code"
          cat /tmp/dispatch-response.txt || true
          test "$code" = 204
          echo "QIKVRT_PR1048_MATERIALIZER_DISPATCH=ACKNOWLEDGED"
