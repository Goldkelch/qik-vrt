name: QIKVRT journal permalink guard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  journal-permalink-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve published URLs and historical versions
        run: python3 -B tools/qikvrt_journal_url_guard.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
