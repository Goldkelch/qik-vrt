# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# Transport-only carrier. This workflow is never copied into the target candidate.
name: QIKVRT PR1084 exact integrity persistence once
on:
  push:
    branches: [materialize/pr1084-integrity-once]
    paths: [.github/workflows/qikvrt_pr1084_integrity_once.yml]
permissions:
  contents: write
concurrency:
  group: qikvrt-pr1084-integrity-once
  cancel-in-progress: false
jobs:
  persist:
    if: github.repository == 'Goldkelch/qik-vrt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 98c1606435967bfcd330f195d888a22424cb5c11
      TARGET_REF: publication/ietf-effect-extensions-20260913-v1
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Check out the exact target, not the transport carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 98c1606435967bfcd330f195d888a22424cb5c11
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate only the deterministic integrity projection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote" = "$EXPECTED_HEAD" || { echo 'HOLD: target moved; no retry or overwrite'; exit 2; }
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test > "$RUNNER_TEMP/pr1084-make-test.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/pr1084-make-test.log"; exit 1; }
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B - <<'PY'
          import subprocess
          allowed = {'REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt'}
          changed = set(subprocess.check_output(['git','diff','--name-only','-z']).decode().strip('\0').split('\0')) - {''}
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z'])
          if not changed or not changed <= allowed or untracked:
              raise SystemExit('HOLD: unexpected or empty persistence delta: ' + repr(changed))
          PY
      - name: Persist once with an unchanged-target guard and normal fast-forward
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote" = "$EXPECTED_HEAD" || { echo 'HOLD: target moved before persistence'; exit 2; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git commit -m 'chore(ietf): persist exact PR1084 deterministic integrity projection'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          successor="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote" = "$successor" || { echo 'HOLD: persistence readback differs'; exit 2; }
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          receipt = {
              'schema': 'qikvrt_exact_integrity_persistence_receipt_v1',
              'repository': 'Goldkelch/qik-vrt', 'pr': 1084,
              'source_head': os.environ['EXPECTED_HEAD'],
              'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
              'changed_paths': git('diff', '--name-only', 'HEAD^', 'HEAD').splitlines(),
              'run_id': os.environ['GITHUB_RUN_ID'], 'target_ref': os.environ['TARGET_REF'],
              'remote_ref_reobserved': True,
              'verification_scope': 'GENERATED_WORKTREE_ONLY_NEW_HEAD_REQUIRES_FRESH_P2',
              'P2_complete': False, 'predecessor_evidence_transfer': False,
              'native_review': False, 'promotion': False, 'external_submission': False,
              'completion_claims': {'PASS': False, 'FINAL_PASS': False, 'EFFECT_ACK_DONE': False}
          }
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'PR1084_INTEGRITY_PERSISTENCE.json'
          out.write_text(json.dumps(receipt, indent=2) + '\n')
          print(out.read_text())
          PY
      - name: Retain bounded persistence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1084-integrity-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/PR1084_INTEGRITY_PERSISTENCE.json
            ${{ runner.temp }}/pr1084-make-test.log
          if-no-files-found: warn
