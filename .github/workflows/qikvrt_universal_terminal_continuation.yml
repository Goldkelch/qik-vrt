name: QIKVRT universal terminal continuation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify universal continuation policy and selector
        run: |
          python3 -B tests/test_universal_terminal_continuation.py
          python3 -B tests/test_qikvrt_terminal_continuation_selector.py
      - name: Verify monitor-only stall classification
        run: |
          printf '%s\n' '{"context_bound":true,"authority_bound":true,"meaning_bound":true,"evidence_current":true,"next_action_uniquely_determined":true,"external_effect_required":false,"external_effect_authorized":false,"fixpoint_verified":false,"stale_binding":false,"ambiguous_next_action":false}' \
            | python3 tools/qikvrt_terminal_continuation.py \
            | grep '"decision": "CONTINUE"'
