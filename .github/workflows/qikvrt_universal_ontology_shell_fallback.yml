name: QIK-VRT universal ontology shell-only fallback

on:
  push:
    branches:
      - agent/universal-ontology-claim-closure-2026-08-06-v1
    paths:
      - ".github/workflows/qikvrt_universal_ontology_shell_fallback.yml"
      - "formalization/QIKVRT_Formalization_v2.0/**"
      - "state/work_units/UNIFIED_ONTOLOGY_KERNEL_PROGRAM_V2.json"
      - "state/work_units/WORLD_FORMULA_RELATION_KERNEL_V1.json"
      - "state/work_units/UNIFIED_ONTOLOGY_WORLD_FORMULA_CONSOLIDATION_V1.json"
      - "tests/test_universal_ontology_claim_closure.py"
      - "tests/test_unified_world_formula_consolidation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-universal-ontology-shell-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-shell-verification:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      LEAN_VERSION: "4.19.0"
      LEAN_ARCHIVE_URL: "https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst"
    steps:
      - name: Check out exact commit without marketplace actions
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cd "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual" = "$GITHUB_SHA"
          test "${#actual}" -eq 40
          test "${#tree}" -eq 40
          echo "head=$actual" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Install exact official Lean release without marketplace actions
        id: lean-acquisition
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-${LEAN_VERSION}-linux.tar.zst"
          install_root="$RUNNER_TEMP/lean-${LEAN_VERSION}"
          acquisition_receipt="$RUNNER_TEMP/lean-acquisition-receipt.json"
          write_acquisition_receipt() {
            disposition="$1"
            observed_sha256="$2"
            lean_version="$3"
            DISPOSITION="$disposition" OBSERVED_SHA256="$observed_sha256" \
              OBSERVED_LEAN_VERSION="$lean_version" ARCHIVE="$archive" \
              ACQUISITION_RECEIPT="$acquisition_receipt" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE"])
          value = {
              "schema": "QIKVRT_UNIVERSAL_ONTOLOGY_LEAN_ACQUISITION_RECEIPT_V1",
              "source_commit": os.environ["GITHUB_SHA"],
              "source_url": os.environ["LEAN_ARCHIVE_URL"],
              "required_lean_version": os.environ["LEAN_VERSION"],
              "archive_integrity_contract": "VERSION_CONTRACT_ONLY",
              "observed_archive_sha256": os.environ["OBSERVED_SHA256"],
              "archive_exists": archive.is_file(),
              "archive_bytes": archive.stat().st_size if archive.is_file() else 0,
              "observed_lean_version": os.environ["OBSERVED_LEAN_VERSION"],
              "attempts": 1,
              "retry_policy": "NONE",
              "disposition": os.environ["DISPOSITION"],
              "transport_ack": False,
              "pass": False,
              "final_pass": False,
              "effect_ack_done": False,
          }
          Path(os.environ["ACQUISITION_RECEIPT"]).write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          }
          if ! curl --fail --location --connect-timeout 20 --max-time 900 \
            --output "$archive" "$LEAN_ARCHIVE_URL"; then
            write_acquisition_receipt 'HOLD_LEAN_SINGLE_FETCH_FAILED' 'ABSENT' 'UNAVAILABLE'
            echo 'HOLD: LEAN_SINGLE_FETCH_FAILED' >&2
            exit 1
          fi
          observed_archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          if ! test "$(stat -c '%s' "$archive")" -gt 300000000; then
            write_acquisition_receipt 'BLOCK_LEAN_ARCHIVE_TOO_SMALL' "$observed_archive_sha256" 'UNAVAILABLE'
            echo 'BLOCK: LEAN_ARCHIVE_TOO_SMALL' >&2
            exit 1
          fi
          mkdir -p "$install_root"
          if ! tar --zstd -xf "$archive" -C "$install_root" --strip-components=1; then
            write_acquisition_receipt 'BLOCK_LEAN_ARCHIVE_EXTRACTION_FAILED' "$observed_archive_sha256" 'UNAVAILABLE'
            echo 'BLOCK: LEAN_ARCHIVE_EXTRACTION_FAILED' >&2
            exit 1
          fi
          if [ ! -x "$install_root/bin/lean" ] || [ ! -x "$install_root/bin/lake" ]; then
            write_acquisition_receipt 'BLOCK_LEAN_EXECUTABLES_MISSING' "$observed_archive_sha256" 'UNAVAILABLE'
            echo 'BLOCK: LEAN_EXECUTABLES_MISSING' >&2
            exit 1
          fi
          if ! lean_version="$("$install_root/bin/lean" --version 2>&1)"; then
            write_acquisition_receipt 'BLOCK_LEAN_VERSION_UNOBSERVABLE' "$observed_archive_sha256" 'UNAVAILABLE'
            echo 'BLOCK: LEAN_VERSION_UNOBSERVABLE' >&2
            exit 1
          fi
          if ! grep -F "version ${LEAN_VERSION}" <<< "$lean_version"; then
            write_acquisition_receipt 'BLOCK_LEAN_VERSION_MISMATCH' "$observed_archive_sha256" "$lean_version"
            echo 'BLOCK: LEAN_VERSION_MISMATCH' >&2
            exit 1
          fi
          write_acquisition_receipt 'LEAN_SINGLE_FETCH_VERSION_BOUND' "$observed_archive_sha256" "$lean_version"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Bind Lean and Lake versions
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee "$RUNNER_TEMP/lean-version.txt"
          lake --version | tee "$RUNNER_TEMP/lake-version.txt"
          grep -F "version ${LEAN_VERSION}" "$RUNNER_TEMP/lean-version.txt"

      - name: Verify source scope and claim boundaries
        working-directory: formalization/QIKVRT_Formalization_v2.0
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify_universal_ontology.py

      - name: Build exact consolidated Lean target
        working-directory: formalization/QIKVRT_Formalization_v2.0
        shell: bash
        run: |
          set -euo pipefail
          lake build QIKVRTUniversalOntology

      - name: Run complete combined axiom audit
        working-directory: formalization/QIKVRT_Formalization_v2.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build
          lake env lean QIKVRTUniversalOntology/AxiomAudit.lean \
            > .lake/build/universal-ontology-axioms.txt 2>&1
          cat .lake/build/universal-ontology-axioms.txt

      - name: Enforce repository-wide theorem dependency policies
        working-directory: formalization/QIKVRT_Formalization_v2.0
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/audit_lean_axioms.py

      - name: Run formalization boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            tests.test_universal_ontology_claim_closure \
            tests.test_unified_world_formula_consolidation
          python3 -B formalization/QIKVRT_Formalization_v2.0/tests/test_world_formula_relation_kernel.py

      - name: Create and validate exact-head execution receipt
        working-directory: formalization/QIKVRT_Formalization_v2.0
        shell: bash
        run: |
          set -euo pipefail
          output=".lake/build/UNIVERSAL_ONTOLOGY_KERNEL_RECEIPT.json"
          python3 -B scripts/make_universal_ontology_kernel_receipt.py \
            --lean "$(command -v lean)" \
            --axiom-output .lake/build/universal-ontology-axioms.txt \
            --output "$output" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "${{ steps.binding.outputs.head }}" \
            --tree "${{ steps.binding.outputs.tree }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 - "$output" "${{ steps.binding.outputs.head }}" "${{ steps.binding.outputs.tree }}" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          receipt = json.loads(path.read_text(encoding="utf-8"))
          assert receipt["source_commit"] == sys.argv[2]
          assert receipt["source_tree"] == sys.argv[3]
          assert receipt["theorem_count"] == 32
          assert receipt["project_axioms"] == []
          assert receipt["scope_boundary"]["physical_correspondence"] == "OPEN_CANDIDATE"
          assert receipt["completion_claims"] == {
              "PASS": False,
              "FINAL_PASS": False,
              "EFFECT_ACK_DONE": False,
          }
          print("EXACT_HEAD_RECEIPT_VALIDATED")
          PY
          sha256sum "$output"
          cat "$output"

      - name: Record non-effect boundary
        if: always()
        shell: bash
        run: |
          {
            echo "LEAN_VERIFICATION_WORKFLOW_ONLY=true"
            echo "GITHUB_MUTATION=NONE"
            echo "ZENODO_MUTATION=NONE"
            echo "IETF_MUTATION=NONE"
            echo "PASS_CLAIMED=false"
            echo "FINAL_PASS_CLAIMED=false"
            echo "EFFECT_ACK_DONE_CLAIMED=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload one-attempt acquisition receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-universal-ontology-shell-boundary-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lean-acquisition-receipt.json
            ${{ runner.temp }}/lean-version.txt
            ${{ runner.temp }}/lake-version.txt
          retention-days: 30
          if-no-files-found: warn
