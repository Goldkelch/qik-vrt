name: QIKVRT requested-review pending-queue repair bootstrap

on:
  push:
    branches:
      - repair/requested-review-pending-queue-v1

permissions:
  contents: write

concurrency:
  group: qikvrt-requested-review-pending-queue-repair-bootstrap
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/requested-review-pending-queue-v1
          fetch-depth: 0

      - name: Apply bounded queue repair and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          from pathlib import Path

          expression = '$' + '{{ github.repository }}'
          workflow = Path('.github/workflows/qikvrt_requested_review_executor.yml')
          text = workflow.read_text(encoding='utf-8')
          old = (
              'concurrency:\n'
              f'  group: qikvrt-requested-review-executor-{expression}\n'
              '  cancel-in-progress: false\n'
          )
          new = old + '  queue: max\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'EXPECTED_EXACT_CONCURRENCY_BLOCK_ONCE_GOT_{count}')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('tests/test_qikvrt_requested_review_pending_queue.py').write_text(
              '''# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0\n'''
              '''# Copyright 2026 Ingolf Lohmann.\n'''
              '''import unittest\n'''
              '''from pathlib import Path\n\n\n'''
              '''WORKFLOW = Path(".github/workflows/qikvrt_requested_review_executor.yml")\n\n\n'''
              '''class RequestedReviewPendingQueueTests(unittest.TestCase):\n'''
              '''    def test_preserves_pending_exact_head_runs(self):\n'''
              '''        text = WORKFLOW.read_text(encoding="utf-8")\n'''
              '''        expression = "$" + "{{ github.repository }}"\n'''
              '''        block = (\n'''
              '''            "concurrency:\\n"\n'''
              '''            f"  group: qikvrt-requested-review-executor-{expression}\\n"\n'''
              '''            "  cancel-in-progress: false\\n"\n'''
              '''            "  queue: max\\n"\n'''
              '''        )\n'''
              '''        self.assertEqual(text.count(block), 1)\n'''
              '''        obsolete = (\n'''
              '''            f"group: qikvrt-requested-review-executor-{expression}\\n"\n'''
              '''            "  cancel-in-progress: false\\n\\n"\n'''
              '''        )\n'''
              '''        self.assertNotIn(obsolete, text)\n\n\n'''
              '''if __name__ == "__main__":\n'''
              '''    unittest.main()\n''',
              encoding='utf-8',
          )

          record = {
              'schema': 'qikvrt_requested_review_pending_queue_repair_v1',
              'repository': 'Goldkelch/qik-vrt',
              'trusted_main_sha': '4ad95275d30dbefffba6691fae1ebf6901267296',
              'trusted_main_tree_sha': 'b1e34c7fc5faa9f2a4559fcf672eac091cb8300a',
              'observed_pr': 941,
              'observed_head_sha': '7da32f3d985e2d86de9e704f6e22b3db39709853',
              'observed_tree_sha': 'f79999f0173a0d70cf0a87a9fa8eb35f15e1bfbd',
              'cancelled_exact_run_id': 33612709644,
              'displacing_workflow_run_id': 33612725719,
              'first_blocker': 'GLOBAL_SINGLE_PENDING_SLOT_REPLACED_EXACT_HEAD_RUN',
              'correction': {
                  'concurrency_group_unchanged': True,
                  'cancel_in_progress': False,
                  'queue': 'max',
                  'single_writer_execution_preserved': True,
                  'pending_capacity': 100,
              },
              'boundaries': {
                  'candidate_branch_mutation': False,
                  'approval': False,
                  'merge': False,
                  'publication': False,
                  'PASS': False,
                  'FINAL_PASS': False,
                  'EFFECT_ACK_DONE': False,
              },
          }
          Path('state/work_units/QIKVRT_REQUESTED_REVIEW_PENDING_QUEUE_REPAIR_V1.json').write_text(
              json.dumps(record, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          rm .github/workflows/qikvrt_requested_review_pending_queue_bootstrap.yml
          git diff --check
          python3 -B -m unittest -v tests.test_qikvrt_requested_review_pending_queue

      - name: Materialize exact repair commit without moving a ref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo 'QIKVRT_MESH_TOKEN_UNAVAILABLE'
            exit 1
          }
          python3 -B - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          base = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          base_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()

          def gh(method, path, payload):
              command = ['gh', 'api', '--method', method, path, '--input', '-']
              completed = subprocess.run(
                  command,
                  input=json.dumps(payload, separators=(',', ':')),
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if completed.returncode:
                  raise SystemExit(
                      f'GitHub API {method} {path} failed: '
                      f'{completed.stderr.strip()[:500]}'
                  )
              return json.loads(completed.stdout)

          def create_blob(path):
              payload = Path(path).read_bytes()
              return gh('POST', f'repos/{repo}/git/blobs', {
                  'content': base64.b64encode(payload).decode('ascii'),
                  'encoding': 'base64',
              })['sha']

          entries = []
          for path in (
              '.github/workflows/qikvrt_requested_review_executor.yml',
              'state/work_units/QIKVRT_REQUESTED_REVIEW_PENDING_QUEUE_REPAIR_V1.json',
              'tests/test_qikvrt_requested_review_pending_queue.py',
          ):
              entries.append({
                  'path': path,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': create_blob(path),
              })
          entries.append({
              'path': '.github/workflows/qikvrt_requested_review_pending_queue_bootstrap.yml',
              'mode': '100644',
              'type': 'blob',
              'sha': None,
          })
          tree_response = gh('POST', f'repos/{repo}/git/trees', {
              'base_tree': base_tree,
              'tree': entries,
          })
          tree = tree_response['sha']
          created = gh('POST', f'repos/{repo}/git/commits', {
              'message': 'fix(review): preserve queued exact-head observations',
              'tree': tree,
              'parents': [base],
          })
          commit = created['sha']
          if created.get('tree', {}).get('sha') != tree:
              raise SystemExit('REPAIR_COMMIT_MUTATION_RESPONSE_TREE_MISMATCH')
          print(json.dumps({
              'schema': 'qikvrt_requested_review_pending_queue_git_object_v1',
              'base_commit': base,
              'base_tree': base_tree,
              'repair_commit': commit,
              'repair_tree': tree,
              'ref_updated': False,
              'completion_claims': {
                  'PASS': False,
                  'FINAL_PASS': False,
                  'EFFECT_ACK_DONE': False,
                  'MERGE': False,
              },
          }, sort_keys=True))
          print(f'QIKVRT_REPAIR_COMMIT={commit}')
          print(f'QIKVRT_REPAIR_TREE={tree}')
          PY
