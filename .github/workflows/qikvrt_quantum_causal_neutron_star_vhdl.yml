name: QIKVRT quantum-causal neutron-star VHDL contract

on:
  pull_request:
    paths:
      - "state/fixpoints/TICK_RECEIPT_COMPILER_V1.yaml"
      - "schemas/qikvrt_tick_receipt_v1.schema.json"
      - "state/fixpoints/QIKVRT_QUANTUM_CAUSAL_NEUTRON_STAR_EVIDENCE_FIXPOINT_SET_V1.json"
      - "hardware/vhdl/**"
      - "tools/qikvrt_quantum_causal_neutron_star_fixpoint.py"
      - "tests/test_qikvrt_quantum_causal_neutron_star_fixpoint.py"
      - "docs/terminal/quantum-causal-neutron-star/**"
      - "state/work_units/QUANTUM_CAUSAL_NEUTRON_STAR_INSIDE_OUT_V1.json"
      - ".github/workflows/qikvrt_quantum_causal_neutron_star_vhdl.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-inside-out:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bind exact head and tree
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          test "$head" = "$EXACT_HEAD"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
      - name: Validate inside-out contract and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qikvrt-quantum-causal-neutron-star
          python3 -B tools/qikvrt_quantum_causal_neutron_star_fixpoint.py validate | tee qikvrt-quantum-causal-neutron-star/validation.json
          python3 -B -m unittest -v tests.test_qikvrt_quantum_causal_neutron_star_fixpoint
      - name: Analyze and execute VHDL when toolchain is present
        shell: bash
        run: |
          set -euo pipefail
          receipt=qikvrt-quantum-causal-neutron-star/vhdl-toolchain.json
          if command -v ghdl >/dev/null 2>&1; then
            ghdl -a --std=08 hardware/vhdl/qikvrt_metatransistor_pkg.vhd
            ghdl -a --std=08 hardware/vhdl/qikvrt_metatransistor.vhd
            ghdl -a --std=08 hardware/vhdl/qikvrt_neutron_star_mesh.vhd
            ghdl -a --std=08 hardware/vhdl/tb_qikvrt_metatransistor.vhd
            ghdl -e --std=08 tb_qikvrt_metatransistor
            ghdl -r --std=08 tb_qikvrt_metatransistor
            printf '%s\n' '{"schema":"qikvrt.vhdl-toolchain-observation.v1","analysis":"OBSERVED_SUCCESS","testbench":"OBSERVED_SUCCESS","synthesis":"NOT_CLAIMED"}' > "$receipt"
          else
            printf '%s\n' '{"schema":"qikvrt.vhdl-toolchain-observation.v1","analysis":"NOT_AVAILABLE","testbench":"NOT_EXECUTED","synthesis":"NOT_CLAIMED"}' > "$receipt"
          fi
          cat "$receipt"
      - name: Reobserve immutable exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = '${{ steps.bind.outputs.head }}'
          test "$(git rev-parse --verify HEAD^{tree})" = '${{ steps.bind.outputs.tree }}'
          test -z "$(git status --porcelain)"
      - name: Preserve exact-head evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-quantum-causal-neutron-star-${{ steps.bind.outputs.head }}
          path: qikvrt-quantum-causal-neutron-star
          retention-days: 30
          if-no-files-found: error
