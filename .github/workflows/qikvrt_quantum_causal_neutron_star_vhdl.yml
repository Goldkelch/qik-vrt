name: QIKVRT quantum-causal neutron-star VHDL contract

on:
  pull_request:
    paths:
      - "state/fixpoints/TICK_RECEIPT_COMPILER_V1.yaml"
      - "schemas/qikvrt_tick_receipt_v1.schema.json"
      - "state/fixpoints/QIKVRT_QUANTUM_CAUSAL_NEUTRON_STAR_EVIDENCE_FIXPOINT_SET_V1.json"
      - "hardware/vhdl/**"
      - "tools/qikvrt_quantum_causal_neutron_star_fixpoint.py"
      - "tests/test_qikvrt_quantum_causal_neutron_star_fixpoint.py"
      - "docs/terminal/quantum-causal-neutron-star/**"
      - "state/work_units/QUANTUM_CAUSAL_NEUTRON_STAR_INSIDE_OUT_V1.json"
      - ".github/workflows/qikvrt_quantum_causal_neutron_star_vhdl.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-inside-out:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_ROOT: /tmp/qikvrt-quantum-causal-neutron-star
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bind exact head and tree
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          test "$head" = "$EXACT_HEAD"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
      - name: Validate inside-out contract and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          python3 -B tools/qikvrt_quantum_causal_neutron_star_fixpoint.py validate \
            | tee "$EVIDENCE_ROOT/validation.json"
          python3 -B -m unittest -v \
            tests.test_qikvrt_quantum_causal_neutron_star_fixpoint
      - name: Provision and bind VHDL analyzer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          command -v jq | tee "$EVIDENCE_ROOT/jq-package.txt"
          jq --version | tee -a "$EVIDENCE_ROOT/jq-package.txt"
          provision_attempts=0
          last_apt_update_exit_code=null
          write_provision_receipt() {
            local state="$1" blocker="$2" workflow_exit_code="$3"
            jq -n \
              --arg state "$state" \
              --arg blocker "$blocker" \
              --arg run "$GITHUB_RUN_ID" \
              --argjson attempts "$provision_attempts" \
              --argjson apt_update_last_exit_code "$last_apt_update_exit_code" \
              --argjson workflow_exit_code "$workflow_exit_code" \
              '{
                schema:"qikvrt_ghdl_provision_receipt_v1",
                state:$state,
                first_blocker:(if $blocker == "" then null else $blocker end),
                workflow_run_id:($run|tonumber),
                apt_update_attempts:$attempts,
                apt_update_last_exit_code:$apt_update_last_exit_code,
                workflow_exit_code:$workflow_exit_code,
                retry_policy:{delays_seconds:[0,15,45],apt_acquire_retries:3},
                external_effect:false,
                completion_claims:{PASS:false,FINAL_PASS:false,EFFECT_ACK_DONE:false}
              }' > "$EVIDENCE_ROOT/ghdl-provision-receipt.json"
          }
          provision_error_trap() {
            local status=$?
            trap - ERR
            write_provision_receipt HOLD GHDL_PROVISION_EXECUTION_FAILED "$status"
            exit "$status"
          }
          trap provision_error_trap ERR
          write_provision_receipt PENDING GHDL_PROVISION_PENDING 0
          if ! command -v ghdl >/dev/null 2>&1; then
            apt_updated=false
            for delay in 0 15 45; do
              if [ "$delay" -gt 0 ]; then
                sleep "$delay"
              fi
              provision_attempts=$((provision_attempts + 1))
              update_log="$EVIDENCE_ROOT/apt-update-attempt-${provision_attempts}.log"
              if sudo apt-get update -o Acquire::Retries=3 > "$update_log" 2>&1; then
                apt_updated=true
                last_apt_update_exit_code=0
                break
              else
                last_apt_update_exit_code=$?
              fi
              # Clear only the ephemeral partial APT index bytes before the
              # bounded next attempt; evidence and candidate state remain.
              sudo rm -rf /var/lib/apt/lists/partial
              sudo install -d -m 0755 /var/lib/apt/lists/partial
            done
            if [ "$apt_updated" != true ]; then
              write_provision_receipt HOLD GHDL_APT_UPDATE_UNCONFIRMED 2
              cat "$EVIDENCE_ROOT"/apt-update-attempt-*.log >&2 || true
              exit 2
            fi
            candidate="$(apt-cache policy ghdl | awk '/Candidate:/ {print $2}')"
            test -n "$candidate"
            test "$candidate" != '(none)'
            printf 'APT_CANDIDATE=%s\n' "$candidate" \
              | tee "$EVIDENCE_ROOT/ghdl-package.txt"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              --no-install-recommends "ghdl=$candidate"
          fi
          command -v ghdl | tee -a "$EVIDENCE_ROOT/ghdl-package.txt"
          dpkg-query -W -f='INSTALLED_PACKAGE=${Package}=${Version}\n' ghdl \
            | tee -a "$EVIDENCE_ROOT/ghdl-package.txt"
          ghdl --version | tee "$EVIDENCE_ROOT/ghdl-version.txt"
          write_provision_receipt CURRENT "" 0
          trap - ERR
      - name: Analyze elaborate and execute VHDL
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/qikvrt-ghdl-work"
          mkdir -p "$work" "$EVIDENCE_ROOT"
          pushd "$work" >/dev/null
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/qikvrt_metatransistor_pkg.vhd"
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/qikvrt_metatransistor.vhd"
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/qikvrt_neutron_star_mesh.vhd"
          ghdl -a --std=08 "$GITHUB_WORKSPACE/hardware/vhdl/tb_qikvrt_metatransistor.vhd"
          ghdl -e --std=08 tb_qikvrt_metatransistor
          ghdl -r --std=08 tb_qikvrt_metatransistor
          popd >/dev/null
          cat > "$EVIDENCE_ROOT/vhdl-toolchain.json" <<'JSON'
          {
            "analysis": "OBSERVED_SUCCESS",
            "elaboration": "OBSERVED_SUCCESS",
            "schema": "qikvrt.vhdl-toolchain-observation.v1",
            "synthesis": "NOT_CLAIMED",
            "testbench": "OBSERVED_SUCCESS"
          }
          JSON
          cat "$EVIDENCE_ROOT/vhdl-toolchain.json"
      - name: Reobserve immutable exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = '${{ steps.bind.outputs.head }}'
          test "$(git rev-parse --verify HEAD^{tree})" = '${{ steps.bind.outputs.tree }}'
          git status --porcelain=v1 --untracked-files=all \
            | tee "$EVIDENCE_ROOT/worktree-status.txt"
          test ! -s "$EVIDENCE_ROOT/worktree-status.txt"
      - name: Preserve exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-quantum-causal-neutron-star-${{ steps.bind.outputs.head || env.EXACT_HEAD }}
          path: ${{ env.EVIDENCE_ROOT }}
          retention-days: 30
          if-no-files-found: error
