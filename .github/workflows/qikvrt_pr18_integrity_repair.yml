# Legacy stable workflow identity retained; behavior is generalized to exact same-repository PR integrity repair.
name: QIKVRT PR18 integrity repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: qikvrt-repository-evidence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_PR: ${{ github.event.pull_request.number }}
      TARGET_REF: ${{ github.head_ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bind exact same-repository pull-request writer subject
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_HEAD"
          test -n "$TARGET_PR"
          test -n "$TARGET_REF"
          test "${#TARGET_BASE_SHA}" -eq 40
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$source_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request head differs before integrity repair" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi

      - name: Regenerate and verify exact-subject repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify

      - name: Run writer contract and complete repository gates before persistence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v tests.test_qikvrt_repository_writer_lease
          make test
          python3 tools/qikvrt_integrity.py verify

      - name: Commit only the deterministic integrity trio with exact-head CAS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_HEAD"
          remote_head_before_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_before_commit" != "$source_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request head advanced before integrity persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_before_commit=$remote_head_before_commit" >&2
            exit 2
          fi

          while IFS= read -r path; do
            case "$path" in
              REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt) ;;
              *)
                echo "BLOCK: non-integrity tracked delta present before pull-request persistence: $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff --name-only)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt

          if git diff --cached --quiet; then
            echo "Pull-request integrity projection is already current."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt) ;;
              *)
                echo "BLOCK: non-integrity path staged for pull-request persistence: $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff --cached --name-only)

          git commit -m "fix(integrity): persist exact pull-request projection"
          committed_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request head advanced during local integrity commit" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_after_commit=$remote_head_after_commit" >&2
            exit 2
          fi

          git push origin "HEAD:refs/heads/$TARGET_REF"
          persisted_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$persisted_head" != "$committed_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request integrity persistence readback mismatch" >&2
            echo "committed_head=$committed_head" >&2
            echo "persisted_head=$persisted_head" >&2
            exit 2
          fi

          # A GITHUB_TOKEN-authored PR-head update does not provide a reliable
          # recursive pull_request/workflow_run wakeup. repository_dispatch is
          # GitHub's recursion-safe carrier, so expose exactly one D0=2
          # REOBSERVE edge only after the new remote head has been read back.
          reobserved_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$reobserved_head" != "$persisted_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request head drifted before exact-head continuation" >&2
            echo "persisted_head=$persisted_head" >&2
            echo "reobserved_head=$reobserved_head" >&2
            exit 2
          fi

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$TARGET_PR" \
            --arg ref "$TARGET_REF" \
            --arg head "$persisted_head" \
            --arg base "$TARGET_BASE_SHA" \
            --arg source_run "$GITHUB_RUN_ID" \
            '{event_type:"qikvrt_autonomous_exact_head_verify",client_payload:{repository:$repository,pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,base_sha:$base,d0:2,causal_state:"REOBSERVE",source_run_id:($source_run|tonumber),reason:"INTEGRITY_SUCCESSOR_REOBSERVE"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

          echo "persisted_head=$persisted_head" >> "$GITHUB_STEP_SUMMARY"
          echo "continuation=D0_2_REOBSERVE" >> "$GITHUB_STEP_SUMMARY"
