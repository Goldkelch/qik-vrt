# Legacy stable workflow identity retained; behavior is generalized to exact same-repository PR integrity repair.
name: QIKVRT PR18 integrity repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: write
  contents: write

concurrency:
  group: qikvrt-repository-evidence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_PR: ${{ github.event.pull_request.number }}
      TARGET_REF: ${{ github.head_ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bind exact same-repository pull-request writer subject
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_HEAD"
          test -n "$TARGET_PR"
          test -n "$TARGET_REF"
          test "${#TARGET_BASE_SHA}" -eq 40
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$source_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request head differs before integrity repair" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi

      - name: Regenerate and verify exact-subject repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify

      - name: Run writer contract and complete repository gates before persistence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v tests.test_qikvrt_repository_writer_lease
          make test
          python3 tools/qikvrt_integrity.py verify

      - name: Commit only the deterministic integrity trio with exact-head CAS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_HEAD"
          remote_head_before_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_before_commit" != "$source_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request head advanced before integrity persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_before_commit=$remote_head_before_commit" >&2
            exit 2
          fi

          while IFS= read -r path; do
            case "$path" in
              REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt) ;;
              *)
                echo "BLOCK: non-integrity tracked delta present before pull-request persistence: $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff --name-only)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt

          if git diff --cached --quiet; then
            echo "Pull-request integrity projection is already current."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt) ;;
              *)
                echo "BLOCK: non-integrity path staged for pull-request persistence: $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff --cached --name-only)

          git commit -m "fix(integrity): persist exact pull-request projection"
          committed_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request head advanced during local integrity commit" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_after_commit=$remote_head_after_commit" >&2
            exit 2
          fi

          git push origin "HEAD:refs/heads/$TARGET_REF"
          persisted_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$persisted_head" != "$committed_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request integrity persistence readback mismatch" >&2
            echo "committed_head=$committed_head" >&2
            echo "persisted_head=$persisted_head" >&2
            exit 2
          fi

          # GITHUB_TOKEN-authored PR-head updates suppress the ordinary recursive
          # pull_request wakeup. Dispatch the exact workflow on the repaired PR
          # branch itself, rather than repository_dispatch (which loads the
          # workflow definition from default-branch main).
          reobserved_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$reobserved_head" != "$persisted_head" ]; then
            echo "HOLD_UNVERIFIED: pull-request head drifted before exact-head continuation" >&2
            echo "persisted_head=$persisted_head" >&2
            echo "reobserved_head=$reobserved_head" >&2
            exit 2
          fi

          qikvrt_dispatch_after_primary_reset() {
            local output error reset now delay
            output="$(mktemp)"
            error="$(mktemp)"
            if gh api "$@" >"$output" 2>"$error"; then
              cat "$output"
              rm -f "$output" "$error"
              return 0
            fi
            if ! grep -Fq "API rate limit exceeded for installation." "$error"; then
              cat "$error" >&2
              rm -f "$output" "$error"
              return 1
            fi
            reset="$(gh api rate_limit --jq '.resources.core.reset' 2>>"$error")" || {
              cat "$error" >&2
              rm -f "$output" "$error"
              return 1
            }
            case "$reset" in
              ''|*[!0-9]*)
                cat "$error" >&2
                rm -f "$output" "$error"
                return 1
                ;;
            esac
            now="$(date +%s)"
            delay=$((reset - now + 5))
            if [ "$delay" -lt 1 ]; then delay=1; fi
            if [ "$delay" -gt 3700 ]; then
              echo "BLOCK: exact-head workflow dispatch reset exceeds bounded wait: ${delay}s" >&2
              rm -f "$output" "$error"
              return 1
            fi
            echo "QIKVRT_EXACT_HEAD_DISPATCH_RATE_LIMIT_RESET_WAIT_SECONDS=$delay" >&2
            sleep "$delay"
            : > "$output"
            : > "$error"
            if gh api "$@" >"$output" 2>"$error"; then
              cat "$output"
              rm -f "$output" "$error"
              return 0
            fi
            cat "$error" >&2
            rm -f "$output" "$error"
            return 1
          }

          qikvrt_dispatch_after_primary_reset --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml/dispatches" \
            -f "ref=$TARGET_REF" \
            -f "inputs[pr]=$TARGET_PR" \
            -f "inputs[head_ref]=$TARGET_REF" \
            -f "inputs[head_sha]=$persisted_head" \
            -f "inputs[base_sha]=$TARGET_BASE_SHA"

          echo "persisted_head=$persisted_head" >> "$GITHUB_STEP_SUMMARY"
          echo "continuation=EXACT_BRANCH_WORKFLOW_DISPATCH" >> "$GITHUB_STEP_SUMMARY"
