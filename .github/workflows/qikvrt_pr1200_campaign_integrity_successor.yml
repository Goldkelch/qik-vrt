name: QIKVRT PR1200 campaign integrity successor

on:
  push:
    branches:
      - benchmark/mesh-scenario-campaign-v1
    paths:
      - .github/workflows/qikvrt_pr1200_campaign_integrity_successor.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-pr1200-campaign-integrity-successor
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PREDECESSOR: 8a4695d6d44978e901016f451f546b949a93758c
      EXPECTED_BASE: cffab05dd0286aff9943d7b0d992d25c7e0d44a0
      TARGET_REF: benchmark/mesh-scenario-campaign-v1
      CARRIER_PATH: .github/workflows/qikvrt_pr1200_campaign_integrity_successor.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact predecessor and stacked base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^1)" = "$EXPECTED_PREDECESSOR"
          git fetch --no-tags origin optimize/mesh-message-lock-scope-v1
          test "$(git rev-parse --verify origin/optimize/mesh-message-lock-scope-v1^{commit})" = "$EXPECTED_BASE"

      - name: Materialize deterministic integrity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name qikvrt-mesh-campaign-materializer
          git config user.email qikvrt-mesh-campaign-materializer@users.noreply.github.com
          git rm -- "$CARRIER_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt

      - name: Execute campaign and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1             python3 -B -m unittest -v               tests.test_qikvrt_mesh_idle_gate               tests.test_qikvrt_real_mesh
          make test

      - name: Commit push and read back successor
        shell: bash
        run: |
          set -euo pipefail
          remote_before="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_before" = "$GITHUB_SHA"
          base_now="$(git ls-remote --heads origin refs/heads/optimize/mesh-message-lock-scope-v1 | awk 'NR==1 {print $1}')"
          test "$base_now" = "$EXPECTED_BASE"
          git commit -m "benchmark: materialize Mesh scaling campaign integrity"
          successor="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          remote_after="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_after" = "$successor"
          printf 'SUCCESSOR_HEAD=%s\nSUCCESSOR_TREE=%s\n' "$successor" "$tree"
          printf 'PREDECESSOR_EVIDENCE_TRANSFER=false\n'
          printf 'REPOSITORY_EFFECT_ACK_DONE=false\n'
