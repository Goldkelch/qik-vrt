name: QIKVRT terminal continuation rollout

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify continuation selector and rollout coverage
        run: |
          python3 -B tests/test_universal_terminal_continuation.py
          python3 -B tests/test_qikvrt_terminal_continuation_selector.py
          python3 -B tests/test_temdd_autonomous_continuation.py
          python3 -B tests/test_terminal_continuation_adapter_map.py
          python3 -B tests/test_standard_terminal_pattern_continuation_addendum.py
          python3 -B tests/test_terminal_continuation_rollout.py
          python3 -B tests/test_monitor_terminal_compatibility.py
