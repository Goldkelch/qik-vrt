# Temporary finite bootstrap for Railway-compatible persistent storage.
# The Dockerfile source repair is already owner-authored. This job binds one
# regression contract, regenerates repository integrity, removes itself, and
# CAS-pushes one deterministic successor.
name: QIKVRT cloud transputer platform-volume integrity bootstrap

on:
  push:
    branches: [runtime/cloud-transputer-v1]

permissions:
  contents: write

concurrency:
  group: qikvrt-cloud-transputer-platform-volume-integrity-bootstrap
  cancel-in-progress: false

jobs:
  materialize-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Bind platform-volume regression and verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          from pathlib import Path

          docker = Path('deploy/cloud-transputer/Dockerfile').read_text(encoding='utf-8')
          if 'VOLUME [' in docker:
              raise SystemExit('BLOCK: anonymous Docker VOLUME still present')
          for path in (
              '/var/lib/qikvrt/profile', '/var/lib/qikvrt/state',
              '/var/lib/qikvrt/mirror', '/var/lib/qikvrt/personal-posix',
              '/var/lib/qikvrt/mail',
          ):
              if path not in docker:
                  raise SystemExit(f'BLOCK: persistent runtime path absent from image contract: {path}')

          test_path = Path('tests/test_qikvrt_cloud_transputer_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '    def test_postgresql_log_is_precreated_for_unprivileged_pg_ctl(self) -> None:\n'
          method = '''    def test_image_persistence_uses_external_platform_mount_not_anonymous_volume(self) -> None:\n        text = DOCKERFILE.read_text(encoding="utf-8")\n        self.assertNotIn("VOLUME [", text)\n        for target in ("/var/lib/qikvrt/profile", "/var/lib/qikvrt/state", "/var/lib/qikvrt/mirror", "/var/lib/qikvrt/personal-posix", "/var/lib/qikvrt/mail"):\n            self.assertIn(target, text)\n\n'''
          if method not in tests:
              if tests.count(anchor) != 1:
                  raise SystemExit('BLOCK: platform-volume regression insertion anchor not observed once')
              test_path.write_text(tests.replace(anchor, method + anchor), encoding='utf-8', newline='\n')
          PY

          python3 -B -m unittest -v tests.test_qikvrt_cloud_transputer_contract
          sh -n deploy/cloud-transputer/entrypoint.sh deploy/cloud-transputer/runtime-health.sh deploy/cloud-transputer/authority-mirror-refresh.sh

      - name: Remove bootstrap and regenerate integrity trio
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/qikvrt_cloud_transputer_platform_volume_integrity_bootstrap.yml
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          git add deploy/cloud-transputer/Dockerfile \
                  tests/test_qikvrt_cloud_transputer_contract.py \
                  REPOSITORY_FILE_MANIFEST.json \
                  REPOSITORY_FILE_MANIFEST.json.sha256 \
                  SHA256SUMS.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote --heads origin refs/heads/runtime/cloud-transputer-v1 | awk 'NR==1 {print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git commit -m "evidence: bind Railway platform-volume persistence"
          git push origin HEAD:refs/heads/runtime/cloud-transputer-v1