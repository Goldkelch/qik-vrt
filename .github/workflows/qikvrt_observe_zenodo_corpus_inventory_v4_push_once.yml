name: QIK-VRT push observer for Zenodo corpus inventory v4

on:
  push:
    branches:
      - observe/zenodo-corpus-inventory-v4-339b3498
    paths:
      - .github/workflows/qikvrt_observe_zenodo_corpus_inventory_v4_push_once.yml

permissions:
  actions: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EFFECT_BRANCH: execution/zenodo-corpus-inventory-20260728-v4
      EFFECT_WORKFLOW: QIK-VRT hardened authenticated Zenodo corpus proof inventory v4 once
      OBSERVER_ISSUE: '162'
    steps:
      - name: Query and report effect-branch workflow run
        shell: bash
        run: |
          set -euo pipefail
          encoded_branch=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['EFFECT_BRANCH'], safe=''))
          PY
          )
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs?branch=$encoded_branch&per_page=50" \
            > runs.json
          python3 -B - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path('runs.json').read_text(encoding='utf-8'))
          matches = [
              run for run in value.get('workflow_runs', [])
              if run.get('name') == os.environ['EFFECT_WORKFLOW']
          ]
          if not matches:
              raise SystemExit('BLOCK: no exact effect workflow run found')
          run = matches[0]
          body = '\n'.join([
              '## Exact read-only Zenodo corpus inventory v4 run',
              '',
              f"- run ID: `{run.get('id')}`",
              f"- run number: `{run.get('run_number')}`",
              f"- head branch: `{run.get('head_branch')}`",
              f"- head SHA: `{run.get('head_sha')}`",
              f"- event: `{run.get('event')}`",
              f"- status: `{run.get('status')}`",
              f"- conclusion: `{run.get('conclusion')}`",
              f"- created_at: `{run.get('created_at')}`",
              f"- updated_at: `{run.get('updated_at')}`",
              '',
              'This observer performs no Zenodo or effect-branch mutation.',
          ])
          pathlib.Path('comment.md').write_text(body + '\n', encoding='utf-8')
          print(body)
          PY
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/issues/$OBSERVER_ISSUE/comments" \
            -f body=@comment.md
