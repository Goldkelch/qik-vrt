name: QIKVRT TEMDD Zenodo candidate materialization

on:
  push:
    branches:
      - infra/live-status-default-branch
    paths:
      - .github/workflows/qikvrt_temdd_zenodo_candidate_materialize.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-temdd-zenodo-candidate-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_HEAD: a04ff87358159dfef54ba3141cfea76fc75bbdac
      TARGET_BRANCH: materialized/temdd-zenodo-a04ff873-v1
    steps:
      - name: Check out exact controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind returned candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_HEAD" "$GITHUB_SHA"
          for path in             docs/publications/2026-09-24-temdd-technical-evolution/TEMDD_TECHNICAL_EVOLUTION_DE.md             docs/patent/TEMDD_HARDWARE_MAPPING_AND_PATENT_BOUNDARY_V1.md
          do
            test "$(git rev-parse "$SOURCE_HEAD:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          printf 'PREDECESSOR_EVIDENCE_TRANSFER=false\n'
          printf 'EFFECT_ACK_DONE=false\n'

      - name: Materialize exact v2 proof candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_temdd_zenodo_candidate.py materialize
          python3 -B tools/qikvrt_temdd_zenodo_candidate.py check

      - name: Regenerate canonical repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Persist bounded materialized successor
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"; then
            echo 'BLOCK: materialized target branch already exists' >&2
            exit 2
          fi
          git config user.name "qik-vrt-temdd-publication[bot]"
          git config user.email "qik-vrt-temdd-publication[bot]@users.noreply.github.com"
          git add --             release/temdd-technical-evolution-zenodo-v1/PREPUBLICATION_RETURN_RECEIPT.json             release/temdd-technical-evolution-zenodo-v1/MACHINE_PROOF_BUNDLE.json             release/temdd-technical-evolution-zenodo-v1/EXACT_AUTHORIZATION_REQUEST.json             release/temdd-technical-evolution-zenodo-v1/PUBLISH_REQUEST_DRAFT.json             release/temdd-technical-evolution-zenodo-v1/ZENODO_FILESET.md             REPOSITORY_FILE_MANIFEST.json             REPOSITORY_FILE_MANIFEST.json.sha256             SHA256SUMS.txt
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "publication(temdd): materialize Zenodo v2 pre-authorization candidate"
          candidate="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          git push origin "$candidate:refs/heads/$TARGET_BRANCH"
          remote="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk 'NR==1 {print $1}')"
          test "$remote" = "$candidate"
          printf 'MATERIALIZED_HEAD=%s\n' "$candidate"
          printf 'MATERIALIZED_TREE=%s\n' "$tree"
          printf 'PREDECESSOR_EVIDENCE_TRANSFER=false\n'
          printf 'EFFECT_ACK_DONE=false\n'

      - name: Upload pre-authorization evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: temdd-zenodo-preauthorization-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            release/temdd-technical-evolution-zenodo-v1/PREPUBLICATION_RETURN_RECEIPT.json
            release/temdd-technical-evolution-zenodo-v1/MACHINE_PROOF_BUNDLE.json
            release/temdd-technical-evolution-zenodo-v1/EXACT_AUTHORIZATION_REQUEST.json
            release/temdd-technical-evolution-zenodo-v1/PUBLISH_REQUEST_DRAFT.json
