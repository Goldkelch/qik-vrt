name: QIKVRT autonomous PR-head continuation

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  workflow_run:
    workflows:
      - "QIKVRT repository evidence materialization"
      - "QIKVRT adaptive stacked successor integrity materialization"
      - "QIKVRT CI"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT requested review executor"
      - "QIKVRT code-owner review observer"
      - "QIKVRT workflow executor watchdog"
    types: [completed]
  # Clock/fallback only. Productive reobservation is normally interrupt/event driven.
  # GitHub-hosted Actions has no continuously resident process; five minutes is the
  # bounded lost-event watchdog, not the normal continuation latency.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  # GitHub's create-repository-dispatch endpoint requires Contents: write for the
  # workflow token. This authority is used only to emit the exact bound dispatch
  # envelope below; the workflow never checks out with credentials or mutates files.
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: qikvrt-autonomous-pr-head-continuation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  continue-one-stalled-internal-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current Authority main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify causal D0 ABI contract
        shell: bash
        run: |
          set -euo pipefail
          abi=state/autonomy/CAUSAL_D0_ABI_V1.json
          jq -e '
            .architecture_reference == "M68000" and
            .endianness == "big" and
            .register == "D0" and
            .states.NOOP.d0 == 0 and .states.NOOP.bytes_hex == "70004E75" and
            .states.HOLD.d0 == 1 and .states.HOLD.bytes_hex == "70014E75" and
            .states.REOBSERVE.d0 == 2 and .states.REOBSERVE.bytes_hex == "70024E75" and
            .states.REQUEST_AUTHORITY.d0 == 3 and .states.REQUEST_AUTHORITY.bytes_hex == "70034E75" and
            .productive_effect_gate.expression == "D0 == 0 && EFFECT_ACK == DONE"
          ' "$abi" >/dev/null
          python3 -B -m unittest -v \
            tests.test_qikvrt_pr_head_recovery \
            tests.test_qikvrt_autonomous_pr_head_continuation

      - name: Select at most one exact stalled internal PR head
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/autonomous-pr-head-continuation
          mkdir -p "$root"
          : > "$root/decisions.jsonl"

          selected_pr=""
          selected_ref=""
          selected_head=""
          selected_base=""

          # Bounded discovery: newest 30 open PRs only, one REOBSERVE edge per run.
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&sort=updated&direction=desc&per_page=30" \
            > "$root/open-prs.json"
          while IFS=$'\t' read -r pr ref head base head_repo; do
            test -n "$pr" || continue
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              continue
            fi

            # Exact live ref must still bind the PR head before any classification.
            live_ref="$(git ls-remote --heads origin "refs/heads/$ref" | awk 'NR == 1 {print $1}')"
            if [ "$live_ref" != "$head" ]; then
              jq -nc \
                --arg pr "$pr" \
                --arg head "$head" \
                '{pull_request:($pr|tonumber),head_sha:$head,d0:2,state:"REOBSERVE",reason:"STALE_HEAD",productive_effect:false,effect_ack:"NOT_REQUIRED"}' \
                >> "$root/decisions.jsonl"
              continue
            fi

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}&per_page=100" \
              > "$root/runs-${pr}.json"
            : > "$root/observations-${pr}.jsonl"
            # NUL framing preserves the empty conclusion of an active run.  A
            # whitespace IFS (including TAB) collapses that empty field and
            # shifts created_at out of its column.
            while
              IFS= read -r -d '' run_id &&
                IFS= read -r -d '' name &&
                IFS= read -r -d '' status &&
                IFS= read -r -d '' conclusion &&
                IFS= read -r -d '' created_at
            do
              test -n "$run_id" || continue
              test -n "$created_at"
              jobs_total=0
              case "$conclusion" in
                action_required|cancelled|failure|startup_failure|timed_out)
                  jobs_total="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=1" --jq '.total_count')"
                  ;;
                success)
                  # A completed success is executed evidence; the classifier only
                  # needs a positive witness, not the complete job inventory.
                  jobs_total=1
                  ;;
              esac
              jq -nc \
                --argjson id "$run_id" \
                --arg name "$name" \
                --arg status "$status" \
                --arg conclusion "$conclusion" \
                --argjson jobs_total "$jobs_total" \
                --arg created_at "$created_at" \
                '{id:$id,name:$name,status:$status,conclusion:(if $conclusion == "" then null else $conclusion end),jobs_total:$jobs_total,created_at:$created_at}' \
                >> "$root/observations-${pr}.jsonl"
            done < <(
              jq -j '
                .workflow_runs[] |
                (.id | tostring), "\u0000",
                .name, "\u0000",
                .status, "\u0000",
                (.conclusion // ""), "\u0000",
                .created_at, "\u0000"
              ' \
                "$root/runs-${pr}.json"
            )
            jq -s '.' "$root/observations-${pr}.jsonl" > "$root/observations-${pr}.json"

            exact_head_status="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/status" \
                --jq '[.statuses[] | select(.context == "QIKVRT autonomous exact-head verification")][0].state // "missing"'
            )"
            python3 -B tools/qikvrt_pr_head_recovery.py classify \
              --input "$root/observations-${pr}.json" \
              --output "$root/decision-${pr}.json" \
              --exact-head-status "$exact_head_status"

            jq -c \
              --arg pr "$pr" \
              --arg ref "$ref" \
              --arg head "$head" \
              --arg base "$base" \
              '. + {pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,base_sha:$base}' \
              "$root/decision-${pr}.json" >> "$root/decisions.jsonl"

            d0="$(jq -r '.d0' "$root/decision-${pr}.json")"
            if [ "$d0" -eq 2 ]; then
              selected_pr="$pr"
              selected_ref="$ref"
              selected_head="$head"
              selected_base="$base"
              break
            fi
          done < <(
            jq -r '.[] | [.number,.head.ref,.head.sha,.base.sha,.head.repo.full_name] | @tsv' \
              "$root/open-prs.json"
          )

          if [ -z "$selected_pr" ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            if jq -e 'select(.d0 == 1)' "$root/decisions.jsonl" >/dev/null 2>&1; then
              jq -n \
                --arg event "$GITHUB_EVENT_NAME" \
                '{d0:1,state:"HOLD",event:$event,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"NO_REOBSERVE_EDGE_WITH_ACTIVE_OR_ADVERSE_WORK"}' \
                > "$root/decision-receipt.json"
              echo "HOLD/D0=1: active or adverse exact-head work prevents dispatch"
            else
              jq -n \
                --arg event "$GITHUB_EVENT_NAME" \
                '{d0:0,state:"NOOP",event:$event,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"NO_REOBSERVE_EDGE"}' \
                > "$root/decision-receipt.json"
              echo "NOOP/D0=0: no stalled internal PR head requires reobservation"
            fi
            exit 0
          fi

          # Final exact reobservation immediately before exposing the REOBSERVE edge.
          live_ref="$(git ls-remote --heads origin "refs/heads/$selected_ref" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$selected_head"
          echo "selected=true" >> "$GITHUB_OUTPUT"
          echo "pr=$selected_pr" >> "$GITHUB_OUTPUT"
          echo "ref=$selected_ref" >> "$GITHUB_OUTPUT"
          echo "head=$selected_head" >> "$GITHUB_OUTPUT"
          echo "base=$selected_base" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg pr "$selected_pr" \
            --arg ref "$selected_ref" \
            --arg head "$selected_head" \
            '{d0:2,state:"REOBSERVE",event:$event,pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"ZERO_JOB_ACTION_REQUIRED"}' \
            > "$root/decision-receipt.json"

      - name: Dispatch exact-head REOBSERVE continuation
        if: steps.select.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          HEAD_REF: ${{ steps.select.outputs.ref }}
          HEAD_SHA: ${{ steps.select.outputs.head }}
          BASE_SHA: ${{ steps.select.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/autonomous-pr-head-continuation
          dispatch_status_published=false
          publish_dispatch_error() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ] && [ "$dispatch_status_published" = true ]; then
              set +e
              gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
                -f state=error \
                -f context='QIKVRT autonomous exact-head verification' \
                -f description='Exact-head recovery dispatch failed' \
                -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              set -e
            fi
            exit "$rc"
          }
          trap publish_dispatch_error EXIT

          live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$HEAD_SHA"

          # Publish pending first. A concurrent invocation therefore HOLDs instead
          # of dispatching a second verifier for the same exact head.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='QIKVRT autonomous exact-head verification' \
            -f description='Trusted exact-head recovery dispatched' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          dispatch_status_published=true

          # D0=2 permits fresh observation/verifier execution only. It does not
          # merge, publish, deploy, or assert EFFECT_ACK_DONE.
          live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$HEAD_SHA"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$PR_NUMBER" \
            --arg ref "$HEAD_REF" \
            --arg head "$HEAD_SHA" \
            --arg base "$BASE_SHA" \
            '{event_type:"qikvrt_autonomous_exact_head_verify",client_payload:{repository:$repository,pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,base_sha:$base,d0:2,causal_state:"REOBSERVE"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

          : > "$root/dispatched-workflows.jsonl"
          for workflow in \
            qikvrt_ci.yml \
            qikvrt_collective_review.yml \
            qikvrt_global_completion.yml
          do
            live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
            test "$live_ref" = "$HEAD_SHA"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref="$HEAD_REF"
            jq -nc \
              --arg workflow "$workflow" \
              --arg ref "$HEAD_REF" \
              --arg head "$HEAD_SHA" \
              '{workflow:$workflow,ref:$ref,head:$head,d0:2,state:"REOBSERVE",productive_effect:false}' \
              >> "$root/dispatched-workflows.jsonl"
          done

          # Review execution remains separate authority. REQUEST_AUTHORITY/D0=3 is
          # represented by the ABI but is not fabricated by this stall classifier.
          live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$HEAD_SHA"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_requested_review_executor.yml/dispatches" \
            -f ref=main -F "inputs[pr]=$PR_NUMBER"

          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg head "$HEAD_SHA" \
            --arg ref "$HEAD_REF" \
            '{pull_request:($pr|tonumber),head_sha:$head,head_ref:$ref,d0:2,state:"REOBSERVE",disposition:"DISPATCHED_EXACT_HEAD_CONTINUATION",productive_effect:false,effect_ack:"NOT_REQUIRED"}' \
            > "$root/dispatch-receipt.json"
          trap - EXIT

      - name: Preserve causal continuation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-autonomous-pr-head-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: .qikvrt/autonomous-pr-head-continuation
