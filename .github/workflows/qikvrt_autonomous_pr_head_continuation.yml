name: QIKVRT autonomous PR-head continuation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  workflow_run:
    workflows:
      - "QIKVRT repository evidence materialization"
      - "QIKVRT adaptive stacked successor integrity materialization"
      - "QIKVRT CI"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT code-owner review observer"
      - "QIKVRT workflow executor watchdog"
    types: [completed]

permissions:
  actions: write
  # GitHub's create-repository-dispatch endpoint requires Contents: write for the
  # workflow token. This authority is used only to emit the exact bound dispatch
  # envelope below; the workflow never checks out with credentials or mutates files.
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: qikvrt-autonomous-pr-head-continuation-${{ github.repository }}${{ github.event_name == 'pull_request' && format('-candidate-{0}', github.event.pull_request.number) || '' }}
  # queue:max prevents single-pending replacement; capacity is bounded at 100.
  # Overflow/manual cancellation still requires the adverse-state classifier.
  queue: max
  cancel-in-progress: false

jobs:
  continue-one-stalled-internal-pr:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current Authority main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify causal D0 ABI contract
        shell: bash
        run: |
          set -euo pipefail
          abi=state/autonomy/CAUSAL_D0_ABI_V1.json
          jq -e '
            .architecture_reference == "M68000" and
            .endianness == "big" and
            .register == "D0" and
            .states.NOOP.d0 == 0 and .states.NOOP.bytes_hex == "70004E75" and
            .states.HOLD.d0 == 1 and .states.HOLD.bytes_hex == "70014E75" and
            .states.REOBSERVE.d0 == 2 and .states.REOBSERVE.bytes_hex == "70024E75" and
            .states.REQUEST_AUTHORITY.d0 == 3 and .states.REQUEST_AUTHORITY.bytes_hex == "70034E75" and
            .productive_effect_gate.expression == "D0 == 0 && EFFECT_ACK == DONE"
          ' "$abi" >/dev/null
          python3 -B -m unittest -v \
            tests.test_qikvrt_pr_head_recovery \
            tests.test_qikvrt_autonomous_pr_head_continuation

      - name: Select at most one exact stalled internal PR head
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/autonomous-pr-head-continuation
          mkdir -p "$root"
          : > "$root/decisions.jsonl"
          rate_limit_marker="$root/rate-limit-exhausted.json"
          rm -f "$rate_limit_marker"

          emit_rate_limit_hold() {
            echo "selected=false" >> "$GITHUB_OUTPUT"
            jq -n \
              --arg event "$GITHUB_EVENT_NAME" \
              '{d0:1,state:"HOLD",event:$event,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED",first_causal_blocker:"GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED",next_action:"REOBSERVE_ON_NEXT_REPOSITORY_INTERRUPT"}' \
              > "$root/decision-receipt.json"
            echo "HOLD/D0=1: bounded GitHub installation rate-limit backoff exhausted"
          }

          # Retry only the exact GitHub installation quota response after the
          # repository's bounded 15 s / 45 s backoff. If the quota is still
          # exhausted, persist a marker and return a type-safe fail-closed
          # placeholder so `set -e` does not erase the HOLD receipt. All other
          # API failures remain hard failures.
          gh_read() {
            local output error delay endpoint
            endpoint="$1"
            output="$(mktemp)"
            error="$(mktemp)"
            for delay in 0 15 45; do
              if [ "$delay" -gt 0 ]; then
                echo "QIKVRT_GITHUB_INSTALLATION_RATE_LIMIT_BACKOFF_SECONDS=$delay" >&2
                sleep "$delay"
              fi
              if gh api "$@" >"$output" 2>"$error"; then
                cat "$output"
                rm -f "$output" "$error"
                return 0
              fi
              if ! grep -Fq "API rate limit exceeded for installation." "$error"; then
                cat "$error" >&2
                rm -f "$output" "$error"
                return 1
              fi
            done
            cat "$error" >&2
            jq -n \
              --arg endpoint "$endpoint" \
              '{state:"HOLD",d0:1,reason:"GITHUB_INSTALLATION_RATE_LIMIT_EXHAUSTED",endpoint:$endpoint,productive_effect:false,effect_ack:"NOT_REQUIRED"}' \
              > "$rate_limit_marker"
            case "$endpoint" in
              *"/pulls?"*) printf '[]\n' ;;
              *"/actions/runs?"*) printf '{"workflow_runs":[]}\n' ;;
              *"/jobs?"*) printf '0\n' ;;
              *"/status") printf 'missing\n' ;;
              *) printf '{}\n' ;;
            esac
            rm -f "$output" "$error"
            return 0
          }

          selected_pr=""
          selected_ref=""
          selected_head=""
          selected_base=""

          # Bounded discovery: newest 30 open PRs only, one REOBSERVE edge per run.
          gh_read "repos/${GITHUB_REPOSITORY}/pulls?state=open&sort=updated&direction=desc&per_page=30" \
            > "$root/open-prs.json"
          if [ -f "$rate_limit_marker" ]; then
            emit_rate_limit_hold
            exit 0
          fi

          while IFS=$'\t' read -r pr ref head base head_repo; do
            test -n "$pr" || continue
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              continue
            fi

            # Exact live ref must still bind the PR head before any classification.
            live_ref="$(git ls-remote --heads origin "refs/heads/$ref" | awk 'NR == 1 {print $1}')"
            if [ "$live_ref" != "$head" ]; then
              jq -nc \
                --arg pr "$pr" \
                --arg head "$head" \
                '{pull_request:($pr|tonumber),head_sha:$head,d0:2,state:"REOBSERVE",reason:"STALE_HEAD",productive_effect:false,effect_ack:"NOT_REQUIRED"}' \
                >> "$root/decisions.jsonl"
              continue
            fi

            gh_read "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}&per_page=100" \
              > "$root/runs-${pr}.json"
            if [ -f "$rate_limit_marker" ]; then
              break
            fi

            : > "$root/observations-${pr}.jsonl"
            # Read one JSON object per line. A tab-separated projection loses
            # an empty `conclusion` because Bash treats tab as IFS whitespace,
            # shifting `created_at` into the wrong field.
            while IFS= read -r run; do
              test -n "$run" || continue
              run_id="$(jq -r '.id' <<<"$run")"
              name="$(jq -r '.name' <<<"$run")"
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion' <<<"$run")"
              created_at="$(jq -r '.created_at' <<<"$run")"
              test -n "$run_id" || continue
              jobs_total=0
              case "$conclusion" in
                action_required|cancelled|failure|startup_failure|timed_out)
                  jobs_total="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=1" --jq '.total_count')"
                  if [ -f "$rate_limit_marker" ]; then
                    break
                  fi
                  ;;
                success)
                  # A completed success is executed evidence; the classifier only
                  # needs a positive witness, not the complete job inventory.
                  jobs_total=1
                  ;;
              esac
              jq -nc \
                --argjson id "$run_id" \
                --arg name "$name" \
                --arg status "$status" \
                --arg conclusion "$conclusion" \
                --argjson jobs_total "$jobs_total" \
                --arg created_at "$created_at" \
                '{id:$id,name:$name,status:$status,conclusion:(if $conclusion == "" then null else $conclusion end),jobs_total:$jobs_total,created_at:$created_at}' \
                >> "$root/observations-${pr}.jsonl"
            done < <(
              jq -c '.workflow_runs[] | select(.id != null) | {id,name,status,conclusion:(.conclusion // ""),created_at:(.created_at // "")}' \
                "$root/runs-${pr}.json"
            )
            if [ -f "$rate_limit_marker" ]; then
              break
            fi

            jq -s '.' "$root/observations-${pr}.jsonl" > "$root/observations-${pr}.json"

            exact_head_status="$(
              gh_read "repos/${GITHUB_REPOSITORY}/commits/${head}/status" \
                --jq '[.statuses[] | select(.context == "QIKVRT autonomous exact-head verification")][0].state // "missing"'
            )"
            if [ -f "$rate_limit_marker" ]; then
              break
            fi

            python3 -B tools/qikvrt_pr_head_recovery.py classify \
              --input "$root/observations-${pr}.json" \
              --output "$root/decision-${pr}.json" \
              --exact-head-status "$exact_head_status"

            jq -c \
              --arg pr "$pr" \
              --arg ref "$ref" \
              --arg head "$head" \
              --arg base "$base" \
              '. + {pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,base_sha:$base}' \
              "$root/decision-${pr}.json" >> "$root/decisions.jsonl"

            d0="$(jq -r '.d0' "$root/decision-${pr}.json")"
            if [ "$d0" -eq 2 ]; then
              selected_pr="$pr"
              selected_ref="$ref"
              selected_head="$head"
              selected_base="$base"
              break
            fi
          done < <(
            jq -r '.[] | [.number,.head.ref,.head.sha,.base.sha,.head.repo.full_name] | @tsv' \
              "$root/open-prs.json"
          )

          if [ -f "$rate_limit_marker" ]; then
            emit_rate_limit_hold
            exit 0
          fi

          if [ -z "$selected_pr" ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            if jq -se 'any(.[]; .reason == "ZERO_JOB_CANCELLED")' "$root/decisions.jsonl" >/dev/null; then
              jq -n \
                --arg event "$GITHUB_EVENT_NAME" \
                '{d0:1,state:"HOLD",event:$event,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"ZERO_JOB_CANCELLED",first_causal_blocker:"CONTINUATION_CHAIN_DROPS_BEFORE_EXECUTION"}' \
                > "$root/decision-receipt.json"
              echo "HOLD/D0=1: continuation cancelled before any job was created"
            elif jq -se 'any(.[]; .d0 == 1)' "$root/decisions.jsonl" >/dev/null; then
              jq -n \
                --arg event "$GITHUB_EVENT_NAME" \
                '{d0:1,state:"HOLD",event:$event,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"NO_REOBSERVE_EDGE_WITH_ACTIVE_OR_ADVERSE_WORK"}' \
                > "$root/decision-receipt.json"
              echo "HOLD/D0=1: active or adverse exact-head work prevents dispatch"
            else
              jq -n \
                --arg event "$GITHUB_EVENT_NAME" \
                '{d0:0,state:"NOOP",event:$event,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"NO_REOBSERVE_EDGE"}' \
                > "$root/decision-receipt.json"
              echo "NOOP/D0=0: no stalled internal PR head requires reobservation"
            fi
            exit 0
          fi

          # Final exact reobservation immediately before exposing the REOBSERVE edge.
          live_ref="$(git ls-remote --heads origin "refs/heads/$selected_ref" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$selected_head"
          echo "selected=true" >> "$GITHUB_OUTPUT"
          echo "pr=$selected_pr" >> "$GITHUB_OUTPUT"
          echo "ref=$selected_ref" >> "$GITHUB_OUTPUT"
          echo "head=$selected_head" >> "$GITHUB_OUTPUT"
          echo "base=$selected_base" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg pr "$selected_pr" \
            --arg ref "$selected_ref" \
            --arg head "$selected_head" \
            '{d0:2,state:"REOBSERVE",event:$event,pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"ZERO_JOB_ACTION_REQUIRED"}' \
            > "$root/decision-receipt.json"

      - name: Dispatch exact-head REOBSERVE continuation
        if: steps.select.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          HEAD_REF: ${{ steps.select.outputs.ref }}
          HEAD_SHA: ${{ steps.select.outputs.head }}
          BASE_SHA: ${{ steps.select.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/autonomous-pr-head-continuation
          dispatch_status_published=false
          publish_dispatch_error() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ] && [ "$dispatch_status_published" = true ]; then
              set +e
              gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
                -f state=error \
                -f context='QIKVRT autonomous exact-head verification' \
                -f description='Exact-head recovery dispatch failed' \
                -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              set -e
            fi
            exit "$rc"
          }
          trap publish_dispatch_error EXIT

          live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$HEAD_SHA"

          # Publish pending first. A concurrent invocation therefore HOLDs instead
          # of dispatching a second verifier for the same exact head.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='QIKVRT autonomous exact-head verification' \
            -f description='Trusted exact-head recovery dispatched' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          dispatch_status_published=true

          # D0=2 permits fresh observation/verifier execution only. It does not
          # merge, publish, deploy, or assert EFFECT_ACK_DONE.
          live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$HEAD_SHA"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$PR_NUMBER" \
            --arg ref "$HEAD_REF" \
            --arg head "$HEAD_SHA" \
            --arg base "$BASE_SHA" \
            '{event_type:"qikvrt_autonomous_exact_head_verify",client_payload:{repository:$repository,pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,base_sha:$base,d0:2,causal_state:"REOBSERVE"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

          : > "$root/dispatched-workflows.jsonl"
          for workflow in \
            qikvrt_batch04_integrity.yml \
            qikvrt_ci.yml \
            qikvrt_collective_review.yml \
            qikvrt_global_completion.yml \
            qikvrt_requested_review_contract.yml
          do
            live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
            test "$live_ref" = "$HEAD_SHA"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref="$HEAD_REF"
            jq -nc \
              --arg workflow "$workflow" \
              --arg ref "$HEAD_REF" \
              --arg head "$HEAD_SHA" \
              '{workflow:$workflow,ref:$ref,head:$head,d0:2,state:"REOBSERVE",productive_effect:false}' \
              >> "$root/dispatched-workflows.jsonl"
          done

          # Requested review has no autonomous dispatch route. The review
          # executor accepts only an exact native event or a human-supplied
          # explicit dispatch subject; this global continuation classifier must
          # not launder its selected PR into that interface.

          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg head "$HEAD_SHA" \
            --arg ref "$HEAD_REF" \
            '{pull_request:($pr|tonumber),head_sha:$head,head_ref:$ref,d0:2,state:"REOBSERVE",disposition:"DISPATCHED_EXACT_HEAD_CONTINUATION",productive_effect:false,effect_ack:"NOT_REQUIRED"}' \
            > "$root/dispatch-receipt.json"
          trap - EXIT

      - name: Preserve causal continuation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-autonomous-pr-head-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: .qikvrt/autonomous-pr-head-continuation

  # PR code is observed with read-only authority. The trusted dispatcher above
  # continues to execute Main, never this unreviewed checkout with a write token.
  continue-candidate-pr-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact candidate regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B -m unittest -v \
            tests.test_qikvrt_pr_head_recovery \
            tests.test_qikvrt_autonomous_pr_head_continuation
      - name: Execute read-only current-head continuation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/continuation-candidate
          mkdir -p "$root"
          live="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$live" = "$EXPECTED_HEAD"
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$root/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" > "$root/jobs.json"
          jq -e --arg head "$EXPECTED_HEAD" --argjson run "$GITHUB_RUN_ID" \
            '.id == $run and .head_sha == $head and .event == "pull_request"' "$root/run.json" >/dev/null
          jq -e --arg job "$GITHUB_JOB" \
            '[.jobs[] | select(.name == $job and .status == "in_progress" and .started_at != null)
              | select(any(.steps[]; .name == "Verify exact candidate regression" and .conclusion == "success"))] | length == 1' \
            "$root/jobs.json" >/dev/null
          jq -n --slurpfile run "$root/run.json" --slurpfile jobs "$root/jobs.json" \
            '[$run[0] | {id,name,status,conclusion,created_at,jobs_total:$jobs[0].total_count}]' \
            > "$root/observations.json"
          python3 -B tools/qikvrt_pr_head_recovery.py classify \
            --input "$root/observations.json" --output "$root/decision.json"
          # This event-local observation is active work, not global P2 or an effect.
          jq -e '.d0 == 1 and .reason == "ACTIVE_WORKFLOW" and .productive_effect == false' \
            "$root/decision.json" >/dev/null
          live="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$live" = "$EXPECTED_HEAD"
          jq -n --arg head "$EXPECTED_HEAD" --arg tree "$(git rev-parse HEAD^{tree})" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg job "$GITHUB_JOB" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --slurpfile jobs "$root/jobs.json" --slurpfile decision "$root/decision.json" \
            '{scope:"READ_ONLY_CANDIDATE_CONTINUATION",head_sha:$head,tree_sha:$tree,
              workflow_sha:$workflow_sha,run_id:$run,run_attempt:$attempt,
              job_id:([$jobs[0].jobs[] | select(.name == $job)][0].id),
              execution_observed:true,final_job_conclusion:"REQUIRES_EXTERNAL_READBACK",
              decision:$decision[0],predecessor_evidence_transfer:false,
              productive_effect:false,effect_ack:"NOT_REQUIRED"}' > "$root/receipt.json"
          cat "$root/receipt.json"
      - name: Preserve candidate execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-continuation-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qikvrt/continuation-candidate
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
