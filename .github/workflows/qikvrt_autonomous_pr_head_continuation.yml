name: QIKVRT autonomous PR-head continuation

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  workflow_run:
    workflows:
      - "QIKVRT repository evidence materialization"
      - "QIKVRT adaptive stacked successor integrity materialization"
      - "QIKVRT CI"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT requested review executor"
      - "QIKVRT code-owner review observer"
      - "QIKVRT workflow executor watchdog"
    types: [completed]
  # Clock/fallback only. Productive reobservation is normally interrupt/event driven.
  # GitHub-hosted Actions has no continuously resident process; five minutes is the
  # bounded lost-event watchdog, not the normal continuation latency.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: qikvrt-autonomous-pr-head-continuation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  continue-one-stalled-internal-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current Authority main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify causal D0 ABI contract
        shell: bash
        run: |
          set -euo pipefail
          abi=state/autonomy/CAUSAL_D0_ABI_V1.json
          jq -e '
            .architecture_reference == "M68000" and
            .endianness == "big" and
            .register == "D0" and
            .states.NOOP.d0 == 0 and .states.NOOP.bytes_hex == "70004E75" and
            .states.HOLD.d0 == 1 and .states.HOLD.bytes_hex == "70014E75" and
            .states.REOBSERVE.d0 == 2 and .states.REOBSERVE.bytes_hex == "70024E75" and
            .states.REQUEST_AUTHORITY.d0 == 3 and .states.REQUEST_AUTHORITY.bytes_hex == "70034E75" and
            .productive_effect_gate.expression == "D0 == 0 && EFFECT_ACK == DONE"
          ' "$abi" >/dev/null

      - name: Select at most one exact stalled internal PR head
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/autonomous-pr-head-continuation
          mkdir -p "$root"
          : > "$root/observations.jsonl"

          selected_pr=""
          selected_ref=""
          selected_head=""
          selected_base=""

          # Bounded discovery: newest 30 open PRs only, one REOBSERVE edge per run.
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&sort=updated&direction=desc&per_page=30" > "$root/open-prs.json"
          while IFS=$'\t' read -r pr ref head base head_repo; do
            test -n "$pr" || continue
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              continue
            fi

            # Exact live ref must still bind the PR head before any classification.
            live_ref="$(git ls-remote --heads origin "refs/heads/$ref" | awk 'NR == 1 {print $1}')"
            if [ "$live_ref" != "$head" ]; then
              printf '{"pr":%s,"head":"%s","d0":2,"state":"REOBSERVE","reason":"STALE_HEAD","productive_effect":false}\n' \
                "$pr" "$head" >> "$root/observations.jsonl"
              continue
            fi

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}&per_page=100" > "$root/runs-${pr}.json"
            zero_job_action_required=0
            useful_terminal=0
            active=0
            while IFS=$'\t' read -r run_id status conclusion; do
              test -n "$run_id" || continue
              if [ "$status" != completed ]; then
                active=$((active + 1))
              fi
              if [ "$status" = completed ] && [ "$conclusion" = action_required ]; then
                jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=1" --jq '.total_count')"
                if [ "$jobs" = 0 ]; then
                  zero_job_action_required=$((zero_job_action_required + 1))
                fi
              fi
              case "$conclusion" in
                success|failure|cancelled|timed_out) useful_terminal=$((useful_terminal + 1)) ;;
              esac
            done < <(jq -r '.workflow_runs[] | [.id,.status,(.conclusion // "")] | @tsv' "$root/runs-${pr}.json")

            # D0 ABI classification. REOBSERVE is observation-only; it is not a
            # productive external effect and therefore does not bypass EFFECT_ACK.
            if [ "$active" -gt 0 ]; then
              d0=1
              state=HOLD
              reason=ACTIVE_WORKFLOW
            elif [ "$zero_job_action_required" -gt 0 ] && [ "$useful_terminal" -eq 0 ]; then
              d0=2
              state=REOBSERVE
              reason=ZERO_JOB_ACTION_REQUIRED
            else
              d0=0
              state=NOOP
              reason=CONSISTENT_OR_ALREADY_TERMINAL
            fi

            printf '{"pr":%s,"head":"%s","d0":%s,"state":"%s","reason":"%s","active":%s,"zero_job_action_required":%s,"useful_terminal":%s,"productive_effect":false}\n' \
              "$pr" "$head" "$d0" "$state" "$reason" "$active" "$zero_job_action_required" "$useful_terminal" \
              >> "$root/observations.jsonl"

            if [ "$d0" -eq 2 ]; then
              selected_pr="$pr"
              selected_ref="$ref"
              selected_head="$head"
              selected_base="$base"
              break
            fi
          done < <(jq -r '.[] | [.number,.head.ref,.head.sha,.base.sha,.head.repo.full_name] | @tsv' "$root/open-prs.json")

          if [ -z "$selected_pr" ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            jq -n \
              --arg event "$GITHUB_EVENT_NAME" \
              '{d0:0,state:"NOOP",event:$event,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"NO_REOBSERVE_EDGE"}' \
              > "$root/decision-receipt.json"
            echo "NOOP/D0=0: no stalled internal PR head requires reobservation"
            exit 0
          fi

          # Final exact reobservation immediately before exposing the REOBSERVE edge.
          live_ref="$(git ls-remote --heads origin "refs/heads/$selected_ref" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$selected_head"
          echo "selected=true" >> "$GITHUB_OUTPUT"
          echo "pr=$selected_pr" >> "$GITHUB_OUTPUT"
          echo "ref=$selected_ref" >> "$GITHUB_OUTPUT"
          echo "head=$selected_head" >> "$GITHUB_OUTPUT"
          echo "base=$selected_base" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg pr "$selected_pr" \
            --arg ref "$selected_ref" \
            --arg head "$selected_head" \
            '{d0:2,state:"REOBSERVE",event:$event,pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,productive_effect:false,effect_ack:"NOT_REQUIRED",reason:"ZERO_JOB_ACTION_REQUIRED"}' \
            > "$root/decision-receipt.json"

      - name: Dispatch exact-head REOBSERVE continuation
        if: steps.select.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          HEAD_REF: ${{ steps.select.outputs.ref }}
          HEAD_SHA: ${{ steps.select.outputs.head }}
          BASE_SHA: ${{ steps.select.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/autonomous-pr-head-continuation
          live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$HEAD_SHA"

          # D0=2 permits fresh observation/verifier execution only. These dispatches
          # do not merge, publish, deploy, or assert EFFECT_ACK_DONE.
          : > "$root/dispatched-workflows.jsonl"
          for workflow in \
            qikvrt_ci.yml \
            qikvrt_collective_review.yml \
            qikvrt_global_completion.yml
          do
            live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
            test "$live_ref" = "$HEAD_SHA"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref="$HEAD_REF"
            printf '{"workflow":"%s","ref":"%s","head":"%s","d0":2,"state":"REOBSERVE","productive_effect":false}\n' \
              "$workflow" "$HEAD_REF" "$HEAD_SHA" >> "$root/dispatched-workflows.jsonl"
          done

          live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$HEAD_SHA"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$PR_NUMBER" \
            --arg ref "$HEAD_REF" \
            --arg head "$HEAD_SHA" \
            --arg base "$BASE_SHA" \
            '{event_type:"qikvrt_autonomous_exact_head_verify",client_payload:{repository:$repository,pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,base_sha:$base,d0:2,causal_state:"REOBSERVE"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

          # Review execution remains separate authority. REQUEST_AUTHORITY/D0=3 is
          # represented by the ABI but is not fabricated by this stall classifier.
          live_ref="$(git ls-remote --heads origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$HEAD_SHA"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_requested_review_executor.yml/dispatches" \
            -f ref=main -F "inputs[pr]=$PR_NUMBER"

          printf '{"pr":%s,"head":"%s","ref":"%s","d0":2,"state":"REOBSERVE","disposition":"DISPATCHED_EXACT_HEAD_CONTINUATION","productive_effect":false,"effect_ack":"NOT_REQUIRED"}\n' \
            "$PR_NUMBER" "$HEAD_SHA" "$HEAD_REF" > "$root/dispatch-receipt.json"

      - name: Preserve causal continuation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-autonomous-pr-head-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: .qikvrt/autonomous-pr-head-continuation
