name: QIKVRT autonomous PR-head continuation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  workflow_run:
    workflows:
      - "QIKVRT repository evidence materialization"
      - "QIKVRT adaptive stacked successor integrity materialization"
      - "QIKVRT CI"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT required code-owner review"
      - "QIK-VRT autonomous exact-head verification"
      - "QIKVRT requested review contract"
      - "QIKVRT requested review executor"
      - "QIKVRT required review gate"
      - "QIKVRT workflow executor watchdog"
    types: [completed]

permissions:
  actions: read
  # Read-only by default.  The two exact transport jobs declare their narrow
  # write scope locally, after durable intent and live binding are established.
  contents: read
  pull-requests: read

concurrency:
  # Event ingestion and durable recovery each retain FIFO order, but an ingest
  # burst cannot consume all 100 pending slots and evict the only scheduled
  # outbox drainer.  Per-lane job locks serialize their shared ledger effects.
  group: qikvrt-autonomous-pr-head-continuation-${{ github.repository }}-${{ github.event_name == 'schedule' && 'recovery' || github.event_name == 'workflow_dispatch' && 'manual' || 'ingest' }}
  queue: max
  cancel-in-progress: false

jobs:
  continue-one-stalled-internal-pr:
    name: Continue one exact PR-head recovery decision
    if: >-
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.path != '.github/workflows/qikvrt_required_review_gate.yml' &&
        github.event.workflow_run.path != '.github/workflows/qikvrt_ruleset_reconcile.yml')) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'pull_request_target' || github.ref == 'refs/heads/main')
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      pr: ${{ steps.select.outputs.pr }}
      ref: ${{ steps.select.outputs.ref }}
      head: ${{ steps.select.outputs.head }}
      tree: ${{ steps.select.outputs.tree }}
      base_ref: ${{ steps.select.outputs.base_ref }}
      base: ${{ steps.select.outputs.base }}
      attempt: ${{ steps.select.outputs.attempt }}
      action: ${{ steps.select.outputs.action }}
      source_run_id: ${{ steps.select.outputs.source_run_id }}
      source_run_attempt: ${{ steps.select.outputs.source_run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Pin the code to the exact trusted revision that supplied these
          # workflow bytes; mutable main is only an explicit readback fence.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify causal D0 ABI contract
        shell: bash
        run: |
          set -euo pipefail
          abi=state/autonomy/CAUSAL_D0_ABI_V1.json
          jq -e '
            .architecture_reference == "M68000" and
            .endianness == "big" and
            .register == "D0" and
            .states.NOOP.d0 == 0 and .states.NOOP.bytes_hex == "70004E75" and
            .states.HOLD.d0 == 1 and .states.HOLD.bytes_hex == "70014E75" and
            .states.REOBSERVE.d0 == 2 and .states.REOBSERVE.bytes_hex == "70024E75" and
            .states.REQUEST_AUTHORITY.d0 == 3 and .states.REQUEST_AUTHORITY.bytes_hex == "70034E75" and
            .continuation_contract.schema == "qikvrt.causal-continuation.v1" and
            .continuation_contract.hold_is_terminal == false and
            .continuation_contract.hold_requires_next_action_or_resume_event == true and
            .continuation_contract.client_return_requires_terminal_persistence_run == true and
            .productive_effect_gate.expression == "D0 == 0 && EFFECT_ACK == DONE"
          ' "$abi" >/dev/null
          python3 -B -m unittest -v \
            tests.test_qikvrt_pr_head_recovery \
            tests.test_qikvrt_autonomous_pr_head_continuation

      - name: Select at most one exact stalled internal PR head
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          TRIGGER_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_WORKFLOW_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          TRIGGER_WORKFLOW_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          TRIGGER_PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TRIGGER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/autonomous-pr-head-continuation
          mkdir -p "$root"
          : > "$root/decisions.jsonl"
          : > "$root/scope-subjects.jsonl"

          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$live_main" != "$GITHUB_WORKFLOW_SHA" ]; then
            jq -n \
              --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
              --arg live_main "$live_main" \
              '{schema:"qikvrt.autonomous-pr-head-continuation-receipt.v1",d0:3,state:"REQUEST_AUTHORITY",reason:"TRUSTED_EVALUATOR_SUPERSEDED",workflow_sha:$workflow_sha,live_main_sha:$live_main,continuation:{schema:"qikvrt.causal-continuation.v1",mode:"REOBSERVE",owner:"REPOSITORY_EVENT_LOOP",next_action:"REBIND_CURRENT_MAIN_EVALUATOR_AND_EXACT_SUBJECT",resume_events:["workflow_dispatch","pull_request_target.synchronize","schedule"],persistence_run_terminal:false,client_return_allowed:false},productive_effect:false,effect_ack:"NOT_REQUIRED"}' \
              > "$root/decision-receipt.json"
            echo "selected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reuse the repository's bounded installation-rate-limit contract:
          # retry only the exact GitHub installation quota response, after the
          # same two backoff intervals used by the read-only observer.  A
          # different API failure remains fail-closed; this cannot turn an
          # authorization or malformed-request error into a blind retry loop.
          gh_read() {
            local output error delay
            output="$(mktemp)"
            error="$(mktemp)"
            for delay in 0 15 45; do
              if [ "$delay" -gt 0 ]; then
                echo "QIKVRT_GITHUB_INSTALLATION_RATE_LIMIT_BACKOFF_SECONDS=$delay" >&2
                sleep "$delay"
              fi
              if gh api "$@" >"$output" 2>"$error"; then
                cat "$output"
                rm -f "$output" "$error"
                return 0
              fi
              if ! grep -Fq "API rate limit exceeded for installation." "$error"; then
                cat "$error" >&2
                rm -f "$output" "$error"
                return 1
              fi
            done
            cat "$error" >&2
            rm -f "$output" "$error"
            return 1
          }

          # A continuation workflow run has two distinct SHAs.  workflow_sha is
          # the trusted default-main revision that supplied these workflow
          # bytes; Actions' run.head_sha is event data.  In particular,
          # pull_request_target runs are headed by the exact PR subject, not by
          # workflow_sha.  Keep those identities separate and fail closed for
          # every supported producer event.
          trusted_continuation_event_binding() {
            local run_json="$1" pr="$2" ref="$3" head="$4" base_ref="$5" base="$6" workflow_sha="$7"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg pr "$pr" --arg ref "$ref" --arg head "$head" \
              --arg base_ref "$base_ref" --arg base "$base" \
              --arg workflow_sha "$workflow_sha" '
              .repository.full_name == $repository and
              (
                (.event == "pull_request_target" and
                 $workflow_sha == $base and
                 .head_sha == $base and .head_branch == $base_ref and
                 ([.pull_requests[]? | select(
                    .number == ($pr|tonumber) and
                    .head.repo.full_name == $repository and .head.ref == $ref and .head.sha == $head and
                    .base.ref == $base_ref and .base.sha == $base
                  )] | length) == 1) or
                ((.event == "workflow_run" or .event == "schedule" or .event == "workflow_dispatch") and
                 .head_branch == "main" and .head_sha == $workflow_sha)
              )
            ' <<<"$run_json" >/dev/null
          }

          # A dispatch is durably witnessed under an exact subject/ordinal
          # artifact name.  The name is only an index: the artifact digest,
          # producer run, stable workflow identity, event-specific main binding,
          # request, and receipt are all revalidated before the witness can
          # suppress or advance an ordinal.  Thus two attempt-1 producers can
          # never each authorize an attempt-2 dispatch.
          trusted_dispatch_witness_state() {
            local pr="$1" ref="$2" head="$3" tree="$4" base_ref="$5" base="$6"
            local workflow workflow_id attempt artifact_name pages total artifact
            local artifact_id artifact_digest producer_id producer producer_attempt
            local producer_sha witness_zip request dispatch_receipt seen1=false seen2=false
            workflow="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            if ! jq -e '
              (.id | type) == "number" and .id > 0 and
              .path == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .state == "active"
            ' <<<"$workflow" >/dev/null; then
              printf '%s\n' invalid
              return 0
            fi

            for attempt in 1 2; do
              artifact_name="qikvrt-autonomous-exact-head-dispatch-${pr}-${head}-attempt-${attempt}"
              pages="$root/dispatch-witness-pages-${pr}-${attempt}.json"
              if ! gh_read --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
                > "$pages"; then
                printf '%s\n' invalid
                return 0
              fi
              if ! jq -e '
                length > 0 and
                ([.[].total_count] | unique | length) == 1 and
                (.[0].total_count | type) == "number" and
                ([.[] | .artifacts[]] | length) == .[0].total_count
              ' "$pages" >/dev/null; then
                printf '%s\n' invalid
                return 0
              fi
              total="$(jq -r '.[0].total_count' "$pages")"
              if [ "$total" -eq 0 ]; then
                continue
              fi
              if [ "$total" -ne 1 ]; then
                printf '%s\n' invalid
                return 0
              fi
              artifact="$(jq -c '.[0].artifacts[0]' "$pages")"
              artifact_id="$(jq -r '.id // ""' <<<"$artifact")"
              artifact_digest="$(jq -r '.digest // ""' <<<"$artifact")"
              producer_id="$(jq -r '.workflow_run.id // ""' <<<"$artifact")"
              if ! [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || \
                 ! [[ "$producer_id" =~ ^[1-9][0-9]*$ ]] || \
                 ! [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || \
                 ! jq -e \
                    --arg name "$artifact_name" '
                    .name == $name and .expired == false
                  ' <<<"$artifact" >/dev/null; then
                printf '%s\n' invalid
                return 0
              fi

              if ! producer="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_id}")"; then
                printf '%s\n' invalid
                return 0
              fi
              producer_attempt="$(jq -r '.run_attempt // ""' <<<"$producer")"
              if [ "$(jq -r '.event // ""' <<<"$producer")" = pull_request_target ]; then
                producer_sha="$base"
              else
                producer_sha="$(jq -r '.head_sha // ""' <<<"$producer")"
              fi
              if ! [[ "$producer_attempt" =~ ^[1-9][0-9]*$ ]] || \
                 ! [[ "$producer_sha" =~ ^[0-9a-f]{40}$ ]] || \
                 ! jq -e \
                    --argjson run_id "$producer_id" \
                    --argjson workflow_id "$workflow_id" \
                    --arg repository "$GITHUB_REPOSITORY" '
                    .id == $run_id and .workflow_id == $workflow_id and
                    (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
                    .repository.full_name == $repository and .status == "completed"
                  ' <<<"$producer" >/dev/null || \
                 ! trusted_continuation_event_binding "$producer" "$pr" "$ref" "$head" "$base_ref" "$base" "$producer_sha" || \
                 ! jq -e --argjson run_id "$producer_id" '
                    .workflow_run.id == $run_id
                  ' <<<"$artifact" >/dev/null; then
                printf '%s\n' invalid
                return 0
              fi

              if ! gh_read --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_id}/jobs?per_page=100" \
                > "$root/dispatch-witness-job-pages-${pr}-${attempt}.json" || \
                 ! jq -e \
                    --argjson run_id "$producer_id" \
                    --argjson run_attempt "$producer_attempt" '
                    length > 0 and
                    ([.[].total_count] | unique | length) == 1 and
                    (.[0].total_count | type == "number") and
                    ([.[] | .jobs[]] | length) == .[0].total_count and
                    ([.[] | .jobs[] | select(
                      .name == "Dispatch exact-head transport and preserve ordinal witness" and
                      .run_id == $run_id and .run_attempt == $run_attempt and
                      .status == "completed" and .conclusion == "success"
                    )] | length) == 1
                  ' "$root/dispatch-witness-job-pages-${pr}-${attempt}.json" >/dev/null; then
                printf '%s\n' invalid
                return 0
              fi

              witness_zip="$root/dispatch-witness-${pr}-${attempt}.zip"
              if ! gh_read "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$witness_zip" || \
                 [ "$artifact_digest" != "sha256:$(sha256sum "$witness_zip" | cut -d' ' -f1)" ] || \
                 [ "$(unzip -Z1 "$witness_zip" | wc -l)" -ne 2 ] || \
                 [ "$(unzip -Z1 "$witness_zip" | grep -Fxc dispatch-request.json)" -ne 1 ] || \
                 [ "$(unzip -Z1 "$witness_zip" | grep -Fxc dispatch-receipt.json)" -ne 1 ]; then
                printf '%s\n' invalid
                return 0
              fi
              request="$root/dispatch-witness-request-${pr}-${attempt}.json"
              dispatch_receipt="$root/dispatch-witness-receipt-${pr}-${attempt}.json"
              unzip -p "$witness_zip" dispatch-request.json > "$request"
              unzip -p "$witness_zip" dispatch-receipt.json > "$dispatch_receipt"
              if ! jq -e \
                --arg repository "$GITHUB_REPOSITORY" --arg pr "$pr" --arg ref "$ref" \
                --arg head "$head" --arg tree "$tree" --arg base_ref "$base_ref" --arg base "$base" \
                --arg producer_run_id "$producer_id" --arg producer_run_attempt "$producer_attempt" \
                --arg producer_workflow_id "$workflow_id" --arg producer_workflow_sha "$producer_sha" \
                --arg causal_attempt "$attempt" '
                .event_type == "qikvrt_autonomous_exact_head_verify" and
                (.client_payload | keys) == ["causal","producer","repository","schema","subject"] and
                .client_payload.schema == "qikvrt_autonomous_exact_head_verify_dispatch_v1" and
                .client_payload.repository == $repository and
                .client_payload.subject == {pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base} and
                .client_payload.producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha} and
                .client_payload.causal == {attempt:($causal_attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false}
              ' "$request" >/dev/null || \
                 ! jq -e \
                --arg pr "$pr" --arg ref "$ref" --arg head "$head" --arg tree "$tree" \
                --arg base_ref "$base_ref" --arg base "$base" \
                --arg producer_run_id "$producer_id" --arg producer_run_attempt "$producer_attempt" \
                --arg producer_workflow_id "$workflow_id" --arg producer_workflow_sha "$producer_sha" \
                --arg causal_attempt "$attempt" '
                .pull_request == ($pr|tonumber) and .head_ref == $ref and
                .head_sha == $head and .head_tree_sha == $tree and
                .base_ref == $base_ref and .base_sha == $base and
                .producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha} and
                .attempt == ($causal_attempt|tonumber) and .d0 == 2 and
                .state == "REOBSERVE" and .productive_effect == false and
                .continuation.persistence_run_terminal == false and
                .continuation.client_return_allowed == false
              ' "$dispatch_receipt" >/dev/null; then
                printf '%s\n' invalid
                return 0
              fi
              if [ "$attempt" -eq 1 ]; then seen1=true; else seen2=true; fi
            done

            case "${seen1}:${seen2}" in
              false:false) printf '%s\n' none ;;
              true:false) printf '%s\n' attempt1 ;;
              false:true) printf '%s\n' attempt2_only ;;
              true:true) printf '%s\n' attempt1_attempt2 ;;
              *) printf '%s\n' invalid ;;
            esac
          }

          # Locate an exact verifier run from an already validated immutable
          # producer intent. The dynamic title is only an index; stable
          # workflow identity, repository_dispatch/main provenance and the
          # exact source tuple are all re-bound before classifying it.
          trusted_exact_run_for_intent_state() {
            local pr="$1" head="$2" producer_id="$3" producer_attempt="$4" causal_attempt="$5"
            local workflow workflow_id title pages count run run_id run_attempt artifacts binding_name binding_count
            workflow="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")" || {
              printf '%s\n' authority; return 0;
            }
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            title="qikvrt-exact-head-pr-${pr}-sha-${head}-producer-${producer_id}-${producer_attempt}-attempt-${causal_attempt}-intent="
            pages="$root/orphan-exact-run-pages-${pr}-${causal_attempt}.json"
            gh_read --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?event=repository_dispatch&per_page=100" \
              > "$pages" || { printf '%s\n' authority; return 0; }
            jq -e '
              length > 0 and
              ([.[].total_count] | unique | length) == 1 and
              ([.[] | .workflow_runs[]] | length) == .[0].total_count
            ' "$pages" >/dev/null || { printf '%s\n' authority; return 0; }
            count="$(jq --arg prefix "$title" --arg attempt "$causal_attempt" '
              [.[] | .workflow_runs[] | select(
                (.display_title // "") |
                test("^" + $prefix + "[0-9a-f]{64}-seq=[1-9][0-9]*-transport-attempt=" + $attempt + "$")
              )] | length
            ' "$pages")"
            if [ "$count" -eq 0 ]; then printf '%s\n' none; return 0; fi
            [ "$count" -eq 1 ] || { printf '%s\n' authority; return 0; }
            run="$(jq -c --arg prefix "$title" --arg attempt "$causal_attempt" '
              [.[] | .workflow_runs[] | select(
                (.display_title // "") |
                test("^" + $prefix + "[0-9a-f]{64}-seq=[1-9][0-9]*-transport-attempt=" + $attempt + "$")
              )][0]
            ' "$pages")"
            run_id="$(jq -r '.id' <<<"$run")"
            run_attempt="$(jq -r '.run_attempt' <<<"$run")"
            jq -e --argjson workflow_id "$workflow_id" --arg repository "$GITHUB_REPOSITORY" \
              --arg prefix "$title" --arg attempt "$causal_attempt" '
              .workflow_id == $workflow_id and
              (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
              .event == "repository_dispatch" and .head_branch == "main" and
              .repository.full_name == $repository and
              ((.display_title // "") |
               test("^" + $prefix + "[0-9a-f]{64}-seq=[1-9][0-9]*-transport-attempt=" + $attempt + "$"))
            ' <<<"$run" >/dev/null || { printf '%s\n' authority; return 0; }
            case "$(jq -r '.status' <<<"$run")" in
              queued|in_progress|waiting|pending) printf '%s\n' pending; return 0 ;;
              completed) ;;
              *) printf '%s\n' authority; return 0 ;;
            esac
            gh_read --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}/artifacts?per_page=100" \
              > "$root/orphan-exact-run-artifacts-${pr}-${causal_attempt}.json" || {
                # GitHub's attempt-scoped artifact endpoint may not be exposed;
                # use the run collection but still bind artifact run metadata.
                gh_read --paginate --slurp \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                  > "$root/orphan-exact-run-artifacts-${pr}-${causal_attempt}.json" || {
                    printf '%s\n' authority; return 0;
                  }
              }
            artifacts="$root/orphan-exact-run-artifacts-${pr}-${causal_attempt}.json"
            jq -e '
              length > 0 and
              ([.[].total_count] | unique | length) == 1 and
              (.[0].total_count | type) == "number" and
              ([.[] | .artifacts[]] | length) == .[0].total_count
            ' "$artifacts" >/dev/null || { printf '%s\n' authority; return 0; }
            binding_name="qikvrt-exact-head-binding-${pr}-${head}-run-${run_id}-attempt-"
            binding_count="$(jq --arg prefix "$binding_name" --argjson attempt "$run_attempt" '
              [.[] | .artifacts[] | select(.expired == false and (.name | startswith($prefix))) |
                select((.name | split("-attempt-")[-1] | tonumber) <= $attempt)] | length
            ' "$artifacts")"
            case "$binding_count" in
              0) printf '%s\n' unbound ;;
              1) printf '%s\n' bound ;;
              *) printf '%s\n' authority ;;
            esac
          }

          # Legacy artifact-only transport intents predate the protected FIFO.
          # They cannot prove that a server-side POST never started, so the
          # one-shot model treats every such orphan as Authority.  Recovery is
          # performed only from the Core lane below; this compatibility helper
          # deliberately performs no legacy artifact or open-PR scan.
          trusted_orphan_exact_intent_state() {
            printf '%s\n' authority
            return 0

            # Unreachable historical parser retained temporarily so old
            # receipts remain recognizable during repository migration.
            local pr="$1" ref="$2" head="$3" tree="$4" base_ref="$5" base="$6"
            local workflow workflow_id attempt artifact_name pages count artifact artifact_id artifact_digest
            local intent_zip request intent producer_id producer_attempt producer_workflow_id producer_sha producer jobs
            local seen1=false seen2=false attempt1_post=ambiguous witness_state exact_run_state
            local producer1_id='' producer1_attempt='' producer2_id='' producer2_attempt=''
            workflow="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            jq -e '
              (.id | type) == "number" and .id > 0 and
              .path == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .state == "active"
            ' <<<"$workflow" >/dev/null || { printf '%s\n' authority; return 0; }

            for attempt in 1 2; do
              artifact_name="qikvrt-autonomous-exact-head-intent-${pr}-${head}-attempt-${attempt}"
              pages="$root/orphan-intent-pages-${pr}-${attempt}.json"
              gh_read --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
                > "$pages" || { printf '%s\n' authority; return 0; }
              jq -e '
                length > 0 and
                ([.[].total_count] | unique | length) == 1 and
                (.[0].total_count | type == "number") and
                ([.[] | .artifacts[]] | length) == .[0].total_count
              ' "$pages" >/dev/null || { printf '%s\n' authority; return 0; }
              count="$(jq --arg name "$artifact_name" '[.[] | .artifacts[] | select(.name == $name and .expired == false)] | length' "$pages")"
              if [ "$count" -eq 0 ]; then continue; fi
              if [ "$count" -ne 1 ]; then printf '%s\n' authority; return 0; fi
              artifact="$(jq -c --arg name "$artifact_name" '[.[] | .artifacts[] | select(.name == $name and .expired == false)][0]' "$pages")"
              artifact_id="$(jq -r '.id // ""' <<<"$artifact")"
              artifact_digest="$(jq -r '.digest // ""' <<<"$artifact")"
              [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || { printf '%s\n' authority; return 0; }
              [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { printf '%s\n' authority; return 0; }
              intent_zip="$root/orphan-intent-${pr}-${attempt}.zip"
              gh_read "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$intent_zip" || { printf '%s\n' authority; return 0; }
              [ "$artifact_digest" = "sha256:$(sha256sum "$intent_zip" | cut -d' ' -f1)" ] || { printf '%s\n' authority; return 0; }
              [ "$(unzip -Z1 "$intent_zip" | wc -l)" -eq 2 ] || { printf '%s\n' authority; return 0; }
              request="$root/orphan-intent-request-${pr}-${attempt}.json"
              intent="$root/orphan-intent-receipt-${pr}-${attempt}.json"
              unzip -p "$intent_zip" dispatch-request.json > "$request"
              unzip -p "$intent_zip" intent.json > "$intent"
              producer_id="$(jq -r '.producer.run_id // empty' "$intent")"
              producer_attempt="$(jq -r '.producer.run_attempt // empty' "$intent")"
              producer_workflow_id="$(jq -r '.producer.workflow_id // empty' "$intent")"
              producer_sha="$(jq -r '.producer.workflow_sha // empty' "$intent")"
              [[ "$producer_id" =~ ^[1-9][0-9]*$ ]] || { printf '%s\n' authority; return 0; }
              [[ "$producer_attempt" =~ ^[1-9][0-9]*$ ]] || { printf '%s\n' authority; return 0; }
              [[ "$producer_sha" =~ ^[0-9a-f]{40}$ ]] || { printf '%s\n' authority; return 0; }
              producer="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_id}/attempts/${producer_attempt}")" || { printf '%s\n' authority; return 0; }
              jq -e \
                --argjson run_id "$producer_id" --argjson run_attempt "$producer_attempt" \
                --argjson workflow_id "$workflow_id" \
                --arg repository "$GITHUB_REPOSITORY" '
                .id == $run_id and .run_attempt == $run_attempt and .workflow_id == $workflow_id and
                (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
                .repository.full_name == $repository and .status == "completed"
              ' <<<"$producer" >/dev/null || { printf '%s\n' authority; return 0; }
              trusted_continuation_event_binding "$producer" "$pr" "$ref" "$head" "$base_ref" "$base" "$producer_sha" || {
                printf '%s\n' authority; return 0;
              }
              gh_read --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_id}/attempts/${producer_attempt}/jobs?filter=all&per_page=100" \
                > "$root/orphan-intent-job-pages-${pr}-${attempt}.json" || { printf '%s\n' authority; return 0; }
              jobs="$root/orphan-intent-job-pages-${pr}-${attempt}.json"
              jq -e \
                --argjson run_id "$producer_id" --argjson run_attempt "$producer_attempt" '
                length > 0 and
                ([.[].total_count] | unique | length) == 1 and
                ([.[] | .jobs[]] | length) == .[0].total_count and
                ([.[] | .jobs[] | select(
                  .name == "Preserve exact-head transport intent before dispatch" and
                  .run_id == $run_id and .run_attempt == $run_attempt and
                  .status == "completed" and .conclusion == "success"
                )] | length) == 1
              ' "$jobs" >/dev/null || { printf '%s\n' authority; return 0; }
              jq -e \
                --argjson run_id "$producer_id" '
                .workflow_run.id == $run_id
              ' <<<"$artifact" >/dev/null || { printf '%s\n' authority; return 0; }
              jq -e \
                --arg repository "$GITHUB_REPOSITORY" --arg pr "$pr" --arg ref "$ref" \
                --arg head "$head" --arg tree "$tree" --arg base_ref "$base_ref" --arg base "$base" \
                --arg producer_run_id "$producer_id" --arg producer_run_attempt "$producer_attempt" \
                --arg producer_workflow_id "$producer_workflow_id" --arg producer_workflow_sha "$producer_sha" \
                --arg causal_attempt "$attempt" '
                .event_type == "qikvrt_autonomous_exact_head_verify" and
                .client_payload == {schema:"qikvrt_autonomous_exact_head_verify_dispatch_v1",repository:$repository,subject:{pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base},producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha},causal:{attempt:($causal_attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false}}
              ' "$request" >/dev/null || { printf '%s\n' authority; return 0; }
              jq -e \
                --arg repository "$GITHUB_REPOSITORY" --arg pr "$pr" --arg head "$head" --arg tree "$tree" \
                --arg base_ref "$base_ref" --arg base "$base" \
                --arg producer_run_id "$producer_id" --arg producer_run_attempt "$producer_attempt" \
                --arg producer_workflow_id "$producer_workflow_id" --arg producer_workflow_sha "$producer_sha" \
                --arg causal_attempt "$attempt" --arg request_sha256 "$(sha256sum "$request" | cut -d' ' -f1)" '
                .schema == "qikvrt.autonomous-exact-head-transport-intent.v1" and
                .repository == $repository and .pull_request == ($pr|tonumber) and
                .head_sha == $head and .head_tree_sha == $tree and .base_ref == $base_ref and .base_sha == $base and
                .producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha} and
                .attempt == ($causal_attempt|tonumber) and .request_sha256 == $request_sha256 and
                .productive_effect == false and .effect_ack == "NOT_REQUIRED"
              ' "$intent" >/dev/null || { printf '%s\n' authority; return 0; }
              if [ "$attempt" -eq 1 ]; then
                seen1=true
                producer1_id="$producer_id"
                producer1_attempt="$producer_attempt"
                dispatch_jobs="$(jq --argjson run_id "$producer_id" --argjson run_attempt "$producer_attempt" '[.[] | .jobs[] | select(.name == "Dispatch exact-head transport and preserve ordinal witness" and .run_id == $run_id and .run_attempt == $run_attempt)]' "$jobs")"
                if [ "$(jq 'length' <<<"$dispatch_jobs")" -eq 0 ]; then
                  attempt1_post=not_started
                elif [ "$(jq 'length' <<<"$dispatch_jobs")" -eq 1 ] && \
                     [ "$(jq '[.[0].steps[]? | select(.name == "Dispatch exact trusted transport" and (.conclusion == "skipped" or .status == "queued"))] | length' <<<"$dispatch_jobs")" -eq 1 ]; then
                  attempt1_post=not_started
                else
                  attempt1_post=ambiguous
                fi
              else
                seen2=true
                producer2_id="$producer_id"
                producer2_attempt="$producer_attempt"
              fi
            done

            witness_state="$(trusted_dispatch_witness_state "$pr" "$ref" "$head" "$tree" "$base_ref" "$base")"
            if [ "$seen2" = true ]; then
              exact_run_state="$(trusted_exact_run_for_intent_state \
                "$pr" "$head" "$producer2_id" "$producer2_attempt" 2)"
              case "$exact_run_state" in
                pending|bound) printf '%s\n' pending ;;
                unbound|authority) printf '%s\n' authority ;;
                none)
                  case "$witness_state" in
                    attempt1_attempt2|attempt2_only) printf '%s\n' pending ;;
                    *) printf '%s\n' authority ;;
                  esac
                  ;;
                *) printf '%s\n' authority ;;
              esac
              return 0
            fi
            if [ "$seen1" = false ]; then printf '%s\n' none; return 0; fi
            exact_run_state="$(trusted_exact_run_for_intent_state \
              "$pr" "$head" "$producer1_id" "$producer1_attempt" 1)"
            case "$exact_run_state" in
              pending|bound) printf '%s\n' pending ; return 0 ;;
              unbound) printf '%s\n' authority ; return 0 ;;
              authority) printf '%s\n' authority ; return 0 ;;
              none) ;;
              *) printf '%s\n' authority ; return 0 ;;
            esac
            case "$witness_state" in
              attempt1|attempt1_attempt2) printf '%s\n' pending ; return 0 ;;
              attempt2_only|invalid) printf '%s\n' authority ; return 0 ;;
            esac
            printf '%s\n' authority
          }

          # The completed verifier run-name is only a pointer.  Bind its stable
          # API identity and exact producer artifact before deciding the sole
          # retry ordinal; never scan or count unrelated repository artifacts.
          trusted_unbound_trigger_disposition() {
            local pr="$1" ref="$2" head="$3" tree="$4" base_ref="$5" base="$6"
            local workflow workflow_id trigger expected_title producer_workflow producer_workflow_id
            local producer producer_workflow_sha artifact_name artifact artifact_id artifact_digest producer_zip request intent witness_state
            workflow="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")"
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            test "$(jq -r '.path' <<<"$workflow")" = '.github/workflows/qikvrt_autonomous_exact_head_verify.yml'
            trigger="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_WORKFLOW_RUN_ID}")"
            expected_title="$TRIGGER_WORKFLOW_DISPLAY_TITLE"
            jq -e \
              --argjson run_id "$TRIGGER_WORKFLOW_RUN_ID" \
              --argjson run_attempt "$TRIGGER_WORKFLOW_RUN_ATTEMPT" \
              --argjson workflow_id "$workflow_id" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg title "$expected_title" '
              .id == $run_id and .run_attempt == $run_attempt and
              .workflow_id == $workflow_id and
              (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
              .event == "repository_dispatch" and .head_branch == "main" and
              .repository.full_name == $repository and .status == "completed" and
              .display_title == $title
            ' <<<"$trigger" >/dev/null
            test "$pr" = "$TRIGGER_POINTER_PR"
            test "$head" = "$TRIGGER_POINTER_HEAD"

            producer_workflow="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
            producer_workflow_id="$(jq -r '.id' <<<"$producer_workflow")"
            test "$(jq -r '.path' <<<"$producer_workflow")" = '.github/workflows/qikvrt_autonomous_pr_head_continuation.yml'
            producer="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_POINTER_PRODUCER_RUN_ID}/attempts/${TRIGGER_POINTER_PRODUCER_RUN_ATTEMPT}")"
            jq -e \
              --argjson attempt "$TRIGGER_POINTER_PRODUCER_RUN_ATTEMPT" \
              --argjson workflow_id "$producer_workflow_id" \
              --arg repository "$GITHUB_REPOSITORY" '
              .run_attempt == $attempt and .workflow_id == $workflow_id and
              (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .repository.full_name == $repository
            ' <<<"$producer" >/dev/null

            gh_read --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_POINTER_PRODUCER_RUN_ID}/attempts/${TRIGGER_POINTER_PRODUCER_RUN_ATTEMPT}/jobs?filter=all&per_page=100" \
              > "$root/unbound-trigger-producer-job-pages-${pr}.json"
            jq -e \
              --arg run_id "$TRIGGER_POINTER_PRODUCER_RUN_ID" \
              --arg run_attempt "$TRIGGER_POINTER_PRODUCER_RUN_ATTEMPT" '
              length > 0 and
              ([.[].total_count] | unique | length) == 1 and
              (.[0].total_count | type == "number") and
              ([.[] | .jobs[]] | length) == .[0].total_count and
              ([.[] | .jobs[] | select(
                .name == "Preserve exact-head transport intent before dispatch" and
                .run_id == ($run_id|tonumber) and .run_attempt == ($run_attempt|tonumber) and
                .status == "completed" and .conclusion == "success"
              )] | length) == 1
            ' "$root/unbound-trigger-producer-job-pages-${pr}.json" >/dev/null

            artifact_name="qikvrt-autonomous-exact-head-intent-${pr}-${head}-attempt-${TRIGGER_POINTER_CAUSAL_ATTEMPT}"
            gh_read --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
              > "$root/unbound-trigger-producer-artifact-pages-${pr}.json"
            jq -e '
              length > 0 and
              ([.[].total_count] | unique | length) == 1 and
              (.[0].total_count | type == "number") and
              ([.[] | .artifacts[]] | length) == .[0].total_count
            ' "$root/unbound-trigger-producer-artifact-pages-${pr}.json" >/dev/null
            artifact="$(jq -c --arg name "$artifact_name" '
              [.[] | .artifacts[] | select(.name == $name and .expired == false)] as $matches |
              if ($matches|length) == 1 then $matches[0] else empty end
            ' "$root/unbound-trigger-producer-artifact-pages-${pr}.json")"
            test -n "$artifact"
            artifact_id="$(jq -r '.id' <<<"$artifact")"
            artifact_digest="$(jq -r '.digest // ""' <<<"$artifact")"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            jq -e \
              --argjson run_id "$TRIGGER_POINTER_PRODUCER_RUN_ID" '
              .workflow_run.id == $run_id
            ' <<<"$artifact" >/dev/null
            producer_zip="$root/unbound-trigger-producer-intent-${pr}.zip"
            gh_read "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$producer_zip"
            test "$artifact_digest" = "sha256:$(sha256sum "$producer_zip" | cut -d' ' -f1)"
            test "$(unzip -Z1 "$producer_zip" | grep -Fxc dispatch-request.json)" -eq 1
            test "$(unzip -Z1 "$producer_zip" | grep -Fxc intent.json)" -eq 1
            request="$root/unbound-trigger-request-${pr}.json"
            intent="$root/unbound-trigger-intent-${pr}.json"
            unzip -p "$producer_zip" dispatch-request.json > "$request"
            unzip -p "$producer_zip" intent.json > "$intent"
            producer_workflow_sha="$(jq -r '.producer.workflow_sha // empty' "$intent")"
            [[ "$producer_workflow_sha" =~ ^[0-9a-f]{40}$ ]]
            trusted_continuation_event_binding "$producer" "$pr" "$ref" "$head" "$base_ref" "$base" "$producer_workflow_sha"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" --arg pr "$pr" --arg ref "$ref" \
              --arg head "$head" --arg tree "$tree" --arg base_ref "$base_ref" --arg base "$base" \
              --arg producer_run_id "$TRIGGER_POINTER_PRODUCER_RUN_ID" \
              --arg producer_run_attempt "$TRIGGER_POINTER_PRODUCER_RUN_ATTEMPT" \
              --arg producer_workflow_id "$producer_workflow_id" \
              --arg producer_workflow_sha "$producer_workflow_sha" \
              --arg causal_attempt "$TRIGGER_POINTER_CAUSAL_ATTEMPT" '
              .event_type == "qikvrt_autonomous_exact_head_verify" and
              (.client_payload | keys) == ["causal","producer","repository","schema","subject"] and
              .client_payload.schema == "qikvrt_autonomous_exact_head_verify_dispatch_v1" and
              .client_payload.repository == $repository and
              .client_payload.subject == {pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base} and
              .client_payload.producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha} and
              .client_payload.causal == {attempt:($causal_attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false}
            ' "$request" >/dev/null
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" --arg pr "$pr" --arg head "$head" --arg tree "$tree" \
              --arg base_ref "$base_ref" --arg base "$base" \
              --arg producer_run_id "$TRIGGER_POINTER_PRODUCER_RUN_ID" \
              --arg producer_run_attempt "$TRIGGER_POINTER_PRODUCER_RUN_ATTEMPT" \
              --arg producer_workflow_id "$producer_workflow_id" \
              --arg producer_workflow_sha "$producer_workflow_sha" \
              --arg causal_attempt "$TRIGGER_POINTER_CAUSAL_ATTEMPT" \
              --arg request_sha256 "$(sha256sum "$request" | cut -d' ' -f1)" '
              .schema == "qikvrt.autonomous-exact-head-transport-intent.v1" and
              .repository == $repository and .pull_request == ($pr|tonumber) and
              .head_sha == $head and .head_tree_sha == $tree and
              .base_ref == $base_ref and .base_sha == $base and
              .producer == {run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha} and
              .attempt == ($causal_attempt|tonumber) and
              .request_sha256 == $request_sha256 and
              .productive_effect == false and .effect_ack == "NOT_REQUIRED"
            ' "$intent" >/dev/null
            witness_state="$(trusted_dispatch_witness_state \
              "$pr" "$ref" "$head" "$tree" "$base_ref" "$base")"
            case "${TRIGGER_POINTER_CAUSAL_ATTEMPT}:${witness_state}" in
              1:none|1:attempt1) printf '%s\n' authority ;;
              1:attempt1_attempt2|2:attempt1_attempt2) printf '%s\n' authority ;;
              *) printf '%s\n' authority ;;
            esac
          }

          # Exact-verifier runs execute on trusted main, so their run head is not
          # the candidate SHA.  Discover them through the trusted binder artifact,
          # never through a mutable display title or a bare commit status.
          trusted_verifier_run_status() {
            local pr="$1" ref="$2" head="$3" tree="$4" base_ref="$5" base="$6"
            local workflow workflow_id run_pages cutoff run run_id run_attempt run_status
            local artifacts artifact_prefix artifact binding_attempt artifact_id artifact_digest binding_zip binding_file
            local jobs producer producer_id producer_attempt producer_workflow_id producer_request producer_intent
            workflow="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")"
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            if ! jq -e '
              (.id | type) == "number" and .id > 0 and
              .path == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
              .state == "active"
            ' <<<"$workflow" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi

            # Binding artifacts share the verifier's retention horizon. Search
            # only this stable workflow and retention window, never the entire
            # repository artifact population.
            cutoff="$(date -u -d '90 days ago' +%Y-%m-%d)"
            run_pages="$root/verifier-run-pages-${pr}.json"
            if ! gh_read --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?event=repository_dispatch&created=%3E%3D${cutoff}&per_page=100" \
              > "$run_pages" ||
               ! jq -e '
                 length > 0 and
                 ([.[].total_count] | unique | length) == 1 and
                 (.[0].total_count | type) == "number" and
                 ([.[] | .workflow_runs[]] | length) == .[0].total_count
               ' "$run_pages" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi

            : > "$root/verifier-binding-valid-${pr}.jsonl"
            while IFS= read -r run; do
              [ -n "$run" ] || continue
              run_id="$(jq -r '.id // ""' <<<"$run")"
              run_attempt="$(jq -r '.run_attempt' <<<"$run")"
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || continue
              [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]] || continue
              jq -e \
                --argjson run_id "$run_id" \
                --argjson run_attempt "$run_attempt" \
                --argjson workflow_id "$workflow_id" \
                --arg repository "$GITHUB_REPOSITORY" '
                .id == $run_id and .run_attempt == $run_attempt and .workflow_id == $workflow_id and
                (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
                .event == "repository_dispatch" and .head_branch == "main" and
                .repository.full_name == $repository
              ' <<<"$run" >/dev/null || continue

              if ! gh_read --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                > "$root/verifier-artifact-pages-${pr}-${run_id}.json"; then
                continue
              fi
              artifacts="$root/verifier-artifact-pages-${pr}-${run_id}.json"
              jq -e '
                length > 0 and
                ([.[].total_count] | unique | length) == 1 and
                (.[0].total_count | type) == "number" and
                ([.[] | .artifacts[]] | length) == .[0].total_count
              ' "$artifacts" >/dev/null || continue
              artifact_prefix="qikvrt-exact-head-binding-${pr}-${head}-run-${run_id}-attempt-"
              artifact="$(jq -c --arg prefix "$artifact_prefix" --argjson current "$run_attempt" '
                [.[] | .artifacts[] |
                  select(.expired == false and (.name | startswith($prefix))) |
                  . + {binding_attempt:(.name | split("-attempt-")[-1] | tonumber?)} |
                  select((.binding_attempt | type) == "number" and
                         .binding_attempt > 0 and .binding_attempt <= $current)] |
                sort_by(.binding_attempt,.created_at,.id) | last // empty
              ' "$artifacts")"
              [ -n "$artifact" ] || continue
              artifact_id="$(jq -r '.id // ""' <<<"$artifact")"
              artifact_digest="$(jq -r '.digest // ""' <<<"$artifact")"
              binding_attempt="$(jq -r '.binding_attempt // ""' <<<"$artifact")"
              [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || continue
              [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || continue
              [[ "$binding_attempt" =~ ^[1-9][0-9]*$ ]] || continue
              jq -e --argjson run_id "$run_id" --arg workflow_sha "$(jq -r '.head_sha' <<<"$run")" '
                .workflow_run.id == $run_id and .workflow_run.head_branch == "main" and
                .workflow_run.head_sha == $workflow_sha
              ' <<<"$artifact" >/dev/null || continue

              gh_read --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=all&per_page=100" \
                > "$root/verifier-binding-job-pages-${pr}-${run_id}.json"
              jobs="$root/verifier-binding-job-pages-${pr}-${run_id}.json"
              jq -e --argjson binding_attempt "$binding_attempt" '
                length > 0 and
                (.[0].total_count | type == "number") and
                ([.[] | .jobs[]] | length) == .[0].total_count and
                ([.[] | .jobs[] | select(
                  .name == "Bind exact trusted dispatch subject" and
                  .run_attempt == $binding_attempt and
                  .status == "completed" and .conclusion == "success"
                )] | length) == 1
              ' "$jobs" >/dev/null || continue
              binding_zip="$root/verifier-binding-${pr}-${run_id}.zip"
              gh_read "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$binding_zip"
              [ "$artifact_digest" = "sha256:$(sha256sum "$binding_zip" | cut -d' ' -f1)" ] || continue
              [ "$(unzip -Z1 "$binding_zip" | wc -l)" -eq 3 ] || continue
              unzip -Z1 "$binding_zip" | grep -Fxq binding.json || continue
              unzip -Z1 "$binding_zip" | grep -Fxq producer-request.json || continue
              unzip -Z1 "$binding_zip" | grep -Fxq producer-intent.json || continue
              binding_file="$root/verifier-binding-${pr}-${run_id}.json"
              producer_request="$root/verifier-producer-request-${pr}-${run_id}.json"
              producer_intent="$root/verifier-producer-intent-${pr}-${run_id}.json"
              unzip -p "$binding_zip" binding.json > "$binding_file"
              unzip -p "$binding_zip" producer-request.json > "$producer_request"
              unzip -p "$binding_zip" producer-intent.json > "$producer_intent"
              jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg pr "$pr" --arg ref "$ref" --arg head "$head" --arg tree "$tree" \
                --arg base_ref "$base_ref" --arg base "$base" \
                --arg run_id "$run_id" --arg binding_attempt "$binding_attempt" --arg run_attempt "$run_attempt" \
                --arg workflow_ref "${GITHUB_REPOSITORY}/.github/workflows/qikvrt_autonomous_exact_head_verify.yml@refs/heads/main" \
                --arg workflow_sha "$(jq -r '.head_sha' <<<"$run")" \
                --arg request_sha256 "$(sha256sum "$producer_request" | cut -d' ' -f1)" \
                --arg intent_sha256 "$(sha256sum "$producer_intent" | cut -d' ' -f1)" '
                .schema == "qikvrt.autonomous-exact-head-dispatch-binding.v1" and
                .repository == $repository and .pull_request == ($pr|tonumber) and
                .head_repository == $repository and .head_ref == $ref and
                .head_sha == $head and .head_tree_sha == $tree and
                .base_ref == $base_ref and .base_sha == $base and
                .run_id == ($run_id|tonumber) and
                .run_attempt == ($binding_attempt|tonumber) and .run_attempt <= ($run_attempt|tonumber) and
                .workflow_ref == $workflow_ref and .workflow_sha == $workflow_sha and
                .causal.attempt == 1 and
                (.causal | del(.attempt)) == {d0:2,state:"REOBSERVE",productive_effect:false} and
                .classification == "TRUSTED_DISPATCH_BINDING_ONLY" and
                .trusted_terminal_verification == false and .productive_effect == false and
                (.producer.run_id | type) == "number" and .producer.run_id > 0 and
                (.producer.run_attempt | type) == "number" and .producer.run_attempt > 0 and
                (.producer.workflow_id | type) == "number" and .producer.workflow_id > 0 and
                .producer.workflow_path == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
                (.producer.workflow_sha | test("^[0-9a-f]{40}$")) and
                (.producer.continuation_artifact.id | type) == "number" and
                .producer.continuation_artifact.id > 0 and
                (.producer.continuation_artifact.digest | test("^sha256:[0-9a-f]{64}$")) and
                .producer.sealed_transport == {request_file:"producer-request.json",request_sha256:$request_sha256,intent_file:"producer-intent.json",intent_sha256:$intent_sha256}
              ' "$binding_file" >/dev/null || continue

              producer_id="$(jq -r '.producer.run_id' "$binding_file")"
              producer_attempt="$(jq -r '.producer.run_attempt' "$binding_file")"
              producer_workflow_id="$(jq -r '.producer.workflow_id' "$binding_file")"
              producer="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_id}/attempts/${producer_attempt}")"
              jq -e \
                --argjson attempt "$producer_attempt" \
                --argjson workflow_id "$producer_workflow_id" \
                --arg repository "$GITHUB_REPOSITORY" '
                .run_attempt == $attempt and .workflow_id == $workflow_id and
                (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
                .repository.full_name == $repository
              ' <<<"$producer" >/dev/null || continue
              trusted_continuation_event_binding "$producer" "$pr" "$ref" "$head" "$base_ref" "$base" \
                "$(jq -r '.producer.workflow_sha' "$binding_file")" || continue
              gh_read --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_id}/attempts/${producer_attempt}/jobs?filter=all&per_page=100" \
                > "$root/verifier-producer-job-pages-${pr}-${run_id}.json"
              jq -e \
                --argjson run_id "$producer_id" \
                --argjson run_attempt "$producer_attempt" '
                length > 0 and
                ([.[].total_count] | unique | length) == 1 and
                (.[0].total_count | type == "number") and
                ([.[] | .jobs[]] | length) == .[0].total_count and
                ([.[] | .jobs[] | select(
                  .name == "Preserve exact-head transport intent before dispatch" and
                  .run_id == $run_id and .run_attempt == $run_attempt and
                  .status == "completed" and .conclusion == "success"
                )] | length) == 1
              ' "$root/verifier-producer-job-pages-${pr}-${run_id}.json" >/dev/null || continue
              jq -e \
                --arg repository "$GITHUB_REPOSITORY" --arg pr "$pr" --arg ref "$ref" \
                --arg head "$head" --arg tree "$tree" --arg base_ref "$base_ref" --arg base "$base" \
                --arg producer_run_id "$producer_id" --arg producer_run_attempt "$producer_attempt" \
                --arg producer_workflow_id "$producer_workflow_id" \
                --arg producer_workflow_sha "$(jq -r '.producer.workflow_sha' "$binding_file")" \
                --arg causal_attempt "$(jq -r '.causal.attempt' "$binding_file")" '
                .event_type == "qikvrt_autonomous_exact_head_verify" and
                .client_payload == {schema:"qikvrt_autonomous_exact_head_verify_dispatch_v1",repository:$repository,subject:{pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base},producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha},causal:{attempt:($causal_attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false}}
              ' "$producer_request" >/dev/null || continue
              jq -e --arg request_sha256 "$(sha256sum "$producer_request" | cut -d' ' -f1)" \
                --arg causal_attempt "$(jq -r '.causal.attempt' "$binding_file")" '
                .schema == "qikvrt.autonomous-exact-head-transport-intent.v1" and
                .attempt == ($causal_attempt|tonumber) and .request_sha256 == $request_sha256 and
                .productive_effect == false and .effect_ack == "NOT_REQUIRED"
              ' "$producer_intent" >/dev/null || continue
              jq -nc \
                --argjson run_id "$run_id" \
                --argjson run_attempt "$run_attempt" \
                --arg created_at "$(jq -r '.created_at // ""' <<<"$run")" \
                --arg status "$(jq -r '.status // ""' <<<"$run")" \
                --arg conclusion "$(jq -r '.conclusion // ""' <<<"$run")" \
                '{run_id:$run_id,run_attempt:$run_attempt,created_at:$created_at,status:$status,conclusion:$conclusion}' \
                >> "$root/verifier-binding-valid-${pr}.jsonl"
            done < <(jq -c --arg prefix "qikvrt-exact-head-pr-${pr}-sha-${head}-producer-" '
              [.[] | .workflow_runs[] |
                select((.display_title // "") | startswith($prefix))] |
              sort_by(.created_at,.id) | reverse[]
            ' "$run_pages")
            if [ ! -s "$root/verifier-binding-valid-${pr}.jsonl" ]; then
              printf '%s\t%s\n' missing false
              return 0
            fi
            latest="$(head -n 1 "$root/verifier-binding-valid-${pr}.jsonl")"
            if [ "$(jq -r '.status' <<<"$latest")" != completed ]; then
              printf '%s\t%s\t%s\t%s\t%s\n' pending true \
                "$(jq -r '.run_id' <<<"$latest")" "$(jq -r '.run_attempt' <<<"$latest")" "$(jq -r '.created_at' <<<"$latest")"
            elif [ "$(jq -r '.conclusion' <<<"$latest")" = success ]; then
              # Success without a validated publisher receipt is incomplete
              # continuation, never a reason to dispatch the same subject again.
              printf '%s\t%s\t%s\t%s\t%s\n' pending true \
                "$(jq -r '.run_id' <<<"$latest")" "$(jq -r '.run_attempt' <<<"$latest")" "$(jq -r '.created_at' <<<"$latest")"
            else
              printf '%s\t%s\t%s\t%s\t%s\n' failure true \
                "$(jq -r '.run_id' <<<"$latest")" "$(jq -r '.run_attempt' <<<"$latest")" "$(jq -r '.created_at' <<<"$latest")"
            fi
          }

          # A commit status is only a pointer.  Treat it as trusted input after
          # binding its publisher run, stable workflow identity, exact subject,
          # producer run, publisher job and content-addressed receipt.  Candidate
          # self-check success closes only this bounded candidate-check scope; it
          # cannot terminalize independent exact-head review or any release gate.
          trusted_self_check_status() {
            local pr="$1" ref="$2" head="$3" tree="$4" base_ref="$5" base="$6"
            local context status target_url run_id workflow workflow_id run run_attempt
            local publisher_jobs publisher_count artifacts artifact artifact_id artifact_digest
            local receipt_zip receipt producer producer_id producer_attempt producer_workflow_id
            local producer_jobs producer_artifact_id producer_artifact_digest producer_request producer_dispatch_intent
            local binding_artifact_id binding_artifact_digest binding_attempt binding_artifact binding_zip binding_file
            context='QIKVRT autonomous candidate self-check'

            gh_read --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${head}/statuses?per_page=100" \
              > "$root/self-check-status-pages-${pr}.json"
            jq '[.[] | .[]]' "$root/self-check-status-pages-${pr}.json" \
              > "$root/self-check-statuses-${pr}.json"
            status="$(jq -c --arg context "$context" \
              '[.[] | select(.context == $context)] | sort_by(.id,.created_at) | last // empty' \
              "$root/self-check-statuses-${pr}.json")"
            if [ -z "$status" ]; then
              printf '%s\t%s\n' missing false
              return 0
            fi
            target_url="$(jq -r '.target_url // ""' <<<"$status")"
            case "$target_url" in
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/"*) ;;
              *) printf '%s\t%s\n' incomplete false; return 0 ;;
            esac
            run_id="${target_url##*/}"
            case "$run_id" in ''|*[!0-9]*) printf '%s\t%s\n' incomplete false; return 0 ;; esac

            workflow="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")"
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            test "$(jq -r '.path' <<<"$workflow")" = '.github/workflows/qikvrt_autonomous_exact_head_verify.yml' || {
              printf '%s\t%s\n' incomplete false
              return 0
            }
            run="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if ! jq -e \
              --argjson workflow_id "$workflow_id" \
              --arg repository "$GITHUB_REPOSITORY" \
              '.workflow_id == $workflow_id and (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and .event == "repository_dispatch" and .head_branch == "main" and .repository.full_name == $repository and .status == "completed"' \
              <<<"$run" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            run_attempt="$(jq -r '.run_attempt' <<<"$run")"

            gh_read --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=all&per_page=100" \
              > "$root/self-check-job-pages-${pr}.json"
            jq -e '
              length > 0 and ([.[].total_count] | unique | length) == 1 and
              (.[0].total_count | type == "number") and
              ([.[] | .jobs[]] | length) == .[0].total_count
            ' "$root/self-check-job-pages-${pr}.json" >/dev/null || {
              printf '%s\t%s\n' incomplete false
              return 0
            }
            jq -e --argjson attempt "$run_attempt" '
              ([.[] | .jobs[] | select(
                .name == "Read-only trusted-main publisher validation" and
                .run_attempt == $attempt and .status == "completed" and
                ([.steps[]? | select(
                  .name == "Seal read-only publisher validation result" and
                  .status == "completed" and .conclusion == "success"
                )] | length) == 1
              )] | length) == 1 and
              ([.[] | .jobs[] | select(
                .name == "Publish exact candidate status only" and
                .run_attempt == $attempt and .status == "completed" and
                ([.steps[]? | select(
                  .name == "Reobserve exact subject and publish only the validated status" and
                  .status == "completed" and .conclusion == "success"
                )] | length) == 1
              )] | length) == 1
            ' "$root/self-check-job-pages-${pr}.json" >/dev/null || {
              printf '%s\t%s\n' incomplete false
              return 0
            }
            publisher_jobs="$(jq --argjson attempt "$run_attempt" '[.[] | .jobs[] | select(
              .name == "Seal trusted-main publisher receipt" and
              .run_attempt == $attempt and .status == "completed" and
              ([.steps[]? | select(
                .name == "Preserve trusted publisher receipt" and
                .status == "completed" and .conclusion == "success"
              )] | length) == 1
            )]' \
              "$root/self-check-job-pages-${pr}.json")"
            publisher_count="$(jq 'length' <<<"$publisher_jobs")"
            if [ "$publisher_count" -ne 1 ]; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi

            gh_read --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              > "$root/self-check-artifact-pages-${pr}.json"
            jq -e '
              length > 0 and
              (.[0].total_count | type == "number") and
              ([.[] | .artifacts[]] | length) == .[0].total_count
            ' "$root/self-check-artifact-pages-${pr}.json" >/dev/null || {
              printf '%s\t%s\n' incomplete false
              return 0
            }
            artifacts="$(jq '[.[] | .artifacts[]]' "$root/self-check-artifact-pages-${pr}.json")"
            artifact="$(jq -c \
              --arg name "qikvrt-exact-head-publisher-${run_id}-${run_attempt}" \
              '[.[] | select(.name == $name and .expired == false)][0] // empty' \
              <<<"$artifacts")"
            if [ -z "$artifact" ]; then
              # A pre-POST review intent may already be durable even when this
              # later publisher receipt upload was cancelled. Expose the bound
              # source tuple to the scheduled outbox drainer.
              printf '%s\t%s\t%s\t%s\n' incomplete false "$run_id" "$run_attempt"
              return 0
            fi
            artifact_id="$(jq -r '.id' <<<"$artifact")"
            artifact_digest="$(jq -r '.digest // ""' <<<"$artifact")"
            if ! jq -e --argjson run_id "$run_id" --arg workflow_sha "$(jq -r '.head_sha' <<<"$run")" \
              '.workflow_run.id == $run_id and .workflow_run.head_branch == "main" and .workflow_run.head_sha == $workflow_sha' \
              <<<"$artifact" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            receipt_zip="$root/self-check-publisher-${pr}.zip"
            gh_read "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$receipt_zip"
            if [ "$artifact_digest" != "sha256:$(sha256sum "$receipt_zip" | cut -d' ' -f1)" ] || \
               [ "$(unzip -Z1 "$receipt_zip" | wc -l)" -ne 1 ] || \
               ! unzip -Z1 "$receipt_zip" | grep -Fxq publisher.json; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            receipt_file="$root/self-check-publisher-${pr}.json"
            expected_file="$root/self-check-expected-${pr}.json"
            validation_file="$root/self-check-validation-${pr}.json"
            unzip -p "$receipt_zip" publisher.json > "$receipt_file"
            jq -n \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg pr "$pr" \
              --arg head_repository "$GITHUB_REPOSITORY" \
              --arg ref "$ref" \
              --arg head "$head" \
              --arg tree "$tree" \
              --arg base_ref "$base_ref" \
              --arg base "$base" \
              --arg run_id "$run_id" \
              --arg run_attempt "$run_attempt" \
              --arg workflow_ref "${GITHUB_REPOSITORY}/.github/workflows/qikvrt_autonomous_exact_head_verify.yml@refs/heads/main" \
              --arg workflow_sha "$(jq -r '.head_sha' <<<"$run")" \
              '{repository:$repository,pull_request:($pr|tonumber),head_repository:$head_repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base,run_id:($run_id|tonumber),run_attempt:($run_attempt|tonumber),workflow_ref:$workflow_ref,workflow_sha:$workflow_sha}' \
              > "$expected_file"
            if ! python3 -B tools/qikvrt_pr_head_recovery.py \
              validate-publisher-receipt \
              --input "$receipt_file" \
              --expected "$expected_file" \
              --output "$validation_file"; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            receipt="$(<"$receipt_file")"

            binding_artifact_id="$(jq -r '.dispatch_binding.artifact.id // ""' <<<"$receipt")"
            binding_artifact_digest="$(jq -r '.dispatch_binding.artifact.digest // ""' <<<"$receipt")"
            binding_attempt="$(jq -r '.dispatch_binding.run_attempt // ""' <<<"$receipt")"
            if ! [[ "$binding_artifact_id" =~ ^[1-9][0-9]*$ ]] ||
               ! [[ "$binding_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
               ! [[ "$binding_attempt" =~ ^[1-9][0-9]*$ ]] ||
               [ "$binding_attempt" -gt "$run_attempt" ]; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            binding_artifact="$(jq -c \
              --arg name "qikvrt-exact-head-binding-${pr}-${head}-run-${run_id}-attempt-${binding_attempt}" \
              --argjson id "$binding_artifact_id" \
              '[.[] | select(.id == $id and .name == $name and .expired == false)][0] // empty' \
              <<<"$artifacts")"
            if [ -z "$binding_artifact" ] ||
               ! jq -e --arg digest "$binding_artifact_digest" --argjson run_id "$run_id" \
                 --arg workflow_sha "$(jq -r '.head_sha' <<<"$run")" '
                 .digest == $digest and .workflow_run.id == $run_id and
                 .workflow_run.head_branch == "main" and .workflow_run.head_sha == $workflow_sha
               ' <<<"$binding_artifact" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            binding_zip="$root/self-check-binding-${pr}.zip"
            if ! gh_read "repos/${GITHUB_REPOSITORY}/actions/artifacts/${binding_artifact_id}/zip" > "$binding_zip" ||
               [ "$binding_artifact_digest" != "sha256:$(sha256sum "$binding_zip" | cut -d' ' -f1)" ] ||
               [ "$(unzip -Z1 "$binding_zip" | wc -l)" -ne 3 ] ||
               [ "$(unzip -Z1 "$binding_zip" | grep -Fxc binding.json)" -ne 1 ] ||
               [ "$(unzip -Z1 "$binding_zip" | grep -Fxc producer-request.json)" -ne 1 ] ||
               [ "$(unzip -Z1 "$binding_zip" | grep -Fxc producer-intent.json)" -ne 1 ]; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            binding_file="$root/self-check-binding-${pr}.json"
            producer_request="$root/self-check-producer-request-${pr}.json"
            producer_dispatch_intent="$root/self-check-producer-dispatch-intent-${pr}.json"
            unzip -p "$binding_zip" binding.json > "$binding_file"
            unzip -p "$binding_zip" producer-request.json > "$producer_request"
            unzip -p "$binding_zip" producer-intent.json > "$producer_dispatch_intent"

            producer_id="$(jq -r '.producer.run_id' <<<"$receipt")"
            producer_attempt="$(jq -r '.producer.run_attempt' <<<"$receipt")"
            producer_workflow_id="$(jq -r '.producer.workflow_id' <<<"$receipt")"
            # The exact event accepted this immutable producer attempt.  Later
            # transport-only reruns must not revoke the publisher provenance.
            producer="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${producer_id}/attempts/${producer_attempt}")"
            producer_jobs_endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${producer_id}/attempts/${producer_attempt}/jobs?filter=all&per_page=100"
            if ! jq -e \
              --argjson attempt "$producer_attempt" \
              --argjson workflow_id "$producer_workflow_id" \
              --arg repository "$GITHUB_REPOSITORY" \
              '.run_attempt == $attempt and .workflow_id == $workflow_id and (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and .repository.full_name == $repository' \
              <<<"$producer" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            if ! trusted_continuation_event_binding "$producer" "$pr" "$ref" "$head" "$base_ref" "$base" \
              "$(jq -r '.producer.workflow_sha' <<<"$receipt")"; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi

            gh_read --paginate --slurp "$producer_jobs_endpoint" \
              > "$root/self-check-producer-job-pages-${pr}.json"
            if ! jq -e \
              --argjson run_id "$producer_id" \
              --argjson run_attempt "$producer_attempt" '
              length > 0 and
              (.[0].total_count | type == "number") and
              ([.[] | .jobs[]] | length) == .[0].total_count and
              ([.[] | .jobs[] | select(
                .name == "Preserve exact-head transport intent before dispatch" and
                .run_id == $run_id and .run_attempt == $run_attempt and
                .status == "completed" and .conclusion == "success"
              )] | length) == 1
            ' "$root/self-check-producer-job-pages-${pr}.json" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi

            producer_artifact_id="$(jq -r '.producer.continuation_artifact.id' <<<"$receipt")"
            producer_artifact_digest="$(jq -r '.producer.continuation_artifact.digest' <<<"$receipt")"
            if ! jq -e \
              --arg repository "$GITHUB_REPOSITORY" --arg pr "$pr" --arg ref "$ref" \
              --arg head "$head" --arg tree "$tree" --arg base_ref "$base_ref" --arg base "$base" \
              --arg run_id "$run_id" --arg binding_attempt "$binding_attempt" \
              --arg workflow_sha "$(jq -r '.head_sha' <<<"$run")" \
              --arg producer_run_id "$producer_id" --arg producer_run_attempt "$producer_attempt" \
              --arg producer_workflow_id "$producer_workflow_id" \
              --arg producer_workflow_sha "$(jq -r '.producer.workflow_sha' <<<"$receipt")" \
              --arg producer_artifact_id "$producer_artifact_id" \
              --arg producer_artifact_digest "$producer_artifact_digest" \
              --arg request_sha256 "$(sha256sum "$producer_request" | cut -d' ' -f1)" \
              --arg intent_sha256 "$(sha256sum "$producer_dispatch_intent" | cut -d' ' -f1)" '
              .schema == "qikvrt.autonomous-exact-head-dispatch-binding.v1" and
              .repository == $repository and .pull_request == ($pr|tonumber) and
              .head_repository == $repository and .head_ref == $ref and
              .head_sha == $head and .head_tree_sha == $tree and
              .base_ref == $base_ref and .base_sha == $base and
              .run_id == ($run_id|tonumber) and .run_attempt == ($binding_attempt|tonumber) and
              .workflow_sha == $workflow_sha and
              .producer.run_id == ($producer_run_id|tonumber) and
              .producer.run_attempt == ($producer_run_attempt|tonumber) and
              .producer.workflow_id == ($producer_workflow_id|tonumber) and
              .producer.workflow_path == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .producer.workflow_sha == $producer_workflow_sha and
              .producer.continuation_artifact == {id:($producer_artifact_id|tonumber),digest:$producer_artifact_digest} and
              .producer.sealed_transport == {request_file:"producer-request.json",request_sha256:$request_sha256,intent_file:"producer-intent.json",intent_sha256:$intent_sha256}
            ' "$binding_file" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            if ! jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg pr "$pr" \
              --arg ref "$ref" \
              --arg head "$head" \
              --arg tree "$tree" \
              --arg base_ref "$base_ref" \
              --arg base "$base" \
              --arg producer_run_id "$producer_id" \
              --arg producer_run_attempt "$producer_attempt" \
              --arg producer_workflow_id "$producer_workflow_id" \
              --arg producer_workflow_sha "$(jq -r '.producer.workflow_sha' <<<"$receipt")" '
              .event_type == "qikvrt_autonomous_exact_head_verify" and
              (.client_payload | keys | length) <= 10 and
              .client_payload.schema == "qikvrt_autonomous_exact_head_verify_dispatch_v1" and
              .client_payload.repository == $repository and
              .client_payload.subject.pull_request == ($pr|tonumber) and
              .client_payload.subject.head_repository == $repository and
              .client_payload.subject.head_ref == $ref and
              .client_payload.subject.head_sha == $head and
              .client_payload.subject.head_tree_sha == $tree and
              .client_payload.subject.base_ref == $base_ref and
              .client_payload.subject.base_sha == $base and
              .client_payload.producer.run_id == ($producer_run_id|tonumber) and
              .client_payload.producer.run_attempt == ($producer_run_attempt|tonumber) and
              .client_payload.producer.workflow_id == ($producer_workflow_id|tonumber) and
              .client_payload.producer.workflow_path == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .client_payload.producer.workflow_sha == $producer_workflow_sha and
              .client_payload.causal.attempt == 1 and
              (.client_payload.causal | del(.attempt)) == {d0:2,state:"REOBSERVE",productive_effect:false}
            ' "$producer_request" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            if ! jq -e \
              --arg repository "$GITHUB_REPOSITORY" --arg pr "$pr" --arg head "$head" --arg tree "$tree" \
              --arg base_ref "$base_ref" --arg base "$base" \
              --arg producer_run_id "$producer_id" --arg producer_run_attempt "$producer_attempt" \
              --arg producer_workflow_id "$producer_workflow_id" \
              --arg producer_workflow_sha "$(jq -r '.producer.workflow_sha' <<<"$receipt")" \
              --arg request_sha256 "$(sha256sum "$producer_request" | cut -d' ' -f1)" '
              .schema == "qikvrt.autonomous-exact-head-transport-intent.v1" and
              .repository == $repository and .pull_request == ($pr|tonumber) and
              .head_sha == $head and .head_tree_sha == $tree and
              .base_ref == $base_ref and .base_sha == $base and
              .producer.run_id == ($producer_run_id|tonumber) and
              .producer.run_attempt == ($producer_run_attempt|tonumber) and
              .producer.workflow_id == ($producer_workflow_id|tonumber) and
              .producer.workflow_path == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .producer.workflow_sha == $producer_workflow_sha and
              (.attempt == 1 or .attempt == 2) and
              .request_sha256 == $request_sha256 and
              .productive_effect == false and .effect_ack == "NOT_REQUIRED"
            ' "$producer_dispatch_intent" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi
            if ! jq -e --slurp '
              .[0].client_payload.causal.attempt == .[1].attempt
            ' "$producer_request" "$producer_dispatch_intent" >/dev/null; then
              printf '%s\t%s\n' incomplete false
              return 0
            fi

            published_state="$(jq -r '.published_state' <<<"$receipt")"
            case "$published_state" in
              success) printf '%s\t%s\n' self_check_success true ;;
              error|failure) printf '%s\t%s\n' failure true ;;
              *) printf '%s\t%s\n' incomplete false ;;
            esac
          }

          # Recover the narrow cancel window after an exact verifier persisted
          # its requested-review attempt-1 intent but before it could persist
          # the publisher receipt that gates the POST.  The immutable source
          # attempt and successful intent-upload step are authoritative; the
          # whole verifier job may be cancelled. Attempt 2 is the hard bound.
          trigger_exact_subject=false
          trigger_subject_pointer=false
          TRIGGER_POINTER_PR=''
          TRIGGER_POINTER_HEAD=''
          TRIGGER_POINTER_PRODUCER_RUN_ID=''
          TRIGGER_POINTER_PRODUCER_RUN_ATTEMPT=''
          TRIGGER_POINTER_CAUSAL_ATTEMPT=''
          if [ "$TRIGGER_EVENT_NAME" = workflow_run ] && \
             [ "$TRIGGER_WORKFLOW_PATH" = '.github/workflows/qikvrt_autonomous_exact_head_verify.yml' ] && \
             [[ "$TRIGGER_WORKFLOW_DISPLAY_TITLE" =~ ^qikvrt-exact-head-pr-([1-9][0-9]*)-sha-([0-9a-f]{40})-producer-([1-9][0-9]*)-([1-9][0-9]*)-attempt-([12])-intent=([0-9a-f]{64})-seq=([1-9][0-9]*)-transport-attempt=([12])$ ]] && \
             [ "${BASH_REMATCH[5]}" = "${BASH_REMATCH[8]}" ]; then
            TRIGGER_POINTER_PR="${BASH_REMATCH[1]}"
            TRIGGER_POINTER_HEAD="${BASH_REMATCH[2]}"
            TRIGGER_POINTER_PRODUCER_RUN_ID="${BASH_REMATCH[3]}"
            TRIGGER_POINTER_PRODUCER_RUN_ATTEMPT="${BASH_REMATCH[4]}"
            TRIGGER_POINTER_CAUSAL_ATTEMPT="${BASH_REMATCH[5]}"
            trigger_exact_subject=true
            trigger_subject_pointer=true
          elif [ "$TRIGGER_EVENT_NAME" = pull_request_target ]; then
            [[ "$TRIGGER_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ "$TRIGGER_PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$TRIGGER_PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
            test "$TRIGGER_PR_BASE_REF" = main
            TRIGGER_POINTER_PR="$TRIGGER_PR_NUMBER"
            TRIGGER_POINTER_HEAD="$TRIGGER_PR_HEAD_SHA"
            trigger_subject_pointer=true
          elif [ "$TRIGGER_EVENT_NAME" = workflow_run ]; then
            # For every non-exact workflow completion, bind an event-native PR
            # locator from the authenticated run projection.  Dynamic titles
            # are only a fallback locator for the requested-review executor;
            # the live PR tuple below remains the authority.
            trigger_run="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_WORKFLOW_RUN_ID}")"
            jq -e --argjson id "$TRIGGER_WORKFLOW_RUN_ID" \
              --argjson attempt "$TRIGGER_WORKFLOW_RUN_ATTEMPT" \
              --argjson workflow_id "$TRIGGER_WORKFLOW_ID" \
              --arg path "$TRIGGER_WORKFLOW_PATH" --arg repository "$GITHUB_REPOSITORY" '
              .id == $id and .run_attempt == $attempt and .workflow_id == $workflow_id and
              (.path | split("@")[0]) == $path and .repository.full_name == $repository
            ' <<<"$trigger_run" >/dev/null
            pointer_count="$(jq --arg repository "$GITHUB_REPOSITORY" '
              [.pull_requests[]? | select(
                .head.repo.full_name == $repository and .base.ref == "main"
              )] | length
            ' <<<"$trigger_run")"
            if [ "$pointer_count" -eq 1 ]; then
              TRIGGER_POINTER_PR="$(jq -r --arg repository "$GITHUB_REPOSITORY" '
                [.pull_requests[]? | select(
                  .head.repo.full_name == $repository and .base.ref == "main"
                )][0].number
              ' <<<"$trigger_run")"
              TRIGGER_POINTER_HEAD="$(jq -r --arg repository "$GITHUB_REPOSITORY" '
                [.pull_requests[]? | select(
                  .head.repo.full_name == $repository and .base.ref == "main"
                )][0].head.sha
              ' <<<"$trigger_run")"
              trigger_subject_pointer=true
            elif [ "$pointer_count" -eq 0 ] && \
                 [[ "$TRIGGER_WORKFLOW_DISPLAY_TITLE" =~ ^qikvrt-rr-v3\ e=[0-9a-f]{40}\ p=([1-9][0-9]*)\ h=([0-9a-f]{40})\ f=[0-9a-f]{64}\ i=[0-9a-f]{64}\ a=[12]$ ]]; then
              TRIGGER_POINTER_PR="${BASH_REMATCH[1]}"
              TRIGGER_POINTER_HEAD="${BASH_REMATCH[2]}"
              trigger_subject_pointer=true
            elif [ "$pointer_count" -gt 1 ]; then
              echo "Ambiguous workflow_run PR projection; refusing rank-based causal inference" >&2
              exit 1
            fi
          fi

          selected_pr=""
          selected_ref=""
          selected_head=""
          selected_tree=""
          selected_base_ref=""
          selected_base=""
          selected_action=""
          selected_source_run_id=""
          selected_source_run_attempt=""
          scope_limit=30

          if [ "$TRIGGER_EVENT_NAME" = schedule ]; then
            # RECOVERY_ONLY_DURABLE_OUTBOX_SCAN: the scheduled lane never
            # discovers arbitrary PRs or walks retained runs/artifacts.  The
            # dedicated O(1) FIFO consumer below reads exactly one durable slot.
            scope_limit=0
            printf '[]\n' > "$root/open-prs.json"
          else
            # Event-driven bounded discovery remains the explicitly scoped
            # newest-30 internal PR scan.
            gh_read "repos/${GITHUB_REPOSITORY}/pulls?state=open&sort=updated&direction=desc&per_page=${scope_limit}" \
              > "$root/open-prs.json"
          fi
          if [ "$trigger_subject_pointer" = true ]; then
            # A causal repository event already names one exact PR.  Observe it
            # directly and deterministically place it first, even when it ranks
            # below the supplemental newest-30 discovery window.
            gh_read "repos/${GITHUB_REPOSITORY}/pulls/${TRIGGER_POINTER_PR}" \
              > "$root/trigger-pointer-pr.json"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg pr "$TRIGGER_POINTER_PR" \
              --arg head "$TRIGGER_POINTER_HEAD" '
              .number == ($pr|tonumber) and .state == "open" and
              .head.repo.full_name == $repository and .head.sha == $head and
              .base.ref == "main"
            ' "$root/trigger-pointer-pr.json" >/dev/null
            jq -s --argjson limit "$scope_limit" '
              .[1] as $pointer |
              ([$pointer] + [.[0][] | select(.number != $pointer.number)])[:$limit]
            ' "$root/open-prs.json" "$root/trigger-pointer-pr.json" \
              > "$root/open-prs-prioritized.json"
            mv "$root/open-prs-prioritized.json" "$root/open-prs.json"
          fi
          while IFS=$'\t' read -r pr ref head base_ref base head_repo; do
            test -n "$pr" || continue
            if [ "$TRIGGER_EVENT_NAME" = workflow_run ] && \
               [ "$TRIGGER_WORKFLOW_PATH" = '.github/workflows/qikvrt_autonomous_exact_head_verify.yml' ]; then
              [ "$trigger_exact_subject" = true ] || continue
              [ "$pr" = "$TRIGGER_POINTER_PR" ] || continue
              [ "$head" = "$TRIGGER_POINTER_HEAD" ] || continue
            fi
            enumerated_fingerprint="$(
              printf '%s\0%s\0%s\0%s\0%s\0%s\0%s\0' \
                "$GITHUB_REPOSITORY" "$pr" "$head_repo" "$ref" "$head" "$base_ref" "$base" \
                | sha256sum | cut -d' ' -f1
            )"
            jq -nc \
              --arg fingerprint "$enumerated_fingerprint" \
              --arg pr "$pr" \
              --arg head_repository "$head_repo" \
              --arg head_ref "$ref" \
              --arg head_sha "$head" \
              --arg base_ref "$base_ref" \
              --arg base_sha "$base" \
              --arg repository "$GITHUB_REPOSITORY" \
              '{fingerprint:$fingerprint,pull_request:($pr|tonumber),head_repository:$head_repository,head_ref:$head_ref,head_sha:$head_sha,base_ref:$base_ref,base_sha:$base_sha,eligible_internal_main:($head_repository == $repository and $base_ref == "main")}' \
              >> "$root/scope-subjects.jsonl"
            if [ "$head_repo" != "$GITHUB_REPOSITORY" ] || [ "$base_ref" != main ]; then
              continue
            fi

            # A synchronize event may already have been consumed by the time this
            # run observes its ref. Re-read the PR once in this same run and bind
            # the new exact subject instead of stranding a declarative STALE_HEAD.
            for reobserve_attempt in 1 2; do
              live_ref="$(git ls-remote --heads origin "refs/heads/$ref" | awk 'NR == 1 {print $1}')"
              if [ "$live_ref" = "$head" ]; then
                break
              fi
              gh_read "repos/${GITHUB_REPOSITORY}/pulls/${pr}" > "$root/reobserved-pr-${pr}.json"
              if ! jq -e \
                --arg repository "$GITHUB_REPOSITORY" \
                '.state == "open" and .head.repo.full_name == $repository and .base.ref == "main"' \
                "$root/reobserved-pr-${pr}.json" >/dev/null; then
                break
              fi
              IFS=$'\t' read -r ref head base_ref base head_repo < <(
                jq -r '[.head.ref,.head.sha,.base.ref,.base.sha,.head.repo.full_name] | @tsv' \
                  "$root/reobserved-pr-${pr}.json"
              )
            done
            if [ "$live_ref" != "$head" ]; then
              subject_fingerprint="$(
                printf '%s\0%s\0%s\0%s\0%s\0%s\0' \
                  "$GITHUB_REPOSITORY" "$pr" "$ref" "$head" "$base_ref" "$base" \
                  | sha256sum | cut -d' ' -f1
              )"
              jq -nc \
                --arg pr "$pr" \
                --arg ref "$ref" \
                --arg head "$head" \
                --arg base_ref "$base_ref" \
                --arg base "$base" \
                --arg fingerprint "$subject_fingerprint" \
                '{pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,base_ref:$base_ref,base_sha:$base,subject_fingerprint:$fingerprint,d0:1,state:"HOLD",reason:"REPEATED_HEAD_REF_DRIFT",continuation:{schema:"qikvrt.causal-continuation.v1",mode:"AWAIT_EXACT_EVENT",owner:"REPOSITORY_EVENT_LOOP",next_action:"REOBSERVE_EXACT_PR_SUBJECT_AFTER_REF_TRANSITION",resume_events:["pull_request_target.synchronize","workflow_dispatch"],persistence_run_terminal:false,client_return_allowed:false},productive_effect:false,effect_ack:"NOT_REQUIRED"}' \
                >> "$root/decisions.jsonl"
              continue
            fi
            head_tree="$(gh_read "repos/${GITHUB_REPOSITORY}/git/commits/${head}" --jq '.tree.sha')"
            test "${#head_tree}" -eq 40
            subject_fingerprint="$(
              printf '%s\0%s\0%s\0%s\0%s\0%s\0%s\0' \
                "$GITHUB_REPOSITORY" "$pr" "$ref" "$head" "$head_tree" "$base_ref" "$base" \
                | sha256sum | cut -d' ' -f1
            )"

            gh_read --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}&per_page=100" \
              > "$root/run-pages-${pr}.json"
            python3 -B tools/qikvrt_pr_head_recovery.py flatten-runs \
              --input "$root/run-pages-${pr}.json" \
              --output "$root/runs-${pr}.json"
            : > "$root/observations-${pr}.jsonl"
            # Read one JSON object per line.  A tab-separated projection loses
            # an empty `conclusion` because Bash treats tab as IFS whitespace,
            # shifting `created_at` into the wrong field.
            while IFS= read -r run; do
              test -n "$run" || continue
              run_id="$(jq -r '.id' <<<"$run")"
              workflow_id="$(jq -r '.workflow_id' <<<"$run")"
              workflow_path="$(jq -r '.workflow_path' <<<"$run")"
              event="$(jq -r '.event' <<<"$run")"
              name="$(jq -r '.name' <<<"$run")"
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion' <<<"$run")"
              created_at="$(jq -r '.created_at' <<<"$run")"
              test -n "$run_id" || continue
              jobs_total=0
              if [ "$status" = completed ] && [ "$conclusion" != success ]; then
                jobs_total="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=1" --jq '.total_count')"
              elif [ "$status" = completed ] && [ "$conclusion" = success ]; then
                # A completed success is executed evidence; the classifier only
                # needs a positive witness, not the complete job inventory.
                jobs_total=1
              fi
              jq -nc \
                --argjson id "$run_id" \
                --argjson workflow_id "$workflow_id" \
                --arg workflow_path "$workflow_path" \
                --arg event "$event" \
                --arg name "$name" \
                --arg status "$status" \
                --arg conclusion "$conclusion" \
                --argjson jobs_total "$jobs_total" \
                --arg created_at "$created_at" \
                '{id:$id,workflow_id:$workflow_id,workflow_path:$workflow_path,event:$event,name:$name,status:$status,conclusion:(if $conclusion == "" then null else $conclusion end),jobs_total:$jobs_total,created_at:$created_at}' \
                >> "$root/observations-${pr}.jsonl"
            done < <(
              jq -c '.workflow_runs[] | select(.id != null) | {id,workflow_id,workflow_path:(.path // ""),event:(.event // ""),name,status,conclusion:(.conclusion // ""),created_at:(.created_at // "")}' \
                "$root/runs-${pr}.json"
            )
            jq -s '.' "$root/observations-${pr}.jsonl" > "$root/observations-${pr}.json"

            IFS=$'\t' read -r verifier_status trusted_verifier_source verifier_source_run_id verifier_source_run_attempt verifier_source_created_at < <(
              trusted_verifier_run_status \
                "$pr" "$ref" "$head" "$head_tree" "$base_ref" "$base"
            )
            IFS=$'\t' read -r publisher_status trusted_publisher_source publisher_source_run_id publisher_source_run_attempt < <(
              trusted_self_check_status \
                "$pr" "$ref" "$head" "$head_tree" "$base_ref" "$base"
            )
            publisher_source_created_at=''
            if [[ "$publisher_source_run_id" =~ ^[1-9][0-9]*$ ]]; then
              publisher_source_created_at="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/runs/${publisher_source_run_id}" --jq '.created_at // ""')"
            fi
            # A publisher may subsume a downstream transport cancellation only
            # in its own exact verifier attempt. A distinct newer bound verifier
            # failure must dominate an older status/publisher receipt.
            if [ "$trusted_publisher_source" = true ] && \
               [ "$trusted_verifier_source" = true ] && \
               [ "$verifier_status" = failure ] && \
               { [ "$verifier_source_run_id" != "$publisher_source_run_id" ] || \
                 [ "$verifier_source_run_attempt" != "$publisher_source_run_attempt" ]; } && \
               { [ "$verifier_source_run_id" = "$publisher_source_run_id" ] && \
                 [ "$verifier_source_run_attempt" -gt "$publisher_source_run_attempt" ] || \
                 [[ "$verifier_source_created_at" > "$publisher_source_created_at" ]] || \
                 [ "$verifier_source_created_at" = "$publisher_source_created_at" ]; }; then
              exact_head_status=failure
              trusted_exact_head_source=true
            elif [ "$trusted_publisher_source" = true ]; then
              exact_head_status="$publisher_status"
              trusted_exact_head_source=true
            elif [ "$trusted_verifier_source" = true ] && [ "$verifier_status" = failure ]; then
              exact_head_status=failure
              trusted_exact_head_source=true
            elif [ "$trusted_verifier_source" = true ]; then
              exact_head_status="$verifier_status"
              trusted_exact_head_source=true
            elif [ "$verifier_status" = missing ] && \
                 [ "$publisher_status" = missing ] && \
                 [ "$TRIGGER_EVENT_NAME" = workflow_run ] && \
                 [ "$TRIGGER_WORKFLOW_PATH" = '.github/workflows/qikvrt_autonomous_exact_head_verify.yml' ]; then
              exact_workflow_id="$(gh_read "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml" --jq '.id')"
              test "$TRIGGER_WORKFLOW_ID" = "$exact_workflow_id"
              test "$TRIGGER_WORKFLOW_HEAD_BRANCH" = main
              test "$TRIGGER_WORKFLOW_REPOSITORY" = "$GITHUB_REPOSITORY"
              retry_disposition="$(trusted_unbound_trigger_disposition \
                "$pr" "$ref" "$head" "$head_tree" "$base_ref" "$base")"
              case "$retry_disposition" in
                authority) exact_head_status=repeated_unbound_verifier_completion ;;
                *) echo "Invalid trusted unbound-trigger disposition: $retry_disposition" >&2; exit 1 ;;
              esac
              trusted_exact_head_source=true
            elif [ "$verifier_status" = missing ] && \
                 [ "$publisher_status" = missing ] && \
                 [ "$TRIGGER_EVENT_NAME" = schedule ]; then
              # Schedule consumes the protected Core FIFO in the dedicated jobs
              # below.  It never rediscovers or replays pre-Core artifact-only
              # transports, because their lack of a Binder cannot prove no POST.
              exact_head_status=repeated_or_ambiguous_exact_transport_orphan
              trusted_exact_head_source=true
            else
              exact_head_status="$publisher_status"
              trusted_exact_head_source=false
            fi
            classify_args=(
              --input "$root/observations-${pr}.json"
              --output "$root/decision-${pr}.json"
              --exact-head-status "$exact_head_status"
            )
            if [ "$trusted_exact_head_source" = true ]; then
              classify_args+=(--trusted-exact-head-source)
            fi
            python3 -B tools/qikvrt_pr_head_recovery.py classify \
              "${classify_args[@]}"

            # A prior trusted transport witness means this exact subject already
            # has an in-flight or completed verifier ordinal.  Hold for its
            # bound workflow edge instead of emitting another attempt.  Legacy
            # unbound completions are Authority; only the protected Core FIFO
            # may create the sole attempt-1 new-run transport.
            decision_reason="$(jq -r '.reason' "$root/decision-${pr}.json")"
            if [ "$TRIGGER_EVENT_NAME" = workflow_run ] && \
               [ "$TRIGGER_WORKFLOW_PATH" = '.github/workflows/qikvrt_autonomous_exact_head_verify.yml' ] && \
               [ "$decision_reason" = UNBOUND_VERIFIER_RETRY_ONCE ]; then
              # The exact workflow completion is an observation edge only.
              # The repository FIFO owns the sole attempt-1 transport;
              # emitting another transport here would violate one-shot delivery.
              python3 -B tools/qikvrt_pr_head_recovery.py classify \
                --input "$root/observations-${pr}.json" \
                --output "$root/decision-${pr}.json" \
                --exact-head-status pending \
                --trusted-exact-head-source
              decision_reason="$(jq -r '.reason' "$root/decision-${pr}.json")"
            fi
            if [ "$(jq -r '.d0' "$root/decision-${pr}.json")" -eq 2 ] && \
               ! { [ "$TRIGGER_EVENT_NAME" = workflow_run ] && \
                   [ "$TRIGGER_WORKFLOW_PATH" = '.github/workflows/qikvrt_autonomous_exact_head_verify.yml' ]; }; then
              dispatch_witness_state="$(trusted_dispatch_witness_state \
                "$pr" "$ref" "$head" "$head_tree" "$base_ref" "$base")"
              case "$dispatch_witness_state" in
                none) ;;
                attempt1|attempt1_attempt2)
                  python3 -B tools/qikvrt_pr_head_recovery.py classify \
                    --input "$root/observations-${pr}.json" \
                    --output "$root/decision-${pr}.json" \
                    --exact-head-status pending \
                    --trusted-exact-head-source
                  ;;
                attempt2_only|invalid)
                  python3 -B tools/qikvrt_pr_head_recovery.py classify \
                    --input "$root/observations-${pr}.json" \
                    --output "$root/decision-${pr}.json" \
                    --exact-head-status failure \
                    --trusted-exact-head-source
                  ;;
                *)
                  echo "Invalid dispatch witness state: $dispatch_witness_state" >&2
                  exit 1
                  ;;
              esac
            fi

            jq -c \
              --arg pr "$pr" \
              --arg ref "$ref" \
              --arg head "$head" \
              --arg tree "$head_tree" \
              --arg base_ref "$base_ref" \
              --arg base "$base" \
              --arg fingerprint "$subject_fingerprint" \
              '. + {pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base,subject_fingerprint:$fingerprint}' \
              "$root/decision-${pr}.json" >> "$root/decisions.jsonl"

            d0="$(jq -r '.d0' "$root/decision-${pr}.json")"
            if [ "$d0" -eq 2 ]; then
              selected_pr="$pr"
              selected_ref="$ref"
              selected_head="$head"
              selected_tree="$head_tree"
              selected_base_ref="$base_ref"
              selected_base="$base"
              selected_action=exact_head_reobserve
              break
            fi
          done < <(
            jq -r '.[] | [.number,.head.ref,.head.sha,.base.ref,.base.sha,.head.repo.full_name] | @tsv' \
              "$root/open-prs.json"
          )

          jq -s \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson limit "$scope_limit" \
            --arg kind "$(if [ "$TRIGGER_EVENT_NAME" = schedule ]; then printf '%s' RECOVERY_ONLY_DURABLE_OUTBOX_SCAN; else printf '%s' AUTONOMOUS_INTERNAL_PR_HEAD_SCAN; fi)" \
            '{kind:$kind,repository:$repository,limit:$limit,global_terminal:false,enumerated_count:length,observed_subject_fingerprints:([.[].fingerprint] | unique),eligible_subject_fingerprints:([.[] | select(.eligible_internal_main) | .fingerprint] | unique)}' \
            "$root/scope-subjects.jsonl" > "$root/scan-scope.json"

          if [ -z "$selected_pr" ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            if jq -e 'select(.d0 == 1 or .d0 == 2 or .d0 == 3)' "$root/decisions.jsonl" >/dev/null 2>&1; then
              # Preserve the first exact nonterminal subject and its machine-readable
              # continuation.  This includes a stale-head REOBSERVE entry that is
              # intentionally not dispatchable because its observed ref has moved.
              # A successful workflow transport is not a terminal persistence result
              # while that envelope forbids client return.
              jq -s \
                --arg event "$GITHUB_EVENT_NAME" \
                --slurpfile scope "$root/scan-scope.json" \
                '([.[] | select(.d0 == 3)][0] // [.[] | select(.d0 == 1 or .d0 == 2)][0]) + {event:$event,scope:$scope[0]}' \
                "$root/decisions.jsonl" \
                > "$root/decision-receipt.json"
              echo "NONTERMINAL/D0=1|2|3: exact-head continuation remains active"
            else
              jq -n \
                --arg event "$GITHUB_EVENT_NAME" \
                --slurpfile scope "$root/scan-scope.json" \
                '{d0:1,state:"HOLD",event:$event,scope:$scope[0],continuation:{schema:"qikvrt.causal-continuation.v1",mode:"AWAIT_EXACT_EVENT",owner:"REPOSITORY_EVENT_LOOP",next_action:(if $event == "schedule" then "REOBSERVE_ONLY_DURABLE_OUTBOX_SUBJECTS" else "REOBSERVE_BOUNDED_INTERNAL_PR_SCOPE_AFTER_DECLARED_EDGE" end),resume_events:["workflow_run.completed","pull_request_target.synchronize","workflow_dispatch","schedule"],persistence_run_terminal:false,client_return_allowed:false},productive_effect:false,effect_ack:"NOT_REQUIRED",reason:(if $event == "schedule" then "RECOVERY_OUTBOX_SCAN_HAS_NO_TERMINAL_CLAIM" else "BOUNDED_SCAN_HAS_NO_GLOBAL_TERMINAL_CLAIM" end)}' \
                > "$root/decision-receipt.json"
              echo "HOLD/D0=1: bounded scan has no global terminal claim"
            fi
            exit 0
          fi

          # Final exact reobservation immediately before exposing the REOBSERVE edge.
          gh_read "repos/${GITHUB_REPOSITORY}/pulls/${selected_pr}" \
            > "$root/selected-pr-reobserved.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$selected_ref" \
            --arg head "$selected_head" \
            --arg base_ref "$selected_base_ref" \
            --arg base "$selected_base" \
            '.state == "open" and .head.repo.full_name == $repository and .head.ref == $ref and .head.sha == $head and .base.ref == $base_ref and .base.sha == $base' \
            "$root/selected-pr-reobserved.json" >/dev/null
          live_ref="$(git ls-remote --heads origin "refs/heads/$selected_ref" | awk 'NR == 1 {print $1}')"
          test "$live_ref" = "$selected_head"
          test "$(gh_read "repos/${GITHUB_REPOSITORY}/git/commits/${selected_head}" --jq '.tree.sha')" = "$selected_tree"
          echo "selected=true" >> "$GITHUB_OUTPUT"
          echo "pr=$selected_pr" >> "$GITHUB_OUTPUT"
          echo "ref=$selected_ref" >> "$GITHUB_OUTPUT"
          echo "head=$selected_head" >> "$GITHUB_OUTPUT"
          echo "tree=$selected_tree" >> "$GITHUB_OUTPUT"
          echo "base_ref=$selected_base_ref" >> "$GITHUB_OUTPUT"
          echo "base=$selected_base" >> "$GITHUB_OUTPUT"
          echo "action=$selected_action" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$selected_source_run_id" >> "$GITHUB_OUTPUT"
          echo "source_run_attempt=$selected_source_run_attempt" >> "$GITHUB_OUTPUT"
          dispatch_attempt=1
          echo "attempt=$dispatch_attempt" >> "$GITHUB_OUTPUT"
          jq \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg action "$selected_action" \
            --slurpfile scope "$root/scan-scope.json" \
            '. + {event:$event,scope:$scope[0],selected_action:$action}' \
            "$root/decision-${selected_pr}.json" > "$root/decision-receipt.json"

      - name: Preserve causal continuation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-autonomous-pr-head-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: .qikvrt/autonomous-pr-head-continuation

  observe-exact-head-outbox-completion:
    name: Observe one exact verifier completion without ledger mutation
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.path == '.github/workflows/qikvrt_autonomous_exact_head_verify.yml' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.status == 'completed')
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: qikvrt-outbox-ledger-authority
    outputs:
      mutation: ${{ steps.observe.outputs.mutation }}
      sequence: ${{ steps.observe.outputs.sequence }}
      fingerprint: ${{ steps.observe.outputs.fingerprint }}
      observation_artifact_id: ${{ steps.observation_evidence.outputs.artifact-id }}
      observation_artifact_digest: ${{ steps.observation_evidence.outputs.artifact-digest }}
    env:
      TRIGGER_EVENT_NAME: ${{ github.event_name }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      TRIGGER_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
      TRIGGER_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
      TRIGGER_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
      TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      TRIGGER_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read one exact completion slot with Auditor-only authority
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          auditor_token="${LEDGER_AUDITOR_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$auditor_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          root="$RUNNER_TEMP/qikvrt-exact-head-completion"
          mkdir -p "$root"
          ledger_read() {
            QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$auditor_token" \
            QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
              python3 -B tools/qikvrt_ruleset_outbox.py "$@"
          }
          if [ "$TRIGGER_EVENT_NAME" = workflow_run ]; then
            title_re='^qikvrt-exact-head-pr-([1-9][0-9]*)-sha-([0-9a-f]{40})-producer-([1-9][0-9]*)-([1-9][0-9]*)-attempt-(1)-intent=([0-9a-f]{64})-seq=([1-9][0-9]*)-transport-attempt=(1)$'
            [[ "$TRIGGER_DISPLAY_TITLE" =~ $title_re ]]
            test "${BASH_REMATCH[5]}" = "${BASH_REMATCH[8]}"
            ledger_read --repository "$GITHUB_REPOSITORY" --receipt "$root/item.json" \
              lookup --lane exact-head-dispatch --sequence "${BASH_REMATCH[7]}" \
              --fingerprint "${BASH_REMATCH[6]}" >/dev/null
          else
            ledger_read --repository "$GITHUB_REPOSITORY" --receipt "$root/item.json" \
              next --lane exact-head-dispatch >/dev/null
          fi
          unset auditor_token

      - name: Reobserve and seal one exact completed result
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-completion"
          mkdir -p "$root"
          test -f "$root/item.json"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main" = "$GITHUB_WORKFLOW_SHA"

          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")"
          verifier_workflow_id="$(jq -r '.id // ""' <<<"$workflow")"
          [[ "$verifier_workflow_id" =~ ^[1-9][0-9]*$ ]]
          jq -e '
            .path == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
            .state == "active"
          ' <<<"$workflow" >/dev/null

          if [ "$TRIGGER_EVENT_NAME" = workflow_run ]; then
            test "$TRIGGER_REPOSITORY" = "$GITHUB_REPOSITORY"
            test "$TRIGGER_WORKFLOW_PATH" = '.github/workflows/qikvrt_autonomous_exact_head_verify.yml'
            test "$TRIGGER_WORKFLOW_ID" = "$verifier_workflow_id"
            test "$TRIGGER_HEAD_BRANCH" = main
            test "$TRIGGER_HEAD_SHA" = "$live_main"
            [[ "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$TRIGGER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            title_re='^qikvrt-exact-head-pr-([1-9][0-9]*)-sha-([0-9a-f]{40})-producer-([1-9][0-9]*)-([1-9][0-9]*)-attempt-(1)-intent=([0-9a-f]{64})-seq=([1-9][0-9]*)-transport-attempt=(1)$'
            [[ "$TRIGGER_DISPLAY_TITLE" =~ $title_re ]]
            pr="${BASH_REMATCH[1]}"
            head="${BASH_REMATCH[2]}"
            fingerprint="${BASH_REMATCH[6]}"
            sequence="${BASH_REMATCH[7]}"
            transport_attempt="${BASH_REMATCH[8]}"
            run_id="$TRIGGER_RUN_ID"
            run_attempt="$TRIGGER_RUN_ATTEMPT"
          else
            [ "$(jq -r '.state' "$root/item.json")" = PENDING ] || exit 0
            [ "$(jq '.acceptance | length' "$root/item.json")" -gt 0 ] || exit 0
            transport_attempt="$(jq -r '.acceptance | keys | map(tonumber) | max' "$root/item.json")"
            sequence="$(jq -r '.sequence' "$root/item.json")"
            fingerprint="$(jq -r '.fingerprint' "$root/item.json")"
            pr="$(jq -r '.intent.payload.subject.pull_request' "$root/item.json")"
            head="$(jq -r '.intent.payload.subject.head_sha' "$root/item.json")"
            run_id="$(jq -r --arg attempt "$transport_attempt" '.acceptance[$attempt].child.run_id' "$root/item.json")"
            latest_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            run_attempt="$(jq -r '.run_attempt' <<<"$latest_run")"
          fi

          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          test "$transport_attempt" = 1
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          jq -e --argjson sequence "$sequence" --arg fingerprint "$fingerprint" \
            --arg attempt "$transport_attempt" --arg pr "$pr" --arg head "$head" '
            (.lookup_state == "PENDING" or .lookup_state == "TERMINAL" or .state == "PENDING") and
            .sequence == $sequence and .fingerprint == $fingerprint and
            .intent.payload.subject.pull_request == ($pr|tonumber) and
            .intent.payload.subject.head_sha == $head and
            .acceptance[$attempt].child.run_id != null
          ' "$root/item.json" >/dev/null
          locator_attempt="$(jq -r --arg attempt "$transport_attempt" '.acceptance[$attempt].child.run_attempt' "$root/item.json")"
          locator_run_id="$(jq -r --arg attempt "$transport_attempt" '.acceptance[$attempt].child.run_id' "$root/item.json")"
          test "$locator_run_id" = "$run_id"
          if [ "$run_attempt" -ne "$locator_attempt" ] && \
             ! { [ "$locator_attempt" -eq 1 ] && [ "$run_attempt" -eq 2 ]; }; then
            echo "Unsupported exact verifier run-attempt transition" >&2
            exit 1
          fi

          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}")"
          jq -e --argjson run_id "$run_id" --argjson run_attempt "$run_attempt" \
            --argjson workflow_id "$verifier_workflow_id" --arg repository "$GITHUB_REPOSITORY" \
            --arg main "$live_main" --arg title "$TRIGGER_DISPLAY_TITLE" '
            .id == $run_id and .run_attempt == $run_attempt and
            .workflow_id == $workflow_id and
            (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
            .event == "repository_dispatch" and .repository.full_name == $repository and
            .head_branch == "main" and .head_sha == $main and
            .status == "completed" and
            ($title == "" or .display_title == $title)
          ' <<<"$run" >/dev/null
          title="$(jq -r '.display_title' <<<"$run")"
          conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
          [ -n "$conclusion" ]

          subject="$(jq -c '.intent.payload.subject' "$root/item.json")"
          ref="$(jq -r '.head_ref' <<<"$subject")"
          tree="$(jq -r '.head_tree_sha' <<<"$subject")"
          base_ref="$(jq -r '.base_ref' <<<"$subject")"
          base="$(jq -r '.base_sha' <<<"$subject")"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$ref" \
            --arg head "$head" --arg base_ref "$base_ref" --arg base "$base" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${head}" --jq '.tree.sha')" = "$tree"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}/jobs?filter=all&per_page=100" \
            > "$root/job-pages.json"
          jq -e '
            length > 0 and ([.[].total_count] | unique | length) == 1 and
            ([.[] | .jobs[]] | length) == .[0].total_count
          ' "$root/job-pages.json" >/dev/null
          jobs_total="$(jq '.[0].total_count' "$root/job-pages.json")"
          [ "$jobs_total" -gt 0 ] || exit 0
          if [ "$conclusion" = success ]; then
            jq -e --argjson attempt "$run_attempt" '
              [.[] | .jobs[] | select(
                .name == "Preserve immutable exact-head business result" and
                .run_attempt == $attempt and .status == "completed" and
                .conclusion == "success"
              )] | length == 1
            ' "$root/job-pages.json" >/dev/null
            terminal_job="$(jq -c --argjson attempt "$run_attempt" '
              [.[] | .jobs[] | select(
                .name == "Preserve immutable exact-head business result" and
                .run_attempt == $attempt and .status == "completed" and
                .conclusion == "success"
              )][0] | {id,name,run_attempt,status,conclusion}
            ' "$root/job-pages.json")"
          else
            terminal_job="$(jq -c --argjson attempt "$run_attempt" --arg conclusion "$conclusion" '
              [.[] | .jobs[] | select(
                .run_attempt == $attempt and .status == "completed" and
                .conclusion == $conclusion
              )] | sort_by(.started_at,.id) | first // empty |
              if . == "" then empty else {id,name,run_attempt,status,conclusion} end
            ' "$root/job-pages.json")"
            [ -n "$terminal_job" ] || exit 0
          fi

          artifact_name="qikvrt-exact-head-business-result-${run_id}-${run_attempt}"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=${artifact_name}&per_page=100" \
            > "$root/artifact-pages.json"
          jq -e --arg name "$artifact_name" --argjson run_id "$run_id" '
            length > 0 and ([.[].total_count] | unique | length) == 1 and
            ([.[] | .artifacts[]] | length) == .[0].total_count and
            ([.[] | .artifacts[] | select(
              .name == $name and .expired == false and .workflow_run.id == $run_id
            )] | length) == 1
          ' "$root/artifact-pages.json" >/dev/null || exit 0
          artifact="$(jq -c --arg name "$artifact_name" '
            [.[] | .artifacts[] | select(.name == $name and .expired == false)][0]
          ' "$root/artifact-pages.json")"
          artifact_id="$(jq -r '.id' <<<"$artifact")"
          archive_digest="$(jq -r '.digest // ""' <<<"$artifact")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$archive_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$root/result.zip"
          test "$archive_digest" = "sha256:$(sha256sum "$root/result.zip" | cut -d' ' -f1)"
          test "$(unzip -Z1 "$root/result.zip" | wc -l)" -eq 1
          unzip -Z1 "$root/result.zip" | grep -Fxq business-result.json
          unzip -p "$root/result.zip" business-result.json > "$root/business-result.json"
          payload_sha256="$(sha256sum "$root/business-result.json" | cut -d' ' -f1)"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg pr "$pr" \
            --arg head "$head" --arg tree "$tree" --arg ref "$ref" \
            --arg base_ref "$base_ref" --arg base "$base" \
            --argjson run_id "$run_id" --argjson run_attempt "$run_attempt" \
            --arg workflow_sha "$live_main" --argjson sequence "$sequence" \
            --arg fingerprint "$fingerprint" --argjson transport_attempt "$transport_attempt" '
            .schema == "qikvrt.exact-head-business-result.v1" and
            .repository == $repository and
            .subject == {pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base} and
            .verifier == {run_id:$run_id,run_attempt:$run_attempt,workflow_path:".github/workflows/qikvrt_autonomous_exact_head_verify.yml",workflow_sha:$workflow_sha} and
            .outbox == {lane:"exact-head-dispatch",sequence:$sequence,fingerprint:$fingerprint,transport_attempt:$transport_attempt} and
            .publisher.receipt.schema == "qikvrt.autonomous-candidate-self-check-publisher.v2" and
            .publisher.receipt.repository == $repository and
            .publisher.receipt.pull_request == ($pr|tonumber) and
            .publisher.receipt.head_sha == $head and
            (.publisher.receipt.published_state == "success" or .publisher.receipt.published_state == "error") and
            .state == "RESULT_BYTES_SEALED_AWAITING_WORKFLOW_COMPLETION" and
            .productive_effect == false and .effect_ack == "NOT_REQUIRED"
          ' "$root/business-result.json" >/dev/null

          jq -n --arg id "$artifact_id" --arg name "$artifact_name" \
            --arg archive "$archive_digest" --arg payload "$payload_sha256" \
            --arg run_id "$run_id" --arg run_attempt "$run_attempt" '
            {id:($id|tonumber),name:$name,archive_sha256:$archive,payload_sha256:$payload,producer_run_id:($run_id|tonumber),producer_run_attempt:($run_attempt|tonumber),verified:true}
          ' > "$root/artifact.json"
          jq -n --arg run_id "$run_id" --arg run_attempt "$run_attempt" \
            --arg jobs_total "$jobs_total" --argjson terminal_job "$terminal_job" \
            --slurpfile artifact "$root/artifact.json" '
            {schema:"qikvrt_ruleset_outbox_completion_evidence_v1",run_id:($run_id|tonumber),run_attempt:($run_attempt|tonumber),jobs_total_count:($jobs_total|tonumber),terminal_job:$terminal_job,artifact:$artifact[0],verified:true,productive_effect:false}
          ' > "$root/completion-evidence.json"
          jq -n --arg run_id "$run_id" --arg run_attempt "$run_attempt" \
            --arg workflow_id "$verifier_workflow_id" --arg repository "$GITHUB_REPOSITORY" \
            --arg head_sha "$live_main" --arg status completed --arg conclusion "$conclusion" \
            --arg title "$title" '
            {run_id:($run_id|tonumber),run_attempt:($run_attempt|tonumber),workflow_id:($workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_exact_head_verify.yml",event:"repository_dispatch",repository:$repository,head_sha:$head_sha,status:$status,conclusion:$conclusion,display_title:$title}
          ' > "$root/child.json"

          same_run=false
          mutation=COMPLETE
          if [ "$run_attempt" -ne "$locator_attempt" ]; then
            same_run=true
            mutation=OBSERVE_SAME_RUN_RESULT
          elif [ "$(jq -r '.lookup_state // .state' "$root/item.json")" = TERMINAL ]; then
            # A repeated completion edge for the immutable accepted attempt is
            # already represented by the terminal record.  Only a later
            # same-run attempt may append a historical result.
            echo "mutation=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          child_sha="$(python3 - "$root/child.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import digest
          print(digest(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))))
          PY
          )"
          completion_evidence_sha="$(python3 - "$root/completion-evidence.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import digest
          print(digest(json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))))
          PY
          )"

          lookup_state="$(jq -r '.lookup_state // .state' "$root/item.json")"
          if [ "$lookup_state" = TERMINAL ]; then
            # The Writer still appends the later same-run observation.  It must
            # not rewrite the immutable FIFO terminal or reopen its cursor.
            test "$same_run" = true
          fi
          if [ "$lookup_state" != TERMINAL ]; then
          if [ "$conclusion" = success ]; then
            locator_child_sha="$(jq -r --arg attempt "$transport_attempt" '.acceptance[$attempt].child_sha256' "$root/item.json")"
            evidence_sha="$(python3 - "$root/artifact.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import digest
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(digest(value))
          PY
            )"
            jq -n --slurpfile child "$root/child.json" --slurpfile artifact "$root/artifact.json" \
              --arg sequence "$sequence" --arg fingerprint "$fingerprint" \
              --arg attempt "$transport_attempt" --arg locator_child_sha "$locator_child_sha" \
              --arg child_sha "$child_sha" --arg completion_evidence_sha "$completion_evidence_sha" \
              --arg evidence_sha "$evidence_sha" --argjson same_run "$same_run" '
              {schema:"qikvrt_ruleset_outbox_terminal_evidence_v2",completion_claims:{physical_atari_boot:false,physical_atari_execution:false,merge:false,approval:false,pass:false,final_pass:false,publication:false,release:false,deployment:false,authority_mirror_synchronization:false,effect_ack_done:false},d0:2,state:"REOBSERVE",reason:"EXACT_HEAD_RESULT_PERSISTED",business_receipt:{schema:"qikvrt_ruleset_outbox_business_receipt_v1",lane:"exact-head-dispatch",sequence:($sequence|tonumber),fingerprint:$fingerprint,outcome:"EXACT_HEAD_TERMINAL_CONTINUATION",attempt:($attempt|tonumber),run_id:$child[0].run_id,run_attempt:$child[0].run_attempt,workflow_id:$child[0].workflow_id,workflow_path:$child[0].workflow_path,head_sha:$child[0].head_sha,locator_child_sha256:$locator_child_sha,child_sha256:$child_sha,child_recovery:false,same_run_result:$same_run,artifact:$artifact[0],completion_evidence_sha256:$completion_evidence_sha,evidence_sha256:$evidence_sha,verified:true,productive_effect:false},continuation:{schema:"qikvrt.causal-continuation.v1",mode:"AWAIT_EXACT_EVENT",owner:"REPOSITORY_EVENT_LOOP",next_action:"CONSUME_EXACT_BOUND_RESULT",resume_events:["workflow_run.completed","pull_request_target.synchronize","workflow_dispatch"],persistence_run_terminal:false,client_return_allowed:false},productive_effect:false,effect_ack:"NOT_REQUIRED"}
            ' > "$root/terminal.json"
          elif [ "$same_run" = true ]; then
            jq -n --slurpfile child "$root/child.json" --slurpfile item "$root/item.json" \
              --arg sequence "$sequence" --arg fingerprint "$fingerprint" \
              --arg attempt "$transport_attempt" --arg child_sha "$child_sha" '
              {schema:"qikvrt_ruleset_outbox_terminal_evidence_v2",completion_claims:{physical_atari_boot:false,physical_atari_execution:false,merge:false,approval:false,pass:false,final_pass:false,publication:false,release:false,deployment:false,authority_mirror_synchronization:false,effect_ack_done:false},d0:3,state:"REQUEST_AUTHORITY",reason:"SAME_RUN_EXACT_RESULT_ADVERSE",exhaustion:{schema:"qikvrt_ruleset_outbox_exhaustion_v1",lane:"exact-head-dispatch",sequence:($sequence|tonumber),fingerprint:$fingerprint,attempts:($item[0].transport|keys|map(tonumber)|sort),mode:"SAME_RUN_RESULT_ADVERSE",transport_attempt:($attempt|tonumber),successor:$child[0],successor_sha256:$child_sha,first_blocker:"SAME_RUN_EXACT_RESULT_ADVERSE",verified:true,productive_effect:false},continuation:{schema:"qikvrt.causal-continuation.v1",mode:"REQUEST_AUTHORITY",owner:"AUTHORITY_ADMIN",next_action:"INSPECT_LATEST_BOUND_EXACT_RESULT",resume_events:["workflow_dispatch","pull_request_target.synchronize"],persistence_run_terminal:false,client_return_allowed:false},productive_effect:false,effect_ack:"NOT_REQUIRED"}
            ' > "$root/terminal.json"
          else
            if [ "$transport_attempt" -eq 1 ]; then
              adverse_blocker=ATTEMPT_1_ACCEPTED_ADVERSE
            else
              adverse_blocker=REPEATED_EXACT_HEAD_RESULT_ADVERSE
            fi
            jq -n --slurpfile child "$root/child.json" --slurpfile item "$root/item.json" \
              --arg sequence "$sequence" --arg fingerprint "$fingerprint" \
              --arg attempt "$transport_attempt" --arg blocker "$adverse_blocker" \
              --arg child_sha "$child_sha" --arg completion_evidence_sha "$completion_evidence_sha" '
              {schema:"qikvrt_ruleset_outbox_terminal_evidence_v2",completion_claims:{physical_atari_boot:false,physical_atari_execution:false,merge:false,approval:false,pass:false,final_pass:false,publication:false,release:false,deployment:false,authority_mirror_synchronization:false,effect_ack_done:false},d0:3,state:"REQUEST_AUTHORITY",reason:$blocker,exhaustion:{schema:"qikvrt_ruleset_outbox_exhaustion_v1",lane:"exact-head-dispatch",sequence:($sequence|tonumber),fingerprint:$fingerprint,attempts:($item[0].transport|keys|map(tonumber)|sort),mode:"CHILD_RESULT_ADVERSE",transport_attempt:($attempt|tonumber),successor:$child[0],successor_sha256:$child_sha,completion_evidence_sha256:$completion_evidence_sha,first_blocker:$blocker,verified:true,productive_effect:false},continuation:{schema:"qikvrt.causal-continuation.v1",mode:"REQUEST_AUTHORITY",owner:"AUTHORITY_ADMIN",next_action:"INSPECT_BOUND_EXACT_RESULT",resume_events:["workflow_dispatch","pull_request_target.synchronize"],persistence_run_terminal:false,client_return_allowed:false},productive_effect:false,effect_ack:"NOT_REQUIRED"}
            ' > "$root/terminal.json"
          fi
          fi

          terminalize=false
          test -f "$root/terminal.json" && terminalize=true
          jq -n --arg mutation "$mutation" --arg sequence "$sequence" \
            --arg fingerprint "$fingerprint" --arg transport_attempt "$transport_attempt" \
            --argjson same_run "$same_run" --argjson terminalize "$terminalize" \
            '{schema:"qikvrt.exact-head-completion-mutation-plan.v1",lane:"exact-head-dispatch",mutation:$mutation,sequence:($sequence|tonumber),fingerprint:$fingerprint,transport_attempt:($transport_attempt|tonumber),same_run:$same_run,terminalize:$terminalize,productive_effect:false}' \
            > "$root/mutation-plan.json"
          echo "mutation=$mutation" >> "$GITHUB_OUTPUT"
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Preserve exact completion observation for one Writer CAS
        id: observation_evidence
        if: steps.observe.outputs.mutation != 'NONE' && steps.observe.outputs.mutation != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-head-completion-observation-${{ steps.observe.outputs.sequence }}-${{ steps.observe.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/qikvrt-exact-head-completion/mutation-plan.json
            ${{ runner.temp }}/qikvrt-exact-head-completion/item.json
            ${{ runner.temp }}/qikvrt-exact-head-completion/child.json
            ${{ runner.temp }}/qikvrt-exact-head-completion/completion-evidence.json
            ${{ runner.temp }}/qikvrt-exact-head-completion/artifact.json
            ${{ runner.temp }}/qikvrt-exact-head-completion/business-result.json
            ${{ runner.temp }}/qikvrt-exact-head-completion/terminal.json

  terminalize-exact-head-outbox-completion:
    name: Apply one exact completion CAS with Writer-only authority
    needs: observe-exact-head-outbox-completion
    if: >-
      needs.observe-exact-head-outbox-completion.outputs.mutation != '' &&
      needs.observe-exact-head-outbox-completion.outputs.mutation != 'NONE'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-exact-head-dispatch
      cancel-in-progress: false
      queue: max
    env:
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-exact-head-dispatch
      OUTBOX_SEQUENCE: ${{ needs.observe-exact-head-outbox-completion.outputs.sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.observe-exact-head-outbox-completion.outputs.fingerprint }}
      OBSERVATION_ARTIFACT_ID: ${{ needs.observe-exact-head-outbox-completion.outputs.observation_artifact_id }}
      OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-exact-head-outbox-completion.outputs.observation_artifact_digest }}
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact completion observation artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OBSERVATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$OBSERVATION_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${OBSERVATION_ARTIFACT_ID}")"
          jq -e --argjson id "$OBSERVATION_ARTIFACT_ID" \
            --arg name "qikvrt-exact-head-completion-observation-${OUTBOX_SEQUENCE}-${OUTBOX_FINGERPRINT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${OBSERVATION_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download exact completion observation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.observe-exact-head-outbox-completion.outputs.observation_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-head-completion-writer

      - name: Revalidate exact subject and completed verifier without ledger credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-completion-writer"
          for required in mutation-plan.json item.json child.json completion-evidence.json artifact.json business-result.json; do
            test -f "$root/$required"
          done
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"
          jq -e --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" '
            .schema == "qikvrt.exact-head-completion-mutation-plan.v1" and
            .lane == "exact-head-dispatch" and .sequence == $sequence and
            .fingerprint == $fingerprint and
            (.mutation == "COMPLETE" or .mutation == "OBSERVE_SAME_RUN_RESULT") and
            .productive_effect == false
          ' "$root/mutation-plan.json" >/dev/null
          pr="$(jq -r '.intent.payload.subject.pull_request' "$root/item.json")"
          ref="$(jq -r '.intent.payload.subject.head_ref' "$root/item.json")"
          head="$(jq -r '.intent.payload.subject.head_sha' "$root/item.json")"
          tree="$(jq -r '.intent.payload.subject.head_tree_sha' "$root/item.json")"
          base_ref="$(jq -r '.intent.payload.subject.base_ref' "$root/item.json")"
          base="$(jq -r '.intent.payload.subject.base_sha' "$root/item.json")"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$ref" --arg head "$head" \
            --arg base_ref "$base_ref" --arg base "$base" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${head}" --jq '.tree.sha')" = "$tree"
          run_id="$(jq -r '.run_id' "$root/child.json")"
          run_attempt="$(jq -r '.run_attempt' "$root/child.json")"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}")"
          jq -e --slurpfile child "$root/child.json" '
            .id == $child[0].run_id and .run_attempt == $child[0].run_attempt and
            .workflow_id == $child[0].workflow_id and
            (.path | split("@")[0]) == $child[0].workflow_path and
            .event == $child[0].event and .repository.full_name == $child[0].repository and
            .head_sha == $child[0].head_sha and .display_title == $child[0].display_title and
            .status == "completed" and .conclusion == $child[0].conclusion
          ' <<<"$run" >/dev/null

      - name: Apply exact completion and terminal CAS only
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          ledger_write() {
            QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
            QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
            QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
              python3 -B tools/qikvrt_ruleset_outbox.py "$@"
          }
          root="$RUNNER_TEMP/qikvrt-exact-head-completion-writer"
          mutation="$(jq -r '.mutation' "$root/mutation-plan.json")"
          transport_attempt="$(jq -r '.transport_attempt' "$root/mutation-plan.json")"
          if [ "$mutation" = COMPLETE ]; then
            ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/completion.json" \
              complete --lane exact-head-dispatch --sequence "$OUTBOX_SEQUENCE" \
              --attempt "$transport_attempt" --child "$root/child.json" \
              --evidence "$root/completion-evidence.json" >/dev/null
          else
            ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/completion.json" \
              observe-same-run-result --lane exact-head-dispatch \
              --sequence "$OUTBOX_SEQUENCE" --fingerprint "$OUTBOX_FINGERPRINT" \
              --transport-attempt "$transport_attempt" --child "$root/child.json" \
              --evidence "$root/completion-evidence.json" >/dev/null
          fi
          if [ "$(jq -r '.terminalize' "$root/mutation-plan.json")" = true; then
            test -f "$root/terminal.json"
            ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/terminal-receipt.json" \
              terminalize --lane exact-head-dispatch --sequence "$OUTBOX_SEQUENCE" \
              --evidence "$root/terminal.json" >/dev/null
          fi
          unset writer_token

  observe-exact-head-outbox-recovery:
    name: Observe one durable exact-head recovery ordinal
    needs: terminalize-exact-head-outbox-completion
    if: >-
      always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    outputs:
      action: ${{ steps.select.outputs.action }}
      sequence: ${{ steps.select.outputs.sequence }}
      fingerprint: ${{ steps.select.outputs.fingerprint }}
      attempt: ${{ steps.select.outputs.attempt }}
      blocker: ${{ steps.select.outputs.blocker }}
      selection_artifact_id: ${{ steps.selection_evidence.outputs.artifact-id }}
      selection_artifact_digest: ${{ steps.selection_evidence.outputs.artifact-digest }}
      cursor_artifact_id: ${{ steps.cursor_evidence.outputs.artifact-id }}
      cursor_artifact_digest: ${{ steps.cursor_evidence.outputs.artifact-digest }}
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read one exact recovery slot with Auditor-only authority
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          auditor_token="${LEDGER_AUDITOR_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$auditor_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          root="$RUNNER_TEMP/qikvrt-exact-head-outbox-recovery"
          mkdir -p "$root"
          QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$auditor_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" --receipt "$root/next.json" \
            next --lane exact-head-dispatch >/dev/null
          unset auditor_token

      - name: Reobserve exactly one FIFO slot and persist its next ordinal
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-outbox-recovery"
          mkdir -p "$root"
          test -f "$root/next.json"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$(jq -r '.state' "$root/next.json")" = EMPTY ]; then
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '
            .state == "PENDING" and .lane == "exact-head-dispatch" and
            (.sequence | type) == "number" and .sequence > 0 and
            (.fingerprint | test("^[0-9a-f]{64}$")) and
            .intent.payload.repository == $ENV.GITHUB_REPOSITORY and
            .intent.payload.lane == "exact-head-dispatch" and
            .intent.payload.request.event_type == "qikvrt_autonomous_exact_head_verify"
          ' "$root/next.json" >/dev/null
          sequence="$(jq -r '.sequence' "$root/next.json")"
          fingerprint="$(jq -r '.fingerprint' "$root/next.json")"
          main_head="$(jq -r '.intent.payload.main_head_sha' "$root/next.json")"
          pr="$(jq -r '.intent.payload.subject.pull_request' "$root/next.json")"
          ref="$(jq -r '.intent.payload.subject.head_ref' "$root/next.json")"
          head="$(jq -r '.intent.payload.subject.head_sha' "$root/next.json")"
          tree="$(jq -r '.intent.payload.subject.head_tree_sha' "$root/next.json")"
          base_ref="$(jq -r '.intent.payload.subject.base_ref' "$root/next.json")"
          base="$(jq -r '.intent.payload.subject.base_sha' "$root/next.json")"
          seal_authority_observation() {
            blocker="$1"
            test -f "$root/authority-observation.json"
            workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            jq -e --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              --argjson workflow_id "$workflow_id" --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
              .id == $run_id and .run_attempt == $run_attempt and .workflow_id == $workflow_id and
              (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .repository.full_name == $repository and .event == "schedule" and
              .head_branch == "main" and .head_sha == $workflow_sha
            ' <<<"$run" >/dev/null
            jq -n --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --argjson workflow_id "$workflow_id" \
              --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
              {workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$workflow_sha,workflow_id:$workflow_id,run_id:$run_id,run_attempt:$run_attempt,event:"schedule"}
            ' > "$root/producer.json"
            echo "action=TERMINALIZE" >> "$GITHUB_OUTPUT"
            echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
            echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "attempt=0" >> "$GITHUB_OUTPUT"
            echo "blocker=$blocker" >> "$GITHUB_OUTPUT"
          }
          if [ "$live_main" != "$GITHUB_WORKFLOW_SHA" ]; then
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$main_head" != "$live_main" ]; then
            python3 - "$root/next.json" "$root/authority-observation.json" "$live_main" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          value={'schema':AUTHORITY_OBSERVATION_SCHEMA,'blocker':'OUTBOX_EVALUATOR_SUPERSEDED','lane':'exact-head-dispatch','sequence':item['sequence'],'fingerprint':item['fingerprint'],'sealed_main_head_sha':item['intent']['payload']['main_head_sha'],'observed_main_head_sha':sys.argv[3],'verified':True,'productive_effect':False}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            seal_authority_observation OUTBOX_EVALUATOR_SUPERSEDED
            exit 0
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
          observed_head="$(jq -r '.head.sha' <<<"$current")"
          observed_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${observed_head}" --jq '.tree.sha')"
          jq -n --argjson pr "$pr" --arg repository "$(jq -r '.head.repo.full_name' <<<"$current")" \
            --arg ref "$(jq -r '.head.ref' <<<"$current")" --arg head "$observed_head" \
            --arg tree "$observed_tree" --arg base_ref "$(jq -r '.base.ref' <<<"$current")" \
            --arg base "$(jq -r '.base.sha' <<<"$current")" '
            {pull_request:$pr,head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base}
          ' > "$root/observed-subject.json"
          if ! jq -e --slurpfile observed "$root/observed-subject.json" \
            '.intent.payload.subject == $observed[0]' "$root/next.json" >/dev/null; then
            python3 - "$root/next.json" "$root/observed-subject.json" "$root/authority-observation.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA, digest
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          observed=json.loads(pathlib.Path(sys.argv[2]).read_text())
          sealed=item['intent']['payload']['subject']
          value={'schema':AUTHORITY_OBSERVATION_SCHEMA,'blocker':'OUTBOX_SUBJECT_SUPERSEDED','lane':'exact-head-dispatch','sequence':item['sequence'],'fingerprint':item['fingerprint'],'sealed_subject_sha256':digest(sealed),'observed_subject':observed,'observed_subject_sha256':digest(observed),'verified':True,'productive_effect':False}
          pathlib.Path(sys.argv[3]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            seal_authority_observation OUTBOX_SUBJECT_SUPERSEDED
            exit 0
          fi
          acceptance_count="$(jq '.acceptance | length' "$root/next.json")"
          if [ "$acceptance_count" -gt 0 ]; then
            jq -e --arg fingerprint "$fingerprint" --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow_sha "$main_head" '
              (.acceptance | length) <= 2 and
              ([.acceptance[] | select(
                .schema == "qikvrt_ruleset_outbox_acceptance_v1" and
                .fingerprint == $fingerprint and
                .state == "TRANSPORT_ACCEPTED_LOCATOR" and
                .productive_effect == false and
                .child.workflow_path == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
                .child.event == "repository_dispatch" and .child.repository == $repository and
                .child.head_sha == $workflow_sha and
                (.child.status == "queued" or .child.status == "in_progress" or
                 .child.status == "waiting" or .child.status == "pending" or
                 .child.status == "completed")
              )] | length) == (.acceptance | length)
            ' "$root/next.json" >/dev/null
            accepted_attempt="$(jq -r '.acceptance | keys | map(tonumber) | max | tostring' "$root/next.json")"
            jq -e --arg attempt "$accepted_attempt" '.acceptance[$attempt]' \
              "$root/next.json" > "$root/accepted.json"
            accepted_run_id="$(jq -r '.child.run_id' "$root/accepted.json")"
            accepted_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${accepted_run_id}")"
            jq -e --slurpfile accepted "$root/accepted.json" \
              --arg repository "$GITHUB_REPOSITORY" --arg workflow_sha "$main_head" '
              .id == $accepted[0].child.run_id and
              .workflow_id == $accepted[0].child.workflow_id and
              (.path | split("@")[0]) == $accepted[0].child.workflow_path and
              .event == "repository_dispatch" and .repository.full_name == $repository and
              .head_branch == "main" and .head_sha == $workflow_sha
            ' <<<"$accepted_run" >/dev/null
            accepted_status="$(jq -r '.status' <<<"$accepted_run")"
            if [ "$accepted_status" != completed ]; then
              echo "action=NONE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            latest_run_attempt="$(jq -r '.run_attempt' <<<"$accepted_run")"
            locator_run_attempt="$(jq -r '.child.run_attempt' "$root/accepted.json")"
            same_run_result=false
            if [ "$latest_run_attempt" -ne "$locator_run_attempt" ]; then
              test "$locator_run_attempt" -eq 1
              test "$latest_run_attempt" -eq 2
              same_run_result=true
            fi
            if [ "$same_run_result" = false ] && jq -e --arg attempt "$accepted_attempt" \
              '.completion[$attempt].child.conclusion == "success"' "$root/next.json" >/dev/null; then
              echo "Bound exact success was not terminalized by the completion consumer" >&2
              exit 1
            fi
            jq -e '{run_id:.id,run_attempt,workflow_id,workflow_path:(.path|split("@")[0]),event,repository:.repository.full_name,head_sha,status,conclusion,display_title}' \
              <<<"$accepted_run" > "$root/observed-child.json"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${accepted_run_id}/attempts/${latest_run_attempt}/jobs?filter=all&per_page=100" \
              > "$root/accepted-job-pages.json"
            jq -e '
              length > 0 and ([.[].total_count] | unique | length) == 1 and
              ([.[] | .jobs[]] | length) == .[0].total_count
            ' "$root/accepted-job-pages.json" >/dev/null
            jobs_total="$(jq '.[0].total_count' "$root/accepted-job-pages.json")"
            artifact_name="qikvrt-exact-head-business-result-${accepted_run_id}-${latest_run_attempt}"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${accepted_run_id}/artifacts?name=${artifact_name}&per_page=100" \
              > "$root/accepted-artifact-pages.json"
            jq -e '
              length > 0 and ([.[].total_count] | unique | length) == 1 and
              ([.[] | .artifacts[]] | length) == .[0].total_count
            ' "$root/accepted-artifact-pages.json" >/dev/null
            jq --arg name "$artifact_name" --argjson run_id "$accepted_run_id" \
              '[.[] | .artifacts[] | select(.name == $name and .workflow_run.id == $run_id)]' \
              "$root/accepted-artifact-pages.json" > "$root/accepted-artifacts.json"
            artifact_count="$(jq 'length' "$root/accepted-artifacts.json")"
            conclusion="$(jq -r '.conclusion // ""' "$root/observed-child.json")"
            test -n "$conclusion"
            if [ "$conclusion" = success ] && [ "$artifact_count" -eq 1 ] && [ "$jobs_total" -gt 0 ]; then
              python3 - "$root/next.json" "$root/observed-child.json" \
                "$root/authority-observation.json" "$accepted_attempt" "$same_run_result" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA, digest
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          child=json.loads(pathlib.Path(sys.argv[2]).read_text())
          attempt=str(int(sys.argv[4]))
          value={
              'schema':AUTHORITY_OBSERVATION_SCHEMA,
              'blocker':'REPEATED_EXACT_HEAD_RESULT_NOT_PERSISTED',
              'lane':'exact-head-dispatch','sequence':item['sequence'],
              'fingerprint':item['fingerprint'],'transport_attempt':int(attempt),
              'accepted_child_sha256':item['acceptance'][attempt]['child_sha256'],
              'observed_child':child,'observed_child_sha256':digest(child),
              'same_run_result':sys.argv[5] == 'true','completion_present':False,
              'business_receipt_present':False,'scan_complete':True,
              'verified':True,'productive_effect':False,
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
              seal_authority_observation REPEATED_EXACT_HEAD_RESULT_NOT_PERSISTED
              exit 0
            fi
            if [ "$artifact_count" -eq 0 ]; then
              evidence_classification=MISSING_ARTIFACT
            elif [ "$artifact_count" -gt 1 ]; then
              evidence_classification=DUPLICATE_ARTIFACTS
            elif [ "$jobs_total" -eq 0 ]; then
              evidence_classification=JOB_EVIDENCE_INVALID
            else
              # A single potentially valid artifact is left for the preceding
              # completion consumer on the next schedule.  It is never called
              # missing or invalid without actually validating those bytes.
              echo "action=NONE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python3 - "$root/next.json" "$root/observed-child.json" \
              "$root/accepted-artifacts.json" "$root/authority-observation.json" \
              "$accepted_attempt" "$same_run_result" "$jobs_total" \
              "$artifact_name" "$evidence_classification" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA, digest
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          child=json.loads(pathlib.Path(sys.argv[2]).read_text())
          artifacts=json.loads(pathlib.Path(sys.argv[3]).read_text())
          attempt=str(int(sys.argv[5]))
          value={
              'schema':AUTHORITY_OBSERVATION_SCHEMA,
              'blocker':'EXACT_HEAD_COMPLETION_EVIDENCE_MISSING',
              'lane':'exact-head-dispatch','sequence':item['sequence'],
              'fingerprint':item['fingerprint'],'transport_attempt':int(attempt),
              'accepted_child_sha256':item['acceptance'][attempt]['child_sha256'],
              'observed_child':child,'observed_child_sha256':digest(child),
              'same_run_result':sys.argv[6] == 'true','jobs_total_count':int(sys.argv[7]),
              'expected_artifact_name':sys.argv[8],
              'evidence_classification':sys.argv[9],'artifact_count':len(artifacts),
              'artifact_set_sha256':digest(artifacts),'scan_complete':True,
              'verified':True,'productive_effect':False,
          }
          pathlib.Path(sys.argv[4]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            seal_authority_observation EXACT_HEAD_COMPLETION_EVIDENCE_MISSING
            exit 0
          fi

          transport_keys="$(jq -r '.transport | keys | sort | join(",")' "$root/next.json")"
          if [ -z "$transport_keys" ]; then
            attempt=1
            python3 - "$root/next.json" "$root/request.json" "$attempt" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import request_for_transport_attempt
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(request_for_transport_attempt(item['intent'],int(sys.argv[3])),sort_keys=True,separators=(',',':'))+'\n')
          PY
            echo "action=PREPARE" >> "$GITHUB_OUTPUT"
            echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
            echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$transport_keys" = 1
          attempt="$(jq -r '.transport | keys | map(tonumber) | max' "$root/next.json")"
          test "$attempt" -eq 1
          cursor_state="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].state // ""' "$root/next.json")"
          candidate_count=0
          if [ "$cursor_state" = COMPLETE_SUCCESSOR_OBSERVED ] || \
             [ "$cursor_state" = AMBIGUITY_SET_EXCEEDED_AUTHORITY ]; then
            candidate_count="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.bound_successor_count' "$root/next.json")"
            if [ "$cursor_state" = COMPLETE_SUCCESSOR_OBSERVED ] && [ "$candidate_count" -eq 1 ]; then
              jq -e --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.candidate_locators[0]' \
                "$root/next.json" > "$root/child.json"
              echo "action=ADOPT" >> "$GITHUB_OUTPUT"
              echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
              echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
              echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if { [ "$cursor_state" = COMPLETE_SUCCESSOR_OBSERVED ] && [ "$candidate_count" -gt 1 ]; } ||
             [ "$cursor_state" = AMBIGUITY_SET_EXCEEDED_AUTHORITY ] ||
             [ "$cursor_state" = SCAN_BOUND_EXCEEDED_AUTHORITY ] ||
             [ "$cursor_state" = COMPLETE_ZERO_SUCCESSOR ]; then
            python3 - "$root/next.json" "$root/authority-observation.json" \
              "$attempt" "$live_main" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_exact_review_outbox import materialize_retry_cursor_authority_observation
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          value=materialize_retry_cursor_authority_observation(
              item=item,transport_attempt=int(sys.argv[3]),
              observed_main_head_sha=sys.argv[4])
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            blocker="$(jq -r '.blocker' "$root/authority-observation.json")"
            seal_authority_observation "$blocker"
            exit 0
          fi

          actor_run_id="$(jq -r --arg attempt "$attempt" '.transport[$attempt].actor_run_id' "$root/next.json")"
          actor_run_attempt="$(jq -r --arg attempt "$attempt" '.transport[$attempt].actor_run_attempt' "$root/next.json")"
          actor="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${actor_run_id}/attempts/${actor_run_attempt}")"
          jq -e --argjson run_id "$actor_run_id" --argjson run_attempt "$actor_run_attempt" \
            --arg repository "$GITHUB_REPOSITORY" '
            .id == $run_id and .run_attempt == $run_attempt and
            (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
            (.event == "pull_request_target" or .event == "workflow_run" or
             .event == "schedule" or .event == "workflow_dispatch") and
            .repository.full_name == $repository and .status == "completed" and
            (.conclusion | type) == "string" and (.conclusion | length) > 0 and
            (.created_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T")) and
            (.updated_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T"))
          ' <<<"$actor" >/dev/null
          observer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $run_id and .run_attempt == $run_attempt and
            (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
            .event == "schedule" and .repository.full_name == $repository and
            .head_branch == "main" and .head_sha == $workflow_sha
          ' <<<"$observer" >/dev/null
          observation_started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          actor_updated_at="$(jq -r '.updated_at' <<<"$actor")"
          boundary_complete=false
          if [[ "$observation_started_at" > "$actor_updated_at" ]]; then
            boundary_complete=true
          else
            # Do not seal actor.updated_at as the query cutoff: GitHub may
            # materialize an accepted receiver run immediately after the
            # transport actor completes.  The next stable schedule tick seals
            # its own timestamp as the bounded upper cutoff.
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          window_start="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.query_window_start // empty' "$root/next.json")"
          window_end="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.query_window_end // empty' "$root/next.json")"
          prior_boundary="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.same_second_boundary_complete // false' "$root/next.json")"
          page="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.next_page // 1' "$root/next.json")"
          page_cap="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.page_cap // 10' "$root/next.json")"
          test -n "$window_start" || window_start="$(jq -r '.created_at' <<<"$actor")"
          if [ -z "$window_end" ] || [ "$prior_boundary" != true ]; then
            window_end="$observation_started_at"
          fi
          target_workflow_id="$(jq -r '.intent.payload.target.workflow_id' "$root/next.json")"
          page_json="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${target_workflow_id}/runs" \
            -f event=repository_dispatch -f branch=main \
            -f created="${window_start}..${window_end}" -f per_page=100 -f page="$page")"
          jq -e '
            (.total_count | type) == "number" and .total_count >= 0 and
            (.total_count | floor) == .total_count and
            (.workflow_runs | type) == "array" and
            (.workflow_runs | length) <= 100
          ' \
            <<<"$page_json" >/dev/null
          jq -c '{total_count,workflow_runs}' <<<"$page_json" \
            > "$root/retry-scan-page.json"
          observation_completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$root/next.json" "$root/retry-scan-page.json" \
            "$root/retry-scan-cursor.json" "$attempt" "$actor" "$observer" \
            "$observation_started_at" "$observation_completed_at" \
            "$boundary_complete" "$page_cap" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_exact_review_outbox import materialize_retry_scan_cursor
          from tools.qikvrt_ruleset_outbox import canonical_bytes
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          page=json.loads(pathlib.Path(sys.argv[2]).read_text())
          cursor=materialize_retry_scan_cursor(
              item=item,transport_attempt=int(sys.argv[4]),
              actor_run=json.loads(sys.argv[5]),observer_run=json.loads(sys.argv[6]),
              page_response=page,observation_started_at=sys.argv[7],
              observation_completed_at=sys.argv[8],
              same_second_boundary_complete=sys.argv[9] == 'true',
              page_cap=int(sys.argv[10]))
          pathlib.Path(sys.argv[3]).write_bytes(canonical_bytes(cursor))
          PY
          echo "action=CURSOR" >> "$GITHUB_OUTPUT"
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "cursor_ordinal=$(jq -r '.ordinal' "$root/retry-scan-cursor.json")" >> "$GITHUB_OUTPUT"

      - name: Preserve immutable exact-head retry scan cursor
        id: cursor_evidence
        if: steps.select.outputs.action == 'CURSOR'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-outbox-retry-scan-cursor-exact-head-dispatch-${{ steps.select.outputs.sequence }}-attempt-${{ steps.select.outputs.attempt }}-ordinal-${{ steps.select.outputs.cursor_ordinal }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-head-outbox-recovery/retry-scan-cursor.json

      - name: Preserve exact-head recovery observation for one Writer CAS
        id: selection_evidence
        if: >-
          steps.select.outputs.action == 'PREPARE' ||
          steps.select.outputs.action == 'TERMINALIZE' ||
          steps.select.outputs.action == 'CURSOR' ||
          steps.select.outputs.action == 'ADOPT'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-head-recovery-selection-${{ steps.select.outputs.sequence }}-${{ steps.select.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/qikvrt-exact-head-outbox-recovery/next.json
            ${{ runner.temp }}/qikvrt-exact-head-outbox-recovery/request.json
            ${{ runner.temp }}/qikvrt-exact-head-outbox-recovery/retry-scan-cursor.json
            ${{ runner.temp }}/qikvrt-exact-head-outbox-recovery/child.json
            ${{ runner.temp }}/qikvrt-exact-head-outbox-recovery/authority-observation.json
            ${{ runner.temp }}/qikvrt-exact-head-outbox-recovery/producer.json

  select-exact-head-outbox-recovery:
    name: Apply one exact-head recovery CAS with Writer-only authority
    needs: observe-exact-head-outbox-recovery
    if: >-
      needs.observe-exact-head-outbox-recovery.outputs.action == 'PREPARE' ||
      needs.observe-exact-head-outbox-recovery.outputs.action == 'TERMINALIZE' ||
      needs.observe-exact-head-outbox-recovery.outputs.action == 'CURSOR' ||
      needs.observe-exact-head-outbox-recovery.outputs.action == 'ADOPT'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-exact-head-dispatch
      cancel-in-progress: false
      queue: max
    env:
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-exact-head-dispatch
      OBSERVED_ACTION: ${{ needs.observe-exact-head-outbox-recovery.outputs.action }}
      OBSERVED_BLOCKER: ${{ needs.observe-exact-head-outbox-recovery.outputs.blocker }}
      OUTBOX_SEQUENCE: ${{ needs.observe-exact-head-outbox-recovery.outputs.sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.observe-exact-head-outbox-recovery.outputs.fingerprint }}
      OUTBOX_ATTEMPT: ${{ needs.observe-exact-head-outbox-recovery.outputs.attempt }}
      SELECTION_ARTIFACT_ID: ${{ needs.observe-exact-head-outbox-recovery.outputs.selection_artifact_id }}
      SELECTION_ARTIFACT_DIGEST: ${{ needs.observe-exact-head-outbox-recovery.outputs.selection_artifact_digest }}
      CURSOR_ARTIFACT_ID: ${{ needs.observe-exact-head-outbox-recovery.outputs.cursor_artifact_id }}
      CURSOR_ARTIFACT_DIGEST: ${{ needs.observe-exact-head-outbox-recovery.outputs.cursor_artifact_digest }}
    outputs:
      action: ${{ steps.mutate.outputs.action }}
      sequence: ${{ steps.mutate.outputs.sequence }}
      fingerprint: ${{ steps.mutate.outputs.fingerprint }}
      attempt: ${{ steps.mutate.outputs.attempt }}
      transport_artifact_id: ${{ steps.transport_evidence.outputs.artifact-id }}
      transport_artifact_digest: ${{ steps.transport_evidence.outputs.artifact-digest }}
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact recovery observation artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SELECTION_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SELECTION_ARTIFACT_ID}")"
          jq -e --argjson id "$SELECTION_ARTIFACT_ID" \
            --arg name "qikvrt-exact-head-recovery-selection-${OUTBOX_SEQUENCE}-${OUTBOX_FINGERPRINT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${SELECTION_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download exact recovery observation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.observe-exact-head-outbox-recovery.outputs.selection_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-head-recovery-writer

      - name: Bind exact-head retry cursor artifact identity
        if: env.OBSERVED_ACTION == 'CURSOR'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CURSOR_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CURSOR_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          cursor_ordinal="$(jq -r '.ordinal' "$RUNNER_TEMP/qikvrt-exact-head-recovery-writer/retry-scan-cursor.json")"
          [[ "$cursor_ordinal" =~ ^[1-9][0-9]*$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURSOR_ARTIFACT_ID}")"
          jq -e --argjson id "$CURSOR_ARTIFACT_ID" \
            --arg name "qikvrt-outbox-retry-scan-cursor-exact-head-dispatch-${OUTBOX_SEQUENCE}-attempt-${OUTBOX_ATTEMPT}-ordinal-${cursor_ordinal}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${CURSOR_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Revalidate exact recovery subject without ledger credentials
        id: rebind
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-recovery-writer"
          test -f "$root/next.json"
          [[ "$OUTBOX_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$OUTBOX_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OBSERVED_ACTION" =~ ^(PREPARE|TERMINALIZE|CURSOR|ADOPT)$ ]]
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          jq -e --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" '
            .state == "PENDING" and .lane == "exact-head-dispatch" and
            .sequence == $sequence and .fingerprint == $fingerprint and
            .intent.payload.repository == $ENV.GITHUB_REPOSITORY
          ' "$root/next.json" >/dev/null
          pr="$(jq -r '.intent.payload.subject.pull_request' "$root/next.json")"
          ref="$(jq -r '.intent.payload.subject.head_ref' "$root/next.json")"
          head="$(jq -r '.intent.payload.subject.head_sha' "$root/next.json")"
          tree="$(jq -r '.intent.payload.subject.head_tree_sha' "$root/next.json")"
          base_ref="$(jq -r '.intent.payload.subject.base_ref' "$root/next.json")"
          base="$(jq -r '.intent.payload.subject.base_sha' "$root/next.json")"
          sealed_main="$(jq -r '.intent.payload.main_head_sha' "$root/next.json")"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          action="$OBSERVED_ACTION"
          blocker="$OBSERVED_BLOCKER"
          if [ "$live_main" != "$GITHUB_WORKFLOW_SHA" ]; then
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            echo "blocker=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$sealed_main" != "$live_main" ]; then
            action=TERMINALIZE
            blocker=OUTBOX_EVALUATOR_SUPERSEDED
            python3 - "$root/next.json" "$root/authority-observation.json" "$live_main" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          value={'schema':AUTHORITY_OBSERVATION_SCHEMA,'blocker':'OUTBOX_EVALUATOR_SUPERSEDED','lane':'exact-head-dispatch','sequence':item['sequence'],'fingerprint':item['fingerprint'],'sealed_main_head_sha':item['intent']['payload']['main_head_sha'],'observed_main_head_sha':sys.argv[3],'verified':True,'productive_effect':False}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
          else
            current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
            observed_head="$(jq -r '.head.sha' <<<"$current")"
            observed_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${observed_head}" --jq '.tree.sha')"
            jq -n --argjson pr "$pr" --arg repository "$(jq -r '.head.repo.full_name' <<<"$current")" \
              --arg ref "$(jq -r '.head.ref' <<<"$current")" --arg head "$observed_head" \
              --arg tree "$observed_tree" --arg base_ref "$(jq -r '.base.ref' <<<"$current")" \
              --arg base "$(jq -r '.base.sha' <<<"$current")" '
              {pull_request:$pr,head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base}
            ' > "$root/observed-subject.json"
            if ! jq -e --slurpfile observed "$root/observed-subject.json" \
              '.intent.payload.subject == $observed[0]' "$root/next.json" >/dev/null; then
              action=TERMINALIZE
              blocker=OUTBOX_SUBJECT_SUPERSEDED
              python3 - "$root/next.json" "$root/observed-subject.json" "$root/authority-observation.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA, digest
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          observed=json.loads(pathlib.Path(sys.argv[2]).read_text())
          sealed=item['intent']['payload']['subject']
          value={'schema':AUTHORITY_OBSERVATION_SCHEMA,'blocker':'OUTBOX_SUBJECT_SUPERSEDED','lane':'exact-head-dispatch','sequence':item['sequence'],'fingerprint':item['fingerprint'],'sealed_subject_sha256':digest(sealed),'observed_subject':observed,'observed_subject_sha256':digest(observed),'verified':True,'productive_effect':False}
          pathlib.Path(sys.argv[3]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            fi
          fi
          if [ "$action" = PREPARE ]; then
            test -f "$root/request.json"
            test "$OUTBOX_ATTEMPT" -eq 1
            python3 - "$root/next.json" "$root/request.json" "$OUTBOX_ATTEMPT" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import request_for_transport_attempt
          item = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          request = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          if request != request_for_transport_attempt(item["intent"], int(sys.argv[3])):
              raise SystemExit("recovery request no longer matches sealed intent")
          PY
          elif [ "$action" = CURSOR ]; then
            test -f "$root/retry-scan-cursor.json"
            test "$OUTBOX_ATTEMPT" -eq 1
            jq -e --arg lane exact-head-dispatch --argjson sequence "$OUTBOX_SEQUENCE" \
              --arg fingerprint "$OUTBOX_FINGERPRINT" --argjson attempt "$OUTBOX_ATTEMPT" \
              --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
              .lane == $lane and .sequence == $sequence and
              .fingerprint == $fingerprint and .transport_attempt == $attempt and
              .observation_producer.run_id == $run_id and
              .observation_producer.run_attempt == $run_attempt and
              .observation_producer.event == "schedule" and
              .verified == true and .productive_effect == false
            ' "$root/retry-scan-cursor.json" >/dev/null
          elif [ "$action" = ADOPT ]; then
            test -f "$root/child.json"
            test "$OUTBOX_ATTEMPT" -eq 1
            python3 - "$root/next.json" "$root/child.json" "$OUTBOX_ATTEMPT" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import normalize_child_for_intent
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          child=json.loads(pathlib.Path(sys.argv[2]).read_text())
          if normalize_child_for_intent(child,intent=item['intent'],attempt=int(sys.argv[3])) != child:
              raise SystemExit('retry cursor child normalization drifted')
          PY
          else
            test -f "$root/authority-observation.json"
            test "$(jq -r '.blocker' "$root/authority-observation.json")" = "$blocker"
            workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            jq -e --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              --argjson workflow_id "$workflow_id" --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
              .id == $run_id and .run_attempt == $run_attempt and .workflow_id == $workflow_id and
              (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .repository.full_name == $repository and .event == "schedule" and
              .head_branch == "main" and .head_sha == $workflow_sha
            ' <<<"$run" >/dev/null
            jq -n --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --argjson workflow_id "$workflow_id" \
              --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
              {workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$workflow_sha,workflow_id:$workflow_id,run_id:$run_id,run_attempt:$run_attempt,event:"schedule"}
            ' > "$root/producer.json"
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "blocker=$blocker" >> "$GITHUB_OUTPUT"

      - name: Preserve immutable exact-head Authority observation
        id: authority_evidence
        if: steps.rebind.outputs.action == 'TERMINALIZE'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-outbox-authority-observation-exact-head-dispatch-${{ needs.observe-exact-head-outbox-recovery.outputs.sequence }}-${{ steps.rebind.outputs.blocker }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-head-recovery-writer/authority-observation.json

      - name: Bind exact-head Authority observation artifact identity
        if: steps.rebind.outputs.action == 'TERMINALIZE'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ARTIFACT_ID: ${{ steps.authority_evidence.outputs.artifact-id }}
          AUTHORITY_ARTIFACT_DIGEST: ${{ steps.authority_evidence.outputs.artifact-digest }}
          EFFECTIVE_BLOCKER: ${{ steps.rebind.outputs.blocker }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORITY_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTHORITY_ARTIFACT_ID}")"
          jq -e --argjson id "$AUTHORITY_ARTIFACT_ID" \
            --arg name "qikvrt-outbox-authority-observation-exact-head-dispatch-${OUTBOX_SEQUENCE}-${EFFECTIVE_BLOCKER}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${AUTHORITY_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Apply exact recovery ledger mutation only
        id: mutate
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
          EFFECTIVE_ACTION: ${{ steps.rebind.outputs.action }}
          EFFECTIVE_BLOCKER: ${{ steps.rebind.outputs.blocker }}
          AUTHORITY_ARTIFACT_ID: ${{ steps.authority_evidence.outputs.artifact-id }}
          AUTHORITY_ARTIFACT_DIGEST: ${{ steps.authority_evidence.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          ledger_write() {
            QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
            QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
            QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
              python3 -B tools/qikvrt_ruleset_outbox.py "$@"
          }
          root="$RUNNER_TEMP/qikvrt-exact-head-recovery-writer"
          if [ "$EFFECTIVE_ACTION" = TERMINALIZE ]; then
            [[ "$AUTHORITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$AUTHORITY_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
            authority_name="qikvrt-outbox-authority-observation-exact-head-dispatch-${OUTBOX_SEQUENCE}-${EFFECTIVE_BLOCKER}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/authority-record.json" \
              record-observation --lane exact-head-dispatch --sequence "$OUTBOX_SEQUENCE" \
              --observation "$root/authority-observation.json" --producer "$root/producer.json" \
              --artifact-id "$AUTHORITY_ARTIFACT_ID" --artifact-name "$authority_name" \
              --artifact-digest "${AUTHORITY_ARTIFACT_DIGEST#sha256:}" >/dev/null
            python3 - "$root/next.json" "$root/authority-record.json" "$root/terminal.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_exact_review_outbox import materialize_authority_terminal
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          record=json.loads(pathlib.Path(sys.argv[2]).read_text())
          value=materialize_authority_terminal(item=item,authority_record=record)
          pathlib.Path(sys.argv[3]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/terminal-receipt.json" \
              terminalize --lane exact-head-dispatch --sequence "$OUTBOX_SEQUENCE" \
              --evidence "$root/terminal.json" >/dev/null
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EFFECTIVE_ACTION" = CURSOR ]; then
            [[ "$CURSOR_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$CURSOR_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
            cursor_ordinal="$(jq -r '.ordinal' "$root/retry-scan-cursor.json")"
            cursor_name="qikvrt-outbox-retry-scan-cursor-exact-head-dispatch-${OUTBOX_SEQUENCE}-attempt-${OUTBOX_ATTEMPT}-ordinal-${cursor_ordinal}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/retry-scan-cursor-receipt.json" \
              record-retry-scan-cursor --lane exact-head-dispatch --sequence "$OUTBOX_SEQUENCE" \
              --cursor "$root/retry-scan-cursor.json" --artifact-id "$CURSOR_ARTIFACT_ID" \
              --artifact-name "$cursor_name" \
              --artifact-digest "${CURSOR_ARTIFACT_DIGEST#sha256:}" >/dev/null
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EFFECTIVE_ACTION" = ADOPT ]; then
            ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/acceptance.json" \
              accept --lane exact-head-dispatch --sequence "$OUTBOX_SEQUENCE" \
              --attempt "$OUTBOX_ATTEMPT" --child "$root/child.json" >/dev/null
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$OUTBOX_ATTEMPT" -eq 1
          ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/transport.json" \
            prepare-transport --lane exact-head-dispatch --sequence "$OUTBOX_SEQUENCE" \
            --attempt "$OUTBOX_ATTEMPT" --request "$root/request.json" \
            --actor-run-id "$GITHUB_RUN_ID" --actor-run-attempt "$GITHUB_RUN_ATTEMPT" >/dev/null
          jq -e '.cas.persisted == true and (.cas.appended | type) == "boolean"' \
            "$root/transport.json" >/dev/null
          if [ "$(jq -r '.cas.appended' "$root/transport.json")" != true ]; then
            # A replayed PREPARED record is observation input, never fresh POST
            # authority.  The next schedule adopts/scans this exact actor.
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$root/prepared"
          cp "$root/next.json" "$root/prepared/next.json"
          cp "$root/request.json" "$root/prepared/request.json"
          cp "$root/transport.json" "$root/prepared/transport.json"
          echo "action=POST" >> "$GITHUB_OUTPUT"
          echo "sequence=$OUTBOX_SEQUENCE" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$OUTBOX_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "attempt=$OUTBOX_ATTEMPT" >> "$GITHUB_OUTPUT"
          unset writer_token

      - name: Preserve exact-head recovery pre-effect bytes
        id: transport_evidence
        if: steps.mutate.outputs.action == 'POST'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-head-recovery-pre-effect-${{ steps.mutate.outputs.sequence }}-${{ steps.mutate.outputs.fingerprint }}-transport-${{ steps.mutate.outputs.attempt }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-head-recovery-writer/prepared

  dispatch-exact-head-outbox-recovery:
    name: Dispatch one prepared exact-head outbox recovery
    needs: select-exact-head-outbox-recovery
    if: needs.select-exact-head-outbox-recovery.outputs.action == 'POST'
    permissions:
      actions: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OUTBOX_SEQUENCE: ${{ needs.select-exact-head-outbox-recovery.outputs.sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.select-exact-head-outbox-recovery.outputs.fingerprint }}
      OUTBOX_ATTEMPT: ${{ needs.select-exact-head-outbox-recovery.outputs.attempt }}
      TRANSPORT_ARTIFACT_ID: ${{ needs.select-exact-head-outbox-recovery.outputs.transport_artifact_id }}
      TRANSPORT_ARTIFACT_DIGEST: ${{ needs.select-exact-head-outbox-recovery.outputs.transport_artifact_digest }}
    steps:
      - name: Require exact recovery pre-effect artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRANSPORT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRANSPORT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$|^[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRANSPORT_ARTIFACT_ID}")"
          jq -e --argjson id "$TRANSPORT_ARTIFACT_ID" \
            --arg name "qikvrt-exact-head-recovery-pre-effect-${OUTBOX_SEQUENCE}-${OUTBOX_FINGERPRINT}-transport-${OUTBOX_ATTEMPT}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${TRANSPORT_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == $run_id and .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download exact recovery pre-effect bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.select-exact-head-outbox-recovery.outputs.transport_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-head-outbox-dispatch

      - name: Reobserve durable ordinal immediately before exact dispatch
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-head-outbox-dispatch"
          test -f "$root/next.json"
          test -f "$root/request.json"
          test -f "$root/transport.json"
          test "$(find "$root" -type f | wc -l)" -eq 3
          [[ "$OUTBOX_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$OUTBOX_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          test "$OUTBOX_ATTEMPT" -eq 1
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"
          jq -e --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" \
            '.state == "PENDING" and .sequence == $sequence and .fingerprint == $fingerprint and
             (.acceptance | length) == 0' "$root/next.json" >/dev/null
          jq -e --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" \
            --argjson attempt "$OUTBOX_ATTEMPT" --argjson actor "$GITHUB_RUN_ID" \
            --argjson actor_attempt "$GITHUB_RUN_ATTEMPT" '
            .lane == "exact-head-dispatch" and .sequence == $sequence and
            .fingerprint == $fingerprint and .attempt == $attempt and
            .state == "PRE_EFFECT_REOBSERVED" and
            .actor_run_id == $actor and .actor_run_attempt == $actor_attempt and
            .cas.persisted == true and .cas.appended == true
          ' "$root/transport.json" >/dev/null
          pr="$(jq -r '.intent.payload.subject.pull_request' "$root/next.json")"
          ref="$(jq -r '.intent.payload.subject.head_ref' "$root/next.json")"
          head="$(jq -r '.intent.payload.subject.head_sha' "$root/next.json")"
          tree="$(jq -r '.intent.payload.subject.head_tree_sha' "$root/next.json")"
          base_ref="$(jq -r '.intent.payload.subject.base_ref' "$root/next.json")"
          base="$(jq -r '.intent.payload.subject.base_sha' "$root/next.json")"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$ref" --arg head "$head" \
            --arg base_ref "$base_ref" --arg base "$base" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${head}" --jq '.tree.sha')" = "$tree"
          python3 - "$root/transport.json" "$root/request.json" <<'PY'
          import json
          import pathlib
          import sys

          from tools.qikvrt_ruleset_outbox import digest

          transport_path, request_path = map(pathlib.Path, sys.argv[1:])
          transport = json.loads(transport_path.read_text(encoding="utf-8"))
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if transport["request_sha256"] != digest(request):
              raise SystemExit("sealed recovery request digest mismatch")
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input "$root/request.json"

  prepare-exact-head-transport-intent:
    name: Preserve exact-head transport intent before dispatch
    needs: continue-one-stalled-internal-pr
    if: >-
      needs.continue-one-stalled-internal-pr.outputs.selected == 'true' &&
      needs.continue-one-stalled-internal-pr.outputs.action == 'exact_head_reobserve' &&
      needs.continue-one-stalled-internal-pr.outputs.attempt == '1'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.intent_evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.intent_evidence.outputs.artifact-digest }}
    env:
      PR_NUMBER: ${{ needs.continue-one-stalled-internal-pr.outputs.pr }}
      HEAD_REF: ${{ needs.continue-one-stalled-internal-pr.outputs.ref }}
      HEAD_SHA: ${{ needs.continue-one-stalled-internal-pr.outputs.head }}
      HEAD_TREE_SHA: ${{ needs.continue-one-stalled-internal-pr.outputs.tree }}
      BASE_REF: ${{ needs.continue-one-stalled-internal-pr.outputs.base_ref }}
      BASE_SHA: ${{ needs.continue-one-stalled-internal-pr.outputs.base }}
      CAUSAL_ATTEMPT: ${{ needs.continue-one-stalled-internal-pr.outputs.attempt }}
    steps:
      - name: Materialize immutable exact transport intent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-autonomous-exact-head-intent"
          mkdir -p "$root"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg ref "$HEAD_REF" \
            --arg head "$HEAD_SHA" --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}" --jq '.tree.sha')" = "$HEAD_TREE_SHA"
          producer_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
          producer_workflow_id="$(jq -r '.id' <<<"$producer_workflow")"
          producer_workflow_path="$(jq -r '.path' <<<"$producer_workflow")"
          producer_workflow_sha="$GITHUB_WORKFLOW_SHA"
          [[ "$producer_workflow_sha" =~ ^[0-9a-f]{40}$ ]]
          producer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          producer_event="$(jq -r '.event' <<<"$producer")"
          jq -e \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson workflow_id "$producer_workflow_id" --arg path "$producer_workflow_path" \
            --arg repository "$GITHUB_REPOSITORY" '
            .id == $run_id and .run_attempt == $run_attempt and
            .workflow_id == $workflow_id and (.path | split("@")[0]) == $path and
            .repository.full_name == $repository
          ' <<<"$producer" >/dev/null
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$PR_NUMBER" \
            --arg ref "$HEAD_REF" --arg head "$HEAD_SHA" \
            --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" \
            --arg workflow_sha "$producer_workflow_sha" '
            ((.event == "pull_request_target" and $workflow_sha == $base and
              .head_sha == $base and .head_branch == $base_ref and
              ([.pull_requests[]? | select(
                .number == ($pr|tonumber) and
                .head.repo.full_name == $repository and .head.ref == $ref and .head.sha == $head and
                .base.ref == $base_ref and .base.sha == $base
              )] | length) == 1) or
             ((.event == "workflow_run" or .event == "schedule" or .event == "workflow_dispatch") and
              .head_branch == "main" and .head_sha == $workflow_sha))
          ' <<<"$producer" >/dev/null
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$PR_NUMBER" \
            --arg ref "$HEAD_REF" --arg head "$HEAD_SHA" --arg tree "$HEAD_TREE_SHA" \
            --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            --arg producer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg producer_workflow_id "$producer_workflow_id" \
            --arg producer_workflow_path "$producer_workflow_path" \
            --arg producer_workflow_sha "$producer_workflow_sha" \
            --arg attempt "$CAUSAL_ATTEMPT" \
            '{event_type:"qikvrt_autonomous_exact_head_verify",client_payload:{schema:"qikvrt_autonomous_exact_head_verify_dispatch_v1",repository:$repository,subject:{pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base},producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha},causal:{attempt:($attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false}}}' \
            > "$root/dispatch-request.json"
          request_sha256="$(sha256sum "$root/dispatch-request.json" | cut -d' ' -f1)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$PR_NUMBER" \
            --arg head "$HEAD_SHA" --arg tree "$HEAD_TREE_SHA" \
            --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" \
            --arg producer_run_id "$GITHUB_RUN_ID" --arg producer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg producer_workflow_id "$producer_workflow_id" \
            --arg producer_workflow_sha "$producer_workflow_sha" \
            --arg attempt "$CAUSAL_ATTEMPT" --arg request_sha256 "$request_sha256" '
            {schema:"qikvrt.autonomous-exact-head-transport-intent.v1",repository:$repository,pull_request:($pr|tonumber),head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base,producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha},attempt:($attempt|tonumber),request_sha256:$request_sha256,productive_effect:false,effect_ack:"NOT_REQUIRED"}
          ' > "$root/intent.json"

      - name: Preserve immutable exact transport intent
        id: intent_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-autonomous-exact-head-intent-${{ needs.continue-one-stalled-internal-pr.outputs.pr }}-${{ needs.continue-one-stalled-internal-pr.outputs.head }}-attempt-${{ needs.continue-one-stalled-internal-pr.outputs.attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            ${{ runner.temp }}/qikvrt-autonomous-exact-head-intent/dispatch-request.json
            ${{ runner.temp }}/qikvrt-autonomous-exact-head-intent/intent.json

  persist-exact-head-transport-outbox:
    name: Persist exact-head transport in durable FIFO outbox
    needs:
      - continue-one-stalled-internal-pr
      - prepare-exact-head-transport-intent
    if: >-
      needs.continue-one-stalled-internal-pr.outputs.selected == 'true' &&
      needs.continue-one-stalled-internal-pr.outputs.action == 'exact_head_reobserve' &&
      needs.continue-one-stalled-internal-pr.outputs.attempt == '1' &&
      needs.prepare-exact-head-transport-intent.result == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-exact-head-dispatch
      cancel-in-progress: false
      queue: max
    outputs:
      sequence: ${{ steps.persist.outputs.sequence }}
      fingerprint: ${{ steps.persist.outputs.fingerprint }}
      ledger_head: ${{ steps.persist.outputs.ledger_head }}
      new_transport: ${{ steps.persist.outputs.new_transport }}
      transport_artifact_id: ${{ steps.transport_evidence.outputs.artifact-id }}
      transport_artifact_digest: ${{ steps.transport_evidence.outputs.artifact-digest }}
    env:
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-exact-head-dispatch
      PR_NUMBER: ${{ needs.continue-one-stalled-internal-pr.outputs.pr }}
      HEAD_REF: ${{ needs.continue-one-stalled-internal-pr.outputs.ref }}
      HEAD_SHA: ${{ needs.continue-one-stalled-internal-pr.outputs.head }}
      HEAD_TREE_SHA: ${{ needs.continue-one-stalled-internal-pr.outputs.tree }}
      BASE_REF: ${{ needs.continue-one-stalled-internal-pr.outputs.base_ref }}
      BASE_SHA: ${{ needs.continue-one-stalled-internal-pr.outputs.base }}
      CAUSAL_ATTEMPT: ${{ needs.continue-one-stalled-internal-pr.outputs.attempt }}
      INTENT_ARTIFACT_ID: ${{ needs.prepare-exact-head-transport-intent.outputs.artifact_id }}
      INTENT_ARTIFACT_DIGEST: ${{ needs.prepare-exact-head-transport-intent.outputs.artifact_digest }}
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download immutable exact transport intent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare-exact-head-transport-intent.outputs.artifact_id }}
          path: ${{ runner.temp }}/qikvrt-autonomous-exact-head-outbox-input

      - name: Validate and materialize exact-head outbox payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox-input"
          request="$root/dispatch-request.json"
          intent="$root/intent.json"
          test -f "$request"
          test -f "$intent"
          test "$(find "$root" -type f | wc -l)" -eq 2
          test "$CAUSAL_ATTEMPT" -eq 1

          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$HEAD_REF" \
            --arg head "$HEAD_SHA" --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}" --jq '.tree.sha')" = "$HEAD_TREE_SHA"

          producer_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
          producer_workflow_id="$(jq -r '.id' <<<"$producer_workflow")"
          [[ "$producer_workflow_id" =~ ^[1-9][0-9]*$ ]]
          target_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_exact_head_verify.yml")"
          target_workflow_id="$(jq -r '.id' <<<"$target_workflow")"
          [[ "$target_workflow_id" =~ ^[1-9][0-9]*$ ]]
          jq -e '.path == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and .state == "active"' \
            <<<"$target_workflow" >/dev/null
          producer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}")"
          producer_event="$(jq -r '.event' <<<"$producer")"
          jq -e --argjson id "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson workflow_id "$producer_workflow_id" --arg repository "$GITHUB_REPOSITORY" '
            .id == $id and .run_attempt == $attempt and .workflow_id == $workflow_id and
            (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
            .repository.full_name == $repository
          ' <<<"$producer" >/dev/null

          artifact_name="qikvrt-autonomous-exact-head-intent-${PR_NUMBER}-${HEAD_SHA}-attempt-${CAUSAL_ATTEMPT}"
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${INTENT_ARTIFACT_ID}")"
          jq -e --argjson id "$INTENT_ARTIFACT_ID" --arg name "$artifact_name" \
            --arg digest "sha256:${INTENT_ARTIFACT_DIGEST#sha256:}" --argjson run_id "$GITHUB_RUN_ID" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id
          ' <<<"$artifact" >/dev/null

          jq -e --arg repository "$GITHUB_REPOSITORY" --arg pr "$PR_NUMBER" \
            --arg ref "$HEAD_REF" --arg head "$HEAD_SHA" --arg tree "$HEAD_TREE_SHA" \
            --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" --arg attempt "$CAUSAL_ATTEMPT" '
            .event_type == "qikvrt_autonomous_exact_head_verify" and
            .client_payload.repository == $repository and
            .client_payload.subject == {pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base} and
            .client_payload.causal == {attempt:($attempt|tonumber),d0:2,state:"REOBSERVE",productive_effect:false}
          ' "$request" >/dev/null

          mkdir -p "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox"
          payload="$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/payload.json"
          jq -n --slurpfile request "$request" \
            --arg repository "$GITHUB_REPOSITORY" --arg main "$GITHUB_WORKFLOW_SHA" \
            --arg workflow_id "$producer_workflow_id" --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg event "$producer_event" \
            --arg target_workflow_id "$target_workflow_id" \
            --arg pr "$PR_NUMBER" --arg ref "$HEAD_REF" --arg head "$HEAD_SHA" \
            --arg tree "$HEAD_TREE_SHA" --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" \
            --arg attempt "$CAUSAL_ATTEMPT" '
            {schema:"qikvrt_ruleset_outbox_payload_v1",repository:$repository,lane:"exact-head-dispatch",main_head_sha:$main,producer:{workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$main,workflow_id:($workflow_id|tonumber),run_id:($run_id|tonumber),run_attempt:($run_attempt|tonumber),event:$event},subject:{pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base},target:{workflow_id:($target_workflow_id|tonumber),workflow_path:".github/workflows/qikvrt_autonomous_exact_head_verify.yml",event:"repository_dispatch"},request:$request[0],causal:{d0:2,state:"REOBSERVE",productive_effect:false}}
          ' > "$payload"
          printf '%s\n' "$artifact_name" > "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/artifact-name.txt"

      - name: Enqueue exact-head intent CAS only
        id: enqueue
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          root="$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox"
          artifact_name="$(cat "$root/artifact-name.txt")"
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" --receipt "$root/enqueue.json" \
            enqueue --lane exact-head-dispatch --payload "$root/payload.json" \
            --artifact-id "$INTENT_ARTIFACT_ID" --artifact-name "$artifact_name" \
            --artifact-digest "$INTENT_ARTIFACT_DIGEST" >/dev/null
          sequence="$(jq -r '.sequence' "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/enqueue.json")"
          fingerprint="$(jq -r '.fingerprint' "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/enqueue.json")"
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          unset writer_token

      - name: Materialize exact-head request from sealed enqueue receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/enqueue.json" \
            "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/transport-request.json" \
            "$CAUSAL_ATTEMPT" <<'PY'
          import json
          import pathlib
          import sys

          from tools.qikvrt_ruleset_outbox import request_for_transport_attempt

          source, target, raw_attempt = sys.argv[1:]
          intent = json.loads(pathlib.Path(source).read_text(encoding="utf-8"))
          request = request_for_transport_attempt(intent, int(raw_attempt))
          pathlib.Path(target).write_text(
              json.dumps(request, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Prepare exact-head transport CAS only
        id: persist
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
          ENQUEUED_SEQUENCE: ${{ steps.enqueue.outputs.sequence }}
          ENQUEUED_FINGERPRINT: ${{ steps.enqueue.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          sequence="$ENQUEUED_SEQUENCE"
          fingerprint="$ENQUEUED_FINGERPRINT"
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" \
            --receipt "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/transport.json" \
            prepare-transport --lane exact-head-dispatch --sequence "$sequence" \
            --attempt "$CAUSAL_ATTEMPT" \
            --request "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/transport-request.json" \
            --actor-run-id "$GITHUB_RUN_ID" --actor-run-attempt "$GITHUB_RUN_ATTEMPT" >/dev/null
          jq -e --argjson sequence "$sequence" --arg fingerprint "$fingerprint" \
            --arg attempt "$CAUSAL_ATTEMPT" '
            .sequence == $sequence and .fingerprint == $fingerprint and
            .attempt == ($attempt|tonumber) and .state == "PRE_EFFECT_REOBSERVED" and
            .productive_effect == false
          ' "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/transport.json" >/dev/null
          jq -e '.cas.persisted == true and (.cas.appended | type) == "boolean"' \
            "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/transport.json" >/dev/null
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "ledger_head=$(jq -r '.ledger_head' "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/transport.json")" >> "$GITHUB_OUTPUT"
          echo "new_transport=$(jq -r '.cas.appended' "$RUNNER_TEMP/qikvrt-autonomous-exact-head-outbox/transport.json")" >> "$GITHUB_OUTPUT"
          unset writer_token

      - name: Preserve exact-head pre-effect transport bytes
        id: transport_evidence
        if: steps.persist.outputs.new_transport == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-head-pre-effect-${{ steps.persist.outputs.sequence }}-${{ steps.persist.outputs.fingerprint }}-transport-${{ env.CAUSAL_ATTEMPT }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/qikvrt-autonomous-exact-head-outbox/payload.json
            ${{ runner.temp }}/qikvrt-autonomous-exact-head-outbox/enqueue.json
            ${{ runner.temp }}/qikvrt-autonomous-exact-head-outbox/transport.json
            ${{ runner.temp }}/qikvrt-autonomous-exact-head-outbox/transport-request.json

  dispatch-exact-head-transport:
    name: Dispatch exact-head transport and preserve ordinal witness
    needs:
      - continue-one-stalled-internal-pr
      - prepare-exact-head-transport-intent
      - persist-exact-head-transport-outbox
    if: >-
      needs.continue-one-stalled-internal-pr.outputs.selected == 'true' &&
      needs.continue-one-stalled-internal-pr.outputs.action == 'exact_head_reobserve' &&
      needs.continue-one-stalled-internal-pr.outputs.attempt == '1' &&
      needs.persist-exact-head-transport-outbox.outputs.new_transport == 'true'
    permissions:
      actions: read
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ needs.continue-one-stalled-internal-pr.outputs.pr }}
      HEAD_REF: ${{ needs.continue-one-stalled-internal-pr.outputs.ref }}
      HEAD_SHA: ${{ needs.continue-one-stalled-internal-pr.outputs.head }}
      HEAD_TREE_SHA: ${{ needs.continue-one-stalled-internal-pr.outputs.tree }}
      BASE_REF: ${{ needs.continue-one-stalled-internal-pr.outputs.base_ref }}
      BASE_SHA: ${{ needs.continue-one-stalled-internal-pr.outputs.base }}
      CAUSAL_ATTEMPT: ${{ needs.continue-one-stalled-internal-pr.outputs.attempt }}
      INTENT_ARTIFACT_ID: ${{ needs.prepare-exact-head-transport-intent.outputs.artifact_id }}
      INTENT_ARTIFACT_DIGEST: ${{ needs.prepare-exact-head-transport-intent.outputs.artifact_digest }}
      OUTBOX_SEQUENCE: ${{ needs.persist-exact-head-transport-outbox.outputs.sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.persist-exact-head-transport-outbox.outputs.fingerprint }}
      TRANSPORT_ARTIFACT_ID: ${{ needs.persist-exact-head-transport-outbox.outputs.transport_artifact_id }}
      TRANSPORT_ARTIFACT_DIGEST: ${{ needs.persist-exact-head-transport-outbox.outputs.transport_artifact_digest }}
    steps:
      - name: Require exact-head pre-effect transport artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRANSPORT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$TRANSPORT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$|^[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRANSPORT_ARTIFACT_ID}")"
          jq -e --argjson id "$TRANSPORT_ARTIFACT_ID" \
            --arg name "qikvrt-exact-head-pre-effect-${OUTBOX_SEQUENCE}-${OUTBOX_FINGERPRINT}-transport-${CAUSAL_ATTEMPT}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${TRANSPORT_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == $run_id and .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download exact-head pre-effect transport bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.persist-exact-head-transport-outbox.outputs.transport_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-autonomous-exact-head-transport

      - name: Dispatch exact trusted transport
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-autonomous-exact-head-transport"
          test -f "$root/payload.json"
          test -f "$root/enqueue.json"
          test -f "$root/transport.json"
          test -f "$root/transport-request.json"
          test "$(find "$root" -type f | wc -l)" -eq 4
          [[ "$OUTBOX_SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          [[ "$OUTBOX_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          jq -e --slurpfile payload "$root/payload.json" \
            --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" \
            --argjson artifact_id "$INTENT_ARTIFACT_ID" \
            --arg artifact_digest "${INTENT_ARTIFACT_DIGEST#sha256:}" '
            .state == "SEALED" and .sequence == $sequence and
            .fingerprint == $fingerprint and .intent.payload == $payload[0] and
            .intent.artifact.id == $artifact_id and
            .intent.artifact.archive_sha256 == $artifact_digest
          ' "$root/enqueue.json" >/dev/null
          jq -e --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" \
            --arg attempt "$CAUSAL_ATTEMPT" --argjson actor "$GITHUB_RUN_ID" \
            --argjson actor_attempt "$GITHUB_RUN_ATTEMPT" '
            .schema == "qikvrt_ruleset_outbox_transport_v2" and
            .lane == "exact-head-dispatch" and .sequence == $sequence and
            .fingerprint == $fingerprint and .attempt == ($attempt|tonumber) and
            .actor_run_id == $actor and .actor_run_attempt == $actor_attempt and
            .state == "PRE_EFFECT_REOBSERVED" and .productive_effect == false and
            .cas.persisted == true and .cas.appended == true
          ' "$root/transport.json" >/dev/null
          python3 - "$root/transport.json" "$root/transport-request.json" <<'PY'
          import json
          import pathlib
          import sys

          from tools.qikvrt_ruleset_outbox import digest

          transport_path, request_path = map(pathlib.Path, sys.argv[1:])
          transport = json.loads(transport_path.read_text(encoding="utf-8"))
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if transport["request_sha256"] != digest(request):
              raise SystemExit("sealed exact-head request digest mismatch")
          PY
          cp "$root/transport-request.json" "$root/dispatch-request.json"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg ref "$HEAD_REF" \
            --arg head "$HEAD_SHA" --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}" --jq '.tree.sha')" = "$HEAD_TREE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"

          producer_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
          producer_workflow_id="$(jq -r '.id' <<<"$producer_workflow")"
          producer_workflow_path="$(jq -r '.path' <<<"$producer_workflow")"
          producer_workflow_sha="$GITHUB_WORKFLOW_SHA"
          [[ "$producer_workflow_sha" =~ ^[0-9a-f]{40}$ ]]
          producer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          producer_event="$(jq -r '.event' <<<"$producer")"
          jq -e \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson workflow_id "$producer_workflow_id" --arg path "$producer_workflow_path" \
            --arg repository "$GITHUB_REPOSITORY" '
            .id == $run_id and .run_attempt == $run_attempt and
            .workflow_id == $workflow_id and (.path | split("@")[0]) == $path and
            .repository.full_name == $repository
          ' <<<"$producer" >/dev/null
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$PR_NUMBER" \
            --arg ref "$HEAD_REF" --arg head "$HEAD_SHA" \
            --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" \
            --arg workflow_sha "$producer_workflow_sha" '
            ((.event == "pull_request_target" and $workflow_sha == $base and
              .head_sha == $base and .head_branch == $base_ref and
              ([.pull_requests[]? | select(
                .number == ($pr|tonumber) and
                .head.repo.full_name == $repository and .head.ref == $ref and .head.sha == $head and
                .base.ref == $base_ref and .base.sha == $base
              )] | length) == 1) or
             ((.event == "workflow_run" or .event == "schedule" or .event == "workflow_dispatch") and
              .head_branch == "main" and .head_sha == $workflow_sha))
          ' <<<"$producer" >/dev/null

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" --arg pr "$PR_NUMBER" \
            --arg ref "$HEAD_REF" --arg head "$HEAD_SHA" --arg tree "$HEAD_TREE_SHA" \
            --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" \
            --arg main "$GITHUB_WORKFLOW_SHA" --arg producer_run_id "$GITHUB_RUN_ID" \
            --arg producer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg producer_workflow_id "$producer_workflow_id" \
            --arg producer_workflow_sha "$producer_workflow_sha" \
            --arg producer_event "$producer_event" \
            --arg attempt "$CAUSAL_ATTEMPT" '
            .schema == "qikvrt_ruleset_outbox_payload_v1" and
            .repository == $repository and .lane == "exact-head-dispatch" and
            .main_head_sha == $main and
            .producer == {workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$producer_workflow_sha,workflow_id:($producer_workflow_id|tonumber),run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),event:$producer_event} and
            .subject == {pull_request:($pr|tonumber),head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base} and
            .target.workflow_path == ".github/workflows/qikvrt_autonomous_exact_head_verify.yml" and
            .target.event == "repository_dispatch" and
            .causal == {d0:2,state:"REOBSERVE",productive_effect:false} and
            .request.client_payload.causal.attempt == ($attempt|tonumber)
          ' "$root/payload.json" >/dev/null
          jq -e --slurpfile payload "$root/payload.json" \
            --arg fingerprint "$OUTBOX_FINGERPRINT" --arg sequence "$OUTBOX_SEQUENCE" \
            --arg attempt "$CAUSAL_ATTEMPT" '
            .event_type == "qikvrt_autonomous_exact_head_verify" and
            (.client_payload | del(.transport)) == $payload[0].request.client_payload and
            .client_payload.transport == {intent_sha256:$fingerprint,sequence:($sequence|tonumber),attempt:($attempt|tonumber)}
          ' "$root/dispatch-request.json" >/dev/null
          test "$(jq '.client_payload | keys | length' "$root/dispatch-request.json")" -le 10
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input "$root/dispatch-request.json"
          jq -n \
            --arg pr "$PR_NUMBER" --arg ref "$HEAD_REF" --arg head "$HEAD_SHA" \
            --arg tree "$HEAD_TREE_SHA" --arg base_ref "$BASE_REF" --arg base "$BASE_SHA" \
            --arg producer_run_id "$GITHUB_RUN_ID" \
            --arg producer_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg producer_workflow_id "$producer_workflow_id" \
            --arg producer_workflow_path "$producer_workflow_path" \
            --arg producer_workflow_sha "$producer_workflow_sha" \
            --arg attempt "$CAUSAL_ATTEMPT" \
            '{pull_request:($pr|tonumber),head_sha:$head,head_tree_sha:$tree,head_ref:$ref,base_ref:$base_ref,base_sha:$base,producer:{run_id:($producer_run_id|tonumber),run_attempt:($producer_run_attempt|tonumber),workflow_id:($producer_workflow_id|tonumber),workflow_path:$producer_workflow_path,workflow_sha:$producer_workflow_sha},attempt:($attempt|tonumber),d0:2,state:"REOBSERVE",disposition:"TRANSPORT_ACCEPTED_AWAITING_EXACT_RUN_ID",continuation:{schema:"qikvrt.causal-continuation.v1",mode:"AWAIT_EXACT_EVENT",owner:"REPOSITORY_EVENT_LOOP",next_action:"BIND_EXACT_VERIFIER_RUN_AND_PUBLISHER_RECEIPT",resume_events:["workflow_run.completed","pull_request_target.synchronize","workflow_dispatch"],persistence_run_terminal:false,client_return_allowed:false},productive_effect:false,effect_ack:"NOT_REQUIRED"}' \
            > "$root/dispatch-receipt.json"


      - name: Preserve exact subject dispatch ordinal witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-autonomous-exact-head-dispatch-${{ needs.continue-one-stalled-internal-pr.outputs.pr }}-${{ needs.continue-one-stalled-internal-pr.outputs.head }}-attempt-${{ needs.continue-one-stalled-internal-pr.outputs.attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            ${{ runner.temp }}/qikvrt-autonomous-exact-head-transport/dispatch-request.json
            ${{ runner.temp }}/qikvrt-autonomous-exact-head-transport/dispatch-receipt.json

  observe-exact-review-outbox:
    name: Observe one exact requested-review FIFO result
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.path == '.github/workflows/qikvrt_requested_review_executor.yml' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.status == 'completed')
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: qikvrt-outbox-ledger-authority
    outputs:
      action: ${{ steps.observe.outputs.action }}
      sequence: ${{ steps.observe.outputs.sequence }}
      fingerprint: ${{ steps.observe.outputs.fingerprint }}
      attempt: ${{ steps.observe.outputs.attempt }}
      child_recovery: ${{ steps.observe.outputs.child_recovery }}
      blocker: ${{ steps.observe.outputs.blocker }}
      observation_artifact_id: ${{ steps.observation_evidence.outputs.artifact-id }}
      observation_artifact_digest: ${{ steps.observation_evidence.outputs.artifact-digest }}
      cursor_artifact_id: ${{ steps.cursor_evidence.outputs.artifact-id }}
      cursor_artifact_digest: ${{ steps.cursor_evidence.outputs.artifact-digest }}
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read one exact-review slot with Auditor-only authority
        env:
          LEDGER_AUDITOR_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          auditor_token="${LEDGER_AUDITOR_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_AUDITOR_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$auditor_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          root="$RUNNER_TEMP/qikvrt-exact-review-observation"
          mkdir -p "$root"
          QIKVRT_ENV_OUTBOX_LEDGER_AUDITOR_TOKEN="$auditor_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" --receipt "$root/item.json" \
            next --lane exact-review-dispatch >/dev/null
          unset auditor_token

      - name: Reobserve exact child or one bounded orphan ordinal
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-review-observation"
          test -f "$root/item.json"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$(jq -r '.state' "$root/item.json")" = EMPTY ]; then
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '
            .state == "PENDING" and .lane == "exact-review-dispatch" and
            (.sequence | type) == "number" and .sequence > 0 and
            (.fingerprint | test("^[0-9a-f]{64}$")) and
            .intent.payload.repository == $ENV.GITHUB_REPOSITORY and
            .intent.payload.lane == "exact-review-dispatch" and
            (.intent.payload.main_head_sha | test("^[0-9a-f]{40}$")) and
            .intent.payload.target.workflow_path == ".github/workflows/qikvrt_requested_review_executor.yml" and
            .intent.payload.target.event == "workflow_dispatch" and
            .intent.payload.request.ref == "main" and
            .intent.payload.request.return_run_details == true and
            .intent.payload.request.inputs.transport_intent_sha256 == .fingerprint and
            .intent.payload.request.inputs.transport_attempt == "1"
          ' "$root/item.json" >/dev/null
          sequence="$(jq -r '.sequence' "$root/item.json")"
          fingerprint="$(jq -r '.fingerprint' "$root/item.json")"
          pr="$(jq -r '.intent.payload.subject.pull_request' "$root/item.json")"
          ref="$(jq -r '.intent.payload.subject.head_ref' "$root/item.json")"
          head="$(jq -r '.intent.payload.subject.head_sha' "$root/item.json")"
          tree="$(jq -r '.intent.payload.subject.head_tree_sha' "$root/item.json")"
          base_ref="$(jq -r '.intent.payload.subject.base_ref' "$root/item.json")"
          base="$(jq -r '.intent.payload.subject.base_sha' "$root/item.json")"
          sealed_main="$(jq -r '.intent.payload.main_head_sha' "$root/item.json")"
          seal_authority_observation() {
            blocker="$1"
            test -f "$root/authority-observation.json"
            workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            jq -e --argjson workflow_id "$workflow_id" --arg repository "$GITHUB_REPOSITORY" '
              .id == $workflow_id and
              .path == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .state == "active" and .name == "QIKVRT autonomous PR-head continuation"
            ' <<<"$workflow" >/dev/null
            jq -e --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              --argjson workflow_id "$workflow_id" --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg event "$GITHUB_EVENT_NAME" '
              .id == $run_id and .run_attempt == $run_attempt and
              .workflow_id == $workflow_id and
              (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .repository.full_name == $repository and .event == $event and
              .head_branch == "main" and .head_sha == $workflow_sha
            ' <<<"$run" >/dev/null
            jq -n --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
              --argjson workflow_id "$workflow_id" --argjson run_id "$GITHUB_RUN_ID" \
              --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --arg event "$GITHUB_EVENT_NAME" '
              {workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$workflow_sha,workflow_id:$workflow_id,run_id:$run_id,run_attempt:$run_attempt,event:$event}
            ' > "$root/producer.json"
            echo "action=TERMINALIZE" >> "$GITHUB_OUTPUT"
            echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
            echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "attempt=0" >> "$GITHUB_OUTPUT"
            echo "child_recovery=false" >> "$GITHUB_OUTPUT"
            echo "blocker=$blocker" >> "$GITHUB_OUTPUT"
          }
          if [ "$live_main" != "$GITHUB_WORKFLOW_SHA" ]; then
            # This run's trusted bytes were superseded after admission.  It
            # performs no ledger/effect operation; the next current-main
            # schedule deterministically records the sealed-slot drift.
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$sealed_main" != "$live_main" ]; then
            python3 - "$root/item.json" "$root/authority-observation.json" "$live_main" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          value={
              'schema':AUTHORITY_OBSERVATION_SCHEMA,
              'blocker':'OUTBOX_EVALUATOR_SUPERSEDED',
              'lane':'exact-review-dispatch','sequence':item['sequence'],
              'fingerprint':item['fingerprint'],
              'sealed_main_head_sha':item['intent']['payload']['main_head_sha'],
              'observed_main_head_sha':sys.argv[3],
              'verified':True,'productive_effect':False,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            seal_authority_observation OUTBOX_EVALUATOR_SUPERSEDED
            exit 0
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
          observed_head="$(jq -r '.head.sha' <<<"$current")"
          observed_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${observed_head}" --jq '.tree.sha')"
          jq -n --argjson pr "$pr" --arg repository "$(jq -r '.head.repo.full_name' <<<"$current")" \
            --arg ref "$(jq -r '.head.ref' <<<"$current")" --arg head "$observed_head" \
            --arg tree "$observed_tree" --arg base_ref "$(jq -r '.base.ref' <<<"$current")" \
            --arg base "$(jq -r '.base.sha' <<<"$current")" '
            {pull_request:$pr,head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base}
          ' > "$root/observed-subject.json"
          if ! jq -e --slurpfile observed "$root/observed-subject.json" \
            '.intent.payload.subject == $observed[0]' "$root/item.json" >/dev/null; then
            python3 - "$root/item.json" "$root/observed-subject.json" "$root/authority-observation.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA, digest
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          observed=json.loads(pathlib.Path(sys.argv[2]).read_text())
          sealed=item['intent']['payload']['subject']
          value={
              'schema':AUTHORITY_OBSERVATION_SCHEMA,
              'blocker':'OUTBOX_SUBJECT_SUPERSEDED',
              'lane':'exact-review-dispatch','sequence':item['sequence'],
              'fingerprint':item['fingerprint'],
              'sealed_subject_sha256':digest(sealed),
              'observed_subject':observed,
              'observed_subject_sha256':digest(observed),
              'verified':True,'productive_effect':False,
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            seal_authority_observation OUTBOX_SUBJECT_SUPERSEDED
            exit 0
          fi

          attempt=''
          child_recovery=false
          child_json=''
          if [ "$(jq '.child_recovery | length' "$root/item.json")" -gt 0 ]; then
            attempt="$(jq -r '.child_recovery | to_entries | map(select(.value.acceptance != null)) | map(.key|tonumber) | max // empty' "$root/item.json")"
            if [ -n "$attempt" ]; then
              jq -e --arg attempt "$attempt" '.child_recovery[$attempt].acceptance.child' \
                "$root/item.json" > "$root/locator-child.json"
              child_recovery=true
            fi
          fi
          if [ -z "$attempt" ] && [ "$(jq '.acceptance | length' "$root/item.json")" -gt 0 ]; then
            attempt="$(jq -r '.acceptance | keys | map(tonumber) | max' "$root/item.json")"
            jq -e --arg attempt "$attempt" '.acceptance[$attempt].child' \
              "$root/item.json" > "$root/locator-child.json"
          fi

          if [ -z "$attempt" ]; then
            transport_keys="$(jq -r '.transport | keys | sort | join(",")' "$root/item.json")"
            if [ -z "$transport_keys" ]; then
              attempt=1
              python3 - "$root/item.json" "$root/request.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import canonical_bytes, request_for_transport_attempt
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          pathlib.Path(sys.argv[2]).write_bytes(canonical_bytes(request_for_transport_attempt(item['intent'],1)))
          PY
              echo "action=PREPARE" >> "$GITHUB_OUTPUT"
              echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
              echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
              echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
              echo "child_recovery=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test "$transport_keys" = 1
            attempt="$(jq -r '.transport | keys | map(tonumber) | max' "$root/item.json")"
            test "$attempt" -eq 1
            cursor_state="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].state // ""' "$root/item.json")"
            candidate_count=0
            if [ "$cursor_state" = COMPLETE_SUCCESSOR_OBSERVED ] || \
               [ "$cursor_state" = AMBIGUITY_SET_EXCEEDED_AUTHORITY ]; then
              candidate_count="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.bound_successor_count' "$root/item.json")"
              if [ "$cursor_state" = COMPLETE_SUCCESSOR_OBSERVED ] && [ "$candidate_count" -eq 1 ]; then
                jq -e --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.candidate_locators[0]' \
                  "$root/item.json" > "$root/child.json"
                echo "action=ADOPT" >> "$GITHUB_OUTPUT"
                echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
                echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
                echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
                echo "child_recovery=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if { [ "$cursor_state" = COMPLETE_SUCCESSOR_OBSERVED ] && [ "$candidate_count" -gt 1 ]; } ||
               [ "$cursor_state" = AMBIGUITY_SET_EXCEEDED_AUTHORITY ] ||
               [ "$cursor_state" = SCAN_BOUND_EXCEEDED_AUTHORITY ] ||
               [ "$cursor_state" = COMPLETE_ZERO_SUCCESSOR ]; then
              python3 - "$root/item.json" "$root/authority-observation.json" \
                "$attempt" "$live_main" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_exact_review_outbox import materialize_retry_cursor_authority_observation
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          value=materialize_retry_cursor_authority_observation(
              item=item,transport_attempt=int(sys.argv[3]),
              observed_main_head_sha=sys.argv[4])
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
              blocker="$(jq -r '.blocker' "$root/authority-observation.json")"
              seal_authority_observation "$blocker"
              exit 0
            fi
            if [ "$GITHUB_EVENT_NAME" != schedule ]; then
              echo "action=NONE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            actor_run_id="$(jq -r --arg attempt "$attempt" '.transport[$attempt].actor_run_id' "$root/item.json")"
            actor_run_attempt="$(jq -r --arg attempt "$attempt" '.transport[$attempt].actor_run_attempt' "$root/item.json")"
            actor="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${actor_run_id}/attempts/${actor_run_attempt}")"
            jq -e --argjson run_id "$actor_run_id" --argjson run_attempt "$actor_run_attempt" \
              --arg repository "$GITHUB_REPOSITORY" '
              .id == $run_id and .run_attempt == $run_attempt and
              .repository.full_name == $repository and .status == "completed" and
              (.conclusion | type) == "string" and (.conclusion | length) > 0 and
              (.created_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T")) and
              (.updated_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T"))
            ' <<<"$actor" >/dev/null
            observer="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            jq -e --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg repository "$GITHUB_REPOSITORY" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
              .id == $run_id and .run_attempt == $run_attempt and
              (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .event == "schedule" and .repository.full_name == $repository and
              .head_branch == "main" and .head_sha == $workflow_sha
            ' <<<"$observer" >/dev/null
            observation_started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            actor_updated_at="$(jq -r '.updated_at' <<<"$actor")"
            boundary_complete=false
            if [[ "$observation_started_at" > "$actor_updated_at" ]]; then
              boundary_complete=true
            else
              # A receiver run may appear after the transport actor's terminal
              # timestamp.  Wait for one stable tick and then seal that later
              # timestamp as the immutable scan cutoff.
              echo "action=NONE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            window_start="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.query_window_start // empty' "$root/item.json")"
            window_end="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.query_window_end // empty' "$root/item.json")"
            prior_boundary="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.same_second_boundary_complete // false' "$root/item.json")"
            page="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.next_page // 1' "$root/item.json")"
            page_cap="$(jq -r --arg attempt "$attempt" '.retry_scan_cursor[$attempt].cursor.page_cap // 10' "$root/item.json")"
            test -n "$window_start" || window_start="$(jq -r '.created_at' <<<"$actor")"
            if [ -z "$window_end" ] || [ "$prior_boundary" != true ]; then
              window_end="$observation_started_at"
            fi
            target_workflow_id="$(jq -r '.intent.payload.target.workflow_id' "$root/item.json")"
            page_json="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${target_workflow_id}/runs" \
              -f event=workflow_dispatch -f branch=main \
              -f created="${window_start}..${window_end}" -f per_page=100 -f page="$page")"
            jq -e '
              (.total_count | type) == "number" and .total_count >= 0 and
              (.total_count | floor) == .total_count and
              (.workflow_runs | type) == "array" and
              (.workflow_runs | length) <= 100
            ' \
              <<<"$page_json" >/dev/null
            jq -c '{total_count,workflow_runs}' <<<"$page_json" \
              > "$root/retry-scan-page.json"
            observation_completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python3 - "$root/item.json" "$root/retry-scan-page.json" \
              "$root/retry-scan-cursor.json" "$attempt" "$actor" "$observer" \
              "$observation_started_at" "$observation_completed_at" \
              "$boundary_complete" "$page_cap" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_exact_review_outbox import materialize_retry_scan_cursor
          from tools.qikvrt_ruleset_outbox import canonical_bytes
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          page=json.loads(pathlib.Path(sys.argv[2]).read_text())
          cursor=materialize_retry_scan_cursor(
              item=item,transport_attempt=int(sys.argv[4]),
              actor_run=json.loads(sys.argv[5]),observer_run=json.loads(sys.argv[6]),
              page_response=page,observation_started_at=sys.argv[7],
              observation_completed_at=sys.argv[8],
              same_second_boundary_complete=sys.argv[9] == 'true',
              page_cap=int(sys.argv[10]))
          pathlib.Path(sys.argv[3]).write_bytes(canonical_bytes(cursor))
          PY
            echo "action=CURSOR" >> "$GITHUB_OUTPUT"
            echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
            echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
            echo "child_recovery=false" >> "$GITHUB_OUTPUT"
            echo "cursor_ordinal=$(jq -r '.ordinal' "$root/retry-scan-cursor.json")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_id="$(jq -r '.run_id' "$root/locator-child.json")"
          run_attempt="$(jq -r '.run_attempt' "$root/locator-child.json")"
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}")"
          jq -e --slurpfile locator "$root/locator-child.json" '
            .id == $locator[0].run_id and .run_attempt == $locator[0].run_attempt and
            .workflow_id == $locator[0].workflow_id and
            (.path | split("@")[0]) == $locator[0].workflow_path and
            .event == $locator[0].event and .repository.full_name == $locator[0].repository and
            .head_sha == $locator[0].head_sha and .display_title == $locator[0].display_title
          ' <<<"$run" >/dev/null
          status="$(jq -r '.status' <<<"$run")"
          if [ "$status" != completed ]; then
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e '{run_id:.id,run_attempt,workflow_id,workflow_path:(.path|split("@")[0]),event,repository:.repository.full_name,head_sha,status,conclusion,display_title}' \
            <<<"$run" > "$root/child.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${run_attempt}/jobs?filter=all&per_page=100" \
            > "$root/job-pages.json"
          jq -e '
            length > 0 and ([.[].total_count] | unique | length) == 1 and
            ([.[] | .jobs[]] | length) == .[0].total_count
          ' "$root/job-pages.json" >/dev/null
          jobs_total="$(jq '.[0].total_count' "$root/job-pages.json")"
          if [ "$jobs_total" -eq 0 ]; then
            # Accepted zero-job cancellation is recovered only by the separate
            # same-run admission recovery workflow.  It never authorizes a
            # second new workflow-dispatch child here.
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq '[.[] | .jobs[]]' "$root/job-pages.json" > "$root/jobs.json"
          conclusion="$(jq -r '.conclusion' "$root/child.json")"
          completion_artifact_name="qikvrt-requested-review-completion-${run_id}-attempt-${run_attempt}"
          business_artifact_pattern="^qikvrt-mesh-review-pr-${pr}-${head}-[0-9a-f]{64}-run-${run_id}-attempt-${run_attempt}$"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            > "$root/artifact-pages.json"
          jq -e --argjson run_id "$run_id" '
            length > 0 and ([.[].total_count] | unique | length) == 1 and
            ([.[] | .artifacts[]] | length) == .[0].total_count and
            ([.[] | .artifacts[] | select(.workflow_run.id != $run_id)] | length) == 0
          ' "$root/artifact-pages.json" >/dev/null
          jq '[.[] | .artifacts[]]' "$root/artifact-pages.json" > "$root/artifacts.json"
          completion_count="$(jq --arg name "$completion_artifact_name" \
            '[.[] | select(.name == $name and .expired == false)] | length' "$root/artifacts.json")"
          if [ "$completion_count" -eq 0 ] && [ "$child_recovery" = false ]; then
            python3 - "$root/item.json" "$root/child.json" "$root/authority-observation.json" \
              "$attempt" "$jobs_total" "$completion_artifact_name" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA, digest
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          child=json.loads(pathlib.Path(sys.argv[2]).read_text())
          acceptance=item['acceptance'][str(int(sys.argv[4]))]
          value={
              'schema':AUTHORITY_OBSERVATION_SCHEMA,
              'blocker':'EXACT_REVIEW_COMPLETION_EVIDENCE_MISSING',
              'lane':'exact-review-dispatch','sequence':item['sequence'],
              'fingerprint':item['fingerprint'],'transport_attempt':int(sys.argv[4]),
              'accepted_child_sha256':acceptance['child_sha256'],
              'observed_child':child,'observed_child_sha256':digest(child),
              'jobs_total_count':int(sys.argv[5]),
              'expected_artifact_name':sys.argv[6],
              'evidence_classification':'MISSING_ARTIFACT','artifact_count':0,
              'artifact_set_sha256':digest([]),
              'scan_complete':True,'verified':True,'productive_effect':False,
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            seal_authority_observation EXACT_REVIEW_COMPLETION_EVIDENCE_MISSING
            exit 0
          fi
          if [ "$conclusion" = success ]; then
            jq --arg pattern "$business_artifact_pattern" \
              '[.[] | select((.name | test($pattern)) and .expired == false)]' \
              "$root/artifacts.json" > "$root/matched-artifacts.json"
          else
            jq --arg name "$completion_artifact_name" \
              '[.[] | select(.name == $name and .expired == false)]' \
              "$root/artifacts.json" > "$root/matched-artifacts.json"
          fi
          matched_count="$(jq 'length' "$root/matched-artifacts.json")"
          test "$matched_count" -eq 1
          jq -e '.[0]' "$root/matched-artifacts.json" > "$root/artifact.json"
          artifact_id="$(jq -r '.id' "$root/artifact.json")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$root/artifact.zip"
          recovery_args=()
          if [ "$child_recovery" = true ]; then recovery_args=(--child-recovery); fi
          python3 -B tools/qikvrt_exact_review_outbox.py \
            --item "$root/item.json" --child "$root/child.json" --jobs "$root/jobs.json" \
            --artifact "$root/artifact.json" --archive "$root/artifact.zip" \
            --transport-attempt "$attempt" "${recovery_args[@]}" --output-dir "$root/result"
          cp "$root/result/completion-evidence.json" "$root/completion-evidence.json"
          cp "$root/result/terminal.json" "$root/terminal.json"
          echo "action=COMPLETE" >> "$GITHUB_OUTPUT"
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "child_recovery=$child_recovery" >> "$GITHUB_OUTPUT"

      - name: Preserve immutable exact-review retry scan cursor
        id: cursor_evidence
        if: steps.observe.outputs.action == 'CURSOR'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-outbox-retry-scan-cursor-exact-review-dispatch-${{ steps.observe.outputs.sequence }}-attempt-${{ steps.observe.outputs.attempt }}-ordinal-${{ steps.observe.outputs.cursor_ordinal }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-review-observation/retry-scan-cursor.json

      - name: Preserve exact-review observation for one Writer CAS
        id: observation_evidence
        if: steps.observe.outputs.action != 'NONE' && steps.observe.outputs.action != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-review-observation-${{ steps.observe.outputs.sequence }}-${{ steps.observe.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-review-observation

  mutate-exact-review-outbox:
    name: Apply one exact requested-review FIFO mutation
    needs: observe-exact-review-outbox
    if: >-
      needs.observe-exact-review-outbox.outputs.action != '' &&
      needs.observe-exact-review-outbox.outputs.action != 'NONE'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-exact-review-dispatch
      cancel-in-progress: false
      queue: max
    env:
      OBSERVED_ACTION: ${{ needs.observe-exact-review-outbox.outputs.action }}
      OUTBOX_SEQUENCE: ${{ needs.observe-exact-review-outbox.outputs.sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.observe-exact-review-outbox.outputs.fingerprint }}
      OUTBOX_ATTEMPT: ${{ needs.observe-exact-review-outbox.outputs.attempt }}
      CHILD_RECOVERY: ${{ needs.observe-exact-review-outbox.outputs.child_recovery }}
      OBSERVED_BLOCKER: ${{ needs.observe-exact-review-outbox.outputs.blocker }}
      OBSERVATION_ARTIFACT_ID: ${{ needs.observe-exact-review-outbox.outputs.observation_artifact_id }}
      OBSERVATION_ARTIFACT_DIGEST: ${{ needs.observe-exact-review-outbox.outputs.observation_artifact_digest }}
      CURSOR_ARTIFACT_ID: ${{ needs.observe-exact-review-outbox.outputs.cursor_artifact_id }}
      CURSOR_ARTIFACT_DIGEST: ${{ needs.observe-exact-review-outbox.outputs.cursor_artifact_digest }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-exact-review-dispatch
    outputs:
      action: ${{ steps.mutate.outputs.action }}
      sequence: ${{ steps.mutate.outputs.sequence }}
      fingerprint: ${{ steps.mutate.outputs.fingerprint }}
      attempt: ${{ steps.mutate.outputs.attempt }}
      transport_artifact_id: ${{ steps.transport_evidence.outputs.artifact-id }}
      transport_artifact_digest: ${{ steps.transport_evidence.outputs.artifact-digest }}
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind and download exact-review observation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OBSERVATION_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$OBSERVATION_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${OBSERVATION_ARTIFACT_ID}")"
          jq -e --argjson id "$OBSERVATION_ARTIFACT_ID" \
            --arg name "qikvrt-exact-review-observation-${OUTBOX_SEQUENCE}-${OUTBOX_FINGERPRINT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${OBSERVATION_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == $run_id and .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download exact-review observation bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.observe-exact-review-outbox.outputs.observation_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-review-writer

      - name: Bind exact-review retry cursor artifact identity
        if: env.OBSERVED_ACTION == 'CURSOR'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CURSOR_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CURSOR_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          cursor_ordinal="$(jq -r '.ordinal' "$RUNNER_TEMP/qikvrt-exact-review-writer/retry-scan-cursor.json")"
          [[ "$cursor_ordinal" =~ ^[1-9][0-9]*$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURSOR_ARTIFACT_ID}")"
          jq -e --argjson id "$CURSOR_ARTIFACT_ID" \
            --arg name "qikvrt-outbox-retry-scan-cursor-exact-review-dispatch-${OUTBOX_SEQUENCE}-attempt-${OUTBOX_ATTEMPT}-ordinal-${cursor_ordinal}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${CURSOR_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Rebind exact-review subject without ledger credentials
        id: rebind
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-review-writer"
          test -f "$root/item.json"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          jq -e --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" '
            .state == "PENDING" and .lane == "exact-review-dispatch" and
            .sequence == $sequence and .fingerprint == $fingerprint
          ' "$root/item.json" >/dev/null
          pr="$(jq -r '.intent.payload.subject.pull_request' "$root/item.json")"
          ref="$(jq -r '.intent.payload.subject.head_ref' "$root/item.json")"
          head="$(jq -r '.intent.payload.subject.head_sha' "$root/item.json")"
          tree="$(jq -r '.intent.payload.subject.head_tree_sha' "$root/item.json")"
          base_ref="$(jq -r '.intent.payload.subject.base_ref' "$root/item.json")"
          base="$(jq -r '.intent.payload.subject.base_sha' "$root/item.json")"
          sealed_main="$(jq -r '.intent.payload.main_head_sha' "$root/item.json")"
          action="$OBSERVED_ACTION"
          blocker="$OBSERVED_BLOCKER"
          [[ "$action" =~ ^(ADOPT|COMPLETE|CURSOR|PREPARE|TERMINALIZE)$ ]]
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$live_main" != "$GITHUB_WORKFLOW_SHA" ]; then
            echo "action=NONE" >> "$GITHUB_OUTPUT"
            echo "blocker=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$sealed_main" != "$live_main" ]; then
            blocker=OUTBOX_EVALUATOR_SUPERSEDED
            action=TERMINALIZE
            python3 - "$root/item.json" "$root/authority-observation.json" "$live_main" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          value={'schema':AUTHORITY_OBSERVATION_SCHEMA,'blocker':'OUTBOX_EVALUATOR_SUPERSEDED','lane':'exact-review-dispatch','sequence':item['sequence'],'fingerprint':item['fingerprint'],'sealed_main_head_sha':item['intent']['payload']['main_head_sha'],'observed_main_head_sha':sys.argv[3],'verified':True,'productive_effect':False}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
          else
            current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
            observed_head="$(jq -r '.head.sha' <<<"$current")"
            observed_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${observed_head}" --jq '.tree.sha')"
            jq -n --argjson pr "$pr" --arg repository "$(jq -r '.head.repo.full_name' <<<"$current")" \
              --arg ref "$(jq -r '.head.ref' <<<"$current")" --arg head "$observed_head" \
              --arg tree "$observed_tree" --arg base_ref "$(jq -r '.base.ref' <<<"$current")" \
              --arg base "$(jq -r '.base.sha' <<<"$current")" '
              {pull_request:$pr,head_repository:$repository,head_ref:$ref,head_sha:$head,head_tree_sha:$tree,base_ref:$base_ref,base_sha:$base}
            ' > "$root/observed-subject.json"
            if ! jq -e --slurpfile observed "$root/observed-subject.json" \
              '.intent.payload.subject == $observed[0]' "$root/item.json" >/dev/null; then
              blocker=OUTBOX_SUBJECT_SUPERSEDED
              action=TERMINALIZE
              python3 - "$root/item.json" "$root/observed-subject.json" "$root/authority-observation.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import AUTHORITY_OBSERVATION_SCHEMA, digest
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          observed=json.loads(pathlib.Path(sys.argv[2]).read_text())
          sealed=item['intent']['payload']['subject']
          value={'schema':AUTHORITY_OBSERVATION_SCHEMA,'blocker':'OUTBOX_SUBJECT_SUPERSEDED','lane':'exact-review-dispatch','sequence':item['sequence'],'fingerprint':item['fingerprint'],'sealed_subject_sha256':digest(sealed),'observed_subject':observed,'observed_subject_sha256':digest(observed),'verified':True,'productive_effect':False}
          pathlib.Path(sys.argv[3]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
            fi
          fi
          if [ "$action" = TERMINALIZE ]; then
            test -f "$root/authority-observation.json"
            test "$(jq -r '.blocker' "$root/authority-observation.json")" = "$blocker"
            workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_autonomous_pr_head_continuation.yml")"
            workflow_id="$(jq -r '.id' <<<"$workflow")"
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            jq -e --argjson workflow_id "$workflow_id" --argjson run_id "$GITHUB_RUN_ID" \
              --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --arg repository "$GITHUB_REPOSITORY" \
              --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg event "$GITHUB_EVENT_NAME" '
              .id == $run_id and .run_attempt == $run_attempt and .workflow_id == $workflow_id and
              (.path | split("@")[0]) == ".github/workflows/qikvrt_autonomous_pr_head_continuation.yml" and
              .repository.full_name == $repository and .head_branch == "main" and
              .head_sha == $workflow_sha and .event == $event
            ' <<<"$run" >/dev/null
            jq -n --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --argjson workflow_id "$workflow_id" \
              --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg event "$GITHUB_EVENT_NAME" '
              {workflow_path:".github/workflows/qikvrt_autonomous_pr_head_continuation.yml",workflow_sha:$workflow_sha,workflow_id:$workflow_id,run_id:$run_id,run_attempt:$run_attempt,event:$event}
            ' > "$root/producer.json"
          elif [ "$action" = CURSOR ]; then
            test -f "$root/retry-scan-cursor.json"
            test "$OUTBOX_ATTEMPT" -eq 1
            jq -e --arg lane exact-review-dispatch --argjson sequence "$OUTBOX_SEQUENCE" \
              --arg fingerprint "$OUTBOX_FINGERPRINT" --argjson attempt "$OUTBOX_ATTEMPT" \
              --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
              .lane == $lane and .sequence == $sequence and
              .fingerprint == $fingerprint and .transport_attempt == $attempt and
              .observation_producer.run_id == $run_id and
              .observation_producer.run_attempt == $run_attempt and
              .observation_producer.event == "schedule" and
              .verified == true and .productive_effect == false
            ' "$root/retry-scan-cursor.json" >/dev/null
          elif [ "$action" = ADOPT ]; then
            test -f "$root/child.json"
            test "$OUTBOX_ATTEMPT" -eq 1
            python3 - "$root/item.json" "$root/child.json" "$OUTBOX_ATTEMPT" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import normalize_child_for_intent
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          child=json.loads(pathlib.Path(sys.argv[2]).read_text())
          if normalize_child_for_intent(child,intent=item['intent'],attempt=int(sys.argv[3])) != child:
              raise SystemExit('exact-review cursor child normalization drifted')
          PY
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "blocker=$blocker" >> "$GITHUB_OUTPUT"

      - name: Preserve immutable exact-review Authority observation
        id: authority_evidence
        if: steps.rebind.outputs.action == 'TERMINALIZE'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-outbox-authority-observation-exact-review-dispatch-${{ needs.observe-exact-review-outbox.outputs.sequence }}-${{ steps.rebind.outputs.blocker }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-review-writer/authority-observation.json

      - name: Bind exact-review Authority observation artifact identity
        if: steps.rebind.outputs.action == 'TERMINALIZE'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ARTIFACT_ID: ${{ steps.authority_evidence.outputs.artifact-id }}
          AUTHORITY_ARTIFACT_DIGEST: ${{ steps.authority_evidence.outputs.artifact-digest }}
          EFFECTIVE_BLOCKER: ${{ steps.rebind.outputs.blocker }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORITY_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTHORITY_ARTIFACT_ID}")"
          jq -e --argjson id "$AUTHORITY_ARTIFACT_ID" \
            --arg name "qikvrt-outbox-authority-observation-exact-review-dispatch-${OUTBOX_SEQUENCE}-${EFFECTIVE_BLOCKER}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${AUTHORITY_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Apply exact-review ledger mutation only
        id: mutate
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
          EFFECTIVE_ACTION: ${{ steps.rebind.outputs.action }}
          EFFECTIVE_BLOCKER: ${{ steps.rebind.outputs.blocker }}
          AUTHORITY_ARTIFACT_ID: ${{ steps.authority_evidence.outputs.artifact-id }}
          AUTHORITY_ARTIFACT_DIGEST: ${{ steps.authority_evidence.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          ledger_write() {
            QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
            QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
            QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
              python3 -B tools/qikvrt_ruleset_outbox.py "$@"
          }
          root="$RUNNER_TEMP/qikvrt-exact-review-writer"
          case "$EFFECTIVE_ACTION" in
            ADOPT)
              ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/acceptance.json" \
                accept --lane exact-review-dispatch --sequence "$OUTBOX_SEQUENCE" \
                --attempt "$OUTBOX_ATTEMPT" --child "$root/child.json" >/dev/null
              echo "action=NONE" >> "$GITHUB_OUTPUT"
              ;;
            COMPLETE)
              recovery_args=()
              if [ "$CHILD_RECOVERY" = true ]; then recovery_args=(--child-recovery); fi
              ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/completion.json" \
                complete --lane exact-review-dispatch --sequence "$OUTBOX_SEQUENCE" \
                --attempt "$OUTBOX_ATTEMPT" --child "$root/child.json" \
                --evidence "$root/completion-evidence.json" "${recovery_args[@]}" >/dev/null
              ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/terminal-receipt.json" \
                terminalize --lane exact-review-dispatch --sequence "$OUTBOX_SEQUENCE" \
                --evidence "$root/terminal.json" >/dev/null
              echo "action=NONE" >> "$GITHUB_OUTPUT"
              ;;
            CURSOR)
              [[ "$CURSOR_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$CURSOR_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
              cursor_ordinal="$(jq -r '.ordinal' "$root/retry-scan-cursor.json")"
              cursor_name="qikvrt-outbox-retry-scan-cursor-exact-review-dispatch-${OUTBOX_SEQUENCE}-attempt-${OUTBOX_ATTEMPT}-ordinal-${cursor_ordinal}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
              ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/retry-scan-cursor-receipt.json" \
                record-retry-scan-cursor --lane exact-review-dispatch --sequence "$OUTBOX_SEQUENCE" \
                --cursor "$root/retry-scan-cursor.json" --artifact-id "$CURSOR_ARTIFACT_ID" \
                --artifact-name "$cursor_name" \
                --artifact-digest "${CURSOR_ARTIFACT_DIGEST#sha256:}" >/dev/null
              echo "action=NONE" >> "$GITHUB_OUTPUT"
              ;;
            TERMINALIZE)
              [[ "$AUTHORITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$AUTHORITY_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
              authority_name="qikvrt-outbox-authority-observation-exact-review-dispatch-${OUTBOX_SEQUENCE}-${EFFECTIVE_BLOCKER}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
              ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/authority-record.json" \
                record-observation --lane exact-review-dispatch --sequence "$OUTBOX_SEQUENCE" \
                --observation "$root/authority-observation.json" --producer "$root/producer.json" \
                --artifact-id "$AUTHORITY_ARTIFACT_ID" --artifact-name "$authority_name" \
                --artifact-digest "${AUTHORITY_ARTIFACT_DIGEST#sha256:}" >/dev/null
              python3 - "$root/item.json" "$root/authority-record.json" "$root/terminal.json" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_exact_review_outbox import materialize_authority_terminal
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          record=json.loads(pathlib.Path(sys.argv[2]).read_text())
          value=materialize_authority_terminal(item=item,authority_record=record)
          pathlib.Path(sys.argv[3]).write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
              ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/terminal-receipt.json" \
                terminalize --lane exact-review-dispatch --sequence "$OUTBOX_SEQUENCE" \
                --evidence "$root/terminal.json" >/dev/null
              echo "action=NONE" >> "$GITHUB_OUTPUT"
              ;;
            PREPARE)
              test "$OUTBOX_ATTEMPT" -eq 1
              ledger_write --repository "$GITHUB_REPOSITORY" --receipt "$root/transport.json" \
                prepare-transport --lane exact-review-dispatch --sequence "$OUTBOX_SEQUENCE" \
                --attempt "$OUTBOX_ATTEMPT" --request "$root/request.json" \
                --actor-run-id "$GITHUB_RUN_ID" --actor-run-attempt "$GITHUB_RUN_ATTEMPT" >/dev/null
              jq -e '.cas.persisted == true and (.cas.appended | type) == "boolean"' \
                "$root/transport.json" >/dev/null
              if [ "$(jq -r '.cas.appended' "$root/transport.json")" != true ]; then
                echo "action=NONE" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              mkdir -p "$root/prepared"
              cp "$root/item.json" "$root/prepared/item.json"
              cp "$root/request.json" "$root/prepared/request.json"
              cp "$root/transport.json" "$root/prepared/transport.json"
              echo "action=POST" >> "$GITHUB_OUTPUT"
              echo "sequence=$OUTBOX_SEQUENCE" >> "$GITHUB_OUTPUT"
              echo "fingerprint=$OUTBOX_FINGERPRINT" >> "$GITHUB_OUTPUT"
              echo "attempt=$OUTBOX_ATTEMPT" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unsupported exact-review mutation" >&2; exit 1 ;;
          esac
          unset writer_token

      - name: Preserve exact-review recovery pre-effect bytes
        id: transport_evidence
        if: steps.mutate.outputs.action == 'POST'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-review-recovery-pre-effect-${{ steps.mutate.outputs.sequence }}-${{ steps.mutate.outputs.fingerprint }}-transport-${{ steps.mutate.outputs.attempt }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-exact-review-writer/prepared

  dispatch-exact-review-outbox-recovery:
    name: Dispatch one prepared exact requested-review recovery
    needs: mutate-exact-review-outbox
    if: needs.mutate-exact-review-outbox.outputs.action == 'POST'
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      OUTBOX_SEQUENCE: ${{ needs.mutate-exact-review-outbox.outputs.sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.mutate-exact-review-outbox.outputs.fingerprint }}
      OUTBOX_ATTEMPT: ${{ needs.mutate-exact-review-outbox.outputs.attempt }}
      TRANSPORT_ARTIFACT_ID: ${{ needs.mutate-exact-review-outbox.outputs.transport_artifact_id }}
      TRANSPORT_ARTIFACT_DIGEST: ${{ needs.mutate-exact-review-outbox.outputs.transport_artifact_digest }}
    outputs:
      child_artifact_id: ${{ steps.child_evidence.outputs.artifact-id }}
      child_artifact_digest: ${{ steps.child_evidence.outputs.artifact-digest }}
      child_found: ${{ steps.dispatch.outputs.child_found }}
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact-review pre-effect artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRANSPORT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TRANSPORT_ARTIFACT_ID}")"
          jq -e --argjson id "$TRANSPORT_ARTIFACT_ID" \
            --arg name "qikvrt-exact-review-recovery-pre-effect-${OUTBOX_SEQUENCE}-${OUTBOX_FINGERPRINT}-transport-${OUTBOX_ATTEMPT}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" \
            --arg digest "sha256:${TRANSPORT_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == $run_id and .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download exact-review pre-effect bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.mutate-exact-review-outbox.outputs.transport_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-review-dispatch

      - name: Reobserve and dispatch exactly one requested-review attempt
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-review-dispatch"
          test "$OUTBOX_ATTEMPT" -eq 1
          test -f "$root/item.json"
          test -f "$root/request.json"
          test -f "$root/transport.json"
          test "$(find "$root" -type f | wc -l)" -eq 3
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"
          jq -e --argjson sequence "$OUTBOX_SEQUENCE" --arg fingerprint "$OUTBOX_FINGERPRINT" \
            --argjson attempt "$OUTBOX_ATTEMPT" --argjson actor "$GITHUB_RUN_ID" \
            --argjson actor_attempt "$GITHUB_RUN_ATTEMPT" '
            .lane == "exact-review-dispatch" and .sequence == $sequence and
            .fingerprint == $fingerprint and .attempt == $attempt and
            .state == "PRE_EFFECT_REOBSERVED" and
            .actor_run_id == $actor and .actor_run_attempt == $actor_attempt and
            .cas.persisted == true and .cas.appended == true
          ' "$root/transport.json" >/dev/null
          python3 - "$root/item.json" "$root/request.json" "$root/transport.json" "$OUTBOX_ATTEMPT" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_ruleset_outbox import digest, request_for_transport_attempt
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          request=json.loads(pathlib.Path(sys.argv[2]).read_text())
          transport=json.loads(pathlib.Path(sys.argv[3]).read_text())
          if request != request_for_transport_attempt(item['intent'],int(sys.argv[4])):
              raise SystemExit('exact-review recovery request drifted')
          if transport['request_sha256'] != digest(request):
              raise SystemExit('exact-review recovery request digest drifted')
          PY
          pr="$(jq -r '.intent.payload.subject.pull_request' "$root/item.json")"
          ref="$(jq -r '.intent.payload.subject.head_ref' "$root/item.json")"
          head="$(jq -r '.intent.payload.subject.head_sha' "$root/item.json")"
          tree="$(jq -r '.intent.payload.subject.head_tree_sha' "$root/item.json")"
          base_ref="$(jq -r '.intent.payload.subject.base_ref' "$root/item.json")"
          base="$(jq -r '.intent.payload.subject.base_sha' "$root/item.json")"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg ref "$ref" --arg head "$head" \
            --arg base_ref "$base_ref" --arg base "$base" '
            .state == "open" and .head.repo.full_name == $repository and
            .head.ref == $ref and .head.sha == $head and
            .base.ref == $base_ref and .base.sha == $base
          ' <<<"$current" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${head}" --jq '.tree.sha')" = "$tree"
          workflow_id="$(jq -r '.intent.payload.target.workflow_id' "$root/item.json")"
          expected_title="$(python3 - "$root/item.json" "$OUTBOX_ATTEMPT" <<'PY'
          import json, pathlib, sys
          from tools.qikvrt_requested_review_executor import requested_review_run_title
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          inputs=item['intent']['payload']['request']['inputs']
          print(requested_review_run_title(
              evaluator_sha=inputs['evaluator_sha'],pr_number=int(inputs['pr']),
              head_sha=inputs['head'],fingerprint=inputs['fingerprint'],
              transport_intent_sha256=item['fingerprint'],transport_attempt=int(sys.argv[2])))
          PY
          )"
          set +e
          gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
            --input "$root/request.json" > "$root/response.json"
          post_rc=$?
          set -e
          if [ "$post_rc" -ne 0 ]; then
            rm -f "$root/response.json"
            # The scheduled recovery observer owns all post-failure child
            # discovery.  This effect job has not yet reached a terminal actor
            # state and must never authorize absence or another transport.
            exit "$post_rc"
          fi
          jq -e '
            (keys | sort) == ["html_url","run_url","workflow_run_id"] and
            (.workflow_run_id | type) == "number" and .workflow_run_id > 0 and
            (.run_url | type) == "string" and (.run_url | length) > 0 and
            (.html_url | type) == "string" and (.html_url | length) > 0
          ' "$root/response.json" >/dev/null
          child_run_id="$(jq -r '.workflow_run_id' "$root/response.json")"
          child="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${child_run_id}")"
          jq -e --argjson id "$child_run_id" --argjson workflow_id "$workflow_id" \
            --arg repository "$GITHUB_REPOSITORY" --arg main "$GITHUB_WORKFLOW_SHA" \
            --arg title "$expected_title" '
            .id == $id and .run_attempt == 1 and .workflow_id == $workflow_id and
            (.path | split("@")[0]) == ".github/workflows/qikvrt_requested_review_executor.yml" and
            .event == "workflow_dispatch" and .repository.full_name == $repository and
            .head_branch == "main" and .head_sha == $main and .display_title == $title and
            ((.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") and .conclusion == null or
             (.status == "completed" and (.conclusion | type) == "string" and (.conclusion | length) > 0))
          ' <<<"$child" >/dev/null
          jq -e '{run_id:.id,run_attempt,workflow_id,workflow_path:(.path|split("@")[0]),event,repository:.repository.full_name,head_sha,status,conclusion,display_title}' \
            <<<"$child" > "$root/child.json"
          echo "child_found=true" >> "$GITHUB_OUTPUT"

      - name: Preserve exact-review recovered child locator
        id: child_evidence
        if: steps.dispatch.outputs.child_found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-exact-review-recovery-child-${{ needs.mutate-exact-review-outbox.outputs.sequence }}-${{ needs.mutate-exact-review-outbox.outputs.fingerprint }}-attempt-${{ needs.mutate-exact-review-outbox.outputs.attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            ${{ runner.temp }}/qikvrt-exact-review-dispatch/request.json
            ${{ runner.temp }}/qikvrt-exact-review-dispatch/response.json
            ${{ runner.temp }}/qikvrt-exact-review-dispatch/child.json

  accept-exact-review-outbox-recovery:
    name: Persist one recovered exact requested-review child
    needs: [mutate-exact-review-outbox, dispatch-exact-review-outbox-recovery]
    if: >-
      needs.dispatch-exact-review-outbox-recovery.result == 'success' &&
      needs.dispatch-exact-review-outbox-recovery.outputs.child_found == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: qikvrt-outbox-ledger-authority
    concurrency:
      group: qikvrt-outbox-ledger-v2-exact-review-dispatch
      cancel-in-progress: false
      queue: max
    env:
      OUTBOX_SEQUENCE: ${{ needs.mutate-exact-review-outbox.outputs.sequence }}
      OUTBOX_FINGERPRINT: ${{ needs.mutate-exact-review-outbox.outputs.fingerprint }}
      OUTBOX_ATTEMPT: ${{ needs.mutate-exact-review-outbox.outputs.attempt }}
      CHILD_ARTIFACT_ID: ${{ needs.dispatch-exact-review-outbox-recovery.outputs.child_artifact_id }}
      CHILD_ARTIFACT_DIGEST: ${{ needs.dispatch-exact-review-outbox-recovery.outputs.child_artifact_digest }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-exact-review-dispatch
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind and download recovered child locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CHILD_ARTIFACT_ID}")"
          jq -e --argjson id "$CHILD_ARTIFACT_ID" \
            --arg name "qikvrt-exact-review-recovery-child-${OUTBOX_SEQUENCE}-${OUTBOX_FINGERPRINT}-attempt-${OUTBOX_ATTEMPT}" \
            --arg digest "sha256:${CHILD_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" '
            .id == $id and .name == $name and .digest == $digest and .expired == false and
            .workflow_run.id == $run_id and .workflow_run.head_sha == $workflow_sha
          ' <<<"$artifact" >/dev/null

      - name: Download recovered child bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.dispatch-exact-review-outbox-recovery.outputs.child_artifact_id }}
          path: ${{ runner.temp }}/qikvrt-exact-review-recovered-child

      - name: Rebind recovered child without ledger credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-exact-review-recovered-child"
          test "$OUTBOX_ATTEMPT" -eq 1
          child_run_id="$(jq -r '.run_id' "$root/child.json")"
          child="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${child_run_id}")"
          jq -e --slurpfile sealed "$root/child.json" '
            .id == $sealed[0].run_id and .run_attempt == $sealed[0].run_attempt and
            .workflow_id == $sealed[0].workflow_id and (.path|split("@")[0]) == $sealed[0].workflow_path and
            .event == $sealed[0].event and .repository.full_name == $sealed[0].repository and
            .head_sha == $sealed[0].head_sha and .display_title == $sealed[0].display_title
          ' <<<"$child" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_WORKFLOW_SHA"

      - name: Append recovered exact-review acceptance CAS only
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          writer_token="${LEDGER_WRITER_TOKEN-}"
          writer_actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$writer_token"
          [[ "$writer_actor" =~ ^[1-9][0-9]*$ ]]
          test "$OUTBOX_ATTEMPT" -eq 1
          root="$RUNNER_TEMP/qikvrt-exact-review-recovered-child"
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$writer_token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$writer_actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
            --repository "$GITHUB_REPOSITORY" --receipt "$root/acceptance.json" \
            accept --lane exact-review-dispatch --sequence "$OUTBOX_SEQUENCE" \
            --attempt "$OUTBOX_ATTEMPT" --child "$root/child.json" >/dev/null
          unset writer_token

  hold-ruleset-reconciliation-for-manual-authority:
    name: Record manual ruleset Authority HOLD
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/qikvrt_required_review_gate.yml' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
    steps:
      - name: Reobserve the manual-only ruleset boundary
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-ruleset-authority-hold
          mkdir -p "$root"
          live_main="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/commits/main" --jq .sha)"
          test "$live_main" = "$SEALED_EVALUATOR"
          source="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT")"
          jq -e --arg repository "$REPOSITORY" \
            --argjson run_id "$SOURCE_RUN_ID" \
            --argjson run_attempt "$SOURCE_RUN_ATTEMPT" \
            --argjson workflow_id "$SOURCE_WORKFLOW_ID" '
            .id == $run_id and .run_attempt == $run_attempt and
            .workflow_id == $workflow_id and
            .path == ".github/workflows/qikvrt_required_review_gate.yml" and
            .repository.full_name == $repository and .head_branch == "main" and
            .status == "completed" and .conclusion == "success"
          ' <<<"$source" >/dev/null
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg evaluator "$SEALED_EVALUATOR" \
            --argjson run_id "$SOURCE_RUN_ID" \
            --argjson run_attempt "$SOURCE_RUN_ATTEMPT" \
            --argjson workflow_id "$SOURCE_WORKFLOW_ID" '
            {
              schema:"qikvrt_ruleset_manual_authority_hold_v1",
              state:"REQUEST_AUTHORITY",
              d0:3,
              reason:"AUTOMATIC_BRANCH_PROTECTION_CHANGE_NOT_AUTHORIZED",
              repository:$repository,
              evaluator_sha:$evaluator,
              source:{
                workflow_path:".github/workflows/qikvrt_required_review_gate.yml",
                workflow_id:$workflow_id,
                run_id:$run_id,
                run_attempt:$run_attempt
              },
              manual_continuation:{
                workflow_path:".github/workflows/qikvrt_ruleset_reconcile.yml",
                event:"workflow_dispatch",
                environment:"qikvrt-ruleset-authority"
              },
              automatic_ruleset_dispatch:false,
              automatic_reconciler_rerun:false,
              automatic_requested_review_resume:false,
              completion_claims:{
                PASS:false,
                FINAL_PASS:false,
                EFFECT_ACK_DONE:false,
                MERGE:false
              },
              verified:true,
              productive_effect:false,
              effect_ack:"NOT_REQUIRED"
            }
          ' > "$root/authority-hold.json"
          jq -e '
            .d0 == 3 and .state == "REQUEST_AUTHORITY" and
            .automatic_ruleset_dispatch == false and
            .automatic_reconciler_rerun == false and
            .automatic_requested_review_resume == false and
            .productive_effect == false
          ' "$root/authority-hold.json" >/dev/null

      - name: Preserve the manual ruleset Authority HOLD
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-ruleset-manual-authority-hold-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: /tmp/qikvrt-ruleset-authority-hold/authority-hold.json
