name: QIKVRT IEDL seven-stage proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_iedl_seven_stage.yml"
      - "docs/IEDL_FOR_CHILDREN.md"
      - "state/work_units/IEDL_FOR_CHILDREN_V1.json"
      - "tools/qikvrt_iedl_for_children.py"
      - "tests/test_iedl_for_children.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-iedl-seven-stage-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-and-execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact head and tree
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$head" = "$expected"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run seven-stage unit and exhaustive negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B tests/test_iedl_for_children.py

      - name: Execute positive witness and finite proof
        shell: bash
        env:
          SOURCE_HEAD: ${{ steps.binding.outputs.head }}
          SOURCE_TREE: ${{ steps.binding.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qikvrt-iedl"
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B tools/qikvrt_iedl_for_children.py prove \
              --source-head "$SOURCE_HEAD" \
              --source-tree "$SOURCE_TREE" \
              --output "$RUNNER_TEMP/qikvrt-iedl/RECEIPT.json"
          python3 -B - "$RUNNER_TEMP/qikvrt-iedl/RECEIPT.json" <<'PY'
          import json
          import pathlib
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert receipt["gate_combinations_checked"] == 64
          assert receipt["blocked_combinations"] == 63
          assert receipt["productive_combinations"] == 1
          assert receipt["counterexamples"] == []
          assert receipt["productive_effect_iff_all_six_gates"] is True
          assert receipt["protected_invariant_preserved"] is True
          assert receipt["positive_witness"]["verified_improvement"] is True
          assert receipt["MACH_IMPLIES_SUCCESS"] is False
          assert receipt["LATER_IMPLIES_BETTER"] is False
          assert receipt["external_effect"] == "NONE"
          assert receipt["PASS"] is False
          assert receipt["FINAL_PASS"] is False
          assert receipt["EFFECT_ACK_DONE"] is False
          PY

      - name: Preserve exact-head proof receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-iedl-seven-stage-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/qikvrt-iedl/RECEIPT.json
