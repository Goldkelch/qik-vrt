name: QIKVRT progress-deadlock self-repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: qikvrt-progress-deadlock-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - name: Apply exact progress-deadlock repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/qikvrt_batch04_integrity.yml')
          old = path.read_text(encoding='utf-8')
          needle = '  cancel-in-progress: false\n'
          if old.count(needle) != 1:
              raise SystemExit(f'BLOCK: expected exactly one materializer stale-queue condition, got {old.count(needle)}')
          new = old.replace(needle, '  cancel-in-progress: true\n', 1)
          path.write_text(new, encoding='utf-8', newline='\n')
          PY
          python3 -B -m unittest -v tests.test_progress_deadlocks tests.test_terminal_monitor_stream_e2e
          git diff --check
          git diff --exit-code -- . ':!.github/workflows/qikvrt_batch04_integrity.yml' || {
            echo 'BLOCK: repair changed an unrelated path' >&2
            exit 2
          }
      - name: Persist exact-head repair successor
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_head" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/qikvrt_batch04_integrity.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(mesh): cancel stale materializer executions'
          remote_head_after="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_head_after" = "$source_head"
          git push origin "HEAD:$TARGET_REF"
