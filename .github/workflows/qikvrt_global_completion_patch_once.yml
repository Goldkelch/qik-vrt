# One-shot self-removing repair for the active global-completion branch.
name: QIKVRT one-shot global completion binding repair

on:
  push:
    branches:
      - agent/global-completion-inventory-v1-20260728
    paths:
      - .github/workflows/qikvrt_global_completion_patch_once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/global-completion-inventory-v1-20260728
          fetch-depth: 0
      - name: Distinguish persistent proof-object entries from workflow-audited legacy bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/qikvrt_global_completion.py')
          text = path.read_text(encoding='utf-8')
          old_a = '''        if binding:\n            if claim_id not in manifest_objects:\n                raise CompletionError(f"proof-object manifest lacks {claim_id}")\n            source_path = ROOT / "formalization" / "QIKVRT_Formalization_v2.0" / str(binding["sourcePath"])\n'''
          new_a = '''        if binding:\n            persistent_manifest_entry = manifest_objects.get(claim_id)\n            source_path = ROOT / "formalization" / "QIKVRT_Formalization_v2.0" / str(binding["sourcePath"])\n'''
          old_b = '''                    "proof_object_manifest_entry": claim_id,\n                    "verification_contract": ".github/workflows/qikvrt_manuscript_proof.yml",\n'''
          new_b = '''                    "proof_object_manifest_entry": (\n                        claim_id if persistent_manifest_entry is not None else None\n                    ),\n                    "proof_object_coverage": (\n                        "PERSISTENT_ENTRY"\n                        if persistent_manifest_entry is not None\n                        else "DIRECT_SOURCE_REGISTRY_AND_WORKFLOW_AUDIT"\n                    ),\n                    "verification_contract": ".github/workflows/qikvrt_manuscript_proof.yml",\n'''
          if text.count(old_a) != 1 or text.count(old_b) != 1:
              raise SystemExit('BLOCK: expected global-completion repair anchors are absent or ambiguous')
          text = text.replace(old_a, new_a).replace(old_b, new_b)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/qikvrt_global_completion_patch_once.yml
          python3 -m py_compile tools/qikvrt_global_completion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/qikvrt_global_completion.py .github/workflows/qikvrt_global_completion_patch_once.yml
          git commit -m "fix: classify legacy kernel bindings by workflow audit"
          git push origin HEAD:agent/global-completion-inventory-v1-20260728
