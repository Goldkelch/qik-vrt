name: QIK-VRT one-shot exact QCE kernel-receipt persistence

on:
  push:
    branches:
      - "agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
    paths:
      - ".github/workflows/qikvrt_qce_kernel_receipt_persistence.yml"

permissions:
  contents: write

concurrency:
  group: qikvrt-qce-kernel-receipt-persistence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact persistence precursor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact receipt bytes and source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0401d030e9fa1514697d0bb011d8741c4aa514cf"
          root="release/qce-formal-model-run-31056926203-attempt-1"
          actual="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/qikvrt_qce_kernel_receipt_persistence.yml' \
            "${root}/ARTIFACT_PROVENANCE.json" \
            "${root}/AXIOM_OUTPUT.txt" \
            "${root}/KERNEL_RECEIPT.json" \
            "${root}/VERIFICATION.json" | sort)"
          test "${actual}" = "${expected}"
          echo "a680d21add3056da5c7d05e3004df0612199e26deec5d5d0ba691039a3eca9c0  ${root}/KERNEL_RECEIPT.json" | sha256sum --check --strict
          echo "e9f2eac824158e6e65dbd636b4fa6f3d89a703c54c718dee671a62d3e006df65  ${root}/AXIOM_OUTPUT.txt" | sha256sum --check --strict
          echo "e76cc55bbf5d4cc2ebff00f2f04cd3d4bb49a0cd21c0bdf32bb1f9ba85e9e967  ${root}/VERIFICATION.json" | sha256sum --check --strict
          echo "881ab70266e0557036757c0c570c1abe6ec9a0856d62f428fbf83c6ff2beddce  ${root}/ARTIFACT_PROVENANCE.json" | sha256sum --check --strict
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          root = Path('release/qce-formal-model-run-31056926203-attempt-1')
          receipt = json.loads((root / 'KERNEL_RECEIPT.json').read_text(encoding='utf-8'))
          assert receipt['source_binding']['repository'] == 'Goldkelch/qik-vrt'
          assert receipt['source_binding']['commit'] == '0401d030e9fa1514697d0bb011d8741c4aa514cf'
          assert receipt['source_binding']['tree'] == '7815e92753f8691dc792cf064e9c62b20a12b653'
          assert receipt['workflow_binding'] == {'run_attempt': '1', 'run_id': '31056926203'}
          kernel = receipt['kernel_execution']
          assert kernel['named_theorems'] == 36
          assert kernel['accepted_theorems'] == 36
          assert kernel['axiom_audit_directives'] == 36
          assert kernel['project_axioms'] == 0
          assert kernel['sorry_or_admit'] == 0
          assert kernel['unsafe_declarations'] == 0
          profile = Counter(tuple(value) for value in kernel['axioms_by_theorem'].values())
          assert profile == Counter({(): 30, ('propext',): 6})
          verification = json.loads((root / 'VERIFICATION.json').read_text(encoding='utf-8'))
          assert verification['result'] == 'FORMAL_MODEL_VERIFIED'
          assert verification['physical_correspondence'] == 'OPEN_CANDIDATE'
          provenance = json.loads((root / 'ARTIFACT_PROVENANCE.json').read_text(encoding='utf-8'))
          assert provenance['artifact']['artifact_id'] == 8950602787
          assert provenance['artifact']['github_digest'] == 'sha256:25b0e584a0c5eba0755f56802c414dd0a8ecbcabb4cd184430ef45672e87f9ba'
          assert provenance['source_package']['commit'] == receipt['source_binding']['commit']
          assert provenance['source_package']['tree'] == receipt['source_binding']['tree']
          assert provenance['workflow']['run_id'] == 31056926203
          assert provenance['workflow']['run_attempt'] == 1
          assert provenance['completion_claims'] == {'PASS': False, 'FINAL_PASS': False, 'EFFECT_ACK_DONE': False}
          PY

      - name: Remove one-shot workflow and regenerate repository-native integrity
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/qikvrt_qce_kernel_receipt_persistence.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Commit exact receipt evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qik-vrt-qce-receipt-persistence"
          git config user.email "qik-vrt-qce-receipt-persistence@users.noreply.github.com"
          git add -A
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"
          git commit -m "evidence(qce): persist exact Lean kernel receipt"
          git push origin "HEAD:refs/heads/agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
