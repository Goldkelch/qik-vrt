name: Reconcile canonical Round Trip Zenodo publication (Authority HOLD)

# Candidate-controlled workflow bytes cannot authorize repository-write or
# publication credentials. This trusted-main-only entry point preserves an
# explicit HOLD until a protected release Authority is externally verified.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-hold:
    if: github.ref == 'refs/heads/main' && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact trusted main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize protected release Authority HOLD
        shell: bash
        env:
          RECEIPT: ${{ runner.temp }}/qikvrt-release-authority-hold.json
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema": "qikvrt_release_authority_hold_v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "evaluator_sha": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "d0": 3,
              "state": "REQUEST_AUTHORITY",
              "reason": "PROTECTED_RELEASE_AUTHORITY_NOT_EXTERNALLY_VERIFIED",
              "productive_effect": False,
              "completion_claims": {
                  "physical_atari_boot": False,
                  "physical_atari_execution": False,
                  "merge": False,
                  "approval": False,
                  "pass": False,
                  "final_pass": False,
                  "publication": False,
                  "release": False,
                  "deployment": False,
                  "authority_mirror_synchronization": False,
                  "effect_ack_done": False,
              },
          }
          Path(os.environ["RECEIPT"]).write_text(
              json.dumps(receipt, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Preserve release Authority HOLD
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-release-authority-hold-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-release-authority-hold.json
          if-no-files-found: error
          retention-days: 90
