name: QIKVRT epistemic spiral roundtrip
on:
  pull_request:
    branches: [main, ux/public-qikvrt-entry-20260924]
permissions:
  contents: read
jobs:
  spiral-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static carrier tests
        run: python3 -B -m unittest tests.test_qikvrt_epistemic_spiral -v
      - name: Build Universal Transputer runtime
        run: cargo build --release --locked --manifest-path next/Cargo.toml
      - name: Serialize, deserialize and roundtrip through Universal Transputer
        run: python3 -B tools/qikvrt_epistemic_spiral_roundtrip.py --output epistemic-spiral-roundtrip.json
      - uses: actions/upload-artifact@v4
        with:
          name: qikvrt-epistemic-spiral-roundtrip
          path: epistemic-spiral-roundtrip.json
