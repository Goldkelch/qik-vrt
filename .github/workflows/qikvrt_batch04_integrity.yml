# Temporary, exact-bound reuse of the existing repository materializer.
# This executor ref is never adopted into PR #1112.
name: QIKVRT repository evidence materialization

on:
  push:
    branches: [repair/pr1112-integrity-executor-104ca76b]

permissions:
  contents: write

concurrency:
  group: qikvrt-pr1112-integrity-104ca76b
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/repair/pr1112-integrity-executor-104ca76b' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: repair/pr1112-integrity-result-104ca76b
      EXPECTED_HEAD: 104ca76b79aa68e1c2f3d9141db20a3f04ea5c20
      EXPECTED_TREE: f8db0e653922034619e34e24da273713ed4df93e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind original PR subject and isolated result ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          test "$(git rev-parse --verify HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/pull/1112/head | awk 'NR == 1 {print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')" = "$EXPECTED_HEAD"
          python3 -B tools/qikvrt_tool_cache.py verify
      - name: Regenerate and verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Run complete repository gates before persistence
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 tools/qikvrt_integrity.py verify
      - name: Persist only exact-subject integrity outputs to isolated result ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          python3 -I - <<'PY'
          import subprocess
          allowed = {'REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().strip('\0').split('\0')) - {''}
          if not changed or not changed <= allowed:
              raise SystemExit('BLOCK: non-integrity or empty delta: ' + repr(sorted(changed)))
          untracked = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z'])
          if untracked:
              raise SystemExit('BLOCK: unexpected untracked paths: ' + repr(untracked))
          print('BOUNDED_INTEGRITY_DELTA=' + ','.join(sorted(changed)))
          PY
          test "$(git ls-remote origin refs/pull/1112/head | awk 'NR == 1 {print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix(integrity): materialize exact PR #1112 subject'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          printf 'SUCCESSOR_HEAD=%s\nSUCCESSOR_TREE=%s\nPARENT=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD^)"
          echo 'PREDECESSOR_EVIDENCE_TRANSFER=false; P2=NOT_ESTABLISHED; REVIEW=NOT_ADVANCED; MAIN=NOT_MUTATED; EFFECT=NOT_ESTABLISHED'
