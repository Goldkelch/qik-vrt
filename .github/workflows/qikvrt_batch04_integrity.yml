# Generalized deterministic evidence materializer for protected repository states.
name: QIKVRT repository evidence materialization

on:
  push:
    branches:
      - main
      - agent/formalization-cache-hmi-batch04
      - agent/manuscript-formalization-v2-completion
      - docs/information-effect-axis-v1
      - publication/pr966-p5-successor-v1
      - agent/repository-wide-roundtrip-invariant-v1
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: qikvrt-repository-evidence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  materialize:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      head_sha: ${{ steps.persisted_subject.outputs.head_sha }}
      tree_sha: ${{ steps.persisted_subject.outputs.tree_sha }}
      source_sha: ${{ steps.persisted_subject.outputs.source_sha }}
      source_run_id: ${{ steps.persisted_subject.outputs.source_run_id }}
    env:
      TARGET_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Classify deterministic materialization scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/qikvrt-materialization-paths.bin"
          : > "$paths_file"
          full=0
          head_sha="$(git rev-parse --verify HEAD^{commit})"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             [ -z "${BASE_SHA:-}" ] || \
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            full=1
          else
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
                full=1
              fi
            fi
            if [ "$full" -eq 0 ]; then
              if ! git diff --name-only -z "$BASE_SHA" "$head_sha" -- > "$paths_file"; then
                full=1
                : > "$paths_file"
              fi
            fi
          fi
          args=(
            --paths-file "$paths_file"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$full" -eq 1 ]; then
            args+=(--full)
          fi
          python3 -B tools/qikvrt_materialization_scope.py "${args[@]}" \
            | tee "$RUNNER_TEMP/qikvrt-materialization-scope.json"
          {
            echo '### Deterministic materialization scope'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/qikvrt-materialization-scope.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Materialize completed manuscript evidence when present
        if: steps.scope.outputs.formalization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="formalization/QIKVRT_Formalization_v2.0"
          if [ ! -f "$root/scripts/materialize_completion.py" ]; then
            echo "Completion materializer is not present on this branch."
            exit 0
          fi
          (
            cd "$root"
            python3 scripts/materialize_completion.py
            python3 scripts/render_completion_proof_map.py
            python3 scripts/render_completion_verification_report.py
            python3 scripts/materialize_completion_proof_manifest.py
            python3 scripts/materialize_completion.py --check
            python3 scripts/render_completion_proof_map.py --check
            python3 scripts/render_completion_verification_report.py --check
            python3 scripts/materialize_completion_proof_manifest.py --check
            python3 scripts/validate_completion_claim_graph.py
          )
      - name: Rebuild deterministic formalization release bundle when present
        if: steps.scope.outputs.formalization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          script="formalization/QIKVRT_Formalization_v2.0/scripts/package_release.py"
          manifest="release/formalization-v2-alpha2-zenodo.json"
          archive="release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip"
          sums="release/formalization-v2/ZENODO_SHA256SUMS-alpha.2"
          if [ ! -f "$script" ] || [ ! -f "$manifest" ]; then
            echo "Formalization release bundle is not present on this branch."
            exit 0
          fi
          python3 "$script" \
            --repository-root . \
            --output "$archive" \
            --zenodo-checksums "$sums"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re

          root = pathlib.Path('.').resolve()
          manifest_path = root / 'release/formalization-v2-alpha2-zenodo.json'
          value = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = value['software']['files']
          archive_digest = None
          for entry in files:
              path = root / entry['path']
              raw = path.read_bytes()
              entry['size'] = len(raw)
              entry['md5'] = hashlib.md5(raw, usedforsecurity=False).hexdigest()
              entry['sha256'] = hashlib.sha256(raw).hexdigest()
              if entry['name'] == 'QIKVRT_Formalization_v2.0-alpha.2.zip':
                  archive_digest = entry['sha256']
          if archive_digest is None:
              raise SystemExit('BLOCK: archive entry is absent from the Zenodo manifest')
          notes = value['software']['metadata']['notes']
          notes, count = re.subn(
              r'Autorisiertes Archiv SHA-256: [0-9a-f]{64}\.',
              f'Autorisiertes Archiv SHA-256: {archive_digest}.',
              notes,
              count=1,
          )
          if count != 1:
              raise SystemExit('BLOCK: archive digest note is absent or ambiguous')
          value['software']['metadata']['notes'] = notes
          manifest_path.write_text(
              json.dumps(value, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python3 -B tests/test_formalization_v2_release_workflow.py
      - name: Refresh most advanced content-disposition status when present
        if: steps.scope.outputs.content_disposition == 'true'
        shell: bash
        run: |
          set -euo pipefail
          final_script="tools/qikvrt_content_disposition_batch_003_remaining_archives.py"
          final_receipt="release/zenodo-corpus-proof-2026-07-28/canonical-union/retrospective-proof-corpus/RETROSPECTIVE_PROOF_CORPUS_RECEIPT.json"
          second_script="tools/qikvrt_content_disposition_batch_003_subject_172dd9bc2738fa43.py"
          recursive_probe="tools/qikvrt_batch003_subject_172dd_recursive_probe.py"
          second_report="$RUNNER_TEMP/SUBJECT-172dd9bc2738fa43_RECURSIVE_PUBLIC_ARCHIVE_PROBE.json"
          first_script="tools/qikvrt_content_disposition_batch_003_subject_2581811b342e505d.py"
          first_work_unit="work-units/RECOVER_EXACT_PUBLIC_INDEX_BYTES_AND_EXTRACT_CLASSIFY_BATCH_003_SUBJECT_2581811B342E505D.json"
          dispatch_script="tools/qikvrt_content_disposition_batch_003_dispatch.py"
          dispatch_receipt="release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/dispatch/BATCH_003_DISPATCH_RECEIPT.json"
          post_script="tools/qikvrt_content_disposition_status_after_batch_002_acceptance_compat.py"
          post_receipt="release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-002/post-acceptance/POST_ACCEPTANCE_STATUS_PROJECTION.json"
          if [ -f "$final_script" ] && [ -f "$final_receipt" ]; then
            python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
              --materialize --json
            python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
              --check --json
            python3 -B "$dispatch_script" --check-status-projection --json
          elif [ -f "$second_script" ] && [ -f "$recursive_probe" ]; then
            python3 -B -m tools.qikvrt_batch003_subject_172dd_recursive_probe \
              --output "$second_report"
            python3 -B "$second_script" --report "$second_report" --materialize
            python3 -B "$second_script" --check
          elif [ -f "$first_script" ] && [ -f "$first_work_unit" ]; then
            python3 -B "$first_script" --verify-public-record --materialize
            python3 -B "$first_script" --check
            python3 -B -m unittest -v \
              tests.test_content_disposition_batch_003_subject_2581811b342e505d \
              tests.test_content_disposition_batch_003_dispatch
          elif [ -f "$dispatch_script" ] && [ -f "$dispatch_receipt" ]; then
            python3 -B "$dispatch_script" --materialize
            python3 -B "$dispatch_script" --check-status-projection
          elif [ -f "$post_script" ] && [ -f "$post_receipt" ]; then
            python3 -B "$post_script" --materialize
            python3 -B "$post_script" --check-status-projection
          else
            echo "No current content-disposition status projector is present on this branch."
          fi
      - name: Provision and verify aphorism publication runtime when present
        if: steps.scope.outputs.aphorism == 'true'
        shell: bash
        run: |
          set -euo pipefail
          script="tools/qikvrt_aphorism_corpus_v2.py"
          if [ ! -f "$script" ]; then
            echo "Aphorism-corpus materializer is not present on this branch."
            exit 0
          fi
          missing=0
          for command in xelatex pdfinfo pdftotext pdftoppm pdffonts; do
            if ! command -v "$command" >/dev/null 2>&1; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            sudo apt-get update -o Acquire::Retries=3
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends \
                texlive-xetex \
                texlive-latex-extra \
                texlive-lang-german \
                texlive-fonts-recommended \
                fonts-lmodern \
                poppler-utils
          fi
          command -v xelatex
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          command -v pdffonts
          xelatex --version | sed -n '1p'
          pdfinfo -v 2>&1 | sed -n '1p'
          pdftotext -v 2>&1 | sed -n '1p'
          pdftoppm -v 2>&1 | sed -n '1p'
          pdffonts -v 2>&1 | sed -n '1p'
          if command -v dpkg-query >/dev/null 2>&1; then
            dpkg-query --show \
              --showformat='publication-package=${Package}=${Version}\n' \
              texlive-xetex \
              texlive-latex-extra \
              texlive-lang-german \
              texlive-fonts-recommended \
              fonts-lmodern \
              poppler-utils
          fi
      - name: Materialize aphorism-corpus scientific assessment when present
        if: steps.scope.outputs.aphorism == 'true'
        shell: bash
        run: |
          set -euo pipefail
          script="tools/qikvrt_aphorism_corpus_v2.py"
          if [ ! -f "$script" ]; then
            echo "Aphorism-corpus materializer is not present on this branch."
            exit 0
          fi
          for command in xelatex pdfinfo pdftotext pdftoppm pdffonts; do
            command -v "$command" >/dev/null || {
              echo "BLOCK: required publication tool is absent: $command" >&2
              exit 1
            }
          done
          python3 -B "$script" --materialize --json
          python3 -B "$script" --check --json
          python3 -B -m unittest -v tests.test_aphorism_corpus_v2
      - name: Regenerate and verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Run complete repository gates before persistence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_pr_head_mutation_boundary
          make test
          python3 tools/qikvrt_integrity.py verify
      - name: Commit materialized repository evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$source_head" ]; then
            echo "BLOCK: target ref advanced before repository evidence persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            formalization/QIKVRT_Formalization_v2.0/claims/TEX_ENVIRONMENTS.json \
            formalization/QIKVRT_Formalization_v2.0/claims/APPENDIX_MATRIX.json \
            formalization/QIKVRT_Formalization_v2.0/claims/CLAIM_GRAPH.json \
            formalization/QIKVRT_Formalization_v2.0/MANUSCRIPT_PROOF_MAP.md \
            formalization/QIKVRT_Formalization_v2.0/VERIFICATION_REPORT.md \
            formalization/QIKVRT_Formalization_v2.0/proofs/PROOF_OBJECT_MANIFEST.json \
            release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip \
            release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip.sha256 \
            release/formalization-v2/ZENODO_SHA256SUMS-alpha.2 \
            release/formalization-v2-alpha2-zenodo.json \
            tools/qikvrt_content_disposition_batch_003_subject_2581811b342e505d.py \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-2581811b342e505d \
            work-units/EXTRACT_ARCHIVE_CONTENT_THEN_DISPOSITION_CLAIMS_BATCH_003_SUBJECT_172DD9BC2738FA43.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-172dd9bc2738fa43 \
            work-units/EXTRACT_ARCHIVE_CONTENT_THEN_DISPOSITION_CLAIMS_BATCH_003_SUBJECT_B4849E1A2D6B2270.json \
            docs/publications/2026-08-04-aphorism-corpus-scientific-assessment \
            docs/publications/index.json \
            docs/publications/index.html \
            work-units/MATERIALIZE_APHORISM_CORPUS_SCIENTIFIC_ASSESSMENT_V2.json \
            AI_PROGRESS.json \
            AI_STATUS.md \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          optional_paths=(
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/CONTENT_DISPOSITION_BATCH_003_RECEIPT.json
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-b4849e1a2d6b2270
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-7956d8acdc473825
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-ce2390f18618ad0c
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-780b9bf86425cee3
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-7fdb36aa7c07c07d
            release/zenodo-corpus-proof-2026-07-28/canonical-union/retrospective-proof-corpus
            work-units/CREATE_VERSIONED_CORRECTED_CANDIDATES_REMAINING_CORPUS_SUBJECTS.json
            work-units/REQUEST_SEPARATE_ZENODO_MUTATION_AUTHORIZATION_RETROSPECTIVE_PROOF_CORPUS.json
          )
          for path in "${optional_paths[@]}"; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "Repository evidence is already current."
            exit 0
          fi
          git commit -m "ci: materialize repository evidence"
          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo "BLOCK: target ref advanced while repository evidence was materialized" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_after_commit=$remote_head_after_commit" >&2
            exit 2
          fi
          git push origin "HEAD:$TARGET_REF"
          persisted_head="$(git rev-parse --verify HEAD^{commit})"
          readback_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$persisted_head" = "$readback_head"
          printf 'PERSISTED_HEAD=%s\n' "$persisted_head"
          git rev-parse --verify HEAD^{tree}
          echo 'EFFECT_ACK_CONTINUE: fresh successor validation and native review are still required'
      - name: Bind persisted materializer subject
        id: persisted_subject
        if: github.event_name == 'push' && github.ref_name == 'agent/repository-wide-roundtrip-invariant-v1'
        shell: bash
        run: |
          set -euo pipefail
          persisted_head="$(git rev-parse --verify HEAD^{commit})"
          persisted_tree="$(git rev-parse --verify HEAD^{tree})"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$persisted_head" = "$remote_head"
          {
            printf 'head_sha=%s\n' "$persisted_head"
            printf 'tree_sha=%s\n' "$persisted_tree"
            printf 'source_sha=%s\n' "$EXPECTED_HEAD"
            printf 'source_run_id=%s\n' "$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"
          printf 'MATERIALIZER_SUBJECT head=%s tree=%s source=%s run=%s\n' "$persisted_head" "$persisted_tree" "$EXPECTED_HEAD" "$GITHUB_RUN_ID"

  handoff:
    needs: materialize
    if: github.event_name == 'push' && github.ref_name == 'agent/repository-wide-roundtrip-invariant-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REF: ${{ github.ref_name }}
      PERSISTED_HEAD: ${{ needs.materialize.outputs.head_sha }}
      PERSISTED_TREE: ${{ needs.materialize.outputs.tree_sha }}
      MATERIALIZER_SOURCE: ${{ needs.materialize.outputs.source_sha }}
      MATERIALIZER_RUN: ${{ needs.materialize.outputs.source_run_id }}
      EVENT_SOURCE: ${{ github.sha }}
    steps:
      - name: Validate persisted handoff envelope before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PERSISTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PERSISTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MATERIALIZER_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$MATERIALIZER_SOURCE" = "$EVENT_SOURCE"
          test "$MATERIALIZER_RUN" = "$GITHUB_RUN_ID"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PERSISTED_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Continue persisted roundtrip head through native verification
        if: github.event_name == 'push' && github.ref_name == 'agent/repository-wide-roundtrip-invariant-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          handoff_phase=BIND
          trap 'rc=$?; printf "::error::HANDOFF_FAILURE phase=%s exit=%s subject=%s run=%s\n" "$handoff_phase" "$rc" "$PERSISTED_HEAD" "$GITHUB_RUN_ID" >&2; exit "$rc"' ERR
          local_head="$(git rev-parse --verify HEAD^{commit})"
          test "$local_head" = "$PERSISTED_HEAD"
          test "$(git rev-parse --verify HEAD^{tree})" = "$PERSISTED_TREE"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$local_head" = "$remote_head"
          main_head="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 {print $1}')"
          test -n "$main_head"
          # Reuse this carrier and credential. Only explicit rate-limit refusals
          # are retryable; permission/transport failures never cause blind POSTs.
          retry_deadline=$((SECONDS + 600))
          gh_json() {
            local attempt rc status retryable delay
            local raw="$RUNNER_TEMP/qikvrt-handoff-http.txt"
            local body="$RUNNER_TEMP/qikvrt-handoff-body.json"
            local meta="$RUNNER_TEMP/qikvrt-handoff-meta.txt"
            for attempt in 0 1 2 3; do
              test "$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')" = "$local_head" || return 2
              test "$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 {print $1}')" = "$main_head" || return 2
              rc=0
              timeout 65s gh api --hostname github.com --include "$@" > "$raw" 2> "$RUNNER_TEMP/qikvrt-handoff-stderr.txt" || rc=$?
              python3 -B -S - "$raw" "$body" "$attempt" > "$meta" <<'PYHTTP'
          import email.utils, json, math, pathlib, re, sys, time
          raw = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").replace("\r\n", "\n")
          header, separator, body = raw.partition("\n\n")
          match = re.match(r"HTTP/\S+ (\d{3})(?: |$)", header)
          if not separator or not match:
              raise SystemExit("BLOCK: no definitive HTTP response; do not retry an ambiguous request")
          status = int(match[1])
          headers = dict(line.lower().split(":", 1) for line in header.splitlines()[1:] if ":" in line)
          headers = {key.strip(): value.strip() for key, value in headers.items()}
          primary = status == 403 and headers.get("x-ratelimit-remaining") == "0"
          retryable = primary or status == 429 or (status == 403 and "secondary rate limit" in body.lower())
          delays = []
          if headers.get("x-ratelimit-remaining") == "0" and "x-ratelimit-reset" in headers:
              delays.append(max(1, math.ceil(float(headers["x-ratelimit-reset"]) - time.time()) + 1))
          if "retry-after" in headers:
              value = headers["retry-after"]
              delays.append(max(1, int(value)) if value.isdigit() else max(1, math.ceil(email.utils.parsedate_to_datetime(value).timestamp() - time.time()) + 1))
          delay = max(delays) if delays else 60 * (2 ** int(sys.argv[3]))
          pathlib.Path(sys.argv[2]).write_text(body, encoding="utf-8")
          print(status, int(retryable), delay)
          PYHTTP
              test "$?" -eq 0 || return 2
              read -r status retryable delay < "$meta"
              if [ "$rc" -eq 0 ] && { [ "$status" = 200 ] || [ "$status" = 204 ]; }; then
                cat "$body"
                return 0
              fi
              if [ "$retryable" != 1 ]; then
                echo "BLOCK: non-retryable handoff HTTP $status (CLI exit $rc)" >&2
                return 2
              fi
              printf 'HANDOFF_RATE_LIMIT http=%s attempt=%s retry_after_seconds=%s\n' "$status" "$attempt" "$delay" >&2
              if [ "$attempt" -eq 3 ] || [ "$((SECONDS + delay))" -gt "$retry_deadline" ]; then
                printf 'HANDOFF_PENDING: exact HEAD %s requires fresh admission after provider reset; not EFFECT_ACK_DONE\n' "$local_head" >&2
                return 75
              fi
              sleep "$delay"
            done
            return 75
          }
          handoff_phase=PR_LOOKUP
          pages="$RUNNER_TEMP/qikvrt-materialized-pr-pages.json"
          head_filter="$(jq -nr --arg head "${GITHUB_REPOSITORY%%/*}:$TARGET_REF" '$head|@uri')"
          gh_json "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${head_filter}&per_page=100" > "$pages"
          pr_number="$(jq -er --arg repo "$GITHUB_REPOSITORY" --arg ref "$TARGET_REF" \
            '[.[] | select(.head.repo.full_name == $repo and .head.ref == $ref and .base.ref == "main")] |
             if length == 1 then .[0].number else error("unique candidate PR not established") end' "$pages")"
          handoff_phase=PR_REOBSERVE
          current="$(gh_json "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" | jq -er 'select(.state == "open" and .base.ref == "main") | .head.sha')"
          test "$current" = "$local_head"
          handoff_phase=MAIN_ANCESTRY
          common="$(gh_json "repos/${GITHUB_REPOSITORY}/compare/${main_head}...${local_head}" | jq -er '.merge_base_commit.sha')"
          test "$common" = "$main_head"
          payload="$RUNNER_TEMP/qikvrt-materialized-head-verification.json"
          jq -n --arg repo "$GITHUB_REPOSITORY" --argjson pr "$pr_number" \
            --arg ref "$TARGET_REF" --arg head "$local_head" --arg base "$main_head" \
            --arg source_run "$GITHUB_RUN_ID" \
            '{event_type:"qikvrt_autonomous_exact_head_verify",client_payload:{repository:$repo,pull_request:$pr,head_ref:$ref,head_sha:$head,base_sha:$base,source_materializer_run_id:$source_run}}' > "$payload"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')" = "$local_head"
          handoff_phase=DISPATCH
          gh_json --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input "$payload"
          printf 'VERIFICATION_ADMISSION_REQUESTED_HEAD=%s\n' "$local_head"
          echo 'Dispatch acknowledgment is not verification, native approval or EFFECT_ACK_DONE.'
