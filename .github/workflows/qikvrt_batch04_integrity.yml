# Generalized deterministic evidence materializer for protected repository states.
name: QIKVRT repository evidence materialization

on:
  push:
    branches:
      - main
      - agent/formalization-cache-hmi-batch04
      - agent/manuscript-formalization-v2-completion
      - docs/information-effect-axis-v1
      - publication/pr966-p5-successor-v1
      - agent/autonomy-root-cause-self-clean-v3
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-repository-evidence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-pr-readonly:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify the exact pull-request head without a write credential
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_HEAD"
          printf 'head=%s\n' "$source_head" >> "$GITHUB_OUTPUT"
      - name: Verify content-disposition recovery offline without a live repair
        id: materialization
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/qikvrt-content-disposition-pr-recovery"
          mkdir -p "$artifact_root"
          receipt="$artifact_root/RECOVERY_RECEIPT.json"
          log="$artifact_root/materialization.log"
          capture_hold() {
            python3 - "$receipt" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          value = {
              "schema": "qikvrt_remaining_archive_disposition_recovery_v1",
              "state": "HOLD",
              "verification_state": "HOLD_UNVERIFIED",
              "failure_class": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
              "first_blocker": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
              "detail": "The read-only pull-request verifier did not preserve complete recovery evidence.",
              "offline_materialization_verified": False,
              "live_reobservation_attempted": False,
              "live_materialization_invoked": False,
              "public_get_retry_policy": {"attempts": 3, "backoff_seconds": [15, 45], "timeout_seconds": 240},
              "external_effect": False,
              "zenodo_mutation_attempted": False,
              "d0": 2,
              "continuation_required": True,
              "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
              "hold_reason": {
                  "reason_code": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
                  "reason": "The read-only pull-request verifier did not preserve complete recovery evidence.",
                  "subject": {"repository": "Goldkelch/qik-vrt", "kind": "zenodo_record_set", "identifier": "batch003-remaining-archives", "head_sha": None},
                  "evidence_refs": ["workflow-log:batch04-content-disposition-pr"],
                  "owner": {"role": "EXACT_SUBJECT_OBSERVER", "actor": "github-actions[bot]"},
                  "retry_condition": {"event": "FUTURE_FRESH_CONTENT_DISPOSITION_CARRIER", "predicate": "the verifier can preserve a complete receipt and log"},
                  "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
                  "d0": 2
              },
              "completion_claims": {"pass": False, "final_pass": False, "effect_ack_done": False, "proof_corpus_published_on_zenodo": False, "zenodo_mutation_authorized": False}
          }
          path.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          }
          : > "$log"
          set +e
          python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
            --verify-current --receipt "$receipt" --json >> "$log" 2>&1
          effective_exit=$?
          set -e
          if [ ! -s "$receipt" ]; then
            capture_hold
            effective_exit=2
          fi
          if [ "$effective_exit" -eq 0 ]; then
            set +e
            python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives --check --json >> "$log" 2>&1
            check_exit=$?
            set -e
            if [ "$check_exit" -ne 0 ]; then
              capture_hold
              effective_exit=2
            fi
          fi
          printf 'exit_code=%s\n' "$effective_exit" >> "$GITHUB_OUTPUT"
      - name: Preserve read-only pull-request content-disposition evidence
        id: recovery_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-content-disposition-pr-recovery-${{ steps.source.outputs.head }}
          path: ${{ runner.temp }}/qikvrt-content-disposition-pr-recovery/**
          retention-days: 30
          if-no-files-found: error
      - name: Enforce typed content-disposition HOLD after evidence upload
        if: >-
          always() && steps.materialization.outputs.exit_code != '' &&
          steps.materialization.outputs.exit_code != '0' &&
          steps.recovery_evidence.outcome == 'success'
        env:
          MATERIALIZATION_EXIT: ${{ steps.materialization.outputs.exit_code }}
          RECOVERY_RECEIPT: ${{ runner.temp }}/qikvrt-content-disposition-pr-recovery/RECOVERY_RECEIPT.json
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MATERIALIZATION_EXIT" =~ ^[1-9][0-9]*$ ]]
          test -s "$RECOVERY_RECEIPT"
          cat "$RECOVERY_RECEIPT" >&2
          exit "$MATERIALIZATION_EXIT"
      - name: Verify committed repository evidence and run complete read-only gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives --check --json
          python3 -B tools/qikvrt_content_disposition_batch_003_dispatch.py --check-status-projection --json
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify
  materialize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Classify deterministic materialization scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/qikvrt-materialization-paths.bin"
          : > "$paths_file"
          full=0
          head_sha="$(git rev-parse --verify HEAD^{commit})"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             [ -z "${BASE_SHA:-}" ] || \
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            full=1
          else
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
                full=1
              fi
            fi
            if [ "$full" -eq 0 ]; then
              if ! git diff --name-only -z "$BASE_SHA" "$head_sha" -- > "$paths_file"; then
                full=1
                : > "$paths_file"
              fi
            fi
          fi
          args=(
            --paths-file "$paths_file"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$full" -eq 1 ]; then
            args+=(--full)
          fi
          python3 -B tools/qikvrt_materialization_scope.py "${args[@]}" \
            | tee "$RUNNER_TEMP/qikvrt-materialization-scope.json"
          {
            echo '### Deterministic materialization scope'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/qikvrt-materialization-scope.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Materialize completed manuscript evidence when present
        if: steps.scope.outputs.formalization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="formalization/QIKVRT_Formalization_v2.0"
          if [ ! -f "$root/scripts/materialize_completion.py" ]; then
            echo "Completion materializer is not present on this branch."
            exit 0
          fi
          (
            cd "$root"
            python3 scripts/materialize_completion.py
            python3 scripts/render_completion_proof_map.py
            python3 scripts/render_completion_verification_report.py
            python3 scripts/materialize_completion_proof_manifest.py
            python3 scripts/materialize_completion.py --check
            python3 scripts/render_completion_proof_map.py --check
            python3 scripts/render_completion_verification_report.py --check
            python3 scripts/materialize_completion_proof_manifest.py --check
            python3 scripts/validate_completion_claim_graph.py
          )
      - name: Rebuild deterministic formalization release bundle when present
        if: steps.scope.outputs.formalization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          script="formalization/QIKVRT_Formalization_v2.0/scripts/package_release.py"
          manifest="release/formalization-v2-alpha2-zenodo.json"
          archive="release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip"
          sums="release/formalization-v2/ZENODO_SHA256SUMS-alpha.2"
          if [ ! -f "$script" ] || [ ! -f "$manifest" ]; then
            echo "Formalization release bundle is not present on this branch."
            exit 0
          fi
          python3 "$script" \
            --repository-root . \
            --output "$archive" \
            --zenodo-checksums "$sums"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re

          root = pathlib.Path('.').resolve()
          manifest_path = root / 'release/formalization-v2-alpha2-zenodo.json'
          value = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = value['software']['files']
          archive_digest = None
          for entry in files:
              path = root / entry['path']
              raw = path.read_bytes()
              entry['size'] = len(raw)
              entry['md5'] = hashlib.md5(raw, usedforsecurity=False).hexdigest()
              entry['sha256'] = hashlib.sha256(raw).hexdigest()
              if entry['name'] == 'QIKVRT_Formalization_v2.0-alpha.2.zip':
                  archive_digest = entry['sha256']
          if archive_digest is None:
              raise SystemExit('BLOCK: archive entry is absent from the Zenodo manifest')
          notes = value['software']['metadata']['notes']
          notes, count = re.subn(
              r'Autorisiertes Archiv SHA-256: [0-9a-f]{64}\.',
              f'Autorisiertes Archiv SHA-256: {archive_digest}.',
              notes,
              count=1,
          )
          if count != 1:
              raise SystemExit('BLOCK: archive digest note is absent or ambiguous')
          value['software']['metadata']['notes'] = notes
          manifest_path.write_text(
              json.dumps(value, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python3 -B tests/test_formalization_v2_release_workflow.py
      - name: Refresh most advanced content-disposition status when present
        if: steps.scope.outputs.content_disposition == 'true'
        id: content_disposition
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/qikvrt-content-disposition-recovery"
          mkdir -p "$artifact_root"
          receipt="$artifact_root/RECOVERY_RECEIPT.json"
          log="$artifact_root/materialization.log"
          materialization_exit=0
          capture_hold() {
            python3 - "$receipt" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          value = {
              "schema": "qikvrt_remaining_archive_disposition_recovery_v1",
              "state": "HOLD",
              "verification_state": "HOLD_UNVERIFIED",
              "failure_class": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
              "first_blocker": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
              "detail": "The content-disposition runner did not preserve a complete receipt and log before enforcement.",
              "offline_materialization_verified": False,
              "live_reobservation_attempted": False,
              "live_materialization_invoked": False,
              "public_get_retry_policy": {"attempts": 3, "backoff_seconds": [15, 45], "timeout_seconds": 240},
              "external_effect": False,
              "zenodo_mutation_attempted": False,
              "d0": 2,
              "continuation_required": True,
              "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
              "hold_reason": {
                  "reason_code": "CONTENT_DISPOSITION_EVIDENCE_CAPTURE_FAILED",
                  "reason": "The content-disposition runner did not preserve a complete receipt and log before enforcement.",
                  "subject": {"repository": "Goldkelch/qik-vrt", "kind": "zenodo_record_set", "identifier": "batch003-remaining-archives", "head_sha": None},
                  "evidence_refs": ["workflow-log:batch04-content-disposition"],
                  "owner": {"role": "EXACT_SUBJECT_OBSERVER", "actor": "github-actions[bot]"},
                  "retry_condition": {"event": "FUTURE_FRESH_CONTENT_DISPOSITION_CARRIER", "predicate": "the runner can preserve a complete receipt and log"},
                  "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
                  "d0": 2
              },
              "completion_claims": {"pass": False, "final_pass": False, "effect_ack_done": False, "proof_corpus_published_on_zenodo": False, "zenodo_mutation_authorized": False}
          }
          path.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          }
          printf '%s\n' '{"schema":"qikvrt_remaining_archive_disposition_recovery_v1","state":"NOT_APPLICABLE","completion_claims":{"pass":false,"final_pass":false,"effect_ack_done":false,"proof_corpus_published_on_zenodo":false,"zenodo_mutation_authorized":false}}' > "$receipt"
          final_script="tools/qikvrt_content_disposition_batch_003_remaining_archives.py"
          second_script="tools/qikvrt_content_disposition_batch_003_subject_172dd9bc2738fa43.py"
          recursive_probe="tools/qikvrt_batch003_subject_172dd_recursive_probe.py"
          second_report="$RUNNER_TEMP/SUBJECT-172dd9bc2738fa43_RECURSIVE_PUBLIC_ARCHIVE_PROBE.json"
          first_script="tools/qikvrt_content_disposition_batch_003_subject_2581811b342e505d.py"
          first_work_unit="work-units/RECOVER_EXACT_PUBLIC_INDEX_BYTES_AND_EXTRACT_CLASSIFY_BATCH_003_SUBJECT_2581811B342E505D.json"
          dispatch_script="tools/qikvrt_content_disposition_batch_003_dispatch.py"
          dispatch_receipt="release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/dispatch/BATCH_003_DISPATCH_RECEIPT.json"
          post_script="tools/qikvrt_content_disposition_status_after_batch_002_acceptance_compat.py"
          post_receipt="release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-002/post-acceptance/POST_ACCEPTANCE_STATUS_PROJECTION.json"
          if [ -f "$final_script" ]; then
            set +e
            python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
              --ensure-current --receipt "$receipt" --json \
              | tee "$log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            materialization_exit="${statuses[0]}"
            if [ "${statuses[1]}" -ne 0 ] || [ ! -s "$receipt" ]; then
              capture_hold
              materialization_exit=2
            fi
            if [ "$materialization_exit" -eq 0 ]; then
              set +e
              python3 -B "$dispatch_script" --check-status-projection --json >> "$log" 2>&1
              dispatch_exit=$?
              set -e
              if [ "$dispatch_exit" -ne 0 ]; then
                capture_hold
                materialization_exit=2
              fi
            fi
          elif [ -f "$second_script" ] && [ -f "$recursive_probe" ]; then
            set +e
            (
              set -euo pipefail
              python3 -B -m tools.qikvrt_batch003_subject_172dd_recursive_probe \
                --output "$second_report"
              python3 -B "$second_script" --report "$second_report" --materialize
              python3 -B "$second_script" --check
            )
            legacy_exit=$?
            set -e
            if [ "$legacy_exit" -ne 0 ]; then
              capture_hold
              materialization_exit=2
            fi
          elif [ -f "$first_script" ] && [ -f "$first_work_unit" ]; then
            set +e
            (
              set -euo pipefail
              python3 -B "$first_script" --verify-public-record --materialize
              python3 -B "$first_script" --check
              python3 -B -m unittest -v \
                tests.test_content_disposition_batch_003_subject_2581811b342e505d \
                tests.test_content_disposition_batch_003_dispatch
            )
            legacy_exit=$?
            set -e
            if [ "$legacy_exit" -ne 0 ]; then
              capture_hold
              materialization_exit=2
            fi
          elif [ -f "$dispatch_script" ] && [ -f "$dispatch_receipt" ]; then
            set +e
            (
              set -euo pipefail
              python3 -B "$dispatch_script" --materialize
              python3 -B "$dispatch_script" --check-status-projection
            )
            legacy_exit=$?
            set -e
            if [ "$legacy_exit" -ne 0 ]; then
              capture_hold
              materialization_exit=2
            fi
          elif [ -f "$post_script" ] && [ -f "$post_receipt" ]; then
            set +e
            (
              set -euo pipefail
              python3 -B "$post_script" --materialize
              python3 -B "$post_script" --check-status-projection
            )
            legacy_exit=$?
            set -e
            if [ "$legacy_exit" -ne 0 ]; then
              capture_hold
              materialization_exit=2
            fi
          else
            echo "No current content-disposition status projector is present on this branch."
          fi
          printf 'exit_code=%s\n' "$materialization_exit" >> "$GITHUB_OUTPUT"
      - name: Preserve content-disposition recovery evidence
        id: content_disposition_evidence
        if: always() && steps.scope.outputs.content_disposition == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-content-disposition-recovery-${{ env.EXPECTED_HEAD }}
          path: ${{ runner.temp }}/qikvrt-content-disposition-recovery/**
          retention-days: 30
          if-no-files-found: error
      - name: Enforce a typed content-disposition HOLD after evidence upload
        if: >-
          always() && steps.scope.outputs.content_disposition == 'true' &&
          steps.content_disposition.outputs.exit_code != '' &&
          steps.content_disposition.outputs.exit_code != '0' &&
          steps.content_disposition_evidence.outcome == 'success'
        env:
          MATERIALIZATION_EXIT: ${{ steps.content_disposition.outputs.exit_code }}
          RECOVERY_RECEIPT: ${{ runner.temp }}/qikvrt-content-disposition-recovery/RECOVERY_RECEIPT.json
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MATERIALIZATION_EXIT" =~ ^[1-9][0-9]*$ ]]
          test -s "$RECOVERY_RECEIPT"
          cat "$RECOVERY_RECEIPT" >&2
          exit "$MATERIALIZATION_EXIT"
      - name: Provision and verify aphorism publication runtime when present
        if: steps.scope.outputs.aphorism == 'true'
        shell: bash
        run: |
          set -euo pipefail
          script="tools/qikvrt_aphorism_corpus_v2.py"
          if [ ! -f "$script" ]; then
            echo "Aphorism-corpus materializer is not present on this branch."
            exit 0
          fi
          missing=0
          for command in xelatex pdfinfo pdftotext pdftoppm pdffonts; do
            if ! command -v "$command" >/dev/null 2>&1; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            sudo apt-get update -o Acquire::Retries=3
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends \
                texlive-xetex \
                texlive-latex-extra \
                texlive-lang-german \
                texlive-fonts-recommended \
                fonts-lmodern \
                poppler-utils
          fi
          command -v xelatex
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          command -v pdffonts
          xelatex --version | sed -n '1p'
          pdfinfo -v 2>&1 | sed -n '1p'
          pdftotext -v 2>&1 | sed -n '1p'
          pdftoppm -v 2>&1 | sed -n '1p'
          pdffonts -v 2>&1 | sed -n '1p'
          if command -v dpkg-query >/dev/null 2>&1; then
            dpkg-query --show \
              --showformat='publication-package=${Package}=${Version}\n' \
              texlive-xetex \
              texlive-latex-extra \
              texlive-lang-german \
              texlive-fonts-recommended \
              fonts-lmodern \
              poppler-utils
          fi
      - name: Materialize aphorism-corpus scientific assessment when present
        if: steps.scope.outputs.aphorism == 'true'
        shell: bash
        run: |
          set -euo pipefail
          script="tools/qikvrt_aphorism_corpus_v2.py"
          if [ ! -f "$script" ]; then
            echo "Aphorism-corpus materializer is not present on this branch."
            exit 0
          fi
          for command in xelatex pdfinfo pdftotext pdftoppm pdffonts; do
            command -v "$command" >/dev/null || {
              echo "BLOCK: required publication tool is absent: $command" >&2
              exit 1
            }
          done
          python3 -B "$script" --materialize --json
          python3 -B "$script" --check --json
          python3 -B -m unittest -v tests.test_aphorism_corpus_v2
      - name: Regenerate and verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Run complete repository gates before persistence
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 tools/qikvrt_integrity.py verify
      - name: Commit materialized repository evidence
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$source_head" ]; then
            echo "BLOCK: target ref advanced before repository evidence persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            formalization/QIKVRT_Formalization_v2.0/claims/TEX_ENVIRONMENTS.json \
            formalization/QIKVRT_Formalization_v2.0/claims/APPENDIX_MATRIX.json \
            formalization/QIKVRT_Formalization_v2.0/claims/CLAIM_GRAPH.json \
