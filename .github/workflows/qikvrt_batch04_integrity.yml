# Reuses the isolated qikvrt_batch04_integrity.yml materializer pattern.
# Executor-only configuration; never adopted into PR #1110.
name: QIKVRT repository evidence materialization

on:
  push:
    branches: [repair/pr1110-integrity-executor-8ba7d741]

permissions:
  contents: read

concurrency:
  group: qikvrt-pr1110-integrity-8ba7d741
  cancel-in-progress: false

env:
  EXPECTED_HEAD: 8ba7d7419422823db855e02e0f77ca3885956534
  EXPECTED_TREE: 870a1a1840c97102bda2ab8deebb3f891aab16e7
  RESULT_REF: repair/pr1110-integrity-result-8ba7d741
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'

jobs:
  materialize:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/repair/pr1110-integrity-executor-8ba7d741' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      head: ${{ steps.persist.outputs.head }}
      tree: ${{ steps.persist.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind literal input and prove only the six specified omissions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git ls-remote origin refs/pull/1110/head | awk 'NR==1 {print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin "refs/heads/$RESULT_REF" | awk 'NR==1 {print $1}')" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'tools')
          import qikvrt_integrity as integrity
          expected_paths = {
              'contracts/QIKVRT_THREE_PHASE_MESH_SEED_MVP_V1.json',
              'tests/test_three_phase_mesh_seed_mvp.py',
              'src/qikvrt_evidence_router.py',
              'tests/test_qikvrt_evidence_router_library.py',
              'examples/evidence_router_sieve.py',
              'docs/EVIDENCE_ROUTER_LIBRARY.md',
          }
          old = json.loads(pathlib.Path('REPOSITORY_FILE_MANIFEST.json').read_text())
          new = integrity.build_outputs()[3]
          before = {item['path']: item for item in old['files']}
          after = {item['path']: item for item in new['files']}
          added, removed = set(after)-set(before), set(before)-set(after)
          changed = {path for path in set(before)&set(after) if before[path] != after[path]}
          print(json.dumps({'added': sorted(added), 'removed': sorted(removed), 'changed': sorted(changed)}, sort_keys=True))
          if added != expected_paths or removed or changed:
              raise SystemExit('BLOCK: omission scope differs from the authorized six paths')
          PY
      - name: Generate canonical trio and check its integrity contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest discover -s tests -p test_integrity.py -v
      - name: Persist a sole-parent three-file successor to the isolated result ref
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B - <<'PY'
          import subprocess
          allowed = {'REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')) - {''}
          if changed != allowed:
              raise SystemExit('BLOCK: expected exactly the canonical trio, got ' + repr(sorted(changed)))
          if subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']):
              raise SystemExit('BLOCK: unexpected untracked paths')
          PY
          test "$(git ls-remote origin refs/pull/1110/head | awk 'NR==1 {print $1}')" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin "refs/heads/$RESULT_REF" | awk 'NR==1 {print $1}')" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'fix(integrity): persist the six omitted PR #1110 paths' -m 'Canonical regeneration only; source and workflow bytes unchanged. PREDECESSOR_EVIDENCE_TRANSFER=false. Fresh successor validation required. No P2, review, Main, deployment or EFFECT claim.'
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_HEAD"
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          git push origin "HEAD:refs/heads/$RESULT_REF"
          test "$(git ls-remote --heads origin "refs/heads/$RESULT_REF" | awk 'NR==1 {print $1}')" = "$head"
          printf 'head=%s\ntree=%s\n' "$head" "$tree" >> "$GITHUB_OUTPUT"
          printf 'SUCCESSOR_HEAD=%s\nSUCCESSOR_TREE=%s\nPARENT=%s\n' "$head" "$tree" "$EXPECTED_HEAD"
          echo 'PREDECESSOR_EVIDENCE_TRANSFER=false; P2=NOT_ESTABLISHED; REVIEW=NOT_ADVANCED; MAIN=NOT_MUTATED; DEPLOYMENT=NOT_PERFORMED; EFFECT=NOT_ESTABLISHED'

  validate:
    needs: materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUCCESSOR_HEAD: ${{ needs.materialize.outputs.head }}
      SUCCESSOR_TREE: ${{ needs.materialize.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.materialize.outputs.head }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fresh persisted-successor HEAD TREE readback and bounded regressions
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr1110-integrity-readback"
          mkdir -p "$out"
          exec > >(tee "$out/validation.log") 2>&1
          test "$(git rev-parse HEAD)" = "$SUCCESSOR_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$SUCCESSOR_TREE"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote --heads origin "refs/heads/$RESULT_REF" | awk 'NR==1 {print $1}')" = "$SUCCESSOR_HEAD"
          test -z "$(git status --porcelain)"
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest discover -s tests -p test_integrity.py -v
          python3 -B -m unittest discover -s tests -p test_three_phase_mesh_seed_mvp.py -v
          python3 -B -m unittest discover -s tests -p test_qikvrt_evidence_router_library.py -v
          python3 -B tools/qikvrt_integrity.py verify
          test -z "$(git status --porcelain)"
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          allowed = {'REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt'}
          changed = set(git('diff', '--name-only', os.environ['EXPECTED_HEAD'], 'HEAD').splitlines())
          if changed != allowed:
              raise SystemExit('BLOCK: successor changed paths outside canonical trio')
          pr_head = git('ls-remote', 'origin', 'refs/pull/1110/head').split()[0]
          if pr_head not in {os.environ['EXPECTED_HEAD'], os.environ['SUCCESSOR_HEAD']}:
              raise SystemExit('BLOCK: PR head drift')
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1110-integrity-readback'
          files = []
          for name in sorted(allowed):
              data = pathlib.Path(name).read_bytes()
              files.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'git_blob': git('rev-parse', 'HEAD:'+name)})
              shutil.copyfile(name, out/name)
          receipt = {
              'schema': 'qikvrt_pr1110_integrity_scoped_readback_v1',
              'repository': 'Goldkelch/qik-vrt', 'pull_request': 1110,
              'head': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
              'parent': git('show', '-s', '--format=%P', 'HEAD'),
              'input_head': os.environ['EXPECTED_HEAD'], 'input_tree': os.environ['EXPECTED_TREE'],
              'executor_event_head': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'pr_head_at_readback': pr_head,
              'pr_head_matches_successor': pr_head == os.environ['SUCCESSOR_HEAD'],
              'scope': 'canonical integrity persistence/readback/validation only',
              'integrity_verify': 'PASS', 'integrity_tests': 'PASS',
              'seed_contract_regression': 'PASS', 'router_library_regression': 'PASS',
              'changed_paths': sorted(changed), 'files': files,
              'PREDECESSOR_EVIDENCE_TRANSFER': False,
              'P2': 'NOT_ESTABLISHED', 'review': 'NOT_ADVANCED',
              'Main': 'NOT_MUTATED', 'deployment': 'NOT_PERFORMED', 'EFFECT': 'NOT_ESTABLISHED',
          }
          (out/'receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Retain scope-bound readback outside the candidate tree
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr1110-integrity-${{ needs.materialize.outputs.head }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr1110-integrity-readback/
          if-no-files-found: error
          retention-days: 30
