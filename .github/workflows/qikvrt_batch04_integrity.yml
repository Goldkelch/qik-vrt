# Generalized deterministic evidence materializer for protected repository states.
name: QIKVRT repository evidence materialization

on:
  push:
    branches:
      - main
      - agent/formalization-cache-hmi-batch04
      - agent/manuscript-formalization-v2-completion
      - docs/information-effect-axis-v1
      - publication/pr966-p5-successor-v1
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qikvrt-repository-evidence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]' &&
       github.actor != 'github-actions[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Classify deterministic materialization scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/qikvrt-materialization-paths.bin"
          : > "$paths_file"
          full=0
          head_sha="$(git rev-parse --verify HEAD^{commit})"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             [ -z "${BASE_SHA:-}" ] || \
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            full=1
          else
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
                full=1
              fi
            fi
            if [ "$full" -eq 0 ]; then
              if ! git diff --name-only -z "$BASE_SHA" "$head_sha" -- > "$paths_file"; then
                full=1
                : > "$paths_file"
              fi
            fi
          fi
          args=(--paths-file "$paths_file" --github-output "$GITHUB_OUTPUT")
          if [ "$full" -eq 1 ]; then args+=(--full); fi
          python3 -B tools/qikvrt_materialization_scope.py "${args[@]}" | tee "$RUNNER_TEMP/qikvrt-materialization-scope.json"
          {
            echo '### Deterministic materialization scope'; echo; echo '```json';
            cat "$RUNNER_TEMP/qikvrt-materialization-scope.json"; echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Regenerate and verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Run complete repository gates before persistence
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 tools/qikvrt_integrity.py verify
      - name: Commit materialized repository evidence
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
          if [ "$remote_head" != "$source_head" ]; then
            echo "BLOCK: target ref advanced before repository evidence persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Repository integrity evidence is already current."
            exit 0
          fi
          git commit -m "ci: materialize repository integrity evidence"
          remote_head_after_commit="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo "BLOCK: target ref advanced while repository evidence was materialized" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_after_commit=$remote_head_after_commit" >&2
            exit 2
          fi
          git push origin "HEAD:$TARGET_REF"
