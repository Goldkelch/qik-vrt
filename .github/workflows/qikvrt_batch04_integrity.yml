# Generalized deterministic evidence materializer for protected repository states.
name: QIKVRT repository evidence materialization

on:
  push:
    branches:
      - main
      - agent/formalization-cache-hmi-batch04
      - agent/manuscript-formalization-v2-completion
      - docs/information-effect-axis-v1
      - publication/pr966-p5-successor-v1
      - mesh/effect-evidence-invariant-v1
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: qikvrt-repository-evidence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test PR integrity byte-carrier boundaries
        run: python3 -B -m unittest discover -s tests -p test_qikvrt_pr_integrity_byte_carrier.py -v
      - name: Classify deterministic materialization scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/qikvrt-materialization-paths.bin"
          : > "$paths_file"
          full=0
          head_sha="$(git rev-parse --verify HEAD^{commit})"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             [ -z "${BASE_SHA:-}" ] || \
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            full=1
          else
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
                full=1
              fi
            fi
            if [ "$full" -eq 0 ]; then
              if ! git diff --name-only -z "$BASE_SHA" "$head_sha" -- > "$paths_file"; then
                full=1
                : > "$paths_file"
              fi
            fi
          fi
          args=(
            --paths-file "$paths_file"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$full" -eq 1 ]; then
            args+=(--full)
          fi
          python3 -B tools/qikvrt_materialization_scope.py "${args[@]}" \
            | tee "$RUNNER_TEMP/qikvrt-materialization-scope.json"
          {
            echo '### Deterministic materialization scope'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/qikvrt-materialization-scope.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Materialize completed manuscript evidence when present
        if: steps.scope.outputs.formalization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="formalization/QIKVRT_Formalization_v2.0"
          if [ ! -f "$root/scripts/materialize_completion.py" ]; then
            echo "Completion materializer is not present on this branch."
            exit 0
          fi
          (
            cd "$root"
            python3 scripts/materialize_completion.py
            python3 scripts/render_completion_proof_map.py
            python3 scripts/render_completion_verification_report.py
            python3 scripts/materialize_completion_proof_manifest.py
            python3 scripts/materialize_completion.py --check
            python3 scripts/render_completion_proof_map.py --check
            python3 scripts/render_completion_verification_report.py --check
            python3 scripts/materialize_completion_proof_manifest.py --check
            python3 scripts/validate_completion_claim_graph.py
          )
      - name: Rebuild deterministic formalization release bundle when present
        if: steps.scope.outputs.formalization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          script="formalization/QIKVRT_Formalization_v2.0/scripts/package_release.py"
          manifest="release/formalization-v2-alpha2-zenodo.json"
          archive="release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip"
          sums="release/formalization-v2/ZENODO_SHA256SUMS-alpha.2"
          if [ ! -f "$script" ] || [ ! -f "$manifest" ]; then
            echo "Formalization release bundle is not present on this branch."
            exit 0
          fi
          python3 "$script" \
            --repository-root . \
            --output "$archive" \
            --zenodo-checksums "$sums"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re

          root = pathlib.Path('.').resolve()
          manifest_path = root / 'release/formalization-v2-alpha2-zenodo.json'
          value = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = value['software']['files']
          archive_digest = None
          for entry in files:
              path = root / entry['path']
              raw = path.read_bytes()
              entry['size'] = len(raw)
              entry['md5'] = hashlib.md5(raw, usedforsecurity=False).hexdigest()
              entry['sha256'] = hashlib.sha256(raw).hexdigest()
              if entry['name'] == 'QIKVRT_Formalization_v2.0-alpha.2.zip':
                  archive_digest = entry['sha256']
          if archive_digest is None:
              raise SystemExit('BLOCK: archive entry is absent from the Zenodo manifest')
          notes = value['software']['metadata']['notes']
          notes, count = re.subn(
              r'Autorisiertes Archiv SHA-256: [0-9a-f]{64}\.',
              f'Autorisiertes Archiv SHA-256: {archive_digest}.',
              notes,
              count=1,
          )
          if count != 1:
              raise SystemExit('BLOCK: archive digest note is absent or ambiguous')
          value['software']['metadata']['notes'] = notes
          manifest_path.write_text(
              json.dumps(value, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python3 -B tests/test_formalization_v2_release_workflow.py
      - name: Refresh most advanced content-disposition status when present
        if: steps.scope.outputs.content_disposition == 'true'
        shell: bash
        run: |
          set -euo pipefail
          final_script="tools/qikvrt_content_disposition_batch_003_remaining_archives.py"
          final_receipt="release/zenodo-corpus-proof-2026-07-28/canonical-union/retrospective-proof-corpus/RETROSPECTIVE_PROOF_CORPUS_RECEIPT.json"
          second_script="tools/qikvrt_content_disposition_batch_003_subject_172dd9bc2738fa43.py"
          recursive_probe="tools/qikvrt_batch003_subject_172dd_recursive_probe.py"
          second_report="$RUNNER_TEMP/SUBJECT-172dd9bc2738fa43_RECURSIVE_PUBLIC_ARCHIVE_PROBE.json"
          first_script="tools/qikvrt_content_disposition_batch_003_subject_2581811b342e505d.py"
          first_work_unit="work-units/RECOVER_EXACT_PUBLIC_INDEX_BYTES_AND_EXTRACT_CLASSIFY_BATCH_003_SUBJECT_2581811B342E505D.json"
          dispatch_script="tools/qikvrt_content_disposition_batch_003_dispatch.py"
          dispatch_receipt="release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/dispatch/BATCH_003_DISPATCH_RECEIPT.json"
          post_script="tools/qikvrt_content_disposition_status_after_batch_002_acceptance_compat.py"
          post_receipt="release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-002/post-acceptance/POST_ACCEPTANCE_STATUS_PROJECTION.json"
          if [ -f "$final_script" ] && [ -f "$final_receipt" ]; then
            python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
              --materialize --json
            python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
              --check --json
            python3 -B "$dispatch_script" --check-status-projection --json
          elif [ -f "$second_script" ] && [ -f "$recursive_probe" ]; then
            python3 -B -m tools.qikvrt_batch003_subject_172dd_recursive_probe \
              --output "$second_report"
            python3 -B "$second_script" --report "$second_report" --materialize
            python3 -B "$second_script" --check
          elif [ -f "$first_script" ] && [ -f "$first_work_unit" ]; then
            python3 -B "$first_script" --verify-public-record --materialize
            python3 -B "$first_script" --check
            python3 -B -m unittest -v \
              tests.test_content_disposition_batch_003_subject_2581811b342e505d \
              tests.test_content_disposition_batch_003_dispatch
          elif [ -f "$dispatch_script" ] && [ -f "$dispatch_receipt" ]; then
            python3 -B "$dispatch_script" --materialize
            python3 -B "$dispatch_script" --check-status-projection
          elif [ -f "$post_script" ] && [ -f "$post_receipt" ]; then
            python3 -B "$post_script" --materialize
            python3 -B "$post_script" --check-status-projection
          else
            echo "No current content-disposition status projector is present on this branch."
          fi
      - name: Provision and verify aphorism publication runtime when present
        if: steps.scope.outputs.aphorism == 'true'
        shell: bash
        run: |
          set -euo pipefail
          script="tools/qikvrt_aphorism_corpus_v2.py"
          if [ ! -f "$script" ]; then
            echo "Aphorism-corpus materializer is not present on this branch."
            exit 0
          fi
          missing=0
          for command in xelatex pdfinfo pdftotext pdftoppm pdffonts; do
            if ! command -v "$command" >/dev/null 2>&1; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            sudo apt-get update -o Acquire::Retries=3
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends \
                texlive-xetex \
                texlive-latex-extra \
                texlive-lang-german \
                texlive-fonts-recommended \
                fonts-lmodern \
                poppler-utils
          fi
          command -v xelatex
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          command -v pdffonts
          xelatex --version | sed -n '1p'
          pdfinfo -v 2>&1 | sed -n '1p'
          pdftotext -v 2>&1 | sed -n '1p'
          pdftoppm -v 2>&1 | sed -n '1p'
          pdffonts -v 2>&1 | sed -n '1p'
          if command -v dpkg-query >/dev/null 2>&1; then
            dpkg-query --show \
              --showformat='publication-package=${Package}=${Version}\n' \
              texlive-xetex \
              texlive-latex-extra \
              texlive-lang-german \
              texlive-fonts-recommended \
              fonts-lmodern \
              poppler-utils
          fi
      - name: Materialize aphorism-corpus scientific assessment when present
        if: steps.scope.outputs.aphorism == 'true'
        shell: bash
        run: |
          set -euo pipefail
          script="tools/qikvrt_aphorism_corpus_v2.py"
          if [ ! -f "$script" ]; then
            echo "Aphorism-corpus materializer is not present on this branch."
            exit 0
          fi
          for command in xelatex pdfinfo pdftotext pdftoppm pdffonts; do
            command -v "$command" >/dev/null || {
              echo "BLOCK: required publication tool is absent: $command" >&2
              exit 1
            }
          done
          python3 -B "$script" --materialize --json
          python3 -B "$script" --check --json
          python3 -B -m unittest -v tests.test_aphorism_corpus_v2
      - name: Regenerate and verify repository integrity
        id: regenerated_integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Run complete repository gates before persistence
        id: repository_gates
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 tools/qikvrt_integrity.py verify
      - name: Freeze regenerated PR integrity bytes without a repository write
        id: byte_carrier
        if: ${{ always() && steps.regenerated_integrity.outcome == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'mesh/effect-evidence-invariant-v1')) }}
        env:
          CARRIER_DIRECTORY: ${{ runner.temp }}/qikvrt-pr-integrity-carrier
          CARRIER_REPOSITORY: ${{ github.repository }}
          CARRIER_PR: ${{ github.event.pull_request.number || 1160 }}
          CARRIER_RUN_ID: ${{ github.run_id }}
          CARRIER_RUN_ATTEMPT: ${{ github.run_attempt }}
          CARRIER_GATES: ${{ steps.repository_gates.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY_CARRIER'
          import hashlib, json, os, re, stat, subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args])

          def blob(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()

          def regular(path):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd, 'rb') as handle:
                  if not stat.S_ISREG(os.fstat(handle.fileno()).st_mode):
                      raise SystemExit('BLOCK: non-regular integrity file')
                  raw = handle.read(64 * 1024 * 1024 + 1)
              if len(raw) > 64 * 1024 * 1024:
                  raise SystemExit('BLOCK: integrity file exceeds byte limit')
              return raw

          root = Path.cwd().resolve()
          target = Path(os.environ['CARRIER_DIRECTORY']).resolve()
          if target == root or root in target.parents:
              raise SystemExit('BLOCK: carrier must be outside the checkout')
          head = git('rev-parse', '--verify', 'HEAD^{commit}').decode().strip()
          tree = git('rev-parse', '--verify', 'HEAD^{tree}').decode().strip()
          if not re.fullmatch('[0-9a-f]{40}', os.environ['EXPECTED_HEAD']) or head != os.environ['EXPECTED_HEAD']:
              raise SystemExit('BLOCK: exact source HEAD drift')
          repository = os.environ['CARRIER_REPOSITORY']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise SystemExit('BLOCK: invalid repository identity')
          ids = {key: os.environ[key] for key in ('CARRIER_PR', 'CARRIER_RUN_ID', 'CARRIER_RUN_ATTEMPT')}
          if any(not re.fullmatch('[1-9][0-9]*', value) for value in ids.values()):
              raise SystemExit('BLOCK: invalid PR/run binding')
          gates = os.environ['CARRIER_GATES']
          if gates not in ('success', 'failure', 'cancelled', 'skipped'):
              raise SystemExit('BLOCK: unknown gate outcome')
          paths = ('REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt')
          delta = git('diff', '--name-only', '--no-renames', '-z', 'HEAD', '--')
          changed = sorted(path.decode('utf-8') for path in delta.split(b'\0') if path)
          payload, entries = {}, []
          for name in paths:
              entry = git('ls-tree', '-z', 'HEAD', '--', name).split(b'\0')
              if len(entry) != 2 or entry[-1] or b'\t' not in entry[0]:
                  raise SystemExit('BLOCK: missing or ambiguous integrity source path')
              metadata, returned_path = entry[0].split(b'\t', 1)
              mode, kind, before = metadata.decode().split()
              if returned_path.decode() != name or kind != 'blob' or mode != '100644':
                  raise SystemExit('BLOCK: invalid integrity source tree entry')
              raw = regular(root / name)
              payload[name] = raw
              entries.append({'path': name, 'mode': mode, 'source_blob_sha1': before,
                              'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(),
                              'git_blob_sha1': blob(raw)})
          other = sorted(set(changed) - set(paths))
          manifest = {'schema': 'qikvrt_pr_integrity_byte_carrier_v1',
                      'source': {'repository': repository, 'head_sha': head, 'tree_sha': tree,
                                 'pull_request': int(ids['CARRIER_PR']), 'run_id': int(ids['CARRIER_RUN_ID']),
                                 'run_attempt': int(ids['CARRIER_RUN_ATTEMPT'])},
                      'repository_gates_outcome': gates, 'files': entries,
                      'other_modified_paths': other, 'trio_covers_tracked_delta': not other,
                      'claims': {'repository_successor_persisted': False,
                                 'fresh_successor_gates_pass': False, 'effect_ack_done': False}}
          if git('rev-parse', 'HEAD').decode().strip() != head or git('diff', '--name-only', '--no-renames', '-z', 'HEAD', '--') != delta:
              raise SystemExit('BLOCK: source changed during byte capture')
          if any(regular(root / name) != raw for name, raw in payload.items()):
              raise SystemExit('BLOCK: integrity bytes changed during capture')
          target.mkdir(parents=True, exist_ok=False)
          for name, raw in payload.items():
              (target / name).write_bytes(raw)
              if regular(target / name) != raw:
                  raise SystemExit('BLOCK: local carrier readback mismatch')
          manifest_raw = (json.dumps(manifest, sort_keys=True, indent=2, allow_nan=False) + '\n').encode()
          (target / 'CARRIER.json').write_bytes(manifest_raw)
          if regular(target / 'CARRIER.json') != manifest_raw:
              raise SystemExit('BLOCK: local manifest readback mismatch')
          print('PR_INTEGRITY_CARRIER_HEAD=' + head)
          print('PR_INTEGRITY_CARRIER_TREE=' + tree)
          print('PR_INTEGRITY_CARRIER_SHA256=' + hashlib.sha256(manifest_raw).hexdigest())
          print('BYTE_CARRIER_CREATED_NOT_REPOSITORY_SUCCESSOR')
          PY_CARRIER
      - name: Preserve regenerated PR integrity byte carrier
        id: upload_byte_carrier
        if: ${{ always() && steps.byte_carrier.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-pr-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-pr-integrity-carrier/
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Freshly read back persisted PR integrity bytes
        if: ${{ always() && steps.upload_byte_carrier.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CARRIER_DIRECTORY: ${{ runner.temp }}/qikvrt-pr-integrity-carrier
          CARRIER_ARCHIVE: ${{ runner.temp }}/qikvrt-pr-integrity-readback.zip
          CARRIER_ARTIFACT_ID: ${{ steps.upload_byte_carrier.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CARRIER_ARTIFACT_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CARRIER_ARTIFACT_ID}/zip" > "$CARRIER_ARCHIVE"
          python3 -B - <<'PY_CARRIER_READBACK'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path(os.environ['CARRIER_DIRECTORY'])
          names = ('CARRIER.json', 'REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt')
          with zipfile.ZipFile(os.environ['CARRIER_ARCHIVE']) as archive:
              if sorted(archive.namelist()) != sorted(names):
                  raise SystemExit('BLOCK: artifact entries differ or repeat')
              for name in names:
                  expected = (root / name).read_bytes()
                  info = archive.getinfo(name)
                  if info.file_size != len(expected) or archive.read(name) != expected:
                      raise SystemExit('BLOCK: persisted artifact bytes differ: ' + name)
          manifest_raw = (root / 'CARRIER.json').read_bytes()
          manifest = json.loads(manifest_raw)
          print(json.dumps({'state': 'BYTE_CARRIER_READBACK_VERIFIED',
                            'artifact_id': os.environ['CARRIER_ARTIFACT_ID'],
                            'carrier_sha256': hashlib.sha256(manifest_raw).hexdigest(),
                            'source': manifest['source'], 'files': manifest['files'],
                            'repository_successor_persisted': False, 'effect_ack_done': False}, sort_keys=True))
          PY_CARRIER_READBACK
      - name: Commit materialized repository evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$source_head" ]; then
            echo "BLOCK: target ref advanced before repository evidence persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            formalization/QIKVRT_Formalization_v2.0/claims/TEX_ENVIRONMENTS.json \
            formalization/QIKVRT_Formalization_v2.0/claims/APPENDIX_MATRIX.json \
            formalization/QIKVRT_Formalization_v2.0/claims/CLAIM_GRAPH.json \
            formalization/QIKVRT_Formalization_v2.0/MANUSCRIPT_PROOF_MAP.md \
            formalization/QIKVRT_Formalization_v2.0/VERIFICATION_REPORT.md \
            formalization/QIKVRT_Formalization_v2.0/proofs/PROOF_OBJECT_MANIFEST.json \
            release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip \
            release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip.sha256 \
            release/formalization-v2/ZENODO_SHA256SUMS-alpha.2 \
            release/formalization-v2-alpha2-zenodo.json \
            tools/qikvrt_content_disposition_batch_003_subject_2581811b342e505d.py \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-2581811b342e505d \
            work-units/EXTRACT_ARCHIVE_CONTENT_THEN_DISPOSITION_CLAIMS_BATCH_003_SUBJECT_172DD9BC2738FA43.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-172dd9bc2738fa43 \
            work-units/EXTRACT_ARCHIVE_CONTENT_THEN_DISPOSITION_CLAIMS_BATCH_003_SUBJECT_B4849E1A2D6B2270.json \
            docs/publications/2026-08-04-aphorism-corpus-scientific-assessment \
            docs/publications/index.json \
            docs/publications/index.html \
            work-units/MATERIALIZE_APHORISM_CORPUS_SCIENTIFIC_ASSESSMENT_V2.json \
            AI_PROGRESS.json \
            AI_STATUS.md \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          optional_paths=(
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/CONTENT_DISPOSITION_BATCH_003_RECEIPT.json
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-b4849e1a2d6b2270
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-7956d8acdc473825
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-ce2390f18618ad0c
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-780b9bf86425cee3
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-7fdb36aa7c07c07d
            release/zenodo-corpus-proof-2026-07-28/canonical-union/retrospective-proof-corpus
            work-units/CREATE_VERSIONED_CORRECTED_CANDIDATES_REMAINING_CORPUS_SUBJECTS.json
            work-units/REQUEST_SEPARATE_ZENODO_MUTATION_AUTHORIZATION_RETROSPECTIVE_PROOF_CORPUS.json
          )
          for path in "${optional_paths[@]}"; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "Repository evidence is already current."
            exit 0
          fi
          git commit -m "ci: materialize repository evidence"
          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo "BLOCK: target ref advanced while repository evidence was materialized" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_after_commit=$remote_head_after_commit" >&2
            exit 2
          fi
          git push origin "HEAD:$TARGET_REF"

      - name: Read back exact persisted integrity successor and request native verification
        if: github.event_name == 'push' && github.ref_name == 'mesh/effect-evidence-invariant-v1'
        env:
          GH_TOKEN: ${{ github.token }}
          CARRIER_DIRECTORY: ${{ runner.temp }}/qikvrt-pr-integrity-carrier
          REPOSITORY_READBACK: ${{ runner.temp }}/qikvrt-integrity-repository-readback
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Goldkelch/qik-vrt'
          persisted_head="$(git rev-parse --verify HEAD^{commit})"
          persisted_tree="$(git rev-parse --verify HEAD^{tree})"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$persisted_head" = "$remote_head"
          export PERSISTED_HEAD="$persisted_head" PERSISTED_TREE="$persisted_tree"
          mkdir "$REPOSITORY_READBACK"
          for path in REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt; do
            blob="$(git rev-parse "$persisted_head:$path")"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$blob" > "$REPOSITORY_READBACK/$path.json"
          done
          python3 -B - <<'PY_REPOSITORY_READBACK'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          carrier = Path(os.environ['CARRIER_DIRECTORY'])
          remote = Path(os.environ['REPOSITORY_READBACK'])
          manifest = json.loads((carrier / 'CARRIER.json').read_bytes())
          source = manifest['source']
          if source['repository'] != os.environ['GITHUB_REPOSITORY'] or source['head_sha'] != os.environ['EXPECTED_HEAD'] or source['run_id'] != int(os.environ['GITHUB_RUN_ID']) or source['run_attempt'] != int(os.environ['GITHUB_RUN_ATTEMPT']) or source['pull_request'] != 1160:
              raise SystemExit('BLOCK: carrier source binding differs')
          if manifest['repository_gates_outcome'] != 'success' or not manifest['trio_covers_tracked_delta'] or manifest['other_modified_paths']:
              raise SystemExit('BLOCK: integrity-only successor preconditions not satisfied')
          head, tree = os.environ['PERSISTED_HEAD'], os.environ['PERSISTED_TREE']
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          if git('rev-parse', 'HEAD') != head or git('rev-parse', 'HEAD^{tree}') != tree:
              raise SystemExit('BLOCK: persisted subject differs')
          if head != source['head_sha'] and git('rev-parse', 'HEAD^') != source['head_sha']:
              raise SystemExit('BLOCK: successor is not a direct source child')
          paths = ('REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt')
          if [entry['path'] for entry in manifest['files']] != list(paths):
              raise SystemExit('BLOCK: carrier scope differs')
          for entry in manifest['files']:
              expected = (carrier / entry['path']).read_bytes()
              response = json.loads((remote / (entry['path'] + '.json')).read_bytes())
              if response.get('encoding') != 'base64' or response.get('sha') != entry['git_blob_sha1'] or response.get('size') != len(expected):
                  raise SystemExit('BLOCK: remote blob metadata differs')
              raw = base64.b64decode(''.join(response['content'].split()), validate=True)
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if raw != expected or len(raw) != entry['bytes'] or hashlib.sha256(raw).hexdigest() != entry['sha256'] or blob != entry['git_blob_sha1'] or git('rev-parse', head + ':' + entry['path']) != blob:
                  raise SystemExit('BLOCK: repository byte readback differs')
          result = {'state': 'REPOSITORY_INTEGRITY_SUCCESSOR_READBACK_VERIFIED',
                    'source': source, 'successor_head': head, 'successor_tree': tree,
                    'files': manifest['files'], 'fresh_successor_gates_pass': False,
                    'effect_ack_done': False}
          (remote / 'RECEIPT.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, sort_keys=True))
          PY_REPOSITORY_READBACK
          gh api "repos/${GITHUB_REPOSITORY}/pulls/1160" > "$REPOSITORY_READBACK/pr.json"
          jq -e --arg head "$persisted_head" --arg ref "$TARGET_REF" --arg repo "$GITHUB_REPOSITORY" \
            '.number == 1160 and .state == "open" and .head.sha == $head and .head.ref == $ref and .head.repo.full_name == $repo and .base.ref == "main"' \
            "$REPOSITORY_READBACK/pr.json" >/dev/null
          main_head="$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 {print $1}')"
          test -n "$main_head"
          test "$(jq -r '.base.sha' "$REPOSITORY_READBACK/pr.json")" = "$main_head"
          common="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${main_head}...${persisted_head}" --jq '.merge_base_commit.sha')"
          test "$common" = "$main_head"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$TARGET_REF" \
            --arg head "$persisted_head" --arg base "$main_head" --arg source_run "$GITHUB_RUN_ID" \
            '{event_type:"qikvrt_autonomous_exact_head_verify",client_payload:{repository:$repo,pull_request:1160,head_ref:$ref,head_sha:$head,base_sha:$base,source_materializer_run_id:$source_run}}' \
            > "$REPOSITORY_READBACK/verification-request.json"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')" = "$persisted_head"
          test "$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 {print $1}')" = "$main_head"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input "$REPOSITORY_READBACK/verification-request.json"
          echo 'VERIFICATION_REQUESTED_NOT_VERIFICATION_OR_EFFECT_ACK_DONE'
      - name: Preserve repository integrity readback receipt
        if: ${{ always() && github.event_name == 'push' && github.ref_name == 'mesh/effect-evidence-invariant-v1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-integrity-repository-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-integrity-repository-readback/RECEIPT.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
