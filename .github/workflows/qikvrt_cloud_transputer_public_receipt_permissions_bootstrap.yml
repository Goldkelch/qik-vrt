# Temporary finite repair for production receipt permissions. The password-file
# umask is scoped to a subshell and public nginx readback files are explicitly
# world-readable; persistent state remains separate. The workflow verifies,
# regenerates integrity, removes itself and CAS-pushes one successor.
name: QIKVRT cloud transputer public receipt permission repair bootstrap

on:
  push:
    branches: [runtime/cloud-transputer-v1]

permissions:
  contents: write

concurrency:
  group: qikvrt-cloud-transputer-public-receipt-permissions-bootstrap
  cancel-in-progress: false

jobs:
  repair-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Scope password umask and bind public readback permissions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          from pathlib import Path

          entry_path = Path('deploy/cloud-transputer/entrypoint.sh')
          entry = entry_path.read_text(encoding='utf-8')
          old_umask = '''  umask 077\n  printf '%s:%s\\n' "$TERMINAL_USER" "$TERMINAL_HASH" > "$RUN_DIR/terminal.htpasswd"\n'''
          new_umask = '''  (\n    umask 077\n    printf '%s:%s\\n' "$TERMINAL_USER" "$TERMINAL_HASH" > "$RUN_DIR/terminal.htpasswd"\n  )\n'''
          if entry.count(old_umask) != 1:
              raise SystemExit('BLOCK: exact terminal htpasswd umask block not observed once')
          entry = entry.replace(old_umask, new_umask)

          old_runtime = '''  os.replace(tmp,path)\nPY\n\ncleanup() {\n'''
          new_runtime = '''  os.replace(tmp,path)\nPY\nchmod 0644 "$RUN_DIR/runtime.json"\n\ncleanup() {\n'''
          if entry.count(old_runtime) != 1:
              raise SystemExit('BLOCK: runtime receipt permission anchor not observed once')
          entry = entry.replace(old_runtime, new_runtime)

          old_ready = '''printf '%s\\n' ready > "$RUN_DIR/ready.txt"\nprintf '%s\\n' "QIKVRT cloud transputer ready: runtime=$RUNTIME_ID proxy=0.0.0.0:$PROXY_PORT stable_mesh=$MESH_PUBLIC_URL"\n'''
          new_ready = '''printf '%s\\n' ready > "$RUN_DIR/ready.txt"\nchmod 0644 "$RUN_DIR/ready.txt"\nprintf '%s\\n' "QIKVRT cloud transputer ready: runtime=$RUNTIME_ID proxy=0.0.0.0:$PROXY_PORT stable_mesh=$MESH_PUBLIC_URL"\n'''
          if entry.count(old_ready) != 1:
              raise SystemExit('BLOCK: health readiness permission anchor not observed once')
          entry_path.write_text(entry.replace(old_ready, new_ready), encoding='utf-8', newline='\n')

          test_path = Path('tests/test_qikvrt_cloud_transputer_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''        self.assertIn("deny all;", text)\n        self.assertIn("location = /health", text)\n'''
          new_test = '''        self.assertIn("deny all;", text)\n        self.assertIn("(\\n    umask 077", text)\n        self.assertNotIn("\\n  umask 077\\n  printf '%s:%s", text)\n        self.assertIn('chmod 0644 "$RUN_DIR/runtime.json"', text)\n        self.assertIn('chmod 0644 "$RUN_DIR/ready.txt"', text)\n        self.assertIn("location = /health", text)\n'''
          if tests.count(old_test) != 1:
              raise SystemExit('BLOCK: public guard permissions regression anchor not observed once')
          test_path.write_text(tests.replace(old_test, new_test), encoding='utf-8', newline='\n')
          PY

          python3 -B -m unittest -v tests.test_qikvrt_cloud_transputer_contract
          sh -n deploy/cloud-transputer/entrypoint.sh deploy/cloud-transputer/runtime-health.sh deploy/cloud-transputer/authority-mirror-refresh.sh

      - name: Remove bootstrap and regenerate integrity trio
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/qikvrt_cloud_transputer_public_receipt_permissions_bootstrap.yml
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          git add deploy/cloud-transputer/entrypoint.sh \
                  tests/test_qikvrt_cloud_transputer_contract.py \
                  REPOSITORY_FILE_MANIFEST.json \
                  REPOSITORY_FILE_MANIFEST.json.sha256 \
                  SHA256SUMS.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote --heads origin refs/heads/runtime/cloud-transputer-v1 | awk 'NR==1 {print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git commit -m "fix: scope terminal secret umask and expose public receipts"
          git push origin HEAD:refs/heads/runtime/cloud-transputer-v1