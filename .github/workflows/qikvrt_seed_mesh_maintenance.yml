name: QIKVRT Seed Mesh Maintenance

on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact event-bound Authority head (must equal github.sha)
        required: true
        type: string
      run_id:
        description: Optional safe QIKVRT run id
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'tools/qikvrt_seed_common.py'
      - 'tools/qikvrt_seed_control_plane.py'
      - 'state/mesh/QIKVRT_AUTHORITY_MIRROR_MESH_INSTANCE_V1.json'
      - 'policy/SEED_CONTROL_PLANE_PREVENTION_V1.json'
      - '.github/workflows/qikvrt_seed_mesh_maintenance.yml'

permissions:
  contents: read

concurrency:
  group: qikvrt-seed-mesh-maintenance
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QIKVRT_RUN_ID: ${{ inputs.run_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      QIKVRT_EXPECTED_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.sha }}
      QIKVRT_SEED_REPOSITORY: Goldkelch/qik-vrt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run role-bound exact-run Seed maintenance adapter
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse --verify HEAD^{commit})"
          test "$actual_head" = "$GITHUB_SHA"
          export QIKVRT_SOURCE_HEAD="$actual_head"
          export QIKVRT_SOURCE_TREE="$(git show -s --format=%T HEAD)"
          python3 -B tools/qikvrt_seed_control_plane.py maintenance --root .
      - name: Preserve only quarantined current-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-seed-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: .qikvrt/seed-workflow/${{ env.QIKVRT_RUN_ID }}/artifact
