name: QIKVRT Autonomous Orchestrator V2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/qikvrt_autonomous_orchestrator_v2.yml"
      - "docs/AUTONOMOUS_ORCHESTRATOR_V2.md"
      - "schemas/qikvrt-autonomous-work-queue-v2.schema.json"
      - "state/autonomy/AUTONOMOUS_ORCHESTRATOR_V2.json"
      - "state/autonomy/WORK_QUEUE_V2.json"
      - "state/authorization/promotions/AUTONOMOUS_ORCHESTRATOR_V2_PROMOTION.json"
      - "state/authorization/promotions/AUTONOMOUS_WORK_UNIT_PROMOTION_V2.json"
      - "tests/test_qikvrt_autonomous_orchestrator.py"
      - "tools/qikvrt_autonomous_orchestrator.py"
      - "docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/**"
      - "docs/publications/index.json"
      - "docs/publications/index.html"
      - "evidence/audio/2026-08-06-ontology-a08-a09/**"
      - "formalization/ontology-unified-v1/**"
      - "receipts/autonomy/**"
      - "REPOSITORY_FILE_MANIFEST.json"
      - "REPOSITORY_FILE_MANIFEST.json.sha256"
      - "SHA256SUMS.txt"
  push:
    branches:
      - main
      - "agent/autonomous-orchestrator-v2"
      - "automation/orchestrator-**"
    paths:
      - ".github/workflows/qikvrt_autonomous_orchestrator_v2.yml"
      - "docs/AUTONOMOUS_ORCHESTRATOR_V2.md"
      - "schemas/qikvrt-autonomous-work-queue-v2.schema.json"
      - "state/autonomy/AUTONOMOUS_ORCHESTRATOR_V2.json"
      - "state/autonomy/WORK_QUEUE_V2.json"
      - "state/authorization/promotions/AUTONOMOUS_ORCHESTRATOR_V2_PROMOTION.json"
      - "state/authorization/promotions/AUTONOMOUS_WORK_UNIT_PROMOTION_V2.json"
      - "tests/test_qikvrt_autonomous_orchestrator.py"
      - "tools/qikvrt_autonomous_orchestrator.py"
      - "docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/**"
      - "docs/publications/index.json"
      - "docs/publications/index.html"
      - "evidence/audio/2026-08-06-ontology-a08-a09/**"
      - "formalization/ontology-unified-v1/**"
      - "receipts/autonomy/**"
      - "REPOSITORY_FILE_MANIFEST.json"
      - "REPOSITORY_FILE_MANIFEST.json.sha256"
      - "SHA256SUMS.txt"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan, operate, validate, or promote"
        required: true
        default: operate
        type: choice
        options: [plan, operate, validate, promote]
      candidate_ref:
        description: "candidate branch for exact-head validation"
        required: false
        type: string
      candidate_sha:
        description: "expected candidate SHA for exact-head validation"
        required: false
        type: string
      work_unit_id:
        description: "exact work-unit ID for validation"
        required: false
        type: string

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-repository-writer-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"
  STATUS_CONTEXT: QIKVRT Autonomous Orchestrator Exact Head

jobs:
  exact-head-validation:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_name == 'agent/autonomous-orchestrator-v2') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'validate')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Resolve exact validation identity
        id: identity
        shell: bash
        env:
          DISPATCH_REF: ${{ inputs.candidate_ref }}
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_WORK_UNIT: ${{ inputs.work_unit_id }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            test -n "${DISPATCH_REF}"
            test "${DISPATCH_SHA}" =~ ^[0-9a-f]{40}$
            test "${DISPATCH_WORK_UNIT}" =~ ^AUT-[A-Z0-9-]+$
            ref="${DISPATCH_SHA}"
            branch="${DISPATCH_REF}"
            sha="${DISPATCH_SHA}"
            work_unit="${DISPATCH_WORK_UNIT}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            ref="${PR_HEAD_SHA}"
            branch="${PR_HEAD_REF}"
            sha="${PR_HEAD_SHA}"
            work_unit=""
          else
            ref="${GITHUB_SHA}"
            branch="${GITHUB_REF_NAME}"
            sha="${GITHUB_SHA}"
            work_unit=""
          fi
          {
            echo "ref=${ref}"
            echo "branch=${branch}"
            echo "sha=${sha}"
            echo "work_unit=${work_unit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out exact SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "${EXPECTED_SHA}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Lean 4.19 for optional ontology checks
        if: hashFiles('formalization/ontology-unified-v1/UnifiedOntology.lean') != ''
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization/ontology-unified-v1
          build: false
          test: false
          lint: false

      - name: Install document inspection tools when QCE is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence ]]; then
            if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
              sudo apt-get update -o Acquire::Retries=3
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends poppler-utils
            fi
          fi

      - name: Mark exact-head gate pending
        if: steps.identity.outputs.work_unit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.identity.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Exact-head repository suite is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Validate orchestrator contract and queue
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile tools/qikvrt_autonomous_orchestrator.py tests/test_qikvrt_autonomous_orchestrator.py
          python3 -B tools/qikvrt_autonomous_orchestrator.py validate | tee /tmp/orchestrator-validation.json
          python3 -B -m unittest -v tests.test_qikvrt_autonomous_orchestrator

      - name: Validate exact work-unit diff
        if: steps.identity.outputs.work_unit != ''
        env:
          WORK_UNIT_ID: ${{ steps.identity.outputs.work_unit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_orchestrator.py validate-diff \
            --work-unit "${WORK_UNIT_ID}" --base-ref HEAD^ | tee /tmp/orchestrator-diff.json

      - name: Verify QCE finalized package when present
        shell: bash
        run: |
          set -euo pipefail
          qce=docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          if [[ -f "${qce}/QCE_KERNEL_RECEIPT.json" ]]; then
            python3 -B "${qce}/verify_qce_package.py" \
              --static-only \
              --executed-receipt "${qce}/QCE_KERNEL_RECEIPT.json"
          fi

      - name: Compile unified ontology status model when present
        shell: bash
        run: |
          set -euo pipefail
          root=formalization/ontology-unified-v1
          if [[ -f "${root}/UnifiedOntology.lean" ]]; then
            (cd "${root}" && lake env lean -o /tmp/UnifiedOntology.olean UnifiedOntology.lean)
            (cd "${root}" && LEAN_PATH="/tmp:.${LEAN_PATH:+:${LEAN_PATH}}" lake env lean UnifiedOntology_AxiomAudit.lean) \
              | tee /tmp/unified-ontology-axiom-audit.txt
            test "$(grep -c '^' /tmp/unified-ontology-axiom-audit.txt)" -gt 0
          fi

      - name: Verify repository-native integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py verify

      - name: Run complete repository suite
        shell: bash
        run: make test

      - name: Write exact-head validation receipt
        if: always()
        env:
          CANDIDATE_BRANCH: ${{ steps.identity.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.identity.outputs.sha }}
          WORK_UNIT_ID: ${{ steps.identity.outputs.work_unit }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          payload = {
              "schema": "qikvrt_autonomous_exact_head_gate_receipt_v2",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "candidate_branch": os.environ["CANDIDATE_BRANCH"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "work_unit_id": os.environ.get("WORK_UNIT_ID") or None,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "conclusion": os.environ["JOB_STATUS"],
              "external_effect": "NONE",
              "completion_claims": {
                  "PASS": False,
                  "FINAL_PASS": False,
                  "EFFECT_ACK_DONE": False,
              },
          }
          raw = (json.dumps(payload, indent=2, sort_keys=True) + "\n").encode()
          Path("/tmp/orchestrator-exact-head-receipt.json").write_bytes(raw)
          Path("/tmp/orchestrator-exact-head-receipt.sha256").write_text(
              hashlib.sha256(raw).hexdigest() + "  orchestrator-exact-head-receipt.json\n"
          )
          PY

      - name: Upload exact-head validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-autonomous-exact-head-${{ steps.identity.outputs.sha }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/orchestrator-exact-head-receipt.json
            /tmp/orchestrator-exact-head-receipt.sha256

      - name: Publish exact-head status and continue promotion chain
        if: always() && steps.identity.outputs.work_unit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.identity.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${JOB_STATUS}" == "success" ]]; then
            state=success
            description="Full exact-head repository suite passed"
          else
            state=failure
            description="Exact-head repository suite failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="${state}" \
            -f context="${STATUS_CONTEXT}" \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          if [[ "${state}" == "success" ]] && \
             gh api "repos/${GITHUB_REPOSITORY}/contents/state/autonomy/AUTONOMOUS_ORCHESTRATOR_V2.json?ref=main" >/dev/null 2>&1; then
            gh workflow run qikvrt_autonomous_orchestrator_v2.yml \
              --ref main \
              -f mode=promote
          fi

  operate:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref_name == 'main') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode != 'validate'))
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out current Authority main with push capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate durable control state
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_orchestrator.py validate
          python3 -B -m unittest -v tests.test_qikvrt_autonomous_orchestrator

      - name: Attempt one expected-head-bound promotion
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_orchestrator.py promote --execute \
            > /tmp/orchestrator-promotion.json || status=$?
          status=${status:-0}
          cat /tmp/orchestrator-promotion.json
          python3 -B - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          value = json.load(open('/tmp/orchestrator-promotion.json', encoding='utf-8'))
          print(f"state={value['state']}")
          print(f"merge_sha={value.get('merge_commit_sha') or ''}")
          PY
          if [[ "${status}" -ne 0 ]]; then
            exit "${status}"
          fi

      - name: Continue queue after successful promotion
        if: steps.promotion.outputs.state == 'MERGED'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qikvrt_autonomous_orchestrator_v2.yml \
            --ref main \
            -f mode=operate

      - name: Stop current run after successful promotion
        if: steps.promotion.outputs.state == 'MERGED'
        shell: bash
        run: exit 0

      - name: Plan next deterministic work unit
        if: steps.promotion.outputs.state != 'MERGED'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_orchestrator.py plan > /tmp/orchestrator-plan.json || status=$?
          status=${status:-0}
          cat /tmp/orchestrator-plan.json
          python3 -B - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          value = json.load(open('/tmp/orchestrator-plan.json', encoding='utf-8'))
          print(f"state={value['state']}")
          print(f"work_unit={value.get('work_unit_id') or ''}")
          print(f"branch={value.get('candidate_branch') or ''}")
          PY
          if [[ "${status}" -ne 0 ]]; then
            exit "${status}"
          fi

      - name: Stop after read-only plan mode
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'plan'
        shell: bash
        run: exit 0

      - name: Materialize exactly one work unit
        if: steps.plan.outputs.state == 'READY' && !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'promote' || inputs.mode == 'plan'))
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_UNIT_ID: ${{ steps.plan.outputs.work_unit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_orchestrator.py apply \
            --work-unit "${WORK_UNIT_ID}" > /tmp/orchestrator-apply.json
          cat /tmp/orchestrator-apply.json
          python3 -B - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          value = json.load(open('/tmp/orchestrator-apply.json', encoding='utf-8'))
          for key in ('state', 'work_unit_id', 'candidate_branch', 'observed_base_sha'):
              print(f"{key}={value.get(key) or ''}")
          PY

      - name: Regenerate repository-native integrity
        if: steps.apply.outputs.state == 'CANDIDATE_READY'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Verify final candidate diff and focused outputs
        if: steps.apply.outputs.state == 'CANDIDATE_READY'
        env:
          WORK_UNIT_ID: ${{ steps.apply.outputs.work_unit_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_orchestrator.py validate-diff \
            --work-unit "${WORK_UNIT_ID}" --base-ref HEAD
          python3 -B -m unittest -v tests.test_qikvrt_autonomous_orchestrator
          qce=docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          if [[ -f "${qce}/QCE_KERNEL_RECEIPT.json" ]]; then
            if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
              sudo apt-get update -o Acquire::Retries=3
              sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends poppler-utils
            fi
            python3 -B "${qce}/verify_qce_package.py" \
              --static-only \
              --executed-receipt "${qce}/QCE_KERNEL_RECEIPT.json"
          fi

      - name: Create deterministic review branch and draft PR
        if: steps.apply.outputs.state == 'CANDIDATE_READY'
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_UNIT_ID: ${{ steps.apply.outputs.work_unit_id }}
          BRANCH: ${{ steps.apply.outputs.candidate_branch }}
          BASE_SHA: ${{ steps.apply.outputs.observed_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "${BASE_SHA}"
          test -n "$(git status --porcelain=v1 --untracked-files=all)"
          git config user.name "qik-vrt-autonomous-orchestrator"
          git config user.email "qik-vrt-autonomous-orchestrator@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add -A
          git commit -m "chore(autonomy): materialize ${WORK_UNIT_ID}"
          candidate_sha="$(git rev-parse --verify HEAD^{commit})"
          git push origin "HEAD:refs/heads/${BRANCH}"
          cat > /tmp/orchestrator-pr.md <<EOF
          Repository-native autonomous work-unit candidate.

          Work unit: \`${WORK_UNIT_ID}\`
          Observed Authority base: \`${BASE_SHA}\`
          Candidate head: \`${candidate_sha}\`
          Candidate branch: \`${BRANCH}\`

          This candidate contains exactly one deterministic repository-internal, reversible work unit plus repository-native integrity. It remains draft until the explicit exact-head gate posts success. Promotion is permitted only under the six repository-bound expected-head conditions.

          No Zenodo/IETF mutation, release, deployment, external actuator effect, physical confirmation, human acoustic certification, PASS, FINAL_PASS, or EFFECT_ACK_DONE is performed or claimed.
          EOF
          pr_url="$(gh pr create \
            --draft \
            --base main \
            --head "${BRANCH}" \
            --title "autonomy: ${WORK_UNIT_ID}" \
            --body-file /tmp/orchestrator-pr.md)"
          echo "Created ${pr_url}"
          gh workflow run qikvrt_autonomous_orchestrator_v2.yml \
            --ref main \
            -f mode=validate \
            -f candidate_ref="${BRANCH}" \
            -f candidate_sha="${candidate_sha}" \
            -f work_unit_id="${WORK_UNIT_ID}"

      - name: Assert no mutation when no candidate is materialized
        if: steps.apply.outputs.state != 'CANDIDATE_READY'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
