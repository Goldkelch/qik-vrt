name: QIK-VRT one-shot QCE exact-binding integrity repair

on:
  push:
    branches:
      - "agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
    paths:
      - ".github/workflows/qikvrt_qce_exact_binding_integrity_repair.yml"

permissions:
  contents: write

concurrency:
  group: qikvrt-qce-exact-binding-integrity-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded exact-binding precursor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "50cc737f387e9baaf6d5f1afce041fe34f697f7a"
          actual="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/qikvrt_qce_candidate.yml' \
            '.github/workflows/qikvrt_qce_exact_binding_integrity_repair.yml' \
            'docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/make_qce_kernel_receipt.py' | sort)"
          test "${actual}" = "${expected}"
          grep -Fq "github.event.pull_request.head.sha" .github/workflows/qikvrt_qce_candidate.yml
          grep -Fq "receipt commit" docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/make_qce_kernel_receipt.py
          grep -Fq "receipt tree" docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/make_qce_kernel_receipt.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install document inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Regenerate and verify QCE package integrity
        shell: bash
        run: |
          set -euo pipefail
          cd docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          python3 -B regenerate_qce_integrity.py
          python3 -B verify_qce_package.py --static-only

      - name: Remove one-shot workflow and regenerate repository integrity
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/qikvrt_qce_exact_binding_integrity_repair.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Commit and persist repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qik-vrt-qce-exact-binding-repair"
          git config user.email "qik-vrt-qce-exact-binding-repair@users.noreply.github.com"
          git add -A
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"
          git commit -m "fix(qce): enforce exact-head receipt binding"
          git push origin "HEAD:refs/heads/agent/qce-planck-pair-causal-emergence-2026-08-06-v1"
