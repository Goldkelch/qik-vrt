name: Autonomous issue processing

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to process
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  models: read

concurrency:
  group: qikvrt-repository-evidence-issue-agent/${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="$EVENT_ISSUE_NUMBER"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then number="$INPUT_ISSUE_NUMBER"; fi
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          issue_path="$RUNNER_TEMP/qikvrt-issue.json"
          gh api "repos/$REPOSITORY/issues/$number" > "$issue_path"
          jq -e '.pull_request | not' "$issue_path" >/dev/null
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "path=$issue_path" >> "$GITHUB_OUTPUT"

      - name: Bind history-preserving issue work branch
        id: branch
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          branch="issue-agent/$ISSUE_NUMBER"
          base_head="$(git rev-parse --verify HEAD^{commit})"
          base_tree="$(git rev-parse --verify HEAD^{tree})"
          remote_head="$({
            git ls-remote --heads origin "refs/heads/$branch" || true
          } | awk 'NR == 1 { print $1 }')"

          git config user.name "qik-vrt-issue-agent[bot]"
          git config user.email "qik-vrt-issue-agent[bot]@users.noreply.github.com"
          if [ -n "$remote_head" ]; then
            git fetch --no-tags origin "$remote_head"
            git switch --detach "$remote_head"
            git switch -c "$branch"
            test "$(git rev-parse --verify HEAD^{commit})" = "$remote_head"
            if ! git merge-base --is-ancestor "$base_head" HEAD; then
              set +e
              git merge --no-ff --no-edit "$base_head"
              merge_status=$?
              set -e
              if [ "$merge_status" -ne 0 ]; then
                mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort -u)
                test "${#conflicts[@]}" -gt 0
                allowed=(
                  REPOSITORY_FILE_MANIFEST.json
                  REPOSITORY_FILE_MANIFEST.json.sha256
                  SHA256SUMS.txt
                )
                for path in "${conflicts[@]}"; do
                  permitted=false
                  for candidate in "${allowed[@]}"; do
                    if [ "$path" = "$candidate" ]; then permitted=true; fi
                  done
                  if [ "$permitted" != true ]; then
                    echo "BLOCK: non-generated issue-branch merge conflict: $path" >&2
                    exit 2
                  fi
                  git checkout --theirs -- "$path"
                  git add -- "$path"
                done
                test -z "$(git diff --name-only --diff-filter=U)"
                git commit --no-edit
              fi
            fi
          else
            git switch -c "$branch" "$base_head"
          fi

          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "base_head=$base_head" >> "$GITHUB_OUTPUT"
          echo "base_tree=$base_tree" >> "$GITHUB_OUTPUT"
          echo "remote_head=$remote_head" >> "$GITHUB_OUTPUT"

      - name: Materialize request and repository context
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/materialize.py \
            --issue "${{ steps.issue.outputs.path }}" \
            --repository "$REPOSITORY" \
            --output-dir "evidence/issues/$ISSUE_NUMBER"

      - name: Generate repository-grounded answer
        id: inference
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/infer.py \
            --issue "${{ steps.issue.outputs.path }}" \
            --context "evidence/issues/$ISSUE_NUMBER/CONTEXT.md" \
            --output "evidence/issues/$ISSUE_NUMBER/ANSWER.md" \
            --model "openai/gpt-4.1"

      - name: Enforce truthful status
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          INFERENCE_OUTCOME: ${{ steps.inference.outcome }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/finalize.py \
            --directory "evidence/issues/$ISSUE_NUMBER" \
            --inference-outcome "$INFERENCE_OUTCOME"

      - name: Validate and promote generated artifacts
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/issue_agent -p 'test_*.py'
          python3 scripts/issue_agent/validate.py "evidence/issues/$ISSUE_NUMBER"
          python3 scripts/issue_agent/promote.py "evidence/issues/$ISSUE_NUMBER"
          python3 scripts/issue_agent/validate.py "evidence/issues/$ISSUE_NUMBER"

      - name: Close deterministic repository projection before persistence
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Create or update issue work branch and pull request
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
          EXPECTED_REMOTE_HEAD: ${{ steps.branch.outputs.remote_head }}
        run: |
          set -euo pipefail
          test "$BRANCH" = "issue-agent/$ISSUE_NUMBER"
          git add -- \
            "evidence/issues/$ISSUE_NUMBER" \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "issue-agent: process issue #$ISSUE_NUMBER"
          fi

          python3 -B tools/qikvrt_integrity.py verify
          live_remote_head="$({
            git ls-remote --heads origin "refs/heads/$BRANCH" || true
          } | awk 'NR == 1 { print $1 }')"
          if [ "$live_remote_head" != "$EXPECTED_REMOTE_HEAD" ]; then
            echo "BLOCK: issue branch advanced before history-preserving persistence" >&2
            echo "expected_remote_head=$EXPECTED_REMOTE_HEAD" >&2
            echo "live_remote_head=$live_remote_head" >&2
            exit 2
          fi
          candidate_head="$(git rev-parse --verify HEAD^{commit})"
          candidate_tree="$(git rev-parse --verify HEAD^{tree})"
          if [ "$candidate_head" != "$EXPECTED_REMOTE_HEAD" ]; then
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          persisted_head="$({
            git ls-remote --exit-code --heads origin "refs/heads/$BRANCH"
          } | awk 'NR == 1 { print $1 }')"
          test "$persisted_head" = "$candidate_head"

          pr_number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Issue agent: process #$ISSUE_NUMBER" \
              --body "Repository-native, history-preserving processing artifacts for #$ISSUE_NUMBER.\n\nExact-head gates, current review evidence, and separately authorized promotion remain mandatory. This carrier does not itself imply merge, Mirror synchronization, publication, PASS, FINAL_PASS, or EFFECT_ACK_DONE."
          fi

          pr_number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          pr_url="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')"
          status="$(jq -r '.status' "evidence/issues/$ISSUE_NUMBER/STATUS.json")"
          comment_file="$RUNNER_TEMP/qikvrt-issue-agent-comment.md"
          cat > "$comment_file" <<EOF
          <!-- qikvrt-issue-agent-current-transaction -->
          Repository processing status: **$status**

          Work product: $pr_url
          Exact candidate: \`$candidate_head\` / tree \`$candidate_tree\`

          The repository persisted and reread the history-preserving candidate. Exact-head gates and independent authority remain separate; no merge, synchronization, publication, PASS, FINAL_PASS, or EFFECT_ACK_DONE is asserted.
          EOF
          existing_comment="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/$ISSUE_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- qikvrt-issue-agent-current-transaction -->")) | .id' \
            | tail -n 1)"
          if [ -z "$existing_comment" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$comment_file"
          else
            current_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/$existing_comment" --jq '.body')"
            desired_body="$(cat "$comment_file")"
            if [ "$current_body" != "$desired_body" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$existing_comment" \
                --raw-field "body=$desired_body" >/dev/null
            fi
          fi
          printf 'issue_number=%s\n' "$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          printf 'head=%s\n' "$candidate_head" >> "$GITHUB_OUTPUT"
          printf 'pr_number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

      - name: Dispatch and reobserve the exact issue completion authority receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.candidate.outputs.issue_number }}
          EXPECTED_HEAD: ${{ steps.candidate.outputs.head }}
          EXPECTED_PR: ${{ steps.candidate.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          branch="issue-agent/$ISSUE_NUMBER"
          pr="$(gh api "repos/$REPOSITORY/pulls/$EXPECTED_PR")"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .base.ref <<<"$pr")" = main
          test "$(jq -r .head.ref <<<"$pr")" = "$branch"
          test "$(jq -r .head.sha <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.repo.full_name // empty' <<<"$pr")" = "$REPOSITORY"

          title="Issue agent completion authority observer #$ISSUE_NUMBER"
          before="$(gh api "repos/$REPOSITORY/actions/workflows/issue-agent-autofinish.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
            | jq --arg title "$title" '[.workflow_runs[] | select(.display_title == $title) | .id]')"
          gh workflow run issue-agent-autofinish.yml --repo "$REPOSITORY" --ref main \
            -f "issue_number=$ISSUE_NUMBER" -f "expected_head=$EXPECTED_HEAD"

          run_id=""
          for _ in $(seq 1 24); do
            candidate="$(gh api "repos/$REPOSITORY/actions/workflows/issue-agent-autofinish.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
              | jq -r --argjson before "$before" --arg title "$title" \
                '[.workflow_runs[] | select(.display_title == $title and (.id as $id | $before | index($id) | not))][0].id // empty')"
            if test -n "$candidate"; then
              status="$(gh api "repos/$REPOSITORY/actions/runs/$candidate" --jq .status)"
              if test "$status" = completed; then run_id="$candidate"; break; fi
            fi
            sleep 5
          done
          test -n "$run_id"
          test "$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq .conclusion)" = success
          gh api --paginate "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
            | jq -e --arg head "$EXPECTED_HEAD" --arg run "$run_id" \
              '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("qikvrt-issue-agent-completion-authority:v1:")) | select(.body | contains("- exact head: " + $head)) | select(.body | contains("- observer workflow run: " + $run))' \
            >/dev/null
          pr_after="$(gh api "repos/$REPOSITORY/pulls/$EXPECTED_PR")"
          test "$(jq -r .state <<<"$pr_after")" = open
          test "$(jq -r .base.ref <<<"$pr_after")" = main
          test "$(jq -r .head.ref <<<"$pr_after")" = "$branch"
          test "$(jq -r .head.sha <<<"$pr_after")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.repo.full_name // empty' <<<"$pr_after")" = "$REPOSITORY"
