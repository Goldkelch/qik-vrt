name: Autonomous issue processing

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to process
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  models: read

concurrency:
  group: issue-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Issue events do not provide a pull-request head.  Bind processing
          # to the Authority's current main commit explicitly instead of an
          # ambient event SHA.
          ref: main
          fetch-depth: 0

      - name: Bind the exact Authority source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          source_ref="refs/heads/main"
          source_head="$(git rev-parse --verify HEAD^{commit})"
          source_tree="$(git rev-parse --verify HEAD^{tree})"
          remote_head="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$source_head" = "$remote_head"
          {
            echo "ref=$source_ref"
            echo "head=$source_head"
            echo "tree=$source_tree"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="$EVENT_ISSUE_NUMBER"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then number="$INPUT_ISSUE_NUMBER"; fi
          test -n "$number"
          gh api "repos/$REPOSITORY/issues/$number" > issue.json
          jq -e '.pull_request | not' issue.json >/dev/null
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Materialize request and repository context
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/materialize.py \
            --issue issue.json \
            --repository "$REPOSITORY" \
            --output-dir "evidence/issues/$ISSUE_NUMBER"

      - name: Generate repository-grounded answer
        id: inference
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/infer.py \
            --issue issue.json \
            --context "evidence/issues/$ISSUE_NUMBER/CONTEXT.md" \
            --output "evidence/issues/$ISSUE_NUMBER/ANSWER.md" \
            --model "openai/gpt-4.1"

      - name: Enforce truthful status
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          INFERENCE_OUTCOME: ${{ steps.inference.outcome }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/finalize.py \
            --directory "evidence/issues/$ISSUE_NUMBER" \
            --inference-outcome "$INFERENCE_OUTCOME"

      - name: Materialize the non-expiring logical continuation
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/continuation.py materialize \
            --directory "evidence/issues/$ISSUE_NUMBER" \
            --issue issue.json \
            --repository "$REPOSITORY" \
            --source-ref "${{ steps.source.outputs.ref }}" \
            --source-head "${{ steps.source.outputs.head }}" \
            --source-tree "${{ steps.source.outputs.tree }}"

      - name: Validate and promote generated artifacts
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/issue_agent -p 'test_*.py'
          python3 scripts/issue_agent/validate.py "evidence/issues/$ISSUE_NUMBER"
          python3 scripts/issue_agent/promote.py "evidence/issues/$ISSUE_NUMBER"
          python3 scripts/issue_agent/validate.py "evidence/issues/$ISSUE_NUMBER"

      - name: Create or update issue work branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          branch="issue-agent/$ISSUE_NUMBER"
          continuation_path="evidence/issues/$ISSUE_NUMBER/CONTINUATION.json"
          context_path="evidence/issues/$ISSUE_NUMBER/CONTEXT.md"
          answer_path="evidence/issues/$ISSUE_NUMBER/ANSWER.md"
          current_continuation_id="$(jq -r '.continuation_id' "$continuation_path")"
          current_context_sha256="$(sha256sum "$context_path" | awk '{print $1}')"
          current_answer_sha256="$(sha256sum "$answer_path" | awk '{print $1}')"
          # The issue branch is a materialized work product.  Compare its
          # exact continuation identity before selecting branch lineage: a
          # byte refresh of an observation must neither push nor create another
          # repository status comment.
          if prior_branch_head="$(gh api "repos/${{ github.repository }}/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null)" \
            && prior_continuation="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${{ github.repository }}/contents/$continuation_path?ref=$prior_branch_head" 2>/dev/null)" \
            && prior_context_sha256="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${{ github.repository }}/contents/$context_path?ref=$prior_branch_head" 2>/dev/null | sha256sum | awk '{print $1}')" \
            && prior_answer_sha256="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${{ github.repository }}/contents/$answer_path?ref=$prior_branch_head" 2>/dev/null | sha256sum | awk '{print $1}')"; then
            prior_continuation_id="$(printf '%s' "$prior_continuation" | jq -r '.continuation_id // empty')"
            if [ -n "$prior_continuation_id" ] \
              && [ "$prior_continuation_id" = "$current_continuation_id" ] \
              && [ "$prior_context_sha256" = "$current_context_sha256" ] \
              && [ "$prior_answer_sha256" = "$current_answer_sha256" ]; then
              echo "NOOP: identical exact continuation; no branch update or repository status comment is emitted."
              exit 0
            fi
          fi
          git config user.name "qik-vrt-issue-agent[bot]"
          git config user.email "qik-vrt-issue-agent[bot]@users.noreply.github.com"
          # Preserve an existing issue branch as an ancestor rather than
          # rewriting it.  That keeps predecessor evidence available while
          # the new exact continuation binds the successor to current main.
          artifact_snapshot="$(mktemp -d)"
          mkdir -p "$artifact_snapshot/evidence/issues"
          cp -a "evidence/issues/$ISSUE_NUMBER" "$artifact_snapshot/evidence/issues/$ISSUE_NUMBER"
          rm -rf "evidence/issues/$ISSUE_NUMBER"
          remote_branch_ref="refs/remotes/origin/$branch"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:$remote_branch_ref"
            prior_branch_commit="$(git rev-parse --verify "$remote_branch_ref^{commit}")"
            git checkout -B "$branch" "$remote_branch_ref"
            git merge --no-ff --no-edit "${{ steps.source.outputs.head }}"
          else
            prior_branch_commit=""
            git checkout -B "$branch" "${{ steps.source.outputs.head }}"
          fi
          mkdir -p "evidence/issues"
          cp -a "$artifact_snapshot/evidence/issues/$ISSUE_NUMBER" "evidence/issues/$ISSUE_NUMBER"
          rm -rf "$artifact_snapshot"
          # Observation-only timestamps are intentionally not part of the
          # branch work product.  They cannot manufacture a fresh retry,
          # comment, or continuation binding.
          git add \
            "evidence/issues/$ISSUE_NUMBER/REQUEST.json" \
            "evidence/issues/$ISSUE_NUMBER/REQUEST.sha256" \
            "evidence/issues/$ISSUE_NUMBER/CONTEXT.md" \
            "evidence/issues/$ISSUE_NUMBER/ANSWER.md" \
            "evidence/issues/$ISSUE_NUMBER/STATUS.json" \
            "evidence/issues/$ISSUE_NUMBER/CONTINUATION.json"
          changed=false
          if ! git diff --cached --quiet; then
            git commit -m "issue-agent: process issue #$ISSUE_NUMBER"
            changed=true
          fi
          if [ -z "$prior_branch_commit" ] || [ "$(git rev-parse --verify HEAD^{commit})" != "$prior_branch_commit" ]; then
            git push origin "$branch"
            changed=true
          fi

          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Issue agent: process #$ISSUE_NUMBER" \
              --body "Repository-native processing artifacts for #$ISSUE_NUMBER.\n\nThe resumable auto-finish workflow may merge this PR only after EFFECT_ACK_DONE and successful repository checks. It then synchronizes the mirror, creates the common tag, and closes the issue."
          fi

          pr_url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')"
          status="$(jq -r '.status' "evidence/issues/$ISSUE_NUMBER/STATUS.json")"
          if [ "$changed" = true ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Repository processing status: **$status**\n\nWork product: $pr_url\n\nThe exact semantic continuation is now persisted on the issue work branch. Identical observation refreshes do not create another status comment or retry."
          else
            echo "NOOP: identical issue continuation; no repository status comment is emitted."
          fi
