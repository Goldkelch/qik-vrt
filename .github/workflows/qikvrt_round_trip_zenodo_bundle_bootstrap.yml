name: QIKVRT Round Trip Zenodo bundle bootstrap
on:
  push:
    branches: [publication/round-trip-zenodo-upload-bundle-freeze-v1]
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: qikvrt-round-trip-zenodo-bundle-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify current-main-bound bootstrap ancestry
        run: |
          BASE=12842e8df99553260774d53517522b2b5539c8a8
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
      - name: Reconstruct exact candidate overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .qikvrt/materialize/round-trip-zenodo-bundle/part-{00..07}.b64 | base64 --decode > /tmp/qikvrt-round-trip-bundle.tar.xz
          echo "13ab053988c57e45533119450f28115a734c4c3f3e74b33134848524c9290065  /tmp/qikvrt-round-trip-bundle.tar.xz" | sha256sum -c -
          tar -xJf /tmp/qikvrt-round-trip-bundle.tar.xz -C .
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.'); release=root/'release/round-trip-canonical-publication-zenodo-v1'
          def dump(p,v): p.write_text(json.dumps(v,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          def ident(p):
              d=p.read_bytes(); return {'bytes':len(d),'sha256':hashlib.sha256(d).hexdigest(),'git_blob_sha1':hashlib.sha1(b'blob '+str(len(d)).encode()+bytes([0])+d).hexdigest()}
          def apply_ident(d,i):
              for k in ('bytes','sha256','git_blob_sha1'):
                  if k in d: d[k]=i[k]
          mp=release/'MACHINE_PROOF_BUNDLE.json'; m=json.loads(mp.read_text())
          canonical_claim_matrix='release/round-trip-canonical-publication-zenodo-v1/CLAIM_MATRIX.json'
          promoted_rel='release/round-trip-canonical-publication-zenodo-v1/PROMOTED_FORMAL_KERNEL_RECEIPTS.json'
          for artifact in m['artifacts']:
              if artifact.get('kind')=='CLAIM_MATRIX' and artifact.get('path')!=canonical_claim_matrix:
                  artifact['kind']='EVIDENCE'
          promoted_path=root/promoted_rel
          promoted=json.loads(promoted_path.read_text())
          if promoted.get('schema')!='qikvrt_promoted_formal_kernel_receipt_bindings_v1': raise SystemExit('unexpected promoted receipt aggregate schema')
          if promoted.get('exact_head')!='d43175421f3a5b33dc18bf36686d61c8c00b396b': raise SystemExit('promoted receipt aggregate exact head differs')
          if promoted.get('exact_tree')!='9e606990a00bb09b423d8d13d1b1f16be24d92d8': raise SystemExit('promoted receipt aggregate exact tree differs')
          receipts=promoted.get('receipts')
          if not isinstance(receipts,list) or len(receipts)!=6: raise SystemExit('promoted receipt aggregate must bind six receipts')
          expected_runs={31198329827,31198328765,31198328608,31198330222,31198330259,31198331122}
          if {x.get('workflow_run_id') for x in receipts}!=expected_runs: raise SystemExit('promoted receipt workflow set differs')
          theorems=[]
          for receipt in receipts:
              ts=receipt.get('theorems')
              if not isinstance(ts,list) or len(ts)!=receipt.get('theorem_count'): raise SystemExit('promoted receipt theorem inventory differs')
              theorems.extend(ts)
          if len(theorems)!=99 or len(set(theorems))!=99: raise SystemExit('promoted theorem union must contain exactly 99 unique theorems')
          source_publication_id=promoted.pop('publication_id',None)
          if source_publication_id!='qikvrt-round-trip-retrospective-proof-v1': raise SystemExit('unexpected promoted receipt source publication id')
          promoted['source_publication_id']=source_publication_id
          promoted['scope_id']=m['publication_id']
          promoted['state']='KERNEL_VERIFIED'
          promoted['workflow']={'conclusion':'success','exact_head_bound':True,'exact_head':promoted['exact_head'],'exact_tree':promoted['exact_tree'],'run_ids':sorted(expected_runs)}
          promoted['theorems']=theorems
          dump(promoted_path,promoted); pi=ident(promoted_path)
          old_promoted={}
          for artifact in m['artifacts']:
              if artifact.get('path')==promoted_rel:
                  old_promoted={'sha256':artifact['sha256'],'git_blob_sha1':artifact['git_blob_sha1']}
                  apply_ident(artifact,pi)
          if not old_promoted: raise SystemExit('promoted receipt aggregate is not bound as a machine-proof artifact')
          m['candidate']['files'][0]['bytes']=18120; m['candidate']['files'][1]['bytes']=5150; dump(mp,m); mi=ident(mp)
          rp=release/'BUNDLE_FREEZE_RECEIPT.json'; r=json.loads(rp.read_text()); r['primary_files'][0]['bytes']=18120; r['primary_files'][1]['bytes']=5150
          for e in r['upload_fileset']['entries']:
              if e['path']==m['candidate']['files'][0]['path']: e['bytes']=18120
              if e['path']==m['candidate']['files'][1]['path']: e['bytes']=5150
              if e['path']==promoted_rel: apply_ident(e,pi)
              if e['path']=='release/round-trip-canonical-publication-zenodo-v1/MACHINE_PROOF_BUNDLE.json': apply_ident(e,mi)
          r['machine_proof_bundle'].update(mi)
          material=[{'name':e['name'],'path':e['path'],'sha256':e['sha256'],'git_blob_sha1':e['git_blob_sha1']} for e in r['upload_fileset']['entries']]
          r['upload_fileset']['aggregate_sha256']=hashlib.sha256(json.dumps(material,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest(); dump(rp,r); ri=ident(rp)
          wp=root/'state/work_units/ROUND_TRIP_ZENODO_BUNDLE_FREEZE_V1.json'; w=json.loads(wp.read_text()); w['primary_files'][0]['bytes']=18120; w['primary_files'][1]['bytes']=5150
          repl={'ebd3afa345b819771d0d577f5dda68ad9bfa6414d2ea7613eb9573d25cc14077':mi['sha256'],'69e7a7d80c32adb0d211a0363871203067350253e47357da4b49449b07e94989':ri['sha256'],'5316e740648f87b5903b994f4e77a1c22127cb12245801382852a8bf69b85352':r['upload_fileset']['aggregate_sha256'],old_promoted['sha256']:pi['sha256'],old_promoted['git_blob_sha1']:pi['git_blob_sha1']}
          def rep(v):
              if isinstance(v,dict):
                  out={k:rep(x) for k,x in v.items()}
                  if out.get('path')==promoted_rel: apply_ident(out,pi)
                  return out
              if isinstance(v,list): return [rep(x) for x in v]
              return repl.get(v,v)
          dump(wp,rep(w))
          PY
          git cat-file blob e1ed265239aa5e1436055279069c7e21525a13fe > docs/publications/2026-08-07-universum-als-round-trip/DAS_UNIVERSUM_ALS_ROUND_TRIP_DE.md
          git cat-file blob cc13b5530051ea7b7fe0eceae5558cd93f44611d > docs/publications/2026-08-07-universum-als-round-trip/ROUND_TRIP_PROMOTED_FORMAL_RESULTS_V1.md
          rm -rf .qikvrt/materialize/round-trip-zenodo-bundle
          rm -f .github/workflows/qikvrt_round_trip_zenodo_bundle_bootstrap.yml
      - name: Run existing machine-proof v2 validator directly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          from tools import qikvrt_zenodo_machine_proof as proof
          release=Path('release/round-trip-canonical-publication-zenodo-v1')
          receipt=json.loads((release/'BUNDLE_FREEZE_RECEIPT.json').read_text())
          bundle=json.loads((release/'MACHINE_PROOF_BUNDLE.json').read_text())
          print('DEBUG_ARTIFACT_INVENTORY',json.dumps([{'kind':x.get('kind'),'path':x.get('path'),'bytes':x.get('bytes'),'sha256':x.get('sha256'),'git_blob_sha1':x.get('git_blob_sha1')} for x in bundle.get('artifacts',[])],sort_keys=True))
          print('DEBUG_CANDIDATE_FILES',json.dumps(bundle.get('candidate',{}).get('files',[]),sort_keys=True))
          print('DEBUG_FORMAL_CLAIM_PROOF_REFS',json.dumps([{'claim_id':x.get('claim_id'),'classification':x.get('classification'),'proof_refs':x.get('proof_refs')} for x in bundle.get('claims',[]) if x.get('classification')=='FORMAL_PROVED'],sort_keys=True))
          promoted=release/'PROMOTED_FORMAL_KERNEL_RECEIPTS.json'
          if promoted.exists():
              promoted_value=json.loads(promoted.read_text())
              print('DEBUG_PROMOTED_FORMAL_KERNEL_RECEIPTS',json.dumps(promoted_value,sort_keys=True))
          paths=[entry['path'] for entry in receipt['upload_fileset']['entries']]
          result=proof.validate_bundle(Path('.'), release/'MACHINE_PROOF_BUNDLE.json', upload_paths=paths)
          print(json.dumps(result,sort_keys=True))
          if result.get('machine_proof_complete') is not True: raise SystemExit('machine proof incomplete')
          PY
      - name: Regenerate and verify Authority-native integrity
        run: |
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
      - name: Run complete repository gate
        run: make test
      - name: Persist exact generated successor
        shell: bash
        run: |
          set -euo pipefail
          BASE=12842e8df99553260774d53517522b2b5539c8a8
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          python3 -B tools/qikvrt_integrity.py verify
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name qikvrt-bundle-freeze-bot
          git config user.email qikvrt-bundle-freeze-bot@users.noreply.github.com
          git commit -m 'Freeze exact Round Trip Zenodo upload bundle and metadata'
          git push origin "HEAD:${GITHUB_REF_NAME}"
