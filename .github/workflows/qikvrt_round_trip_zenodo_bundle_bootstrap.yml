name: QIKVRT Round Trip Zenodo bundle bootstrap

on:
  push:
    branches:
      - publication/round-trip-zenodo-upload-bundle-freeze-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qikvrt-round-trip-zenodo-bundle-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current-main-bound bootstrap ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=12842e8df99553260774d53517522b2b5539c8a8
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse HEAD^{tree})" != "e8bdc99712bf0eca1a94ece6e34b20059076d280"
          changed="$(git diff --name-only "$BASE" HEAD)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/qikvrt_round_trip_zenodo_bundle_bootstrap.yml|.qikvrt/materialize/round-trip-zenodo-bundle/*|REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt) ;;
              *) echo "unexpected bootstrap delta: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Reconstruct exact candidate overlay
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .qikvrt/materialize/round-trip-zenodo-bundle/part-00.b64 \
            .qikvrt/materialize/round-trip-zenodo-bundle/part-01.b64 \
            .qikvrt/materialize/round-trip-zenodo-bundle/part-02.b64 \
            .qikvrt/materialize/round-trip-zenodo-bundle/part-03.b64 \
            .qikvrt/materialize/round-trip-zenodo-bundle/part-04.b64 \
            .qikvrt/materialize/round-trip-zenodo-bundle/part-05.b64 \
            .qikvrt/materialize/round-trip-zenodo-bundle/part-06.b64 \
            .qikvrt/materialize/round-trip-zenodo-bundle/part-07.b64 \
            | base64 --decode > /tmp/qikvrt-round-trip-bundle.tar.xz
          echo "13ab053988c57e45533119450f28115a734c4c3f3e74b33134848524c9290065  /tmp/qikvrt-round-trip-bundle.tar.xz" | sha256sum -c -
          tar -xJf /tmp/qikvrt-round-trip-bundle.tar.xz -C .
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path('.')
          release = root / 'release/round-trip-canonical-publication-zenodo-v1'
          def dump(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
          def identity(path):
              data = path.read_bytes()
              return {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'git_blob_sha1': hashlib.sha1(b'blob ' + str(len(data)).encode() + bytes([0]) + data).hexdigest(),
              }
          machine_path = release / 'MACHINE_PROOF_BUNDLE.json'
          machine = json.loads(machine_path.read_text())
          machine['candidate']['files'][0]['bytes'] = 18120
          machine['candidate']['files'][1]['bytes'] = 5150
          dump(machine_path, machine)
          machine_identity = identity(machine_path)
          receipt_path = release / 'BUNDLE_FREEZE_RECEIPT.json'
          receipt = json.loads(receipt_path.read_text())
          receipt['primary_files'][0]['bytes'] = 18120
          receipt['primary_files'][1]['bytes'] = 5150
          for entry in receipt['upload_fileset']['entries']:
              if entry['path'] == machine['candidate']['files'][0]['path']:
                  entry['bytes'] = 18120
              if entry['path'] == machine['candidate']['files'][1]['path']:
                  entry['bytes'] = 5150
              if entry['path'] == 'release/round-trip-canonical-publication-zenodo-v1/MACHINE_PROOF_BUNDLE.json':
                  entry.update(machine_identity)
          receipt['machine_proof_bundle'].update(machine_identity)
          material = [
              {'name': e['name'], 'path': e['path'], 'sha256': e['sha256'], 'git_blob_sha1': e['git_blob_sha1']}
              for e in receipt['upload_fileset']['entries']
          ]
          receipt['upload_fileset']['aggregate_sha256'] = hashlib.sha256(
              json.dumps(material, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          dump(receipt_path, receipt)
          receipt_identity = identity(receipt_path)
          work_path = root / 'state/work_units/ROUND_TRIP_ZENODO_BUNDLE_FREEZE_V1.json'
          work = json.loads(work_path.read_text())
          work['primary_files'][0]['bytes'] = 18120
          work['primary_files'][1]['bytes'] = 5150
          replacements = {
              'ebd3afa345b819771d0d577f5dda68ad9bfa6414d2ea7613eb9573d25cc14077': machine_identity['sha256'],
              '69e7a7d80c32adb0d211a0363871203067350253e47357da4b49449b07e94989': receipt_identity['sha256'],
              '5316e740648f87b5903b994f4e77a1c22127cb12245801382852a8bf69b85352': receipt['upload_fileset']['aggregate_sha256'],
          }
          def replace(value):
              if isinstance(value, dict):
                  return {k: replace(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [replace(v) for v in value]
              return replacements.get(value, value)
          dump(work_path, replace(work))
          PY
          git cat-file blob e1ed265239aa5e1436055279069c7e21525a13fe > docs/publications/2026-08-07-universum-als-round-trip/DAS_UNIVERSUM_ALS_ROUND_TRIP_DE.md
          git cat-file blob cc13b5530051ea7b7fe0eceae5558cd93f44611d > docs/publications/2026-08-07-universum-als-round-trip/ROUND_TRIP_PROMOTED_FORMAL_RESULTS_V1.md
          rm -rf .qikvrt/materialize/round-trip-zenodo-bundle
          rm -f .github/workflows/qikvrt_round_trip_zenodo_bundle_bootstrap.yml

      - name: Verify exact candidate Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/publications/2026-08-07-universum-als-round-trip/DAS_UNIVERSUM_ALS_ROUND_TRIP_DE.md': 'e1ed265239aa5e1436055279069c7e21525a13fe',
              'docs/publications/2026-08-07-universum-als-round-trip/ROUND_TRIP_PROMOTED_FORMAL_RESULTS_V1.md': 'cc13b5530051ea7b7fe0eceae5558cd93f44611d',
              '.github/workflows/qikvrt_round_trip_zenodo_bundle_freeze.yml': '527dd8a8514452409d777a985abf68ff897088ad',
              'release/round-trip-canonical-publication-zenodo-v1/BOUNDARY_TEST_REPORT.json': '54c55521e433d7e5b49625e222143551c23b4166',
              'release/round-trip-canonical-publication-zenodo-v1/BUNDLE_FREEZE_RECEIPT.json': '534fa3cdff79ed196dbadde059ac2829cdba955b',
              'release/round-trip-canonical-publication-zenodo-v1/CLAIM_MATRIX.json': 'c1d7a078be08f40a3340243e367b27025bd8ea6d',
              'release/round-trip-canonical-publication-zenodo-v1/MACHINE_PROOF_BUNDLE.json': '1705ad678cfe88c4b1a98ea4118b42091048bb91',
              'release/round-trip-canonical-publication-zenodo-v1/PROMOTED_FORMAL_KERNEL_RECEIPTS.json': '2798420b03185cd24db01079f883129928e72579',
              'release/round-trip-canonical-publication-zenodo-v1/PROMOTED_FORMAL_SOURCE_BINDINGS.json': '77cdca617e71ce906e2d4558b099c7a1706e1652',
              'release/round-trip-canonical-publication-zenodo-v1/RETROSPECTIVE_SOURCE_CONSTITUENTS.json': 'b5a45b3c05cef25f58e3c84beb247e2b2f725f4e',
              'release/round-trip-canonical-publication-zenodo-v1/ZENODO_FILESET.md': '2801cdabb721c4cb2657f27a9420ff221020fa27',
              'release/round-trip-canonical-publication-zenodo-v1/ZENODO_LICENSE_NOTICE.md': '8de33cb66813667e40eb049996a4f539bce103c5',
              'release/round-trip-canonical-publication-zenodo-v1/ZENODO_METADATA.json': '948ea1e20b161f71ba3576645ab21f9073cfdaa6',
              'release/round-trip-canonical-publication-zenodo-v1/ZENODO_SHA256SUMS': '665809096b6c7e9d0dcaa2e72bf457f0929367bd',
              'release/round-trip-canonical-publication-zenodo-v1/ZENODO_TARGET_RECORD.json': '5c32701436b1da12acd3933bc01de3530022b291',
              'state/work_units/ROUND_TRIP_ZENODO_BUNDLE_FREEZE_V1.json': 'dccd09989a6a6375b16dcf0721f2f71edbb36ff5',
              'tests/test_round_trip_zenodo_bundle_freeze.py': '58f90f67d4d2f38aa3406cd8120f7386aaf15bff',
              'tools/qikvrt_round_trip_zenodo_bundle_freeze.py': '35d52c2d3bdeca6995741107a1087e0b47ae7276',
          }
          for path, wanted in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != wanted:
                  raise SystemExit(f'blob mismatch {path}: {actual} != {wanted}')
          print(f'exact overlay blobs verified: {len(expected)}')
          PY

      - name: Run existing Zenodo machine-proof v2 validator through bounded freeze checker
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_round_trip_zenodo_bundle_freeze.py --check --json

      - name: Regenerate and verify Authority-native integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Run complete repository gate
        shell: bash
        run: |
          set -euo pipefail
          make test

      - name: Persist exact generated successor
        shell: bash
        run: |
          set -euo pipefail
          BASE=12842e8df99553260774d53517522b2b5539c8a8
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          python3 -B tools/qikvrt_integrity.py verify
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name 'qikvrt-bundle-freeze-bot'
          git config user.email 'qikvrt-bundle-freeze-bot@users.noreply.github.com'
          git commit -m 'Freeze exact Round Trip Zenodo upload bundle and metadata'
          git push origin "HEAD:${GITHUB_REF_NAME}"
