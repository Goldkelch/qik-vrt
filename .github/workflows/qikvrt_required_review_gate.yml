name: QIKVRT required code-owner review

# The unprivileged observer receives the untrusted PR/review events. This
# publisher starts only after that observer completed, or from trusted main on
# schedule/manual recovery. It never consumes observer output or PR-head code.
on:
  workflow_run:
    workflows: ["QIKVRT code-owner review observer"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Open main-based pull-request number to reobserve"
        required: true
        type: string

# This trusted-main publisher reads live API state and posts one exact-head
# status. It never requests, submits, dismisses, impersonates, or approves a
# review.
permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  resolve-targets:
    # workflow_dispatch can select an arbitrary ref. Do not grant the
    # publisher's write-capable token to a workflow definition outside main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      prs: ${{ steps.resolve.outputs.prs }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_PR: ${{ inputs.pr || '' }}
    steps:
      - name: Resolve only main-based live pull-request selectors
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          event_name = os.environ["EVENT_NAME"]
          dispatch_pr = os.environ.get("DISPATCH_PR", "").strip()
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))

          def api(path):
              request = Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  return json.load(response)

          def pages(path):
              result = []
              separator = "&" if "?" in path else "?"
              page = 1
              while True:
                  value = api(f"{path}{separator}per_page=100&page={page}")
                  if not isinstance(value, list):
                      raise SystemExit(f"BLOCK: expected list from {path}")
                  result.extend(value)
                  if len(value) < 100:
                      return result
                  page += 1

          def number(value):
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  raise ValueError("pull-request number is unavailable")
              return value

          targets = []
          if event_name == "workflow_run":
              run = event.get("workflow_run")
              selectors = run.get("pull_requests") if isinstance(run, dict) else None
              if isinstance(selectors, list):
                  for selector in selectors:
                      if not isinstance(selector, dict):
                          continue
                      if selector.get("base", {}).get("ref") != "main":
                          continue
                      try:
                          targets.append(number(selector.get("number")))
                      except ValueError:
                          continue
              targets = sorted(set(targets))
              # A workflow_run may have zero/multiple PRs. It is only an
              # untrusted selector, so publish nothing unless exactly one is
              # bound; the publish job re-fetches the live PR below.
              if len(targets) != 1:
                  targets = []
          elif event_name == "workflow_dispatch":
              try:
                  targets = [number(int(dispatch_pr))]
              except (TypeError, ValueError):
                  raise SystemExit("BLOCK: workflow_dispatch requires a positive PR number")
          elif event_name == "schedule":
              targets = sorted(
                  number(pr["number"])
                  for pr in pages(f"/repos/{repository}/pulls?state=open&base=main")
                  if pr.get("state") == "open" and pr.get("base", {}).get("ref") == "main"
              )
          else:
              raise SystemExit(f"BLOCK: unsupported trusted trigger {event_name!r}")

          value = json.dumps(targets, separators=(",", ":"))
          print(f"resolved_prs={value}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"prs={value}\n")
          PY

  publish-exact-head-status:
    needs: resolve-targets
    if: needs.resolve-targets.outputs.prs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.resolve-targets.outputs.prs) }}
    concurrency:
      group: qikvrt-required-review-gate-${{ github.repository }}-${{ matrix.pr }}
      cancel-in-progress: true
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ matrix.pr }}
      REQUIRED_CODE_OWNER: Goldkelch
      STATUS_CONTEXT: QIKVRT required code-owner review
    steps:
      - name: Check out trusted main gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Observe current main-based pull request, rules, and reviews
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          number = int(os.environ["PR_NUMBER"])

          def api(path):
              request = Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  return json.load(response)

          def pages(path):
              result = []
              separator = "&" if "?" in path else "?"
              page = 1
              while True:
                  value = api(f"{path}{separator}per_page=100&page={page}")
                  if not isinstance(value, list):
                      raise SystemExit(f"BLOCK: expected list from {path}")
                  result.extend(value)
                  if len(value) < 100:
                      return result
                  page += 1

          pr = api(f"/repos/{repository}/pulls/{number}")
          if pr.get("state") != "open" or pr.get("base", {}).get("ref") != "main":
              raise SystemExit("BLOCK: target must be an open main-based pull request")
          rules = api(f"/repos/{repository}/rules/branches/main")
          reviews = pages(f"/repos/{repository}/pulls/{number}/reviews")
          destination = Path(os.environ["RUNNER_TEMP"])
          (destination / "qikvrt-review-gate-pr.json").write_text(
              json.dumps(pr, sort_keys=True) + "\n", encoding="utf-8"
          )
          (destination / "qikvrt-review-gate-rules.json").write_text(
              json.dumps(rules, sort_keys=True) + "\n", encoding="utf-8"
          )
          (destination / "qikvrt-review-gate-reviews.json").write_text(
              json.dumps(reviews, sort_keys=True) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"head_sha={pr['head']['sha']}\n")
          PY

      - name: Evaluate observed review prerequisite without review mutation
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -B tools/qikvrt_required_review_gate.py evaluate \
            --pr "$RUNNER_TEMP/qikvrt-review-gate-pr.json" \
            --rules "$RUNNER_TEMP/qikvrt-review-gate-rules.json" \
            --reviews "$RUNNER_TEMP/qikvrt-review-gate-reviews.json" \
            --required-code-owner "$REQUIRED_CODE_OWNER" \
            > "$RUNNER_TEMP/qikvrt-review-gate-decision.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/qikvrt-review-gate-decision.json"
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          value = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "qikvrt-review-gate-decision.json"), encoding="utf-8"))
          print(f"gate_state={value['gate_state']}")
          print(f"blocker={value.get('first_blocker') or ''}")
          PY
          exit 0

      - name: Reobserve and publish an exact-head status
        id: publish
        shell: bash
        env:
          OBSERVED_HEAD: ${{ steps.observe.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          from tools.qikvrt_required_review_gate import evaluate_required_review

          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_number = int(os.environ["PR_NUMBER"])
          observed_head = os.environ["OBSERVED_HEAD"]
          required_code_owner = os.environ["REQUIRED_CODE_OWNER"]
          status_context = os.environ["STATUS_CONTEXT"]

          def request_json(path, *, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              request = Request(
                  f"https://api.github.com{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  return json.load(response)

          def pages(path):
              result = []
              separator = "&" if "?" in path else "?"
              page = 1
              while True:
                  value = request_json(f"{path}{separator}per_page=100&page={page}")
                  if not isinstance(value, list):
                      raise SystemExit(f"BLOCK: expected list from {path}")
                  result.extend(value)
                  if len(value) < 100:
                      return result
                  page += 1

          pr = request_json(f"/repos/{repository}/pulls/{pr_number}")
          if pr.get("state") != "open" or pr.get("base", {}).get("ref") != "main":
              raise SystemExit("BLOCK: target must remain an open main-based pull request")
          head = pr["head"]["sha"]
          if head != observed_head:
              print("HEAD_DRIFT_NO_STATUS")
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write("gate_state=failure\n")
                  output.write("blocker=HEAD_DRIFT\n")
              raise SystemExit(2)
          rules = request_json(f"/repos/{repository}/rules/branches/main")
          reviews = pages(f"/repos/{repository}/pulls/{pr_number}/reviews")
          decision = evaluate_required_review(
              pr,
              rules,
              reviews,
              required_code_owner=required_code_owner,
          )
          gate_state = decision["gate_state"]
          description = f"{gate_state}: {decision.get('first_blocker') or 'CODE_OWNER_REVIEW_CURRENT'}"[:140]
          request_json(
              f"/repos/{repository}/statuses/{head}",
              method="POST",
              body={
                  "state": gate_state,
                  "context": status_context,
                  "description": description,
                  "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              },
          )
          print(json.dumps(decision, sort_keys=True))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"gate_state={gate_state}\n")
              output.write(f"blocker={decision.get('first_blocker') or ''}\n")
          if gate_state != "success":
              raise SystemExit(2)
          PY

      - name: Enforce the observed result
        if: always()
        shell: bash
        run: |
          test "${{ steps.publish.outputs.gate_state }}" = "success"
