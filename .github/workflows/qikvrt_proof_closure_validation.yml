name: QIKVRT Proof Closure validation

on:
  push:
    branches: [publication/proof-closure-20260924-v1]
    paths:
      - "docs/publications/2026-09-24-proof-closure/**"
      - "formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/ProofClosure.lean"
      - "tools/qikvrt_proof_closure.py"
      - "tests/fixtures/proof_closure/**"
      - "tests/test_qikvrt_proof_closure.py"
      - "external/ietf/draft-lohmann-qikvrt-proof-closure-00.xml"
      - ".github/workflows/qikvrt_proof_closure_validation.yml"
  pull_request:
    paths:
      - "docs/publications/2026-09-24-proof-closure/**"
      - "formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/ProofClosure.lean"
      - "tools/qikvrt_proof_closure.py"
      - "tests/fixtures/proof_closure/**"
      - "tests/test_qikvrt_proof_closure.py"
      - "external/ietf/draft-lohmann-qikvrt-proof-closure-00.xml"
      - ".github/workflows/qikvrt_proof_closure_validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify executable Proof Closure positive and negative vectors
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_qikvrt_proof_closure -v
          python3 -B tools/qikvrt_proof_closure.py tests/fixtures/proof_closure/pass.json --output /tmp/proof-closure-pass.json
          if python3 -B tools/qikvrt_proof_closure.py tests/fixtures/proof_closure/fail_open_obligation.json; then exit 1; fi
          if python3 -B tools/qikvrt_proof_closure.py tests/fixtures/proof_closure/fail_subject_mutation.json; then exit 1; fi
          if python3 -B tools/qikvrt_proof_closure.py tests/fixtures/proof_closure/fail_predecessor_transfer.json; then exit 1; fi

      - name: Restore Lean runtime cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.elan
            formalization/QIKVRT_Formalization_v2.0/.lake/packages
          key: proof-closure-lean-${{ runner.os }}-${{ hashFiles('formalization/QIKVRT_Formalization_v2.0/lean-toolchain', 'formalization/QIKVRT_Formalization_v2.0/lakefile.toml', 'formalization/QIKVRT_Formalization_v2.0/lake-manifest.json') }}

      - name: Provision declared Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization/QIKVRT_Formalization_v2.0
          test: false

      - name: Kernel-check Proof Closure model with no sorry
        working-directory: formalization/QIKVRT_Formalization_v2.0
        run: |
          set -euo pipefail
          lake env lean -E hasSorry QIKVRTFormalization/ProofClosure.lean 2>&1 | tee /tmp/proof-closure-lean.log

      - name: Install locked xml2rfc runtime
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r runtime/toolchains/requirements-xml2rfc-3.34.0.txt

      - name: Render IETF candidate offline and twice
        run: |
          set -euo pipefail
          xml=external/ietf/draft-lohmann-qikvrt-proof-closure-00.xml
          mkdir -p /tmp/ietf-a /tmp/ietf-b
          xml2rfc "$xml" --v3 --text --no-network --skip-config-files --out /tmp/ietf-a/draft.txt
          xml2rfc "$xml" --v3 --html --no-network --skip-config-files --out /tmp/ietf-a/draft.html
          xml2rfc "$xml" --v3 --text --no-network --skip-config-files --out /tmp/ietf-b/draft.txt
          xml2rfc "$xml" --v3 --html --no-network --skip-config-files --out /tmp/ietf-b/draft.html
          cmp /tmp/ietf-a/draft.txt /tmp/ietf-b/draft.txt
          cmp /tmp/ietf-a/draft.html /tmp/ietf-b/draft.html
          grep -Fq "Security Considerations" /tmp/ietf-a/draft.txt
          grep -Fq "IANA Considerations" /tmp/ietf-a/draft.txt
          cp /tmp/ietf-a/draft.txt /tmp/draft-lohmann-qikvrt-proof-closure-00.txt
          cp /tmp/ietf-a/draft.html /tmp/draft-lohmann-qikvrt-proof-closure-00.html

      - name: Build validation receipt
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths = [
            Path("docs/publications/2026-09-24-proof-closure/PROOF_CLOSURE_DE.md"),
            Path("docs/publications/2026-09-24-proof-closure/PROOF_CLOSURE_EN.md"),
            Path("docs/publications/2026-09-24-proof-closure/PROOF_CLOSURE_CONTRACT.json"),
            Path("docs/publications/2026-09-24-proof-closure/CLAIM_MATRIX.json"),
            Path("formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/ProofClosure.lean"),
            Path("external/ietf/draft-lohmann-qikvrt-proof-closure-00.xml"),
          ]
          receipt = {
            "schema":"qikvrt_proof_closure_validation_receipt_v1",
            "head_sha":os.environ["GITHUB_SHA"],
            "python_vectors":"PASS",
            "lean_kernel":"PASS",
            "ietf_xml2rfc_repeat_render":"PASS_BYTE_IDENTICAL",
            "files":[
              {"path":str(p),"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in paths
            ],
            "effect_ack_done":False,
            "external_effect":"NONE",
          }
          Path("/tmp/proof-closure-validation.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-proof-closure-validation
          path: |
            /tmp/proof-closure-validation.json
            /tmp/proof-closure-pass.json
            /tmp/proof-closure-lean.log
            /tmp/draft-lohmann-qikvrt-proof-closure-00.txt
            /tmp/draft-lohmann-qikvrt-proof-closure-00.html
          if-no-files-found: error
          retention-days: 90
