name: Meta-Transistor integrity successor

on:
  push:
    branches:
      - feat/meta-transistor-rtl-evidence-v1
    paths:
      - 'next/hardware/meta_transistor/**'
      - '.github/workflows/meta-transistor-rtl.yml'
      - '.github/workflows/meta-transistor-integrity-successor.yml'

permissions:
  contents: write

jobs:
  regenerate-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meta-transistor-rtl-evidence-v1
      - name: Regenerate deterministic repository integrity metadata
        run: python3 tools/qikvrt_integrity.py generate
      - name: Persist successor if metadata changed
        run: |
          if git diff --quiet -- REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt; then
            echo "Integrity metadata already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git commit -m "chore(integrity): bind meta-transistor RTL successor"
          git push origin HEAD:feat/meta-transistor-rtl-evidence-v1
