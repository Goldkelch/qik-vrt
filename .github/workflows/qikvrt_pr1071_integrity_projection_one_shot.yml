name: QIKVRT PR1071 exact integrity projection one-shot

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/qikvrt_pr1071_integrity_projection_one_shot.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-pr1071-exact-integrity-projection-one-shot
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      github.event.pull_request.number == 1071 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/autonomy-root-cause-self-clean-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: 3dec71ba612faf9cb05e1221366d0e9a33cdcc7c
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
      CARRIER: .github/workflows/qikvrt_pr1071_integrity_projection_one_shot.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bind exact one-shot carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$CANDIDATE_HEAD"
          test "$(git rev-parse --verify HEAD^1)" = "$EXPECTED_PARENT"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_head" = "$CANDIDATE_HEAD"
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          test "$changed" = "$CARRIER"

      - name: Generate and verify carrier-free deterministic projection
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "$CARRIER"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "$CARRIER" \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Persist only carrier removal and deterministic integrity projection
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_head" = "$CANDIDATE_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$CARRIER" REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          staged="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            "$CARRIER" \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt | LC_ALL=C sort)"
          test "$staged" = "$expected"
          git commit -m "fix(integrity): materialize exact PR1071 projection"
          new_head="$(git rev-parse --verify HEAD^{commit})"
          remote_before_push="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_before_push" = "$CANDIDATE_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          remote_after_push="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_after_push" = "$new_head"
          printf 'materialized_head=%s\n' "$new_head"
