name: QIKVRT PR1071 exact integrity projection one-shot

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/qikvrt_pr1071_integrity_projection_one_shot.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-pr1071-exact-integrity-projection-one-shot
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      github.event.pull_request.number == 1071 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/autonomy-root-cause-self-clean-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: 3bc42b43f0f7fce621aef844ef0c649b89cd16be
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
      CARRIER: .github/workflows/qikvrt_pr1071_integrity_projection_one_shot.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 2
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bind exact one-shot carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$CANDIDATE_HEAD"
          test "$(git rev-parse --verify HEAD^1)" = "$EXPECTED_PARENT"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_head" = "$CANDIDATE_HEAD"
          test "$(git diff --name-only "$EXPECTED_PARENT" HEAD)" = "$CARRIER"

      - name: Repair exact requested-review selector and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "$CARRIER"
          python3 -B - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/qikvrt_requested_review_executor.yml')
          text=path.read_text(encoding='utf-8')
          old="""          selector_kwargs={
              'repository':repo,
              'event_pr':event_pr,
              'event_name':event_name,
              'expected_head':expected_head,
              'workflow_event':workflow_event,
              'workflow_prs':workflow_prs,
              'fetch_pull_request':one,
          }
          selector_parameters=inspect.signature(select_review_subject).parameters
          if 'requested_pr' in selector_parameters:
              selector_kwargs['requested_pr']=''
          if 'event_payload' in selector_parameters:
              selector_kwargs['event_payload']=payload
          value=select_review_subject(**selector_kwargs)
"""
          new="""          selector_parameters=inspect.signature(select_review_subject).parameters
          common_selector_kwargs={
              'repository':repo,
              'event_pr':event_pr,
              'event_name':event_name,
              'expected_head':expected_head,
              'workflow_event':workflow_event,
              'workflow_prs':workflow_prs,
              'fetch_pull_request':one,
          }
          if 'event_payload' in selector_parameters:
              value=select_review_subject(
                  **common_selector_kwargs,
                  requested_pr='',
                  event_payload=payload,
              )
          elif 'requested_pr' in selector_parameters:
              value=select_review_subject(
                  **common_selector_kwargs,
                  requested_pr='',
              )
          else:
              raise RuntimeError('SELECT_REVIEW_SUBJECT_SIGNATURE_UNSUPPORTED')
"""
          if text.count(old) != 1:
              raise SystemExit('BLOCK: exact requested-review selector source drifted')
          path.write_text(text.replace(old,new),encoding='utf-8',newline='\n')
          PY
          grep -F 'event_payload=payload' .github/workflows/qikvrt_requested_review_executor.yml

      - name: Generate exact projection and verify full candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest -v tests.test_qikvrt_requested_review_executor.RequestedReviewExecutorTests.test_workflow_is_trusted_main_diff_bound_append_only_and_comment_only
          make test
          python3 -B tools/qikvrt_integrity.py verify
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$CARRIER" .github/workflows/qikvrt_requested_review_executor.yml REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Persist exact repaired subject
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_head" = "$CANDIDATE_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$CARRIER" .github/workflows/qikvrt_requested_review_executor.yml REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          staged="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' "$CARRIER" .github/workflows/qikvrt_requested_review_executor.yml REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt | LC_ALL=C sort)"
          test "$staged" = "$expected"
          git commit -m 'fix(review): pass exact event payload to selector'
          new_head="$(git rev-parse --verify HEAD^{commit})"
          remote_before_push="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_before_push" = "$CANDIDATE_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          remote_after_push="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_after_push" = "$new_head"
          printf 'repaired_head=%s\n' "$new_head"
