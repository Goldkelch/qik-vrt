name: QIK-VRT one-shot autonomous continuation capability materialization

on:
  push:
    branches:
      - "agent/autonomous-publication-pr-continuation-v1"
    paths:
      - ".github/workflows/qikvrt_autonomy_v3_materialize_once.yml"

permissions:
  contents: read

concurrency:
  group: qikvrt-autonomy-v3-materialize-${{ github.repository }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact capability precursor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "agent/autonomous-publication-pr-continuation-v1"
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact bounded carrier history
        shell: bash
        run: |
          set -euo pipefail
          base="0b2360fa0c66c86e6ee6e71798adcdaf3ac2fac5"
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/qikvrt_autonomy_v3_materialize_once.yml' \
            '.qikvrt/autonomy/autonomous-pr-continuation-v1.part00' \
            '.qikvrt/autonomy/autonomous-pr-continuation-v1.part01' \
            '.qikvrt/autonomy/autonomous-pr-continuation-v1.part02' \
            '.qikvrt/autonomy/autonomous-pr-continuation-v1.part03' \
            '.qikvrt/autonomy/autonomous-pr-continuation-v1.part04' | sort)"
          test "$actual" = "$expected"
          echo "0cac0e05f46e267429c749696b0fc35f17bf106dc84a50a820689cceb3eb6530  .qikvrt/autonomy/autonomous-pr-continuation-v1.part00" | sha256sum --check --strict
          echo "b76203ca569a1ba89858bee631ca074c607b554b71199e1414e6ed04086339d9  .qikvrt/autonomy/autonomous-pr-continuation-v1.part01" | sha256sum --check --strict
          echo "ab38d2c1edaac14d3dc8d71407b1931f8e1e0ea45aa4625bd512ca2420e8400a  .qikvrt/autonomy/autonomous-pr-continuation-v1.part02" | sha256sum --check --strict
          echo "d71c39484f56643aa883f9f21fe437874626bb7da38f73dc3347baff386457e1  .qikvrt/autonomy/autonomous-pr-continuation-v1.part03" | sha256sum --check --strict
          echo "97c1bdf13e7213f1d032a67fc735ab73ca618320e753c788c975c0731905d0da  .qikvrt/autonomy/autonomous-pr-continuation-v1.part04" | sha256sum --check --strict
          cat .qikvrt/autonomy/autonomous-pr-continuation-v1.part0{0,1,2,3,4} > /tmp/autonomous-pr-continuation-v1.tar.gz.b64
          echo "14471beaea95987085a931719db78931f4a1713d67de4397c39f1e53a77142ca  /tmp/autonomous-pr-continuation-v1.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/autonomous-pr-continuation-v1.tar.gz.b64 > /tmp/autonomous-pr-continuation-v1.tar.gz
          echo "a2ca45ecd09983e336b8dedb8a609630487abfec269deca5ccbc38cfbad9ef84  /tmp/autonomous-pr-continuation-v1.tar.gz" | sha256sum --check --strict

      - name: Validate and extract exact capability payload
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import tarfile
          expected = {
              '.github/workflows/qikvrt_autonomous_exact_head_verify.yml',
              '.github/workflows/qikvrt_autonomous_pr_continuation.yml',
              '.github/workflows/qikvrt_autonomous_self_heal.yml',
              'docs/operations/AUTONOMOUS_PR_CONTINUATION.md',
              'state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json',
              'tests/test_qikvrt_autonomous_pr_continuation.py',
              'tests/test_qikvrt_autonomous_self_heal.py',
              'tests/test_qikvrt_publication_overview.py',
              'tools/qikvrt_autonomous_self_heal.py',
              'tools/qikvrt_publication_overview.py',
          }
          with tarfile.open('/tmp/autonomous-pr-continuation-v1.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              assert names == expected, (sorted(names), sorted(expected))
              assert all(member.isfile() for member in members)
              assert all(not member.name.startswith('/') and '..' not in member.name.split('/') for member in members)
          PY
          tar -xzf /tmp/autonomous-pr-continuation-v1.tar.gz
          rm -- .qikvrt/autonomy/autonomous-pr-continuation-v1.part0{0,1,2,3,4}
          rmdir --ignore-fail-on-non-empty .qikvrt/autonomy .qikvrt || true
          rm -- .github/workflows/qikvrt_autonomy_v3_materialize_once.yml

      - name: Regenerate repository-native integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Run capability and full repository gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/qikvrt_autonomous_self_heal.py \
            tools/qikvrt_publication_overview.py \
            tests/test_qikvrt_autonomous_self_heal.py \
            tests/test_qikvrt_autonomous_pr_continuation.py \
            tests/test_qikvrt_publication_overview.py
          python3 -B tools/qikvrt_publication_overview.py check
          python3 -B -m unittest -v \
            tests.test_qikvrt_publication_overview \
            tests.test_qikvrt_autonomous_self_heal \
            tests.test_qikvrt_autonomous_pr_continuation
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Export exact verified final files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/autonomy-materialization
          cat > /tmp/autonomy-final-paths.txt <<'EOF'
          .github/workflows/qikvrt_autonomous_exact_head_verify.yml
          .github/workflows/qikvrt_autonomous_pr_continuation.yml
          .github/workflows/qikvrt_autonomous_self_heal.yml
          REPOSITORY_FILE_MANIFEST.json
          REPOSITORY_FILE_MANIFEST.json.sha256
          SHA256SUMS.txt
          docs/operations/AUTONOMOUS_PR_CONTINUATION.md
          state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json
          tests/test_qikvrt_autonomous_pr_continuation.py
          tests/test_qikvrt_autonomous_self_heal.py
          tests/test_qikvrt_publication_overview.py
          tools/qikvrt_autonomous_self_heal.py
          tools/qikvrt_publication_overview.py
          EOF
          while IFS= read -r path; do
            test -f "$path"
          done < /tmp/autonomy-final-paths.txt
          test ! -e .github/workflows/qikvrt_autonomy_v3_materialize_once.yml
          for part in .qikvrt/autonomy/autonomous-pr-continuation-v1.part0{0,1,2,3,4}; do
            test ! -e "$part"
          done
          tar -czf audit/autonomy-materialization/autonomy-final-delta.tar.gz \
            -T /tmp/autonomy-final-paths.txt
          sha256sum audit/autonomy-materialization/autonomy-final-delta.tar.gz \
            > audit/autonomy-materialization/autonomy-final-delta.tar.gz.sha256
          cp /tmp/autonomy-final-paths.txt \
            audit/autonomy-materialization/autonomy-final-paths.txt
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          root = pathlib.Path('audit/autonomy-materialization')
          archive = root / 'autonomy-final-delta.tar.gz'
          paths = [
              line.strip()
              for line in (root / 'autonomy-final-paths.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          ]
          assert len(paths) == 13
          value = {
              'schema': 'qikvrt_autonomy_materialization_export_v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'base_commit': '0b2360fa0c66c86e6ee6e71798adcdaf3ac2fac5',
              'carrier_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'carrier_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'paths': paths,
              'path_count': len(paths),
              'full_repository_gates': 'SUCCESS',
              'external_effect': 'NONE',
              'completion_claims': {
                  'PASS': False,
                  'FINAL_PASS': False,
                  'EFFECT_ACK_DONE': False,
              },
          }
          (root / 'MATERIALIZATION_PROVENANCE.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload exact verified materialization export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-autonomy-materialized-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
          path: audit/autonomy-materialization/**
