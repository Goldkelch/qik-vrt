name: QIKVRT PR successor persistence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: qikvrt-pr-successor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  persist:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize canonical repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          make test
          python3 tools/qikvrt_integrity.py verify
      - name: Persist exact-head successor and continue fresh validation
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          if [ "$remote_head" != "$source_head" ]; then
            echo "BLOCK: target ref advanced before persistence" >&2
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Canonical integrity already current.'
            exit 0
          fi
          git commit -m 'ci: persist PR canonical integrity successor'
          successor_head="$(git rev-parse --verify HEAD^{commit})"
          test "$successor_head" != "$source_head"
          remote_head_after="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          if [ "$remote_head_after" != "$source_head" ]; then
            echo "BLOCK: target ref advanced during persistence" >&2
            exit 2
          fi
          git push origin "HEAD:$TARGET_REF"
          observed="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$observed" != "$successor_head" ]; then
            echo "BLOCK: pushed successor not independently readable as current PR head" >&2
            exit 2
          fi
          gh workflow run qikvrt_requested_review_executor.yml --repo "$REPOSITORY" \
            -f "pr=$PR_NUMBER" -f "head=$successor_head" -f "fingerprint="
          echo "CONTINUE: persisted successor $successor_head -> fresh exact-head requested-review execution"
