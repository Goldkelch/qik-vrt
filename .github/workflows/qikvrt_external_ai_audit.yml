name: QIKVRT external AI audit conformance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  external-ai-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -B -m unittest tests.test_qikvrt_external_ai_audit -v
      - name: PASS conformance vector
        run: python3 -B tools/qikvrt_external_ai_audit.py --trace tests/fixtures/external_ai_audit/pass_trace.json --output external-ai-audit-pass.json
      - name: Negative vectors must block
        run: |
          if python3 -B tools/qikvrt_external_ai_audit.py --trace tests/fixtures/external_ai_audit/fail_silent_omission.json; then exit 1; fi
          if python3 -B tools/qikvrt_external_ai_audit.py --trace tests/fixtures/external_ai_audit/fail_unauthorized_execute.json; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: qikvrt-external-ai-audit-conformance
          path: external-ai-audit-pass.json
