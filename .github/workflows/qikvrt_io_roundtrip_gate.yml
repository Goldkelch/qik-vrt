name: QIK-VRT universal I/O evidence round-trip

on:
  pull_request:
    paths:
      - 'policy/UNIVERSAL_IO_EVIDENCE_ROUNDTRIP_V1.json'
      - 'state/io_work_units/**'
      - 'tools/qikvrt_io_roundtrip_gate.py'
      - 'tests/test_qikvrt_io_roundtrip_gate.py'
      - '.github/workflows/qikvrt_io_roundtrip_gate.yml'
  push:
    branches: [main]
    paths:
      - 'policy/UNIVERSAL_IO_EVIDENCE_ROUNDTRIP_V1.json'
      - 'state/io_work_units/**'
      - 'tools/qikvrt_io_roundtrip_gate.py'
      - 'tests/test_qikvrt_io_roundtrip_gate.py'
      - '.github/workflows/qikvrt_io_roundtrip_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  io-roundtrip-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all persisted I/O work units
        run: python3 -B tools/qikvrt_io_roundtrip_gate.py --json
      - name: Run focused regression tests
        run: python3 -m unittest -v tests.test_qikvrt_io_roundtrip_gate
