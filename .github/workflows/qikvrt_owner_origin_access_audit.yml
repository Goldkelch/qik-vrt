# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: QIKVRT owner origin access and audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - policy/OWNER_ORIGIN_ACCESS_AUDIT_AND_ENFORCEMENT_V1.json
      - tools/qikvrt_owner_origin_access_audit.py
      - tests/test_qikvrt_owner_origin_access_audit.py
      - docs/OWNER_ORIGIN_ACCESS_AUDIT_AND_ENFORCEMENT.md
      - state/work_units/PO_RECEIPT_251_OWNER_ORIGIN_ACCESS_AUDIT_V1.json
      - .github/workflows/qikvrt_owner_origin_access_audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-owner-origin-access-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify owner-origin, access and license-evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_qikvrt_owner_origin_access_audit
          python3 -B tools/qikvrt_owner_origin_access_audit.py --self-check --pretty
      - name: Preserve read-only verification boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --short --untracked-files=all)"
