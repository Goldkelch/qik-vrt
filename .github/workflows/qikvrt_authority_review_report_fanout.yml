name: QIKVRT authority review report fanout

on:
  workflow_run:
    workflows: ["QIKVRT requested review executor"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: qikvrt-authority-review-report-fanout-${{ github.repository }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  fanout:
    # A direct review event now reaches the trusted executor.  Its technical
    # COMMENT/receipt is role-local evidence only; it must not newly activate
    # a cross-repository repository_dispatch route.  Keep this legacy fanout
    # sealed until a separately authorized, brokered cross-repository delivery
    # design exists.  It is not an approval, publication, or effect adapter.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      # A direct review run executes on refs/pull/<n>/merge.  Its head_sha is
      # therefore an execution SHA, not the reviewed candidate head.  Bind the
      # candidate only through the exact evidence artifact produced by this run.
    steps:
      - name: Check out trusted Authority main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind one exact Authority review receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from tools.qikvrt_authority_review_report_fanout import (
              AuthorityReviewReportBindingError,
              source_artifact_binding,
          )

          def api(path):
              value=subprocess.check_output(
                  ["gh","api","--paginate","--slurp",path], text=True
              )
              pages=json.loads(value)
              return [item for page in pages for item in page]

          repository=os.environ["REPOSITORY"]
          source_run_id=int(os.environ["SOURCE_RUN_ID"])
          artifacts=json.loads(subprocess.check_output(
              ["gh","api",f"repos/{repository}/actions/runs/{source_run_id}/artifacts?per_page=100"],
              text=True,
          ))
          try:
              source=source_artifact_binding(artifacts=artifacts)
          except AuthorityReviewReportBindingError as exc:
              raise SystemExit(f"HOLD_UNVERIFIED: {exc}") from exc
          number=source["pr_number"]
          head=source["head_sha"]
          fingerprint=source["evidence_fingerprint"]
          pr=json.loads(subprocess.check_output(
              ["gh","api",f"repos/{repository}/pulls/{number}"],text=True
          ))
          if pr.get("head",{}).get("sha") != head:
              raise SystemExit("HOLD_UNVERIFIED: artifact-bound candidate head differs from current pull-request head")
          commit=json.loads(subprocess.check_output(
              ["gh","api",f"repos/{repository}/git/commits/{head}"],text=True
          ))
          tree=commit.get("tree",{}).get("sha")
          if not isinstance(tree,str) or len(tree) != 40:
              raise SystemExit("HOLD_UNVERIFIED: exact head tree is unavailable")
          candidates=[
              review for review in api(f"repos/{repository}/pulls/{number}/reviews?per_page=100")
              if review.get("user",{}).get("login") == "github-actions[bot]"
              and review.get("state") == "COMMENTED"
              and review.get("commit_id") == head
          ]
          marker=re.compile(
              r"\A<!-- qikvrt-mesh-review:v1 head=([0-9a-f]{40}) tree=([0-9a-f]{40}) "
              r"fingerprint=([0-9a-f]{64}) disposition=([A-Z_]+) -->"
          )
          bound=[]
          for review in candidates:
              match=marker.match(review.get("body") or "")
              if (
                  match and match.group(1) == head and match.group(2) == tree
                  and match.group(3) == fingerprint
              ):
                  bound.append((review,match))
          if len(bound) != 1:
              raise SystemExit("HOLD_UNVERIFIED: exact Authority receipt is absent or ambiguous")
          review,match=bound[0]
          payload={
              "schema":"qikvrt_authority_review_report_v1",
              "authority_repository":repository,
              "source_run_id":source_run_id,
              "pr_number":number,
              "head_sha":head,
              "tree_sha":tree,
              "evidence_fingerprint":match.group(3),
              "mesh_disposition":match.group(4),
              "authority_review_id":review.get("id"),
              "completion_claims":{
                  "PASS":False,"FINAL_PASS":False,"EFFECT_ACK_DONE":False,"MERGE":False
              },
          }
          canonical=json.dumps(payload,sort_keys=True,separators=(",",":")).encode()
          payload["dedupe_key"]=hashlib.sha256(canonical).hexdigest()
          with open("/tmp/authority-review-report.json","w",encoding="utf-8") as handle:
              json.dump(payload,handle,sort_keys=True,indent=2)
              handle.write("\n")
          PY
          cat /tmp/authority-review-report.json

      - name: Preserve sealed Authority review report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-authority-review-report-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: /tmp/authority-review-report.json
