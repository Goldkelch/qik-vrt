name: QIKVRT PR1128 Zenodo v2 draft diagnosis
on:
  push:
    branches: [diagnostic/pr1128-zenodo-v2-record-22845516]
    paths:
      - .github/workflows/qikvrt_pr1128_zenodo_v2_diagnosis.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare exact expected metadata with owned draft
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from tools import qikvrt_zenodo_actions as z
          expected=json.loads(Path('docs/publications/2026-09-19-truth-needs-no-conspiracy-theory/ZENODO_METADATA.json').read_text())
          expected_no=dict(expected); expected_no.pop('prereserve_doi',None)
          client=z.ZenodoClient(os.environ['ZENODO_ACCESS_TOKEN'], z.DEFAULT_BASE_URL, poll_attempts=1)
          state,current=client.get_deposition_or_record(22845516)
          actual=current.get('metadata')
          print('STATE='+state)
          print('EXPECTED='+json.dumps(expected_no,ensure_ascii=False,sort_keys=True))
          print('ACTUAL='+json.dumps(actual,ensure_ascii=False,sort_keys=True))
          keys=sorted(set(expected_no)|set(actual or {}))
          for key in keys:
              ev=expected_no.get(key,'<MISSING>')
              av=(actual or {}).get(key,'<MISSING>')
              if not z._metadata_matches(av,ev):
                  print('DIFF '+key+' expected='+json.dumps(ev,ensure_ascii=False,sort_keys=True)+' actual='+json.dumps(av,ensure_ascii=False,sort_keys=True))
          PY
