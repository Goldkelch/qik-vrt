name: QIKVRT PR457 historical Alpha-2 repair

on:
  push:
    branches:
      - agent/qce-measurement-independence-superdeterminism-v1
    paths:
      - .github/workflows/qikvrt_pr457_alpha2_historical_repair.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-pr457-historical-alpha2-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Persist verified non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          expected_archive_sha256="500087f6aeee41787959cfc8902852503e2182019ae4f3e88f115e94a1f5e689"

          python3 -B - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"BLOCK: expected exactly one replacement in {path}: {count}"
                  )
              path.write_text(
                  text.replace(old, new, 1),
                  encoding="utf-8",
                  newline="\n",
              )

          package = Path(
              "formalization/QIKVRT_Formalization_v2.0/scripts/package_release.py"
          )
          exclusion_anchor = (
              '    "formalization/QIKVRT_Formalization_v2.0/tests/'
              'test_quantum_classical_runtime_article.py",\n'
              '}\n'
          )
          post_alpha2_paths = (
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/Decision/ObservationSufficiency.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/Hardware/AuthorityMirrorWitness.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/Hardware/AxiomAudit.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/QuantumFoundations/AxiomAudit.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/QuantumFoundations/MeasurementIndependence.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/WorldFormula/AxiomAudit.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/WorldFormula/Relations.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTUniversalOntology.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTUniversalOntology/AxiomAudit.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTUniversalOntology/Core.lean",
              "formalization/QIKVRT_Formalization_v2.0/QIKVRTUniversalOntology/ExtendedAxiomAudit.lean",
              "formalization/QIKVRT_Formalization_v2.0/evidence/AUTHORITY_MIRROR_NVM_FINITE_MODEL_RECEIPT.json",
              "formalization/QIKVRT_Formalization_v2.0/scripts/make_universal_ontology_kernel_receipt.py",
              "formalization/QIKVRT_Formalization_v2.0/scripts/verify_authority_mirror_nvm_finite.py",
              "formalization/QIKVRT_Formalization_v2.0/scripts/verify_universal_ontology.py",
              "formalization/QIKVRT_Formalization_v2.0/tests/test_world_formula_relation_kernel.py",
              "formalization/QIKVRT_Formalization_v2.0/universal_ontology/CLAIM_MATRIX.json",
              "formalization/QIKVRT_Formalization_v2.0/universal_ontology/README.md",
              "formalization/QIKVRT_Formalization_v2.0/universal_ontology/SOURCE_SCOPE.json",
              "formalization/QIKVRT_Formalization_v2.0/universal_ontology/WORLD_FORMULA_CLAIM_MATRIX.json",
          )
          exclusion_replacement = exclusion_anchor[:-2] + "".join(
              f'    "{value}",\n' for value in post_alpha2_paths
          ) + "}\n"
          replace_once(package, exclusion_anchor, exclusion_replacement)

          package_lake_anchor = (
              '        "formalization/QIKVRT_Formalization_v2.0/'
              'QIKVRTFormalization.lean",\n'
          )
          replace_once(
              package,
              package_lake_anchor,
              '        "formalization/QIKVRT_Formalization_v2.0/lakefile.toml",\n'
              + package_lake_anchor,
          )

          freeze = Path("tools/qikvrt_freeze_alpha2_status.py")
          freeze_lake_anchor = (
              '    "formalization/QIKVRT_Formalization_v2.0/'
              'QIKVRTFormalization.lean",\n'
          )
          replace_once(
              freeze,
              freeze_lake_anchor,
              '    "formalization/QIKVRT_Formalization_v2.0/lakefile.toml",\n'
              + freeze_lake_anchor,
          )

          test = Path("tests/test_formalization_v2_release_workflow.py")
          replace_once(
              test,
              'ZERO64 = "0" * 64\n',
              'ZERO64 = "0" * 64\n'
              'ALPHA2_ARCHIVE_SHA256 = '
              '"500087f6aeee41787959cfc8902852503e2182019ae4f3e88f115e94a1f5e689"\n',
          )
          replace_once(
              test,
              '    def test_package_is_reproducible_and_has_exact_provenance(self) -> None:\n'
              '        with tempfile.TemporaryDirectory(\n',
              '    def test_package_is_reproducible_and_has_exact_provenance(self) -> None:\n'
              '        self.assertEqual(sha256(ARCHIVE), ALPHA2_ARCHIVE_SHA256)\n'
              '        with tempfile.TemporaryDirectory(\n',
          )
          PY

          python3 -B tools/qikvrt_freeze_alpha2_status.py generate
          (
            cd formalization/QIKVRT_Formalization_v2.0
            python3 scripts/materialize_completion.py
            python3 scripts/render_completion_proof_map.py
            python3 scripts/render_completion_verification_report.py
            python3 scripts/materialize_completion_proof_manifest.py
            python3 scripts/materialize_completion.py --check
            python3 scripts/render_completion_proof_map.py --check
            python3 scripts/render_completion_verification_report.py --check
            python3 scripts/materialize_completion_proof_manifest.py --check
            python3 scripts/validate_completion_claim_graph.py
          )
          python3 -B tools/qikvrt_publication_overview.py materialize --json
          python3 -B tools/qikvrt_publication_overview.py check --json
          python3 -B -m unittest -v tests.test_qikvrt_publication_overview
          python3 -B formalization/QIKVRT_Formalization_v2.0/scripts/package_release.py \
            --repository-root . \
            --output release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip \
            --zenodo-checksums release/formalization-v2/ZENODO_SHA256SUMS-alpha.2
          python3 -B tools/qikvrt_freeze_alpha2_status.py check
          actual_archive_sha256="$(sha256sum release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip | awk '{print $1}')"
          test "$actual_archive_sha256" = "$expected_archive_sha256"
          python3 -B tests/test_formalization_v2_release_workflow.py
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          make test
          python3 tools/qikvrt_integrity.py verify
          python3 -B tools/qikvrt_freeze_alpha2_status.py check
          python3 -B tools/qikvrt_publication_overview.py check --json

          remote_head="$(
            git ls-remote --heads origin "refs/heads/${GITHUB_REF_NAME}" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$source_head" ]; then
            echo "BLOCK: PR head advanced during exact-head repair" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            formalization/QIKVRT_Formalization_v2.0/scripts/package_release.py \
            tools/qikvrt_freeze_alpha2_status.py \
            tests/test_formalization_v2_release_workflow.py \
            release/formalization-v2/alpha2-frozen \
            release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip \
            release/formalization-v2/QIKVRT_Formalization_v2.0-alpha.2.zip.sha256 \
            release/formalization-v2/ZENODO_SHA256SUMS-alpha.2 \
            formalization/QIKVRT_Formalization_v2.0/claims/TEX_ENVIRONMENTS.json \
            formalization/QIKVRT_Formalization_v2.0/claims/APPENDIX_MATRIX.json \
            formalization/QIKVRT_Formalization_v2.0/claims/CLAIM_GRAPH.json \
            formalization/QIKVRT_Formalization_v2.0/MANUSCRIPT_PROOF_MAP.md \
            formalization/QIKVRT_Formalization_v2.0/VERIFICATION_REPORT.md \
            formalization/QIKVRT_Formalization_v2.0/proofs/PROOF_OBJECT_MANIFEST.json \
            docs/publications/index.json \
            docs/publications/index.html \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'BLOCK: non-workflow persistence attempted to stage a workflow file' >&2
            exit 4
          fi
          if git diff --cached --quiet; then
            echo 'BLOCK: repair produced no staged change' >&2
            exit 3
          fi
          git commit -m 'fix(ci): preserve immutable Alpha-2 release identity'

          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/${GITHUB_REF_NAME}" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo "BLOCK: PR head advanced before repair persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_after_commit=$remote_head_after_commit" >&2
            exit 2
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
