# Final, exact-branch use of the existing bootstrap writer. The output removes
# this workflow; it is not a permanent review or administration capability.
name: QIKVRT fix branch integrity materializer

on:
  push:
    branches:
      - fix/ruleset-bridge-run-name-binding-v1

permissions:
  contents: write

concurrency:
  group: qikvrt-fix-branch-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      github.actor == 'ingolf-lohmann' &&
      github.ref == 'refs/heads/fix/ruleset-bridge-run-name-binding-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact authorized cleanup subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bind predecessor and verify declared tool contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '9697d8ba1218785e5cbdcd1c1e4b80dd98c5c9c6'
          test "$(git rev-parse HEAD:tests/test_qikvrt_ruleset_effect_dispatch_bridge.py)" = '53a1c6b369eb2fbee6a802d50388634b9e0293b4'
          test "$(git rev-parse HEAD:.github/workflows/qikvrt_requested_review_contract.yml)" = '28b9f3dc49c3d17ed4b74abfb7b724d8f160256e'
          python3 -B tools/qikvrt_tool_cache.py verify

      - name: Verify the connector-persisted read-only CI wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path('tests/test_qikvrt_ruleset_effect_dispatch_bridge.py')
          source = path.read_text(encoding='utf-8')
          anchor = '\nif __name__ == "__main__":\n'
          addition = r'''

              def test_routing_regressions_are_wired_into_exact_head_contract_ci(self):
                  workflow = (ROOT / ".github/workflows/qikvrt_requested_review_contract.yml").read_text(encoding="utf-8")
                  step = workflow.split("      - name: Verify review cores and decisions\n", 1)[1].split(
                      "      - name: Verify event, recovery, identity and promotion bindings\n", 1
                  )[0]
                  command = step.split("python3 -B -m unittest -v", 1)[1]
                  self.assertIn(
                      "tests.test_qikvrt_ruleset_effect_dispatch_bridge", command,
                      "ROUTING_REGRESSION_MODULE_NOT_EXECUTED",
                  )
                  for path in (
                      ".github/workflows/qikvrt_ruleset_effect_dispatch_bridge.yml",
                      ".github/workflows/qikvrt_fix_branch_integrity_materializer.yml",
                      "tests/test_qikvrt_ruleset_effect_dispatch_bridge.py",
                  ):
                      self.assertIn('      - "' + path + '"', workflow)
                  self.assertIn('ref: $' + '{{ github.event.pull_request.head.sha || github.sha }}', workflow)
                  self.assertIn('persist-credentials: false', workflow)
          '''
          if source.count(anchor) != 1 or 'def test_routing_regressions_are_wired' in source:
              raise SystemExit('BLOCK: test insertion subject differs')
          path.write_text(source.replace(anchor, addition.rstrip() + '\n' + anchor), encoding='utf-8')
          PY
          python3 -B -m unittest -v \
            tests.test_qikvrt_ruleset_effect_dispatch_bridge.ReviewRepairScopeContractTest.test_routing_regressions_are_wired_into_exact_head_contract_ci \
            2>&1 | tee "$RUNNER_TEMP/qikvrt-cleanup-wiring.log"

      - name: Remove the parallel writer and verify the same regression
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/qikvrt_fix_branch_integrity_materializer.yml
          python3 -B -m unittest -v \
            tests.test_qikvrt_ruleset_effect_dispatch_bridge \
            tests.test_qikvrt_native_account_review \
            tests.test_qikvrt_required_review_gate \
            2>&1 | tee "$RUNNER_TEMP/qikvrt-cleanup-green.log"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          sha256sum --check --strict REPOSITORY_FILE_MANIFEST.json.sha256
          make test > "$RUNNER_TEMP/qikvrt-cleanup-make-test.log" 2>&1
          tail -n 40 "$RUNNER_TEMP/qikvrt-cleanup-make-test.log"
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check HEAD

      - name: Persist only cleanup, regression and deterministic integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/qikvrt_fix_branch_integrity_materializer.yml',
              'tests/test_qikvrt_ruleset_effect_dispatch_bridge.py',
              'REPOSITORY_FILE_MANIFEST.json',
              'REPOSITORY_FILE_MANIFEST.json.sha256',
              'SHA256SUMS.txt',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD', '--'], text=True,
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'BLOCK: cleanup path set differs: {sorted(actual)}')
          workflow_changes = [p for p in actual if p.startswith('.github/workflows/')]
          if workflow_changes != ['.github/workflows/qikvrt_fix_branch_integrity_materializer.yml']:
              raise SystemExit('BLOCK: Actions writer may only remove its temporary helper')
          # git rm already staged the deletion; do not re-add its absent path.
          staged_paths = expected - {'.github/workflows/qikvrt_fix_branch_integrity_materializer.yml'}
          subprocess.check_call(['git', 'add', '--', *sorted(staged_paths)])
          PY
          ref='refs/heads/fix/ruleset-bridge-run-name-binding-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --heads origin "$ref" | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(review): execute routing regressions in permanent exact-head CI'
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$(git ls-remote --heads origin "$ref" | awk 'NR == 1 {print $1}')" = "$GITHUB_SHA"
          git push origin "HEAD:$ref"
          observed="$(git ls-remote --heads origin "$ref" | awk 'NR == 1 {print $1}')"
          test "$observed" = "$commit"
          sha256sum --check --strict REPOSITORY_FILE_MANIFEST.json.sha256
          printf 'EXACT_CLEANUP_COMMIT=%s\nEXACT_CLEANUP_TREE=%s\n' "$commit" "$tree" \
            | tee "$RUNNER_TEMP/qikvrt-cleanup-readback.log"

      - name: Preserve finite cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-pr1051-writer-cleanup-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/qikvrt-cleanup-*.log
