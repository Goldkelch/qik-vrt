name: QIKVRT roundtrip one-shot integrity materializer

on:
  push:
    branches:
      - docs/roundtrip-closed-synthesis-v1
    paths:
      - .github/workflows/qikvrt_roundtrip_integrity_once.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-roundtrip-integrity-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/roundtrip-closed-synthesis-v1
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Bind exact input head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/heads/docs/roundtrip-closed-synthesis-v1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Remove one-shot workflow before deterministic generation
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/qikvrt_roundtrip_integrity_once.yml

      - name: Generate and verify exact repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Enforce exact mutation set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/qikvrt_roundtrip_integrity_once.yml',
              'REPOSITORY_FILE_MANIFEST.json',
              'REPOSITORY_FILE_MANIFEST.json.sha256',
              'SHA256SUMS.txt',
          }
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z'])
          entries = [x for x in raw.decode('utf-8').split('\0') if x]
          paths = {entry[3:] for entry in entries}
          if paths != expected:
              raise SystemExit(f'BLOCK unexpected mutation set: {sorted(paths)!r}')
          PY

      - name: Persist generated evidence by exact-head fast-forward
        shell: bash
        run: |
          set -euo pipefail
          branch='docs/roundtrip-closed-synthesis-v1'
          git fetch --no-tags origin "refs/heads/${branch}"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/qikvrt_roundtrip_integrity_once.yml \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/qikvrt_roundtrip_integrity_once.yml',
              'REPOSITORY_FILE_MANIFEST.json',
              'REPOSITORY_FILE_MANIFEST.json.sha256',
              'SHA256SUMS.txt',
          }
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if paths != expected:
              raise SystemExit(f'BLOCK unexpected staged set: {sorted(paths)!r}')
          PY
          git commit -m 'ci: materialize roundtrip repository evidence'
          new_head="$(git rev-parse --verify HEAD^{commit})"
          git fetch --no-tags origin "refs/heads/${branch}"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/${branch}"
          git fetch --no-tags origin "refs/heads/${branch}"
          test "$(git rev-parse FETCH_HEAD)" = "$new_head"
          echo "MATERIALIZED_HEAD=$new_head" >> "$GITHUB_STEP_SUMMARY"
          echo "MATERIALIZED_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
