    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SEALED_EVALUATOR: ${{ github.workflow_sha }}
      OBSERVATION_ARTIFACT: ${{ needs.observe-mesh-child.outputs.artifact_name }}
      AUTHORITY_ARTIFACT_ID: ${{ needs.observe-mesh-child.outputs.authority_artifact_id }}
      AUTHORITY_ARTIFACT_DIGEST: ${{ needs.observe-mesh-child.outputs.authority_artifact_digest }}
      EFFECTIVE_BLOCKER: ${{ needs.observe-mesh-child.outputs.blocker }}
      QIKVRT_OUTBOX_WRITER_GROUP: qikvrt-outbox-ledger-v2-mesh-review-successor-dispatch
    steps:
      - name: Check out the exact trusted Mesh Authority writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact Mesh Authority observation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.OBSERVATION_ARTIFACT }}
          path: /tmp/qikvrt-mesh-review-completion

      - name: Persist Authority observation and terminalize one Mesh FIFO item
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="${LEDGER_WRITER_TOKEN-}"
          actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$token"
          [[ "$actor" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORITY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUTHORITY_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          root=/tmp/qikvrt-mesh-review-completion
          test "$(git rev-parse HEAD)" = "$SEALED_EVALUATOR"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/commits/main" --jq .sha)" = "$SEALED_EVALUATOR"
          jq -e --arg blocker "$EFFECTIVE_BLOCKER" \
            '.action == "TERMINALIZE_ORPHAN" and .authority_ready == true and
             .blocker == $blocker and .verified == true' \
            "$root/observation.json" >/dev/null
          jq -e --arg blocker "$EFFECTIVE_BLOCKER" \
            '.blocker == $blocker and .verified == true and
             .productive_effect == false' \
            "$root/authority-observation.json" >/dev/null
          sequence="$(jq -er .sequence "$root/item.json")"
          authority_name="qikvrt-outbox-authority-observation-mesh-review-successor-dispatch-${sequence}-${EFFECTIVE_BLOCKER}-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          artifact="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/actions/artifacts/$AUTHORITY_ARTIFACT_ID")"
          jq -e --argjson id "$AUTHORITY_ARTIFACT_ID" --arg name "$authority_name" \
            --arg digest "sha256:${AUTHORITY_ARTIFACT_DIGEST#sha256:}" \
            --argjson run_id "$GITHUB_RUN_ID" --arg evaluator "$SEALED_EVALUATOR" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run_id and
            .workflow_run.head_sha == $evaluator
          ' <<<"$artifact" >/dev/null
          pr="$(jq -er .intent.payload.subject.queue_intent.pr_number "$root/item.json")"
          head="$(jq -er .intent.payload.subject.queue_intent.head_sha "$root/item.json")"
          tree="$(jq -er .intent.payload.subject.queue_intent.tree_sha "$root/item.json")"
          base="$(jq -er .intent.payload.subject.queue_intent.base_sha "$root/item.json")"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/pulls/$pr" > "$root/live-pr.json"
          if test "$EFFECTIVE_BLOCKER" = OUTBOX_SUBJECT_SUPERSEDED; then
            jq -e --slurpfile item "$root/item.json" \
              '.observed_subject != $item[0].intent.payload.subject' \
              "$root/authority-observation.json" >/dev/null
            observed_head="$(jq -er '.observed_subject.queue_intent.head_sha' \
              "$root/authority-observation.json")"
            observed_tree="$(jq -er '.observed_subject.queue_intent.tree_sha' \
              "$root/authority-observation.json")"
            observed_base="$(jq -er '.observed_subject.queue_intent.base_sha' \
              "$root/authority-observation.json")"
            observed_state="$(jq -er '.observed_subject.queue_intent.state' \
              "$root/authority-observation.json")"
            test "$(jq -r .head.sha "$root/live-pr.json")" = "$observed_head"
            test "$(jq -r .base.sha "$root/live-pr.json")" = "$observed_base"
            test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$REPOSITORY/git/commits/$observed_head" --jq .tree.sha)" \
              = "$observed_tree"
            if [[ "$observed_state" == LIVE_PR_* ]]; then
              test "LIVE_PR_$(jq -r .state "$root/live-pr.json" | \
                tr '[:lower:]' '[:upper:]')" = "$observed_state"
            fi
          else
            test "$(jq -r .head.sha "$root/live-pr.json")" = "$head"
            test "$(jq -r .base.sha "$root/live-pr.json")" = "$base"
            test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$REPOSITORY/git/commits/$head" --jq .tree.sha)" = "$tree"
          fi
          if test "$EFFECTIVE_BLOCKER" = OUTBOX_TARGET_WORKFLOW_SUPERSEDED; then
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$REPOSITORY/actions/workflows/qikvrt_requested_review_executor.yml" \
              > "$root/live-target-workflow.json"
            jq -e --slurpfile observed "$root/authority-observation.json" '
              .id == $observed[0].observed_target.workflow_id and
              ((.path // "") | split("@")[0]) ==
                $observed[0].observed_target.workflow_path
            ' "$root/live-target-workflow.json" >/dev/null
          fi
          unset GH_TOKEN
          ledger_write() {
            QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$token" \
            QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
            QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
              python3 -B tools/qikvrt_ruleset_outbox.py "$@"
          }
          ledger_write --repository "$REPOSITORY" \
            --receipt "$root/authority-record.json" \
            record-observation --lane mesh-review-successor-dispatch \
            --sequence "$sequence" \
            --observation "$root/authority-observation.json" \
            --producer "$root/producer.json" \
            --artifact-id "$AUTHORITY_ARTIFACT_ID" \
            --artifact-name "$authority_name" \
            --artifact-digest "${AUTHORITY_ARTIFACT_DIGEST#sha256:}" >/dev/null
          python3 -B - "$root/item.json" "$root/authority-record.json" \
            "$root/terminal.json" <<'PY'
          import json,pathlib,sys
          from tools.qikvrt_mesh_review_outbox import materialize_mesh_authority_terminal
          item=json.loads(pathlib.Path(sys.argv[1]).read_text())
          record=json.loads(pathlib.Path(sys.argv[2]).read_text())
          terminal=materialize_mesh_authority_terminal(
              item=item,authority_record=record
          )
          pathlib.Path(sys.argv[3]).write_text(
              json.dumps(terminal,sort_keys=True,indent=2)+'\n'
          )
          PY
          ledger_write --repository "$REPOSITORY" \
            --receipt "$root/terminal-receipt.json" \
            terminalize --lane mesh-review-successor-dispatch \
            --sequence "$sequence" --evidence "$root/terminal.json" >/dev/null
          unset token actor

      - name: Preserve exact Mesh Authority terminal receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-mesh-review-authority-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/qikvrt-mesh-review-completion/authority-record.json
            /tmp/qikvrt-mesh-review-completion/terminal.json
            /tmp/qikvrt-mesh-review-completion/terminal-receipt.json

  persist-mesh-completion:
    needs: [read-mesh-frontier, observe-mesh-child]
