          fetch-depth: 1
          persist-credentials: false

      - name: Download exact materialized completion evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.OBSERVATION_ARTIFACT }}
          path: /tmp/qikvrt-mesh-review-completion

      - name: Persist completion then advance the exact FIFO cursor
        env:
          LEDGER_WRITER_TOKEN: ${{ secrets.QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN }}
          LEDGER_WRITER_ACTOR_ID: ${{ vars.QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID }}
        shell: bash
        run: |
          set -euo pipefail
          token="${LEDGER_WRITER_TOKEN-}"
          actor="${LEDGER_WRITER_ACTOR_ID-}"
          unset LEDGER_WRITER_TOKEN LEDGER_WRITER_ACTOR_ID
          test -n "$token"
          [[ "$actor" =~ ^[1-9][0-9]*$ ]]
          root=/tmp/qikvrt-mesh-review-completion
          test "$(git rev-parse HEAD)" = "$SEALED_EVALUATOR"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/commits/main" --jq .sha)" = "$SEALED_EVALUATOR"
          jq -e '.action == "COMPLETE_AND_TERMINALIZE" and .completion_ready == true' \
            "$root/observation.json" >/dev/null
          jq -e --arg evaluator "$SEALED_EVALUATOR" \
            '.intent.payload.main_head_sha == $evaluator' "$root/item.json" >/dev/null
          pr="$(jq -er .intent.payload.subject.queue_intent.pr_number "$root/item.json")"
          head="$(jq -er .intent.payload.subject.queue_intent.head_sha "$root/item.json")"
          tree="$(jq -er .intent.payload.subject.queue_intent.tree_sha "$root/item.json")"
          base="$(jq -er .intent.payload.subject.queue_intent.base_sha "$root/item.json")"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/pulls/$pr" > "$root/live-pr.json"
          test "$(jq -r .head.sha "$root/live-pr.json")" = "$head"
          test "$(jq -r .base.sha "$root/live-pr.json")" = "$base"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/git/commits/$head" --jq .tree.sha)" = "$tree"
          sequence="$(jq -er .sequence "$root/item.json")"
          attempt="$(jq -er .transport_attempt "$root/target.json")"
          recovery="$(jq -r .child_recovery "$root/target.json")"
          unset GH_TOKEN
          recovery_flag=()
          if test "$recovery" = true; then recovery_flag=(--child-recovery); fi
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/completion.json" \
              complete --lane mesh-review-successor-dispatch \
              --sequence "$sequence" --attempt "$attempt" \
              --child "$root/child.json" \
              --evidence "$root/completion-evidence.json" \
              "${recovery_flag[@]}" >/dev/null
          QIKVRT_ENV_OUTBOX_LEDGER_WRITER_TOKEN="$token" \
          QIKVRT_OUTBOX_LEDGER_WRITER_ACTOR_ID="$actor" \
          QIKVRT_OUTBOX_WRITER_GROUP="$QIKVRT_OUTBOX_WRITER_GROUP" \
            python3 -B tools/qikvrt_ruleset_outbox.py \
              --repository "$REPOSITORY" \
              --receipt "$root/terminal-receipt.json" \
              terminalize --lane mesh-review-successor-dispatch \
              --sequence "$sequence" \
              --evidence "$root/terminal.json" >/dev/null
          unset token actor

      - name: Preserve exact Mesh completion and terminal receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-mesh-review-completion-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/qikvrt-mesh-review-completion/completion.json
            /tmp/qikvrt-mesh-review-completion/terminal-receipt.json
