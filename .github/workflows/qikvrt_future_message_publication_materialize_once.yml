name: QIKVRT future-message publication materialize once
on:
  push:
    branches: [transport/future-message-publication-materialize-v1]
    paths: [.github/workflows/qikvrt_future_message_publication_materialize_once.yml]
permissions:
  contents: write
concurrency:
  group: qikvrt-future-message-publication-materialize-v1
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'Goldkelch/qik-vrt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: publication/future-message-present-receiver-v1
      EXPECTED_HEAD: 40b287aa644f1d8238e5697057767beb6977e5e9
      EXPECTED_TREE: 79b16d8a8836fd1c05f49a8e33f80541af9f710b
      BASE_MAIN: a86054139b49c13c5cd344753b248b46b5daf66f
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: .
    steps:
      - name: Bind exact public refs without REST bootstrap
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TARGET_REF" | awk 'NR==1{print $1}')"
          test "$remote" = "$EXPECTED_HEAD" || { echo "HOLD: target moved to $remote"; exit 2; }
          main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk 'NR==1{print $1}')"
          test "$main" = "$BASE_MAIN" || { echo "HOLD: Main moved to $main"; exit 2; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind literal checkout and isolate the receipt integrity drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git merge-base --is-ancestor "$BASE_MAIN" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          from tools import qikvrt_integrity as integrity
          stored = json.loads(Path(integrity.MANIFEST_NAME).read_text(encoding='utf-8'))
          _, _, _, expected = integrity.build_outputs()
          old = {entry['path']: entry for entry in stored['files']}
          new = {entry['path']: entry for entry in expected['files']}
          delta = {'added': sorted(new.keys() - old.keys()), 'removed': sorted(old.keys() - new.keys()),
                   'changed': sorted(p for p in old.keys() & new.keys() if old[p] != new[p])}
          root = 'docs/publications/2026-09-13-future-message-present-receiver/'
          wanted = {'added': [root + 'OWNER_CONVERSATIONAL_RECEIPT.json'], 'removed': [],
                    'changed': [root + 'MATERIALIZATION_MANIFEST.json']}
          print(json.dumps(delta, sort_keys=True))
          if delta != wanted:
              raise SystemExit('HOLD: integrity drift differs from the bound receipt delta')
          PY
      - name: Retain verified test dependencies without rerendering the PDF
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'reportlab==5.0.1'
          python3 -c 'import reportlab, PIL'
          python3 -m pip freeze | sort > "$RUNNER_TEMP/test-runtime.freeze"
      - name: Regenerate only canonical integrity and verify idempotence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_publication_overview.py check --json
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          sha256sum REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt > "$RUNNER_TEMP/integrity.first.sha256"
          python3 -B tools/qikvrt_integrity.py generate
          sha256sum REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt > "$RUNNER_TEMP/integrity.second.sha256"
          cmp "$RUNNER_TEMP/integrity.first.sha256" "$RUNNER_TEMP/integrity.second.sha256"
      - name: Execute complete repository suite on materialized worktree
        shell: bash
        run: |
          set -euo pipefail
          make test > "$RUNNER_TEMP/make-test.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/make-test.log"; exit 1; }
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
          sha256sum REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt > "$RUNNER_TEMP/integrity.after-tests.sha256"
          cmp "$RUNNER_TEMP/integrity.second.sha256" "$RUNNER_TEMP/integrity.after-tests.sha256"
      - name: Persist exactly the three-file repair with ordinary fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B - <<'PY'
          import subprocess
          allowed = {'REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt'}
          def paths(*args):
              return set(filter(None, subprocess.check_output(['git', *args]).decode().split('\0')))
          changed = paths('diff', '--name-only', '-z', 'HEAD')
          untracked = paths('ls-files', '--others', '--exclude-standard', '-z')
          if changed != allowed or untracked:
              raise SystemExit('HOLD: repair scope mismatch ' + repr((changed, untracked)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git commit -m 'publication: persist canonical integrity for scoped owner receipt'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          successor="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          remote="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TARGET_REF" | awk 'NR==1{print $1}')"
          test "$remote" = "$EXPECTED_HEAD" || { echo 'HOLD: target moved before push'; exit 2; }
          main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk 'NR==1{print $1}')"
          test "$main" = "$BASE_MAIN" || { echo 'HOLD: Main moved before push'; exit 2; }
          git push origin "HEAD:refs/heads/$TARGET_REF"
          observed="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TARGET_REF" | awk 'NR==1{print $1}')"
          test "$observed" = "$successor" || { echo 'HOLD: persisted ref readback mismatch; reconcile before any retry'; exit 2; }
          printf '{"source_head":"%s","head":"%s","tree":"%s","base_main":"%s","ref":"%s","ref_readback":true,"scope":"CANONICAL_INTEGRITY_TRIO_ONLY","pdf_rerendered":false,"predecessor_evidence_transfer":false,"successor_p2_established":false,"external_effect":false}\n' "$EXPECTED_HEAD" "$successor" "$tree" "$BASE_MAIN" "$TARGET_REF" | tee "$RUNNER_TEMP/persistence-readback.json"
          git show --format=fuller --stat HEAD
      - name: Preserve finite repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: future-message-receipt-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-runtime.freeze
            ${{ runner.temp }}/integrity.first.sha256
            ${{ runner.temp }}/integrity.second.sha256
            ${{ runner.temp }}/integrity.after-tests.sha256
            ${{ runner.temp }}/make-test.log
            ${{ runner.temp }}/persistence-readback.json
          if-no-files-found: warn
          retention-days: 30
