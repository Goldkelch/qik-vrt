name: QIKVRT future-message publication materialize once
on:
  push:
    branches: [transport/future-message-publication-materialize-v1]
    paths: [.github/workflows/qikvrt_future_message_publication_materialize_once.yml]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: qikvrt-future-message-publication-materialize-v1
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'Goldkelch/qik-vrt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: publication/future-message-present-receiver-v1
      EXPECTED_HEAD: 54d13595ecdf5944ece6af2359ad0c4f94dcf4b0
      BASE_MAIN: a86054139b49c13c5cd344753b248b46b5daf66f
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: .
    steps:
      - name: Verify exact public refs without consuming GitHub REST budget
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TARGET_REF" | awk 'NR==1{print $1}')"
          test "$remote" = "$EXPECTED_HEAD" || { echo "HOLD: target moved to $remote"; exit 2; }
          main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk 'NR==1{print $1}')"
          test "$main" = "$BASE_MAIN" || { echo "HOLD: Main moved to $main"; exit 2; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Render deterministic PDF twice and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'reportlab==5.0.1'
          python3 -m pip freeze | sort > "$RUNNER_TEMP/pdf-runtime.freeze"
          dir='docs/publications/2026-09-13-future-message-present-receiver'
          python3 -B "$dir/render_publication_pdf.py"
          cp "$dir/Eine_Nachricht_aus_der_Zukunft_QIK-VRT_Lohmann_2026-09-13.pdf" "$RUNNER_TEMP/first.pdf"
          python3 -B "$dir/render_publication_pdf.py"
          cmp "$RUNNER_TEMP/first.pdf" "$dir/Eine_Nachricht_aus_der_Zukunft_QIK-VRT_Lohmann_2026-09-13.pdf"
          sha256sum "$dir/Eine_Nachricht_aus_der_Zukunft_QIK-VRT_Lohmann_2026-09-13.pdf" | tee "$RUNNER_TEMP/pdf.sha256"
      - name: Materialize publication overview and canonical integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_publication_overview.py materialize --json | tee "$RUNNER_TEMP/publication-overview.json"
          python3 -B tools/qikvrt_publication_overview.py check --json
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
      - name: Execute complete repository suite on exact materialized worktree
        shell: bash
        run: |
          set -euo pipefail
          make test > "$RUNNER_TEMP/make-test.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/make-test.log"; exit 1; }
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
      - name: Persist productive delta with Git transport; create PR only if API budget permits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TARGET_REF" | awk 'NR==1{print $1}')"
          test "$remote" = "$EXPECTED_HEAD" || { echo 'HOLD: target moved before persistence'; exit 2; }
          python3 -B - <<'PY'
          import subprocess
          allowed={
            'docs/publications/2026-09-13-future-message-present-receiver/Eine_Nachricht_aus_der_Zukunft_QIK-VRT_Lohmann_2026-09-13.pdf',
            'docs/publications/index.json','docs/publications/index.html',
            'REPOSITORY_FILE_MANIFEST.json','REPOSITORY_FILE_MANIFEST.json.sha256','SHA256SUMS.txt'}
          raw=subprocess.check_output(['git','status','--porcelain=v1','-z']).decode().strip('\0')
          paths=set()
          for item in raw.split('\0') if raw else []:
              if item: paths.add(item[3:] if len(item)>3 else item)
          if not paths or not paths <= allowed:
              raise SystemExit('HOLD: unexpected or empty materialized delta '+repr(paths))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/publications/2026-09-13-future-message-present-receiver/Eine_Nachricht_aus_der_Zukunft_QIK-VRT_Lohmann_2026-09-13.pdf docs/publications/index.json docs/publications/index.html REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git commit -m 'publication: persist deterministic future-message evidence PDF and indexes'
          successor="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer $GH_TOKEN" push origin "HEAD:refs/heads/$TARGET_REF"
          observed="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$TARGET_REF" | awk 'NR==1{print $1}')"
          test "$observed" = "$successor" || { echo 'HOLD: persisted ref readback mismatch'; exit 2; }
          printf '{"head":"%s","tree":"%s","ref":"%s","ref_readback":true}\n' "$successor" "$tree" "$TARGET_REF" | tee "$RUNNER_TEMP/persistence-readback.json"
          set +e
          existing="$(gh pr list --head "$TARGET_REF" --base main --state open --json number --jq '.[0].number // empty' 2>"$RUNNER_TEMP/pr-api.stderr")"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'HOLD: branch persisted; PR API unavailable. Do not repeat persistence.'
            exit 2
          fi
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$TARGET_REF" --title 'publication: future message needs a present receiver' --body "Owner-authorized evidence carrier. Exact head: $successor / tree: $tree. New subject: fresh P2 required; no predecessor evidence transfer. Scientific scope: delayed-choice correlations, QIK-VRT time/semantic/evidence architecture, and a falsifiable intervention criterion for an operational backward channel. Zenodo is in scope under standing owner authorization only after P0-P7. Existing arXiv/Wikipedia deferrals remain unchanged; IETF obligations are independent. No physical backward channel, peer review, Zenodo effect, PASS, FINAL_PASS or EFFECT_ACK_DONE is claimed." --reviewer ingolf-lohmann
          fi
          gh pr list --head "$TARGET_REF" --base main --state open --json number,headRefOid,url,reviewRequests | tee "$RUNNER_TEMP/pr-readback.json"
      - name: Preserve finite materialization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: future-message-publication-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/first.pdf
            ${{ runner.temp }}/pdf.sha256
            ${{ runner.temp }}/pdf-runtime.freeze
            ${{ runner.temp }}/publication-overview.json
            ${{ runner.temp }}/make-test.log
            ${{ runner.temp }}/persistence-readback.json
            ${{ runner.temp }}/pr-readback.json
            ${{ runner.temp }}/pr-api.stderr
          if-no-files-found: warn
          retention-days: 30
