name: QIKVRT one-shot review-control-plane materialization

on:
  push:
    branches:
      - fix/review-control-plane-current-main-v1

permissions:
  contents: write

concurrency:
  group: qikvrt-one-shot-review-control-plane-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert exact writer and remove one-shot bootstrap
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="fix/review-control-plane-current-main-v1"
          [ "$GITHUB_REF_NAME" = "$expected_ref" ] || {
            echo "BLOCK: unexpected target ref: $GITHUB_REF_NAME" >&2
            exit 2
          }
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(git ls-remote --heads origin "refs/heads/$expected_ref" | awk 'NR == 1 { print $1 }')"
          [ "$remote_head" = "$source_head" ] || {
            echo "BLOCK: branch advanced before one-shot materialization" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          }
          git rm .github/workflows/qikvrt_review_control_plane_materialize_once.yml
      - name: Regenerate exact target-tree integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Run complete repository gates on exact target tree
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 tools/qikvrt_integrity.py verify
      - name: Persist exact target-tree evidence by CAS
        shell: bash
        run: |
          set -euo pipefail
          target_ref="fix/review-control-plane-current-main-v1"
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(git ls-remote --heads origin "refs/heads/$target_ref" | awk 'NR == 1 { print $1 }')"
          [ "$remote_head" = "$source_head" ] || {
            echo "BLOCK: branch advanced before persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows
          git add -- \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git diff --cached --quiet && {
            echo "BLOCK: one-shot materialization produced no staged transition" >&2
            exit 2
          }
          git commit -m "ci: materialize review-control-plane repository evidence"
          remote_head_after_commit="$(git ls-remote --heads origin "refs/heads/$target_ref" | awk 'NR == 1 { print $1 }')"
          [ "$remote_head_after_commit" = "$source_head" ] || {
            echo "BLOCK: branch advanced while evidence was materialized" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_after_commit=$remote_head_after_commit" >&2
            exit 2
          }
          git push origin "HEAD:$target_ref"
