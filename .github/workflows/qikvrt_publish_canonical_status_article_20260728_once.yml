name: QIK-VRT one-shot canonical status article Zenodo publication

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/qikvrt_publish_canonical_status_article_20260728_once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qikvrt-canonical-status-article-zenodo-20260728
  cancel-in-progress: false

jobs:
  publish-and-persist:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'execution/canonical-status-article-zenodo-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      EXPECTED_AUTHORITY_MAIN: c1956c446cd3730622172fbf60e03b9c23752bde
      TARGET_BRANCH: execution/canonical-status-article-zenodo-20260728
      EXECUTION_WORKFLOW: .github/workflows/qikvrt_publish_canonical_status_article_20260728_once.yml
      MANIFEST: release/canonical-closing-status-article-2026-07-28/publish-request.json
      EVIDENCE: release/canonical-closing-status-article-2026-07-28/zenodo-publication.json
    steps:
      - name: Check out exact execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: execution/canonical-status-article-zenodo-20260728
          fetch-depth: 0
      - name: Verify one-shot authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = 'Goldkelch/qik-vrt' ]
          [ "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}' ]
          [ "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_AUTHORITY_MAIN" ]
          [ "$(git merge-base HEAD "$EXPECTED_AUTHORITY_MAIN")" = "$EXPECTED_AUTHORITY_MAIN" ]
          [ "$(git ls-remote https://github.com/Goldkelch/qik-vrt.git refs/heads/main | cut -f1)" = "$EXPECTED_AUTHORITY_MAIN" ]
          mapfile -t changed < <(git diff --name-only "$EXPECTED_AUTHORITY_MAIN" HEAD -- | LC_ALL=C sort)
          [ "${#changed[@]}" -eq 1 ]
          [ "${changed[0]}" = "$EXECUTION_WORKFLOW" ]
          [ ! -e "$EVIDENCE" ]
          [ -n "${ZENODO_ACCESS_TOKEN:-}" ]
          [ "${#ZENODO_ACCESS_TOKEN}" -ge 20 ]
          case "$ZENODO_ACCESS_TOKEN" in *[[:space:]]*) exit 1;; esac
      - name: Verify article, completion and publication contract before effect
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/test_canonical_closing_status_article.py
          GITHUB_REPOSITORY='Goldkelch/qik-vrt' python3 -B - <<'PY'
          import pathlib
          from tools import qikvrt_zenodo_publish as publish
          root = pathlib.Path.cwd().resolve()
          manifest = publish.load_manifest(root / 'release/canonical-closing-status-article-2026-07-28/publish-request.json', root)
          assert manifest['repository'] == 'Goldkelch/qik-vrt'
          assert manifest['metadata']['publication_type'] == 'article'
          assert [x['git_blob_sha'] for x in manifest['files']] == [
              '3c2cb383687f353031d59b0f914dc91cd04a7ce3',
              'f70ed8548a5303a7b970741cab48602c6c6439a9',
              '97466066860a57af412e79220a4dff43a82e300e',
          ]
          PY
      - name: Publish exact Git-blob-bound status article to production Zenodo
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_REPOSITORY='Goldkelch/qik-vrt' \
          GITHUB_SHA="$EXPECTED_AUTHORITY_MAIN" \
          python3 -B tools/qikvrt_zenodo_publish.py --manifest "$MANIFEST" \
            | tee .qikvrt-canonical-status-article-zenodo.log
          grep -qx 'ZENODO_PUBLICATION_STATE=published' .qikvrt-canonical-status-article-zenodo.log
          test -s "$EVIDENCE"
      - name: Verify public publication receipt and uploaded identities
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path.cwd()
          path = root / 'release/canonical-closing-status-article-2026-07-28/zenodo-publication.json'
          value = json.loads(path.read_text(encoding='utf-8'))
          assert value['schema'] == 'qikvrt_zenodo_publication_evidence_v1'
          assert value['state'] == 'published'
          assert value['repository'] == 'Goldkelch/qik-vrt'
          assert value['repository_commit'] == 'c1956c446cd3730622172fbf60e03b9c23752bde'
          assert value['version'] == '1.0.0-2026-07-28'
          assert isinstance(value['record_id'], int) and value['record_id'] > 0
          assert re.fullmatch(r'10\.5281/zenodo\.[1-9][0-9]*', value['doi'])
          assert re.fullmatch(r'10\.5281/zenodo\.[1-9][0-9]*', value['conceptdoi'])
          expected = {
            'QIKVRT_Vom_Unterschied_zur_Verantwortung_Statusartikel_DE.md': ('docs/publications/2026-07-28-canonical-closing-statement-historical-context/ARTICLE_DE.md', '3c2cb383687f353031d59b0f914dc91cd04a7ce3'),
            'QIKVRT_STATUS_ARTICLE_MANIFEST.json': ('docs/publications/2026-07-28-canonical-closing-statement-historical-context/STATUS_ARTICLE_MANIFEST.json', 'f70ed8548a5303a7b970741cab48602c6c6439a9'),
            'QIKVRT_GLOBAL_COMPLETION_RECEIPT.json': ('GLOBAL_COMPLETION_RECEIPT.json', '97466066860a57af412e79220a4dff43a82e300e'),
          }
          assert {x['name'] for x in value['files']} == set(expected)
          for item in value['files']:
              source, blob = expected[item['name']]
              data = (root / source).read_bytes()
              assert item['path'] == source
              assert item['git_blob_sha'] == blob
              assert item['size'] == len(data)
              assert item['sha256'] == hashlib.sha256(data).hexdigest()
          PY
      - name: Remove executor, regenerate integrity and run post-effect gates
        shell: bash
        run: |
          set -euo pipefail
          rm -- "$EXECUTION_WORKFLOW"
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py generate
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py verify
          python3 -B tests/test_canonical_closing_status_article.py
          make test
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py verify
          mapfile -t actual < <(git diff --name-only "$EXPECTED_AUTHORITY_MAIN" -- | LC_ALL=C sort)
          expected=(
            'REPOSITORY_FILE_MANIFEST.json'
            'REPOSITORY_FILE_MANIFEST.json.sha256'
            'SHA256SUMS.txt'
            'release/canonical-closing-status-article-2026-07-28/zenodo-publication.json'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [ "${#actual[@]}" -eq "${#expected_sorted[@]}" ]
          for i in "${!expected_sorted[@]}"; do [ "${actual[$i]}" = "${expected_sorted[$i]}" ]; done
      - name: Persist publication receipt without executor
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          [ "$remote_head" = '${{ github.event.pull_request.head.sha }}' ]
          git config user.name 'qikvrt-zenodo-publication[bot]'
          git config user.email 'qikvrt-zenodo-publication[bot]@users.noreply.github.com'
          git add -A -- \
            "$EVIDENCE" \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt \
            "$EXECUTION_WORKFLOW"
          git commit -m 'zenodo: persist canonical status article publication receipt'
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Persist transaction notice
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          doi=$(python3 -c "import json; print(json.load(open('$EVIDENCE'))['doi'])")
          record=$(python3 -c "import json; print(json.load(open('$EVIDENCE'))['record_id'])")
          gh pr comment '${{ github.event.pull_request.number }}' --repo "$GITHUB_REPOSITORY" --body "Production Zenodo publication completed and repository receipt persisted.\n\n- source Authority main: \`$EXPECTED_AUTHORITY_MAIN\`\n- DOI: \`$doi\`\n- record ID: \`$record\`\n- evidence path: \`$EVIDENCE\`\n\nPromotion of the post-publication exact head remains separately gated."
