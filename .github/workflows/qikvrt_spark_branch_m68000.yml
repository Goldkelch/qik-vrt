name: QIKVRT Spark branch M68000 compiler

on:
  pull_request:
    paths:
      - "proofs/QIKVRTSparkBranchV1.lean"
      - "runtime/m68000/QIKVRT_COMPILED_KERNELS_V1.json"
      - "runtime/m68000/QIKVRT_SPARK_BRANCH_PLANS_V1.json"
      - "runtime/m68000/qikvrt_spark_branch_plan_v1.hex"
      - "src/m68000/qikvrt_spark_branch_plan_v1.s"
      - "tools/qikvrt_spark_branch_m68000_compiler.py"
      - "tools/qikvrt_spark_branch_work_unit.py"
      - "tools/qikvrt_virtual_mesh_m68000_acceptance.py"
      - "tests/test_qikvrt_spark_branch_m68000.py"
      - "tests/test_qikvrt_spark_branch_work_unit.py"
      - "tests/test_qikvrt_virtual_mesh_m68000_acceptance.py"
      - ".github/workflows/qikvrt_spark_branch_m68000.yml"
      - ".github/workflows/qikvrt_virtual_mesh_m68000_acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-compile-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Kernel-check Spark plan model
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization/QIKVRT_Formalization_v2.0
          test: false
      - name: Kernel-check standalone Spark theorem file
        run: |
          set -euo pipefail
          (cd formalization/QIKVRT_Formalization_v2.0 && \
            lake env lean ../../proofs/QIKVRTSparkBranchV1.lean)
      - name: Compile and exhaustively verify all 256 normalized observations
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_spark_branch_m68000_compiler.py \
            --output-hex "$RUNNER_TEMP/spark.hex" --json \
            | tee "$RUNNER_TEMP/qikvrt-spark-compiler-report.json"
          cmp "$RUNNER_TEMP/spark.hex" runtime/m68000/qikvrt_spark_branch_plan_v1.hex
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v \
            tests.test_qikvrt_spark_branch_m68000 \
            tests.test_qikvrt_spark_branch_work_unit \
            tests.test_qikvrt_virtual_mesh_m68000_acceptance
      - name: Execute one complete pure-reference branch ring from one core plan pass
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/observation.json" <<'JSON'
          {
            "malformed_or_scope_invalid": false,
            "main_effect_observed": false,
            "base_current": false,
            "integrity_current": false,
            "gates_terminal": false,
            "gates_non_adverse": false,
            "mergeable": false,
            "authority_available": true
          }
          JSON
          python3 -B tools/qikvrt_spark_branch_work_unit.py \
            --observation "$RUNNER_TEMP/observation.json" \
            --pure-reference-ring --json \
            | tee "$RUNNER_TEMP/qikvrt-spark-branch-ring.json"
      - name: Reject proof holes and frozen-proof mutation
        run: |
          set -euo pipefail
          ! grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
            proofs/QIKVRTSparkBranchV1.lean
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then
            ! git diff --name-only "$base" HEAD -- \
              formalization/QIKVRT_Formalization_v1.0 \
              formalization/QIKVRT_Formalization_v2.0 \
              | grep -q .
          fi
      - name: Preserve Spark proof, compiler, plan and ring evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-spark-branch-m68000-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qikvrt-spark-compiler-report.json
            ${{ runner.temp }}/qikvrt-spark-branch-ring.json
          retention-days: 30
          if-no-files-found: error
