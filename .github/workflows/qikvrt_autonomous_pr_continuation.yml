name: QIK-VRT autonomous draft-PR continuation

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_autonomous_pr_continuation.yml"
      - ".github/workflows/qikvrt_autonomous_exact_head_verify.yml"
      - ".github/workflows/qikvrt_autonomous_self_heal.yml"
      - "tools/qikvrt_autonomous_pr_continue.sh"
      - "tools/qikvrt_autonomous_self_heal.py"
      - "tools/qikvrt_publication_overview.py"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-autonomous-pr-continuation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  continue-one-opted-in-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out current main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.QIKVRT_AUTONOMY_WORKFLOW_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate continuation shell and contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/qikvrt_autonomous_pr_continue.sh
          python3 -B -m unittest -v \
            tests.test_qikvrt_autonomous_pr_continuation \
            tests.test_qikvrt_autonomous_self_heal

      - name: Continue one exact opted-in draft PR
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_AUTONOMY_WORKFLOW_TOKEN || github.token }}
        shell: bash
        run: bash tools/qikvrt_autonomous_pr_continue.sh
