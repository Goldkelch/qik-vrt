name: QIK-VRT terminal content disposition Batch 002 once

on:
  push:
    branches: [execution/content-disposition-batch-002-terminal-v1]
    paths: [work-units/EXECUTE_BATCH_002_TERMINAL_READY_V4.json]

permissions:
  contents: write

concurrency:
  group: qikvrt-content-disposition-batch-002-terminal-v4
  cancel-in-progress: false

jobs:
  execute-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AUTHORITY_BASE: 240bc42aef462f12bd6179ce7da2aa585844f531
      EVIDENCE_BRANCH: evidence/content-disposition-batch-002-terminal-20260728-v1
    steps:
      - name: Check out immutable trigger event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact event transaction
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json,pathlib,subprocess
          r=json.loads(pathlib.Path('work-units/EXECUTE_BATCH_002_TERMINAL_READY_V4.json').read_text())
          assert r['state']=='READY'
          assert r['authority_base']=='240bc42aef462f12bd6179ce7da2aa585844f531'
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==r['trigger_parent']
          for path,blob in r['git_blob_sha1'].items():
              assert subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()==blob
          assert r['completion_claims']=={'pass':False,'final_pass':False,'effect_ack_done':False}
          PY
      - name: Run adversarial unit tests
        run: python3 -B tests/test_content_disposition_batch_002_terminal.py
      - name: Execute and atomically transfer generated evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_content_disposition_batch_002_terminal.py | tee /tmp/batch002-terminal.json
          test -f release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-002/terminal-disposition/CONTENT_DISPOSITION_BATCH_002_RECEIPT.json
          git fetch --no-tags origin "$EVIDENCE_BRANCH"
          test "$(git rev-parse origin/$EVIDENCE_BRANCH)" = "$AUTHORITY_BASE"
          evidence_root="$RUNNER_TEMP/batch002-terminal-evidence"
          git worktree add --detach "$evidence_root" "origin/$EVIDENCE_BRANCH"
          tar -cf - \
            tools/qikvrt_content_disposition_batch_002_terminal.py \
            tests/test_content_disposition_batch_002_terminal.py \
            work-units/EXECUTE_FULL_CLAIM_EXTRACTION_AND_TERMINAL_DISPOSITION_FOR_BATCH_002.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/CONTENT_CLAIM_DISPOSITION_INDEX.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/CONTENT_CLAIM_DISPOSITION_QUEUE.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-002/terminal-disposition \
            | tar -xf - -C "$evidence_root"
          test -f "$evidence_root/release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-002/terminal-disposition/CONTENT_DISPOSITION_BATCH_002_RECEIPT.json"
          echo "EVIDENCE_ROOT=$evidence_root" >> "$GITHUB_ENV"
      - name: Verify evidence integrity and complete acceptance suite
        run: |
          set -euo pipefail
          cd "$EVIDENCE_ROOT"
          python3 -B tests/test_content_disposition_batch_002_terminal.py
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-002/terminal-disposition/CONTENT_DISPOSITION_BATCH_002_RECEIPT.json').read_text())
          assert r['state']=='TERMINALLY_DISPOSITIONED'
          assert r['subject_count']==6
          assert r['completion_claims']['batch_002_terminal_disposition_complete'] is True
          assert r['completion_claims']['pass'] is False
          assert r['completion_claims']['final_pass'] is False
          assert r['completion_claims']['effect_ack_done'] is False
          PY
      - name: Persist exact evidence under frozen lease
        run: |
          set -euo pipefail
          cd "$EVIDENCE_ROOT"
          git config user.name 'QIK-VRT Repository Evidence Bot'
          git config user.email 'ingolf.lohmann@live.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'Persist terminal content disposition for Batch 002'
          git push origin --force-with-lease="refs/heads/$EVIDENCE_BRANCH:$AUTHORITY_BASE" "HEAD:refs/heads/$EVIDENCE_BRANCH"
          persisted="$(git ls-remote origin refs/heads/$EVIDENCE_BRANCH | cut -f1)"
          test "$persisted" = "$(git rev-parse HEAD)"
          echo "PERSISTED_EVIDENCE_HEAD=$persisted" >> "$GITHUB_ENV"
      - name: Report truth-bounded result
        run: |
          echo "Batch 002 terminal evidence persisted at $PERSISTED_EVIDENCE_HEAD"
          echo 'PASS=false FINAL_PASS=false EFFECT_ACK_DONE=false'
