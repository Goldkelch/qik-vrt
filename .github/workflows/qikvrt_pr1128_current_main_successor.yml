name: QIKVRT PR1128 current-main successor

on:
  push:
    branches:
      - publication/truth-no-conspiracy-theory-2026-09-19
    paths:
      - .github/workflows/qikvrt_pr1128_current_main_successor.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-pr1128-current-main-successor
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_PREDECESSOR: 1284555610b50372be0fdba7e4450e357282dc0b
      EXPECTED_MAIN: b075b0630401d8bf5a350620c50e4a08410b8813
      TARGET_REF: publication/truth-no-conspiracy-theory-2026-09-19
      CARRIER_PATH: .github/workflows/qikvrt_pr1128_current_main_successor.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact predecessor and current main
        shell: bash
        run: |
          set -euo pipefail
          carrier="$(git rev-parse --verify HEAD^{commit})"
          parent="$(git rev-parse --verify HEAD^1)"
          test "$carrier" = "$GITHUB_SHA"
          test "$parent" = "$EXPECTED_PREDECESSOR"
          git fetch --no-tags origin main
          live_main="$(git rev-parse --verify origin/main^{commit})"
          test "$live_main" = "$EXPECTED_MAIN"
          printf 'CARRIER_HEAD=%s\nPREDECESSOR_HEAD=%s\nMAIN_HEAD=%s\n'             "$carrier" "$parent" "$live_main"

      - name: Merge main and regenerate deterministic integrity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name qikvrt-pr1128-integrator
          git config user.email qikvrt-pr1128-integrator@users.noreply.github.com

          set +e
          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi

          git diff --name-only --diff-filter=U | sort -u > /tmp/conflicts
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt)
                git checkout --ours -- "$path"
                git add -- "$path"
                ;;
              *)
                echo "BLOCK: unexpected semantic conflict: $path" >&2
                exit 2
                ;;
            esac
          done < /tmp/conflicts
          test -z "$(git diff --name-only --diff-filter=U)"

          git rm -- "$CARRIER_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt

      - name: Execute PR1128 publication and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B docs/publications/2026-09-19-truth-needs-no-conspiracy-theory/verify_publication_scope.py
          make test

      - name: Commit push and read back successor
        shell: bash
        run: |
          set -euo pipefail
          remote_before="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_before" = "$GITHUB_SHA"
          live_main="$(git ls-remote --heads origin refs/heads/main | awk 'NR==1 {print $1}')"
          test "$live_main" = "$EXPECTED_MAIN"

          git commit -m "fix(pr1128): integrate current main and rebind exact subject"
          successor="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          git push origin "HEAD:refs/heads/$TARGET_REF"

          remote_after="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_after" = "$successor"
          printf 'SUCCESSOR_HEAD=%s\nSUCCESSOR_TREE=%s\n' "$successor" "$tree"
          printf 'PUBLICATION_EFFECT_ACK_DONE=true\n'
          printf 'PREDECESSOR_EVIDENCE_TRANSFER=false\n'
          printf 'REPOSITORY_EFFECT_ACK_DONE=false\n'
