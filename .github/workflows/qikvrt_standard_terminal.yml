name: QIKVRT standard terminal reflexive projection

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "QIKVRT reflexive repository watchdog"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "state/autonomy/STANDARD_TERMINAL_PATTERN_V1.json"
      - "tools/qikvrt_standard_terminal.py"
      - "tests/test_qikvrt_standard_terminal.py"
      - "docs/STANDARD_TERMINAL_PATTERN.md"
      - ".github/workflows/qikvrt_standard_terminal.yml"
      - ".github/workflows/qikvrt_workflow_executor.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: qikvrt-standard-terminal-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reflect-outward-and-inward:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve exact watchdog source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SOURCE_RUN: ${{ github.event.workflow_run.id || '' }}
          EVENT_SOURCE_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          source_run="$EVENT_SOURCE_RUN"
          source_head="$EVENT_SOURCE_HEAD"
          if test -z "$source_run"; then
            live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            source_run="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_reflexive_repository_watchdog.yml/runs?branch=main&status=completed&per_page=100" \
                | jq -r --arg head "$live_main" \
                  '[.workflow_runs[] | select(.head_sha == $head and .conclusion == "success")][0].id // empty'
            )"
            source_head="$live_main"
          fi
          test -n "$source_run"
          test -n "$source_head"
          printf 'run_id=%s\n' "$source_run" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$source_head" >> "$GITHUB_OUTPUT"

      - name: Check out the exact observed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reobserve source binding and load inward feedback
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
          EXPECTED_HEAD: ${{ steps.source.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/standard-terminal
          mkdir -p "$root"
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          tree="$(git rev-parse --verify HEAD^{tree})"
          printf '%s\n' "$EXPECTED_HEAD" > "$root/observed-head.txt"
          printf '%s\n' "$tree" > "$root/observed-tree.txt"

          source_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN")"
          test "$(jq -r '.head_sha' <<<"$source_meta")" = "$EXPECTED_HEAD"
          pr_number="$(jq -r '.pull_requests[0].number // empty' <<<"$source_meta")"
          if test -n "$pr_number"; then
            live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$pr_number" --jq '.head.sha')"
          else
            live_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          fi
          test "$live_head" = "$EXPECTED_HEAD"

          source_artifact="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
              | jq -r '[.artifacts[] | select(.expired == false and (.name | startswith("qikvrt-reflexive-repository-watchdog-")))][0].id // empty'
          )"
          test -n "$source_artifact"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$source_artifact/zip" > "$root/source.zip"
          unzip -p "$root/source.zip" reflexive-watchdog-receipt.json > "$root/reflexive-watchdog-receipt.json"
          test "$(jq -r '.head_sha' "$root/reflexive-watchdog-receipt.json")" = "$EXPECTED_HEAD"
          test "$(jq -r '.tree_sha' "$root/reflexive-watchdog-receipt.json")" = "$tree"

          previous_artifact="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              | jq -r --arg head "$EXPECTED_HEAD" \
                  '[.artifacts[] | select(.expired == false and (.name | startswith("qikvrt-standard-terminal-" + $head + "-")))] | sort_by(.created_at) | reverse | .[0].id // empty'
          )"
          if test -n "$previous_artifact"; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$previous_artifact/zip" > "$root/previous.zip" || true
            unzip -p "$root/previous.zip" terminal-inward.json > "$root/previous-terminal-inward.json" 2>/dev/null || true
          fi

      - name: Project one semantic event outward and inward at every terminal locus
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/standard-terminal
          args=(project-watchdog --receipt "$root/reflexive-watchdog-receipt.json" --out-dir "$root")
          if test -s "$root/previous-terminal-inward.json"; then
            args+=(--previous-inward "$root/previous-terminal-inward.json")
          fi
          python3 -B tools/qikvrt_standard_terminal.py "${args[@]}" > "$root/aggregate.json"
          jq '{classification, blocks_productive_progress, admit_productive_writer, admit_observer, requires_human, next_actions}' "$root/terminal-inward.json"

      - name: Consume inward projection as exact-head observer admission
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/standard-terminal
          python3 -B tools/qikvrt_standard_terminal.py admit \
            --inward "$root/terminal-inward.json" \
            --expect-head "$(cat "$root/observed-head.txt")" \
            --expect-tree "$(cat "$root/observed-tree.txt")" \
            --mode observer --json > "$root/observer-admission.json"
          test "$(jq -r '.state' "$root/observer-admission.json")" = ADMIT

      - name: Verify terminal pattern contract and negative controls
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_standard_terminal \
            tests.test_qikvrt_reflexive_repository_watchdog \
            tests.test_qikvrt_workflow_executor_mesh_contract

      - name: Preserve exact-head outward and inward terminal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-standard-terminal-${{ steps.source.outputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: .qikvrt/standard-terminal
