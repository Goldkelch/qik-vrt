name: QIKVRT Mesh Linux appliance release

on:
  push:
    branches: [release/qikvrt-mesh-linux-v1.0.0]
  pull_request:
    paths:
      - '.github/workflows/qikvrt_mesh_linux_release.yml'
      - 'tools/qikvrt_mesh_linux_release.py'
      - 'tools/qikvrt_mesh_linux_release_v2.py'
      - 'policy/QIKVRT_MESH_LINUX_RELEASE_V1.json'
      - 'release/QIKVRT_MESH_LINUX_1_0_0_AUTHORIZATION.json'
      - 'docs/QIKVRT_MESH_LINUX_RELEASE_V1.md'
      - 'tests/test_qikvrt_mesh_linux_release.py'
      - 'REPOSITORY_FILE_MANIFEST.json'
      - 'REPOSITORY_FILE_MANIFEST.json.sha256'
      - 'SHA256SUMS.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-mesh-linux-release-v1.0.0-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  VERSION: 1.0.0
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RELEASE_TAG: qikvrt-mesh-linux-v1.0.0
  IMAGE: ghcr.io/goldkelch/qik-vrt-mesh-linux:1.0.0
  GHCR_REPOSITORY: goldkelch/qik-vrt-mesh-linux
  GHCR_PUBLIC_PROBE_TAG: ${{ vars.QIKVRT_GHCR_PUBLIC_PROBE_TAG }}
  GHCR_PUBLIC_PROBE_DIGEST: ${{ vars.QIKVRT_GHCR_PUBLIC_PROBE_DIGEST }}
  RELEASE_BRANCH: release/qikvrt-mesh-linux-v1.0.0
  MIN_UBUNTU_RELEASE_EPOCH: '1785542400'
  MAX_SUPPORTED_BUILD_EPOCH: '4102444800'
  TRUSTED_HOST_CLOCK_SKEW_SECONDS: '30'
  TRUSTED_HOST_EPOCH_MAX_AGE_SECONDS: '7200'
  LIBGUESTFS_CLOCK_CUSHION_SECONDS: '300'
  LIBGUESTFS_CLOCK_OBSERVATION_WINDOW_SECONDS: '30'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build_ready: ${{ steps.mode.outputs.build_ready }}
      publish_ready: ${{ steps.mode.outputs.publish_ready }}
      source_tree: ${{ steps.mode.outputs.source_tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0, persist-credentials: false}
      - id: mode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -B -m unittest -v tests.test_qikvrt_mesh_linux_release
          python3 -B tools/qikvrt_integrity.py verify
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          build_ready=false
          publish_ready=false
          carrier_subject='release: reattest QIK-VRT Mesh Linux v1.0.0 exact tree'
          case "$GITHUB_EVENT_NAME" in
            pull_request|workflow_dispatch)
              build_ready=true
              ;;
            push)
              if [ "$GITHUB_REF" != "refs/heads/$RELEASE_BRANCH" ]; then
                echo "BLOCK: release push is not on $RELEASE_BRANCH" >&2
                exit 2
              fi
              build_ready=true
              if [ "$(git show -s --format=%s HEAD)" = "$carrier_subject" ]; then
                parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
                if [ "$parent_count" -ne 1 ]; then
                  echo 'BLOCK: exact release carrier must have one parent' >&2
                  exit 2
                fi
                if [ "$(git rev-parse 'HEAD^1^{tree}')" != "$(git rev-parse 'HEAD^{tree}')" ]; then
                  echo 'BLOCK: exact release carrier must be zero-diff' >&2
                  exit 2
                fi
                build_ready=true
                publish_ready=true
              fi
              ;;
            *)
              echo "BLOCK: unsupported event $GITHUB_EVENT_NAME" >&2
              exit 2
              ;;
          esac
          echo "build_ready=$build_ready" >> "$GITHUB_OUTPUT"
          echo "publish_ready=$publish_ready" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0, persist-credentials: false}
      - name: Provision and verify native libguestfs host appliance
        env:
          QIKVRT_BUILD_ARCH: ${{ matrix.arch }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_time_headers="$RUNNER_TEMP/qikvrt-trusted-time.headers"
          if ! curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --max-time 30 --retry 4 --retry-all-errors \
            --dump-header "$trusted_time_headers" --output /dev/null \
            --header 'Accept: application/vnd.github+json' \
            --header 'Cache-Control: no-cache' \
            --header "Authorization: Bearer $GITHUB_API_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/rate_limit?qikvrt_clock=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$QIKVRT_BUILD_ARCH"; then
            echo 'BLOCK: trusted GitHub API time probe failed' >&2
            exit 2
          fi
          trusted_http_date="$(awk '
            tolower(substr($0, 1, 5)) == "date:" {
              line=$0
              sub(/\r$/, "", line)
              sub(/^[^:]*:[[:space:]]*/, "", line)
              value=line
            }
            END {print value}
          ' "$trusted_time_headers")"
          if ! trusted_remote_epoch="$(LC_ALL=C date -u -d "$trusted_http_date" +%s)"; then
            echo 'BLOCK: trusted GitHub API Date header is missing or invalid' >&2
            exit 2
          fi
          runner_epoch="$(date -u +%s)"
          case "$trusted_remote_epoch:$runner_epoch" in
            *[!0-9:]*) echo 'BLOCK: trusted or runner UTC epoch is invalid' >&2; exit 2 ;;
          esac
          if (( trusted_remote_epoch < MIN_UBUNTU_RELEASE_EPOCH || trusted_remote_epoch > MAX_SUPPORTED_BUILD_EPOCH || runner_epoch < MIN_UBUNTU_RELEASE_EPOCH || runner_epoch > MAX_SUPPORTED_BUILD_EPOCH )); then
            echo "BLOCK: trusted or runner UTC epoch outside supported build window: $trusted_remote_epoch/$runner_epoch" >&2
            exit 2
          fi
          if (( runner_epoch < trusted_remote_epoch - TRUSTED_HOST_CLOCK_SKEW_SECONDS || runner_epoch > trusted_remote_epoch + TRUSTED_HOST_CLOCK_SKEW_SECONDS )); then
            echo "BLOCK: runner UTC epoch disagrees with trusted GitHub API time: $runner_epoch/$trusted_remote_epoch" >&2
            exit 2
          fi
          check_date=true
          check_valid_until=true
          apt_get_check_date=true
          apt_get_check_valid_until=true
          if ! apt_values="$(apt-config shell \
            check_date Acquire::Check-Date/b \
            check_valid_until Acquire::Check-Valid-Until/b \
            apt_get_check_date Binary::apt-get::Acquire::Check-Date/b \
            apt_get_check_valid_until Binary::apt-get::Acquire::Check-Valid-Until/b)"; then
            echo 'BLOCK: host APT date-verification configuration could not be read' >&2
            exit 2
          fi
          eval "$apt_values"
          if [ "$check_date" != true ] || [ "$check_valid_until" != true ] ||
             [ "$apt_get_check_date" != true ] || [ "$apt_get_check_valid_until" != true ]; then
            echo 'BLOCK: host APT date verification is disabled' >&2
            exit 2
          fi
          apt_source_date_override_regex='(^[[:space:]]*(Check-Date|Check-Valid-Until)[[:space:]]*:)|(^[[:space:]]*deb(-src)?[[:space:]]+\[[^]]*(check-date|check-valid-until)[[:space:]]*=)'
          set +e
          grep -ERisq --include='sources.list' --include='*.list' --include='*.sources' \
            "$apt_source_date_override_regex" /etc/apt
          apt_source_status=$?
          set -e
          case "$apt_source_status" in
            0) echo 'BLOCK: host APT source contains a per-source date-verification override' >&2; exit 2 ;;
            1) ;;
            *) echo 'BLOCK: host APT source date-verification configuration could not be read' >&2; exit 2 ;;
          esac
          sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Check-Date=true -o Acquire::Check-Valid-Until=true update
          trusted_host_epoch="$(date -u +%s)"
          case "$trusted_host_epoch" in
            ''|*[!0-9]*) echo "BLOCK: trusted runner UTC epoch is invalid: $trusted_host_epoch" >&2; exit 2 ;;
          esac
          if (( trusted_host_epoch < MIN_UBUNTU_RELEASE_EPOCH || trusted_host_epoch > MAX_SUPPORTED_BUILD_EPOCH )); then
            echo "BLOCK: trusted runner UTC epoch outside supported build window: $trusted_host_epoch" >&2
            exit 2
          fi
          if (( trusted_host_epoch < trusted_remote_epoch - TRUSTED_HOST_CLOCK_SKEW_SECONDS || trusted_host_epoch > trusted_remote_epoch + TRUSTED_HOST_EPOCH_MAX_AGE_SECONDS )); then
            echo "BLOCK: post-APT runner UTC epoch escaped trusted GitHub API time: $trusted_host_epoch/$trusted_remote_epoch" >&2
            exit 2
          fi
          echo "QIKVRT_TRUSTED_HOST_EPOCH=$trusted_host_epoch" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends curl jq zip unzip xz-utils zstd gnupg qemu-utils libguestfs-tools guestfs-tools linux-image-virtual dhcpcd-base ipxe-qemu
          command -v dhcpcd >/dev/null || { echo 'BLOCK: dhcpcd-base installed no dhcpcd appliance client' >&2; exit 2; }
          [ -r /etc/dhcpcd.conf ] || { echo 'BLOCK: dhcpcd-base installed no readable dhcpcd.conf' >&2; exit 2; }
          [ -r /usr/lib/ipxe/qemu/efi-virtio.rom ] || { echo 'BLOCK: ipxe-qemu installed no efi-virtio.rom' >&2; exit 2; }
          supermin_dirs_file="$RUNNER_TEMP/qikvrt-supermin-dirs.txt"
          find /usr/lib -type d -path '*/guestfs/supermin.d' -print | sort > "$supermin_dirs_file"
          mapfile -t supermin_dirs < "$supermin_dirs_file"
          if [ "${#supermin_dirs[@]}" -eq 0 ]; then
            echo 'BLOCK: installed libguestfs exposes no supermin.d package input' >&2
            exit 2
          fi
          for supermin_dir in "${supermin_dirs[@]}"; do
            dhcp_package_fragment="$supermin_dir/zzz-qikvrt-dhcp-packages"
            dhcp_hostfiles_fragment="$supermin_dir/zzz-qikvrt-dhcp-hostfiles"
            printf '%s\n' 'dhcpcd-base' | sudo tee "$dhcp_package_fragment" >/dev/null
            printf '%s\n' '/etc/dhcpcd.conf' | sudo tee "$dhcp_hostfiles_fragment" >/dev/null
            sudo chmod 0644 "$dhcp_package_fragment" "$dhcp_hostfiles_fragment"
            [ -r "$dhcp_package_fragment" ] && [ -r "$dhcp_hostfiles_fragment" ] || {
              echo "BLOCK: unprivileged supermin builder cannot read DHCP inputs in $supermin_dir" >&2
              exit 2
            }
            grep -Fqx 'dhcpcd-base' "$dhcp_package_fragment" &&
              grep -Fqx '/etc/dhcpcd.conf' "$dhcp_hostfiles_fragment" || {
              echo "BLOCK: unprivileged supermin DHCP inputs readback failed in $supermin_dir" >&2
              exit 2
            }
          done
          mapfile -t generic_kernels < <(find /boot -maxdepth 1 -type f -name 'vmlinuz-*-generic' -print | sort -V)
          if [ "${#generic_kernels[@]}" -eq 0 ]; then
            echo 'BLOCK: linux-image-virtual installed no generic supermin appliance kernel' >&2
            exit 2
          fi
          export SUPERMIN_KERNEL="${generic_kernels[${#generic_kernels[@]}-1]}"
          export SUPERMIN_KERNEL_VERSION="${SUPERMIN_KERNEL#/boot/vmlinuz-}"
          export SUPERMIN_MODULES="/lib/modules/$SUPERMIN_KERNEL_VERSION"
          generic_config="/boot/config-$SUPERMIN_KERNEL_VERSION"
          [ -e "$generic_config" ] || { echo "BLOCK: generic supermin kernel config is missing: $generic_config" >&2; exit 2; }
          sudo chmod a+r "$SUPERMIN_KERNEL" "$generic_config"
          [ -r "$SUPERMIN_KERNEL" ] || { echo "BLOCK: generic supermin kernel is unreadable: $SUPERMIN_KERNEL" >&2; exit 2; }
          [ -d "$SUPERMIN_MODULES" ] || { echo "BLOCK: generic supermin modules are missing: $SUPERMIN_MODULES" >&2; exit 2; }
          [ -r "$generic_config" ] || { echo "BLOCK: generic supermin kernel config is unreadable: $generic_config" >&2; exit 2; }
          if grep -qx 'CONFIG_IPV6_SIT=y' "$generic_config"; then
            echo "BLOCK: generic supermin kernel has CONFIG_IPV6_SIT built in: $generic_config" >&2
            exit 2
          fi
          export LIBGUESTFS_CACHEDIR="$(mktemp -d "$RUNNER_TEMP/qikvrt-libguestfs-cache.XXXXXX")"
          for variable in SUPERMIN_KERNEL SUPERMIN_KERNEL_VERSION SUPERMIN_MODULES LIBGUESTFS_CACHEDIR; do
            printf '%s=%s\n' "$variable" "${!variable}" >> "$GITHUB_ENV"
          done
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            export LIBGUESTFS_BACKEND_SETTINGS=force_tcg
            echo 'LIBGUESTFS_BACKEND_SETTINGS=force_tcg' >> "$GITHUB_ENV"
          fi
          LIBGUESTFS_BACKEND=direct libguestfs-test-tool
          case "$QIKVRT_BUILD_ARCH" in
            amd64) mirror=archive.ubuntu.com ;;
            arm64) mirror=ports.ubuntu.com ;;
            *) echo "BLOCK: unsupported native architecture $QIKVRT_BUILD_ARCH" >&2; exit 2 ;;
          esac
          probe_disk="$RUNNER_TEMP/qikvrt-libguestfs-network-probe.raw"
          probe_script="$RUNNER_TEMP/qikvrt-libguestfs-network-probe.sh"
          host_epoch="$(date -u +%s)"
          case "$host_epoch" in
            ''|*[!0-9]*) echo "BLOCK: runner UTC epoch is invalid: $host_epoch" >&2; exit 2 ;;
          esac
          if (( host_epoch < MIN_UBUNTU_RELEASE_EPOCH || host_epoch > MAX_SUPPORTED_BUILD_EPOCH )); then
            echo "BLOCK: runner UTC epoch outside supported build window: $host_epoch" >&2
            exit 2
          fi
          if (( host_epoch < trusted_host_epoch - TRUSTED_HOST_CLOCK_SKEW_SECONDS || host_epoch > trusted_host_epoch + TRUSTED_HOST_EPOCH_MAX_AGE_SECONDS )); then
            echo "BLOCK: runner UTC epoch escaped trusted post-APT anchor: $host_epoch" >&2
            exit 2
          fi
          target_epoch=$((host_epoch + LIBGUESTFS_CLOCK_CUSHION_SECONDS))
          if (( target_epoch + LIBGUESTFS_CLOCK_OBSERVATION_WINDOW_SECONDS > MAX_SUPPORTED_BUILD_EPOCH )); then
            echo "BLOCK: cushioned appliance UTC epoch exceeds supported build window: $target_epoch" >&2
            exit 2
          fi
          qemu-img create -f raw "$probe_disk" 32M
          printf '%s\n' \
            '#!/bin/bash' \
            'set -euo pipefail' \
            'mirror=${1:?missing Ubuntu mirror}' \
            'host_epoch=${2:?missing runner UTC epoch}' \
            'minimum_epoch=${3:?missing Ubuntu release epoch}' \
            'maximum_epoch=${4:?missing maximum build epoch}' \
            'clock_window=${5:?missing appliance clock window}' \
            'case "$host_epoch:$minimum_epoch:$maximum_epoch:$clock_window" in *[!0-9:]*) echo "Appliance received invalid UTC epoch bounds" >&2; exit 13 ;; esac' \
            'if (( host_epoch < minimum_epoch || host_epoch > maximum_epoch )); then echo "Appliance received UTC epoch outside supported build window: $host_epoch" >&2; exit 13; fi' \
            'if ! date -u -s "@$host_epoch" >/dev/null; then echo "Appliance UTC clock synchronization failed" >&2; exit 14; fi' \
            'guest_epoch=$(date -u +%s)' \
            'if (( guest_epoch < host_epoch || guest_epoch > host_epoch + clock_window )); then echo "Appliance UTC clock outside synchronized window: $guest_epoch" >&2; exit 14; fi' \
            'echo QIKVRT_LIBGUESTFS_CLOCK_PREFLIGHT=OK' \
            'if ! test -r /etc/dhcpcd.conf; then echo "Appliance DHCP configuration missing: /etc/dhcpcd.conf" >&2; exit 15; fi' \
            'if ! command -v dhcpcd >/dev/null; then echo "Appliance DHCP client missing: dhcpcd" >&2; exit 16; fi' \
            'if ! ip -4 -o addr show dev eth0 scope global | grep . >/dev/null; then echo "Appliance IPv4 address missing: eth0" >&2; exit 17; fi' \
            'if ! ip -4 route show default | grep . >/dev/null; then echo "Appliance default route missing" >&2; exit 18; fi' \
            'if ! test -s /etc/resolv.conf; then echo "Appliance resolver configuration missing" >&2; exit 19; fi' \
            'if ! getent ahostsv4 "$mirror" >/dev/null; then echo "DNS lookup failed: $mirror" >&2; exit 20; fi' \
            'if ! exec 3<>"/dev/tcp/${mirror}/80"; then echo "TCP connect failed: $mirror:80" >&2; exit 21; fi' \
            'exec 3>&-' \
            'exec 3<&-' > "$probe_script"
          bash -n "$probe_script"
          if ! LIBGUESTFS_BACKEND=direct LIBGUESTFS_DEBUG=1 LIBGUESTFS_TRACE=1 \
            timeout --kill-after=15s 180s \
            guestfish --network --rw --format=raw -a "$probe_disk" run : \
            debug-upload "$probe_script" /tmp/qikvrt-libguestfs-network-probe.sh 384 : \
            debug sh "/bin/bash /tmp/qikvrt-libguestfs-network-probe.sh $mirror $target_epoch $MIN_UBUNTU_RELEASE_EPOCH $MAX_SUPPORTED_BUILD_EPOCH $LIBGUESTFS_CLOCK_OBSERVATION_WINDOW_SECONDS"; then
            echo "BLOCK: libguestfs appliance DNS/TCP preflight failed for $mirror" >&2
            exit 2
          fi
          echo 'QIKVRT_LIBGUESTFS_NETWORK_PREFLIGHT=OK'
      - name: Build VM/OCI and execute packaged Firefox Effect-Ack acceptance
        env:
          QIKVRT_BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/qikvrt-mesh-linux-$QIKVRT_BUILD_ARCH-build.log"
          if python3 -B tools/qikvrt_mesh_linux_release_v2.py build \
            --arch "$QIKVRT_BUILD_ARCH" --output "$RUNNER_TEMP/dist" \
            > "$build_log" 2>&1; then
            grep -E 'QIKVRT_[A-Z0-9_]+=.*' "$build_log" || true
            tail -n 200 "$build_log"
          else
            build_status=$?
            echo "BLOCK: native $QIKVRT_BUILD_ARCH build failed; bounded diagnostic tail follows" >&2
            tail -n 4000 "$build_log" >&2
            exit "$build_status"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-mesh-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*
          retention-days: 30
          if-no-files-found: error
      - name: Upload failed native-build diagnostic log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-mesh-linux-${{ matrix.arch }}-diagnostics
          path: ${{ runner.temp }}/qikvrt-mesh-linux-${{ matrix.arch }}-build.log
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: qikvrt-mesh-linux-publication-v1.0.0
      cancel-in-progress: false
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with: {pattern: 'qikvrt-mesh-linux-*', path: dist, merge-multiple: true}
      - name: Install repository-locked GitHub CLI 2.96.0
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/qikvrt-toolchains"
          QIKVRT_TOOLCHAIN_CACHE="$cache" sh tools/bootstrap-gh.sh --install --accept-third-party
          qikvrt_gh="$(QIKVRT_TOOLCHAIN_CACHE="$cache" sh tools/bootstrap-gh.sh --check-only --print-path)"
          echo "QIKVRT_GH=$qikvrt_gh" >> "$GITHUB_ENV"
      - env:
          IMMUTABILITY_TOKEN: '${{ secrets.QIKVRT_IMMUTABLE_ADMIN_READ_TOKEN }}'
          RELEASE_TOKEN: '${{ secrets.QIKVRT_RELEASE_WRITE_WORKFLOWS_TOKEN }}'
          REGISTRY_TOKEN: '${{ github.token }}'
          PREPARED_TREE: '${{ needs.prepare.outputs.source_tree }}'
        shell: bash
        run: |
          set -euo pipefail

          block() {
            echo "BLOCK: $*" >&2
            exit 2
          }

          assert_remote_head() {
            local rows status head
            set +e
            rows="$(git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" 2>&1)"
            status=$?
            set -e
            [ "$status" -eq 0 ] || block "release-branch probe failed with status $status"
            head="$(printf '%s\n' "$rows" | awk 'NR == 1 {print $1}')"
            [ "$head" = "$GITHUB_SHA" ] ||
              block "branch moved from workflow head $GITHUB_SHA to $head"
          }

          assert_release_namespace_vacant() {
            local rows status release_status
            set +e
            rows="$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" 2>&1)"
            status=$?
            set -e
            case "$status" in
              0) block "release tag $RELEASE_TAG exists" ;;
              2) ;;
              *) block "release-tag probe failed with status $status" ;;
            esac
            if ! release_status="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/release-probe.json" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $RELEASE_TOKEN" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"; then
              block 'release namespace transport probe failed'
            fi
            case "$release_status" in
              404) ;;
              200) block "release $RELEASE_TAG exists" ;;
              *) block "release namespace probe returned HTTP $release_status" ;;
            esac
          }

          assert_registry_vacant() {
            local bearer="$1" tag="$2" audience="$3" status body
            body="$RUNNER_TEMP/vacancy-$audience-$tag.json"
            if ! status="$(curl --silent --show-error \
              --output "$body" --write-out '%{http_code}' \
              --header "Authorization: Bearer $bearer" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/$GHCR_REPOSITORY/manifests/$tag")"; then
              block "$audience GHCR namespace transport probe failed for $tag"
            fi
            case "$status" in
              404)
                jq -e '
                  (.errors | type == "array" and length > 0) and
                  all(.errors[]; .code == "MANIFEST_UNKNOWN")
                ' "$body" >/dev/null ||
                  block "$audience GHCR target $tag returned a non-Distribution 404"
                ;;
              200) block "$audience GHCR target $tag exists" ;;
              *) block "$audience GHCR target $tag returned HTTP $status" ;;
            esac
          }

          fetch_manifest() {
            local bearer="$1" tag="$2" stem="$3" status digest body_digest
            if ! status="$(curl --silent --show-error \
              --dump-header "$RUNNER_TEMP/$stem.headers" \
              --output "$RUNNER_TEMP/$stem.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $bearer" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/$GHCR_REPOSITORY/manifests/$tag")"; then
              block "anonymous GHCR transport readback failed for $tag"
            fi
            [ "$status" = 200 ] || block "anonymous GHCR readback for $tag returned HTTP $status"
            digest="$(awk 'tolower($1) == "docker-content-digest:" {gsub("\r", "", $2); print $2}' "$RUNNER_TEMP/$stem.headers" | tail -n 1)"
            body_digest="sha256:$(sha256sum "$RUNNER_TEMP/$stem.json" | awk '{print $1}')"
            [ "$digest" = "$body_digest" ] || block "GHCR header/body digest mismatch for $tag"
            printf '%s\n' "$digest"
          }

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PREPARED_TREE"
          test "$(git show -s --format=%s HEAD)" = 'release: reattest QIK-VRT Mesh Linux v1.0.0 exact tree'
          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          if [ "$parent_count" -ne 1 ] ||
             [ "$(git rev-parse 'HEAD^1^{tree}')" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            block 'publication requires a single-parent zero-diff carrier'
          fi
          assert_remote_head
          python3 -B tools/qikvrt_mesh_linux_release_v2.py validate-build-assets dist

          [ -n "$IMMUTABILITY_TOKEN" ] ||
            block 'QIKVRT_IMMUTABLE_ADMIN_READ_TOKEN is not configured'
          [ -n "$RELEASE_TOKEN" ] ||
            block 'QIKVRT_RELEASE_WRITE_WORKFLOWS_TOKEN is not configured'
          if ! immutable="$(GH_TOKEN="$IMMUTABILITY_TOKEN" "$QIKVRT_GH" api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')"; then
            block 'immutable-release setting could not be verified'
          fi
          [ "$immutable" = true ] || block 'immutable releases are not enabled'
          if ! release_repo="$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $RELEASE_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY")"; then
            block 'release-token repository probe failed'
          fi
          printf '%s' "$release_repo" | jq -e '.permissions.push == true' >/dev/null ||
            block 'release token lacks repository push permission'
          assert_release_namespace_vacant

          case "$GHCR_PUBLIC_PROBE_TAG" in
            ''|*[!A-Za-z0-9_.-]*) block 'QIKVRT_GHCR_PUBLIC_PROBE_TAG is missing or invalid' ;;
          esac
          [[ "$GHCR_PUBLIC_PROBE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] ||
            block 'QIKVRT_GHCR_PUBLIC_PROBE_DIGEST is missing or invalid'

          if ! anonymous_token_json="$(curl --fail --silent --show-error --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$GHCR_REPOSITORY:pull" \
            'https://ghcr.io/token')"; then
            block 'anonymous GHCR token acquisition failed; package is not positively public'
          fi
          anonymous_bearer="$(printf '%s' "$anonymous_token_json" | jq -er '.token')"
          probe_digest="$(fetch_manifest "$anonymous_bearer" "$GHCR_PUBLIC_PROBE_TAG" public-probe)"
          [ "$probe_digest" = "$GHCR_PUBLIC_PROBE_DIGEST" ] ||
            block "public GHCR probe digest $probe_digest does not match bound digest"

          if ! authenticated_token_json="$(curl --fail --silent --show-error --get \
            --user "$GITHUB_ACTOR:$REGISTRY_TOKEN" \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$GHCR_REPOSITORY:pull,push" \
            'https://ghcr.io/token')"; then
            block 'authenticated GHCR token acquisition failed'
          fi
          authenticated_bearer="$(printf '%s' "$authenticated_token_json" | jq -er '.token')"
          for tag in "$VERSION" "$VERSION-amd64" "$VERSION-arm64"; do
            assert_registry_vacant "$authenticated_bearer" "$tag" authenticated
            assert_registry_vacant "$anonymous_bearer" "$tag" anonymous
          done

          assert_remote_head
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            test -s "dist/qikvrt-mesh-linux-$VERSION-$arch.firefox-effect-ack.json"
            jq -e \
              '.bounded_loopback_effect_ack_done == true and .effect_ack_done_scope == "BOUNDED_LOOPBACK_TERMINAL_INPUT_ONLY" and .external_effect == "NONE"' \
              "dist/qikvrt-mesh-linux-$VERSION-$arch.firefox-effect-ack.json" >/dev/null
            zstd -d "dist/qikvrt-mesh-linux-$VERSION-$arch.oci.tar.zst" -o "$RUNNER_TEMP/$arch.oci.tar"
            docker load -i "$RUNNER_TEMP/$arch.oci.tar"
            docker tag "qikvrt-mesh-linux:$VERSION" "$IMAGE-$arch"
            docker push "$IMAGE-$arch"
          done
          docker manifest create "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          docker manifest push "$IMAGE"
          docker logout ghcr.io

          if ! anonymous_token_json="$(curl --fail --silent --show-error --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:$GHCR_REPOSITORY:pull" \
            'https://ghcr.io/token')"; then
            block 'fresh anonymous GHCR token acquisition failed after push'
          fi
          anonymous_bearer="$(printf '%s' "$anonymous_token_json" | jq -er '.token')"

          amd64_digest="$(fetch_manifest "$anonymous_bearer" "$VERSION-amd64" published-amd64)"
          arm64_digest="$(fetch_manifest "$anonymous_bearer" "$VERSION-arm64" published-arm64)"
          digest="$(fetch_manifest "$anonymous_bearer" "$VERSION" published-index)"
          jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
            .manifests | length == 2 and
            ([.[] | .platform.os + "/" + .platform.architecture] | sort) ==
              ["linux/amd64", "linux/arm64"] and
            ([.[] | .digest] | sort) == ([$amd64, $arm64] | sort)
          ' "$RUNNER_TEMP/published-index.json" >/dev/null ||
            block 'anonymous GHCR index descriptors do not exactly bind amd64 and arm64'

          assert_remote_head
          python3 tools/qikvrt_mesh_linux_release_v2.py manifest \
            --assets dist --image "$IMAGE" --image-digest "$digest" \
            --head "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --output dist/QIKVRT_MESH_LINUX_RELEASE_MANIFEST.json
          (cd dist && find . -mindepth 1 -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
          python3 -B tools/qikvrt_mesh_linux_release_v2.py validate-release-assets dist

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          QIK-VRT Mesh Linux $VERSION; exact source $GITHUB_SHA.
          OCI: $IMAGE@$digest
          Both architecture-specific appliance images executed Firefox and produced a reobserved bounded loopback terminal-input Effect-Ack receipt before publication.
          Effect-Ack scope: BOUNDED_LOOPBACK_TERMINAL_INPUT_ONLY; external_effect=NONE.
          A general EFFECT_ACK_DONE is not claimed. Physical Mega-ST execution is not claimed.
          No PASS, FINAL_PASS, independent review authority, or general Internet reachability is implied.
          EOF

          assert_remote_head
          assert_release_namespace_vacant
          GH_TOKEN="$RELEASE_TOKEN" "$QIKVRT_GH" release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "QIK-VRT Mesh Linux $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
          immutable="$(GH_TOKEN="$RELEASE_TOKEN" "$QIKVRT_GH" release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable')"
          [ "$immutable" = true ] || block 'published release is not reported immutable'
          GH_TOKEN="$RELEASE_TOKEN" "$QIKVRT_GH" release verify "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"
          GH_TOKEN="$RELEASE_TOKEN" "$QIKVRT_GH" release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/release-assets.json"
          python3 -B tools/qikvrt_mesh_linux_release_v2.py validate-release-readback \
            dist "$RUNNER_TEMP/release-assets.json"
          for asset in dist/*; do
            GH_TOKEN="$RELEASE_TOKEN" "$QIKVRT_GH" release verify-asset \
              "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done


  disposition:
    needs: [prepare, build, publish]
    if: always()
    runs-on: ubuntu-24.04
    env:
      PREPARE_RESULT: '${{ needs.prepare.result }}'
      BUILD_RESULT: '${{ needs.build.result }}'
      PUBLISH_RESULT: '${{ needs.publish.result }}'
      BUILD_READY: '${{ needs.prepare.outputs.build_ready }}'
      PUBLISH_READY: '${{ needs.prepare.outputs.publish_ready }}'
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          if [ "$PREPARE_RESULT" != success ]; then
            echo "BLOCK: prepare result is $PREPARE_RESULT" >&2
            exit 2
          fi
          if [ "$BUILD_READY" = true ] && [ "$BUILD_RESULT" != success ]; then
            echo "BLOCK: required native build result is $BUILD_RESULT" >&2
            exit 2
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$PUBLISH_READY" != true ]; then
            echo 'HOLD: non-carrier release-branch head built; publication is not authorized' >&2
            exit 2
          fi
          if [ "$PUBLISH_READY" = true ] && [ "$PUBLISH_RESULT" != success ]; then
            echo "BLOCK: required publication result is $PUBLISH_RESULT" >&2
            exit 2
          fi
          echo 'QIKVRT_MESH_LINUX_WORKFLOW_DISPOSITION=SUCCESS'
