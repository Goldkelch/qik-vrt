name: Reconcile ontological-priority Zenodo publication

on:
  push:
    branches:
      - policy/universal-proof-thought-schema-v1
    paths:
      - ".github/workflows/qikvrt_ontological_priority_zenodo_reconcile.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: qikvrt-ontological-priority-zenodo-reconcile-v1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_EXECUTION_HEAD: 0763f0cc7d1a62e465c730d3e6786ae4cddf0287
      RECOVERY_ARTIFACT_ID: "10855448703"
      EXPECTED_EVIDENCE_SHA256: bcb114b69f0c045b69a7cafcb88c38c7ba1a38a1739718a971c28dcc4d9c33ad
      EXPECTED_RECORD_ID: "22955727"
      EXPECTED_DOI: 10.5281/zenodo.22955727
      CONSUMPTION_REF: refs/tags/qikvrt-zenodo-auth/c4531212abf09363c5eb1e82042d73a41c7d959de9f9254f7b9b2f3d79690ddf
      EXPECTED_TAG_OBJECT: 41cca9fb908bd818e5eb6dc9ae616151619c73b7
      MANIFEST_PATH: release/ontological-priority-of-difference-zenodo-v1/publish-request.json
      EVIDENCE_PATH: release/ontological-priority-of-difference-zenodo-v1/zenodo-publication.json
      ZENODO_API_BASE: https://zenodo.org/api
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Check out reconciliation controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download exact recovery evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery"
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_ARTIFACT_ID/zip"             -o "$RUNNER_TEMP/recovery.zip"
          unzip -q "$RUNNER_TEMP/recovery.zip" -d "$RUNNER_TEMP/recovery"
          recovery="$(
            find "$RUNNER_TEMP/recovery" -type f               -path "*/release/ontological-priority-of-difference-zenodo-v1/zenodo-publication.json"               -print -quit
          )"
          test -n "$recovery"
          test "$(sha256sum "$recovery" | awk '{print $1}')" = "$EXPECTED_EVIDENCE_SHA256"
          echo "RECOVERY_EVIDENCE=$recovery" >> "$GITHUB_ENV"

      - name: Verify immutable recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify "$TARGET_EXECUTION_HEAD^{commit}")" = "$TARGET_EXECUTION_HEAD"
          tag_object="$(
            git ls-remote origin "$CONSUMPTION_REF" |
              awk 'NR == 1 {print $1}'
          )"
          peeled="$(
            git ls-remote origin "$CONSUMPTION_REF^{}" |
              awk 'NR == 1 {print $1}'
          )"
          test "$tag_object" = "$EXPECTED_TAG_OBJECT"
          test "$peeled" = "$TARGET_EXECUTION_HEAD"

      - name: Prepare exact execution worktree
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/qikvrt-ontological-priority-recovery"
          git worktree add --detach "$target" "$TARGET_EXECUTION_HEAD"
          mkdir -p "$target/$(dirname "$EVIDENCE_PATH")"
          cp "$RECOVERY_EVIDENCE" "$target/$EVIDENCE_PATH"
          chmod 600 "$target/$EVIDENCE_PATH"
          test "$(sha256sum "$target/$EVIDENCE_PATH" | awk '{print $1}')" = "$EXPECTED_EVIDENCE_SHA256"
          test -f "$target/$MANIFEST_PATH"
          echo "path=$target" >> "$GITHUB_OUTPUT"

      - name: Resume exact publication and verify public bytes
        id: publish
        timeout-minutes: 25
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          TARGET_WORKTREE: ${{ steps.target.outputs.path }}
        run: |
          set -euo pipefail
          cd "$TARGET_WORKTREE"
          export GITHUB_SHA="$TARGET_EXECUTION_HEAD"
          export GITHUB_REPOSITORY="Goldkelch/qik-vrt"
          python3 -B tools/qikvrt_zenodo_publish.py             --manifest "$MANIFEST_PATH"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ["EVIDENCE_PATH"]).read_text(encoding="utf-8"))
          if value.get("state") != "published":
              raise SystemExit("BLOCK: reconciliation did not reach published")
          if str(value.get("record_id")) != os.environ["EXPECTED_RECORD_ID"]:
              raise SystemExit("BLOCK: record id differs")
          if value.get("doi") != os.environ["EXPECTED_DOI"]:
              raise SystemExit("BLOCK: DOI differs")
          if value.get("phase") != "public_verified":
              raise SystemExit("BLOCK: public verification phase differs")
          if value.get("recovery",{}).get("public_verified") is not True:
              raise SystemExit("BLOCK: public_verified flag differs")
          print("ZENODO_PUBLICATION_STATE=published")
          print("ZENODO_DOI=" + value["doi"])
          print("ZENODO_RECORD_ID=" + str(value["record_id"]))
          print("ZENODO_CONCEPT_DOI=" + str(value.get("conceptdoi")))
          print("ZENODO_RECORD_URL=" + str(value.get("record_url")))
          PY

      - name: Persist terminal publication receipt on dedicated branch
        id: persist
        shell: bash
        env:
          TARGET_WORKTREE: ${{ steps.target.outputs.path }}
        run: |
          set -euo pipefail
          cp "$TARGET_WORKTREE/$EVIDENCE_PATH" "$EVIDENCE_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

          receipt_branch="receipt/ontological-priority-zenodo-22955727-$GITHUB_RUN_ID"
          git switch -c "$receipt_branch"
          git config user.name 'qik-vrt-zenodo-publication[bot]'
          git config user.email 'qik-vrt-zenodo-publication[bot]@users.noreply.github.com'
          git add --             "$EVIDENCE_PATH"             REPOSITORY_FILE_MANIFEST.json             REPOSITORY_FILE_MANIFEST.json.sha256             SHA256SUMS.txt
          git diff --cached --check
          git commit -m 'zenodo: persist terminal ontological-priority public readback'
          git push origin "HEAD:refs/heads/$receipt_branch"
          echo "branch=$receipt_branch" >> "$GITHUB_OUTPUT"

      - name: Preserve terminal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ontological-priority-zenodo-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: ignore
          path: |
            ${{ steps.target.outputs.path }}/${{ env.EVIDENCE_PATH }}
            ${{ env.EVIDENCE_PATH }}
