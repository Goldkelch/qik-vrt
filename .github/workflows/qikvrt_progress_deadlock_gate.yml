name: QIKVRT progress-deadlock gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  progress-deadlocks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile progress-deadlock contracts
        run: python3 -m py_compile tests/test_progress_deadlocks.py tests/test_terminal_monitor_stream_e2e.py tools/qikvrt_live_sse.py
      - name: Enforce progress-deadlock regressions
        run: python3 -B -m unittest -v tests.test_progress_deadlocks tests.test_terminal_monitor_stream_e2e
