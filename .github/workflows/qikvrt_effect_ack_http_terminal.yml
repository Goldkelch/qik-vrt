# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: QIKVRT EFFECT_ACK HTTP Firefox terminal

on:
  pull_request:
    paths:
      - "external/ietf/draft-lohmann-qikvrt-effect-ack-http-00.xml"
      - "policy/QIKVRT_EFFECT_ACK_HTTP_TERMINAL_V1.json"
      - "browser/firefox/qikvrt-terminal/**"
      - "docs/terminal/QIKVRT_TERMINAL_FRAME_V1.schema.json"
      - "docs/terminal/FIREFOX_EFFECT_ACK_TERMINAL_PROXY_V1.md"
      - "docs/atari-terminal/**"
      - "src/qikvrt_effect_ack_http_terminal.py"
      - "tools/qikvrt_atari_firefox_e2e.py"
      - "tools/qikvrt_candidate_tls_server.py"
      - "tools/bootstrap-runtime.sh"
      - "tools/ai_runtime_bootloader.py"
      - "runtime/toolchains/TOOLCHAIN.lock.tsv"
      - "runtime/toolchains/CACHE_REGISTRY.json"
      - "runtime/toolchains/CACHE_COVERAGE.json"
      - "tests/test_qikvrt_effect_ack_http_terminal.py"
      - "tests/test_qikvrt_atari_terminal.py"
      - "tests/test_qikvrt_firefox_universal_pr_terminal.py"
      - "tests/test_qikvrt_atari_firefox_e2e.py"
      - "tests/test_qikvrt_candidate_tls_server.py"
      - "tests/test_ai_runtime_bootloader.py"
      - "MLP.TOS/Hatari"
      - "MLP.TOS/MLP.TOS"
      - "MLP.TOS/MLP.TOS.sha256"
      - ".github/workflows/qikvrt_effect_ack_http_terminal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify declared runtime tool cache
        run: python3 -B tools/qikvrt_tool_cache.py verify

      - name: Parse machine-readable contracts and RFCXML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool policy/QIKVRT_EFFECT_ACK_HTTP_TERMINAL_V1.json >/dev/null
          python3 -m json.tool browser/firefox/qikvrt-terminal/manifest.json >/dev/null
          python3 -m json.tool docs/terminal/QIKVRT_TERMINAL_FRAME_V1.schema.json >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('external/ietf/draft-lohmann-qikvrt-effect-ack-03.xml')
          ET.parse('external/ietf/draft-lohmann-qikvrt-effect-ack-http-00.xml')
          PY

      - name: Install locked RFCXML renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r runtime/toolchains/requirements-xml2rfc-3.34.0.txt
          test "$(xml2rfc --version | head -n1)" = "xml2rfc 3.34.0"

      - name: Render core and companion Internet-Drafts as TXT and HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-ietf-render
          for draft in draft-lohmann-qikvrt-effect-ack-03 draft-lohmann-qikvrt-effect-ack-http-00; do
            xml2rfc "external/ietf/${draft}.xml" --v3 --text --skip-config-files --out "/tmp/qikvrt-ietf-render/${draft}.txt"
            xml2rfc "external/ietf/${draft}.xml" --v3 --html --skip-config-files --out "/tmp/qikvrt-ietf-render/${draft}.html"
            test -s "/tmp/qikvrt-ietf-render/${draft}.txt"
            test -s "/tmp/qikvrt-ietf-render/${draft}.html"
          done

      - name: Check Python syntax
        run: |
          python3 -m py_compile src/qikvrt_effect_ack_http_terminal.py tests/test_qikvrt_effect_ack_http_terminal.py

      - name: Check Firefox JavaScript syntax
        run: |
          node --check browser/firefox/qikvrt-terminal/background.js
          node --check browser/firefox/qikvrt-terminal/content.js
          node --check browser/firefox/qikvrt-terminal/options.js

      - name: Run HTTP terminal contract and E2E tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python3 -B -m unittest -v tests.test_qikvrt_effect_ack_http_terminal tests.test_qikvrt_atari_terminal tests.test_qikvrt_firefox_universal_pr_terminal

      - name: Package verified Firefox reference client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-firefox-package
          (
            cd browser/firefox/qikvrt-terminal
            zip -X -9 /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi \
              manifest.json background.js content.js review_effect.js terminal.css options.html options.js README.md
          )
          sha256sum /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi \
            > /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi.sha256
          test -s /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi
          test -s /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi.sha256
          unzip -Z1 /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi | \
            grep -Fx 'review_effect.js'

      - name: Preserve verified Firefox package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-firefox-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/qikvrt-firefox-package
          if-no-files-found: error
          retention-days: 30

  atari-firefox-e2e:
    needs: contract-and-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Initialize exact candidate evidence directory
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qikvrt-atari-firefox-e2e"
          mkdir -p "$evidence" "$evidence/tmp" "$evidence/profile-root"
          printf 'QIKVRT_ATARI_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"

      - name: Verify browser runtime contracts before use
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_ai_runtime_bootloader \
            tests.test_qikvrt_atari_terminal \
            tests.test_qikvrt_firefox_universal_pr_terminal \
            tests.test_qikvrt_atari_firefox_e2e \
            tests.test_qikvrt_candidate_tls_server \
            tests.test_qikvrt_effect_ack_http_terminal
          node --check browser/firefox/qikvrt-terminal/background.js
          node --check browser/firefox/qikvrt-terminal/content.js

      - name: Provision and bind authenticated Firefox X11, Hatari and Xvfb runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends hatari xauth xvfb
          command -v firefox
          command -v xauth
          command -v Xvfb
          firefox --version | tee "$QIKVRT_ATARI_EVIDENCE/firefox-version.txt"
          xauth -V | tee "$QIKVRT_ATARI_EVIDENCE/xauth-version.txt"
          set +e
          hatari --version > "$QIKVRT_ATARI_EVIDENCE/hatari-version.txt" 2>&1
          hatari_status=$?
          set -e
          cat "$QIKVRT_ATARI_EVIDENCE/hatari-version.txt"
          grep -F 'Hatari v2.4.1' "$QIKVRT_ATARI_EVIDENCE/hatari-version.txt"
          # Hatari 2.4.1 may report the version then exit 1; the exact output
          # above remains mandatory, while other exit states stay fail closed.
          if test "$hatari_status" -ne 0 && test "$hatari_status" -ne 1; then
            printf 'unexpected Hatari version status: %s\n' "$hatari_status" >&2
            exit 1
          fi
          display=91
          while test -e "/tmp/.X${display}-lock" || test -S "/tmp/.X11-unix/X${display}"; do
            display=$((display + 1))
          done
          xauthority="$QIKVRT_ATARI_EVIDENCE/xvfb.Xauthority"
          cookie="$(openssl rand -hex 16)"
          umask 077
          : > "$xauthority"
          xauth -f "$xauthority" add ":$display" . "$cookie"
          Xvfb ":$display" -screen 0 1280x800x24 -nolisten tcp -auth "$xauthority" \
            > "$QIKVRT_ATARI_EVIDENCE/xvfb.log" 2>&1 &
          echo $! > "$QIKVRT_ATARI_EVIDENCE/xvfb.pid"
          ready=0
          for _ in $(seq 1 100); do
            if kill -0 "$(cat "$QIKVRT_ATARI_EVIDENCE/xvfb.pid")" 2>/dev/null \
              && test -S "/tmp/.X11-unix/X${display}"; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if test "$ready" != 1; then
            cat "$QIKVRT_ATARI_EVIDENCE/xvfb.log" || true
            exit 1
          fi
          QIKVRT_XVFB_DISPLAY=":$display" \
          QIKVRT_XVFB_AUTHORITY="$xauthority" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['QIKVRT_ATARI_EVIDENCE'])
          authority = Path(os.environ['QIKVRT_XVFB_AUTHORITY'])
          (evidence / 'xvfb-runtime.json').write_text(json.dumps({
              'schema': 'qikvrt_xvfb_runtime_v1',
              'display': os.environ['QIKVRT_XVFB_DISPLAY'],
              'xauthority_sha256': hashlib.sha256(authority.read_bytes()).hexdigest(),
              'authenticated_x11_display_observed': True,
              'effect_ack_done': False,
              'general_effect_ack_done': False,
              'external_effect': 'NONE',
              'deployment': False,
              'pass': False,
              'final_pass': False,
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          printf 'DISPLAY=:%s\n' "$display" >> "$GITHUB_ENV"
          printf 'XAUTHORITY=%s\n' "$xauthority" >> "$GITHUB_ENV"
          printf 'QIKVRT_XVFB_DISPLAY=:%s\n' "$display" >> "$GITHUB_ENV"
          openssl version | tee "$QIKVRT_ATARI_EVIDENCE/openssl-version.txt"

      - name: Package exact Firefox terminal extension
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path('browser/firefox/qikvrt-terminal')
          target = pathlib.Path(__import__('os').environ['QIKVRT_ATARI_EVIDENCE']) / 'qikvrt-ai-terminal.xpi'
          names = [
              'manifest.json', 'background.js', 'content.js', 'review_effect.js',
              'terminal.css', 'options.html', 'options.js', 'README.md',
          ]
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in names:
                  source = root / name
                  if not source.is_file():
                      raise SystemExit(f'HOLD: required extension file missing: {source}')
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, source.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          sha256sum "$QIKVRT_ATARI_EVIDENCE/qikvrt-ai-terminal.xpi" \
            | tee "$QIKVRT_ATARI_EVIDENCE/qikvrt-ai-terminal.xpi.sha256"

      - name: Restore verified geckodriver archive cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/qikvrt-atari-firefox-e2e/geckodriver/geckodriver-v0.37.1-linux64.tar.gz
          key: qikvrt-geckodriver-v0.37.1-linux64

      - name: Provision exact Mozilla geckodriver with release digest verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import tarfile
          import urllib.request

          evidence = pathlib.Path(os.environ['QIKVRT_ATARI_EVIDENCE'])
          directory = evidence / 'geckodriver'
          directory.mkdir(parents=True, exist_ok=True)
          archive_path = directory / 'geckodriver-v0.37.1-linux64.tar.gz'
          release_url = 'https://api.github.com/repos/mozilla/geckodriver/releases/tags/v0.37.1'
          with urllib.request.urlopen(release_url, timeout=30) as response:
              release = json.load(response)
          asset = next((item for item in release.get('assets', []) if item.get('name') == archive_path.name), None)
          if not isinstance(asset, dict):
              raise SystemExit('HOLD: pinned Mozilla geckodriver asset unavailable')
          digest = asset.get('digest')
          if not isinstance(digest, str) or not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit('HOLD: Mozilla release SHA-256 metadata unavailable')
          expected = digest.split(':', 1)[1]
          url = asset.get('browser_download_url')
          if not isinstance(url, str) or not url.startswith('https://'):
              raise SystemExit('HOLD: Mozilla geckodriver download URL is invalid')
          if not archive_path.is_file():
              with urllib.request.urlopen(url, timeout=90) as response:
                  archive_path.write_bytes(response.read())
          actual = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'HOLD: geckodriver archive digest mismatch: {actual}')
          target = directory / 'geckodriver'
          with tarfile.open(archive_path, 'r:gz') as archive:
              members = archive.getmembers()
              if len(members) != 1 or members[0].name != 'geckodriver' or not members[0].isfile():
                  raise SystemExit('HOLD: pinned geckodriver archive layout is unexpected')
              source = archive.extractfile(members[0])
              if source is None:
                  raise SystemExit('HOLD: pinned geckodriver payload is unavailable')
              target.write_bytes(source.read())
          target.chmod(target.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          version_line = __import__('subprocess').check_output([str(target), '--version'], text=True).splitlines()[0]
          version_tokens = version_line.split()
          if version_tokens[:2] != ['geckodriver', '0.37.1']:
              raise SystemExit(f'HOLD: unexpected geckodriver version: {version_line}')
          (directory / 'provision.json').write_text(json.dumps({
              'schema': 'qikvrt_geckodriver_provision_v1',
              'release_url': release_url,
              'asset_url': url,
              'archive_sha256': actual,
              'expected_archive_sha256': expected,
              'version': '0.37.1',
              'version_line': version_line,
              'effect_ack_done': False,
              'deployment': False,
              'external_effect': 'NONE',
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Acquire and bind exact EmuTOS ROM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request
          import zipfile

          evidence = pathlib.Path(os.environ['QIKVRT_ATARI_EVIDENCE'])
          directory = evidence / 'emutos'
          directory.mkdir(parents=True, exist_ok=True)
          archive = directory / 'emutos-512k-1.4.zip'
          archive_url = 'https://downloads.sourceforge.net/project/emutos/emutos/1.4/emutos-512k-1.4.zip'
          archive_expected = '1ef7bd25f61bcfc66d19debc2f0ebb0d5e5ba811ccd7f0fddfcb105bb72d1663'
          rom_expected = 'f810041373d8efe15d55ec049fd4dd9be9b0fc521bbe6416b99d833f7fd6805d'
          if not archive.is_file():
              with urllib.request.urlopen(archive_url, timeout=90) as response:
                  archive.write_bytes(response.read())
          archive_actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if archive_actual != archive_expected:
              raise SystemExit(f'HOLD: EmuTOS archive digest mismatch: {archive_actual}')
          member_name = 'emutos-512k-1.4/etos512ca.img'
          with zipfile.ZipFile(archive) as package:
              names = package.namelist()
              if member_name not in names or any(name.startswith('/') or '..' in pathlib.PurePosixPath(name).parts for name in names):
                  raise SystemExit('HOLD: EmuTOS archive layout is unsafe or incomplete')
              rom_bytes = package.read(member_name)
          rom = directory / 'etos512ca.img'
          rom.write_bytes(rom_bytes)
          rom_actual = hashlib.sha256(rom_bytes).hexdigest()
          if rom_actual != rom_expected:
              raise SystemExit(f'HOLD: EmuTOS ROM digest mismatch: {rom_actual}')
          (directory / 'binding.json').write_text(json.dumps({
              'schema': 'qikvrt_emutos_rom_binding_v1',
              'archive_sha256': archive_actual,
              'rom_sha256': rom_actual,
              'effect_ack_done': False,
              'deployment': False,
              'external_effect': 'NONE',
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Bind exact candidate origin and start local TLS and terminal services
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fqx '127.0.0.1 goldkelch.github.io' /etc/hosts; then
            printf '%s\n' '127.0.0.1 goldkelch.github.io' | sudo tee -a /etc/hosts >/dev/null
          fi
          getent ahostsv4 goldkelch.github.io | awk 'NR == 1 { print $1 }' | grep -Fx '127.0.0.1'
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$QIKVRT_ATARI_EVIDENCE/candidate-local.key" \
            -out "$QIKVRT_ATARI_EVIDENCE/candidate-local.crt" \
            -subj '/CN=goldkelch.github.io' \
            -addext 'subjectAltName=DNS:goldkelch.github.io,IP:127.0.0.1' >/dev/null 2>&1
          sudo python3 -B tools/qikvrt_candidate_tls_server.py \
            --docs-root "$PWD/docs" \
            --certificate "$QIKVRT_ATARI_EVIDENCE/candidate-local.crt" \
            --key "$QIKVRT_ATARI_EVIDENCE/candidate-local.key" \
            --port 443 \
            --startup-receipt "$QIKVRT_ATARI_EVIDENCE/candidate-tls-startup.json" \
            > "$QIKVRT_ATARI_EVIDENCE/candidate-tls.log" 2>&1 &
          echo $! > "$QIKVRT_ATARI_EVIDENCE/candidate-tls.pid"
          TMPDIR="$QIKVRT_ATARI_EVIDENCE/tmp" \
          EMUTOS_ROM="$QIKVRT_ATARI_EVIDENCE/emutos/etos512ca.img" \
          PYTHONDONTWRITEBYTECODE=1 \
          python3 -B src/qikvrt_effect_ack_http_terminal.py \
            > "$QIKVRT_ATARI_EVIDENCE/terminal-backend.log" 2>&1 &
          echo $! > "$QIKVRT_ATARI_EVIDENCE/terminal-backend.pid"
          NO_PROXY=goldkelch.github.io,127.0.0.1,localhost \
          no_proxy=goldkelch.github.io,127.0.0.1,localhost \
          python3 - <<'PY'
          import json
          import os
          import ssl
          import time
          import urllib.request

          context = ssl._create_unverified_context()
          health_url = 'https://goldkelch.github.io/qik-vrt/__qikvrt_candidate_health__'
          backend_url = 'http://127.0.0.1:8771/.well-known/effect-ack'
          for _ in range(100):
              try:
                  with urllib.request.urlopen(health_url, context=context, timeout=1) as response:
                      health = json.load(response)
                  with urllib.request.urlopen(backend_url, timeout=1) as response:
                      backend = json.load(response)
                  if health.get('state') == 'READY' and backend.get('schema') == 'qikvrt_effect_ack_http_capability_v1':
                      break
              except Exception:
                  time.sleep(0.1)
          else:
              raise SystemExit('HOLD: candidate-local TLS or terminal backend did not become ready')
          if health.get('effect_ack_done') is not False or health.get('deployment') is not False:
              raise SystemExit('HOLD: candidate-local TLS boundary drift')
          print(json.dumps({'candidate_tls': health, 'terminal_backend_schema': backend['schema']}, sort_keys=True))
          PY

      - name: Reobserve exact Atari terminal in real Firefox
        shell: bash
        env:
          QIKVRT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          export QIKVRT_SOURCE_TREE="$(git rev-parse --verify HEAD^{tree})"
          python3 -B tools/qikvrt_atari_firefox_e2e.py \
            --geckodriver "$QIKVRT_ATARI_EVIDENCE/geckodriver/geckodriver" \
            --xpi "$QIKVRT_ATARI_EVIDENCE/qikvrt-ai-terminal.xpi" \
            --firefox-x11 \
            --candidate-url https://goldkelch.github.io/qik-vrt/atari-terminal/ \
            --receipt "$QIKVRT_ATARI_EVIDENCE/atari-firefox-receipt.json" \
            --screenshot "$QIKVRT_ATARI_EVIDENCE/atari-firefox.png" \
            --geckodriver-log "$QIKVRT_ATARI_EVIDENCE/geckodriver.log" \
            --profile-root "$QIKVRT_ATARI_EVIDENCE/profile-root"

      - name: Bind rendered trace to exact local Hatari evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['QIKVRT_ATARI_EVIDENCE'])
          receipt = json.loads((evidence / 'atari-firefox-receipt.json').read_text(encoding='utf-8'))
          xvfb = json.loads((evidence / 'xvfb-runtime.json').read_text(encoding='utf-8'))
          if receipt.get('browser', {}).get('display_mode') != 'X11':
              raise SystemExit('HOLD: Firefox did not retain the authenticated X11 display contract')
          if xvfb.get('authenticated_x11_display_observed') is not True:
              raise SystemExit('HOLD: Xvfb runtime receipt is incomplete')
          for key, value in {
              'effect_ack_done': False,
              'general_effect_ack_done': False,
              'external_effect': 'NONE',
              'deployment': False,
              'pass': False,
              'final_pass': False,
          }.items():
              if xvfb.get(key) != value:
                  raise SystemExit(f'HOLD: Xvfb runtime boundary drift: {key}')
          boot_dirs = sorted((evidence / 'tmp').glob('qikvrt-atari-boot-*'))
          if len(boot_dirs) != 1:
              raise SystemExit(f'HOLD: expected one local Hatari boot directory, found {len(boot_dirs)}')
          boot = boot_dirs[0]
          request = boot / 'drive' / 'C' / 'MLP.OPEN'
          trace = boot / 'hatari.log'
          receipt_env = boot / 'receipt.env'
          for path in (request, trace, receipt_env):
              if not path.is_file():
                  raise SystemExit(f'HOLD: local Hatari evidence missing: {path.name}')
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          if receipt.get('mlp_open_sha256') != digest(request):
              raise SystemExit('HOLD: Firefox-visible MLP.OPEN digest mismatch')
          if receipt.get('hatari_trace_sha256') != digest(trace):
              raise SystemExit('HOLD: Firefox-visible HATARI.LOG digest mismatch')
          required_false = {
              'effect_ack_done': False,
              'general_effect_ack_done': False,
              'physical_megast_execution': False,
              'deployment': False,
              'pass': False,
              'final_pass': False,
              'publication': False,
          }
          if any(receipt.get(key) is not value for key, value in required_false.items()):
              raise SystemExit('HOLD: browser receipt boundary drift')
          if receipt.get('external_effect') != 'NONE':
              raise SystemExit('HOLD: browser receipt external-effect boundary drift')
          binding = {
              'schema': 'qikvrt_atari_firefox_local_hatari_binding_v1',
              'atari_boot_id': receipt['atari_boot_id'],
              'mlp_open_sha256': digest(request),
              'hatari_trace_sha256': digest(trace),
              'receipt_env_sha256': digest(receipt_env),
              'browser_receipt_sha256': digest(evidence / 'atari-firefox-receipt.json'),
              'effect_ack_done': False,
              'general_effect_ack_done': False,
              'external_effect': 'NONE',
              'physical_megast_execution': False,
              'deployment': False,
              'pass': False,
              'final_pass': False,
          }
          (evidence / 'atari-firefox-local-hatari-binding.json').write_text(
              json.dumps(binding, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(binding, sort_keys=True))
          PY

      - name: Stop candidate-local services
        if: always()
        shell: bash
        run: |
          set +e
          if test -f "$QIKVRT_ATARI_EVIDENCE/terminal-backend.pid"; then
            kill "$(cat "$QIKVRT_ATARI_EVIDENCE/terminal-backend.pid")"
          fi
          if test -f "$QIKVRT_ATARI_EVIDENCE/candidate-tls.pid"; then
            sudo kill "$(cat "$QIKVRT_ATARI_EVIDENCE/candidate-tls.pid")"
          fi
          if test -f "$QIKVRT_ATARI_EVIDENCE/xvfb.pid"; then
            kill "$(cat "$QIKVRT_ATARI_EVIDENCE/xvfb.pid")"
          fi
          true

      - name: Preserve Firefox terminal and local Hatari evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-atari-firefox-e2e-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/atari-firefox.png
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/atari-firefox-receipt.json
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/atari-firefox-local-hatari-binding.json
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/qikvrt-ai-terminal.xpi.sha256
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/geckodriver/provision.json
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/geckodriver.log
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/candidate-tls-startup.json
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/candidate-tls.log
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/terminal-backend.log
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/emutos/binding.json
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/firefox-version.txt
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/xauth-version.txt
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/xvfb-runtime.json
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/xvfb.log
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/hatari-version.txt
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/openssl-version.txt
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/tmp/qikvrt-atari-boot-*/receipt.env
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/tmp/qikvrt-atari-boot-*/hatari.log
            ${{ runner.temp }}/qikvrt-atari-firefox-e2e/tmp/qikvrt-atari-boot-*/drive/C/MLP.OPEN
          if-no-files-found: warn
          retention-days: 30
