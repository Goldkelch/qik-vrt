name: QIKVRT future-message projection export once
on:
  push:
    branches: [transport/future-message-publication-materialize-v1]
    paths: [.github/workflows/qikvrt_future_message_projection_export_once.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: 54d13595ecdf5944ece6af2359ad0c4f94dcf4b0, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python3 -B tools/qikvrt_publication_overview.py materialize --json
          python3 -B tools/qikvrt_publication_overview.py check --json
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: future-message-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/publications/index.json
            docs/publications/index.html
            REPOSITORY_FILE_MANIFEST.json
            REPOSITORY_FILE_MANIFEST.json.sha256
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
