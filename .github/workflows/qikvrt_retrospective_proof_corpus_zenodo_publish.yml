          print("POST_PUBLIC_RECOVERY_CHAIN=PASS")
          PY
          python3 -B tools/qikvrt_integrity.py verify
          {
            printf 'EXECUTION_HEAD=%s\n' "$EXECUTION_HEAD"
            printf 'RECEIPT_HEAD=%s\n' "$receipt_head"
          } >> "$GITHUB_ENV"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Independently verify anonymous public metadata and all 65 file bytes
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZENODO_ACCESS_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from tools import qikvrt_retrospective_proof_corpus_zenodo_candidate as candidate
          from tools import qikvrt_zenodo_actions as zenodo
          from tools import qikvrt_zenodo_publish as publish

          root = Path.cwd().resolve()
          manifest_path = root / os.environ["MANIFEST_PATH"]
          evidence_path = root / os.environ["EVIDENCE_PATH"]
          manifest = publish.load_manifest(manifest_path, root)
          evidence_raw = candidate.regular_bytes(evidence_path)
          evidence = candidate.parse_json_bytes(evidence_raw, "publication evidence")
          validated = publish._validate_recovery_evidence(
              evidence,
              manifest_path,
              root,
              manifest,
              os.environ["EXECUTION_HEAD"],
          )
          if (
              validated.get("phase") != "public_verified"
              or validated.get("state") != "published"
              or len(manifest["files"]) != 65
          ):
              raise SystemExit("BLOCK: persisted publication is not exact public_verified")

          def safe_zenodo_url(url: str) -> str:
              if not isinstance(url, str):
                  raise SystemExit("BLOCK: anonymous Zenodo URL is absent")
              parts = urllib.parse.urlsplit(url)
              try:
                  port = parts.port
              except ValueError:
                  raise SystemExit("BLOCK: anonymous Zenodo URL has an invalid port")
              if (
                  parts.scheme != "https"
                  or parts.hostname != "zenodo.org"
                  or parts.username is not None
                  or parts.password is not None
                  or port not in (None, 443)
                  or parts.query
                  or parts.fragment
                  or not parts.path.startswith("/")
              ):
                  raise SystemExit("BLOCK: anonymous URL escaped exact Zenodo HTTPS")
              return urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, "", ""))

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              RejectRedirects(),
          )

          def request(url: str, maximum: int, *, accept_json: bool) -> bytes:
              safe = safe_zenodo_url(url)
              headers = {"User-Agent": "qikvrt-corpus-v3-anonymous-verifier/1"}
              if accept_json:
                  headers["Accept"] = "application/json"
              response = opener.open(
                  urllib.request.Request(safe, headers=headers, method="GET"),
                  timeout=180,
              )
              with response:
                  safe_zenodo_url(response.geturl())
                  chunks = []
                  total = 0
                  while True:
                      chunk = response.read(min(1024 * 1024, maximum + 1 - total))
                      if not chunk:
                          break
                      chunks.append(chunk)
                      total += len(chunk)
                      if total > maximum:
                          raise SystemExit("BLOCK: anonymous response exceeded bound")
              return b"".join(chunks)

          record_id = validated["record_id"]
          doi = validated["doi"]
          public_raw = request(
              f"https://zenodo.org/api/records/{record_id}",
              16 * 1024 * 1024,
              accept_json=True,
          )
          public = candidate.parse_json_bytes(public_raw, "anonymous public record")
          if (
              zenodo._record_id(public, "anonymous public record") != record_id
              or zenodo._doi_from_deposition(public, "anonymous public record") != doi
              or not zenodo._published_metadata_matches(
                  public.get("metadata"), manifest["metadata"]
              )
          ):
              raise SystemExit("BLOCK: anonymous public record identity/metadata differs")
          conceptdoi, record_url = publish._public_record_identity(public, record_id, doi)
          if (
              conceptdoi != validated["conceptdoi"]
              or record_url != validated["record_url"]
          ):
              raise SystemExit("BLOCK: anonymous public identity differs from receipt")

          public_files = zenodo.ZenodoClient._server_files(public)
          by_name = {}
          for item in public_files:
              name = zenodo.ZenodoClient._server_file_name(item)
              if name in by_name:
                  raise SystemExit("BLOCK: anonymous public file name is duplicated")
              by_name[name] = item
          if set(by_name) != {item["name"] for item in manifest["files"]}:
              raise SystemExit("BLOCK: anonymous public file set differs")

          aggregate = 0
          verified_names = []
          for expected in manifest["files"]:
              name = expected["name"]
              item = by_name[name]
              raw_size = item.get("filesize", item.get("size"))
              if isinstance(raw_size, str) and raw_size.isdecimal():
                  raw_size = int(raw_size)
              checksum = item.get("checksum")
              if (
                  raw_size != expected["size"]
                  or checksum not in {expected["md5"], "md5:" + expected["md5"]}
              ):
                  raise SystemExit("BLOCK: anonymous public file metadata differs: " + name)
              links = item.get("links")
              candidates = (
                  links.get("download"), links.get("self"), links.get("content")
              ) if isinstance(links, dict) else ()
              download = next(
                  (safe_zenodo_url(value) for value in candidates if isinstance(value, str)),
                  None,
              )
              if download is None:
                  raise SystemExit("BLOCK: anonymous public file URL is absent: " + name)
              raw = request(download, expected["size"], accept_json=False)
              aggregate += len(raw)
              if aggregate > 512 * 1024 * 1024:
                  raise SystemExit("BLOCK: anonymous aggregate download exceeded bound")
              if (
                  len(raw) != expected["size"]
                  or hashlib.md5(raw, usedforsecurity=False).hexdigest() != expected["md5"]
                  or hashlib.sha256(raw).hexdigest() != expected["sha256"]
              ):
                  raise SystemExit("BLOCK: anonymous public file bytes differ: " + name)
              verified_names.append(name)
          if verified_names != [item["name"] for item in manifest["files"]]:
              raise SystemExit("BLOCK: anonymous verification order differs")
          print("ANONYMOUS_PUBLIC_BYTE_EXACT_VERIFY=PASS")
          print("PUBLIC_FILE_COUNT=65")
          print("EFFECT_STATE=EFFECT_ACK_CONTINUE")
          PY
          {
            printf '%s\n' '## Retrospective proof corpus post-public verification'
            printf '%s\n' '- Anonymous public metadata and all 65 files: byte-exact PASS'
            printf '%s\n' '- Effect state: `EFFECT_ACK_CONTINUE`'
            printf '%s\n' '- Authority/Mirror reciprocal persistence remains a separate required effect.'
          } >> "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Bootstrap the create-only Authority public ref after the complete byte gate
        shell: bash
        env:
          QIKVRT_MESH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN }}
        run: |
          set -euo pipefail
          test -z "${ZENODO_ACCESS_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          receipt_head="$(git rev-parse --verify HEAD^{commit})"
          [[ "$receipt_head" =~ ^[0-9a-f]{40}$ ]]
          test "$receipt_head" = "$RECEIPT_HEAD"
          test "$(git show -s --format=%s "$receipt_head")" = \
            'zenodo: persist retrospective proof corpus publication'
          test -e "$EVIDENCE_PATH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          bootstrap_report="$RUNNER_TEMP/qikvrt-corpus-authority-public-ref-bootstrap.log"
          python3 -B tools/qikvrt_retrospective_proof_corpus_mirror_finalize.py \
            --bootstrap-authority-public-ref | tee "$bootstrap_report"
          BOOTSTRAP_REPORT="$bootstrap_report" python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["BOOTSTRAP_REPORT"])
          raw = report_path.read_bytes()
          done_state = "EFFECT_ACK_" + "DONE"
          if not raw or len(raw) > 1024 * 1024 or done_state.encode("ascii") in raw:
              raise SystemExit("BLOCK: Authority public-ref bootstrap report is invalid")
          try:
              lines = [line for line in raw.decode("utf-8").splitlines() if line]
              report = json.loads(lines[-1])
          except (UnicodeDecodeError, IndexError, json.JSONDecodeError) as exc:
              raise SystemExit("BLOCK: Authority public-ref bootstrap report is not JSON") from exc
          if (
              not isinstance(report, dict)
              or report.get("effect_state") != "EFFECT_ACK_CONTINUE"
              or report.get("effect_state") == done_state
          ):
              raise SystemExit("BLOCK: Authority public-ref bootstrap crossed effect boundary")
          print("AUTHORITY_PUBLIC_REF_BOOTSTRAP=PASS")
          print("EFFECT_STATE=EFFECT_ACK_CONTINUE")
          PY
          {
            printf '%s\n' '## Retrospective proof corpus Authority public-ref bootstrap'
            printf '%s\n' '```text'
            cat "$bootstrap_report"
            printf '%s\n' '```'
            printf '%s\n' '- Effect state: `EFFECT_ACK_CONTINUE`'
            printf '%s\n' '- Mirror reciprocal persistence remains a separately triggered effect.'
          } >> "$GITHUB_STEP_SUMMARY"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
