name: QIKVRT self-heal terminal monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "QIK-VRT autonomous bounded self-heal"
      - "QIKVRT reflexive repository watchdog"
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/qikvrt_self_heal_terminal_monitor.yml"
      - "tools/qikvrt_self_heal_terminal_monitor.py"
      - "tests/test_qikvrt_self_heal_terminal_monitor.py"
      - "docs/terminal/TERMINAL_PATTERN_V1.json"
      - "docs/terminal/firefox/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: qikvrt-self-heal-terminal-monitor-${{ github.repository }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reobserve current main head and tree
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          tree="$(gh api "repos/$REPOSITORY/git/commits/$head" --jq '.tree.sha')"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"

      - name: Check out exact observed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.main.outputs.head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify terminal monitor contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_self_heal_terminal_monitor

      - name: Collect exact public workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.main.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/self-heal-terminal-monitor
          mkdir -p "$root"

          gh api "repos/$REPOSITORY/actions/workflows/qikvrt_autonomous_self_heal.yml/runs?branch=main&event=schedule&per_page=1" \
            > "$root/self-heal-runs.json"
          self_heal_run="$(jq -r '.workflow_runs[0].id // empty' "$root/self-heal-runs.json")"
          test -n "$self_heal_run"
          gh api "repos/$REPOSITORY/actions/runs/$self_heal_run/jobs?per_page=100" \
            > "$root/self-heal-jobs.json"
          printf '{}\n' > "$root/self-heal-receipt.json"
          self_heal_artifact="$(
            gh api "repos/$REPOSITORY/actions/runs/$self_heal_run/artifacts?per_page=100" \
              | jq -r '[.artifacts[] | select(.name | startswith("qikvrt-self-heal-receipt-"))][0].id // empty'
          )"
          if test -n "$self_heal_artifact"; then
            gh api "repos/$REPOSITORY/actions/artifacts/$self_heal_artifact/zip" > "$root/self-heal.zip"
            unzip -p "$root/self-heal.zip" qikvrt-self-heal.json > "$root/self-heal-receipt.json" 2>/dev/null \
              || unzip -p "$root/self-heal.zip" '*.json' > "$root/self-heal-receipt.json"
          fi

          gh api "repos/$REPOSITORY/actions/workflows/qikvrt_reflexive_repository_watchdog.yml/runs?branch=main&status=completed&per_page=20" \
            > "$root/watchdog-runs-all.json"
          jq --arg head "$HEAD_SHA" \
            '{workflow_runs: [.workflow_runs[] | select(.head_sha == $head and .conclusion == "success")][0:1]}' \
            "$root/watchdog-runs-all.json" > "$root/watchdog-runs.json"
          watchdog_run="$(jq -r '.workflow_runs[0].id // empty' "$root/watchdog-runs.json")"
          test -n "$watchdog_run"
          printf '{}\n' > "$root/watchdog-receipt.json"
          watchdog_artifact="$(
            gh api "repos/$REPOSITORY/actions/runs/$watchdog_run/artifacts?per_page=100" \
              | jq -r '[.artifacts[] | select(.name | startswith("qikvrt-reflexive-repository-watchdog-"))][0].id // empty'
          )"
          test -n "$watchdog_artifact"
          gh api "repos/$REPOSITORY/actions/artifacts/$watchdog_artifact/zip" > "$root/watchdog.zip"
          unzip -p "$root/watchdog.zip" reflexive-watchdog-receipt.json > "$root/watchdog-receipt.json"

      - name: Build passive terminal snapshot
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.main.outputs.head }}
          TREE_SHA: ${{ steps.main.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/self-heal-terminal-monitor
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 -B tools/qikvrt_self_heal_terminal_monitor.py \
            --repository "$REPOSITORY" \
            --observed-at "$now" \
            --head "$HEAD_SHA" \
            --tree "$TREE_SHA" \
            --self-heal-runs "$root/self-heal-runs.json" \
            --self-heal-jobs "$root/self-heal-jobs.json" \
            --self-heal-receipt "$root/self-heal-receipt.json" \
            --watchdog-runs "$root/watchdog-runs.json" \
            --watchdog-receipt "$root/watchdog-receipt.json" \
            --output "$root/terminal-snapshot.json"
          jq '{main, self_heal, reflexive_watchdog, writer_lease, classification, terminal_semantics, completion_claims}' \
            "$root/terminal-snapshot.json"

      - name: Preserve exact-head terminal snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-self-heal-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qikvrt/self-heal-terminal-monitor
          if-no-files-found: error
          retention-days: 30
