name: QIKVRT versioned corrected corpus candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-versioned-corrected-candidates-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile exact candidate recovery runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tools/qikvrt_create_versioned_corrected_candidates.py \
            tools/qikvrt_create_versioned_corrected_candidates_entrypoint.py
      - name: Verify candidate evidence offline without a live repair
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/qikvrt-versioned-candidate-recovery"
          mkdir -p "$artifact_root"
          receipt="$artifact_root/RECOVERY_RECEIPT.json"
          log="$artifact_root/candidate-recovery.log"
          set +e
          python3 -B tools/qikvrt_create_versioned_corrected_candidates_entrypoint.py \
            --verify-current --receipt "$receipt" --json \
            | tee "$log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          effective_exit="${statuses[0]}"
          if [ "${statuses[1]}" -ne 0 ] || [ ! -s "$receipt" ]; then
            python3 - "$receipt" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          path.parent.mkdir(parents=True, exist_ok=True)
          value = {
              "schema": "qikvrt_versioned_corrected_candidates_recovery_v1",
              "state": "HOLD",
              "verification_state": "HOLD_UNVERIFIED",
              "first_blocker": "VERSIONED_CANDIDATE_EVIDENCE_CAPTURE_FAILED",
              "d0": 2,
              "continuation_required": True,
              "hold_reason": {
                  "reason_code": "VERSIONED_CANDIDATE_EVIDENCE_CAPTURE_FAILED",
                  "reason": "The candidate runner did not preserve a complete receipt and log before enforcement.",
                  "subject": {"repository": "Goldkelch/qik-vrt", "kind": "versioned_corrected_candidate_set", "identifier": "remaining-corpus-six-candidates", "head_sha": None},
                  "evidence_refs": ["workflow-log:versioned-candidate-recovery"],
                  "owner": {"role": "EXACT_SUBJECT_OBSERVER", "actor": "github-actions[bot]"},
                  "retry_condition": {"event": "FUTURE_FRESH_VERSIONED_CANDIDATE_CARRIER", "predicate": "the runner can preserve a complete receipt and log"},
                  "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
                  "d0": 2
              },
              "completion_claims": {"pass": False, "final_pass": False, "effect_ack_done": False, "candidate_promotion_authorized": False, "zenodo_mutation_authorized": False}
          }
          path.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
            effective_exit=2
          fi
          if [ "$effective_exit" -eq 0 ]; then
            if ! grep -Fx 'PASS=false' "$log" || ! grep -Fx 'FINAL_PASS=false' "$log" || ! grep -Fx 'EFFECT_ACK_DONE=false' "$log" || ! grep -Fx 'ZENODO_MUTATION=false' "$log"; then
              python3 - "$receipt" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          value = {
              "schema": "qikvrt_versioned_corrected_candidates_recovery_v1",
              "state": "HOLD",
              "verification_state": "HOLD_UNVERIFIED",
              "first_blocker": "VERSIONED_CANDIDATE_EVIDENCE_CAPTURE_FAILED",
              "d0": 2,
              "continuation_required": True,
              "hold_reason": {
                  "reason_code": "VERSIONED_CANDIDATE_EVIDENCE_CAPTURE_FAILED",
                  "reason": "The candidate runner did not preserve required terminal-boundary output.",
                  "subject": {"repository": "Goldkelch/qik-vrt", "kind": "versioned_corrected_candidate_set", "identifier": "remaining-corpus-six-candidates", "head_sha": None},
                  "evidence_refs": ["workflow-log:versioned-candidate-recovery"],
                  "owner": {"role": "EXACT_SUBJECT_OBSERVER", "actor": "github-actions[bot]"},
                  "retry_condition": {"event": "FUTURE_FRESH_VERSIONED_CANDIDATE_CARRIER", "predicate": "the runner can preserve required terminal-boundary output"},
                  "next_action": "REOBSERVE_EXACT_PUBLIC_ZENODO_RECORDS_ON_A_FUTURE_CARRIER",
                  "d0": 2
              },
              "completion_claims": {"pass": False, "final_pass": False, "effect_ack_done": False, "candidate_promotion_authorized": False, "zenodo_mutation_authorized": False}
          }
          path.write_text(json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
              effective_exit=2
            fi
          fi
          sha256sum "$artifact_root"/* > "$artifact_root/SHA256SUMS.txt"
          printf 'exit_code=%s\n' "$effective_exit" >> "$GITHUB_OUTPUT"
      - name: Preserve versioned candidate recovery evidence
        id: candidate_evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-versioned-candidate-recovery-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/qikvrt-versioned-candidate-recovery/**
      - name: Enforce typed candidate HOLD after evidence upload
        if: >-
          always() && steps.candidates.outputs.exit_code != '' &&
          steps.candidates.outputs.exit_code != '0' &&
          steps.candidate_evidence.outcome == 'success'
        env:
          CANDIDATE_EXIT: ${{ steps.candidates.outputs.exit_code }}
          RECOVERY_RECEIPT: ${{ runner.temp }}/qikvrt-versioned-candidate-recovery/RECOVERY_RECEIPT.json
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_EXIT" =~ ^[1-9][0-9]*$ ]]
          test -s "$RECOVERY_RECEIPT"
          cat "$RECOVERY_RECEIPT" >&2
          exit "$CANDIDATE_EXIT"
