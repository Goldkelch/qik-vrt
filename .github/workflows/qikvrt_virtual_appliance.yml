name: QIKVRT Mesh virtual appliance

on:
  pull_request:
    paths:
      - ".github/workflows/qikvrt_virtual_appliance.yml"
      - "distribution/qikvrt-mesh-appliance-v1-source.tar.gz"
      - "distribution/qikvrt-mesh-appliance-v1-source.tar.gz.sha256"
      - "docs/QIKVRT_MESH_VIRTUAL_APPLIANCE_V1.md"
      - "policy/QIKVRT_VIRTUAL_APPLIANCE_V1.json"
      - "tests/test_qikvrt_virtual_appliance_bundle.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_virtual_appliance.yml"
      - "distribution/qikvrt-mesh-appliance-v1-source.tar.gz"
      - "distribution/qikvrt-mesh-appliance-v1-source.tar.gz.sha256"
      - "docs/QIKVRT_MESH_VIRTUAL_APPLIANCE_V1.md"
      - "policy/QIKVRT_VIRTUAL_APPLIANCE_V1.json"
      - "tests/test_qikvrt_virtual_appliance_bundle.py"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: qikvrt-virtual-appliance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bind exact source and unpack immutable appliance source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          (cd distribution && sha256sum -c qikvrt-mesh-appliance-v1-source.tar.gz.sha256)
          mkdir -p distribution/qikvrt-mesh-appliance-v1
          tar -xzf distribution/qikvrt-mesh-appliance-v1-source.tar.gz \
            -C distribution/qikvrt-mesh-appliance-v1 --strip-components=1
          python3 -B -m unittest -v tests.test_qikvrt_virtual_appliance_bundle
      - name: Build exact OCI appliance and run bounded demonstrations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qikvrt-appliance-output"
          docker build --pull --platform linux/amd64 \
            --label org.opencontainers.image.revision="${{ github.event.pull_request.head.sha || github.sha }}" \
            --label org.opencontainers.image.source="https://github.com/Goldkelch/qik-vrt" \
            -f distribution/qikvrt-mesh-appliance-v1/Dockerfile \
            -t qikvrt-mesh-appliance:${{ github.sha }} .
          docker run --rm --platform linux/amd64 --shm-size=1g \
            -e QIKVRT_SOURCE_HEAD="${{ github.event.pull_request.head.sha || github.sha }}" \
            -e QIKVRT_SOURCE_TREE="$(git rev-parse HEAD^{tree})" \
            -v "$RUNNER_TEMP/qikvrt-appliance-output:/out" \
            qikvrt-mesh-appliance:${{ github.sha }} all
      - name: Build QIK-VRT Mesh Live bootable ISO
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends live-build
          live="$PWD/distribution/qikvrt-mesh-appliance-v1/live-build"
          root="$live/config/includes.chroot/opt/qikvrt"
          sudo rm -rf "$root"
          sudo mkdir -p "$root/browser/firefox" "$root/include" "$root/src" \
            "$root/runtime/atari-megast" "$root/runtime/m68000" "$root/tools" "$root/distribution"
          sudo cp -a browser/firefox/qikvrt-terminal "$root/browser/firefox/"
          sudo cp -a browser/atari-c89 "$root/browser/"
          sudo cp -a include/qikvrt "$root/include/"
          sudo cp src/effect_ack_core.c src/qikvrt_effect_ack_http_terminal.py src/atari_browser_c89.c "$root/src/"
          sudo cp runtime/atari-megast/qikbrow.c "$root/runtime/atari-megast/"
          sudo cp -a runtime/m68000/. "$root/runtime/m68000/"
          sudo cp tools/qikvrt_m68000_tos_consumer.py "$root/tools/"
          sudo cp -a distribution/qikvrt-mesh-appliance-v1 "$root/distribution/"
          sudo python3 distribution/qikvrt-mesh-appliance-v1/fetch_overlay.py \
            --lock distribution/qikvrt-mesh-appliance-v1/APPLIANCE_LOCK.json --root "$root"
          (cd "$live" && sudo lb clean --purge || true; sudo ./auto/config; sudo lb build)
          iso="$(find "$live" -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$iso" && test -s "$iso"
          mkdir -p "$RUNNER_TEMP/qikvrt-appliance"
          cp "$iso" "$RUNNER_TEMP/qikvrt-appliance/qikvrt-mesh-live-v1-amd64.iso"
          sha256sum "$RUNNER_TEMP/qikvrt-appliance/qikvrt-mesh-live-v1-amd64.iso" \
            > "$RUNNER_TEMP/qikvrt-appliance/qikvrt-mesh-live-v1-amd64.iso.sha256"
      - name: Export OCI archive and bounded evidence
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qikvrt-appliance"
          mkdir -p "$out"
          cp distribution/qikvrt-mesh-appliance-v1-source.tar.gz "$out/"
          docker save qikvrt-mesh-appliance:${{ github.sha }} | gzip -n -9 \
            > "$out/qikvrt-mesh-appliance-v1-oci-amd64.tar.gz"
          cp distribution/qikvrt-mesh-appliance-v1/APPLIANCE_LOCK.json "$out/"
          cp -a "$RUNNER_TEMP/qikvrt-appliance-output" "$out/evidence"
          sha256sum "$out"/*.tar.gz "$out"/*.iso > "$out/SHA256SUMS.txt"
      - name: Upload bounded build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qikvrt-mesh-appliance-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qikvrt-appliance
          retention-days: 30
          if-no-files-found: error
      - name: Publish immutable GHCR image and GitHub Release on Authority main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/goldkelch/qik-vrt-mesh-appliance
        run: |
          set -euo pipefail
          short="$(printf '%s' '${{ github.sha }}' | cut -c1-12)"
          tag="qikvrt-mesh-appliance-v1-${short}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag qikvrt-mesh-appliance:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"
          digest="$(docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" --format '{{.Manifest.Digest}}')"
          printf '%s@%s\n' "$IMAGE" "$digest" > "$RUNNER_TEMP/qikvrt-appliance/OCI_DIGEST.txt"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "BLOCK: immutable release already exists: $tag" >&2
            exit 2
          fi
          gh release create "$tag" \
            "$RUNNER_TEMP/qikvrt-appliance/qikvrt-mesh-appliance-v1-source.tar.gz" \
            "$RUNNER_TEMP/qikvrt-appliance/qikvrt-mesh-appliance-v1-oci-amd64.tar.gz" \
            "$RUNNER_TEMP/qikvrt-appliance/qikvrt-mesh-live-v1-amd64.iso" \
            "$RUNNER_TEMP/qikvrt-appliance/qikvrt-mesh-live-v1-amd64.iso.sha256" \
            "$RUNNER_TEMP/qikvrt-appliance/SHA256SUMS.txt" \
            "$RUNNER_TEMP/qikvrt-appliance/APPLIANCE_LOCK.json" \
            "$RUNNER_TEMP/qikvrt-appliance/OCI_DIGEST.txt" \
            --title "QIK-VRT Mesh Virtual Appliance ${{ github.sha }}" \
            --notes "Immutable virtual appliance bound to Authority ${{ github.sha }}. No physical-hardware, PASS, FINAL_PASS, deployment, general Internet, IETF-adoption, or general EFFECT_ACK_DONE claim."
