name: QIKVRT cloud transputer service-plane

on:
  pull_request:
    paths:
      - "deploy/universal-terminal/**"
      - "tests/test_qikvrt_cloud_transputer_service_plane.py"
      - ".github/workflows/qikvrt_cloud_transputer_service_plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-cloud-transputer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-service-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: qikvrt-service-ci-${{ github.run_id }}-${{ github.run_attempt }}
      QIKVRT_UNIVERSAL_TERMINAL_IMAGE: qikvrt/universal-terminal:${{ github.event.pull_request.head.sha || github.sha }}
      QIKVRT_DB_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
      QIKVRT_SERVICE_EVIDENCE_DIR: /tmp/qikvrt-service-evidence
    steps:
      - name: Bind exact subject
        id: subject
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            head="$PR_HEAD_SHA"
          else
            head="$EVENT_SHA"
          fi
          test -n "$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "QIKVRT_HEAD=$head" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.subject.outputs.head }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reobserve literal checkout
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QIKVRT_HEAD"
          echo "QIKVRT_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

      - name: Static contract tests
        id: contracts
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_qikvrt_cloud_transputer_service_plane

      - name: Build universal image
        id: build
        env:
          QIKVRT_UNIVERSAL_TERMINAL_IMAGE: qikvrt/universal-terminal:${{ steps.subject.outputs.head }}
          QIKVRT_DB_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$QIKVRT_SERVICE_EVIDENCE_DIR"
          if ! docker compose -f deploy/universal-terminal/compose.yaml build qikvrt-universal-terminal \
            > "$QIKVRT_SERVICE_EVIDENCE_DIR/build.log" 2>&1; then
            tail -n 120 "$QIKVRT_SERVICE_EVIDENCE_DIR/build.log"
            exit 1
          fi
          docker image inspect --format '{{.Id}}' "$QIKVRT_UNIVERSAL_TERMINAL_IMAGE" \
            | tee "$QIKVRT_SERVICE_EVIDENCE_DIR/image-id.txt"

      - name: Verify C90 native and M68000 machine-code artifacts
        id: machine_code
        env:
          QIKVRT_UNIVERSAL_TERMINAL_IMAGE: qikvrt/universal-terminal:${{ steps.subject.outputs.head }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$QIKVRT_UNIVERSAL_TERMINAL_IMAGE" -c '
            set -eu
            test -x /usr/local/bin/qikvrt-ip-bootstrap
            test -s /usr/share/novnc/vnc.html
            test -s /usr/share/novnc/core/rfb.js
            grep -Eq "Machine:[[:space:]]+MC68000" /opt/qikvrt/runtime/m68k/qikvrt_ip_bootstrap.readelf.txt
            test -s /opt/qikvrt/runtime/m68k/qikvrt_ip_bootstrap.objdump.txt
            cd /opt/qikvrt/runtime/m68k
            sha256sum -c qikvrt_ip_bootstrap.sha256
          '
          cid="$(docker create --entrypoint /bin/true "$QIKVRT_UNIVERSAL_TERMINAL_IMAGE")"
          trap 'docker rm "$cid" >/dev/null' EXIT
          docker cp "$cid:/opt/qikvrt/runtime/m68k" "$QIKVRT_SERVICE_EVIDENCE_DIR/m68k"
          docker cp "$cid:/opt/qikvrt/deploy/universal-terminal/qikvrt_ip_bootstrap.c" "$QIKVRT_SERVICE_EVIDENCE_DIR/"
          docker cp "$cid:/usr/local/bin/qikvrt-ip-bootstrap" "$QIKVRT_SERVICE_EVIDENCE_DIR/"

      - name: Start complete loopback service plane
        id: start
        env:
          QIKVRT_UNIVERSAL_TERMINAL_IMAGE: qikvrt/universal-terminal:${{ steps.subject.outputs.head }}
          QIKVRT_DB_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker compose -f deploy/universal-terminal/compose.yaml up -d --no-build --wait --wait-timeout 120
          docker compose -f deploy/universal-terminal/compose.yaml ps

      - name: Wait for IP endpoints
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/qik-vrt/mesh/v1/healthz >/dev/null \
              && curl -fsS http://127.0.0.1:8080/qik-vrt/mesh/v1/terminal/vnc.html >/dev/null \
              && curl -fsS http://127.0.0.1:8080/qik-vrt/mesh/v1/effect-ack/.well-known/effect-ack >/dev/null \
              && nc -z 127.0.0.1 2222 \
              && nc -z 127.0.0.1 2525 \
              && nc -z 127.0.0.1 15432 \
              && nc -z 127.0.0.1 19418; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/universal-terminal/compose.yaml ps
          docker compose -f deploy/universal-terminal/compose.yaml logs --no-color
          exit 1

      - name: Verify fixed Mesh URL and Firefox proxy UI
        id: mesh
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/qik-vrt/mesh/v1/ | grep -F "QIK-VRT Mesh Universal Terminal"
          curl -fsS "http://127.0.0.1:8080/qik-vrt/mesh/v1/terminal/vnc.html?autoconnect=true&resize=scale" | grep -Ei "noVNC|VNC"
          curl -fsS http://127.0.0.1:8080/qik-vrt/mesh/v1/effect-ack/.well-known/effect-ack | grep -F "qikvrt_effect_ack_http_capability_v1"
          docker compose -f deploy/universal-terminal/compose.yaml exec -T qikvrt-universal-terminal \
            /usr/local/bin/qikvrt-ip-bootstrap qikvrt-gateway 8080 /qik-vrt/mesh/v1/healthz

      - name: Verify real proxy framebuffer and exact local Effect-Ack readback
        id: live_proxy
        env:
          QIKVRT_SERVICE_PLANE_LIVE: "1"
        run: |
          set -euo pipefail
          test "$QIKVRT_SERVICE_PLANE_LIVE" = 1
          python3 -B -m unittest -v tests.test_qikvrt_cloud_transputer_service_plane.LiveServicePlaneTests
          terminal="$(docker compose -f deploy/universal-terminal/compose.yaml ps -q qikvrt-universal-terminal)"
          gateway="$(docker compose -f deploy/universal-terminal/compose.yaml ps -q qikvrt-gateway)"
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$gateway")" = "container:$terminal"
          docker compose -f deploy/universal-terminal/compose.yaml exec -T qikvrt-smtpd python3 - <<'PY'
          import errno,socket
          address=socket.gethostbyname("qikvrt-universal-terminal")
          try:
              with socket.create_connection((address,8771),timeout=5):
                  raise AssertionError("reference backend must not be reachable on the container interface")
          except OSError as exc:
              assert exc.errno == errno.ECONNREFUSED, exc
          PY

      - name: Verify SMTP sink
        id: smtp
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import smtplib
          c=smtplib.SMTP("127.0.0.1",2525,timeout=10)
          c.sendmail("ci@qik-vrt.mesh",["terminal@qik-vrt.mesh"],"Subject: QIKVRT CI\r\n\r\nmesh receipt\r\n")
          c.quit()
          PY
          docker compose -f deploy/universal-terminal/compose.yaml exec -T qikvrt-smtpd \
            sh -c 'test "$(find /var/lib/qikvrt/smtp -name "*.json" | wc -l)" -ge 1'

      - name: Verify DNS and SNMP
        id: dns_snmp
        run: |
          set -euo pipefail
          test "$(dig @127.0.0.1 -p 5353 mesh.qik-vrt.mesh A +short | tail -1)" = "127.0.0.1"
          docker compose -f deploy/universal-terminal/compose.yaml exec -T qikvrt-snmpd \
            snmpget -v2c -c qikvrt -On 127.0.0.1:1161 1.3.6.1.2.1.1.1.0

      - name: Verify SSH daemon without manufacturing credentials
        id: ssh_banner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1",2222),timeout=10) as s:
              banner=s.recv(256)
          assert banner.startswith(b"SSH-2.0-"), banner
          print(banner.decode("ascii","replace").strip())
          PY

      - name: Verify SQL service with SQL-92 core operations
        id: sql
        env:
          PGPASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker compose -f deploy/universal-terminal/compose.yaml exec -T \
            -e PGPASSWORD="$PGPASSWORD" qikvrt-sqld \
            psql -h 127.0.0.1 -U qikvrt -d qikvrt -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          CREATE TABLE qikvrt_ci_a (id INTEGER NOT NULL PRIMARY KEY, value VARCHAR(32));
          CREATE TABLE qikvrt_ci_b (id INTEGER NOT NULL PRIMARY KEY, parent_id INTEGER);
          INSERT INTO qikvrt_ci_a VALUES (1, 'mesh');
          INSERT INTO qikvrt_ci_b VALUES (1, 1);
          SELECT a.value FROM qikvrt_ci_a AS a INNER JOIN qikvrt_ci_b AS b ON a.id = b.parent_id WHERE b.id = 1;
          ROLLBACK;
          CREATE TABLE qikvrt_restart_probe (value INTEGER NOT NULL);
          INSERT INTO qikvrt_restart_probe VALUES (1040);
          SQL
          if docker compose -f deploy/universal-terminal/compose.yaml exec -T \
            -e PGPASSWORD=deliberately-wrong qikvrt-sqld \
            psql -w -h 127.0.0.1 -U qikvrt -d qikvrt -c 'SELECT 1'; then
            echo "BLOCK: incorrect SQL password was accepted" >&2
            exit 1
          fi
          docker compose -f deploy/universal-terminal/compose.yaml restart qikvrt-sqld
          ready=false
          for i in {1..30}; do
            if value="$(docker compose -f deploy/universal-terminal/compose.yaml exec -T \
              -e PGPASSWORD="$PGPASSWORD" qikvrt-sqld \
              psql -X -w -h 127.0.0.1 -U qikvrt -d qikvrt -At \
              -v ON_ERROR_STOP=1 -c 'SELECT value FROM qikvrt_restart_probe')"; then
              test "$value" = 1040
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

      - name: Verify Authority-connected read-only Mirror
        id: mirror
        run: |
          set -euo pipefail
          head="$(git ls-remote git://127.0.0.1:19418/qik-vrt.git refs/heads/main | awk 'NR==1 {print $1}')"
          test -n "$head"
          docker compose -f deploy/universal-terminal/compose.yaml exec -T qikvrt-mirror \
            cat /var/lib/qikvrt/mirror/mirror-state.json
          test "$head" = "$(docker compose -f deploy/universal-terminal/compose.yaml exec -T qikvrt-mirror \
            python3 -c 'import json;print(json.load(open("/var/lib/qikvrt/mirror/mirror-state.json"))["authority_main_head"])')"

      - name: Exercise Effect-Ack prepare and commit contract
        id: reference_protocol
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_qikvrt_effect_ack_http_terminal

      - name: Preserve bounded service diagnostics before teardown
        if: always()
        run: |
          mkdir -p "$QIKVRT_SERVICE_EVIDENCE_DIR/runtime-logs"
          docker compose -f deploy/universal-terminal/compose.yaml ps -a --format json \
            > "$QIKVRT_SERVICE_EVIDENCE_DIR/compose-ps.jsonl" 2>&1 || true
          docker compose -f deploy/universal-terminal/compose.yaml logs --no-color --tail 160 \
            > "$QIKVRT_SERVICE_EVIDENCE_DIR/service-logs.txt" 2>&1 || true
          docker compose -f deploy/universal-terminal/compose.yaml cp \
            qikvrt-universal-terminal:/opt/qikvrt/runtime/logs/. "$QIKVRT_SERVICE_EVIDENCE_DIR/runtime-logs/" || true
          docker compose -f deploy/universal-terminal/compose.yaml cp \
            qikvrt-universal-terminal:/var/lib/qikvrt/state/runtime.json "$QIKVRT_SERVICE_EVIDENCE_DIR/runtime.json" || true
          cid="$(docker compose -f deploy/universal-terminal/compose.yaml ps -aq qikvrt-universal-terminal)"
          if [ -n "$cid" ]; then
            docker inspect --format '{{json .State}}' "$cid" > "$QIKVRT_SERVICE_EVIDENCE_DIR/terminal-state.json" || true
          fi
          tail -n 180 "$QIKVRT_SERVICE_EVIDENCE_DIR/service-logs.txt" || true

      - name: Emit exact-subject receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QIKVRT_SERVICE_EVIDENCE_DIR"
          cat > "$QIKVRT_SERVICE_EVIDENCE_DIR/CLOUD_TRANSPUTER_RECEIPT.txt" <<EOF
          schema=qikvrt_cloud_transputer_service_plane_receipt_v2
          head=${QIKVRT_HEAD}
          tree=${QIKVRT_TREE:-UNKNOWN}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          mesh_url=http://127.0.0.1:8080/qik-vrt/mesh/v1/
          exposure=LOOPBACK_ONLY
          binding=${{ steps.binding.outcome }}
          contracts=${{ steps.contracts.outcome }}
          build=${{ steps.build.outcome }}
          machine_code=${{ steps.machine_code.outcome }}
          start=${{ steps.start.outcome }}
          endpoints=${{ steps.endpoints.outcome }}
          mesh_http=${{ steps.mesh.outcome }}
          live_proxy_rfb_and_local_effect_ack=${{ steps.live_proxy.outcome }}
          smtp_sink=${{ steps.smtp.outcome }}
          dns_snmp=${{ steps.dns_snmp.outcome }}
          ssh_banner=${{ steps.ssh_banner.outcome }}
          sql_core_password_and_restart=${{ steps.sql.outcome }}
          authority_connected_read_only_mirror=${{ steps.mirror.outcome }}
          reference_protocol=${{ steps.reference_protocol.outcome }}
          external_public_deployment=false
          physical_mc68000_execution=false
          personal_posix_completeness=false
          sql92_full_conformance=false
          authority_or_mirror_mutation=false
          publication=false
          pass=false
          final_pass=false
          effect_ack_done=false
          EOF
          cat "$QIKVRT_SERVICE_EVIDENCE_DIR/CLOUD_TRANSPUTER_RECEIPT.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qikvrt-cloud-transputer-${{ steps.subject.outputs.head }}-${{ github.run_attempt }}
          path: /tmp/qikvrt-service-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Teardown
        if: always()
        env:
          QIKVRT_UNIVERSAL_TERMINAL_IMAGE: qikvrt/universal-terminal:${{ steps.subject.outputs.head }}
          QIKVRT_DB_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -f deploy/universal-terminal/compose.yaml down -v --remove-orphans || true
