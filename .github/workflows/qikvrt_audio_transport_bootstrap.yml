name: QIK-VRT one-shot audio transport bootstrap

on:
  push:
    branches: [automation/audio-20260724-103937]
    paths: [.github/workflows/qikvrt_audio_transport_bootstrap.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact transport state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/audio-20260724-103937
          persist-credentials: false

      - name: Reconstruct and verify full-length transport
        id: media
        shell: bash
        env:
          EXPECTED_CHUNKS: '8'
          EXPECTED_BYTES: '43219'
          EXPECTED_SHA256: edd794daa6991a4a9ebc27fe73c16d650bcc11665c8d6bd290d4923278e9beb1
        run: |
          set -euo pipefail
          root='requests/audio-20260724-103937'
          mapfile -t chunks < <(find "$root" -maxdepth 1 -type f -name 'source.opus.b64.*' -print | sort)
          [[ "${#chunks[@]}" -eq "$EXPECTED_CHUNKS" ]]
          for i in "${!chunks[@]}"; do
            printf -v suffix '%02d' "$i"
            [[ "${chunks[$i]}" == "$root/source.opus.b64.$suffix" ]]
          done
          audio="$RUNNER_TEMP/AUDIO-2026-07-24-10-39-37.ogg"
          : > "$audio"
          for chunk in "${chunks[@]}"; do
            base64 --decode "$chunk" >> "$audio"
          done
          bytes="$(wc -c < "$audio" | tr -d ' ')"
          sha256="$(sha256sum "$audio" | awk '{print $1}')"
          [[ "$bytes" = "$EXPECTED_BYTES" ]]
          [[ "$sha256" = "$EXPECTED_SHA256" ]]
          duration="$(ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$audio")"
          python3 - "$duration" <<'PY'
          import math, sys
          value=float(sys.argv[1])
          if not math.isfinite(value) or not 21.70 <= value <= 21.90:
              raise SystemExit(f'unexpected duration: {value}')
          PY
          {
            echo "audio=$audio"
            echo "bytes=$bytes"
            echo "sha256=$sha256"
            echo "duration=$duration"
          } >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/media-receipt.json" "$bytes" "$sha256" "$duration" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
            'schema':'qikvrt_audio_transport_media_receipt_v1',
            'chunk_count':8,
            'derived_bytes':int(sys.argv[2]),
            'derived_sha256':sys.argv[3],
            'duration_seconds':float(sys.argv[4]),
            'original_filename':'AUDIO-2026-07-24-10-39-37(1).m4a',
            'original_bytes':236552,
            'original_sha256':'46bdb66ebfeb54514f20354267dc7cb62e13b72c41a2446fdf23babf1478b22b',
            'derivation':'ffmpeg mono 16 kHz libopus 16 kbit/s application=voip',
          },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Create unreferenced authenticated Git blob
        id: blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          AUDIO_PATH: ${{ steps.media.outputs.audio }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.request
          audio=pathlib.Path(os.environ['AUDIO_PATH']).read_bytes()
          request=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs",
            method='POST',
            data=json.dumps({'content':base64.b64encode(audio).decode('ascii'),'encoding':'base64'},separators=(',',':')).encode(),
            headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'qikvrt-audio-bootstrap'},
          )
          try:
            with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
          except urllib.error.HTTPError as error:
            raise SystemExit(f"blob API failed: {error.code}: {error.read().decode(errors='replace')}") from error
          sha=str(result['sha'])
          if len(sha)!=40: raise SystemExit('invalid blob SHA')
          pathlib.Path(os.environ['RUNNER_TEMP'],'blob-receipt.json').write_text(json.dumps({'schema':'qikvrt_audio_blob_receipt_v1','blob_sha':sha},indent=2)+'\n')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output: output.write(f'blob_sha={sha}\n')
          PY

      - name: Commit authenticated request manifest
        id: manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BLOB_SHA: ${{ steps.blob.outputs.blob_sha }}
          SOURCE_SHA256: ${{ steps.media.outputs.sha256 }}
          SOURCE_BYTES: ${{ steps.media.outputs.bytes }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.request
          manifest={
            'schemaVersion':'1.0.0',
            'requestId':'audio-20260724-103937',
            'source':{
              'kind':'github-git-blob','repository':os.environ['REPOSITORY'],
              'blobSha':os.environ['BLOB_SHA'],'sha256':os.environ['SOURCE_SHA256'],
              'bytes':int(os.environ['SOURCE_BYTES']),'filename':'AUDIO-2026-07-24-10-39-37.ogg'
            },
            'transcription':{'language':'de','chunkSeconds':28,'overlapSeconds':1.5,'threads':4},
            'response':{'instruction':'Read AI, AI_CONTEXT.json, AGENTS.md and repository evidence. Answer the transcribed command in German. Determine whether the GitHub mechanisms are completely and independently implemented. Separate implemented capability, verified execution, and remaining human or external authorization boundaries. Claim no unverified effect. Provenance boundary: original M4A SHA-256 46bdb66ebfeb54514f20354267dc7cb62e13b72c41a2446fdf23babf1478b22b, 236552 bytes; authenticated transport is a complete 21.808-second mono Opus derivation SHA-256 edd794daa6991a4a9ebc27fe73c16d650bcc11665c8d6bd290d4923278e9beb1.'}
          }
          raw=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()
          request=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['REPOSITORY']}/contents/requests/audio/20260724-103937.json",
            method='PUT',
            data=json.dumps({'message':'Submit authenticated audio transcription request','content':base64.b64encode(raw).decode('ascii'),'branch':'audio-request/20260724-103937'},separators=(',',':')).encode(),
            headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'qikvrt-audio-bootstrap'},
          )
          try:
            with urllib.request.urlopen(request,timeout=60) as response: result=json.load(response)
          except urllib.error.HTTPError as error:
            raise SystemExit(f"contents API failed: {error.code}: {error.read().decode(errors='replace')}") from error
          commit=str(result['commit']['sha'])
          pathlib.Path(os.environ['RUNNER_TEMP'],'manifest-receipt.json').write_text(json.dumps({'schema':'qikvrt_audio_request_manifest_receipt_v1','request_id':'audio-20260724-103937','blob_sha':os.environ['BLOB_SHA'],'manifest_commit':commit,'source_sha256':os.environ['SOURCE_SHA256'],'source_bytes':int(os.environ['SOURCE_BYTES'])},indent=2,sort_keys=True)+'\n')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output: output.write(f'manifest_commit={commit}\n')
          PY

      - name: Upload non-content receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-audio-bootstrap-20260724-103937
          retention-days: 7
          path: ${{ runner.temp }}/*-receipt.json
          if-no-files-found: warn

      - name: Remove reconstructed audio
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/AUDIO-2026-07-24-10-39-37.ogg"
