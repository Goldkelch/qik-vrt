name: QIK-VRT one-shot audio transport bootstrap

on:
  push:
    branches: [automation/audio-20260724-103937]
    paths: [.github/workflows/qikvrt_audio_transport_bootstrap.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact transport state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/audio-20260724-103937
          persist-credentials: false

      - name: Validate contiguous chunk inventory
        id: chunks
        shell: bash
        run: |
          set -euo pipefail
          root='requests/audio-20260724-103937'
          list="$RUNNER_TEMP/chunks.txt"
          find "$root" -maxdepth 1 -type f -name 'audio.opus.b64.*' -print | sort > "$list"
          count="$(wc -l < "$list" | tr -d ' ')"
          (( count >= 1 && count <= 20 ))
          i=0
          while IFS= read -r chunk; do
            printf -v suffix '%02d' "$i"
            [[ "$chunk" == "$root/audio.opus.b64.$suffix" ]]
            i=$((i+1))
          done < "$list"
          [[ "$i" -eq "$count" ]]
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          printf '{"stage":"chunks-validated","count":%s}\n' "$count" > "$RUNNER_TEMP/chunks-receipt.json"

      - name: Decode independently encoded chunks
        id: decoded
        shell: bash
        env:
          CHUNK_LIST: ${{ steps.chunks.outputs.list }}
        run: |
          set -euo pipefail
          audio="$RUNNER_TEMP/request.ogg"
          : > "$audio"
          while IFS= read -r chunk; do
            base64 --decode "$chunk" >> "$audio"
          done < "$CHUNK_LIST"
          test -s "$audio"
          bytes="$(wc -c < "$audio" | tr -d ' ')"
          (( bytes > 1000 && bytes <= 26214400 ))
          digest="$(sha256sum "$audio" | awk '{print $1}')"
          echo "audio_path=$audio" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          printf '{"stage":"chunks-decoded","bytes":%s,"sha256":"%s"}\n' "$bytes" "$digest" > "$RUNNER_TEMP/decode-receipt.json"

      - name: Probe reconstructed media duration
        id: media
        shell: bash
        env:
          AUDIO_PATH: ${{ steps.decoded.outputs.audio_path }}
        run: |
          set -euo pipefail
          duration="$(ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$AUDIO_PATH")"
          python3 - "$duration" <<'PY'
          import math, sys
          duration=float(sys.argv[1])
          if not math.isfinite(duration) or not 20.0 <= duration <= 23.0:
              raise SystemExit(f'unexpected duration: {duration}')
          PY
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          printf '{"stage":"media-probed","duration":%s}\n' "$duration" > "$RUNNER_TEMP/media-receipt.json"

      - name: Create unreferenced authenticated Git blob
        id: blob
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          AUDIO_PATH: ${{ steps.decoded.outputs.audio_path }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.request
          audio=pathlib.Path(os.environ['AUDIO_PATH']).read_bytes()
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs"
          req=urllib.request.Request(url,method='POST',data=json.dumps({'content':base64.b64encode(audio).decode('ascii'),'encoding':'base64'},separators=(',',':')).encode(),headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'qikvrt-audio-bootstrap'})
          try:
              with urllib.request.urlopen(req,timeout=60) as response: result=json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f'blob API failed: {error.code}: {error.read().decode(errors="replace")}') from error
          sha=str(result['sha'])
          if len(sha)!=40: raise SystemExit('invalid blob SHA')
          pathlib.Path(os.environ['RUNNER_TEMP'],'blob-receipt.json').write_text(json.dumps({'stage':'blob-created','blob_sha':sha},indent=2)+'\n')
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output: output.write(f'blob_sha={sha}\n')
          PY

      - name: Commit authenticated request manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BLOB_SHA: ${{ steps.blob.outputs.blob_sha }}
          SOURCE_SHA256: ${{ steps.decoded.outputs.sha256 }}
          SOURCE_BYTES: ${{ steps.decoded.outputs.bytes }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64, json, os, pathlib, urllib.error, urllib.request
          manifest={'schemaVersion':'1.0.0','requestId':'audio-20260724-103937','source':{'kind':'github-git-blob','repository':os.environ['REPOSITORY'],'blobSha':os.environ['BLOB_SHA'],'sha256':os.environ['SOURCE_SHA256'],'bytes':int(os.environ['SOURCE_BYTES']),'filename':'AUDIO-2026-07-24-10-39-37.ogg'},'transcription':{'language':'de','chunkSeconds':28,'overlapSeconds':1.5,'threads':4},'response':{'instruction':'Read AI, AI_CONTEXT.json, AGENTS.md and repository evidence. Answer the transcribed command in German. Determine whether the GitHub mechanisms are completely and independently implemented. Separate implemented capability, verified execution, and remaining human or external authorization boundaries. Claim no unverified effect.'}}
          raw=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/contents/requests/audio/20260724-103937.json"
          req=urllib.request.Request(url,method='PUT',data=json.dumps({'message':'Submit authenticated audio transcription request','content':base64.b64encode(raw).decode('ascii'),'branch':'audio-request/20260724-103937'},separators=(',',':')).encode(),headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'qikvrt-audio-bootstrap'})
          try:
              with urllib.request.urlopen(req,timeout=60) as response: result=json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f'contents API failed: {error.code}: {error.read().decode(errors="replace")}') from error
          receipt={'stage':'manifest-committed','request_id':'audio-20260724-103937','blob_sha':os.environ['BLOB_SHA'],'source_sha256':os.environ['SOURCE_SHA256'],'source_bytes':int(os.environ['SOURCE_BYTES']),'manifest_commit':str(result['commit']['sha'])}
          pathlib.Path(os.environ['RUNNER_TEMP'],'manifest-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'request_id':receipt['request_id'],'manifest_commit':receipt['manifest_commit'],'source_bytes':receipt['source_bytes'],'source_sha256':receipt['source_sha256']}))
          PY

      - name: Upload non-content receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-audio-bootstrap-20260724-103937
          retention-days: 7
          path: ${{ runner.temp }}/*-receipt.json
          if-no-files-found: warn

      - name: Remove reconstructed audio
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/request.ogg"
