name: QIKVRT issue1232 owner-PR independence bootstrap

on:
  push:
    branches:
      - issue-agent/1232

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-issue1232-owner-pr-independence-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'Goldkelch/qik-vrt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: issue-agent/1232
      SOURCE_HEAD: ${{ github.sha }}
      SELF_PATH: .github/workflows/qikvrt_issue1232_owner_pr_independence_bootstrap.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Bind exact bootstrap source and remove one-shot carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$SOURCE_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)" = "$SOURCE_HEAD"
          rm "$SELF_PATH"

      - name: Regenerate integrity and execute repository gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest -v \
            tests.test_qikvrt_ruleset_reconcile \
            tests.test_qikvrt_autonomous_ruleset_effect_loop \
            tests.test_qikvrt_ruleset_effect_dispatch_bridge
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Persist exact bot-bootstrap successor
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)" = "$SOURCE_HEAD"
          git config user.name "qik-vrt-autonomy[bot]"
          git config user.email "qik-vrt-autonomy[bot]@users.noreply.github.com"
          git add -A -- "$SELF_PATH" REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          git commit -m "chore(autonomy): close owner-PR independence bootstrap"
          successor="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          test "$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)" = "$successor"
          echo "head=$successor" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Open bot-owned review carrier and dispatch exact verification
        shell: bash
        env:
          SUCCESSOR_HEAD: ${{ steps.persist.outputs.head }}
          SUCCESSOR_TREE: ${{ steps.persist.outputs.tree }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --head "$TARGET_REF" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head "$TARGET_REF" \
              --title "autonomy: remove owner-authored PR dependency for ruleset repair" \
              --body "Repository-global ruleset reconciliation no longer requires a PR authored by Ingolf Lohmann. Exact ruleset 19344903 remains bound to policy/GITHUB_MAIN_RULESET_V1.json; protection weakening is not authorized. Missing Administration:write authority remains REQUEST_AUTHORITY. Issue #1232 is the durable owner-authorization carrier."
            pr="$(gh pr list --head "$TARGET_REF" --state open --json number --jq '.[0].number')"
          fi
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .base.sha)"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .head.sha)" = "$SUCCESSOR_HEAD"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_ci.yml/dispatches" \
            -f ref="$TARGET_REF"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg pr "$pr" \
            --arg ref "$TARGET_REF" \
            --arg head "$SUCCESSOR_HEAD" \
            --arg base "$base_sha" \
            '{event_type:"qikvrt_autonomous_exact_head_verify",client_payload:{repository:$repository,pull_request:($pr|tonumber),head_ref:$ref,head_sha:$head,base_sha:$base,d0:2,causal_state:"BOOTSTRAP",reason:"OWNER_AUTHORED_PR_DEPENDENCY_REMOVAL"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

          cat > "$RUNNER_TEMP/comment.md" <<EOF
          <!-- qikvrt-owner-pr-independence-bootstrap:v1 -->
          Repository-global autonomy bootstrap persisted.

          Bot-owned PR: #${pr}
          Exact HEAD: \`$SUCCESSOR_HEAD\`
          Exact TREE: \`$SUCCESSOR_TREE\`

          \`OWNER_AUTHORED_PR_REQUIRED_FOR_RULESET_RECONCILIATION = FALSE\`
          \`PREDECESSOR_EVIDENCE_TRANSFER = FALSE\`
          \`EFFECT_ACK_DONE = FALSE\`
          EOF
          gh issue comment 1232 --body-file "$RUNNER_TEMP/comment.md"
