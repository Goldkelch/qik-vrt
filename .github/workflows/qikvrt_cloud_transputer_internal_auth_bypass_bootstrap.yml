# Temporary finite repair for the production-only Basic Auth / internal health
# boundary. When terminal auth is enabled, loopback may satisfy nginx access
# control while non-loopback clients must satisfy Basic Auth. The workflow
# verifies the contract, regenerates integrity, removes itself and CAS-pushes
# exactly one successor.
name: QIKVRT cloud transputer internal terminal health auth repair bootstrap

on:
  push:
    branches: [runtime/cloud-transputer-v1]

permissions:
  contents: write

concurrency:
  group: qikvrt-cloud-transputer-internal-auth-bypass-bootstrap
  cancel-in-progress: false

jobs:
  repair-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply exact loopback-or-auth nginx contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B - <<'PY'
          from pathlib import Path

          entry_path = Path('deploy/cloud-transputer/entrypoint.sh')
          entry = entry_path.read_text(encoding='utf-8')
          old = '''  TERMINAL_AUTH_DIRECTIVES="auth_basic \\\"QIK-VRT Universal Terminal\\\";\n      auth_basic_user_file $RUN_DIR/terminal.htpasswd;"\n'''
          new = '''  TERMINAL_AUTH_DIRECTIVES="satisfy any;\n      allow 127.0.0.1;\n      allow ::1;\n      deny all;\n      auth_basic \\\"QIK-VRT Universal Terminal\\\";\n      auth_basic_user_file $RUN_DIR/terminal.htpasswd;"\n'''
          if entry.count(old) != 1:
              raise SystemExit('BLOCK: exact terminal Basic Auth directive block not observed once')
          entry_path.write_text(entry.replace(old, new), encoding='utf-8', newline='\n')

          test_path = Path('tests/test_qikvrt_cloud_transputer_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          old_test = '''        self.assertIn("auth_basic_user_file $RUN_DIR/terminal.htpasswd;", text)\n        self.assertIn("location = /health", text)\n'''
          new_test = '''        self.assertIn("auth_basic_user_file $RUN_DIR/terminal.htpasswd;", text)\n        self.assertIn("satisfy any;", text)\n        self.assertIn("allow 127.0.0.1;", text)\n        self.assertIn("allow ::1;", text)\n        self.assertIn("deny all;", text)\n        self.assertIn("location = /health", text)\n'''
          if tests.count(old_test) != 1:
              raise SystemExit('BLOCK: public terminal guard regression anchor not observed once')
          test_path.write_text(tests.replace(old_test, new_test), encoding='utf-8', newline='\n')
          PY

          python3 -B -m unittest -v tests.test_qikvrt_cloud_transputer_contract
          sh -n deploy/cloud-transputer/entrypoint.sh deploy/cloud-transputer/runtime-health.sh deploy/cloud-transputer/authority-mirror-refresh.sh

      - name: Remove bootstrap and regenerate integrity trio
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/qikvrt_cloud_transputer_internal_auth_bypass_bootstrap.yml
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          git add deploy/cloud-transputer/entrypoint.sh \
                  tests/test_qikvrt_cloud_transputer_contract.py \
                  REPOSITORY_FILE_MANIFEST.json \
                  REPOSITORY_FILE_MANIFEST.json.sha256 \
                  SHA256SUMS.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_head="$(git ls-remote --heads origin refs/heads/runtime/cloud-transputer-v1 | awk 'NR==1 {print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git commit -m "fix: allow internal terminal health through public auth guard"
          git push origin HEAD:refs/heads/runtime/cloud-transputer-v1