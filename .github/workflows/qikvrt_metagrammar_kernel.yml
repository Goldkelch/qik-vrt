name: QIKVRT metagrammar kernel

on:
  pull_request:
    paths:
      - '.github/workflows/qikvrt_metagrammar_kernel.yml'
      - 'docs/QIKVRT_METAGRAMMAR_OF_UNDERSTANDING_V1.md'
      - 'spec/QIKVRT_METAGRAMMAR_V1.ebnf'
      - 'state/autonomy/QIKVRT_METAGRAMMAR_KERNEL_V1.json'
      - 'tests/test_qikvrt_metagrammar_kernel.py'
      - 'tools/qikvrt_metagrammar_kernel.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate normative JSON
        run: python -m json.tool state/autonomy/QIKVRT_METAGRAMMAR_KERNEL_V1.json >/dev/null
      - name: Compile validator
        run: python -m py_compile tools/qikvrt_metagrammar_kernel.py
      - name: Run metagrammar controls
        run: python -m pytest -q tests/test_qikvrt_metagrammar_kernel.py
