name: QIKVRT PR1201 one-shot image-text integrity successor

on:
  push:
    branches:
      - fix/generated-image-text-fidelity-gate
    paths:
      - ".github/workflows/qikvrt_pr1201_image_text_integrity_once.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: qikvrt-pr1201-image-text-integrity-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_REF: fix/generated-image-text-fidelity-gate
      HELPER_PATH: .github/workflows/qikvrt_pr1201_image_text_integrity_once.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"
          remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote" = "$GITHUB_SHA"
          printf 'SOURCE_HEAD=%s\nSOURCE_TREE=%s\n' "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')"
      - name: Remove one-shot carrier and materialize deterministic integrity
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "$HELPER_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify
      - name: Persist exact successor
        shell: bash
        run: |
          set -euo pipefail
          source_head="$GITHUB_SHA"
          remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote" = "$source_head"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git diff --cached --check
          git commit -m "fix(quality): materialize image-text fidelity gate"
          successor="$(git rev-parse --verify HEAD^{commit})"
          remote_before_push="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_before_push" = "$source_head"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          remote_after_push="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 {print $1}')"
          test "$remote_after_push" = "$successor"
          printf 'SUCCESSOR_HEAD=%s\nSUCCESSOR_TREE=%s\nPREDECESSOR_EVIDENCE_TRANSFER=false\nEFFECT_ACK_DONE=false\n' "$successor" "$(git rev-parse 'HEAD^{tree}')"
      - name: Admit exact successor into repository-native gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            qikvrt_ci.yml \
            qikvrt_batch04_integrity.yml \
            qikvrt_collective_review.yml \
            qikvrt_requested_review_contract.yml
          do
            gh workflow run "$workflow" --ref "$TARGET_REF"
          done
