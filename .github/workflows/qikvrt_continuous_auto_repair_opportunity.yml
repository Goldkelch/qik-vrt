name: QIKVRT continuous auto-repair opportunity contract

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qikvrt_autonomous_self_heal.yml"
      - ".github/workflows/qikvrt_continuous_auto_repair_opportunity.yml"
      - "state/autonomy/CONTINUOUS_AUTO_REPAIR_OPPORTUNITY_CONTRACT_V1.json"
      - "tests/test_qikvrt_continuous_auto_repair_opportunity.py"
  pull_request:
    paths:
      - ".github/workflows/qikvrt_autonomous_self_heal.yml"
      - ".github/workflows/qikvrt_continuous_auto_repair_opportunity.yml"
      - "state/autonomy/CONTINUOUS_AUTO_REPAIR_OPPORTUNITY_CONTRACT_V1.json"
      - "tests/test_qikvrt_continuous_auto_repair_opportunity.py"

permissions:
  contents: read

concurrency:
  group: qikvrt-continuous-auto-repair-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact observed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact head and continuous auto-repair contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          python3 -B -m json.tool \
            state/autonomy/CONTINUOUS_AUTO_REPAIR_OPPORTUNITY_CONTRACT_V1.json \
            >/dev/null
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_continuous_auto_repair_opportunity
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B \
            tools/qikvrt_integrity.py verify
