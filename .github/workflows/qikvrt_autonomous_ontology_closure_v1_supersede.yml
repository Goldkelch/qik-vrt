name: QIK-VRT verify static ontology closure v1 superseded

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/qikvrt_autonomous_ontology_closure.yml"
      - ".github/workflows/qikvrt_autonomous_ontology_closure_v2.yml"
      - ".github/workflows/qikvrt_autonomous_ontology_closure_v1_supersede.yml"
      - "state/ontology-autonomy/QUEUE.json"
      - "state/ontology-autonomy/QUEUE_V2.json"
      - "tools/qikvrt_autonomous_ontology_closure_v2.py"

permissions:
  contents: read

concurrency:
  group: qikvrt-autonomous-ontology-closure-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-static-v1-superseded:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'agent/autonomous-ontology-closure-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify V1 is already superseded by progressing V2
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import pathlib

          queue_path = pathlib.Path('state/ontology-autonomy/QUEUE.json')
          queue = json.loads(queue_path.read_text(encoding='utf-8'))
          unit = queue['work_units'][0]
          assert unit['state'] == 'SUPERSEDED_BY_PROGRESSING_V2'
          assert queue['superseded_by']['queue'] == 'state/ontology-autonomy/QUEUE_V2.json'
          assert queue['superseded_by']['operator'] == 'tools/qikvrt_autonomous_ontology_closure_v2.py'
          assert pathlib.Path('state/ontology-autonomy/QUEUE_V2.json').is_file()
          assert pathlib.Path('tools/qikvrt_autonomous_ontology_closure_v2.py').is_file()
          assert pathlib.Path('.github/workflows/qikvrt_autonomous_ontology_closure_v2.yml').is_file()
          assert not pathlib.Path('.github/workflows/qikvrt_autonomous_ontology_closure.yml').exists()
          PY
