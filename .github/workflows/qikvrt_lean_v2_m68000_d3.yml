name: QIKVRT Lean v2 D3 M68000 compiler

on:
  pull_request:
    paths:
      - "src/m68000/qikvrt_lean_v2_d3_step.s"
      - "runtime/m68000/qikvrt_lean_v2_d3_step.hex"
      - "tools/qikvrt_lean_v2_m68000_d3_compiler.py"
      - "tests/test_qikvrt_lean_v2_m68000_d3_compiler.py"
      - ".github/workflows/qikvrt_lean_v2_m68000_d3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-compile-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Kernel-check frozen v2 formal source
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization/QIKVRT_Formalization_v2.0
          test: false
      - name: Compile and exhaustively verify finite machine projection
        run: |
          set -euo pipefail
          python3 tools/qikvrt_lean_v2_m68000_d3_compiler.py | tee qikvrt-lean-v2-d3-m68000-report.json
          python3 -m unittest tests.test_qikvrt_lean_v2_m68000_d3_compiler -v
      - name: Reject proof-hole syntax in frozen source the compiler relies on
        run: |
          set -euo pipefail
          for target in \
            formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/Hardware/D3FixedPoint.lean \
            formalization/QIKVRT_Formalization_v2.0/QIKVRTFormalization/Hardware/AuthorityMirrorWitness.lean
          do
            if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' "$target"; then
              echo "BLOCK: proof-hole syntax in $target"
              exit 1
            fi
          done
      - name: Assert frozen v2 release source is not in PR diff
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
              formalization/QIKVRT_Formalization_v2.0 | grep -q .; then
            echo 'BLOCK: frozen formalization-v2 source drifted'
            exit 1
          fi
      - name: Publish compiler report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-lean-v2-d3-m68000-${{ github.sha }}
          path: qikvrt-lean-v2-d3-m68000-report.json
          retention-days: 30
          if-no-files-found: error
