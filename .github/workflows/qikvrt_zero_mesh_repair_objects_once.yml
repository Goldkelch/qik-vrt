name: QIKVRT finite zero-mesh repair objects
on:
  push:
    branches: [materialize/zero-mesh-boundary-a860-20260912-v1]
    paths:
      - .github/workflows/qikvrt_zero_mesh_repair_objects_once.yml
      - transport/zero-mesh-runner-context.patch
permissions:
  contents: write
concurrency:
  group: qikvrt-zero-mesh-repair-objects-20260912-v1
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 41ddf2d85f7d11ebf87d7e07a95b7a1dd97bf878
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact source and apply the runner-context correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mesh-repair"
          exec > >(tee "$RUNNER_TEMP/mesh-repair/BINDING.log") 2>&1
          test "$(git rev-parse HEAD)" = 41ddf2d85f7d11ebf87d7e07a95b7a1dd97bf878
          test "$(git rev-parse HEAD^{tree})" = d58aa5a0234ad473910ea152b575930689c498ef
          test -z "$(git status --porcelain)"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = a86054139b49c13c5cd344753b248b46b5daf66f
          test "$(git ls-remote --heads origin refs/heads/fix/mesh-receipt-ledger-binding-a860-v1 | awk '{print $1}')" = 41ddf2d85f7d11ebf87d7e07a95b7a1dd97bf878
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mesh-repair'
          raw=subprocess.check_output(['git','cat-file','blob','ecefa925052fd4948f0671b2fdbe96d793edb954'])
          assert hashlib.sha256(raw).hexdigest()=='036dcfbaef2c546ce2671542f9a343659dc4fe345e9de4d5025d8071254b88bb'
          path=root/'repair.patch';path.write_bytes(raw)
          subprocess.check_call(['git','apply','--check',str(path)])
          subprocess.check_call(['git','apply',str(path)])
          expected={'.github/workflows/qikvrt_real_mesh_system_verification.yml':'a95c96533fd982c7daf94f6a5363bca4383ba4452ca9fe2069c3bd4d286b2dab','tests/test_qikvrt_real_mesh_system_verification.py':'9d0e080c63d2a0e29e30c878a2d702cd6f984bd1932ccd2e7e9e30e1ae9874e5'}
          assert sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==sorted(expected)
          for path,digest in expected.items():assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest,path
          (root/'EXPECTED_SOURCE_DIGESTS.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
      - name: Execute actual CLI, context-boundary and complete repository regression suites
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_real_mesh tests.test_qikvrt_real_mesh_system_verification \
            tests.test_effect_ack_conformance 2>&1 | tee "$RUNNER_TEMP/mesh-repair/TARGETED_TESTS.log"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          set +e
          make test > "$RUNNER_TEMP/mesh-repair/FULL_TESTS.log" 2>&1
          rc=$?
          set -e
          tail -n 60 "$RUNNER_TEMP/mesh-repair/FULL_TESTS.log"
          test "$rc" -eq 0
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
      - name: Preserve only five checked output copies on the exact helper ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'mesh-repair'
          source='41ddf2d85f7d11ebf87d7e07a95b7a1dd97bf878'
          main='a86054139b49c13c5cd344753b248b46b5daf66f'
          subject_branch='fix/mesh-receipt-ledger-binding-a860-v1'
          branch='materialize/zero-mesh-boundary-a860-20260912-v1'
          producer=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']=='Goldkelch/qik-vrt'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          def git(*args,cwd=None):return subprocess.check_output(['git',*args],cwd=cwd,timeout=90)
          def remote(ref):
              lines=git('ls-remote','--exit-code','--heads','origin','refs/heads/'+ref).decode().splitlines()
              assert len(lines)==1
              return lines[0].split()[0]
          assert remote('main')==main and remote(subject_branch)==source and remote(branch)==producer
          paths=list(json.loads((root/'EXPECTED_SOURCE_DIGESTS.json').read_text()))+['REPOSITORY_FILE_MANIFEST.json','REPOSITORY_FILE_MANIFEST.json.sha256','SHA256SUMS.txt']
          assert sorted(git('diff','--name-only').decode().splitlines())==sorted(paths)
          assert not git('ls-files','--others','--exclude-standard').strip()
          with tarfile.open(root/'changed-files.tar.gz','w:gz') as archive:
              for path in paths:archive.add(path,arcname=path)
          work=root/'transport-worktree';git('worktree','add','--detach',str(work),producer)
          prefix='transport/zero-mesh-checked-v4/';assert not (work/prefix).exists()
          files={}
          for path in paths:
              raw=pathlib.Path(path).read_bytes();target=work/prefix/path
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
              files[path]={'sha':hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest(),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          git('add','--',prefix,cwd=work)
          assert sorted(git('diff','--cached','--name-only',cwd=work).decode().splitlines())==sorted(prefix+p for p in paths)
          git('-c','user.name=qikvrt-mesh-object-transport','-c','user.email=qikvrt-mesh-object-transport@users.noreply.github.com','commit','-m','transport(mesh): preserve checked runner-context repair',cwd=work)
          transport=git('rev-parse','HEAD',cwd=work).decode().strip()
          assert git('rev-parse','HEAD^',cwd=work).decode().strip()==producer
          assert remote('main')==main and remote(subject_branch)==source and remote(branch)==producer
          helper='!f() { printf "username=x-access-token\\npassword=%s\\n" "$GH_TOKEN"; }; f'
          git('-c','credential.helper='+helper,'push','origin','HEAD:refs/heads/'+branch,cwd=work)
          assert remote(branch)==transport
          git('fetch','--no-tags','origin','refs/heads/'+branch)
          assert git('rev-parse','FETCH_HEAD').decode().strip()==transport
          for path in paths:
              assert git('show',transport+':'+prefix+path)==pathlib.Path(path).read_bytes(),path
              assert git('rev-parse',transport+':'+prefix+path).decode().strip()==files[path]['sha']
          assert remote('main')==main and remote(subject_branch)==source
          receipt={'schema':'qikvrt_zero_mesh_repair_objects_v1','source_head':source,'source_tree':'d58aa5a0234ad473910ea152b575930689c498ef','main_head':main,'producer_run':os.environ['GITHUB_RUN_ID'],'producer_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'producer_head':producer,'patch_sha256':'036dcfbaef2c546ce2671542f9a343659dc4fe345e9de4d5025d8071254b88bb','files':files,'regression_and_full_repository_tests_executed':True,'blob_bytes_independently_reobserved':True,'transport_ref':branch,'transport_head':transport,'transport_ref_mutation':True,'main_mutation':False,'candidate_mutation':False,'successor_validation_transferred':False,'general_effect_ack_done':False}
          (root/'OBJECT_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2));git('worktree','remove',str(work))
          PY
      - name: Preserve exact transport receipt and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-zero-mesh-repair-objects-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mesh-repair/*.json
            ${{ runner.temp }}/mesh-repair/*.log
            ${{ runner.temp }}/mesh-repair/*.patch
            ${{ runner.temp }}/mesh-repair/*.tar.gz
          if-no-files-found: error
          retention-days: 30
