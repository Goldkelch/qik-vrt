# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: One-shot pypdf 6.15.0 successor materializer v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_materialize_pypdf_6150_successor_v2.yml

permissions:
  contents: write

concurrency:
  group: materialize-pypdf-6150-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize final target tree in workspace
        shell: python
        run: |
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import re

          root = Path('.')
          req = root / 'runtime/toolchains/requirements-xml2rfc-3.34.0.txt'
          sh = root / 'tools/bootstrap-runtime.sh'
          ps1 = root / 'tools/bootstrap-runtime.ps1'
          lock = root / 'runtime/toolchains/TOOLCHAIN.lock.tsv'
          provenance = root / 'runtime/toolchains/PROVENANCE.md'
          notices = root / 'runtime/toolchains/THIRD_PARTY_NOTICES.md'
          registry = root / 'runtime/toolchains/CACHE_REGISTRY.json'
          coverage = root / 'runtime/toolchains/CACHE_COVERAGE.json'
          adaptive = root / '.github/workflows/qikvrt_adaptive_runtime.yml'
          runtime_test = root / 'tests/test_runtime_bootstrap.sh'
          compat = root / 'tests/test_pypdf_runtime_contract.py'

          old_req = req.read_text(encoding='utf-8')
          new_req, count = re.subn(
              r'pypdf==6\.14\.2 \\\n(?:    --hash=sha256:[0-9a-f]{64}(?: \\\n)?)+',
              'pypdf==6.15.0 \\\n    --hash=sha256:14e001d6504822cb1ca9c7ed9a69bccb320f59b320730f55af804361abe4d5ee',
              old_req,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one pypdf 6.14.2 requirements stanza, got {count}')
          if 'd39c4d955a76409284a905e2d65b40076d77ab76129e0faaeeb6612403ecfc79' in new_req:
              raise SystemExit('sdist hash must not remain in wheel-only lock')
          req.write_text(new_req, encoding='utf-8')
          req_sha = hashlib.sha256(req.read_bytes()).hexdigest()

          sh_text = sh.read_text(encoding='utf-8')
          sh_text, count = re.subn(
              r'python_package_is_exact "\$CACHED_PYTHON" pypdf 6\.14\.2 \|\| fail "installed pypdf metadata is not exactly 6\.14\.2"',
              'python_package_is_exact "$CACHED_PYTHON" pypdf 6.15.0 || fail "installed pypdf metadata is not exactly 6.15.0"',
              sh_text,
              count=1,
          )
          if count != 1:
              raise SystemExit('POSIX pypdf exact-version assertion not found exactly once')
          sh.write_text(sh_text, encoding='utf-8')

          ps_text = ps1.read_text(encoding='utf-8')
          ps_text, count = re.subn(
              r"Test-PythonPackageExact -Path \$CachedPython -Prefix @\(\) -Package pypdf -Version '6\.14\.2'\)\) \{ Stop-Block 'installed pypdf metadata is not exactly 6\.14\.2' \}",
              "Test-PythonPackageExact -Path $CachedPython -Prefix @() -Package pypdf -Version '6.15.0')) { Stop-Block 'installed pypdf metadata is not exactly 6.15.0' }",
              ps_text,
              count=1,
          )
          if count != 1:
              raise SystemExit('PowerShell pypdf exact-version assertion not found exactly once')
          ps1.write_text(ps_text, encoding='utf-8')

          rows = []
          seen_xml = seen_pdf = 0
          for raw in lock.read_text(encoding='utf-8').splitlines():
              if not raw or raw.startswith('#'):
                  rows.append(raw)
                  continue
              parts = raw.split('\t')
              if parts[0] == 'xml2rfc' and parts[1] == '3.34.0':
                  parts[4] = req_sha
                  seen_xml += 1
              if parts[0] == 'pypdf':
                  parts[1] = '6.15.0'
                  seen_pdf += 1
              rows.append('\t'.join(parts))
          if (seen_xml, seen_pdf) != (1, 1):
              raise SystemExit(f'lock rows unexpected: xml2rfc={seen_xml} pypdf={seen_pdf}')
          lock.write_text('\n'.join(rows) + '\n', encoding='utf-8')

          prov = provenance.read_text(encoding='utf-8').replace('pypdf==6.14.2', 'pypdf==6.15.0').replace('pypdf 6.14.2', 'pypdf 6.15.0')
          prov = re.sub(
              r'(The lock file itself has SHA-256\s*`)[0-9a-f]{64}(`,\s*also recorded in `TOOLCHAIN\.lock\.tsv`\.)',
              rf'\g<1>{req_sha}\g<2>', prov, count=1)
          provenance.write_text(prov, encoding='utf-8')
          notices.write_text(notices.read_text(encoding='utf-8').replace('- pypdf 6.14.2', '- pypdf 6.15.0'), encoding='utf-8')

          registry_data = json.loads(registry.read_text(encoding='utf-8'))
          pypdf = registry_data['components']['pypdf']
          pypdf['version'] = '6.15.0'
          authority = list(pypdf.get('authority_files', []))
          for path in [
              'runtime/toolchains/TOOLCHAIN.lock.tsv',
              'runtime/toolchains/requirements-xml2rfc-3.34.0.txt',
              'tools/bootstrap-runtime.sh', 'tools/bootstrap-runtime.ps1',
              'tests/test_ietf_offline_render.py', 'tests/test_pypdf_runtime_contract.py',
              '.github/workflows/qikvrt_adaptive_runtime.yml']:
              if path not in authority:
                  authority.append(path)
          pypdf['authority_files'] = authority
          pypdf['verification'] = [
              'locked wheel hash', 'exact package version',
              'xml2rfc walkpdf compatibility smoke',
              'offline render identity normalization']
          registry.write_text(json.dumps(registry_data, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          compat.write_text('''#!/usr/bin/env python3\n# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0\n"""Focused compatibility smoke for the pypdf APIs consumed by xml2rfc 3.34.0."""\nfrom __future__ import annotations\nimport importlib.metadata as metadata\nfrom pathlib import Path\nimport tempfile\nimport pypdf\nfrom xml2rfc import walkpdf\n\ndef main() -> int:\n    if metadata.version("pypdf") != "6.15.0":\n        raise SystemExit("FAIL: pypdf metadata is not exactly 6.15.0")\n    md = metadata.metadata("pypdf")\n    expression = md.get("License-Expression") or md.get("License") or ""\n    if "BSD-3-Clause" not in expression:\n        raise SystemExit(f"FAIL: unexpected pypdf license metadata: {expression!r}")\n    writer = pypdf.PdfWriter()\n    writer.add_blank_page(width=72, height=72)\n    with tempfile.TemporaryDirectory(prefix="qikvrt-pypdf-compat-") as temporary:\n        pdf = Path(temporary) / "smoke.pdf"\n        with pdf.open("wb") as handle:\n            writer.write(handle)\n        document = walkpdf.pyobj(filename=str(pdf))\n    pages = document.get("Page")\n    if not isinstance(pages, list) or len(pages) != 1:\n        raise SystemExit("FAIL: xml2rfc.walkpdf did not inspect exactly one page")\n    print("PASS: pypdf 6.15.0 metadata/license and xml2rfc 3.34.0 walkpdf compatibility surface verified")\n    return 0\n\nif __name__ == "__main__":\n    raise SystemExit(main())\n''', encoding='utf-8')

          workflow = adaptive.read_text(encoding='utf-8')
          posix_anchor = '          "$QIKVRT_PYTHON" -B tests/test_ietf_offline_render.py --xml2rfc "$renderer"\n'
          posix_insert = posix_anchor + '          renderer_python="$contract_cache/xml2rfc/3.34.0/python-3.12.13/$renderer_platform/venv/bin/python"\n          "$renderer_python" -B tests/test_pypdf_runtime_contract.py\n'
          if posix_anchor not in workflow:
              raise SystemExit('POSIX adaptive anchor missing')
          workflow = workflow.replace(posix_anchor, posix_insert, 1)
          win_anchor = '          & $env:QIKVRT_PYTHON -B tests/test_ietf_offline_render.py --xml2rfc $renderer\n          if ($LASTEXITCODE -ne 0) { throw "Windows offline renderer test failed: $LASTEXITCODE" }\n'
          win_insert = win_anchor + '          $rendererPython = Join-Path $contractCache \'xml2rfc\\3.34.0\\python-3.12.13\\windows-amd64\\venv\\Scripts\\python.exe\'\n          & $rendererPython -B tests/test_pypdf_runtime_contract.py\n          if ($LASTEXITCODE -ne 0) { throw "Windows pypdf compatibility smoke failed: $LASTEXITCODE" }\n'
          if win_anchor not in workflow:
              raise SystemExit('Windows adaptive anchor missing')
          workflow = workflow.replace(win_anchor, win_insert, 1)
          adaptive.write_text(workflow, encoding='utf-8')

          rt = runtime_test.read_text(encoding='utf-8')
          marker = '# pypdf-contract-cross-file-consistency-v1'
          if marker not in rt:
              rt += f'''\n\n{marker}\nreq_pypdf=$(awk -F '[=[:space:]]+' '$1 == "pypdf" {{print $2}}' "$ROOT/runtime/toolchains/requirements-xml2rfc-3.34.0.txt")\n[ "$req_pypdf" = "6.15.0" ] || fail "requirements pypdf contract is not 6.15.0"\nlock_pypdf=$(awk -F '\\t' '$1 == "pypdf" {{print $2}}' "$ROOT/runtime/toolchains/TOOLCHAIN.lock.tsv")\n[ "$lock_pypdf" = "$req_pypdf" ] || fail "TOOLCHAIN pypdf contract differs from requirements"\nreq_sha=$(hash_file "$ROOT/runtime/toolchains/requirements-xml2rfc-3.34.0.txt")\nlock_req_sha=$(awk -F '\\t' '$1 == "xml2rfc" && $2 == "3.34.0" {{print $5}}' "$ROOT/runtime/toolchains/TOOLCHAIN.lock.tsv")\n[ "$lock_req_sha" = "$req_sha" ] || fail "TOOLCHAIN requirements digest differs from exact requirements bytes"\n'''
              runtime_test.write_text(rt, encoding='utf-8')

          lock_sha = hashlib.sha256(lock.read_bytes()).hexdigest()
          registry_sha = hashlib.sha256(registry.read_bytes()).hexdigest()
          coverage_data = json.loads(coverage.read_text(encoding='utf-8'))
          for component in coverage_data['components']:
              if component.get('component') == 'pypdf':
                  component['version'] = '6.15.0'
          coverage_data['lock_sha256'] = lock_sha
          coverage_data['registry_sha256'] = registry_sha
          coverage.write_text(json.dumps(coverage_data, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          active = [req, sh, ps1, lock, provenance, notices, registry, coverage]
          stale = [str(p) for p in active if '6.14.2' in p.read_text(encoding='utf-8')]
          if stale:
              raise SystemExit(f'active 6.14.2 bindings remain: {stale}')

      - name: Remove temporary workflows in target workspace
        shell: bash
        run: |
          rm -f .github/workflows/_materialize_pypdf_6150_successor.yml
          rm -f .github/workflows/_materialize_pypdf_6150_successor_v2.yml

      - name: Regenerate and verify target-tree integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          sh -n tools/bootstrap-runtime.sh
          python3 -m py_compile tests/test_pypdf_runtime_contract.py

      - name: Carry final adaptive workflow while restoring workflow paths for token-safe push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state/work_units
          cp .github/workflows/qikvrt_adaptive_runtime.yml state/work_units/PYPDF_6150_ADAPTIVE_RUNTIME_TARGET.yml
          sha256sum state/work_units/PYPDF_6150_ADAPTIVE_RUNTIME_TARGET.yml
          git checkout HEAD -- .github/workflows/qikvrt_adaptive_runtime.yml
          git checkout HEAD -- .github/workflows/_materialize_pypdf_6150_successor.yml
          git checkout HEAD -- .github/workflows/_materialize_pypdf_6150_successor_v2.yml

      - name: Persist non-workflow phase
        shell: bash
        env:
          TARGET_BRANCH: agent/pypdf-6.15.0-runtime-contract-v1
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'runtime: materialize pypdf 6.15.0 successor carry'
          git push origin HEAD:"$TARGET_BRANCH"
