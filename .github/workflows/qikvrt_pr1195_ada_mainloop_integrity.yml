name: QIKVRT PR1195 Ada main-loop integrity successor

on:
  push:
    branches:
      - architecture/recursive-execution-acceleration-v1
    paths:
      - .github/workflows/qikvrt_pr1195_ada_mainloop_integrity.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PREDECESSOR: 44f3dbb6631c739295f61121ce46f8ba38634e61
      EXPECTED_MAIN: b075b0630401d8bf5a350620c50e4a08410b8813
      TARGET_REF: architecture/recursive-execution-acceleration-v1
      CARRIER_PATH: .github/workflows/qikvrt_pr1195_ada_mainloop_integrity.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact predecessor and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^1)" = "$EXPECTED_PREDECESSOR"
          live_main="$(git ls-remote --heads origin refs/heads/main | awk 'NR==1 {print $1}')"
          test "$live_main" = "$EXPECTED_MAIN"

      - name: Remove carrier and regenerate integrity
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "$CARRIER_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt

      - name: Execute focused and complete gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1             python3 -B -m unittest -v tests.test_temdd_main_loop_v1
          make test

      - name: Commit push and read back
        shell: bash
        run: |
          set -euo pipefail
          git config user.name qikvrt-temdd-mainloop-integrity
          git config user.email qikvrt-temdd-mainloop-integrity@users.noreply.github.com
          remote_before="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_before" = "$GITHUB_SHA"
          git commit -m "ada: materialize TEMDD main-loop repair integrity"
          successor="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          remote_after="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR==1 {print $1}')"
          test "$remote_after" = "$successor"
          printf 'SUCCESSOR_HEAD=%s\nSUCCESSOR_TREE=%s\n' "$successor" "$tree"
          printf 'PREDECESSOR_EVIDENCE_TRANSFER=false\n'
          printf 'REPOSITORY_EFFECT_ACK_DONE=false\n'
