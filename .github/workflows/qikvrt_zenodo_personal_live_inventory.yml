name: QIKVRT Zenodo personal corpus live audit
on:
  pull_request:
    paths:
      - "release/qikvrt-mesh-zenodo-personal-corpus-snapshot-2026-09-25/**"
      - "tools/qikvrt_zenodo_personal_live_inventory.py"
      - "tests/test_qikvrt_zenodo_personal_live_inventory.py"
      - ".github/workflows/qikvrt_zenodo_personal_live_inventory.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
jobs:
  live-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Unit-test live inventory core
        run: python3 -B -m unittest -v tests.test_qikvrt_zenodo_personal_live_inventory
      - name: Read-only Zenodo reobservation
        id: audit
        shell: bash
        run: |
          set +e
          python3 -B tools/qikvrt_zenodo_personal_live_inventory.py --snapshot release/qikvrt-mesh-zenodo-personal-corpus-snapshot-2026-09-25/ZENODO_PERSONAL_CORPUS_SNAPSHOT.json --output /tmp/QIKVRT_ZENODO_PERSONAL_LIVE_AUDIT.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload live audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-zenodo-personal-live-audit-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: /tmp/QIKVRT_ZENODO_PERSONAL_LIVE_AUDIT.json
      - name: Enforce fail-closed live result
        run: test "${{ steps.audit.outputs.exit_code }}" = "0"
