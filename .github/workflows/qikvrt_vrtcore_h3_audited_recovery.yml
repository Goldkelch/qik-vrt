name: QIK-VRT audited H3 Zenodo recovery successor

on:
  push:
    branches:
      - trusted/vrtcore-h3-audited-recovery-run30753751400-v1

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: qikvrt-vrtcore-causal-zenodo-publication-v1
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      github.ref == 'refs/heads/trusted/vrtcore-h3-audited-recovery-run30753751400-v1' &&
      github.event_name == 'push' &&
      github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact proxy head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable exact-one recovery executor and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git rev-parse --verify HEAD:tools/qikvrt_vrtcore_h3_audited_recovery.py)" = \
            fa6df7c9874edb78af0c071042709b853b6a2057
          test "$(git rev-parse --verify HEAD:tests/test_vrtcore_h3_audited_recovery.py)" = \
            a85ef0870836cb8e80340779b0895eae00e9376b
          python3 -B -m py_compile tools/qikvrt_vrtcore_h3_audited_recovery.py
          python3 -B -m unittest -v tests.test_vrtcore_h3_audited_recovery

      - name: Reconcile exact existing lock and materialize audited successor
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import sys
          from pathlib import Path

          source_path = Path("tools/qikvrt_vrtcore_h3_audited_recovery.py")
          source = source_path.read_text(encoding="utf-8")
          old = 'EXPECTED_MAIN = "ad947e6e1c3665c8c9fd838d53ccc2ea17641b1b"'
          new = 'EXPECTED_MAIN = "bad1a0558b88b9bc13a6b47fe621ac27d8bfaa62"'
          if source.count(old) != 1 or new in source:
              raise SystemExit("BLOCK: exact current-main parameterization boundary differs")
          patched = source.replace(old, new)
          globals_value = {
              "__name__": "__main__",
              "__file__": str(source_path),
              "__package__": None,
          }
          sys.argv = [str(source_path), "--execute"]
          exec(compile(patched, str(source_path), "exec"), globals_value)
          PY
