name: QIKVRT trusted requested-review root repair bridge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: qikvrt-review-root-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize-root-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind same-repository candidate, exact marker and trusted-main repair program
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test -f state/control-plane/QIKVRT_REVIEW_ROOT_FIX_TRIGGER
          grep -Fx 'QIKVRT_REVIEW_CONTROL_PLANE_ROOT_FIX_V1' state/control-plane/QIKVRT_REVIEW_ROOT_FIX_TRIGGER
          git fetch --no-tags origin main
          git show origin/main:tools/qikvrt_review_root_fix.py > /tmp/qikvrt_review_root_fix.py
          test -s /tmp/qikvrt_review_root_fix.py

      - name: Apply trusted systemic repair and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B /tmp/qikvrt_review_root_fix.py
          python3 -B -m unittest -v \
            tests.test_qikvrt_review_control_plane_root_fix \
            tests.test_qikvrt_requested_review_executor
          git diff --check

      - name: Persist tested permanent repair and remove bootstrap
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f state/control-plane/QIKVRT_REVIEW_ROOT_FIX_TRIGGER
          rm -f .github/workflows/qikvrt_review_control_plane_root_fix.yml
          rm -f tools/qikvrt_review_root_fix.py
          git diff --check
          git config user.name qikvrt-review-root-fix
          git config user.email qikvrt-review-root-fix@users.noreply.github.com
          git add -A
          git commit -m 'fix: isolate review subjects and historical context'
          git push origin "HEAD:${BRANCH}"
# v5
