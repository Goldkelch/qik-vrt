# discovery-edge: 2
name: QIKVRT one-shot requested-review root repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/qikvrt_review_control_plane_root_fix.yml'

permissions:
  contents: write

concurrency:
  group: qikvrt-review-root-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize-root-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/review-control-plane-subject-isolation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact carrier
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Apply systemic contract repair and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path

          core = Path('tools/qikvrt_requested_review_executor.py')
          text = core.read_text(encoding='utf-8')
          old = '''    "detail",\n    "evidence_fingerprint",\n'''
          new = '''    "detail",\n    # The trusted-main tip is observation context, not immutable candidate\n    # identity. Normal main advancement must create a progress successor, not\n    # retroactively corrupt an exact historical receipt.\n    "current_main_sha",\n    "current_main_tree_sha",\n    "evidence_fingerprint",\n'''
          if text.count(old) != 1:
              raise SystemExit('CORE_PROGRESS_PROJECTION_ANCHOR_NOT_EXACT')
          core.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/qikvrt_requested_review_executor.yml')
          text = workflow.read_text(encoding='utf-8')

          old = '''      - name: Select exactly one durable recursive review work unit\n        if: steps.active.outputs.active == 'true' && steps.ledger.outputs.persisted == 'true'\n        id: queue\n        shell: bash\n'''
          new = '''      - name: Select exactly one durable recursive review work unit\n        if: steps.active.outputs.active == 'true' && steps.ledger.outputs.persisted == 'true'\n        id: queue\n        env:\n          SUBJECT_PR_NUMBER: ${{ steps.select.outputs.pr }}\n          SUBJECT_HEAD_SHA: ${{ steps.decision.outputs.head }}\n        shell: bash\n'''
          if text.count(old) != 1:
              raise SystemExit('QUEUE_STEP_ANCHOR_NOT_EXACT')
          text = text.replace(old, new, 1)

          old = '''              intent=parsed(queue_path)\n              if not isinstance(intent,dict):\n                  raise SystemExit(f'RECURSIVE_QUEUE_INTENT_INVALID_{queue_path}')\n              receipt_path=intent.get('receipt_path')\n'''
          new = '''              intent=parsed(queue_path)\n              if not isinstance(intent,dict):\n                  raise SystemExit(f'RECURSIVE_QUEUE_INTENT_INVALID_{queue_path}')\n              # A subject-bound executor may never consume another PR/head's\n              # recursive work unit. Global queue order is not causal routing.\n              if (\n                  intent.get('repository') != repo\n                  or str(intent.get('pr_number')) != os.environ['SUBJECT_PR_NUMBER']\n                  or intent.get('head_sha') != os.environ['SUBJECT_HEAD_SHA']\n              ):\n                  continue\n              receipt_path=intent.get('receipt_path')\n'''
          if text.count(old) != 1:
              raise SystemExit('QUEUE_FILTER_ANCHOR_NOT_EXACT')
          text = text.replace(old, new, 1)

          old = '''              'tree_sha':commit.get('tree',{}).get('sha') == os.environ['EXPECTED_TREE'],\n              'base_sha':pr.get('base',{}).get('sha') == os.environ['EXPECTED_BASE'],\n              'workflow_event':run.get('event') == 'workflow_dispatch',\n'''
          new = '''              'tree_sha':commit.get('tree',{}).get('sha') == os.environ['EXPECTED_TREE'],\n              # GitHub's PR base.sha is the moving base-branch tip. It is live\n              # review context, not the transport identity of this work unit.\n              # Fresh base drift is classified by the child review itself.\n              'base_ref':pr.get('base',{}).get('ref') == 'main',\n              'workflow_event':run.get('event') == 'workflow_dispatch',\n'''
          if text.count(old) != 1:
              raise SystemExit('TRANSPORT_BASE_ANCHOR_NOT_EXACT')
          text = text.replace(old, new, 1)
          workflow.write_text(text, encoding='utf-8')

          test = Path('tests/test_qikvrt_review_control_plane_root_fix.py')
          test.write_text(r'''# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
import copy
import importlib.util
import pathlib
import sys
import unittest

ROOT = pathlib.Path(__file__).resolve().parents[1]
SPEC = importlib.util.spec_from_file_location(
    "qikvrt_requested_review_executor_root_fix",
    ROOT / "tools/qikvrt_requested_review_executor.py",
)
assert SPEC and SPEC.loader
MODULE = importlib.util.module_from_spec(SPEC)
sys.modules[SPEC.name] = MODULE
SPEC.loader.exec_module(MODULE)


class RequestedReviewControlPlaneRootFixTests(unittest.TestCase):
    def test_main_tip_is_progress_not_historical_identity(self):
        receipt = {
            "repository": "example/qik-vrt",
            "pr_number": 1016,
            "base_ref": "main",
            "base_sha": "a" * 40,
            "base_tree_sha": "b" * 40,
            "head_sha": "c" * 40,
            "tree_sha": "d" * 40,
            "scope_sha256": "e" * 64,
            "diff_sha256": "f" * 64,
            "current_main_sha": "1" * 40,
            "current_main_tree_sha": "2" * 40,
            "state": "APPROVE",
            "mesh_disposition": "APPROVE",
            "first_blocker": None,
            "detail": "old context",
            "evidence_fingerprint": "3" * 64,
            "receipt_payload_sha256": "4" * 64,
        }
        successor = copy.deepcopy(receipt)
        successor.update(
            current_main_sha="5" * 40,
            current_main_tree_sha="6" * 40,
            state="COMMENT_WITH_BLOCKER",
            mesh_disposition="COMMENT_WITH_BLOCKER",
            first_blocker="BASE_DRIFT",
            detail="main advanced",
            evidence_fingerprint="7" * 64,
            receipt_payload_sha256="8" * 64,
        )
        self.assertEqual(
            MODULE._historical_receipt_binding(receipt),
            MODULE._historical_receipt_binding(successor),
        )

    def test_workflow_scopes_recursive_queue_to_current_subject(self):
        text = (ROOT / '.github/workflows/qikvrt_requested_review_executor.yml').read_text()
        self.assertIn('SUBJECT_PR_NUMBER: ${{ steps.select.outputs.pr }}', text)
        self.assertIn('SUBJECT_HEAD_SHA: ${{ steps.decision.outputs.head }}', text)
        self.assertIn("str(intent.get('pr_number')) != os.environ['SUBJECT_PR_NUMBER']", text)
        self.assertIn("intent.get('head_sha') != os.environ['SUBJECT_HEAD_SHA']", text)

    def test_transport_does_not_bind_moving_base_tip(self):
        text = (ROOT / '.github/workflows/qikvrt_requested_review_executor.yml').read_text()
        self.assertNotIn("'base_sha':pr.get('base',{}).get('sha') == os.environ['EXPECTED_BASE']", text)
        self.assertIn("'base_ref':pr.get('base',{}).get('ref') == 'main'", text)
        self.assertIn("'full_causal_binding'", text)


if __name__ == '__main__':
    unittest.main()
''', encoding='utf-8')
          PY

          python3 -B -m unittest -v \
            tests.test_qikvrt_review_control_plane_root_fix \
            tests.test_qikvrt_requested_review_executor
          git diff --check

      - name: Persist only the tested repair and delete this one-shot carrier
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/qikvrt_review_control_plane_root_fix.yml
          git diff --check
          git config user.name qikvrt-review-root-fix
          git config user.email qikvrt-review-root-fix@users.noreply.github.com
          git add tools/qikvrt_requested_review_executor.py \
            .github/workflows/qikvrt_requested_review_executor.yml \
            tests/test_qikvrt_review_control_plane_root_fix.py \
            .github/workflows/qikvrt_review_control_plane_root_fix.yml
          git commit -m 'fix: isolate review subjects and historical context'
          git push origin "HEAD:${BRANCH}"
