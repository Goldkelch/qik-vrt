name: QIKVRT code-owner review observer (retired)

# Retired deliberately: pull_request_review evaluates candidate-associated
# workflow bytes and is not a trusted ingress for any privileged continuation.
# Trusted-main scheduled review wake-up recovery re-fetches live review facts.
on: {}

permissions: {}

jobs:
  retired:
    if: false
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - shell: bash
        run: |
          echo 'RETIRED_NO_UNTRUSTED_REVIEW_TRIGGER'
