name: QIKVRT recursive acceleration integrity successor

on:
  push:
    branches:
      - architecture/recursive-execution-acceleration-v1
    paths:
      - .github/workflows/qikvrt_recursive_acceleration_integrity_successor.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-recursive-acceleration-integrity-successor
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PREDECESSOR: a2bc5ddc9092809092cb8811cde33b4e34adb92b
      EXPECTED_MAIN: 0cb6abae0b354d5eae4d07888b36779fb611df7e
      TARGET_REF: architecture/recursive-execution-acceleration-v1
      CARRIER_PATH: .github/workflows/qikvrt_recursive_acceleration_integrity_successor.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact carrier predecessor and main
        shell: bash
        run: |
          set -euo pipefail
          carrier="$(git rev-parse --verify HEAD^{commit})"
          parent="$(git rev-parse --verify HEAD^1)"
          test "$carrier" = "$GITHUB_SHA"
          test "$parent" = "$EXPECTED_PREDECESSOR"
          git fetch --no-tags origin main
          live_main="$(git rev-parse --verify origin/main^{commit})"
          test "$live_main" = "$EXPECTED_MAIN"
          printf 'CARRIER_HEAD=%s\nPREDECESSOR_HEAD=%s\nMAIN_HEAD=%s\n'             "$carrier" "$parent" "$live_main"

      - name: Integrate main and regenerate deterministic integrity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name qikvrt-recursive-acceleration-materializer
          git config user.email qikvrt-recursive-acceleration-materializer@users.noreply.github.com

          set +e
          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ] && [ "$merge_status" -ne 1 ]; then
            exit "$merge_status"
          fi

          git diff --name-only --diff-filter=U | sort -u > /tmp/conflicts
          if test -s /tmp/conflicts; then
            while IFS= read -r path; do
              case "$path" in
                REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt)
                  git checkout --ours -- "$path"
                  git add -- "$path"
                  ;;
                *)
                  echo "BLOCK: unexpected semantic merge conflict: $path" >&2
                  exit 2
                  ;;
              esac
            done < /tmp/conflicts
          fi
          test -z "$(git diff --name-only --diff-filter=U)"

          git rm -- "$CARRIER_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git diff --cached --check

      - name: Execute focused and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1             python3 -B -m unittest -v tests.test_recursive_execution_acceleration
          make test

      - name: Commit push and read back successor
        shell: bash
        run: |
          set -euo pipefail
          remote_before="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_before" = "$GITHUB_SHA"
          remote_main="$(
            git ls-remote --heads origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_main" = "$EXPECTED_MAIN"

          git commit -m "architecture: materialize recursive acceleration integrity successor"
          successor="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          git push origin "HEAD:refs/heads/$TARGET_REF"

          remote_after="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_after" = "$successor"
          printf 'SUCCESSOR_HEAD=%s\nSUCCESSOR_TREE=%s\n' "$successor" "$tree"
          printf 'PREDECESSOR_EVIDENCE_TRANSFER=false\n'
          printf 'REPOSITORY_EFFECT_ACK_DONE=false\n'
