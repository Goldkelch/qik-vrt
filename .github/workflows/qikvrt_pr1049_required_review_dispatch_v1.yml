name: QIKVRT PR 1049 exact required-review dispatch

on:
  push:
    branches: [control/pr1049-required-review-dispatch-v1]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: qikvrt-pr1049-required-review-dispatch-v1
  cancel-in-progress: false

jobs:
  dispatch-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      EXPECTED_PR: "1049"
      EXPECTED_HEAD: "22635693ca36885f8d5a14ef8a330020056df652"
      EXPECTED_BASE: "b4b0038bcaa8788098ffa529bd5d5b651dd0459c"
    steps:
      - name: Verify exact unchanged review subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > /tmp/pr.json
          python3 -B - /tmp/pr.json "$EXPECTED_HEAD" "$EXPECTED_BASE" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          expected_head=sys.argv[2]
          expected_base=sys.argv[3]
          assert value['state']=='open', value['state']
          assert value['draft'] is False
          assert value['head']['sha']==expected_head, (value['head']['sha'],expected_head)
          assert value['base']['sha']==expected_base, (value['base']['sha'],expected_base)
          requested={x['login'] for x in value.get('requested_reviewers',[])}
          assert 'Goldkelch' in requested, requested
          print('QIKVRT_PR1049_EXACT_SUBJECT=VERIFIED')
          print('QIKVRT_PR1049_HEAD='+value['head']['sha'])
          print('QIKVRT_PR1049_BASE='+value['base']['sha'])
          PY

      - name: Dispatch required code-owner review on exact subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(python3 -B - <<'PY'
          import json
          print(json.dumps({
            'ref':'main',
            'inputs':{
              'pr_number':'1049',
              'expected_head_sha':'22635693ca36885f8d5a14ef8a330020056df652'
            }
          },separators=(',',':')))
          PY
          )"
          code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_required_review_gate.yml/dispatches" \
            -d "$payload")"
          printf 'QIKVRT_REQUIRED_REVIEW_DISPATCH_HTTP=%s\n' "$code"
          cat /tmp/dispatch-response.txt || true
          test "$code" = 204
          printf '%s\n' 'QIKVRT_REQUIRED_REVIEW_DISPATCH=ACKNOWLEDGED'
