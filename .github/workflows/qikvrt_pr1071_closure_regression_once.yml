# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# Existing finite preparation lane. No schedule, dispatch, model or source-PR write.
name: QIKVRT PR1071 root closure regression preparation
on:
  push:
    branches: [repair/pr1071-effectiveness-regressions-v1]
    paths: [.github/workflows/qikvrt_pr1071_closure_regression_once.yml]
permissions:
  contents: write
concurrency:
  group: qikvrt-pr1071-effectiveness-preparation-v1
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_PARENT: 0769ce6299f42f4cdec06a6deb694b55a329dfb5
      TARGET_TREE: 91e30d4e34b0162ae0e4c8cd7a81f67fd04f6cc8
      TARGET_BRANCH: agent/autonomy-root-cause-self-clean-v3
      TRANSPORT_BRANCH: repair/pr1071-effectiveness-regressions-v1
      EXPECTED_MAIN: a86054139b49c13c5cd344753b248b46b5daf66f
      EXPECTED_PUBLICATION: f30d4bcc8c54d915981abad03ed5f5985779191b
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: .
    steps:
      - name: Checkout exact finite preparation subject with bounded persistence credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind exact source and unchanged publication boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compiler-port"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read_ref() {
            git ls-remote --exit-code --heads origin "refs/heads/$1" | awk 'NF == 2 {print $1}'
          }
          test "$(read_ref "$TARGET_BRANCH")" = "$TARGET_PARENT"
          test "$(read_ref main)" = "$EXPECTED_MAIN"
          test "$(read_ref publication/future-message-present-receiver-v1)" = "$EXPECTED_PUBLICATION"
          git checkout --detach "$TARGET_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD:scripts/issue_agent/infer.py)" = 54ef024896a5fe77580298daa31f38f21ce43927
          test "$(git rev-parse HEAD:tests/issue_agent/test_validate.py)" = 2ac7ce4efce5c5f1591aae5fd12522b50f9c170c
          test "$(git rev-parse HEAD:tests/issue_agent/test_deterministic_workflow.py)" = 010069c0ab59ecca2fd0afefe6fb29778cc190d8
      - name: Reproduce and remove only the residual model-client dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import json, os, subprocess, sys
          out = Path(os.environ['RUNNER_TEMP']) / 'compiler-port'
          out.mkdir(parents=True, exist_ok=True)
          path = Path('tests/issue_agent/test_deterministic_workflow.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":'
          assert text.count(marker) == 1
          assert 'test_legacy_model_client_is_absent' not in text
          extra = '\n    def test_legacy_model_client_is_absent(self):\n        self.assertFalse((ROOT / "scripts/issue_agent/infer.py").exists())\n\n    def test_validation_is_independent_of_model_prompt(self):\n        text = (ROOT / "tests/issue_agent/test_validate.py").read_text(encoding="utf-8")\n        self.assertNotIn("scripts.issue_agent.infer", text)\n        self.assertNotIn("SYSTEM_PROMPT", text)\n'
          path.write_text(text.replace(marker, '\n' + extra + marker), encoding='utf-8')
          cmd = [sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests/issue_agent', '-p', 'test_deterministic_workflow.py', '-v']
          red = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
          (out / 'red-residual-model-dependency.log').write_bytes(red.stdout)
          assert red.returncode == 1 and b'FAILED (failures=2)' in red.stdout, red.stdout.decode(errors='replace')
          path = Path('tests/issue_agent/test_validate.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from scripts.issue_agent.infer import SYSTEM_PROMPT\n'
          assert text.count(old_import) == 1
          text = text.replace(old_import, '')
          old_name = '    def test_issue_agent_prompt_requires_one_lifecycle_disposition(self):\n'
          assert text.count(old_name) == 1
          new_start = ('    def test_issue_policy_requires_one_lifecycle_disposition(self):\n'
                       '        policy = json.loads((ROOT / "policy/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json").read_text(encoding="utf-8"))\n'
                       '        allowed = policy["issue_lifecycle"]["allowed_dispositions"]\n')
          text = text.replace(old_name, new_start)
          assert text.count('self.assertIn(token, SYSTEM_PROMPT)') == 1
          text = text.replace('self.assertIn(token, SYSTEM_PROMPT)', 'self.assertIn(token, allowed)')
          old_line = 'self.assertIn("Do not leave an issue in an unclassified waiting state", SYSTEM_PROMPT)'
          assert text.count(old_line) == 1
          text = text.replace(old_line, 'self.assertEqual(policy["issue_lifecycle"]["unclassified_open_issue"], "FORBIDDEN")')
          assert 'SYSTEM_PROMPT' not in text
          path.write_text(text, encoding='utf-8')
          subprocess.run(['git', 'rm', '--', 'scripts/issue_agent/infer.py'], check=True)
          subprocess.run(['git', 'add', '--', 'tests/issue_agent/test_validate.py', 'tests/issue_agent/test_deterministic_workflow.py'], check=True)
          PYCODE
      - name: Run scoped regressions and complete deterministic gates
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/compiler-port"
          python3 -B -m unittest discover -s tests/issue_agent -v 2>&1 | tee "$out/issue-agent-tests.log"
          python3 -B tools/qikvrt_integrity.py generate 2>&1 | tee "$out/integrity-generate.log"
          python3 -B tools/qikvrt_integrity.py verify 2>&1 | tee "$out/integrity-verify-before.log"
          sha256sum REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt > "$out/integrity-before.sha256"
          python3 -B tools/qikvrt_integrity.py generate > "$out/integrity-repeat.log"
          sha256sum -c "$out/integrity-before.sha256"
          make test > "$out/full-make-test.log" 2>&1
          python3 -B tools/qikvrt_integrity.py verify 2>&1 | tee "$out/integrity-verify-after.log"
          sha256sum -c "$out/integrity-before.sha256"
          git add -- REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git diff --cached --check
      - name: Seal six-path prepared tree without changing the source PR
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, os, subprocess
          out = Path(os.environ['RUNNER_TEMP']) / 'compiler-port'
          expected = {
           'scripts/issue_agent/infer.py': 'D',
           'tests/issue_agent/test_validate.py': 'M',
           'tests/issue_agent/test_deterministic_workflow.py': 'M',
           'REPOSITORY_FILE_MANIFEST.json': 'M',
           'REPOSITORY_FILE_MANIFEST.json.sha256': 'M',
           'SHA256SUMS.txt': 'M',
          }
          raw = subprocess.check_output(['git', 'diff', '--cached', '--name-status', '--no-renames']).decode()
          actual = {row.split('\t',1)[1]: row.split('\t',1)[0] for row in raw.splitlines()}
          assert actual == expected, (actual,expected)
          assert not subprocess.check_output(['git','diff','--name-only'])
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'])
          rows = []
          for path,status in sorted(expected.items()):
           row = {'path':path,'status':status}
           if status != 'D':
            data = Path(path).read_bytes()
            row.update(size=len(data),sha256=hashlib.sha256(data).hexdigest(),git_blob=subprocess.check_output(['git','rev-parse',':'+path]).decode().strip(),git_mode=subprocess.check_output(['git','ls-files','-s','--',path]).decode().split()[0])
            target=out/'files'/path
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(data)
           rows.append(row)
          tree = subprocess.check_output(['git','write-tree']).decode().strip()
          value = {
           'schema':'qikvrt_pr1071_compiler_port_preparation_v1',
           'repository':'Goldkelch/qik-vrt',
           'owner_instruction':'Optimize until EFFECT_ACK_DONE',
           'source_head':os.environ['TARGET_PARENT'],
           'source_tree':os.environ['TARGET_TREE'],
           'trusted_main':os.environ['EXPECTED_MAIN'],
           'transport_head':os.environ['GITHUB_SHA'],
           'prepared_tree':tree,'files':rows,
           'preparation_tests':'red counterexamples; issue-agent suite; full make test; integrity idempotence',
           'source_pr_head_mutated':False,'predecessor_evidence_transfer':False,
           'evidence_scope':'PREPARATION_WORKTREE_ONLY_NOT_FINAL_HEAD_P2',
           'completion_claims':{'native_review':False,'promotion':False,'publication':False,'EFFECT_ACK_DONE':False},
          }
          (out/'preparation.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          (out/'prepared.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary','--full-index']))
          (out/'prepared-tree.txt').write_text(tree+'\n')
          print(json.dumps(value,sort_keys=True))
          PYCODE
      - name: Persist prepared objects on the existing finite transport only
        shell: bash
        run: |
          set -euo pipefail
          read_ref() {
            git ls-remote --exit-code --heads origin "refs/heads/$1" | awk 'NF == 2 {print $1}'
          }
          test "$(read_ref "$TARGET_BRANCH")" = "$TARGET_PARENT"
          test "$(read_ref main)" = "$EXPECTED_MAIN"
          test "$(read_ref publication/future-message-present-receiver-v1)" = "$EXPECTED_PUBLICATION"
          test "$(read_ref "$TRANSPORT_BRANCH")" = "$GITHUB_SHA"
          # Transport only the five prepared blobs and one deletion over this lane's
          # existing tree. Do not add/change/remove a workflow using GITHUB_TOKEN.
          python3 -B - <<'OBJECTS'
          from pathlib import Path
          import json, os, subprocess
          out = Path(os.environ['RUNNER_TEMP']) / 'compiler-port'
          value = json.loads((out / 'preparation.json').read_text())
          env = dict(os.environ, GIT_INDEX_FILE=str(out / 'transport.index'))
          def git(*args):
              return subprocess.check_output(['git', *args], env=env).decode().strip()
          git('read-tree', os.environ['GITHUB_SHA'])
          for row in value['files']:
              if row['status'] == 'D':
                  git('update-index', '--force-remove', '--', row['path'])
              else:
                  git('update-index', '--add', '--cacheinfo', row['git_mode'], row['git_blob'], row['path'])
          transport_tree = git('write-tree')
          assert not git('diff-tree', '--name-only', '-r', os.environ['GITHUB_SHA'], transport_tree, '--', '.github/workflows')
          (out / 'transport-tree.txt').write_text(transport_tree + chr(10))
          (out / 'transport.index').unlink()
          OBJECTS
          CARRIER_TREE="$(cat "$RUNNER_TEMP/compiler-port/transport-tree.txt")"
          export CARRIER_TREE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CARRIER_COMMIT="$(git commit-tree "$CARRIER_TREE" -p "$GITHUB_SHA" -m 'prepare(pr1071): seal tested residual compiler-port tree; no candidate P2 or promotion')"
          export CARRIER_COMMIT
          git push origin "$CARRIER_COMMIT:refs/heads/$TRANSPORT_BRANCH"
          test "$(read_ref "$TRANSPORT_BRANCH")" = "$CARRIER_COMMIT"
          test "$(read_ref "$TARGET_BRANCH")" = "$TARGET_PARENT"
          test "$(read_ref main)" = "$EXPECTED_MAIN"
          test "$(read_ref publication/future-message-present-receiver-v1)" = "$EXPECTED_PUBLICATION"
          python3 -B - <<'PYCODE'
          from pathlib import Path
          import json, os
          out=Path(os.environ['RUNNER_TEMP'])/'compiler-port'
          value=json.loads((out/'preparation.json').read_text())
          value['transport_persistence']={'commit':os.environ['CARRIER_COMMIT'],'tree':os.environ['CARRIER_TREE'],'ref':os.environ['TRANSPORT_BRANCH'],'exact_ref_readback':True,'candidate_and_main_mutated':False,'scope':'six-path object transport only; workflows unchanged; not a validated source tree'}
          (out/'persistence.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          print(json.dumps(value,sort_keys=True))
          PYCODE
      - name: Preserve exact preparation and failure evidence without secret values
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1071-residual-compiler-port-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiler-port
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
