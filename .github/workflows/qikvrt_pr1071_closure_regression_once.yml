# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# Finite development transport, excluded from the resulting PR tree/history.
name: QIKVRT PR1071 root closure regression preparation
on:
  push:
    branches: [repair/pr1071-effectiveness-regressions-v1]
    paths: [.github/workflows/qikvrt_pr1071_closure_regression_once.yml]
permissions:
  contents: write
concurrency:
  group: qikvrt-pr1071-effectiveness-preparation-v1
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_PARENT: 9360d39b8688fb6ffd8b083893f68473fc705a2d
      TARGET_TREE: 0bd058f68464c499d34dfd3416a55473a8011303
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: .
    steps:
      - name: Checkout exact finite preparation subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bind post-probe platform readback and negative regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair-closure"
          git merge-base --is-ancestor "$TARGET_PARENT" HEAD
          python3 -B - <<'PY'
          from pathlib import Path
          tool=Path('tools/qikvrt_repair_effectiveness_guard.py');s=tool.read_text()
          assert 'RULESET_DRIFT_DURING_PROBES' not in s
          old="require(rules.get('pre_state_sha256') == rules['desired_state_sha256'], 'RULESET_HASH_MISMATCH')"
          assert old in s
          s=s.replace(old,old+"\n        require(snapshot.get('ruleset_after') == rules, 'RULESET_DRIFT_DURING_PROBES')\n        require(snapshot.get('adoption_after') == adoption, 'ADOPTION_DRIFT_DURING_PROBES')\n        require(snapshot.get('adoption_review_after') == review, 'REVIEW_DRIFT_DURING_PROBES')")
          s=s.replace("require(probe.get('status') == 'EXECUTED'", "require(probe.get('summary_success') is True, 'PROBE_SUMMARY_NOT_CLEAN:' + module)\n            require(probe.get('status') == 'EXECUTED'")
          s=s.replace("'tests_skipped': sum(int(n) for n in skips)", "'tests_skipped': sum(int(n) for n in skips), 'summary_success': bool(re.search(rb'(?m)^OK\\s*$', raw))")
          s=s.replace("'tests_skipped': None", "'tests_skipped': None, 'summary_success': False")
          old="s['main_after'] = api('repos/' + REPO + '/git/ref/heads/main', token)['object']['sha']"
          assert old in s
          lines=[
            "        rules_after = api(f'repos/{REPO}/rulesets/19344903', token)",
            "        s['ruleset_after'] = evaluate(rules_after, load_policy(root / 'policy/GITHUB_MAIN_RULESET_V1.json'))",
            '        pull_after = api(f"repos/{REPO}/pulls/{value[\'integration_pr\']}", token)',
            "        require(pull_after['base']['repo']['full_name'] == REPO and pull_after['base']['ref'] == 'main', 'ADOPTION_BASE_AFTER')",
            "        require(pull_after['head']['repo']['full_name'] == REPO, 'ADOPTION_REPOSITORY_AFTER')",
            "        aa = {'pr':pull_after['number'], 'merged':pull_after['merged'], 'head':pull_after['head']['sha'], 'merge_commit':pull_after.get('merge_commit_sha')}",
            "        aa['head_is_ancestor'], aa['merge_is_ancestor'] = ancestor(aa['head']), ancestor(aa['merge_commit'])",
            "        s['adoption_after'] = aa",
            '        reviews_after = api(f"repos/{REPO}/pulls/{value[\'integration_pr\']}/reviews?per_page=100", token)',
            "        require(isinstance(reviews_after, list) and len(reviews_after) < 100, 'REVIEW_INVENTORY_INCOMPLETE_AFTER')",
            "        da = [r for r in reviews_after if r.get('user', {}).get('login') == 'Goldkelch' and r.get('commit_id') == aa['head'] and r.get('state') in {'APPROVED','CHANGES_REQUESTED','DISMISSED'}]",
            "        require(len(da) <= 1, 'AMBIGUOUS_NATIVE_REVIEW_INVENTORY_AFTER')",
            "        if da:", "            r = da[0]",
            "            s['adoption_review_after'] = {'id':r['id'], 'author':r['user']['login'], 'state':r['state'], 'commit_id':r['commit_id']}",
            '        '+old]
          s=s.replace('        '+old, '\n'.join(lines))
          s=s.replace("'future_immunity': False, 'publication': False, 'independent_human_review': False}", "'future_immunity': False, 'publication': False, 'independent_human_review': False,\n                'P0_P7_completion_claim': False, 'promotion_authorized_by_this_guard': False}")
          tool.write_text(s)
          path=Path('tests/test_qikvrt_repair_effectiveness_guard.py');s=path.read_text()
          s=s.replace("'tests_skipped':0,'log_sha256'", "'tests_skipped':0,'summary_success':True,'log_sha256'")
          s=s.replace('    return p, s', "    s['ruleset_after']=copy.deepcopy(s['ruleset'])\n    s['adoption_after']=copy.deepcopy(s['adoption'])\n    s['adoption_review_after']=copy.deepcopy(s['adoption_review'])\n    return p, s")
          s=s.replace("{'exit_code':False},{'exit_code':1}", "{'summary_success':False},{'summary_success':None},{'summary_success':1},{'exit_code':False},{'exit_code':1}")
          lines=[
            '    def test_post_probe_platform_drift_or_missing_readback_cannot_close(self):',
            '        p,s=fixture()',
            "        for key in ('ruleset_after','adoption_after','adoption_review_after'):",
            "            for bad in ({},None,'success'):",
            '                c=copy.deepcopy(s); c[key]=bad',
            "                with self.subTest(key=key,bad=bad): self.assertIs(classify(c,p)['closed'],False)",
            "        for key,field,new in (('ruleset_after','state','DRIFT'), ('adoption_after','merged',False), ('adoption_review_after','state','DISMISSED')):",
            '            c=copy.deepcopy(s);c[key][field]=new',
            "            self.assertIs(classify(c,p)['closed'],False)", '',
            '    def test_clean_summary_excludes_expected_failures_and_skips(self):',
            '        import re',
            "        for summary in (b'OK (skipped=1)\\n', b'OK (expected failures=1)\\n', b'FAILED (failures=1)\\n', b''):",
            "            self.assertFalse(bool(re.search(rb'(?m)^OK\\s*$',summary)))",
            "        self.assertTrue(bool(re.search(rb'(?m)^OK\\s*$',b'Ran 1 test in 0.01s\\n\\nOK\\n')))", '']
          s=s.replace("if __name__=='__main__': unittest.main()", '\n'.join(lines)+"\nif __name__=='__main__': unittest.main()")
          path.write_text(s)
          PY
          git rm -- .github/workflows/qikvrt_pr1071_closure_regression_once.yml
      - name: Reobserve configuration presence only, never secret values or authority effects
        env:
          RULESET_APP_ID_PRESENT: ${{ vars.QIKVRT_RULESET_APP_ID != '' }}
          RULESET_APP_KEY_PRESENT: ${{ secrets.QIKVRT_RULESET_APP_PRIVATE_KEY != '' }}
          GOLDKELCH_REVIEW_TOKEN_PRESENT: ${{ secrets.QIKVRT_GOLDKELCH_REVIEW_TOKEN != '' }}
          REVIEW_ACTIVATED: ${{ secrets.QIKVRT_NATIVE_ACCOUNT_REVIEW_ACTIVATION == 'enabled' }}
        run: |
          python3 -B - <<'PY'
          import json,os,pathlib
          keys=['RULESET_APP_ID_PRESENT','RULESET_APP_KEY_PRESENT','GOLDKELCH_REVIEW_TOKEN_PRESENT','REVIEW_ACTIVATED']
          result={'schema':'qikvrt_configuration_presence_readback_v1','repository':'Goldkelch/qik-vrt','run_id':os.environ['GITHUB_RUN_ID'],'observed':{key:os.environ[key]=='true' for key in keys},'scope':'CONFIGURATION_PRESENCE_ONLY_NOT_CREDENTIAL_IDENTITY_OR_CAPABILITY','secret_values_exported':False,'mutation':False}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair-closure'/'CONFIGURATION_PRESENCE.json'
          out.write_text(json.dumps(result,indent=2)+'\n');print(out.read_text())
          PY
      - name: Parse workflow structure and execute every required development test
        shell: bash
        run: |
          set -euo pipefail
          ruby -r yaml -r json -e 'd=YAML.safe_load(File.read(ARGV[0]),aliases:true);j=d.fetch("jobs").fetch("repair-effectiveness");abort "invalid job" unless j.fetch("needs")=="verify" && j.fetch("steps").length==3;abort "invalid checkout" unless j.fetch("steps")[0].fetch("with").fetch("fetch-depth")==0;puts JSON.generate({yaml_parsed:true,steps:3})' .github/workflows/qikvrt_zero_bug_continuous.yml > "$RUNNER_TEMP/repair-closure/yaml-structure.json"
          python3 -B -m unittest -v tests.test_qikvrt_repair_effectiveness_guard 2>&1 | tee "$RUNNER_TEMP/repair-closure/guard-tests.log"
          python3 -B tools/qikvrt_repair_effectiveness_guard.py --source-check | tee "$RUNNER_TEMP/repair-closure/source-contract.json"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test > "$RUNNER_TEMP/repair-closure/make-test.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/repair-closure/make-test.log"; exit 1; }
          python3 -B tools/qikvrt_integrity.py verify
      - name: Export allowlisted source, tree and receipt before remote persistence
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair-closure'
          allowed=['.github/workflows/qikvrt_zero_bug_continuous.yml','Makefile','docs/operations/GITHUB_RULESET_ADMIN_APP.md','policy/REPAIR_EFFECTIVENESS_CLOSURE_V1.json','tools/qikvrt_repair_effectiveness_guard.py','tests/test_qikvrt_repair_effectiveness_guard.py','REPOSITORY_FILE_MANIFEST.json','REPOSITORY_FILE_MANIFEST.json.sha256','SHA256SUMS.txt']
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['TARGET_PARENT']]).decode().splitlines())
          assert changed==set(allowed),repr(changed)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'])
          subprocess.run(['git','add','--all'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip();files=[]
          for rel in allowed:
              raw=pathlib.Path(rel).read_bytes();target=out/'files'/rel;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
              files.append({'path':rel,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'git_blob':subprocess.check_output(['git','hash-object','--',rel],text=True).strip()})
          r={'schema':'qikvrt_root_repair_preparation_v3','target_pr':1071,'target_parent':os.environ['TARGET_PARENT'],'base_tree':os.environ['TARGET_TREE'],'development_head':os.environ['GITHUB_SHA'],'prepared_tree':tree,'run_id':os.environ['GITHUB_RUN_ID'],'files':files,'make_test':True,'candidate_ref_updated':False,'main_updated':False,'ruleset_updated':False,'closed':False,'scope':'DEVELOPMENT_WORKTREE_ONLY_FRESH_FINAL_HEAD_P2_REQUIRED'}
          raw=(json.dumps(r,indent=2)+'\n').encode();(out/'PREPARATION.json').write_bytes(raw);(out/'PREPARATION.json.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  PREPARATION.json\n');print(json.dumps(r,indent=2))
          PY
      - name: Persist exact immutable blobs, leaving tree and ref writes to the authorized connector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair-closure';r=json.loads((out/'PREPARATION.json').read_text())
          receipt={'schema':'qikvrt_git_object_persistence_v1','ref_mutation':False,'tree_mutation':False,'state':'HOLD_UNVERIFIED','objects':[]}
          try:
              for f in r['files']:
                  raw=(out/'files'/f['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==f['sha256']
                  p=subprocess.run(['gh','api','--method','POST','repos/Goldkelch/qik-vrt/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}),text=True,capture_output=True,timeout=45)
                  if p.returncode:raise RuntimeError('BLOB_PERSISTENCE_FAILED_exit_'+str(p.returncode))
                  b=json.loads(p.stdout);assert b['sha']==f['git_blob'];receipt['objects'].append({'path':f['path'],'sha':b['sha']})
              receipt['state']='BLOBS_PERSISTED_TREE_ASSEMBLY_PENDING'
          finally:
              raw=(json.dumps(receipt,indent=2)+'\n').encode();(out/'OBJECT_PERSISTENCE.json').write_bytes(raw);(out/'OBJECT_PERSISTENCE.json.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  OBJECT_PERSISTENCE.json\n');print(json.dumps(receipt,indent=2))
          PY
      - name: Preserve complete allowlisted source including dot-directory workflows
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1071-root-closure-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-closure
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
