# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# One-shot development carrier. Removed from the prepared candidate tree.
name: QIKVRT PR1071 root closure regression preparation
on:
  push:
    branches: [repair/pr1071-effectiveness-regressions-v1]
    paths: [.github/workflows/qikvrt_pr1071_closure_regression_once.yml]
permissions:
  contents: write
concurrency:
  group: qikvrt-pr1071-effectiveness-preparation-v1
  cancel-in-progress: false
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_PARENT: 9360d39b8688fb6ffd8b083893f68473fc705a2d
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: .
    steps:
      - name: Checkout exact proposal transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce missing consumer before integration and bind existing workflow only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair-closure"
          git merge-base --is-ancestor "$TARGET_PARENT" HEAD
          set +e
          python3 -B tools/qikvrt_repair_effectiveness_guard.py --source-check > "$RUNNER_TEMP/repair-closure/red-missing-consumer.log" 2>&1
          red=$?
          set -e
          test "$red" -eq 2
          grep -F 'REPAIR_TEST_NOT_IN_FULL_SUITE' "$RUNNER_TEMP/repair-closure/red-missing-consumer.log"
          python3 -B - <<'PY'
          from pathlib import Path
          make = Path('Makefile')
          text = make.read_text()
          assert 'repair-effectiveness-contract:' not in text
          text += '\n.PHONY: repair-effectiveness-contract\ntest: repair-effectiveness-contract\nrepair-effectiveness-contract:\n\tPYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 $(PYTHON) -B -m unittest -v tests.test_qikvrt_repair_effectiveness_guard\n\tPYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 $(PYTHON) -B tools/qikvrt_repair_effectiveness_guard.py --source-check\n'
          make.write_text(text)
          path = Path('.github/workflows/qikvrt_zero_bug_continuous.yml')
          text = path.read_text()
          assert '  repair-effectiveness:' not in text
          block = '''
            repair-effectiveness:
              needs: verify
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              permissions:
                contents: read
                pull-requests: read
              env:
                GH_TOKEN: @@{{ github.token }}
                PYTHONDONTWRITEBYTECODE: '1'
                PYTHONNOUSERSITE: '1'
                PYTHONPATH: .
              steps:
                - name: Checkout exact Main for operational closure, never a PR merge gate
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                  with:
                    ref: @@{{ github.sha }}
                    fetch-depth: 0
                    persist-credentials: false
                - name: Reobserve adopted repair and execute fresh Main regression probes
                  run: >-
                    python3 -B tools/qikvrt_repair_effectiveness_guard.py
                    --observe-main --expected-main '@@{{ github.sha }}'
                    --out "$RUNNER_TEMP/repair-effectiveness"
                - name: Preserve operational HOLD or exact-Main repair closure
                  if: always()
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                  with:
                    name: qikvrt-repair-effectiveness-@@{{ github.sha }}-@@{{ github.run_id }}-@@{{ github.run_attempt }}
                    path: @@{{ runner.temp }}/repair-effectiveness
                    if-no-files-found: error
                    retention-days: 90
          '''
          # Remove the Python heredoc's presentation indent, preserving YAML
          # job indentation. No Actions expression is expanded by this carrier.
          lines = block.splitlines()
          text += '\n' + '\n'.join(line[10:] if line.startswith('          ') else line for line in lines).replace('@@', chr(36)) + '\n'
          path.write_text(text)
          PY
          git rm -- .github/workflows/qikvrt_pr1071_closure_regression_once.yml
      - name: Prove the observed empty-admin bootstrap regression is rejected
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import os, subprocess, sys
          path=Path('.github/workflows/qikvrt_autonomous_ruleset_effect_loop.yml')
          old=path.read_text()
          good='GH_TOKEN: ' + chr(36) + '{{ github.token }}'
          bad='GH_TOKEN: ' + chr(36) + '{{ secrets.QIKVRT_RULESET_ADMIN_TOKEN }}'
          assert good in old
          try:
              path.write_text(old.replace(good,bad))
              p=subprocess.run([sys.executable,'-B','tools/qikvrt_repair_effectiveness_guard.py','--source-check'],capture_output=True)
              (Path(os.environ['RUNNER_TEMP'])/'repair-closure'/'red-bootstrap-regression.log').write_bytes(p.stdout+p.stderr)
              assert p.returncode==2 and b'READ_BOOTSTRAP_DEPENDS_ON_ADMIN' in p.stderr
          finally:
              path.write_text(old)
          PY
      - name: Execute new regression matrix and complete repository suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_qikvrt_repair_effectiveness_guard 2>&1 | tee "$RUNNER_TEMP/repair-closure/guard-tests.log"
          python3 -B tools/qikvrt_repair_effectiveness_guard.py --source-check | tee "$RUNNER_TEMP/repair-closure/source-contract.json"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test > "$RUNNER_TEMP/repair-closure/make-test.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/repair-closure/make-test.log"; exit 1; }
          python3 -B tools/qikvrt_integrity.py verify
      - name: Preserve only tested delta in the development carrier, never Main or PR head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os, subprocess
          allowed={'.github/workflows/qikvrt_zero_bug_continuous.yml','Makefile','docs/operations/GITHUB_RULESET_ADMIN_APP.md','policy/REPAIR_EFFECTIVENESS_CLOSURE_V1.json','tools/qikvrt_repair_effectiveness_guard.py','tests/test_qikvrt_repair_effectiveness_guard.py','REPOSITORY_FILE_MANIFEST.json','REPOSITORY_FILE_MANIFEST.json.sha256','SHA256SUMS.txt'}
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['TARGET_PARENT']]).decode().splitlines())
          assert changed==allowed, repr(changed)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'repair: prepare tested PR1071 operational-closure regressions and canonical integrity'
          branch='repair/pr1071-effectiveness-regressions-v1'
          remote="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote" = "$GITHUB_SHA" || { echo 'HOLD: development carrier moved'; exit 2; }
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer $GH_TOKEN" push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          git diff --binary "$TARGET_PARENT" HEAD > "$RUNNER_TEMP/repair-closure/source.patch"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair-closure'
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          r={'schema':'qikvrt_root_repair_preparation_v1','target_pr':1071,'target_parent':os.environ['TARGET_PARENT'],'prepared_head':git('rev-parse','HEAD'),'prepared_tree':git('rev-parse','HEAD^{tree}'),'run_id':os.environ['GITHUB_RUN_ID'],'changed_paths':git('diff','--name-only',os.environ['TARGET_PARENT'],'HEAD').splitlines(),'negative_regressions_reproduced':True,'make_test':True,'scope':'DEVELOPMENT_WORKTREE_ONLY_NEW_CANDIDATE_REQUIRES_FRESH_P2','candidate_ref_updated':False,'main_updated':False,'ruleset_updated':False,'native_review':False,'closed':False}
          r['files']=[{'path':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted(out.iterdir()) if p.is_file()]
          raw=(json.dumps(r,indent=2)+'\n').encode();(out/'PREPARATION.json').write_bytes(raw)
          (out/'PREPARATION.json.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  PREPARATION.json\n')
          print(json.dumps(r,indent=2))
          PY
      - name: Retain development evidence including deterministic failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1071-root-closure-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-closure
          if-no-files-found: error
          retention-days: 30
