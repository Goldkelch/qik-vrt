name: QIKVRT Mesh Appliance VM and OCI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/qikvrt_mesh_appliance_release_v1.yml
      - appliance/qikvrt-mesh-v1/**
      - browser/firefox/qikvrt-terminal/**
      - include/qikvrt/effect_ack.h
      - src/effect_ack_core.c
      - src/qikvrt_effect_ack.py
      - src/qikvrt_effect_ack_http_terminal.py
      - external/ietf/**
      - policy/QIKVRT_MESH_APPLIANCE_RELEASE_V1.json
      - tests/test_qikvrt_mesh_appliance_release.py
  workflow_dispatch:
    inputs:
      version:
        description: Semantic appliance version without v prefix
        required: true
        default: "1.0.0"
      base_image_ref:
        description: Digest-pinnable Debian base image reference
        required: true
        default: "debian:bookworm-slim"
      publish:
        description: Publish immutable GitHub Release assets and GHCR manifest
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"
  push:
    tags:
      - qikvrt-mesh-appliance-v*

permissions:
  contents: read

concurrency:
  group: qikvrt-mesh-appliance-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/goldkelch/qik-vrt-mesh-appliance
  DEFAULT_BASE_IMAGE: debian:bookworm-slim
  DEBIAN_SNAPSHOT: 20260701T000000Z

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source head and tree
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse --verify HEAD^{commit})"
          test "$actual" = "$expected"
          test -z "$(git status --short --untracked-files=all)"
          printf 'SOURCE_HEAD=%s\nSOURCE_TREE=%s\n' "$actual" "$(git rev-parse HEAD^{tree})" | tee "$RUNNER_TEMP/source-binding.txt"
      - name: Verify appliance contracts and syntax
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_qikvrt_mesh_appliance_release
          bash -n appliance/qikvrt-mesh-v1/build_vm.sh
          sh -n appliance/qikvrt-mesh-v1/entrypoint.sh
      - name: Prove deterministic Firefox XPI generation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xpi-a" "$RUNNER_TEMP/xpi-b"
          for out in "$RUNNER_TEMP/xpi-a/qikvrt-terminal.xpi" "$RUNNER_TEMP/xpi-b/qikvrt-terminal.xpi"; do
            python3 appliance/qikvrt-mesh-v1/build_extension.py \
              --source browser/firefox/qikvrt-terminal \
              --bootstrap appliance/qikvrt-mesh-v1/appliance_bootstrap.js \
              --output "$out"
          done
          cmp "$RUNNER_TEMP/xpi-a/qikvrt-terminal.xpi" "$RUNNER_TEMP/xpi-b/qikvrt-terminal.xpi"

  build:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Derive exact build identity
        id: meta
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_BASE_IMAGE: ${{ inputs.base_image_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          head="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse HEAD^{tree})"
          epoch="$(git show -s --format=%ct HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/qikvrt-mesh-appliance-v* ]]; then
            version="${GITHUB_REF_NAME#qikvrt-mesh-appliance-v}"
            tag="$GITHUB_REF_NAME"
          elif [ -n "${DISPATCH_VERSION:-}" ]; then
            version="$DISPATCH_VERSION"
            tag="qikvrt-mesh-appliance-v$version"
          else
            version="1.0.0-pr${PR_NUMBER:-0}-${head:0:12}"
            tag="qikvrt-mesh-appliance-v$version"
          fi
          base_image="${DISPATCH_BASE_IMAGE:-$DEFAULT_BASE_IMAGE}"
          {
            echo "head=$head"
            echo "tree=$tree"
            echo "epoch=$epoch"
            echo "version=$version"
            echo "tag=$tag"
            echo "base_image=$base_image"
          } >> "$GITHUB_OUTPUT"
      - name: Install deterministic VM tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs parted qemu-utils
      - name: Resolve exact container base digest
        id: base
        env:
          BASE_IMAGE: ${{ steps.meta.outputs.base_image }}
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          resolved="$(docker image inspect --format '{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          test -n "$resolved"
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
      - name: Build Debian-based Firefox Effect-Ack appliance
        env:
          BASE_IMAGE: ${{ steps.base.outputs.resolved }}
          SOURCE_HEAD: ${{ steps.meta.outputs.head }}
          SOURCE_TREE: ${{ steps.meta.outputs.tree }}
          SOURCE_EPOCH: ${{ steps.meta.outputs.epoch }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker build \
            --file appliance/qikvrt-mesh-v1/Containerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg DEBIAN_SNAPSHOT="$DEBIAN_SNAPSHOT" \
            --build-arg SOURCE_COMMIT="$SOURCE_HEAD" \
            --build-arg SOURCE_TREE="$SOURCE_TREE" \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_EPOCH" \
            --tag "qikvrt-mesh-appliance:$VERSION" .
      - name: Execute protocol and real Firefox adapter smoke tests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/receipts
          chmod 0777 artifacts/receipts
          docker run --rm \
            --name qikvrt-mesh-smoke \
            --volume "$PWD/artifacts/receipts:/var/lib/qikvrt/receipts" \
            "qikvrt-mesh-appliance:$VERSION" smoke
          test -s artifacts/receipts/firefox.json
          grep -q '"extension_active": true' artifacts/receipts/firefox.json
          grep -q '"bounded_loopback_terminal_input_acknowledged": true' artifacts/receipts/firefox.json
          grep -q '"external_effect": "NONE"' artifacts/receipts/firefox.json
      - name: Build cross-hypervisor VM assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        run: |
          set -euo pipefail
          sudo --preserve-env=SOURCE_DATE_EPOCH,QIKVRT_VM_DISK_GIB \
            bash appliance/qikvrt-mesh-v1/build_vm.sh \
            "qikvrt-mesh-appliance:$VERSION" "$VERSION" "$PWD/artifacts"
      - name: Preserve offline OCI image and package inventory
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker save "qikvrt-mesh-appliance:$VERSION" | gzip -n -9 > "artifacts/QIKVRT-Mesh-Appliance-v$VERSION-docker-amd64.tar.gz"
          docker run --rm --entrypoint dpkg-query "qikvrt-mesh-appliance:$VERSION" -W -f='${Package}\t${Version}\t${Architecture}\n' \
            | LC_ALL=C sort > "artifacts/QIKVRT-Mesh-Appliance-v$VERSION-packages.tsv"
          docker image inspect "qikvrt-mesh-appliance:$VERSION" > "artifacts/QIKVRT-Mesh-Appliance-v$VERSION-container-inspect.json"
      - name: Generate content-addressed release manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_HEAD: ${{ steps.meta.outputs.head }}
          SOURCE_TREE: ${{ steps.meta.outputs.tree }}
          AUTHORITY_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          BASE_IMAGE: ${{ steps.base.outputs.resolved }}
        run: |
          set -euo pipefail
          python3 appliance/qikvrt-mesh-v1/generate_release_manifest.py \
            --assets artifacts \
            --tag "$TAG" \
            --version "$VERSION" \
            --source-head "$SOURCE_HEAD" \
            --source-tree "$SOURCE_TREE" \
            --authority-base "$AUTHORITY_BASE" \
            --base-image "$BASE_IMAGE" \
            --output "artifacts/QIKVRT-Mesh-Appliance-v$VERSION-release.json"
          sha256sum artifacts/* | LC_ALL=C sort > "artifacts/QIKVRT-Mesh-Appliance-v$VERSION-ALL-SHA256SUMS.txt"
      - name: Upload candidate appliance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-mesh-appliance-${{ steps.meta.outputs.version }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/qikvrt-mesh-appliance-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out exact authorized release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Derive immutable publication identity
        id: meta
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/qikvrt-mesh-appliance-v* ]]; then
            version="${GITHUB_REF_NAME#qikvrt-mesh-appliance-v}"
            tag="$GITHUB_REF_NAME"
          else
            version="$DISPATCH_VERSION"
            tag="qikvrt-mesh-appliance-v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Download exact assets from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$GITHUB_RUN_ID" --name "qikvrt-mesh-appliance-$VERSION" --dir artifacts
      - name: Resolve base and publish multi-architecture GHCR image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_HEAD: ${{ steps.meta.outputs.head }}
          SOURCE_TREE: ${{ steps.meta.outputs.tree }}
          SOURCE_EPOCH: ${{ steps.meta.outputs.epoch }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binfmt-support qemu-user-static
          docker pull "$DEFAULT_BASE_IMAGE"
          base="$(docker image inspect --format '{{index .RepoDigests 0}}' "$DEFAULT_BASE_IMAGE")"
          docker buildx create --name qikvrt-release --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file appliance/qikvrt-mesh-v1/Containerfile \
            --build-arg BASE_IMAGE="$base" \
            --build-arg DEBIAN_SNAPSHOT="$DEBIAN_SNAPSHOT" \
            --build-arg SOURCE_COMMIT="$SOURCE_HEAD" \
            --build-arg SOURCE_TREE="$SOURCE_TREE" \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_EPOCH" \
            --tag "$IMAGE_NAME:v$VERSION" \
            --tag "$IMAGE_NAME:latest" \
            --push .
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:v$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "${digest#sha256:}" != "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Finalize release manifest with immutable OCI digest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_HEAD: ${{ steps.meta.outputs.head }}
          SOURCE_TREE: ${{ steps.meta.outputs.tree }}
          BASE_IMAGE: ${{ steps.image.outputs.base }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 appliance/qikvrt-mesh-v1/generate_release_manifest.py \
            --assets artifacts \
            --tag "$TAG" \
            --version "$VERSION" \
            --source-head "$SOURCE_HEAD" \
            --source-tree "$SOURCE_TREE" \
            --authority-base "$SOURCE_HEAD" \
            --base-image "$BASE_IMAGE" \
            --container-reference "$IMAGE_NAME:v$VERSION" \
            --container-digest "$IMAGE_DIGEST" \
            --output "artifacts/QIKVRT-Mesh-Appliance-v$VERSION-release.json"
          sha256sum artifacts/* | LC_ALL=C sort > "artifacts/QIKVRT-Mesh-Appliance-v$VERSION-ALL-SHA256SUMS.txt"
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "BLOCK: immutable release tag already exists: $TAG" >&2
            exit 2
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          QIK-VRT Mesh Appliance v$VERSION

          Debian-based Firefox ESR appliance with the QIK-VRT adapter and bounded Effect-Ack prepare/commit profile.

          Every asset is SHA-256-bound in the release manifest. Use the tag-specific asset URL or the GHCR digest as immutable identity. The latest image tag is a mutable convenience alias only.

          This release does not claim physical Mega-ST execution, general Internet reachability, general EFFECT_ACK_DONE, PASS or FINAL_PASS.
          EOF
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "QIK-VRT Mesh Appliance v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
