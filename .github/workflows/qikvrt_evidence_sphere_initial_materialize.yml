# Same finite transport, narrowly resumed to wire regression tests into make test.
name: QIKVRT evidence sphere first witnessed growth
on:
  push:
    branches: [feature/evidence-sphere-step-v1-b4b0038]
permissions:
  contents: write
concurrency:
  group: qikvrt-evidence-sphere-initial-v1
  cancel-in-progress: false
jobs:
  materialize-once:
    if: github.repository == 'Goldkelch/qik-vrt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.sha }}
      EXPECTED_PARENT: b2f66cb8fb12a5d0db52e4daffefccd901c811e3
      EXPECTED_MAIN: b4b0038bcaa8788098ffa529bd5d5b651dd0459c
      TARGET_REF: feature/evidence-sphere-step-v1-b4b0038
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Wire regressions into existing Mesh test target and self-remove
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/evidence-sphere-make-integration"
          mkdir -p "$out"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD:Makefile)" = 4f3eae3ab9a530e5d4d672de84f5526b8e00e4ac
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Makefile')
          raw = p.read_bytes()
          old = b'real-mesh-test:\n\tPYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 $(PYTHON) -B -m unittest -v tests.test_qikvrt_real_mesh\n'
          new = old[:-1] + b' tests.test_qikvrt_evidence_sphere_step\n'
          if raw.count(old) != 1:
              raise SystemExit('HOLD: exact existing real-mesh-test recipe unavailable')
          p.write_bytes(raw.replace(old, new, 1))
          p = Path('docs/architecture/EVIDENCE_SPHERE_STEP_V1.md')
          raw = p.read_bytes()
          old = b'The retained tests run through ordinary repository test discovery.'
          new = b'The retained tests run through the existing real-mesh-test target of make test.'
          if raw.count(old) != 1:
              raise SystemExit('HOLD: exact test-integration documentation unavailable')
          p.write_bytes(raw.replace(old, new, 1))
          PY
          git rm .github/workflows/qikvrt_evidence_sphere_initial_materialize.yml
          git add Makefile docs/architecture/EVIDENCE_SPHERE_STEP_V1.md
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/qikvrt_evidence_sphere_initial_materialize.yml',
              'Makefile', 'docs/architecture/EVIDENCE_SPHERE_STEP_V1.md',
              'REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if actual != expected:
              raise SystemExit('HOLD: materializer diff differs from exact allowlist: ' + repr(actual))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(evidence): include sphere regressions in existing make test path'
          git rev-parse HEAD > "$out/validated-head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/validated-tree.txt"
      - name: Run full make test on literal self-clean successor
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/evidence-sphere-make-integration"
          test "$(git rev-parse HEAD)" = "$(cat "$out/validated-head.txt")"
          python3 -B tools/qikvrt_tool_cache.py verify
          make test 2>&1 | tee "$out/make-test.log"
          python3 -B tools/qikvrt_integrity.py verify
          python3 - <<'PY'
          import ast, hashlib, json, os, pathlib, subprocess
          from tools.qikvrt_evidence_sphere_step import SphereLedger, graph_root
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence-sphere-make-integration'
          log = (out/'make-test.log').read_text()
          source = pathlib.Path('tests/test_qikvrt_evidence_sphere_step.py').read_text()
          tests = sorted(node.name for node in ast.walk(ast.parse(source))
                         if isinstance(node, ast.FunctionDef) and node.name.startswith('test_'))
          assert len(tests) == 24
          for name in tests:
              expected = f'{name} (tests.test_qikvrt_evidence_sphere_step.EvidenceSphereTests.{name}) ... ok'
              if log.count(expected) != 1:
                  raise SystemExit('HOLD: make test lacks one executed successful sphere test: ' + name)
          target = pathlib.Path('state/evidence-sphere/first-growth-v1')
          raw = (target/'ledger.jsonl').read_bytes()
          if hashlib.sha256(raw).hexdigest() != '92e4441000ba9f0b2129e3c8a9255a1d4e5701de3cf236272ed7eb7e691cf344':
              raise SystemExit('HOLD: historical first-growth ledger changed')
          report = json.loads((target/'REPORT.json').read_text())
          ledger = SphereLedger(target/'ledger.jsonl')
          assert graph_root(ledger.graph) == report['after']['root']
          value = {
              'schema':'qikvrt_evidence_sphere_make_integration_v1',
              'transport_head':os.environ['EXPECTED_HEAD'],
              'validated_head':(out/'validated-head.txt').read_text().strip(),
              'validated_tree':(out/'validated-tree.txt').read_text().strip(),
              'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'make_test_exit':0, 'executed_sphere_tests_in_make_test':tests,
              'graph_source_head':report['head'], 'graph_source_tree':report['tree'],
              'graph_root':graph_root(ledger.graph), 'ledger_records':ledger.sequence,
              'ledger_sha256':hashlib.sha256(raw).hexdigest(),
              'historical_graph_unchanged':True,
              'makefile_blob':subprocess.check_output(['git','rev-parse','HEAD:Makefile'],text=True).strip(),
              'native_approval':False, 'merge':False, 'deployment':False, 'publication':False,
          }
          (out/'EXECUTION.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          print(json.dumps(value,sort_keys=True))
          PY
      - name: Persist tested successor non-force and independently reobserve ref
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/evidence-sphere-make-integration"
          tested_head="$(cat "$out/validated-head.txt")"
          test "$(git rev-parse HEAD)" = "$tested_head"
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_REF"
          test "$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)" = "$tested_head"
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence-sphere-make-integration'
          value = json.loads((out/'EXECUTION.json').read_text())
          value['branch_ref_readback'] = True
          (out/'EXECUTION.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          print(json.dumps(value,sort_keys=True))
          PY
      - name: Preserve execution and ordinary regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-evidence-sphere-make-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence-sphere-make-integration
          if-no-files-found: error
          retention-days: 30
