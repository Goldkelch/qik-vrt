name: QIKVRT scoped equality receipt Zenodo execution

on:
  push:
    branches:
      - execution/zenodo-equality-receipt-b64e4c

permissions:
  contents: write
  issues: write

concurrency:
  group: qikvrt-zenodo-equality-receipt-2026-07-27
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      EXECUTION_BRANCH: execution/zenodo-equality-receipt-b64e4c
      ISSUE_NUMBER: "109"
      MANIFEST: release/authority-mirror-equality-2026-07-27/publish-request.json
      EVIDENCE: release/authority-mirror-equality-2026-07-27/zenodo-publication.json
      AUTHORITY_EXPECTED: b64e4c7826348fec97585b5bfe758bf4b8b44d49
      MIRROR_EXPECTED: 41874792196f5234cbbbd5f099914f0ee409855a
      RECEIPT_BLOB_EXPECTED: 83c80c53d330eb929defb3739ecc9184e6754639
      INDEX_BLOB_EXPECTED: 24ed0bf0736b444d51e6773c66b57301cb6b9727
    steps:
      - name: Check for an already persisted publication receipt
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if gh api -X GET "repos/$GITHUB_REPOSITORY/contents/$EVIDENCE" -f ref="$EXECUTION_BRANCH" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Repository Zenodo executor: idempotent no-op. A publication evidence file already exists on \`$EXECUTION_BRANCH\`; no second remote mutation was attempted. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact execution commit
        if: steps.preflight.outputs.already != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Reobserve pair refs and verify publication source blobs
        if: steps.preflight.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          authority="$(gh api repos/Goldkelch/qik-vrt/commits/main --jq '.sha')"
          mirror="$(gh api repos/ingolf-lohmann/qik-vrt/commits/main --jq '.sha')"
          test "$authority" = "$AUTHORITY_EXPECTED"
          test "$mirror" = "$MIRROR_EXPECTED"
          test "$(git hash-object evidence/receipts/authority-mirror-equality-2026-07-27-pr106-pr56.json)" = "$RECEIPT_BLOB_EXPECTED"
          test "$(git hash-object evidence/receipts/index.json)" = "$INDEX_BLOB_EXPECTED"
          test "$(git hash-object "$MANIFEST")" = "732d7afda8aaeed8c6a6e1e82a444d8105325ae2"
          python -B tests/test_authority_mirror_equality_receipt.py
          python -B tools/qikvrt_integrity.py generate
          python -B tools/qikvrt_integrity.py verify

      - name: Publish and independently gate the public Zenodo record
        if: steps.preflight.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          python -B tools/qikvrt_zenodo_publish.py --manifest "$MANIFEST" | tee zenodo-publication-output.log
          test -s "$EVIDENCE"
          python - "$EVIDENCE" <<'PY'
          import json, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          value = json.loads(path.read_text(encoding="utf-8"))
          assert value["schema"] == "qikvrt_zenodo_publication_evidence_v1"
          assert value["state"] == "published"
          assert isinstance(value["record_id"], int) and value["record_id"] > 0
          assert re.fullmatch(r"10\.[0-9]{4,9}/[-._;()/:A-Za-z0-9]+", value["doi"])
          assert value["repository"] == "Goldkelch/qik-vrt"
          assert len(value["files"]) == 2
          PY

      - name: Persist publication evidence on the execution branch
        if: steps.preflight.outputs.already != 'true'
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          temporary="$(mktemp)"
          cp "$EVIDENCE" "$temporary"
          git fetch origin "$EXECUTION_BRANCH"
          git checkout -B "$EXECUTION_BRANCH" "origin/$EXECUTION_BRANCH"
          mkdir -p "$(dirname "$EVIDENCE")"
          cp "$temporary" "$EVIDENCE"
          rm -f "$temporary"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVIDENCE"
          git commit -m "Persist verified Zenodo equality-receipt publication"
          git push origin "HEAD:$EXECUTION_BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "blob=$(git hash-object "$EVIDENCE")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$EVIDENCE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Report verified publication
        if: success() && steps.preflight.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          record_id="$(jq -r '.record_id' "$EVIDENCE")"
          doi="$(jq -r '.doi' "$EVIDENCE")"
          conceptdoi="$(jq -r '.conceptdoi // "unavailable"' "$EVIDENCE")"
          record_url="$(jq -r '.record_url' "$EVIDENCE")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Repository Zenodo executor: publication verified and evidence persisted.\n\n- state: \`published\`\n- record ID: \`$record_id\`\n- DOI: \`$doi\`\n- concept DOI: \`$conceptdoi\`\n- record URL: $record_url\n- evidence commit: \`${{ steps.persist.outputs.commit }}\`\n- evidence Git blob: \`${{ steps.persist.outputs.blob }}\`\n- evidence SHA-256: \`${{ steps.persist.outputs.sha256 }}\`\n- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nNo \`PASS\`, \`FINAL_PASS\`, \`EFFECT_ACK_DONE\` or fully kernel-verified overall completion is claimed."

      - name: Report fail-closed publication block
        if: failure() && steps.preflight.outputs.already != 'true'
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Repository Zenodo executor: **BLOCK**. The bounded publication transaction failed before a verified evidence commit was established. No DOI or publication success is claimed. Inspect run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
