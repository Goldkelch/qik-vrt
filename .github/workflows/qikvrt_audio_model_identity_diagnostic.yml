name: QIK-VRT declared audio model identity diagnostic

on:
  push:
    branches:
      - automation/audio-model-identity-diagnostic-20260724
    paths:
      - .github/workflows/qikvrt_audio_model_identity_diagnostic.yml

permissions:
  contents: read

jobs:
  inspect-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic state without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download declared archive and preserve bounded diagnostics
        shell: bash
        env:
          MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2
          EXPECTED_ARCHIVE_SHA256: 911b2083efd7c0dca2ac3b358b75222660dc09fb716d64fbfc417ba6c99ff3de
        run: |
          set -u
          root="$RUNNER_TEMP/qikvrt-model-diagnostic"
          mkdir -p "$root/extracted"
          archive="$root/model.tar.bz2"
          headers="$root/headers.txt"
          stderr="$root/curl.stderr.txt"
          summary="$root/summary.json"

          set +e
          http_code="$(curl \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            --dump-header "$headers" \
            --output "$archive" \
            --write-out '%{http_code}' \
            "$MODEL_URL" 2>"$stderr")"
          curl_rc=$?
          set -e

          python3 -B - "$archive" "$summary" "$curl_rc" "$http_code" "$EXPECTED_ARCHIVE_SHA256" <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, sys
          from pathlib import Path

          archive, summary = map(Path, sys.argv[1:3])
          curl_rc = int(sys.argv[3])
          http_code = sys.argv[4]
          expected_archive_sha256 = sys.argv[5]
          payload = archive.read_bytes() if archive.exists() else b""
          actual_archive_sha256 = hashlib.sha256(payload).hexdigest() if payload else None
          report: dict[str, object] = {
              "schema": "qikvrt_audio_model_identity_diagnostic_v2",
              "url": "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-base.tar.bz2",
              "curl_exit": curl_rc,
              "http_code": http_code,
              "archive_bytes": len(payload),
              "expected_archive_sha256": expected_archive_sha256,
              "actual_archive_sha256": actual_archive_sha256,
              "archive_identity_matches": actual_archive_sha256 == expected_archive_sha256,
              "tar_list_exit": None,
              "expected_members_present": False,
              "members": [],
              "extracted_files": [],
          }
          expected_members = {
              "sherpa-onnx-whisper-base/base-decoder.int8.onnx",
              "sherpa-onnx-whisper-base/base-encoder.int8.onnx",
              "sherpa-onnx-whisper-base/base-tokens.txt",
          }
          if payload:
              listed = subprocess.run(
                  ["tar", "-tjf", str(archive)],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  encoding="utf-8",
                  errors="replace",
                  timeout=180,
              )
              report["tar_list_exit"] = listed.returncode
              members = [line for line in listed.stdout.splitlines() if line]
              report["member_count"] = len(members)
              report["members"] = [member for member in members if "whisper-base/" in member][:20]
              report["tar_stderr_tail"] = listed.stderr[-2000:]
              report["expected_members_present"] = expected_members.issubset(set(members))
              if listed.returncode == 0 and report["expected_members_present"]:
                  extracted = archive.parent / "extracted"
                  subprocess.run(
                      ["tar", "--no-same-owner", "-xjf", str(archive), "-C", str(extracted), *sorted(expected_members)],
                      check=True,
                      timeout=180,
                  )
                  records = []
                  for member in sorted(expected_members):
                      path = extracted / member
                      raw = path.read_bytes()
                      records.append({
                          "member": member,
                          "bytes": len(raw),
                          "sha256": hashlib.sha256(raw).hexdigest(),
                      })
                  report["extracted_files"] = records
          summary.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Execute exact production installer with bounded trace
        id: installer
        shell: bash
        env:
          QIKVRT_AUDIO_MODEL_DIR: ${{ runner.temp }}/qikvrt-production-model
        run: |
          set -u
          root="$RUNNER_TEMP/qikvrt-installer-diagnostic"
          mkdir -p "$root"
          set +e
          bash -x tools/offline-audio-transcription/scripts/install-model.sh \
            >"$root/installer.stdout.txt" \
            2>"$root/installer.stderr.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$root/installer.exit.txt"
          python3 -B - "$QIKVRT_AUDIO_MODEL_DIR" "$root/installer-summary.json" "$rc" <<'PY'
          from __future__ import annotations
          import hashlib, json, sys
          from pathlib import Path

          model_dir = Path(sys.argv[1])
          output = Path(sys.argv[2])
          rc = int(sys.argv[3])
          records = []
          if model_dir.exists():
              for path in sorted(p for p in model_dir.rglob("*") if p.is_file()):
                  raw = path.read_bytes()
                  records.append({
                      "path": path.relative_to(model_dir).as_posix(),
                      "bytes": len(raw),
                      "sha256": hashlib.sha256(raw).hexdigest(),
                  })
          report = {
              "schema": "qikvrt_audio_model_installer_diagnostic_v1",
              "installer_exit": rc,
              "model_dir_exists": model_dir.exists(),
              "files": records,
          }
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "installer_exit=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload bounded model and installer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-audio-model-installer-diagnostic
          retention-days: 3
          path: |
            ${{ runner.temp }}/qikvrt-model-diagnostic/summary.json
            ${{ runner.temp }}/qikvrt-model-diagnostic/headers.txt
            ${{ runner.temp }}/qikvrt-model-diagnostic/curl.stderr.txt
            ${{ runner.temp }}/qikvrt-installer-diagnostic/installer.stdout.txt
            ${{ runner.temp }}/qikvrt-installer-diagnostic/installer.stderr.txt
            ${{ runner.temp }}/qikvrt-installer-diagnostic/installer.exit.txt
            ${{ runner.temp }}/qikvrt-installer-diagnostic/installer-summary.json
          if-no-files-found: error

      - name: Enforce exact production installer
        shell: bash
        env:
          INSTALLER_EXIT: ${{ steps.installer.outputs.installer_exit }}
        run: test "$INSTALLER_EXIT" = 0
