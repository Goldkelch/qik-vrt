          reverse_evidence: list[dict[str, object]] = []
          visited: set[str] = set()
          while cursor != execution_head:
              if (
                  cursor in visited
                  or len(visited) >= len(publish.RECOVERY_PHASES) - 1
              ):
                  raise SystemExit("BLOCK: recovery chain is cyclic or unbounded")
              visited.add(cursor)
              parents = git("show", "-s", "--format=%P", cursor).decode().split()
              if len(parents) != 1:
                  raise SystemExit("BLOCK: recovery receipt is not single-parent")
              parent = parents[0]
              observed: dict[str, str] = {}
              for line in git(
                  "diff",
                  "--name-status",
                  "--no-renames",
                  parent,
                  cursor,
                  "--",
              ).decode().splitlines():
