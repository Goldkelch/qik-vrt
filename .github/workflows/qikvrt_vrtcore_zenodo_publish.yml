                      raise SystemExit("BLOCK: duplicate recovery delta path")
                  observed[path] = status
              expected = dict(expected_paths)
              expected[evidence_relative] = (
                  "A" if parent == execution_head else "M"
              )
              if observed != expected:
                  raise SystemExit("BLOCK: recovery commit delta differs")
              try:
                  evidence_raw = git("show", f"{cursor}:{evidence_relative}")
                  evidence = json.loads(evidence_raw.decode("utf-8"))
              except (UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit("BLOCK: recovery receipt JSON differs") from exc
              evidence = publish._validate_recovery_evidence(
                  evidence,
                  manifest_path,
                  root,
                  manifest,
                  execution_head,
              )
              if (
                  evidence["state"] != publish.CONSUMPTION_STATE
                  or evidence["phase"] == "public_verified"
                  or evidence["recovery"]["public_verified"] is not False
                  or evidence["recovery"]["remote_state_requires_reconciliation"]
                  is not True
              ):
                  raise SystemExit("BLOCK: recovery branch contains public evidence")
              validate_modes_and_integrity(cursor, evidence_raw)
              reverse_evidence.append(evidence)
              cursor = parent
          if not visited:
              raise SystemExit("BLOCK: recovery ref does not contain a receipt")
          chain = list(reversed(reverse_evidence))
          phases = [str(evidence["phase"]) for evidence in chain]
          positions = [publish.RECOVERY_PHASES.index(phase) for phase in phases]
          if any(left >= right for left, right in zip(positions, positions[1:])):
              raise SystemExit("BLOCK: recovery phases regress")
          first_consumption = chain[0]["remote_consumption"]
          record_identity: tuple[object, object] | None = None
          for evidence in chain:
              if evidence["remote_consumption"] != first_consumption:
                  raise SystemExit("BLOCK: recovery consumption identity changes")
