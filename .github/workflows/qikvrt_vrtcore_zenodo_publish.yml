              expected = {
                  "REPOSITORY_FILE_MANIFEST.json": "M",
                  "REPOSITORY_FILE_MANIFEST.json.sha256": "M",
                  "SHA256SUMS.txt": "M",
                  evidence_relative: "A" if parent == execution_head else "M",
              }
              if observed != expected:
                  raise SystemExit("BLOCK: receipt commit delta differs")
              observed_modes: dict[str, tuple[str, str]] = {}
              for entry in git(
                  "ls-tree", "-z", tree, "--", *expected
              ).split(b"\0"):
                  if not entry:
                      continue
                  metadata, raw_path = entry.split(b"\t", 1)
                  mode, object_type, _object_id = metadata.decode("ascii").split()
                  observed_modes[raw_path.decode("utf-8")] = (mode, object_type)
              if observed_modes != {
                  path: ("100644", "blob") for path in expected
              }:
                  raise SystemExit("BLOCK: receipt tree path mode differs")
          elif tree != git("rev-parse", "--verify", f"{parent}^{{tree}}").decode().strip() \
              or os.environ["EXPECTED_STATE"] == "published":
              raise SystemExit("BLOCK: only identical recovery may reuse its head")

          commit_evidence = git("show", f"{tree}:{evidence_relative}")
          if commit_evidence != evidence_path.read_bytes():
              raise SystemExit("BLOCK: prepared evidence bytes differ")
          for relative in (
              "REPOSITORY_FILE_MANIFEST.json",
              "REPOSITORY_FILE_MANIFEST.json.sha256",
              "SHA256SUMS.txt",
              evidence_relative,
          ):
              commit_blob = git("rev-parse", "--verify", f"{tree}:{relative}")
              worktree_blob = git("hash-object", str(root / relative))
              if commit_blob != worktree_blob:
                  raise SystemExit("BLOCK: receipt tree blob differs for " + relative)
          try:
              evidence = json.loads(commit_evidence.decode("utf-8"))
          except (UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("BLOCK: committed evidence JSON differs") from exc
          evidence = publish._validate_recovery_evidence(
              evidence,
              manifest_path,
              root,
              manifest,
              execution_head,
          )
          if (
              evidence["phase"] != os.environ["EXPECTED_PHASE"]
              or evidence["state"] != os.environ["EXPECTED_STATE"]
          ):
              raise SystemExit("BLOCK: committed evidence phase or state differs")
          if parent != execution_head:
              try:
                  parent_evidence = json.loads(
                      git("show", f"{parent}:{evidence_relative}").decode("utf-8")
                  )
              except (UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit("BLOCK: parent recovery evidence differs") from exc
              parent_evidence = publish._validate_recovery_evidence(
                  parent_evidence,
                  manifest_path,
                  root,
                  manifest,
                  execution_head,
              )
              if (
                  parent_evidence["state"] != publish.CONSUMPTION_STATE
                  or parent_evidence["phase"] == "public_verified"
                  or parent_evidence["remote_consumption"]
                  != evidence["remote_consumption"]
                  or (
                      "record_id" in parent_evidence
                      and (
                          parent_evidence["record_id"] != evidence.get("record_id")
                          or parent_evidence["doi"] != evidence.get("doi")
                      )
                  )
                  or (
                      requires_push
                      and publish.RECOVERY_PHASES.index(evidence["phase"])
                      <= publish.RECOVERY_PHASES.index(parent_evidence["phase"])
                  )
              ):
                  raise SystemExit("BLOCK: receipt phase regresses from recovery parent")
          print("VRTCORE_RECEIPT_TREE=VALID")
          PY
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"
          test "$(
            git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" |
              awk 'NR == 1 { print $1 }'
          )" = "$GITHUB_SHA"
          current_recovery_head="$(
            git ls-remote --heads origin "$RECOVERY_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if test "$RECOVERY_PRESENT" = "true"; then
            test "$current_recovery_head" = "$RECOVERY_BASE"
          else
            test -z "$current_recovery_head"
          fi
          if test "$state" = "published"; then
            test "$requires_push" = "true"
            target_ref="refs/heads/$GITHUB_REF_NAME"
            target_operation=update
            receipt_storage=publication
          else
            target_ref="$RECOVERY_REF"
            if test "$RECOVERY_PRESENT" = "true"; then
              target_operation=update
            else
              target_operation=create
            fi
            receipt_storage=recovery
          fi
          printf '%s\n' 'prepared=true' >> "$GITHUB_OUTPUT"
          printf 'requires_push=%s\n' "$requires_push" >> "$GITHUB_OUTPUT"
          printf 'phase=%s\n' "$phase" >> "$GITHUB_OUTPUT"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          printf 'receipt_tree=%s\n' "$receipt_tree" >> "$GITHUB_OUTPUT"
          printf 'receipt_base_tree=%s\n' "$recovery_tree" >> "$GITHUB_OUTPUT"
          printf 'receipt_parent=%s\n' "$RECOVERY_BASE" >> "$GITHUB_OUTPUT"
          printf 'receipt_date=%s\n' "$receipt_date" >> "$GITHUB_OUTPUT"
          printf 'target_ref=%s\n' "$target_ref" >> "$GITHUB_OUTPUT"
          printf 'target_operation=%s\n' "$target_operation" >> "$GITHUB_OUTPUT"
          printf 'commit_message=%s\n' "$message" >> "$GITHUB_OUTPUT"
          printf 'receipt_storage=%s\n' "$receipt_storage" >> "$GITHUB_OUTPUT"

      - name: Persist exact receipt through GitHub Git Data REST
        id: push
        if: >-
          always() &&
          env.ALREADY_FINALIZED != 'true' &&
          steps.persist.outputs.prepared == 'true' &&
          steps.persist.outputs.requires_push == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT_TREE: ${{ steps.persist.outputs.receipt_tree }}
          RECEIPT_BASE_TREE: ${{ steps.persist.outputs.receipt_base_tree }}
          RECEIPT_PARENT: ${{ steps.persist.outputs.receipt_parent }}
          RECEIPT_DATE: ${{ steps.persist.outputs.receipt_date }}
          RECEIPT_PHASE: ${{ steps.persist.outputs.phase }}
          RECEIPT_STATE: ${{ steps.persist.outputs.state }}
          RECEIPT_TARGET_REF: ${{ steps.persist.outputs.target_ref }}
          RECEIPT_TARGET_OPERATION: ${{ steps.persist.outputs.target_operation }}
          RECEIPT_MESSAGE: ${{ steps.persist.outputs.commit_message }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          root = Path.cwd().resolve()
          consumption_state = "EFFECT_RELEASED/AWAITING_REMOTE_RECONCILIATION"
          token = os.environ["GITHUB_TOKEN"]
          execution_head = os.environ["GITHUB_SHA"]
          tree = os.environ["RECEIPT_TREE"]
          base_tree = os.environ["RECEIPT_BASE_TREE"]
          parent = os.environ["RECEIPT_PARENT"]
          effect_date = os.environ["RECEIPT_DATE"]
          phase = os.environ["RECEIPT_PHASE"]
          state = os.environ["RECEIPT_STATE"]
          target_ref = os.environ["RECEIPT_TARGET_REF"]
          operation = os.environ["RECEIPT_TARGET_OPERATION"]
          message = os.environ["RECEIPT_MESSAGE"]
          evidence_relative = os.environ["EVIDENCE_PATH"]
          publication_ref = "refs/heads/" + os.environ["GITHUB_REF_NAME"]
          recovery_ref = os.environ["RECOVERY_REF"]
          if (
              re.fullmatch(r"[0-9a-f]{40}", execution_head) is None
              or re.fullmatch(r"[0-9a-f]{40}", tree) is None
              or re.fullmatch(r"[0-9a-f]{40}", base_tree) is None
              or re.fullmatch(r"[0-9a-f]{40}", parent) is None
              or len(token) < 20
              or any(character.isspace() for character in token)
              or not message
              or "\n" in message
              or "\r" in message
          ):
              raise SystemExit("BLOCK: GitHub receipt effect inputs differ")
          if not effect_date or "\n" in effect_date or "\r" in effect_date:
              raise SystemExit("BLOCK: deterministic receipt date differs")
          if state == "published":
              if (
                  phase != "public_verified"
                  or target_ref != publication_ref
                  or operation != "update"
              ):
                  raise SystemExit("BLOCK: final receipt target differs")
              expected_old_target = execution_head
          else:
              if (
                  state != consumption_state
                  or phase == "public_verified"
                  or target_ref != recovery_ref
                  or operation not in {"create", "update"}
              ):
                  raise SystemExit("BLOCK: recovery receipt target differs")
              expected_old_target = parent

          class NoCredentialRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(
                  self,
                  request: urllib.request.Request,
                  file_pointer: object,
                  code: int,
                  response_message: str,
                  headers: object,
                  new_url: str,
              ) -> None:
                  return None

          class AmbiguousRefMutation(RuntimeError):
              pass

          api_origin = "https://api.github.com"
          repository_prefix = "/repos/Goldkelch/qik-vrt/"
          opener = urllib.request.build_opener(NoCredentialRedirect())

          def api(
              method: str,
              path: str,
              *,
              payload: dict[str, object] | None = None,
              accept: tuple[int, ...] = (200,),
              allow_ambiguous_transport: bool = False,
          ) -> tuple[int, dict[str, object]]:
              if (
                  method not in {"GET", "POST", "PATCH"}
                  or not path.startswith(repository_prefix)
                  or any(character in path for character in "\x00\r\n?#")
              ):
                  raise SystemExit("BLOCK: GitHub receipt API boundary differs")
              url = api_origin + path
              body = None
              if payload is not None:
                  body = json.dumps(
                      payload,
                      ensure_ascii=False,
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=body,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "User-Agent": "qik-vrt-zenodo-receipt/1",
                      "X-GitHub-Api-Version": "2022-11-28",
                      **(
                          {"Content-Type": "application/json"}
                          if body is not None
                          else {}
                      ),
                  },
              )
              try:
                  response = opener.open(request, timeout=30)
              except urllib.error.HTTPError as exc:
                  response = exc
              except (OSError, urllib.error.URLError) as exc:
                  if allow_ambiguous_transport:
                      raise AmbiguousRefMutation from exc
                  raise SystemExit(
                      "BLOCK: GitHub receipt API transport failed: "
                      + type(exc).__name__
                  ) from exc
              try:
                  try:
                      status = int(response.status)
                      if response.geturl() != url:
                          raise SystemExit("BLOCK: GitHub receipt API origin changed")
                      raw = response.read(16 * 1024 * 1024 + 1)
                  except (OSError, urllib.error.URLError) as exc:
                      if allow_ambiguous_transport:
                          raise AmbiguousRefMutation from exc
                      raise SystemExit(
                          "BLOCK: GitHub receipt API response failed: "
                          + type(exc).__name__
                      ) from exc
              finally:
                  response.close()
              if allow_ambiguous_transport and 500 <= status <= 599:
                  raise AmbiguousRefMutation
              if len(raw) > 16 * 1024 * 1024 or status not in accept:
                  raise SystemExit(
                      f"BLOCK: GitHub receipt API rejected {method} ({status})"
                  )
              if status in {409, 422}:
                  return status, {}
              if not raw:
                  return status, {}
              try:
                  value = json.loads(raw.decode("utf-8"))
              except (UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit("BLOCK: GitHub receipt API JSON differs") from exc
              if not isinstance(value, dict):
                  raise SystemExit("BLOCK: GitHub receipt API object differs")
              if token.encode("utf-8") in raw:
                  raise SystemExit("BLOCK: GitHub receipt API reflected its token")
              return status, value

          def ref_path(ref: str, *, plural: bool) -> str:
              if not ref.startswith("refs/heads/"):
                  raise SystemExit("BLOCK: receipt target is not a branch ref")
              suffix = urllib.parse.quote(ref.removeprefix("refs/"), safe="/")
              noun = "refs" if plural else "ref"
              return f"/repos/Goldkelch/qik-vrt/git/{noun}/{suffix}"

          def validate_ref(
              value: dict[str, object],
              ref: str,
              commit: str,
          ) -> None:
              target = value.get("object")
              if (
                  value.get("ref") != ref
                  or not isinstance(target, dict)
                  or target.get("sha") != commit
                  or target.get("type") != "commit"
              ):
                  raise SystemExit("BLOCK: GitHub receipt ref response differs")

          def validate_commit(
              value: dict[str, object],
              commit: str,
              expected_tree: str,
              expected_parent: str,
              expected_message: str,
          ) -> None:
              response_tree = value.get("tree")
              response_parents = value.get("parents")
              if (
                  value.get("sha") != commit
                  or value.get("message") != expected_message
                  or not isinstance(response_tree, dict)
                  or response_tree.get("sha") != expected_tree
                  or not isinstance(response_parents, list)
                  or [
                      item.get("sha") if isinstance(item, dict) else None
                      for item in response_parents
                  ]
                  != [expected_parent]
              ):
                  raise SystemExit("BLOCK: GitHub receipt commit readback differs")

          before_status, before_ref = api(
              "GET",
              ref_path(target_ref, plural=False),
              accept=(200, 404),
          )
          if operation == "create":
              if before_status != 404:
                  raise SystemExit("BLOCK: recovery ref already exists before create")
          elif before_status != 200:
              raise SystemExit("BLOCK: receipt target disappeared before update")
          else:
              validate_ref(before_ref, target_ref, expected_old_target)

          publication_status, publication_before = api(
              "GET",
              ref_path(publication_ref, plural=False),
              accept=(200, 404),
          )
          if publication_status != 200:
              raise SystemExit("BLOCK: publication ref moved before receipt effect")
          validate_ref(publication_before, publication_ref, execution_head)
          recovery_status, recovery_before = api(
              "GET",
              ref_path(recovery_ref, plural=False),
              accept=(200, 404),
          )
          if os.environ["RECOVERY_PRESENT"] == "true":
              if recovery_status != 200:
                  raise SystemExit("BLOCK: recovery ref moved before receipt effect")
              validate_ref(recovery_before, recovery_ref, parent)
          elif recovery_status != 404:
              raise SystemExit("BLOCK: recovery ref appeared before receipt effect")

          receipt_paths = (
              "REPOSITORY_FILE_MANIFEST.json",
              "REPOSITORY_FILE_MANIFEST.json.sha256",
              "SHA256SUMS.txt",
              evidence_relative,
          )
          blobs: dict[str, str] = {}
          for relative in receipt_paths:
              path = root / relative
              if not path.is_file() or path.is_symlink():
                  raise SystemExit("BLOCK: receipt API input is not a regular file")
              raw = path.read_bytes()
              local_blob = hashlib.sha1(
                  f"blob {len(raw)}\0".encode("ascii") + raw
              ).hexdigest()
              _status, created_blob = api(
                  "POST",
                  "/repos/Goldkelch/qik-vrt/git/blobs",
                  payload={
                      "content": base64.b64encode(raw).decode("ascii"),
                      "encoding": "base64",
                  },
                  accept=(201,),
              )
              if created_blob.get("sha") != local_blob:
                  raise SystemExit("BLOCK: GitHub receipt blob identity differs")
              blobs[relative] = local_blob

          _status, parent_commit = api(
              "GET",
              "/repos/Goldkelch/qik-vrt/git/commits/" + parent,
          )
          parent_tree = parent_commit.get("tree")
          if (
              parent_commit.get("sha") != parent
              or not isinstance(parent_tree, dict)
              or parent_tree.get("sha") != base_tree
          ):
              raise SystemExit("BLOCK: GitHub receipt parent binding differs")
          _status, parent_tree_readback = api(
              "GET",
              "/repos/Goldkelch/qik-vrt/git/trees/" + base_tree,
          )
          if parent_tree_readback.get("sha") != base_tree:
              raise SystemExit("BLOCK: GitHub receipt parent tree differs")
          _status, created_tree = api(
              "POST",
              "/repos/Goldkelch/qik-vrt/git/trees",
              payload={
                  "base_tree": base_tree,
                  "tree": [
                      {
                          "path": relative,
                          "mode": "100644",
                          "type": "blob",
                          "sha": blobs[relative],
                      }
                      for relative in receipt_paths
                  ],
              },
              accept=(201,),
          )
          if created_tree.get("sha") != tree:
              raise SystemExit("BLOCK: GitHub receipt tree identity differs")
          _status, created_tree_readback = api(
              "GET",
              "/repos/Goldkelch/qik-vrt/git/trees/" + tree,
          )
          if created_tree_readback.get("sha") != tree:
              raise SystemExit("BLOCK: GitHub receipt tree readback differs")

          identity = {
              "name": "qik-vrt-zenodo-publication[bot]",
              "email": (
                  "qik-vrt-zenodo-publication[bot]@users.noreply.github.com"
              ),
              "date": effect_date,
          }
          commit_payload = {
              "message": message,
              "tree": tree,
              "parents": [parent],
              "author": identity,
              "committer": identity,
          }
          _status, created_commit = api(
              "POST",
              "/repos/Goldkelch/qik-vrt/git/commits",
              payload=commit_payload,
              accept=(201,),
          )
          receipt_commit = created_commit.get("sha")
          if (
              not isinstance(receipt_commit, str)
              or re.fullmatch(r"[0-9a-f]{40}", receipt_commit) is None
          ):
              raise SystemExit("BLOCK: GitHub receipt commit identity differs")
          _status, readback_commit = api(
              "GET",
              "/repos/Goldkelch/qik-vrt/git/commits/" + receipt_commit,
          )
          validate_commit(readback_commit, receipt_commit, tree, parent, message)

          # REST PATCH force=false guarantees fast-forward, but GitHub's API has
          # no expected-old compare-and-swap parameter.  Therefore the workflow
          # performs an immediate exact pre-read, one mutation request only, and
          # fail-closed reconciliation by exact new-SHA readback.
          print("REST_PATCH_FORCE_FALSE_IS_FF_NOT_EXPECTED_OLD_CAS")
          pre_mutation_status, pre_mutation_ref = api(
              "GET",
              ref_path(target_ref, plural=False),
              accept=(200, 404),
          )
          if operation == "create":
              if pre_mutation_status != 404:
                  raise SystemExit("BLOCK: recovery ref raced before create")
          elif pre_mutation_status != 200:
              raise SystemExit("BLOCK: receipt target raced before update")
          else:
              validate_ref(
                  pre_mutation_ref,
                  target_ref,
                  expected_old_target,
              )

          mutation_status: int | None = None
          changed_ref: dict[str, object] = {}
          try:
              if operation == "create":
                  mutation_status, changed_ref = api(
                      "POST",
                      "/repos/Goldkelch/qik-vrt/git/refs",
                      payload={"ref": target_ref, "sha": receipt_commit},
                      accept=(201, 409, 422),
                      allow_ambiguous_transport=True,
                  )
              else:
                  mutation_status, changed_ref = api(
                      "PATCH",
                      ref_path(target_ref, plural=True),
                      payload={"sha": receipt_commit, "force": False},
                      accept=(200, 409, 422),
                      allow_ambiguous_transport=True,
                  )
          except AmbiguousRefMutation:
              mutation_status = None
          expected_success = 201 if operation == "create" else 200
          if mutation_status == expected_success:
              validate_ref(changed_ref, target_ref, receipt_commit)
          elif mutation_status not in {None, 409, 422}:
              raise SystemExit("BLOCK: receipt mutation status differs")

          # Exactly one reconciliation GET follows success, conflict, or an
          # ambiguous transport.  The mutation request is never retried.
          reconciliation_status, reconciled_ref = api(
              "GET",
              ref_path(target_ref, plural=False),
              accept=(200, 404),
          )
          if reconciliation_status != 200:
              raise SystemExit("BLOCK: receipt mutation has no exact ref")
          validate_ref(reconciled_ref, target_ref, receipt_commit)

          _status, post_ref_commit = api(
              "GET",
              "/repos/Goldkelch/qik-vrt/git/commits/" + receipt_commit,
          )
          validate_commit(post_ref_commit, receipt_commit, tree, parent, message)
          _status, post_ref_tree = api(
              "GET",
              "/repos/Goldkelch/qik-vrt/git/trees/" + tree,
          )
          if post_ref_tree.get("sha") != tree:
              raise SystemExit("BLOCK: post-ref receipt tree differs")
          _status, final_ref_readback = api(
              "GET",
              ref_path(target_ref, plural=False),
          )
          validate_ref(final_ref_readback, target_ref, receipt_commit)

          if target_ref == publication_ref:
              recovery_after_status, recovery_after = api(
                  "GET",
                  ref_path(recovery_ref, plural=False),
                  accept=(200, 404),
              )
              if os.environ["RECOVERY_PRESENT"] == "true":
                  if recovery_after_status != 200:
                      raise SystemExit("BLOCK: final effect changed recovery ref")
                  validate_ref(recovery_after, recovery_ref, parent)
              elif recovery_after_status != 404:
                  raise SystemExit("BLOCK: final effect changed recovery ref")
          else:
              publication_after_status, publication_after = api(
                  "GET",
                  ref_path(publication_ref, plural=False),
                  accept=(200, 404),
              )
              if publication_after_status != 200:
                  raise SystemExit("BLOCK: recovery effect changed publication ref")
              validate_ref(publication_after, publication_ref, execution_head)
          print("VRTCORE_GITHUB_RECEIPT_EFFECT=VALID")
          destination = Path(os.environ["GITHUB_OUTPUT"])
          with destination.open("a", encoding="utf-8", newline="\n") as handle:
              handle.write("persisted=true\n")
              handle.write("receipt_commit=" + receipt_commit + "\n")
          PY

      - name: Verify persisted receipt without credentials
        id: verify_receipt
        if: >-
          always() &&
          env.ALREADY_FINALIZED != 'true' &&
          steps.push.outputs.persisted == 'true'
        shell: bash
        env:
          RECEIPT_COMMIT: ${{ steps.push.outputs.receipt_commit }}
          RECEIPT_TREE: ${{ steps.persist.outputs.receipt_tree }}
          RECEIPT_PARENT: ${{ steps.persist.outputs.receipt_parent }}
          RECEIPT_PHASE: ${{ steps.persist.outputs.phase }}
          RECEIPT_STATE: ${{ steps.persist.outputs.state }}
          RECEIPT_TARGET_REF: ${{ steps.persist.outputs.target_ref }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          from tools import qikvrt_zenodo_publish as publish

          root = Path.cwd().resolve()
          commit = os.environ["RECEIPT_COMMIT"]
          tree = os.environ["RECEIPT_TREE"]
          parent = os.environ["RECEIPT_PARENT"]
          phase = os.environ["RECEIPT_PHASE"]
          state = os.environ["RECEIPT_STATE"]
          target_ref = os.environ["RECEIPT_TARGET_REF"]
          execution_head = os.environ["GITHUB_SHA"]
          evidence_relative = os.environ["EVIDENCE_PATH"]
          manifest_path = root / os.environ["MANIFEST_PATH"]
          publication_ref = "refs/heads/" + os.environ["GITHUB_REF_NAME"]
          recovery_ref = os.environ["RECOVERY_REF"]
          if any(
              re.fullmatch(r"[0-9a-f]{40}", value) is None
              for value in (commit, tree, parent, execution_head)
          ):
              raise SystemExit("BLOCK: credential-free receipt identity differs")

          def git(*arguments: str) -> bytes:
              environment = {
                  key: value
                  for key, value in os.environ.items()
                  if key != "GITHUB_TOKEN"
              }
              environment["GIT_TERMINAL_PROMPT"] = "0"
              result = subprocess.run(
                  ["git", *arguments],
                  cwd=root,
                  env=environment,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if result.returncode != 0:
                  raise SystemExit("BLOCK: credential-free receipt Git gate failed")
              return result.stdout

          git("fetch", "--no-tags", "origin", target_ref)
          if (
              git("rev-parse", "--verify", "FETCH_HEAD^{commit}")
              .decode("ascii")
              .strip()
              != commit
              or git("show", "-s", "--format=%P", commit)
              .decode("ascii")
              .strip()
              != parent
              or git("rev-parse", "--verify", f"{commit}^{{tree}}")
              .decode("ascii")
              .strip()
              != tree
          ):
              raise SystemExit("BLOCK: credential-free receipt binding differs")
          git("diff-tree", "--check", parent, commit)
          observed: dict[str, str] = {}
          for line in git(
              "diff",
              "--name-status",
              "--no-renames",
              parent,
              commit,
              "--",
          ).decode("utf-8").splitlines():
              status, relative = line.split("\t", 1)
              observed[relative] = status
          expected = {
              "REPOSITORY_FILE_MANIFEST.json": "M",
              "REPOSITORY_FILE_MANIFEST.json.sha256": "M",
              "SHA256SUMS.txt": "M",
              evidence_relative: "A" if parent == execution_head else "M",
          }
          if observed != expected:
              raise SystemExit("BLOCK: credential-free receipt delta differs")
          observed_modes = {}
          for entry in git("ls-tree", "-z", commit, "--", *expected).split(b"\0"):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode, object_type, _object_id = metadata.decode("ascii").split()
              observed_modes[raw_path.decode("utf-8")] = (mode, object_type)
          if observed_modes != {
              path: ("100644", "blob") for path in expected
          }:
              raise SystemExit("BLOCK: credential-free receipt mode differs")
          for relative in expected:
              remote_blob = git("rev-parse", "--verify", f"{commit}:{relative}")
              local_blob = git("hash-object", str(root / relative))
              if remote_blob != local_blob:
                  raise SystemExit("BLOCK: credential-free receipt blob differs")
          evidence_raw = git("show", f"{commit}:{evidence_relative}")
          evidence = json.loads(evidence_raw.decode("utf-8"))
          manifest = publish.load_manifest(manifest_path, root)
          evidence = publish._validate_recovery_evidence(
              evidence,
              manifest_path,
              root,
              manifest,
              execution_head,
          )
          if evidence["phase"] != phase or evidence["state"] != state:
              raise SystemExit("BLOCK: credential-free evidence state differs")
          target = git("ls-remote", "--heads", "origin", target_ref).decode().split()
          if target != [commit, target_ref]:
              raise SystemExit("BLOCK: credential-free target ref differs")
          if state == "published":
              if target_ref != publication_ref or phase != "public_verified":
                  raise SystemExit("BLOCK: credential-free final target differs")
              recovery = git(
                  "ls-remote", "--heads", "origin", recovery_ref
              ).decode().split()
              expected_recovery = (
                  [parent, recovery_ref]
                  if os.environ["RECOVERY_PRESENT"] == "true"
                  else []
              )
              if recovery != expected_recovery:
                  raise SystemExit("BLOCK: credential-free recovery ref differs")
          else:
              if target_ref != recovery_ref or phase == "public_verified":
                  raise SystemExit("BLOCK: credential-free recovery target differs")
              publication = git(
                  "ls-remote", "--heads", "origin", publication_ref
              ).decode().split()
              if publication != [execution_head, publication_ref]:
                  raise SystemExit("BLOCK: credential-free publication ref differs")
          destination = Path(os.environ["GITHUB_OUTPUT"])
          with destination.open("a", encoding="utf-8", newline="\n") as handle:
              handle.write("verified=true\n")
              handle.write("receipt_commit=" + commit + "\n")
          print("VRTCORE_CREDENTIAL_FREE_RECEIPT=VALID")
          PY

      - name: Upload publication recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrtcore-zenodo-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: ignore
          path: |
            release/vrtcore-relational-h3-publication-2026-08-02/zenodo-publication.json
            release/vrtcore-smg-h5-publication-2026-08-02/zenodo-publication.json
            release/vrtcore-virtual-sphere-h6-publication-2026-08-02/zenodo-publication.json

      - name: Enforce publication and persistence result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test "$ALREADY_FINALIZED" = "true"; then
            test "${{ steps.finalized.outputs.finalized }}" = "true"
            test "${{ steps.finalized.outputs.phase }}" = "public_verified"
            test "${{ steps.finalized.outputs.state }}" = "published"
            [[ "${{ steps.finalized.outputs.receipt_commit }}" =~ ^[0-9a-f]{40}$ ]]
            test -z "${{ steps.publish.outputs.status }}"
            test -z "${{ steps.push.outputs.receipt_commit }}"
          else
            test "$ALREADY_FINALIZED" = "false"
            test "${{ steps.publish.outputs.status }}" = "0"
            test "${{ steps.persist.outputs.prepared }}" = "true"
            test "${{ steps.persist.outputs.requires_push }}" = "true"
            test "${{ steps.persist.outputs.phase }}" = "public_verified"
            test "${{ steps.persist.outputs.state }}" = "published"
            test "${{ steps.push.outputs.persisted }}" = "true"
            test "${{ steps.verify_receipt.outputs.verified }}" = "true"
            test "${{ steps.verify_receipt.outputs.receipt_commit }}" = \
              "${{ steps.push.outputs.receipt_commit }}"
            [[ "${{ steps.push.outputs.receipt_commit }}" =~ ^[0-9a-f]{40}$ ]]
          fi
