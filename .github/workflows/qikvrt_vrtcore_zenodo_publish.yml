                  current_identity = (evidence.get("record_id"), evidence.get("doi"))
                  if record_identity is None:
                      record_identity = current_identity
                  elif current_identity != record_identity:
                      raise SystemExit("BLOCK: recovery record identity changes")
          print("VRTCORE_RECOVERY_CHAIN=VALID")
          PY
          test "$(
            git ls-remote --heads origin "$RECOVERY_REF" |
