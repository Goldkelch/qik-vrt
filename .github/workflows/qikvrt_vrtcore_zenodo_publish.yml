name: Publish one causally ordered VRTCore stage to Zenodo

on:
  push:
    branches:
      - publication/vrtcore-relational-h3-v1
      - publication/vrtcore-smg-h5-v1
      - publication/vrtcore-virtual-sphere-h6-v1
    paths:
      - .github/workflows/qikvrt_vrtcore_zenodo_publish.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-vrtcore-causal-zenodo-publication-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: cdb0e9fe8444565df665affa64463295648b1368
      ZENODO_API_BASE: https://zenodo.org/api
    steps:
      - name: Check out exact execution head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable branch profile
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import re

          from tools import qikvrt_vrtcore_zenodo_publication_controls as controls

          branch_to_profile = {
              "publication/vrtcore-relational-h3-v1": "h3",
              "publication/vrtcore-smg-h5-v1": "h5",
              "publication/vrtcore-virtual-sphere-h6-v1": "h6",
          }
          branch = os.environ.get("GITHUB_REF_NAME")
          profile_name = branch_to_profile.get(branch)
          if profile_name is None:
              raise SystemExit("BLOCK: executing branch has no immutable profile")
          profile = controls.PROFILES[profile_name]
          control = str(profile["control"])
          execution_head = os.environ.get("GITHUB_SHA", "")
          if re.fullmatch(r"[0-9a-f]{40}", execution_head) is None:
              raise SystemExit("BLOCK: execution head is not an exact commit")
          recovery_branch = (
              "qikvrt-recovery/vrtcore-zenodo/"
              + profile_name
              + "/"
              + execution_head
          )
          values = {
              "PROFILE": profile_name,
              "MANIFEST_PATH": control + "/publish-request.json",
              "EVIDENCE_PATH": control + "/zenodo-publication.json",
              "RECOVERY_BRANCH": recovery_branch,
              "RECOVERY_REF": "refs/heads/" + recovery_branch,
          }
          destination = Path(os.environ["GITHUB_ENV"])
          with destination.open("a", encoding="utf-8", newline="\n") as handle:
              for key, value in values.items():
                  if not value or "\n" in value or "\r" in value:
                      raise SystemExit("BLOCK: unsafe immutable profile value")
                  handle.write(f"{key}={value}\n")
          print("VRTCORE_BRANCH_PROFILE=VALID")
          PY

      - name: Detect and verify an already finalized publication
        id: finalized
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"
          python3 -B tools/qikvrt_integrity.py verify
          publication_ref="refs/heads/$GITHUB_REF_NAME"
          publication_listing="$(git ls-remote --heads origin "$publication_ref")"
          read -r publication_head observed_publication_ref trailing \
            <<< "$publication_listing"
          test -z "${trailing:-}"
          [[ "$publication_head" =~ ^[0-9a-f]{40}$ ]]
          test "$observed_publication_ref" = "$publication_ref"
          if test "$publication_head" = "$GITHUB_SHA"; then
            printf '%s\n' 'ALREADY_FINALIZED=false' >> "$GITHUB_ENV"
            printf '%s\n' 'finalized=false' >> "$GITHUB_OUTPUT"
            printf 'receipt_commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$publication_ref"
          test "$(git rev-parse --verify FETCH_HEAD^{commit})" = \
            "$publication_head"
          recovery_listing="$(git ls-remote --heads origin "$RECOVERY_REF")"
          recovery_head=
          if test -n "$recovery_listing"; then
            read -r recovery_head observed_recovery_ref trailing \
              <<< "$recovery_listing"
            test -z "${trailing:-}"
            [[ "$recovery_head" =~ ^[0-9a-f]{40}$ ]]
            test "$observed_recovery_ref" = "$RECOVERY_REF"
            git fetch --no-tags origin "$RECOVERY_REF"
            test "$(git rev-parse --verify FETCH_HEAD^{commit})" = \
              "$recovery_head"
          fi
          MANIFEST_PATH="$MANIFEST_PATH" \
          EVIDENCE_PATH="$EVIDENCE_PATH" \
          EXECUTION_HEAD="$GITHUB_SHA" \
          FINAL_HEAD="$publication_head" \
          RECOVERY_HEAD="$recovery_head" \
          python3 -B - <<'PY'
          import copy
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.parse
          import urllib.request

          from tools import qikvrt_integrity as integrity
          from tools import qikvrt_zenodo_publish as publish

          root = Path.cwd().resolve()
          manifest_path = root / os.environ["MANIFEST_PATH"]
          evidence_relative = os.environ["EVIDENCE_PATH"]
          execution_head = os.environ["EXECUTION_HEAD"]
          final_head = os.environ["FINAL_HEAD"]
          recovery_head = os.environ["RECOVERY_HEAD"]
          manifest = publish.load_manifest(manifest_path, root)
          base_integrity = json.loads(
              (root / "REPOSITORY_FILE_MANIFEST.json").read_text(encoding="utf-8")
          )
          receipt_paths = {
              "REPOSITORY_FILE_MANIFEST.json",
              "REPOSITORY_FILE_MANIFEST.json.sha256",
              "SHA256SUMS.txt",
              evidence_relative,
          }

          def git(*arguments: str, accepted: set[int] | None = None) -> bytes:
              result = subprocess.run(
                  ["git", *arguments],
                  cwd=root,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              allowed = {0} if accepted is None else accepted
              if result.returncode not in allowed:
                  raise SystemExit("BLOCK: finalized-state Git validation failed")
              return result.stdout

          def validate_modes_and_integrity(
              commit: str,
              evidence_raw: bytes,
          ) -> None:
              observed_modes: dict[str, tuple[str, str]] = {}
              for entry in git(
                  "ls-tree", "-z", commit, "--", *sorted(receipt_paths)
              ).split(b"\0"):
                  if not entry:
                      continue
                  metadata, raw_path = entry.split(b"\t", 1)
                  mode, object_type, _object_id = metadata.decode("ascii").split()
                  observed_modes[raw_path.decode("utf-8")] = (mode, object_type)
              if observed_modes != {
                  path: ("100644", "blob") for path in receipt_paths
              }:
                  raise SystemExit("BLOCK: finalized receipt path mode differs")

              evidence_entry = {
                  "path": evidence_relative,
                  "classification": "repository_content",
                  "immutable": True,
                  "excluded_from_sha256_index": False,
                  "bytes": len(evidence_raw),
                  "sha256": hashlib.sha256(evidence_raw).hexdigest(),
                  "file_type": "regular",
              }
              base_entries = base_integrity.get("files")
              if not isinstance(base_entries, list) or any(
                  entry.get("path") == evidence_relative for entry in base_entries
              ):
                  raise SystemExit("BLOCK: finalized integrity base differs")
              expected_manifest = copy.deepcopy(base_integrity)
              entries = sorted(
                  [*base_entries, evidence_entry],
                  key=lambda entry: entry["path"],
              )
              expected_manifest["files"] = entries
              expected_manifest["file_count"] = len(entries)
              expected_manifest["immutable_file_count"] = sum(
                  entry.get("immutable") is True for entry in entries
              )
              expected_manifest["excluded_file_count"] = (
                  len(entries) - expected_manifest["immutable_file_count"]
              )
              expected_manifest["repository_content_tree_sha256"] = (
                  integrity._content_tree_sha256(entries)
              )
              expected_manifest_raw = (
                  json.dumps(
                      expected_manifest,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n"
              ).encode("utf-8")
              if (
                  git("show", f"{commit}:REPOSITORY_FILE_MANIFEST.json")
                  != expected_manifest_raw
              ):
                  raise SystemExit("BLOCK: finalized integrity manifest differs")
              expected_index = "".join(
                  f"{entry['sha256']}  {entry['path']}\n"
                  for entry in entries
                  if entry.get("immutable") is True
              ).encode("utf-8")
              if git("show", f"{commit}:SHA256SUMS.txt") != expected_index:
                  raise SystemExit("BLOCK: finalized SHA256 index differs")
              expected_detached = (
                  hashlib.sha256(expected_manifest_raw).hexdigest()
                  + "  REPOSITORY_FILE_MANIFEST.json\n"
              ).encode("ascii")
              if (
                  git(
                      "show",
                      f"{commit}:REPOSITORY_FILE_MANIFEST.json.sha256",
                  )
                  != expected_detached
              ):
                  raise SystemExit("BLOCK: finalized detached digest differs")

          def receipt_at(commit: str, *, public: bool) -> dict[str, object]:
              try:
                  evidence_raw = git("show", f"{commit}:{evidence_relative}")
                  evidence = json.loads(evidence_raw.decode("utf-8"))
              except (UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit("BLOCK: finalized receipt JSON differs") from exc
              evidence = publish._validate_recovery_evidence(
                  evidence,
                  manifest_path,
                  root,
                  manifest,
                  execution_head,
              )
              if public:
                  if (
                      evidence["phase"] != "public_verified"
                      or evidence["state"] != "published"
                      or evidence["recovery"]["public_verified"] is not True
                  ):
                      raise SystemExit("BLOCK: final receipt is not public_verified")
              elif (
                  evidence["state"] != publish.CONSUMPTION_STATE
                  or evidence["phase"] == "public_verified"
                  or evidence["recovery"]["remote_state_requires_reconciliation"]
                  is not True
              ):
                  raise SystemExit("BLOCK: recovery ref contains public evidence")
              validate_modes_and_integrity(commit, evidence_raw)
              return evidence

          recovery_chain: list[dict[str, object]] = []
          if recovery_head:
              cursor = recovery_head
              reverse_chain: list[dict[str, object]] = []
              visited: set[str] = set()
              while cursor != execution_head:
                  if (
                      cursor in visited
                      or len(visited) >= len(publish.RECOVERY_PHASES) - 1
                  ):
                      raise SystemExit("BLOCK: finalized recovery chain is unbounded")
                  visited.add(cursor)
                  parents = git("show", "-s", "--format=%P", cursor).decode().split()
                  if len(parents) != 1:
                      raise SystemExit("BLOCK: finalized recovery commit has wrong parent")
                  parent = parents[0]
                  observed = {}
                  for line in git(
                      "diff",
                      "--name-status",
                      "--no-renames",
                      parent,
                      cursor,
                      "--",
                  ).decode().splitlines():
                      status, path = line.split("\t", 1)
                      observed[path] = status
                  expected = {
                      "REPOSITORY_FILE_MANIFEST.json": "M",
                      "REPOSITORY_FILE_MANIFEST.json.sha256": "M",
                      "SHA256SUMS.txt": "M",
                      evidence_relative: "A" if parent == execution_head else "M",
                  }
                  if observed != expected:
                      raise SystemExit("BLOCK: finalized recovery delta differs")
                  reverse_chain.append(receipt_at(cursor, public=False))
                  cursor = parent
              if not visited:
                  raise SystemExit("BLOCK: finalized recovery ref is empty")
              recovery_chain = list(reversed(reverse_chain))
              positions = [
                  publish.RECOVERY_PHASES.index(str(item["phase"]))
                  for item in recovery_chain
              ]
              if any(
                  left >= right for left, right in zip(positions, positions[1:])
              ):
                  raise SystemExit("BLOCK: finalized recovery phases regress")
              remote_consumption = recovery_chain[0]["remote_consumption"]
              record_identity: tuple[object, object] | None = None
              for item in recovery_chain:
                  if item["remote_consumption"] != remote_consumption:
                      raise SystemExit("BLOCK: finalized consumption identity changes")
                  if "record_id" in item or "doi" in item:
                      current = (item.get("record_id"), item.get("doi"))
                      if record_identity is None:
                          record_identity = current
                      elif current != record_identity:
                          raise SystemExit("BLOCK: finalized record identity changes")

          parents = git("show", "-s", "--format=%P", final_head).decode().split()
          expected_parent = recovery_head or execution_head
          if parents != [expected_parent]:
              raise SystemExit("BLOCK: final receipt parent differs")
          observed_final = {}
          for line in git(
              "diff",
              "--name-status",
              "--no-renames",
              expected_parent,
              final_head,
              "--",
          ).decode().splitlines():
              status, path = line.split("\t", 1)
              observed_final[path] = status
          expected_final = {
              "REPOSITORY_FILE_MANIFEST.json": "M",
              "REPOSITORY_FILE_MANIFEST.json.sha256": "M",
              "SHA256SUMS.txt": "M",
              evidence_relative: "A" if expected_parent == execution_head else "M",
          }
          if observed_final != expected_final:
              raise SystemExit("BLOCK: final receipt delta differs")
          final_evidence = receipt_at(final_head, public=True)
          if recovery_chain:
              previous = recovery_chain[-1]
              if (
                  final_evidence["remote_consumption"]
                  != previous["remote_consumption"]
                  or publish.RECOVERY_PHASES.index(str(final_evidence["phase"]))
                  <= publish.RECOVERY_PHASES.index(str(previous["phase"]))
                  or (
                      "record_id" in previous
                      and (
                          final_evidence.get("record_id") != previous.get("record_id")
                          or final_evidence.get("doi") != previous.get("doi")
                      )
                  )
              ):
                  raise SystemExit("BLOCK: final receipt diverges from recovery tip")

          consumption = final_evidence["remote_consumption"]
          consumption_ref = str(consumption["ref"])
          remote_consumption = git(
              "ls-remote",
              "--exit-code",
              "--refs",
              "origin",
              consumption_ref,
          ).decode("utf-8").split()
          if remote_consumption != [consumption["tag_object"], consumption_ref]:
              raise SystemExit("BLOCK: final remote consumption ref differs")

          record_id = final_evidence["record_id"]
          api_url = f"https://zenodo.org/api/records/{record_id}"
          request = urllib.request.Request(
              api_url,
              method="GET",
              headers={
                  "Accept": "application/json",
                  "User-Agent": "qikvrt-finalized-verifier/1",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              final_url = urllib.parse.urlsplit(response.geturl())
              public_raw = response.read(16 * 1024 * 1024 + 1)
          if (
              final_url.scheme != "https"
              or final_url.hostname != "zenodo.org"
              or final_url.path != f"/api/records/{record_id}"
              or final_url.query
              or final_url.fragment
              or len(public_raw) > 16 * 1024 * 1024
          ):
              raise SystemExit("BLOCK: final public record response differs")
          public_record = json.loads(public_raw.decode("utf-8"))
          metadata = public_record.get("metadata")
          if (
              publish.zenodo._record_id(public_record, "final public record")
              != record_id
              or publish.zenodo._doi_from_deposition(
                  public_record, "final public record"
              )
              != final_evidence["doi"]
              or not publish.zenodo._published_metadata_matches(
                  metadata,
                  manifest["metadata"],
              )
          ):
              raise SystemExit("BLOCK: final public record identity differs")
          conceptdoi = public_record.get("conceptdoi") or (
              metadata.get("conceptdoi") if isinstance(metadata, dict) else None
          )
          if conceptdoi != final_evidence["conceptdoi"]:
              raise SystemExit("BLOCK: final public concept DOI differs")
          public_files = public_record.get("files")
          if not isinstance(public_files, list):
              raise SystemExit("BLOCK: final public file inventory is absent")
          by_name = {}
          for item in public_files:
              if not isinstance(item, dict):
                  raise SystemExit("BLOCK: final public file entry differs")
              name = item.get("key", item.get("filename"))
              if not isinstance(name, str) or not name or name in by_name:
                  raise SystemExit("BLOCK: final public file name differs")
              by_name[name] = item
          expected_by_name = {entry["name"]: entry for entry in manifest["files"]}
          if set(by_name) != set(expected_by_name):
              raise SystemExit("BLOCK: final public file set differs")
          for name, expected in expected_by_name.items():
              observed = by_name[name]
              size = observed.get("filesize", observed.get("size"))
              if isinstance(size, str) and size.isdecimal():
                  size = int(size)
              if (
                  size != expected["size"]
                  or observed.get("checksum")
                  not in {expected["md5"], "md5:" + expected["md5"]}
              ):
                  raise SystemExit("BLOCK: final public file identity differs")
          print("VRTCORE_ALREADY_FINALIZED=VALID")
          PY
          test "$(
            git ls-remote --heads origin "$publication_ref" |
              awk 'NR == 1 { print $1 }'
          )" = "$publication_head"
          if test -n "$recovery_head"; then
            test "$(
              git ls-remote --heads origin "$RECOVERY_REF" |
                awk 'NR == 1 { print $1 }'
            )" = "$recovery_head"
          else
            test -z "$(git ls-remote --heads origin "$RECOVERY_REF")"
          fi
          git show "$publication_head:$EVIDENCE_PATH" > "$EVIDENCE_PATH"
          test "$(git hash-object "$EVIDENCE_PATH")" = \
            "$(git rev-parse --verify "$publication_head:$EVIDENCE_PATH")"
          test "$(git status --porcelain=v1 --untracked-files=all)" = \
            "?? $EVIDENCE_PATH"
          printf '%s\n' 'ALREADY_FINALIZED=true' >> "$GITHUB_ENV"
          printf '%s\n' 'finalized=true' >> "$GITHUB_OUTPUT"
          printf '%s\n' 'phase=public_verified' >> "$GITHUB_OUTPUT"
          printf '%s\n' 'state=published' >> "$GITHUB_OUTPUT"
          printf 'receipt_commit=%s\n' "$publication_head" >> "$GITHUB_OUTPUT"

      - name: Verify exact causal one-shot boundary
        if: env.ALREADY_FINALIZED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_PARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'BLOCK: EXPECTED_PARENT placeholder is unresolved' >&2
            exit 2
          fi
          test "$GITHUB_REF" = "refs/heads/$GITHUB_REF_NAME"
          test "$(git rev-parse --verify HEAD^{commit})" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse --verify "$EXPECTED_PARENT^{commit}")" = "$EXPECTED_PARENT"
          test ! -e "$EVIDENCE_PATH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          case "$PROFILE" in
            h3)
              expected_delta="$(
                printf '%s\n' \
                  'A	.github/workflows/qikvrt_vrtcore_zenodo_publish.yml' \
                  'M	REPOSITORY_FILE_MANIFEST.json' \
                  'M	REPOSITORY_FILE_MANIFEST.json.sha256' \
                  'M	SHA256SUMS.txt' \
                  'M	tests/test_vrtcore_zenodo_publication_controls.py'
              )"
              ;;
            h5|h6)
              expected_delta="$(
                printf '%s\n' \
                  'M	.github/workflows/qikvrt_vrtcore_zenodo_publish.yml' \
                  'M	REPOSITORY_FILE_MANIFEST.json' \
                  'M	REPOSITORY_FILE_MANIFEST.json.sha256' \
                  'M	SHA256SUMS.txt'
              )"
              ;;
            *)
              printf '%s\n' 'BLOCK: unresolved VRTCore profile' >&2
              exit 2
              ;;
          esac
          observed_delta="$(
            git diff \
              --name-status \
              --no-renames \
              "$EXPECTED_PARENT" \
              "$GITHUB_SHA" \
              --
          )"
          test "$observed_delta" = "$expected_delta"

          main_head="$(
            git ls-remote --heads origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          test "$main_head" = "$EXPECTED_PARENT"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$GITHUB_REF_NAME" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head" = "$GITHUB_SHA"

          python3 -B tools/qikvrt_vrtcore_zenodo_publication_controls.py --check
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          GITHUB_SHA="$GITHUB_SHA" \
          PROFILE="$PROFILE" \
          MANIFEST_PATH="$MANIFEST_PATH" \
          python3 -B - <<'PY'
          import os
          from pathlib import Path

          from tools import qikvrt_vrtcore_zenodo_publication_controls as controls
          from tools import qikvrt_zenodo_publish as publish

          root = Path.cwd().resolve()
          profile = controls.PROFILES[os.environ["PROFILE"]]
          manifest_path = root / os.environ["MANIFEST_PATH"]
          manifest = publish.load_manifest(manifest_path, root)
          execution_head = publish._validate_repository_source_head(
              root,
              manifest_path,
              manifest,
          )
          publish._validate_origin_repository(root, manifest["repository"])
          if execution_head != os.environ["GITHUB_SHA"]:
              raise SystemExit("BLOCK: normalized execution head differs")
          if len(manifest["files"]) != profile["upload_count"]:
              raise SystemExit("BLOCK: exact Zenodo upload count differs")
          authorization = manifest["owner_authorization"]
          if authorization["authorization_id"] != profile["authorization_id"]:
              raise SystemExit("BLOCK: exact authorization ID differs")
          if authorization["publication_id"] != profile["publication_id"]:
              raise SystemExit("BLOCK: exact publication ID differs")
          print("VRTCORE_ZENODO_EXECUTION_PREFLIGHT=VALID")
          PY
          python3 -B tools/qikvrt_integrity.py verify

      - name: Verify causally prior receipts in merged main parent
        if: env.ALREADY_FINALIZED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="$PROFILE" EXPECTED_PARENT="$EXPECTED_PARENT" python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          from tools import qikvrt_vrtcore_zenodo_publication_controls as controls
          from tools import qikvrt_zenodo_publish as publish

          root = Path.cwd().resolve()
          required = {
              "h3": (),
              "h5": ("h3",),
              "h6": ("h3", "h5"),
          }[os.environ["PROFILE"]]
          parent = os.environ["EXPECTED_PARENT"]

          def git(*arguments: str, check: bool = True) -> subprocess.CompletedProcess[bytes]:
              result = subprocess.run(
                  ["git", *arguments],
                  cwd=root,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if check and result.returncode != 0:
                  raise SystemExit("BLOCK: predecessor Git gate failed")
              return result

          for predecessor in required:
              profile = controls.PROFILES[predecessor]
              control = str(profile["control"])
              manifest_relative = control + "/publish-request.json"
              evidence_relative = control + "/zenodo-publication.json"
              evidence_path = root / evidence_relative
              if (
                  not evidence_path.is_file()
                  or evidence_path.is_symlink()
                  or git("cat-file", "-e", f"{parent}:{evidence_relative}", check=False).returncode != 0
              ):
                  raise SystemExit(
                      "BLOCK: causally prior published receipt is absent from main parent"
                  )
              parent_bytes = git("show", f"{parent}:{evidence_relative}").stdout
              current_bytes = evidence_path.read_bytes()
              if parent_bytes != current_bytes:
                  raise SystemExit("BLOCK: predecessor receipt differs from main parent")
              try:
                  evidence = json.loads(current_bytes.decode("utf-8"))
              except (UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit("BLOCK: predecessor receipt is invalid JSON") from exc
              manifest_path = root / manifest_relative
              manifest = publish.load_manifest(manifest_path, root)
              manifest_raw = manifest_path.read_bytes()
              execution_head = evidence.get("repository_commit")
              if evidence.get("schema") == publish.EVIDENCE_SCHEMA:
                  raise SystemExit(
                      "BLOCK: causally prior receipt uses immutable legacy v1 evidence"
                  )
              if (
                  evidence.get("schema") != publish.EVIDENCE_SCHEMA_V2
                  or evidence.get("phase") != "public_verified"
                  or evidence.get("state") != "published"
                  or evidence.get("repository") != controls.REPOSITORY
                  or evidence.get("manifest_path") != manifest_relative
                  or evidence.get("manifest_sha256")
                  != hashlib.sha256(manifest_raw).hexdigest()
                  or evidence.get("owner_authorization")
                  != manifest["owner_authorization"]
                  or evidence.get("machine_proof") != manifest["machine_proof"]
                  or evidence.get("files") != manifest["files"]
                  or evidence.get("title") != manifest["metadata"]["title"]
                  or evidence.get("version") != manifest["metadata"]["version"]
                  or not isinstance(execution_head, str)
