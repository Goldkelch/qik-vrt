# Execution-only #1075 authoring carrier. Removed from the resulting candidate.
name: QIKVRT issue1075 exact-source repair
on:
  push:
    branches: [agent/issue1075-active-writer-history-independent-v1]
permissions:
  contents: read
concurrency:
  group: qikvrt-issue1075-bound-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Goldkelch/qik-vrt' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tree: ${{ steps.delta.outputs.tree }}
      digest: ${{ steps.delta.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce, repair and validate without a write credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B .qikvrt-issue1075-apply.py
          git rm .qikvrt-issue1075-apply.py .qikvrt-issue1075-function.py .qikvrt-issue1075-tests.py .github/workflows/qikvrt_issue1075_bound_repair.yml
          git add tools/qikvrt_requested_review_executor.py tests/test_qikvrt_requested_review_executor.py
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest -v tests.test_qikvrt_requested_review_executor tests.test_qikvrt_review_control_plane_root_fix
          python3 -B tools/qikvrt_integrity.py verify
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
      - name: Seal the bounded candidate delta
        id: delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --check
          mkdir -p "$RUNNER_TEMP/issue1075-delta"
          git diff --cached --binary --full-index "$GITHUB_SHA" -- > "$RUNNER_TEMP/issue1075-delta/repair.patch"
          test "$(wc -c < "$RUNNER_TEMP/issue1075-delta/repair.patch")" -lt 4194304
          printf 'tree=%s\n' "$(git write-tree)" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$(sha256sum "$RUNNER_TEMP/issue1075-delta/repair.patch" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue1075-exact-source-delta
          path: ${{ runner.temp }}/issue1075-delta/repair.patch
          if-no-files-found: error
          retention-days: 7
  persist:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify artifact and exact tree without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Goldkelch/qik-vrt
          test "$GITHUB_REF" = refs/heads/agent/issue1075-active-writer-history-independent-v1
          test "$(git rev-parse HEAD^)" = cc3aa741f7721157763a0c5a67965deb15c5acbd
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name issue1075-exact-source-delta --dir "$RUNNER_TEMP/issue1075-delta"
          test "$(sha256sum "$RUNNER_TEMP/issue1075-delta/repair.patch" | cut -d' ' -f1)" = "$EXPECTED_DIGEST"
          git apply --index --binary "$RUNNER_TEMP/issue1075-delta/repair.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python3 - <<'PY'
          import subprocess
          allowed = {'tools/qikvrt_requested_review_executor.py', 'tests/test_qikvrt_requested_review_executor.py', 'REPOSITORY_FILE_MANIFEST.json', 'REPOSITORY_FILE_MANIFEST.json.sha256', 'SHA256SUMS.txt', '.qikvrt-issue1075-apply.py', '.qikvrt-issue1075-function.py', '.qikvrt-issue1075-tests.py', '.github/workflows/qikvrt_issue1075_bound_repair.yml'}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0'))
          assert changed <= allowed and {'tools/qikvrt_requested_review_executor.py', 'tests/test_qikvrt_requested_review_executor.py'} <= changed
          PY
          test "$(gh api repos/Goldkelch/qik-vrt/git/ref/heads/agent/issue1075-active-writer-history-independent-v1 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/Goldkelch/qik-vrt/git/ref/heads/agent/autonomy-root-cause-self-clean-v3 --jq .object.sha)" = cc3aa741f7721157763a0c5a67965deb15c5acbd
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(review): observe bounded active states independently of history (#1075)'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$GITHUB_REF"
          new_head="$(git rev-parse HEAD)"
          test "$(gh api repos/Goldkelch/qik-vrt/git/ref/heads/agent/issue1075-active-writer-history-independent-v1 --jq .object.sha)" = "$new_head"
          printf 'CANDIDATE_HEAD=%s\nCANDIDATE_TREE=%s\nP2_FRESH_HEAD_REQUIRED=true\n' "$new_head" "$EXPECTED_TREE" | tee -a "$GITHUB_STEP_SUMMARY"
